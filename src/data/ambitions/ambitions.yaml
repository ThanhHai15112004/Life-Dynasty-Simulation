# [1] Tham vọng cả đời & các mốc phụ (GDD 01 §6): la bàn mềm dẫn dắt cuộc đời người chơi
ambitions:
  - id: gia_dinh_am_em
    name: Gia đình ấm êm
    description: Xây một mái ấm yên bình, vợ chồng hòa thuận, con cái khỏe mạnh nối dõi tông đường.
    icon: nha
    traits: [trong_gia_dinh, an_phan, nhan_tu]
    milestones:
      - id: thanh_gia
        name: Nên duyên vợ chồng
        condition: { var: player.married, op: '==', value: true }
        stress_relief: 6
        satisfaction_bonus: 8
      - id: con_dau_long
        name: Đón đứa con đầu lòng
        condition: { var: player.children_count, op: '>=', value: 1 }
        stress_relief: 6
        satisfaction_bonus: 10
      - id: sum_vay_no_du
        name: Đông con cái và kho thóc đủ ăn
        condition:
          all:
            - { var: player.children_count, op: '>=', value: 2 }
            - { var: household.debt, op: '==', value: 0 }
            - { var: household.food_months, op: '>=', value: 4 }
        stress_relief: 8
        satisfaction_bonus: 14

  - id: ruong_co_trau_day
    name: Ruộng cò bay thẳng cánh
    description: Vươn lên từ hai bàn tay trắng, gây dựng cơ ngơi ruộng vườn, trâu cày và mái nhà gỗ vững chãi.
    icon: ruong
    traits: [tham_vong, kien_nhan, tham_lam]
    milestones:
      - id: sach_no_du_an
        name: Sạch nợ và tích được 25 quan
        condition:
          all:
            - { var: household.debt, op: '==', value: 0 }
            - { var: household.money, op: '>=', value: 25 }
        stress_relief: 5
        satisfaction_bonus: 8
      - id: tau_trau_them_ruong
        name: Có trâu cày và từ 7 sào ruộng trở lên
        condition:
          all:
            - { has_property: trau }
            - { var: household.farmland, op: '>=', value: 7 }
        stress_relief: 7
        satisfaction_bonus: 12
      - id: nha_go_sung_tuc
        name: Dựng nhà gỗ ba gian, sống đời sung túc
        condition:
          all:
            - { has_property: nha_go }
            - { var: household.farmland, op: '>=', value: 10 }
        stress_relief: 10
        satisfaction_bonus: 16

  - id: tieng_thom_trong_lang
    name: Tiếng thơm trong làng
    description: Ăn ở có trước có sau, cứu giúp người ngặt nghèo để cả làng kính trọng.
    icon: lang
    traits: [hao_phong, nhan_tu, trung_thanh]
    milestones:
      - id: duoc_long_xom_gieng
        name: Có tiếng tốt trong thôn xóm
        condition: { var: player.reputation, op: '>=', value: 12 }
        stress_relief: 5
        satisfaction_bonus: 8
      - id: tai_ung_xu
        name: Tài ăn nói, thu xếp việc làng (Ngoại giao bậc 4)
        condition: { var: player.skill.ngoai_giao, op: '>=', value: 4 }
        stress_relief: 6
        satisfaction_bonus: 10
      - id: danh_tieng_vang_xa
        name: Được cả làng vị nể, trọng vọng
        condition:
          all:
            - { var: player.reputation, op: '>=', value: 30 }
            - { var: household.debt, op: '==', value: 0 }
        stress_relief: 8
        satisfaction_bonus: 14

  - id: hay_chu_biet_nghia
    name: Hay chữ biết nghĩa
    description: Dùi mài kinh sử, thông hiểu chữ nghĩa và đạo lý giữa chốn quê nghèo.
    icon: sach
    traits: [kien_nhan, hoai_nghi, tu_do]
    milestones:
      - id: biet_doc_biet_viet
        name: Thông mặt chữ (Học vấn bậc 3)
        condition: { var: player.skill.hoc_van, op: '>=', value: 3 }
        stress_relief: 5
        satisfaction_bonus: 8
      - id: thong_su_ly
        name: Hiểu rộng biết nhiều (Học vấn bậc 6)
        condition: { var: player.skill.hoc_van, op: '>=', value: 6 }
        stress_relief: 7
        satisfaction_bonus: 12
      - id: bac_thay_lang_que
        name: Bậc thức giả trong vùng (Học vấn bậc 8 & Quản trị bậc 4)
        condition:
          all:
            - { var: player.skill.hoc_van, op: '>=', value: 8 }
            - { var: player.skill.quan_tri, op: '>=', value: 4 }
        stress_relief: 10
        satisfaction_bonus: 16

  # ── Chí hướng theo xuất thân (hình thành ở sự kiện trưởng thành) ──
  - id: khoa_bang_vinh_quy
    name: Bảng vàng vinh quy
    description: Lều chõng đi thi, đỗ đạt làm rạng danh tổ tông, được ngồi chiếu trên nơi đình trung.
    icon: sach
    traits: [kien_nhan, tham_vong]
    milestones:
      - id: do_sinh_do
        name: Đỗ Sinh đồ
        condition: { var: player.exam_degree, op: 'in', value: [sinh_do, huong_cong, tien_si] }
        stress_relief: 6
        satisfaction_bonus: 10
      - id: do_huong_cong
        name: Đỗ Hương cống
        condition: { var: player.exam_degree, op: 'in', value: [huong_cong, tien_si] }
        stress_relief: 8
        satisfaction_bonus: 14
      - id: lam_quan
        name: Đỗ Tiến sĩ hoặc được bổ làm quan
        condition:
          any:
            - { var: player.exam_degree, op: '==', value: tien_si }
            - { var: player.status_rank, op: '==', value: quan_lai }
        stress_relief: 12
        satisfaction_bonus: 20

  - id: phu_thuong_mot_vung
    name: Giàu nức một vùng
    description: Từ gánh hàng rong thành nhà buôn có tiếng, thuyền hàng xuôi ngược, tiền của đầy kho.
    icon: tien
    traits: [tham_vong, tham_lam, co_hoi]
    milestones:
      - id: von_lieng_dau_tien
        name: Sạch nợ và có 40 quan vốn
        condition:
          all:
            - { var: household.debt, op: '<=', value: 0 }
            - { var: household.money, op: '>=', value: 40 }
        stress_relief: 5
        satisfaction_bonus: 8
      - id: phu_ho_trong_vung
        name: Được xếp vào hàng phú hộ
        condition: { var: player.status_rank, op: 'in', value: [phu_ho, si_phu, quan_lai] }
        stress_relief: 7
        satisfaction_bonus: 12
      - id: co_nghiep_lon
        name: Cơ nghiệp trên 600 quan
        condition: { var: household.net_worth, op: '>=', value: 600 }
        stress_relief: 10
        satisfaction_bonus: 18

  - id: cong_danh_tran_mac
    name: Công danh nơi trận mạc
    description: Khoác áo chiến, lập công nơi biên ải, từ binh đinh lên tướng lĩnh.
    icon: kiem
    traits: [can_dam, trung_thanh, nong_nay]
    milestones:
      - id: vao_quan_ngu
        name: Khoác áo lính
        condition: { var: player.career, op: '==', value: linh }
        stress_relief: 4
        satisfaction_bonus: 6
      - id: len_doi_truong
        name: Lên bậc chỉ huy (bậc 2 trong quân)
        condition: { all: [{ var: player.career, op: '==', value: linh }, { var: player.career_rank, op: '>=', value: 2 }] }
        stress_relief: 8
        satisfaction_bonus: 14
      - id: thanh_tuong
        name: Thành tướng lĩnh
        condition: { all: [{ var: player.career, op: '==', value: linh }, { var: player.career_rank, op: '>=', value: 4 }] }
        stress_relief: 12
        satisfaction_bonus: 20

  - id: tron_dao_hieu
    name: Trọn đạo hiếu
    description: Phụng dưỡng cha mẹ, giữ nếp nhà, hương khói tổ tiên không bao giờ tắt.
    icon: gia_dinh
    traits: [trong_gia_dinh, trung_thanh, nhan_tu]
    milestones:
      - id: con_ngoan
        name: Hiếu đạo từ 80 trở lên
        condition: { var: player.filial_piety, op: '>=', value: 80 }
        stress_relief: 5
        satisfaction_bonus: 8
      - id: dung_vo_ga_chong_dung_le
        name: Thành gia đúng lễ, Hiếu đạo từ 85
        condition: { all: [{ var: player.married, op: '==', value: true }, { var: player.filial_piety, op: '>=', value: 85 }] }
        stress_relief: 7
        satisfaction_bonus: 12
      - id: noi_doi_tong_duong
        name: Con cháu nối dõi, Hiếu đạo từ 90
        condition: { all: [{ var: player.children_count, op: '>=', value: 2 }, { var: player.filial_piety, op: '>=', value: 90 }] }
        stress_relief: 10
        satisfaction_bonus: 18
