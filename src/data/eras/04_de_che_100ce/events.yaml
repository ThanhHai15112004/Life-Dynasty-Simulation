      - 'Một đoàn thương lữ lớn chở lụa là, thủy tinh La Mã, hương liệu và ngựa tốt đang dừng chân nghỉ ngơi tại trạm dịch. Các trưởng đoàn cần người thông thuộc địa hình hoặc hùn vốn cho chặng đường xuyên qua vùng biên viễn.'
