    kind: chuyen_vat
    life_stages:
      - au_tho
    condition:
      var: player.age
      op: between
      value:
        - 1
        - 2
    weight: 8
    once_per_life: true
    importance: 3
    tone: vui
    icon: tre_em
    variants:
      - Bạn chập chững những bước đầu tiên, cả nhà vỗ tay cười.
      - Bạn tập đi, ngã chổng vó giữa sân rồi lại lồm cồm bò dậy.
  - id: be_om_sot
    kind: bao_cao
    life_stages:
      - au_tho
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: buon
    icon: om
    variants:
      - Bạn lên cơn sốt mấy đêm liền, mẹ thức trắng chườm khăn.
      - Bạn quấy khóc vì mọc răng, sốt hầm hập cả tuần.
