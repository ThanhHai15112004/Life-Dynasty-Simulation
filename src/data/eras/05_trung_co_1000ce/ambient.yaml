# ══════════════════════════════════════════════════════════════════════════════
# MỐC 05: TRUNG ĐẠI THỊNH KỲ (1000 CN — trung_co_1000ce)
# Kho mẫu nhật ký đời thường (Ambient Life Logs) của Thời Trung Đại / Phong Kiến.
# ══════════════════════════════════════════════════════════════════════════════
templates:
