          - Ông lang huyện cho uống nước cháo muối từng thìa, đắp thuốc lên rốn, châm cứu hai đêm liền. Đến ngày thứ năm {role.con.call} gọi được "thầy u". Chuồng trâu trống, nhưng nhà có tiếng trẻ.
        failure_result:
          - Ông lang đến muộn nửa ngày. Bắt mạch xong ông chỉ lắc đầu, để lại mấy thang thuốc rồi lên ngựa. Con trâu đã bán, mà đứa trẻ thì cứ lả dần.
      - id: vay_moi_thay
        text: Vay bá hộ 25 quan mời ông lang huyện
        hint: Cứu con trước, nợ tính sau — nợ ấy lãi nặng
        effects:
          - type: add_disease
            disease: ta_ly
            who: con
          - type: debt
            value: 28
            ledger: thuoc_men
          - type: stress
            value: 12
        chance:
          base: 0.65
        success:
          - type: cure_disease
            disease: ta_ly
            who: con
          - type: health
            who: con
            value: 5
        failure:
          - type: health
            who: con
            value: -45
          - type: stress
            value: 20
        success_result:
          - Tiền vay đổi lấy mấy thang thuốc đắng nghét và năm đêm thức trắng. {role.con.call} qua cơn. Món nợ thì ở lại, ghi trong sổ nhà bá hộ.
        failure_result:
          - Thuốc quý cũng không giữ được. Tiền thì đã thành nợ, lãi chạy theo từng tháng.
      - id: thay_lang_lang
        text: Nhờ thầy lang trong làng, trả 6 quan tiền thuốc
        hint: Rẻ hơn, nhưng thầy làng chưa chắc đã quen bệnh dịch
        condition:
          var: household.money
          op: ">="
          value: 6
        effects:
          - type: add_disease
            disease: ta_ly
            who: con
          - type: money
            value: -6
            ledger: thuoc_men
          - type: stress
            value: 10
        chance:
          base: 0.4
        success:
          - type: cure_disease
            disease: ta_ly
            who: con
        failure:
          - type: health
            who: con
            value: -50
          - type: stress
            value: 22
        success_result:
          - Thầy lang làng sắc lá ổi, búp chè, gừng nướng, bắt uống cả đêm. Cơn đi ngoài thưa dần. Đứa trẻ sống, gầy như que củi.
        failure_result:
          - Thầy lang bốc thuốc cầm tiêu chảy, nhưng đứa trẻ không giữ nổi một ngụm nước. Thầy ngồi im ở hiên, không dám nhìn vào trong.
      - id: tu_chua_cach_ly
        text: Tự sắc nước cháo muối, cách ly con ở gian sau, tự tay chăm
        hint: Không tốn tiền, nhưng có thể chính mình lây bệnh
        effects:
          - type: add_disease
            disease: ta_ly
            who: con
          - type: health
            value: -10
          - type: stress
            value: 15
          - type: chance
            p: 0.4
            then:
              - type: add_disease
                disease: ta_ly
                who: player
            else: []
        chance:
          base: 0.3
          skill: sinh_ton
          per_level: 0.05
        success:
          - type: cure_disease
            disease: ta_ly
            who: con
          - type: opinion
            role: con
            value: 15
        failure:
          - type: health
            who: con
            value: -55
          - type: stress
            value: 20
        success_result:
          - Bảy ngày bạn không rời gian sau, từng thìa nước cháo đổ vào miệng con, từng tấm chiếu bẩn đem đốt. Ngày thứ tám, đứa trẻ khóc đòi ăn. Bạn ngồi sụp xuống, khóc theo.
        failure_result:
          - Bạn làm hết những gì biết, mà cái thân nhỏ cứ lạnh dần trong tay. Đêm ấy cả nhà thắp hương, không ai ngủ.
  - id: bn_chu_no_gan_con_gai
