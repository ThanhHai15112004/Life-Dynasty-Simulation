          - type: reputation
            group: dan_lang
            value: -2
          - type: stress
            value: -2
          - type: leave_household
            who: con
        result:
          - Đám cưới nhỏ bên bến đò. Người bến bảo nhà buôn mà gả con cho lái đò, nhưng {role.con.call} cười suốt buổi.
      - id: khat_lai
