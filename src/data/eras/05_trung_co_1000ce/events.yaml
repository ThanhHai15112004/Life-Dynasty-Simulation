          - Bạn buộc lại tay nải sách vở, tạm biệt quê nhà để lên thị trấn tìm trường lớn.
      - id: chuyen_ca_nha_ra_thi_tran
        text: Bàn với gia đình dời hẳn ra thị trấn để tiện đường học tập và làm ăn
        condition:
          all:
            - var: player.is_head
              op: ==
