      - id: ban_ca_cay
        text: Bán cả cây cho lái
        effects:
          - type: own_money
            value: 0.6
            ledger: tien_cong
        result:
          - Lái trèo lên hái sạch, để lại một quả to nhất "biếu nhà".
      - id: chia_hang_xom
        text: Bổ ra mời hàng xóm, biếu họ hàng
        default: true
        effects:
          - type: reputation
            group: dan_lang
            value: 2
        result:
          - Trẻ con cả xóm xúm quanh, tay chân dính nhựa mít.
  - id: cn2_tn_ho_hang_xin_viec
    title: Họ hàng xin gửi con
    tags:
      - gia_dinh
      - quan_he
    life_stages:
      - lap_nghiep
      - trung_nien
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: gia_dinh
    text:
      - Người em họ dưới quê lên, xin gửi thằng con ở nhờ phụ việc, học nghề. "Nó chịu khó lắm, anh chị cứ dạy bảo."
    options:
      - id: nhan
        text: Nhận cho ở, nuôi cơm dạy nghề
        effects:
          - type: food
            value: -3
          - type: filial_piety
            value: 2
          - type: stress
            value: 1
        result:
          - Thằng bé ít nói mà sáng dạ, chẳng mấy chốc đã làm được việc.
      - id: tu_choi
        text: Từ chối khéo, nhà cũng chật
        default: true
        result:
          - Người em họ buồn buồn ra về, dúi lại cho cháu một nắm kẹo.
  - id: cn2_g_chau_doc_tho
    title: Cháu đọc thơ
    tags:
      - gia_dinh
      - hoc_hanh
    life_stages:
      - tuoi_gia
    condition:
      var: player.children_count
      op: ">="
      value: 1
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: tre_em
    text:
      - Đứa cháu nhỏ đứng giữa sân, khoanh tay đọc bài thơ vừa học ở trường làng, giọng lanh lảnh.
    options:
      - id: thuong_tien
        text: Thưởng cho cháu mấy đồng
        condition:
          var: player.own_money
          op: ">="
          value: 0.1
        effects:
          - type: own_money
            value: -0.1
            ledger: mua_sam
          - type: stress
            value: -4
        result:
          - Cháu cầm tiền chạy vụt đi, bạn cười móm mém.
      - id: xoa_dau
        text: Xoa đầu khen giỏi
        default: true
        effects:
          - type: stress
            value: -2
        result:
          - Đứa cháu sung sướng đọc lại thêm hai lần nữa.
  - id: cn2_g_ruou_ban_gia
    title: Chén rượu với bạn già
    tags:
      - quan_he
    life_stages:
      - tuoi_gia
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: chen_tra
    text:
      - Ông bạn già cùng xóm mang sang be rượu nếp, hai người ngồi dưới giàn mướp ôn chuyện ngày xưa.
    options:
      - id: uong
        text: Rót mời, uống đến lúc trăng lên
        effects:
          - type: stress
            value: -4
          - type: health
            value: -1
        result:
          - Chuyện ngày đi phu, ngày cưới vợ, kể mãi vẫn chưa hết.
      - id: uong_che
        text: Pha ấm chè thay rượu
        default: true
        effects:
          - type: stress
            value: -2
        result:
          - Chè xanh đặc, chuyện cũ nhạt mà ấm.
  - id: cn2_g_lam_tho
    title: Mừng thọ
    tags:
      - gia_dinh
      - le_hoi
    life_stages:
      - tuoi_gia
    condition:
      var: player.age
      op: ">="
      value: 60
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 3
    icon: sinh_nhat
    text:
      - Con cháu bàn nhau làm lễ mừng thọ, mời cả họ đến chúc. Có đứa đòi mời phường bát âm cho to.
    options:
      - id: lam_to
        text: Làm to, mời phường bát âm
        condition:
          var: household.money
          op: ">="
          value: 3
        effects:
          - type: money
            value: -3
          - type: reputation
            group: dan_lang
            value: 4
          - type: stress
            value: -5
        result:
          - Tiếng đàn sáo rộn cả xóm. Ai đi qua cũng ghé vào chúc thọ.
      - id: lam_gon
        text: Làm gọn trong nhà, con cháu sum vầy là đủ
        default: true
        effects:
          - type: stress
            value: -3
        result:
          - Mâm cỗ nhỏ mà ấm. Bạn nhìn con cháu quây quần, thấy đời đã đủ.
  - id: cn2_g_ke_chuyen_xua
    title: Lũ trẻ đòi nghe chuyện
    tags:
      - lang_xa
    life_stages:
      - tuoi_gia
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 1
    icon: ky_uc
    text:
      - Chiều mát, lũ trẻ trong xóm kéo đến hiên nhà, đòi nghe kể chuyện ngày xưa.
    options:
      - id: ke
        text: Kể chuyện thời trẻ của mình
        effects:
          - type: reputation
            group: dan_lang
            value: 1
          - type: stress
            value: -2
        result:
          - Lũ trẻ há hốc miệng nghe. Bạn kể thêm thắt một chút cho hay.
      - id: ke_co_tich
        text: Kể chuyện Tấm Cám
        default: true
        effects:
          - type: stress
            value: -1
        result:
          - Đến đoạn bống bống bang bang, đứa nào cũng đọc theo.
  - id: cn2_bs_khach_thuyen
    title: Khách thuyền hỏi đường
    tags:
      - buon_ban
      - nguoi_la
    life_stages:
      - thieu_thoi
      - thanh_nien
      - lap_nghiep
    condition:
      var: world.settlement_type
      op: ==
      value: thi_tran_ben_song
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 1
    icon: nguoi_la
    text:
      - Thuyền lạ cập bến, người khách nói giọng xứ khác hỏi đường đến phố hàng Đường.
    options:
      - id: dan_duong
        text: Dẫn khách đi, nhận ít tiền công
        effects:
          - type: own_money
            value: 0.15
            ledger: tien_cong
          - type: skill_xp
            skill: ngoai_giao
            value: 4
        result:
          - Khách dúi cho mấy đồng, còn hỏi thăm giá gạo, giá muối ở đây.
      - id: chi_tay
        text: Chỉ tay về phía chợ
        default: true
        result:
          - Khách gật đầu cảm ơn, xách tay nải đi.
  - id: cn2_bs_dua_thuyen
    title: Hội đua thuyền
    tags:
      - le_hoi
      - lang_xa
    life_stages:
      - thanh_nien
      - lap_nghiep
    months:
      - 3
      - 4
      - 8
    condition:
      var: world.settlement_type
      op: ==
      value: thi_tran_ben_song
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: hoi
    text:
      - Phường bến trên đọ thuyền với phường bến dưới, thiếu một tay chèo khỏe. Người ta gọi tên bạn.
    options:
      - id: cam_cheo
        text: Cầm chèo xuống thuyền
        chance:
          base: 0.5
          skill: sinh_ton
          per_level: 0.04
        success:
          - type: own_money
            value: 0.4
            ledger: su_kien
          - type: reputation
            group: dan_lang
            value: 3
        failure:
          - type: health
            value: -1
        success_result:
          - Thuyền bạn về nhất, cả phường kiệu đội chèo đi khắp bến.
        failure_result:
          - Thuyền về sau, tay bạn phồng rộp mà lòng vẫn vui.
      - id: co_vu
        text: Đứng trên bờ đánh trống cổ vũ
        default: true
        effects:
          - type: stress
            value: -2
        result:
          - Tiếng trống dồn dập theo nhịp chèo. Cả bến sông như mở hội.
  - id: cn2_bs_giu_sap_ho
    title: Trông sạp hộ
    tags:
      - buon_ban
      - quan_he
    life_stages:
      - thieu_thoi
      - thanh_nien
    condition:
      var: household.career
      op: ==
      value: thuong_nhan
    roles:
      - id: lai
        from: village
        village_role: lai_buon
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: cho
    text:
      - "{role.lai.call} phải về quê có việc gấp, nhờ bạn trông sạp hàng hai hôm, trả công theo phần bán được."
    options:
      - id: trong_sap
        text: Nhận trông, cố bán được nhiều
        effects:
          - type: own_money
            value: 0.4
            ledger: tien_cong
          - type: skill_xp
            skill: thuong_mai
            value: 8
        result:
          - Hai hôm bán đắt hàng, {role.lai.call} về khen nức nở.
      - id: ban_lam
        text: Sạp nhà còn bận, không đỡ được
        default: true
        result:
          - "{role.lai.call} gật đầu, đóng sạp lại mà đi."
  - id: cn2_nq_hoc_tro_bieu
    title: Học trò biếu quà
    tags:
      - hoc_hanh
      - quan_he
    life_stages:
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    condition:
      var: player.career
      op: ==
      value: si_tu
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: sach
    text:
      - Tết thầy, mấy cậu học trò khép nép mang đến cặp bánh chưng, con gà và gói tiền nhỏ bọc giấy hồng điều.
    options:
      - id: nhan
        text: Nhận quà, dặn dò chuyện học
        default: true
        effects:
          - type: own_money
            value: 0.5
            ledger: li_xi
          - type: food
            value: 1
        result:
          - '"Nhất tự vi sư, bán tự vi sư." Bạn dặn học trò đầu xuân nhớ ôn bài.'
      - id: tra_tien
        text: Nhận bánh, trả lại gói tiền cho nhà nghèo
        effects:
          - type: scholarly_prestige
            value: 3
          - type: reputation
            group: dan_lang
            value: 2
        result:
          - Tiếng thầy đồ thanh bạch lan khắp tổng.
  - id: cn2_nq_binh_van
    title: Buổi bình văn
    tags:
      - hoc_hanh
      - van_minh
    life_stages:
      - thanh_nien
      - lap_nghiep
    condition:
      var: player.skill.hoc_van
      op: ">="
      value: 3
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: sach
    text:
      - Mấy sĩ tử trong tổng họp nhau bình văn dưới gốc thông, mỗi người nộp một bài phú, ai thua đãi chè.
    options:
      - id: nop_bai
        text: Thức đêm làm một bài phú
        chance:
          base: 0.4
          skill: hoc_van
          per_level: 0.06
        success:
          - type: scholarly_prestige
            value: 3
          - type: skill_xp
            skill: hoc_van
            value: 10
        failure:
          - type: own_money
            value: -0.1
            ledger: mua_sam
          - type: skill_xp
            skill: hoc_van
            value: 5
        success_result:
          - Bài phú của bạn được đọc to giữa buổi, ai cũng gật gù.
        failure_result:
          - Bài phú bị chê ý vụng. Bạn đãi cả bọn ấm chè, về ngẫm lại từng câu.
      - id: nghe
        text: Chỉ đến nghe người khác bình
        default: true
        effects:
          - type: skill_xp
            skill: hoc_van
            value: 4
        result:
          - Bạn chép lại mấy câu hay vào sổ tay.
  - id: kt_chu_no_den_doi
    title: Chủ nợ dẫn người đến đòi
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    cooldown_years: 3
    weight: 2.2
    tags:
      - kinh_te
      - lang_xa
    roles:
      - id: chu_no
        from: village
        village_role: ba_ho
    condition:
      all:
        - var: household.debt
          op: ">="
          value: 25
    text:
      - "{role.chu_no.call} cầm xấp văn tự bước vào sân, theo sau là hai gia đinh mặt mũi bặm trợn. Ông ta gõ đầu gậy xuống thềm gạch, lớn tiếng đòi nhà bạn phải thanh toán ngay khoản nợ {household.debt} quan đã quá kỳ hạn."
      - Mặt trời vừa lên cao, {role.chu_no.call} đã đứng chắn ngay cổng ngõ, giơ tờ giấy nợ ra trước mặt hàng xóm láng giềng mà thúc ép gia đình bạn trả nợ.
    options:
      - id: d_tra_bot_no
        text: Vét rương trả ngay 25 quan để giữ thể diện
        condition:
          all:
            - var: household.money
              op: ">="
              value: 25
        effects:
          - type: money
            value: -25
            ledger: tra_no
          - type: debt
            value: -25
            ledger: tra_no
          - type: opinion
            role: chu_no
            value: 8
          - type: reputation
            group: dan_lang
            value: 2
          - type: stress
            value: -4
        result:
          - Nhận đủ chồng tiền kẽm, {role.chu_no.call} dịu giọng hẳn, gạch bớt sổ nợ rồi dẫn người ra về.
      - id: d_khat_no_van_nai
        text: Dọn trà ngon, lấy lời khéo léo xin khất đến vụ sau
        hint: Cần tài Ngoại giao để thuyết phục chủ nợ
        chance:
          base: 0.45
          skill: ngoai_giao
          per_level: 0.06
        effects:
          - type: skill_xp
            skill: ngoai_giao
            value: 8
        success:
          - type: opinion
            role: chu_no
            value: 2
          - type: stress
            value: 3
        failure:
          - type: debt
            value: 8
            ledger: lai_no
          - type: opinion
            role: chu_no
            value: -10
          - type: reputation
            group: dan_lang
            value: -3
          - type: stress
            value: 10
        success_result:
          - Nghe bạn trình bày hoàn cảnh hợp tình hợp lý, {role.chu_no.call} thở dài chấp thuận cho gia hạn thêm một mùa.
        failure_result:
          - "{role.chu_no.call} đập bàn không nghe, bắt viết thêm giấy phạt lãi 8 quan rồi mới chịu bước ra khỏi cổng."
      - id: d_gan_bot_ruong
        text: Đành cắt 1 sào ruộng gán nợ cho yên chuyện
        condition:
          all:
            - var: household.farmland
              op: ">="
              value: 1
        effects:
          - type: property_remove
            property: ruong
            count: 1
          - type: debt
            value: -30
            ledger: tra_no
          - type: opinion
            role: chu_no
            value: 5
          - type: stress
            value: 8
        result:
          - Nhìn mảnh bờ thửa cha ông để lại về tay {role.chu_no.call}, lòng bạn xót xa như cắt nhưng khoản nợ nặng lãi đã vơi đi phần lớn.
      - id: d_cung_ran_doi_co
        text: Đứng chắn trước thềm, tuyên bố có tiền sẽ trả chứ không chịu ép bức
        trait_stress:
          an_phan: 6
        effects:
          - type: opinion
            role: chu_no
            value: -15
          - type: clan_relation
            value: -18
            tie: feud
            reason: Tranh chấp nợ nần gay gắt
          - type: stress
            value: 6
        result:
          - Thấy thái độ cứng rắn của bạn, {role.chu_no.call} tức tối chỉ tay hẹn ngày tính sổ rồi hằm hằm bỏ đi. Mối hiềm khích giữa hai nhà càng thêm sâu nặng.
  - id: kt_co_nghiep_thoi_co_lon
    title: Thời cơ buôn bán hiếm có
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    cooldown_years: 4
    weight: 2
    tags:
      - buon_ban
      - kinh_te
    condition:
      all:
        - var: household.ventures_count
          op: ">="
          value: 1
        - var: world.trade_index
          op: ">="
          value: 1.15
    text:
      - Thương thuyền từ các nơi đổ về tấp nập, giá hàng hóa trên chợ tăng vọt. Cơ nghiệp của gia đình bạn đang đứng trước một đợt Thời cơ hiếm có trong nhiều năm.
    options:
      - id: d_doc_von_gom_hang
        text: Xuất 20 quan gom thêm nguyên liệu, mở hết công suất
        condition:
          all:
            - var: household.money
              op: ">="
              value: 20
        chance:
          base: 0.65
          skill: thuong_mai
          per_level: 0.05
        effects:
          - type: money
            value: -20
            ledger: mua_tai_san
          - type: skill_xp
            skill: thuong_mai
            value: 12
        success:
          - type: money
            value: 42
            ledger: co_nghiep
          - type: venture_health
            value: 15
          - type: reputation
            group: dan_lang
            value: 3
        failure:
          - type: money
            value: 12
            ledger: co_nghiep
          - type: stress
            value: 6
        success_result:
          - Chuyến hàng trúng lớn! Khách tranh nhau đặt mua, cơ nghiệp thu về khoản lãi ròng hậu hĩnh và ngày càng thịnh vượng.
        failure_result:
          - Giá chợ hạ nhiệt nhanh hơn dự tính, bạn chỉ thu hồi được một phần vốn liếng.
      - id: d_giu_nhip_vung_vang
        text: Làm ăn chắc chắn theo sức hiện có, giữ chữ tín với khách quen
        effects:
          - type: money
            value: 10
            ledger: co_nghiep
          - type: venture_health
            value: 8
          - type: skill_xp
            skill: quan_tri
            value: 8
        result:
          - Nhờ giữ giá phải chăng và hàng hóa đều đặn, cơ nghiệp thu lời ổn định và giữ chân được nhiều mối khách lâu dài.
  - id: kt_co_nghiep_sa_sut
    title: Cơ nghiệp gặp cơn bĩ cực
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    cooldown_years: 3
    weight: 2.4
    tags:
      - buon_ban
      - kinh_te
    condition:
      all:
        - var: household.has_declining_venture
          op: ==
          value: true
    text:
      - Mấy tháng nay cơ nghiệp của gia đình buôn bán ế ẩm, nguyên liệu hư hao, thợ thuyền bắt đầu chán nản. Nếu không sớm chấn chỉnh, e rằng cơ nghiệp khó tránh khỏi cảnh phá sản.
    options:
      - id: d_bom_von_chan_chinh
        text: Bỏ 18 quan tu sửa cơ sở và thưởng thêm cho thợ
        condition:
          all:
            - var: household.money
              op: ">="
              value: 18
        effects:
          - type: money
