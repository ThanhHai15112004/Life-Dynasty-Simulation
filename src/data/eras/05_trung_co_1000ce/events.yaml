    tags:
      - quan_he
      - le_hoi
    life_stages:
      - thanh_nien
      - lap_nghiep
    condition:
      var: player.mourning_months
      op: ==
      value: 0
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: cuoi
    text:
      - Thằng bạn chăn trâu với bạn từ bé nay cưới vợ. Nhà trai dựng rạp lá chuối, mời bạn sang ăn cỗ.
    options:
      - id: mung_tien
        text: Mừng một quan tiền
        condition:
          var: household.money
          op: ">="
          value: 1
        effects:
          - type: money
            value: -1
          - type: reputation
            value: 2
          - type: stress
            value: -2
        result:
          - Bạn được xếp ngồi mâm trên. Chú rể rót rượu mời đến ba lần.
      - id: mung_gao
        text: Mang thúng gạo nếp sang mừng
        default: true
        effects:
          - type: food
            value: -0.5
          - type: reputation
            value: 1
        result:
          - Quà quê mộc mạc, nhà trai vẫn vui vẻ nhận.
  - id: cn_nl_ganh_cheo_ve_dinh
    title: Gánh chèo về đình
    tags:
      - le_hoi
      - lang_xa
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    months:
      - 1
      - 2
      - 3
      - 8
    condition:
      var: player.mourning_months
      op: ==
      value: 0
    weight: 4
    cooldown_years: 3
    minor: true
    tension: 1
    importance: 2
    icon: hoi
    text:
      - Có gánh chèo về dựng chiếu ở sân đình, tối nay diễn tích người con hiếu thảo bị oan. Tiếng trống đã thùng thùng từ chiều.
    options:
      - id: di_xem
        text: Đi xem đến khuya
        condition:
          var: household.money
          op: ">="
          value: 0.3
        effects:
          - type: money
            value: -0.3
          - type: stress
            value: -4
        result:
          - Đến đoạn người con bị đuổi khỏi nhà, cả sân đình lặng đi. Bạn về nhà lúc gà gáy.
      - id: ngu_som
        text: Ở nhà ngủ sớm, mai còn dậy sớm
        default: true
        result:
          - Nằm trong nhà vẫn nghe tiếng trống chèo vọng lại đến nửa đêm.
  - id: cn_nl_chau_sanh_the
    title: Chậu sanh thế ở chợ huyện
    tags:
      - buon_ban
    life_stages:
      - lap_nghiep
      - trung_nien
    condition:
      var: household.money
      op: ">="
      value: 4
    weight: 3
    cooldown_years: 8
    minor: true
    tension: 1
    importance: 2
    icon: cay
    text:
      - Ông lão ở chợ huyện bày bán một chậu sanh uốn thế rồng chầu, rễ ôm đá, xin một quan rưỡi.
    options:
      - id: mua_chau
        text: Mua về đặt trước hiên (1.5 quan)
        effects:
          - type: money
            value: -1.5
          - type: stress
            value: -3
          - type: reputation
            value: 1
        result:
          - Chiều chiều bạn ra tỉa lá, ngắm thế cây, thấy lòng nhẹ hẳn.
      - id: thoi
        text: Ngắm một lúc rồi đi
        default: true
        result:
          - Tiền ấy đủ đong thóc cho cả nhà mấy tuần. Bạn quay đi.
  - id: cn_nl_qua_cho_cha_me
    title: Quà chợ cho cha mẹ
    tags:
      - gia_dinh
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      var: household.money
      op: ">="
      value: 1
    roles:
      - id: cm
        from: family
        relation: parent
        condition:
          var: self.age
          op: ">="
          value: 50
    weight: 5
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 3
    icon: gia_dinh
    text:
      - Đi chợ về qua hàng trầu, bạn chợt nhớ {role.cm.call} dạo này ăn trầu không còn nhai được miếng cau già.
    options:
      - id: mua_qua
        text: Mua buồng cau non, gói chè ngon (0.5 quan)
        effects:
          - type: money
            value: -0.5
          - type: filial_piety
            value: 3
          - type: opinion
            role: cm
            value: 5
        result:
          - Ngồi têm trầu, {role.cm.call} cười móm mém, bảo con lớn thật rồi.
      - id: de_danh
        text: Thôi, để dành tiền lo việc khác
        default: true
        result:
          - Bạn đi thẳng qua hàng trầu.
  - id: cn_nl_van_co_goc_da
    title: Ván cờ dưới gốc đa
    tags:
      - quan_he
      - lang_xa
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      var: household.money
      op: ">="
      value: 2
    weight: 4
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 2
    icon: chen_tra
    text:
      - Dưới gốc đa đầu làng, mấy ông bày bàn cờ vẽ trên chiếu, mỗi ván đặt một quan.
    options:
      - id: ngoi_danh
        text: Ngồi vào đánh một ván
        trait_stress:
          than_trong: 2
        chance:
          base: 0.4
          skill: muu_luoc
          per_level: 0.05
        success:
          - type: money
            value: 1
            ledger: thu_khac
          - type: skill_xp
            skill: muu_luoc
            value: 8
        failure:
          - type: money
            value: -1
          - type: stress
            value: 2
        success_result:
          - Bạn chiếu tướng nước cuối. Ông kia vỗ đùi, móc tiền trả.
        failure_result:
          - Mải ăn quân, bạn hở mất tướng. Một quan tiền đi tong.
      - id: dung_xem
        text: Đứng xem, học nước đi
        default: true
        effects:
          - type: skill_xp
            skill: muu_luoc
            value: 5
        result:
          - Xem hết buổi chiều, bạn nhớ được mấy thế cờ hay.
  - id: cn_nl_cho_vang_truoc_cong
    title: Chó lạc trước cổng
    tags:
      - gia_dinh
    life_stages:
      - lap_nghiep
      - trung_nien
    condition:
      not:
        has_flag: cn_nuoi_cho
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: cho
    text:
      - Sáng ra có con chó vện gầy trơ xương nằm ngay trước cổng, thấy người thì cụp đuôi nhưng không chạy.
    options:
      - id: nuoi_giu_nha
        text: Cho ăn, giữ lại trông nhà
        effects:
          - type: food
            value: -0.5
          - type: stress
            value: -2
          - type: set_flag
            flag: cn_nuoi_cho
            years: 10
        result:
          - Được mấy bữa cơm, con vện béo lên trông thấy. Đêm có tiếng động là nó sủa vang.
      - id: xua_di
        text: Xua nó đi chỗ khác
        default: true
        result:
          - Con chó lững thững đi sang xóm khác.
  - id: cn_nl_khuc_vai_cho_vo
    title: Khúc vải ở phiên chợ
    tags:
      - gia_dinh
      - buon_ban
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      all:
        - var: player.married
          op: ==
          value: true
        - var: household.money
          op: ">="
          value: 2
    roles:
      - id: vc
        from: family
        relation: spouse
    weight: 4
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 2
    icon: gia_dinh
    text:
      - Phiên chợ có lái vải bày khúc lụa màu hồ thủy. Bạn chợt nghĩ đến {role.vc.call}, mấy năm nay chưa sắm được gì mới.
    options:
      - id: mua_vai
        text: Mua một khúc (1 quan)
        effects:
          - type: money
            value: -1
          - type: opinion
            role: vc
            value: 6
          - type: stress
            value: -1
        result:
          - Cầm khúc vải, {role.vc.call} lườm bạn tiêu hoang, nhưng tối ấy cứ ướm đi ướm lại.
      - id: thoi
        text: Thôi, để dành tiền
        default: true
        result:
          - Bạn mua nắm kẹo lạc thay vào, cả nhà chia nhau ăn.
  - id: cn_nl_con_doi_lam_dieu
    title: Con đòi làm diều
    tags:
      - gia_dinh
    life_stages:
      - lap_nghiep
      - trung_nien
    months:
      - 4
      - 5
      - 6
    roles:
      - id: con
        from: family
        relation: child
        condition:
          all:
            - var: self.age
              op: between
              value:
                - 5
                - 11
            - var: self.in_household
              op: ==
              value: true
    weight: 4
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 3
    icon: dieu
    text:
      - Gió nồm thổi lồng lộng. {role.con.call} níu áo bạn, đòi làm một cái diều to như diều nhà bên.
    options:
      - id: lam_cung_con
        text: Chẻ tre, dán giấy làm cùng con
        effects:
          - type: opinion
            role: con
            value: 6
          - type: stress
            value: -3
        result:
          - Diều lên cao, sáo diều vi vu. Con chạy theo dây, cười không ngớt.
      - id: bao_tu_lam
        text: Bảo con tự làm lấy
        default: true
        effects:
          - type: opinion
            role: con
            value: -3
        result:
          - Con hì hục cả buổi, diều méo xệch, bay được một đoạn thì cắm đầu xuống ruộng.
  - id: cn_nl_thoi_muc_thom
    title: Thỏi mực thơm
    tags:
      - hoc_hanh
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      all:
        - var: player.career
          op: ==
          value: si_tu
        - var: household.money
          op: ">="
          value: 2
    weight: 4
    cooldown_years: 5
    minor: true
    tension: 1
    importance: 2
    icon: sach
    text:
      - Người bán rong qua làng có mấy thỏi mực thơm mùi xạ, mài ra đen nhánh, xin một quan một thỏi.
    options:
      - id: mua_muc
        text: Mua một thỏi (1 quan)
        effects:
          - type: money
            value: -1
          - type: skill_xp
            skill: hoc_van
            value: 10
          - type: stress
            value: -1
        result:
          - Mực tốt làm nét chữ có thần. Bạn chép lại cả quyển văn sách cho đẹp.
      - id: dung_muc_cu
        text: Dùng nốt thỏi mực cũ
        default: true
        effects:
          - type: skill_xp
            skill: hoc_van
            value: 4
        result:
          - Mực cũ nhạt màu, nhưng chữ là ở tay người viết.
  - id: cn_nl_mai_luoi_dao
    title: Mài lại lưỡi đao
    tags:
      - vo_nghe
      - nghe_nghiep
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      var: player.career
      op: ==
      value: linh
    weight: 4
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 2
    icon: kiem
    text:
      - Lưỡi đao đã mẻ hai chỗ sau đợt tập. Lò rèn ngoài chợ nhận mài lại, lấy nửa quan.
    options:
      - id: mang_ra_lo
        text: Mang ra lò rèn (0.5 quan)
        condition:
          var: household.money
          op: ">="
          value: 0.5
        effects:
          - type: money
            value: -0.5
          - type: skill_xp
            skill: quan_su
            value: 7
        result:
          - Lưỡi đao về sáng loáng, chém đứt cây tre cỡ cổ tay.
      - id: tu_mai
        text: Tự ngồi mài bên giếng
        default: true
        effects:
          - type: skill_xp
            skill: quan_su
            value: 3
          - type: stress
            value: 1
        result:
          - Mài cả buổi tối mới hết vết mẻ. Đao không sắc bằng, nhưng dùng được.
  - id: cn_nl_dua_chan_de
    title: Đứa trẻ chăn dê
    tags:
      - nguy_hiem
      - nghe_nghiep
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      var: player.career
      op: ==
      value: thao_khau
    weight: 4
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 3
    icon: nguoi_la
    text:
      - Trên đường mòn về trại, bạn chạm mặt một đứa trẻ chăn dê. Nó nhìn bạn chằm chằm rồi lùi dần về phía bản.
    options:
      - id: cho_tien
        text: Dúi cho nó ít tiền, dặn đừng nói gì
        condition:
          var: household.money
          op: ">="
          value: 0.5
        effects:
          - type: money
            value: -0.5
        result:
          - Đứa bé nắm chặt mấy đồng tiền, gật đầu lia lịa rồi chạy biến.
      - id: doa_no
        text: Trợn mắt dọa cho nó sợ
        trait_stress:
          nhan_tu: 3
        effects:
          - type: chance
            p: 0.15
            then:
              - type: wanted
                value: 2
        result:
          - Đứa bé khóc thét, bỏ cả đàn dê mà chạy.
      - id: mac_ke
        text: Mặc kệ, đi tiếp
        default: true
        effects:
          - type: chance
            p: 0.3
            then:
              - type: wanted
                value: 2
        result:
          - Bạn kéo vành nón thấp xuống, rẽ sang lối khác.
  - id: cn_nl_chan_bong_ngay_ret
    title: Chăn bông ngày rét
    tags:
      - gia_dinh
      - kinh_te
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    months:
      - 11
      - 12
      - 1
    condition:
      var: household.money
      op: ">="
      value: 3
    weight: 4
    cooldown_years: 5
    minor: true
    tension: 1
    importance: 2
    icon: tien
    text:
      - Gió bấc thổi rát mặt. Ngoài chợ có người bán chăn bông mới bật, ấm sực, một quan rưỡi một chiếc.
    options:
      - id: mua_chan
        text: Mua một chiếc (1.5 quan)
        effects:
          - type: money
            value: -1.5
          - type: modifier
            target: health.monthly
            value: 0.1
            months: 3
            label: Chăn bông mới
          - type: stress
            value: -1
        result:
          - Đêm ấy cả nhà rúc chung một chăn, không ai bị rét cóng.
      - id: o_rom
        text: Lót thêm ổ rơm cho qua mùa
        default: true
        effects:
          - type: stress
            value: 1
        result:
          - Ổ rơm sột soạt, cũng đủ ấm qua những đêm rét nhất.
  - id: cn_nl_viet_thu_ho
    title: Nhờ viết thư
    tags:
      - lang_xa
      - hoc_hanh
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      all:
        - var: player.skill.hoc_van
          op: ">="
          value: 2
        - var: world.military_alert
          op: "!="
          value: binh_yen
    weight: 4
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 3
    icon: sach
    text:
      - Bà cụ góa cuối xóm có con trai đi lính thú biên ải. Bà biết bạn có chữ, đến nhờ viết hộ lá thư.
    options:
      - id: viet_khong_lay
        text: Viết giúp, không lấy tiền
        effects:
          - type: reputation
            value: 2
          - type: skill_xp
            skill: hoc_van
            value: 5
        result:
          - Bà cụ đọc từng câu cho bạn chép, đến đoạn dặn con mặc ấm thì nghẹn lại.
      - id: lay_tien_cong
        text: Viết, lấy chút tiền giấy mực
        effects:
          - type: money
            value: 0.5
            ledger: thu_khac
          - type: reputation
            value: -1
        result:
          - Bà cụ móc túi trả từng đồng, không kêu ca gì.
      - id: ban_viec
        text: Đang bận, hẹn bà hôm khác
        default: true
        result:
          - Bà cụ chống gậy sang nhờ ông đồ làng bên.
  - id: cn_g_trong_cay_cho_chau
    title: Trồng cây cho cháu
    tags:
      - gia_dinh
    life_stages:
      - tuoi_gia
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 4
    icon: cay
    text:
      - Góc vườn còn khoảnh đất trống. Bạn nghĩ trồng một cây nhãn thì phải mười năm mới có quả, khi ấy mình còn đâu.
    options:
      - id: trong_cay
        text: Cứ trồng, để cháu chắt sau này hái
        effects:
          - type: stress
            value: -3
          - type: health
            value: -1
          - type: set_flag
            flag: cn_cay_nhan_trong_cho_chau
        result:
          - Bạn tự tay đào hố, vun gốc. Lũ cháu đứng quanh hỏi bao giờ có nhãn ăn.
      - id: thoi
        text: Thôi, già rồi, để đất trồng rau
        default: true
        result:
          - Khoảnh đất ấy năm nào cũng xanh rau cải.
  - id: cn_g_chep_kinh_nghiem
    title: Chép lại kinh nghiệm
    tags:
      - gia_dinh
      - hoc_hanh
    life_stages:
      - tuoi_gia
    condition:
      var: player.skill.hoc_van
      op: ">="
      value: 1
    roles:
      - id: con
        from: family
        relation: child
        condition:
          var: self.age
          op: ">="
          value: 16
        optional: true
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 4
    icon: sach
    text:
      - "Đêm dài khó ngủ, bạn nghĩ nên chép lại những điều cả đời học được: xem trời, chọn giống, mấy bài thuốc nam."
    options:
      - id: chep_lai
        text: Thắp đèn chép thành một tập
        effects:
          - type: skill_xp
            skill: hoc_van
            value: 6
          - type: stress
            value: -1
          - type: set_flag
            flag: cn_tap_kinh_nghiem
        result:
          - Tập giấy dày dần qua mấy mùa. Bạn khâu gáy cẩn thận, cất vào rương.
      - id: ke_mieng
        text: Kể miệng cho con cháu nghe là đủ
        default: true
        effects:
          - type: opinion
            role: con
            value: 3
        result:
          - Con cháu nghe, nhớ được chuyện nào thì nhớ.
  - id: cn_g_tho_de_vach
    title: Bài thơ chiều thu
    tags:
      - hoc_hanh
      - van_minh
    life_stages:
      - tuoi_gia
    months:
      - 9
      - 10
    condition:
      any:
        - var: player.exam_degree
          op: "!="
          value: none
        - var: player.skill.hoc_van
          op: ">="
          value: 3
    weight: 4
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 3
    icon: la
    text:
      - Chiều cuối thu, khói rơm bay ngang ngõ, lá bàng đỏ rụng đầy sân. Trong lòng bạn có mấy câu thơ chực thành lời.
    options:
      - id: de_tho
        text: Mài mực đề thơ lên vách
        effects:
          - type: scholarly_prestige
