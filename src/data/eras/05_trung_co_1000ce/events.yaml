        trait_stress:
          tham_vong: 2
        effects:
          - type: skill_xp
            skill: thuong_mai
            value: 6
          - type: stress
            value: -1
        result:
          - Bạn nhớ mãi cánh buồm vàng nâu gấp nếp như cánh dơi, và mùi trầm lạ phảng phất cả một đoạn bến.
  - id: bs_cho_muoi_lau
    title: Chuyến muối lậu đêm không trăng
    tags:
      - buon_ban
      - nguy_hiem
      - thoi_co
    life_stages:
      - thanh_nien
      - lap_nghiep
