        - var: world.school_tier
          op: <=
          value: 1
        - var: player.skill.hoc_van
          op: ">="
          value: 2
        - not:
            has_flag: tro_hoc_xa_nha
    weight: 12
    cooldown_years: 5
    once_per_life: true
    importance: 7
    icon: sach
    options:
      - id: khan_goi_tro_hoc_thi_tran
        text: Khăn gói lên thị trấn thuê chỗ trọ học lên cao
        hint: Tốn 4 quan lộ phí và tiền trọ
