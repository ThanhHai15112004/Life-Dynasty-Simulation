                value: 60
              add: -0.15
        effects:
          - type: money
            value: -4
            ledger: su_kien
        success:
          - type: money
            value: 10
            ledger: buon_ban
          - type: career_merit
            value: 8
          - type: skill_xp
            skill: thuong_mai
            value: 15
        failure:
          - type: money
            value: 1
            ledger: buon_ban
          - type: wanted
            value: 5
          - type: stress
            value: 5
        success_result:
          - Mấy chồng bát sứ men xanh bày lên sạp chưa đầy tuần đã có nhà phú hộ trên trấn đến mua cả.
        failure_result:
          - Sai nha soi đuốc ra bến đúng lúc bạn khuân hàng lên. Phải vứt xuống sông quá nửa mới thoát.
      - id: dat_moi
        text: Làm người dắt mối giữa khách lạ và các nhà buôn bến
        chance:
          base: 0.45
          skill: ngoai_giao
          per_level: 0.05
        success:
          - type: money
            value: 3
            ledger: buon_ban
          - type: skill_xp
            skill: ngoai_giao
            value: 20
        failure:
          - type: skill_xp
            skill: ngoai_giao
            value: 10
          - type: stress
            value: 3
        success_result:
          - Bạn học được vài câu tiếng khách, đi lại giữa thuyền và bến cả tuần. Hai bên đều dúi cho chút tiền công.
        failure_result:
          - Khách lạ ngờ bạn ăn chặn, nhà buôn bến lại ngờ bạn đứng về phía khách. Chẳng bên nào cảm ơn.
      - id: dung_xem
