  - id: gd_chon_vo_chong
    title: Ý cha mẹ hay ý mình
    tags:
      - gia_dinh
      - quan_he
    life_stages:
      - thanh_nien
      - lap_nghiep
    condition:
      all:
        - var: player.age
          op: between
          value:
            - 18
            - 32
        - var: player.married
          op: ==
          value: false
        - var: player.mourning_months
          op: ==
          value: 0
    roles:
      - id: cm
        from: family
        relation: parent
        pick: oldest
    weight: 6
    weight_modifiers:
      - condition:
          var: player.age
          op: ">="
          value: 24
        factor: 1.5
    once_per_life: true
    tension: 5
    importance: 7
    icon: cuoi
    text:
      - Tối ấy bạn được gọi lại bên chõng tre. {role.cm.call} nói nhà đã nhắm cho bạn một mối, bên ấy cũng đã nhận cơi trầu dạm ngõ. Nhưng bạn thì đã thầm thương một người ở xóm dưới, hai người từng hẹn nhau ở bến nước.
    options:
      - id: theo_y_nha_nho
        text: Vâng lời, nhận mối nhà hương cống làng bên cho môn đăng hộ đối (6 quan sính lễ)
        hint: Hiếu đạo và danh giá nhà nho tăng, lòng mình thì nặng
        condition:
          all:
            - any:
                - var: player.origin
                  op: ==
                  value: quy_toc_nho
                - var: household.career
                  op: ==
                  value: si_tu
            - var: household.money
              op: ">="
              value: 6
        trait_stress:
          tu_do: 6
        effects:
          - type: money
            value: -6
            ledger: su_kien
          - type: marry
          - type: filial_piety
            value: 8
          - type: scholarly_prestige
            value: 4
          - type: opinion
            role: cm
            value: 12
          - type: stress
            value: 4
        result:
          - Hai họ đọc văn tế tơ hồng trước bàn thờ, câu chữ đối nhau chan chát. Bạn cúi lạy mà lòng trống trải. Người ở xóm dưới không đến xem.
      - id: theo_y_nha_buon
        text: Vâng lời, nhận mối nhà buôn muối bến dưới, hai nhà gộp mối hàng
        hint: Có của hồi môn và mối hàng, lòng mình thì nặng
        condition:
          var: household.career
          op: ==
          value: thuong_nhan
        trait_stress:
          tu_do: 6
        effects:
          - type: marry
          - type: money
            value: 3
            ledger: thu_khac
          - type: filial_piety
            value: 6
          - type: modifier
            target: xp.thuong_mai
            value: 1.1
            op: mul
            months: 36
            label: Thông gia nhà buôn muối
          - type: opinion
            role: cm
            value: 10
          - type: stress
            value: 4
        result:
          - Thuyền nhà gái chở hồi môn cập bến, nào chum muối, nào súc vải. Người bến sông khen hai nhà khéo tính. Bạn cười mà không thấy vui.
      - id: theo_y_nha_lam_an
        text: Vâng lời, nhận mối con nhà chịu thương chịu khó ở xóm trên
        hint: Cha mẹ lo sính lễ, nhà có thêm thóc hồi môn
        condition:
          not:
            any:
              - var: player.origin
                op: ==
                value: quy_toc_nho
              - var: household.career
                op: ==
                value: si_tu
              - var: household.career
                op: ==
                value: thuong_nhan
        trait_stress:
          tu_do: 6
        effects:
          - type: marry
          - type: food
            value: 5
            ledger: thu_khac
          - type: filial_piety
            value: 6
          - type: opinion
            role: cm
            value: 10
          - type: stress
            value: 3
        result:
          - Ngày cưới, nhà gái gánh sang mấy thúng thóc làm của hồi môn. Bạn đỡ đòn gánh, nhìn về phía xóm dưới một lần rồi thôi.
      - id: theo_long
        text: Thưa thật với {role.cm.call}, xin cưới người mình thương (lễ mọn 1,5 quan)
        hint: Lòng nhẹ, nhưng cha mẹ giận lâu
        condition:
          var: household.money
          op: ">="
          value: 1.5
        trait_stress:
          trong_gia_dinh: 4
        effects:
          - type: money
            value: -1.5
            ledger: su_kien
          - type: marry
          - type: filial_piety
            value: -6
          - type: opinion
            role: cm
            value: -15
          - type: stress
            value: -5
          - type: schedule_event
            event: gd_chon_vo_chong_lam_lanh
            months: 30
            label: Cha mẹ còn giận chuyện cưới xin
        result:
          - Đám cưới chỉ có mâm xôi, đĩa thịt và mấy người bạn thân. {role.cm.call} ngồi trong buồng không ra. Nhưng tối ấy bạn ngủ một giấc thật dài.
      - id: hoan
        text: Xin cho thêm một năm suy nghĩ
        defer:
          months: 12
        effects:
          - type: opinion
            role: cm
            value: -4
          - type: stress
            value: 3
        result:
          - "{role.cm.call} thở dài, cho người sang nhà kia khất lại. Mối ấy chờ được bao lâu thì chẳng ai dám chắc."
  - id: gd_den_tuoi_lap_gia_that
    title: Đến tuổi lập gia thất
    tags:
      - gia_dinh
      - quan_he
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      all:
        - var: player.age
          op: between
          value:
            - 21
            - 40
        - var: player.married
          op: ==
          value: false
        - var: player.mourning_months
          op: ==
          value: 0
    roles:
      - id: hx
        from: village
        village_role: hang_xom
    weight: 10
    priority: true
    cooldown_years: 3
    tension: 4
    importance: 7
    icon: cuoi
    text:
      - 'Bạn đã {player.age} tuổi mà vẫn chưa yên bề gia thất. Bà mối trong xóm sang ngồi mãi bên ấm chè: "Ngần này tuổi rồi, để lâu nữa thì người ta lại bảo nhà có chuyện gì." Bà đã nhắm sẵn một mối, chỉ chờ bạn gật đầu.'
      - 'Tết vừa rồi họ hàng ai cũng hỏi: "Bao giờ cho ăn cỗ?" Nay bà mối trong xóm tìm đến tận nhà, nói có một nhà nết na, chịu thương chịu khó, cũng đang tìm nơi gửi gắm.'
    options:
      - id: cuoi_dang_hoang
        text: Nhận lời, sắm lễ đàng hoàng (4 quan, 6 thúng thóc)
        condition:
          all:
            - var: household.money
              op: ">="
              value: 4
            - var: household.food
              op: ">="
              value: 6
        effects:
          - type: money
            value: -4
          - type: food
            value: -6
          - type: marry
          - type: reputation
            group: dan_lang
            value: 5
          - type: opinion
            role: hx
            value: 6
        result:
          - Cỗ cưới bày kín sân, bà mối ngồi mâm trên cười không ngớt. Từ nay nhà thêm một người sớm hôm có nhau.
      - id: cuoi_don_gian
        text: Nhận lời, lễ mọn lòng thành (1 quan, 2 thúng thóc)
        condition:
          all:
            - var: household.money
              op: ">="
              value: 1
            - var: household.food
              op: ">="
              value: 2
        effects:
          - type: money
            value: -1
          - type: food
            value: -2
          - type: marry
        result:
          - Không kèn không trống, chỉ một mâm cơm cúng tổ tiên và mấy người hàng xóm. Vậy mà tối ấy căn nhà ấm hẳn lên.
      - id: vay_cuoi
        text: Nhận lời, vay 3 quan lo sính lễ
        effects:
          - type: debt
            value: 3
          - type: marry
          - type: stress
            value: 3
        result:
          - Cưới xong thì cũng gánh thêm món nợ. Nhưng nhìn người mới về lúi húi bên bếp, bạn thấy cũng đáng.
      - id: o_vay
        text: Từ chối, chưa muốn ràng buộc
        effects:
          - type: opinion
            role: hx
            value: -4
        result:
          - Bà mối lắc đầu ra về, vừa đi vừa bảo "rồi lại tiếc". Bạn đóng cổng, nhà lại vắng như cũ.
  - id: gd_chon_vo_chong_lam_lanh
    title: Mâm cơm làm lành
    tags:
      - gia_dinh
      - quan_he
    scheduled_only: true
    condition:
      var: player.married
      op: ==
      value: true
    roles:
      - id: cm
        from: family
        relation: parent
      - id: vc
        from: family
        relation: spouse
    weight: 1
    tension: 4
    importance: 6
    icon: gia_dinh
    text:
      - Đã mấy mùa từ ngày cưới, {role.cm.call} vẫn ít nói với {role.vc.call}. Bữa cơm chung mà như hai mâm. Sáng nay bạn bắt gặp {role.vc.call} lặng lẽ lau nước mắt sau bếp.
    options:
      - id: sam_le_xin_loi
        text: Cùng {role.vc.call} sắm lễ, quỳ xin {role.cm.call} tha lỗi (2 quan)
        condition:
          var: household.money
          op: ">="
          value: 2
        trait_stress:
          tham_vong: 2
        effects:
          - type: money
            value: -2
            ledger: su_kien
          - type: opinion
            role: cm
            value: 15
          - type: opinion
            role: vc
            value: 5
          - type: filial_piety
            value: 6
          - type: stress
            value: -3
        result:
          - Hai người quỳ trước sập gụ. {role.cm.call} im lâu lắm, rồi đưa tay đỡ {role.vc.call} dậy. Bữa tối ấy cả nhà ngồi chung một mâm.
      - id: lay_net_cam_long
        text: Để {role.vc.call} ngày ngày chăm sóc, lấy nết mà cảm lòng
        hint: Chậm mà chắc, nếu người bạn đời đủ kiên nhẫn
        chance:
          base: 0.45
          skill: ngoai_giao
          per_level: 0.03
          modifiers:
            - condition:
                has_trait: kien_nhan
                who: vc
              add: 0.15
        success:
          - type: opinion
            role: cm
            value: 12
          - type: filial_piety
            value: 3
          - type: stress
            value: -2
        failure:
          - type: stress
            value: 4
          - type: stress
            who: vc
            value: 5
          - type: opinion
            role: vc
            value: -5
        success_result:
          - Một đêm {role.cm.call} trở bệnh, {role.vc.call} thức trắng sắc thuốc. Sáng ra bạn nghe {role.cm.call} gọi tên con dâu, con rể bằng giọng khác hẳn.
        failure_result:
          - Chăm mấy cũng không vừa ý. {role.vc.call} gầy đi, còn bạn đứng giữa, chẳng biết đỡ bên nào.
      - id: mac_ke
        text: Đời mình mình sống, ai giận mặc ai
        trait_stress:
          trong_gia_dinh: 5
        effects:
          - type: filial_piety
            value: -4
          - type: opinion
            role: cm
            value: -8
          - type: opinion
            role: vc
            value: 8
          - type: stress
            value: -2
        result:
          - Bạn dọn riêng mâm cơm cho hai vợ chồng ra hiên. Người làng bảo nhà ấy con cái bạc. Bạn nghe, rồi để đấy.
  - id: gd_me_chong_nang_dau
    title: Mẹ chồng nàng dâu
    tags:
      - gia_dinh
      - quan_he
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      all:
        - var: player.sex
          op: ==
          value: m
        - var: player.married
          op: ==
          value: true
    roles:
      - id: me
        from: family
        relation: mother
      - id: vo
        from: family
        relation: spouse
    weight: 5
    weight_modifiers:
      - condition:
          var: household.food_months
          op: <
          value: 3
        factor: 1.5
    cooldown_years: 5
    tension: 4
    importance: 5
    icon: gia_dinh
    text:
      - Chuyện bắt đầu từ nồi cá kho mặn. {role.me.call} bảo con dâu nấu ăn hoang phí, {role.vo.call} cãi lại một câu. Cả buổi chiều nhà im phăng phắc, chỉ nghe tiếng đũa gõ vào bát.
    options:
      - id: benh_me
        text: Mắng vợ trước mặt mẹ cho phải đạo
        trait_stress:
          nhan_tu: 3
        effects:
          - type: filial_piety
            value: 5
          - type: opinion
            role: me
            value: 8
          - type: opinion
            role: vo
            value: -12
          - type: stress
            who: vo
            value: 6
        result:
          - "{role.vo.call} cúi đầu dọn mâm, không nói gì. Đêm ấy bạn nghe tiếng sụt sịt ở góc buồng."
      - id: benh_vo
        text: Thưa với mẹ rằng vợ con không sai
        trait_stress:
          trung_thanh: 2
        effects:
          - type: filial_piety
            value: -5
          - type: opinion
            role: me
            value: -10
          - type: opinion
            role: vo
            value: 12
        result:
          - '{role.me.call} đứng dậy bỏ vào buồng: "Nuôi con lớn để con bênh người ngoài." Câu ấy bạn nhớ mãi.'
      - id: khuyen_giai
        text: Mỗi bên nói một câu khéo, xin mỗi người lùi nửa bước
        hint: Cần tài ăn nói
        chance:
          base: 0.4
          skill: ngoai_giao
          per_level: 0.05
        success:
          - type: opinion
            role: me
            value: 6
          - type: opinion
            role: vo
            value: 6
          - type: skill_xp
            skill: ngoai_giao
            value: 12
        failure:
          - type: opinion
            role: me
            value: -5
          - type: opinion
            role: vo
            value: -5
          - type: stress
            value: 5
        success_result:
          - Bạn bảo mẹ vốn thương con dâu nên mới dạy, bảo vợ mẹ già nói thế thôi. Tối ấy {role.vo.call} gắp cho mẹ miếng cá ngon nhất.
        failure_result:
          - Nói bên này thì bên kia giận. Cuối cùng cả hai cùng trách bạn ba phải.
      - id: chia_bep
        text: Dựng thêm gian bếp, mẹ một bếp, vợ một bếp (3 quan)
        condition:
          var: household.money
          op: ">="
          value: 3
        effects:
          - type: money
            value: -3
            ledger: su_kien
          - type: filial_piety
            value: -2
          - type: opinion
            role: me
            value: 2
          - type: opinion
            role: vo
            value: 6
          - type: stress
            value: -3
        result:
          - Hai làn khói bếp bay lên trên một mái nhà. Hàng xóm cười, nhưng trong nhà yên hẳn.
  - id: gd_sinh_kho
    title: Mẹ tròn con chưa vuông
    tags:
      - gia_dinh
      - benh_tat
    condition:
      all:
        - var: player.sex
          op: ==
          value: m
        - var: player.married
          op: ==
          value: true
    roles:
      - id: vo
        from: family
        relation: spouse
        condition:
          var: self.sex
          op: ==
          value: f
      - id: be
        from: family
        relation: child
        condition:
          var: self.age
          op: ==
          value: 0
        pick: youngest
      - id: thay
        from: village
        village_role: thay_lang
        optional: true
    weight: 5
    weight_modifiers:
      - condition:
          var: role.vo.health
          op: <
          value: 60
        factor: 2
    cooldown_years: 3
    tension: 6
    importance: 7
    icon: om
    text:
      - Lần vượt cạn của {role.vo.call} kéo dài từ chập tối đến gà gáy. Bà đỡ cắt rốn bằng mảnh nứa, {role.be.call} khóc to khỏe mạnh. Nhưng đã mấy tuần, {role.vo.call} vẫn nằm trên ổ rơm, mặt trắng bệch, hơi thở yếu.
    options:
      - id: moi_thay
        text: Mời {role.thay.call} sắc thuốc bổ huyết (3 quan)
        condition:
          all:
            - role: thay
              exists: true
            - var: household.money
              op: ">="
              value: 3
        effects:
          - type: money
            value: -3
            ledger: su_kien
          - type: health
            who: vo
            value: 15
          - type: opinion
            role: thay
            value: 4
        result:
          - Mỗi ngày một niêu thuốc đen sánh. Đến tuần thứ ba, {role.vo.call} đã ngồi dậy cho con bú được.
      - id: ban_ga
        text: Bán đàn gà, mua gà ác hầm ngải cứu cho vợ
        condition:
          has_property: dan_ga
        effects:
          - type: property_remove
            property: dan_ga
            count: 1
          - type: health
            who: vo
            value: 12
        result:
          - Chuồng gà trống trơn. Nhưng bát gà ác hầm thơm cả gian bếp, má {role.vo.call} hồng dần lên.
      - id: nam_than
        text: Theo lệ cho nằm than, kiêng gió, cữ đủ trăm ngày
        hint: Không tốn tiền, nhà thiếu một tay làm
        chance:
          base: 0.5
          skill: sinh_ton
          per_level: 0.03
        effects:
          - type: modifier
            target: living.cost
            value: 1.05
            op: mul
            months: 4
            label: Vợ nằm cữ
          - type: stress
            value: 3
        success:
          - type: health
            who: vo
            value: 8
        failure:
          - type: health
            who: vo
            value: -8
          - type: stress
            value: 4
        success_result:
          - Bạn đun than hồng dưới gầm giường, ngày ngày nấu cháo móng giò. {role.vo.call} qua được cữ.
        failure_result:
          - Gian buồng kín mít, khói than ngột ngạt. {role.vo.call} không khá lên mà còn ho thêm.
      - id: cung_via
        text: Mời thầy cúng vía cho mẹ tròn con vuông (0,5 quan)
        hint: Rẻ, nhưng phó mặc thần linh
        trait_stress:
          hoai_nghi: 4
        chance:
          base: 0.3
          modifiers:
            - condition:
                has_trait: mo_dao
              add: 0.1
        effects:
          - type: money
            value: -0.5
            ledger: su_kien
        success:
          - type: health
            who: vo
            value: 6
        failure:
          - type: health
            who: vo
            value: -10
        success_result:
          - Thầy cúng lắc chuông suốt buổi chiều. Mấy hôm sau {role.vo.call} ăn được bát cơm. Bạn cũng chẳng biết nhờ đâu.
        failure_result:
          - Hương tàn, chuông lặng. {role.vo.call} vẫn nằm đó, mỗi ngày một hốc hác.
  - id: gd_con_len_dau
    title: Trong xóm có trẻ lên đậu
    tags:
      - gia_dinh
      - benh_tat
    months:
      - 1
      - 2
      - 3
      - 4
    condition:
      var: player.children_count
      op: ">="
      value: 1
    roles:
      - id: con
        from: family
        relation: child
        condition:
          all:
            - var: self.age
              op: between
              value:
                - 1
                - 9
            - var: self.sick
              op: ==
              value: false
      - id: thay
        from: village
        village_role: thay_lang
        optional: true
    weight: 4
    cooldown_years: 5
    tension: 5
    importance: 6
    icon: om
    text:
      - Đầu xóm có hai đứa trẻ lên đậu, nhà ấy đã cắm cành gai trước cổng. Tối nay {role.con.call} kêu nóng đầu, mắt đỏ hoe, không chịu ăn.
    options:
      - id: moi_thay
        text: Mời {role.thay.call} cắt thuốc ngay, để con nằm riêng gian chái (2 quan)
        condition:
          all:
            - role: thay
              exists: true
            - var: household.money
              op: ">="
              value: 2
        chance:
          base: 0.65
        effects:
          - type: money
            value: -2
            ledger: su_kien
        success:
          - type: health
            who: con
            value: 4
        failure:
          - type: add_disease
            disease: dau_mua_soi
            who: con
        success_result:
          - Chỉ là cảm nắng. Mấy thang thuốc, {role.con.call} lại chạy nhảy ngoài sân.
        failure_result:
          - Sáng thứ ba, những nốt đỏ mọc khắp người {role.con.call}. Thầy bảo phải giữ kín gió cả tháng.
      - id: cung_ba_mu
        text: Cúng bà mụ, treo cành gai trước cổng, kiêng người lạ
        trait_stress:
          hoai_nghi: 3
        chance:
          base: 0.4
          modifiers:
            - condition:
                has_trait: mo_dao
              add: 0.1
        effects:
          - type: money
            value: -0.5
            ledger: su_kien
        success:
          - type: stress
            value: -2
        failure:
          - type: add_disease
            disease: dau_mua_soi
            who: con
        success_result:
          - Đêm ấy con ra mồ hôi rồi ngủ yên. Bạn thắp thêm nén hương tạ bà mụ.
        failure_result:
          - Cành gai không ngăn được gì. Mấy hôm sau người {role.con.call} mọc đầy nốt đậu.
      - id: thay_nhau_cham
        text: Cả nhà thay nhau thức, xông lá, chườm khăn
        hint: Hao sức người lớn
        chance:
          base: 0.5
          skill: sinh_ton
          per_level: 0.03
        effects:
          - type: health
            value: -3
          - type: stress
            value: 4
        success:
          - type: health
            who: con
            value: 3
        failure:
          - type: add_disease
            disease: dau_mua_soi
            who: con
        success_result:
          - Ba đêm không chợp mắt. Đến sáng thứ tư, trán {role.con.call} đã mát.
        failure_result:
          - Thức mấy cũng không giữ được. Bệnh đậu đã vào người {role.con.call}.
  - id: gd_day_thang_dat_ten
    title: Lễ đầy tháng
    tags:
      - gia_dinh
      - tin_nguong
    condition:
      var: player.children_count
      op: ">="
      value: 1
    roles:
      - id: be
        from: family
        relation: child
        condition:
          var: self.age
          op: ==
          value: 0
        pick: youngest
      - id: thay
        from: village
        village_role: thay_do
        optional: true
    weight: 5
    cooldown_years: 2
    tension: 2
    importance: 5
    icon: tre_em
    text:
      - "{role.be.call} vừa tròn tháng. Theo lệ phải cúng mười hai bà mụ và khấn báo tên con với tổ tiên. Bà con trong họ lại bàn nên đặt thêm một tên tục thật xấu để gọi ở nhà, cho ma quỷ khỏi để ý."
    options:
      - id: co_day_thang
        text: Làm cỗ đầy tháng mời họ hàng (2 quan, 4 thúng thóc)
        condition:
          all:
            - var: household.money
              op: ">="
              value: 2
            - var: household.food
              op: ">="
              value: 4
        effects:
          - type: money
            value: -2
            ledger: su_kien
          - type: food
            value: -4
            ledger: su_kien
          - type: reputation
            value: 4
          - type: stress
            value: -2
        result:
          - Họ hàng đến chật sân, ai cũng bế thử đứa bé một lần. Cỗ hết, kho vơi, nhưng bạn vui.
      - id: ten_chu
        text: Mang lễ nhờ {role.thay.call} viết tên con vào gia phả bằng nét chữ đẹp (1 quan)
        condition:
          all:
            - role: thay
              exists: true
            - var: household.money
              op: ">="
              value: 1
            - any:
                - var: player.origin
                  op: ==
                  value: quy_toc_nho
                - var: household.career
                  op: ==
                  value: si_tu
        effects:
          - type: money
            value: -1
            ledger: su_kien
          - type: scholarly_prestige
            value: 3
          - type: filial_piety
            value: 2
          - type: opinion
            role: thay
            value: 5
        result:
          - "{role.thay.call} mài mực, viết tên đứa trẻ ngay dưới tên ông nội. Nét chữ vuông vức, mực còn thơm."
      - id: vong_bac
        text: Cúng mụ xong, mua cho con đôi vòng bạc ở phố (1,5 quan)
        condition:
          all:
            - var: household.career
              op: ==
              value: thuong_nhan
            - var: household.money
              op: ">="
              value: 1.5
        effects:
          - type: money
            value: -1.5
            ledger: su_kien
          - type: reputation
            value: 2
          - type: stress
            value: -3
        result:
          - Đôi vòng bạc nhỏ xíu kêu lanh canh trên cổ chân đứa bé. Khách quen qua sạp ai cũng hỏi.
      - id: ten_tuc
        text: Đặt một cái tên tục thật xấu để gọi ở nhà cho dễ nuôi
        trait_stress:
          hoai_nghi: 2
        effects:
          - type: money
            value: -0.3
            ledger: su_kien
          - type: stress
            value: -2
        result:
          - Từ hôm ấy cả nhà gọi đứa bé bằng cái tên tục nghe đến buồn cười. Tên thật thì để dành khấn tổ tiên.
      - id: cung_gian_don
        text: Một đĩa xôi, một con gà, cúng mụ trong nhà
        effects:
          - type: food
            value: -1
            ledger: su_kien
          - type: filial_piety
            value: 1
        result:
          - Mâm cúng nhỏ đặt giữa giường. Bạn khấn khe khẽ, đứa bé ngủ ngon không biết gì.
  - id: gd_con_chon_duong
    title: Con đến tuổi chọn đường
    tags:
      - gia_dinh
      - hoc_hanh
      - nghe_nghiep
    life_stages:
      - lap_nghiep
      - trung_nien
    roles:
      - id: con
        from: family
        relation: child
        condition:
          var: self.age
          op: between
          value:
            - 13
            - 16
    weight: 5
    cooldown_years: 4
    tension: 3
    importance: 6
    icon: sach
    text:
      - "{role.con.call} đã mười mấy tuổi, vai gần ngang vai bạn. Ăn cơm xong, đứa trẻ ngồi lại, ngập ngừng hỏi đời mình rồi sẽ đi theo đường nào."
    options:
      - id: tro_hoc_tran
