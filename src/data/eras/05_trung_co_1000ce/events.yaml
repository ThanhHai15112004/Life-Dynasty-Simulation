    weight: 3
    weight_modifiers:
      - condition:
          var: player.origin
          op: in
          value:
            - thuong_nhan
            - quy_toc_nho
        factor: 1.5
    once_per_life: true
    tension: 8
    importance: 9
    icon: tre_em
    text:
      - Một người đàn bà lam lũ dắt đứa trẻ chừng mười tuổi đứng trước cổng. Chị ta nói đứa bé là con bạn, từ chuyến đi xa năm nào. Đứa trẻ có cái nốt ruồi sau tai, y như bạn. Chị ta sắp đi ở cho nhà người ta, không nuôi nổi con nữa.
      - "{role.vc.call} đứng sau bức bình phong, mặt trắng bệch. Hàng xóm đã bắt đầu tụ ở bờ rào."
    options:
      - id: nhan_ve
        text: Nhận đứa trẻ về nhà, cho mang họ mình
        hint: Trọn đạo làm cha, nhưng {role.vc.call} sẽ không dễ tha thứ
        trait_stress:
          than_trong: 4
        effects:
          - type: adopt_child
          - type: opinion
            role: vc
            value: -35
          - type: reputation
            group: dan_lang
            value: -8
          - type: stress
            value: 15
          - type: filial_piety
            value: 4
        result:
          - Đứa trẻ bước qua ngưỡng cửa, nép vào chân bạn. {role.vc.call} quay vào buồng, đóng cửa. Bữa cơm tối ấy có thêm một cái bát, và thiếu một người.
      - id: cho_tien_bao_di
        text: Kín đáo đưa 25 quan, bảo hai mẹ con đi nơi khác
        hint: Giữ yên trong nhà nếu không ai biết; lộ ra thì mang tiếng bạc tình
        condition:
          var: household.money
          op: ">="
          value: 25
        trait_stress:
          nhan_tu: 6
          trong_gia_dinh: 4
        effects:
          - type: money
            value: -25
            ledger: su_kien
          - type: stress
            value: 10
        chance:
          base: 0.5
          skill: muu_luoc
          per_level: 0.05
        success:
          - type: set_flag
            flag: bn_con_roi_xa
            years: 20
            label: Đứa con rơi ở phương xa
        failure:
          - type: opinion
            role: vc
            value: -35
          - type: reputation
            group: dan_lang
            value: -15
          - type: stress
            value: 12
        success_result:
          - Hai mẹ con đi lúc trời chưa sáng. Đứa trẻ ngoái lại nhìn cái cổng nhà bạn một lần. Bạn đứng sau rặng râm bụt, không bước ra.
        failure_result:
          - Người đàn bà khóc lóc giữa ngõ, kể cho cả xóm rằng bạn đuổi con đi bằng mấy xâu tiền. {role.vc.call} biết chuyện từ miệng hàng xóm, chứ không phải từ bạn.
      - id: choi_bo
        text: Chối, đóng cổng, bảo chị ta nhận nhầm người
        hint: Không tốn một đồng, nhưng có những đứa trẻ lớn lên sẽ nhớ
        trait_stress:
          nhan_tu: 10
          trong_gia_dinh: 6
        effects:
          - type: stress
            value: 18
          - type: opinion
            role: vc
            value: -10
          - type: reputation
            group: dan_lang
            value: -10
          - type: set_flag
            flag: bn_choi_con_roi
            years: 25
            label: Đứa con không nhận
        result:
          - Cánh cổng đóng sập. Người đàn bà đứng ngoài đến chiều rồi dắt con đi. {role.vc.call} không hỏi gì, mà như thế còn khó chịu hơn. Đêm nào bạn cũng nhớ cái nốt ruồi sau tai.
      - id: thu_that
        text: Gọi {role.vc.call} ra, quỳ xuống nhận lỗi, xin cùng quyết định
        hint: Nói thật có khi được bao dung; có khi mất luôn cả hai bên
        chance:
          base: 0.4
          skill: ngoai_giao
          per_level: 0.05
        success:
          - type: adopt_child
          - type: opinion
            role: vc
            value: -8
          - type: stress
            value: -4
        failure:
          - type: opinion
            role: vc
            value: -40
          - type: stress
            value: 18
          - type: reputation
            group: dan_lang
            value: -10
        success_result:
          - '{role.vc.call} im lặng rất lâu, rồi đi ra cổng, cúi xuống lau mặt cho đứa trẻ: "Vào ăn cơm đi con." Chuyện ấy, cả đời {role.vc.call} không nhắc lại lần nào.'
        failure_result:
          - "{role.vc.call} nghe xong, đứng dậy thu xếp tay nải về nhà mẹ đẻ. Người đàn bà lạ cũng dắt con đi. Ngôi nhà bỗng rộng thênh thang."
  - id: bn_chau_gay_an_mang
    title: Đứa con gây án mạng ở hội làng
    tags:
      - gia_dinh
      - nguy_hiem
      - lang_xa
    life_stages:
      - trung_nien
      - tuoi_gia
    condition:
      all:
        - var: player.is_head
          op: ==
          value: true
        - var: player.age
          op: ">="
          value: 45
    roles:
      - id: ke
        from: family
        relation: child
        condition:
          all:
            - var: self.sex
              op: ==
              value: m
            - var: self.age
              op: between
              value:
                - 16
                - 32
            - var: self.in_household
              op: ==
              value: true
      - id: ly
        from: village
        village_role: ly_truong
    weight: 3
    weight_modifiers:
      - condition:
          has_trait: nong_nay
          who: ke
        factor: 2.5
    once_per_life: true
    tension: 10
    importance: 10
    icon: tang
    text:
      - Hội vật làng bên, {role.ke.call} uống rượu rồi xô xát với mấy gã làng ấy. Một cú đẩy, gã kia ngã đập đầu vào cối đá, chết ngay giữa sân. Bây giờ {role.ke.call} đang bị trói ở đình làng người ta, họ đòi giải lên huyện xử tội chết.
      - '{role.ly.call} đến báo tin, giọng run run: "Án mạng thì quan không tha. Muốn giữ đầu nó, chỉ có tiền hoặc có người chịu thay."'
    options:
      - id: ban_ruong_chay_an
        text: Bán hai sào ruộng, lo tiền xóa án và đền mạng
        hint: Giữ được người, nhưng mất phần lớn cơ nghiệp
        condition:
          var: household.farmland
          op: ">="
          value: 2
        effects:
          - type: property_remove
            property: ruong
            count: 2
          - type: opinion
            role: ke
            value: 25
          - type: reputation
            group: dan_lang
            value: -15
          - type: stress
            value: 18
          - type: health
            value: -8
        result:
          - Văn tự hai sào ruộng tốt nhất đặt lên án thư nhà quan. Án được ghi thành "lỡ tay ngộ sát", đền tiền cho nhà người chết. {role.ke.call} được thả về, quỳ ở sân suốt một đêm.
      - id: nop_tien_chay_an
        text: Mở tráp, bỏ 60 quan lo lót và đền mạng
        hint: Gần như sạch tích lũy, nhưng giữ được ruộng
        condition:
          var: household.money
          op: ">="
          value: 60
        effects:
          - type: money
            value: -60
            ledger: su_kien
          - type: opinion
            role: ke
            value: 25
          - type: reputation
            group: dan_lang
            value: -12
          - type: stress
            value: 15
        result:
          - Từng xâu tiền đổi thành một chữ "ngộ". Nhà người chết nhận tiền, không làm khó. Cái tráp gỗ trống rỗng, nhẹ như không.
      - id: de_phep_nuoc
        text: Để phép nước xử, nhà không lo lót
        hint: Giữ của, giữ đạo; nhưng con có thể không về
        trait_stress:
          trong_gia_dinh: 12
        effects:
          - type: health
            who: ke
            value: -35
          - type: modifier
            target: health.monthly
            value: -1.2
            months: 24
            label: Ngồi ngục huyện
            who: ke
          - type: modifier
            target: death_risk
            value: 3
            op: mul
            months: 24
            label: Ngồi ngục huyện
            who: ke
          - type: opinion
            role: ke
            value: -40
          - type: reputation
            group: dan_lang
            value: 8
          - type: stress
            value: 25
        result:
          - Quan xử trượng một trăm, giam hai năm. {role.ke.call} bị khiêng ra khỏi công đường, lưng máu thấm qua áo. Lần thăm ngục đầu tiên, nó không nhìn bạn.
      - id: nhan_toi_thay
        text: Tự lên huyện nhận là mình xúi con đánh, xin chịu tội thay
        hint: Con được tha; người già vào ngục thì khó mà ra
        trait_stress:
          than_trong: 6
        effects:
          - type: set_flag
            flag: bn_ngoi_tu
            years: 3
            label: Ngồi ngục thay con trong vụ án mạng
          - type: health
            value: -35
          - type: stress
            value: 20
          - type: opinion
            role: ke
            value: 40
          - type: modifier
            target: health.monthly
            value: -1.2
            months: 36
            label: Già cả ngồi ngục huyện
          - type: modifier
            target: death_risk
            value: 3
            op: mul
            months: 36
            label: Già cả ngồi ngục huyện
          - type: reputation
            group: dan_lang
            value: 5
        result:
          - Quan nhìn người già tóc bạc quỳ dưới công đường, lắc đầu mà vẫn phải xử. Gông đeo lên cổ nặng trịch. {role.ke.call} đứng ngoài hàng rào nha môn, khóc như đứa trẻ lên ba.
      - id: dem_tron
        text: Đêm ấy cho người cắt dây, đưa {role.ke.call} trốn đi thật xa
        hint: Con thoát chết, nhưng mất con và nhà mang tội chứa chấp
        effects:
          - type: leave_household
            who: ke
          - type: opinion
            role: ke
            value: 15
          - type: money
            value:
              var: household.money
              factor: -0.3
              max: 0
              min: -30
            ledger: su_kien
          - type: reputation
            group: dan_lang
            value: -20
          - type: wanted
            value: 15
          - type: stress
            value: 20
          - type: set_flag
            flag: bn_con_tron_an
            years: 20
            label: "{role.ke.call} trốn án mạng phương xa"
        result:
          - Con thuyền nhỏ rời bến lúc canh tư, không đèn. {role.ke.call} ôm bọc tiền, cúi lạy về phía bạn rồi đẩy sào. Từ đó, Tết nào nhà cũng để thừa một đôi đũa.
  - id: cn2_tt_li_xi_tet
    title: Phong bao lì xì
    tags:
      - gia_dinh
      - le_hoi
    life_stages:
      - thieu_thoi
    months:
      - 1
      - 2
    weight: 5
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: tet
    text:
      - 'Sáng mùng Một, ông bà dúi vào tay bạn mấy đồng tiền xu buộc dây đỏ: "Lấy may cả năm, con nhé."'
    options:
      - id: cat_di
        text: Cất vào ống tre, để dành
        default: true
        effects:
          - type: own_money
            value: 0.3
            ledger: li_xi
        result:
          - Ống tre treo đầu giường kêu leng keng mỗi khi bạn lắc.
      - id: mua_phao
        text: Ra đầu ngõ mua pháo tép đốt với lũ bạn
        effects:
          - type: own_money
            value: 0.1
            ledger: li_xi
          - type: stress
            value: -3
        result:
          - Pháo nổ lép bép, khói khét lẹt, bạn cười đến đau cả bụng.
  - id: cn2_tt_mo_oc_ban
    title: Mò ốc ngoài đồng
    tags:
      - ruong_dong
      - lao_dong
    life_stages:
      - thieu_thoi
    months:
      - 6
      - 7
      - 8
    condition:
      var: world.settlement_type
      op: ==
      value: lang_nong
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: ca
    text:
      - Nước ruộng lên, ốc bươu bò kín bờ. Bạn mò được đầy một giỏ, bà hàng xén ngoài chợ hỏi mua.
    options:
      - id: ban
        text: Bán cho bà hàng xén lấy mấy đồng
        effects:
          - type: own_money
            value: 0.2
            ledger: tien_cong
        result:
          - Lần đầu tiên bạn tự kiếm ra tiền. Đồng xu nóng hổi trong lòng bàn tay.
      - id: mang_ve
        text: Mang về cho mẹ nấu canh
        default: true
        effects:
          - type: food
            value: 0.5
          - type: filial_piety
            value: 1
        result:
          - Tối ấy nồi canh ốc chua thơm cả gian bếp. Mẹ xoa đầu bạn.
  - id: cn2_tt_nhat_dong_xu
    title: Đồng xu dưới gốc đa
    tags:
      - lang_xa
    life_stages:
      - thieu_thoi
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: tien
    text:
      - Chơi trốn tìm dưới gốc đa, bạn nhặt được một xâu tiền rơi trong rễ cây. Chắc của ai đi chợ đánh rơi.
    options:
      - id: tra_lai
        text: Mang lên đình nhờ ông từ tìm người mất
        default: true
        effects:
          - type: reputation
            group: dan_lang
            value: 2
        result:
          - Bà cụ đầu xóm đến nhận, cảm ơn mãi, còn cho bạn một quả na.
      - id: giu_lay
        text: Lặng lẽ giữ lấy
        trait_stress:
          nhan_tu: 2
        effects:
          - type: own_money
            value: 0.4
            ledger: su_kien
        result:
          - Xâu tiền nằm sâu trong ống tre. Mỗi lần nghe ai kể mất tiền, bạn lại thấy chột dạ.
  - id: cn2_tt_chan_trau_ho
    title: Chăn trâu thuê
    tags:
      - ruong_dong
      - lao_dong
    life_stages:
      - thieu_thoi
    condition:
      all:
        - var: player.age
          op: ">="
          value: 9
        - var: world.settlement_type
          op: ==
          value: lang_nong
    roles:
      - id: xom
        from: village
        village_role: hang_xom
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: trau
    text:
      - "{role.xom.call} bận đi phu, nhờ bạn chăn hộ con trâu một tháng, trả công mấy đồng."
    options:
      - id: nhan
        text: Nhận lời, sáng sớm dắt trâu ra bãi
        effects:
          - type: own_money
            value: 0.3
            ledger: tien_cong
          - type: opinion
            role: xom
            value: 4
          - type: skill_xp
            skill: sinh_ton
            value: 6
        result:
          - Một tháng lưng trâu, bạn đen nhẻm, túi rủng rỉnh.
      - id: tu_choi
        text: Thôi, còn phải học bài và trông em
        default: true
        result:
          - "{role.xom.call} cười bảo không sao, để nhờ đứa khác."
  - id: cn2_tt_keo_keo
    title: Ông bán kẹo kéo
    tags:
      - lang_xa
    life_stages:
      - thieu_thoi
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 1
    icon: cuoi
    text:
      - Ông bán kẹo kéo gõ phách đi qua ngõ, lũ trẻ chạy theo cả đàn. Mẩu kẹo trắng ngà kéo dài mãi không đứt.
    options:
      - id: mua
        text: Lấy tiền riêng mua một mẩu
        condition:
          var: player.own_money
          op: ">="
          value: 0.05
        effects:
          - type: own_money
            value: -0.05
            ledger: mua_sam
          - type: stress
            value: -2
        result:
          - Kẹo ngọt dính răng, bạn nhai chậm cho lâu hết.
      - id: dung_nhin
        text: Đứng nhìn lũ bạn ăn
        default: true
        result:
          - Bạn nuốt nước bọt, tự nhủ để dành tiền mua thứ khác.
  - id: cn2_tt_hoc_chu_dem
    title: Đèn dầu học chữ
    tags:
      - hoc_hanh
      - gia_dinh
    life_stages:
      - thieu_thoi
    condition:
      var: player.age
      op: ">="
      value: 8
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: sach
    text:
      - Tối ấy bạn xin mẹ thắp thêm đĩa dầu lạc để tập viết mấy chữ thầy đồ dạy. Dầu lạc thì đắt.
    options:
      - id: thap_den
        text: Thắp đèn ngồi tập đến khuya
        effects:
          - type: money
            value: -0.05
          - type: skill_xp
            skill: hoc_van
            value: 10
        result:
          - Ngọn đèn leo lét, chữ "Nhân" viết đi viết lại đến khi ngay hàng.
      - id: tap_than
        text: Lấy que viết xuống nền đất dưới trăng
        default: true
        effects:
          - type: skill_xp
            skill: hoc_van
            value: 4
        result:
          - Trăng sáng, nét chữ ngoằn ngoèo trên sân đất. Gió thổi là bay mất.
  - id: cn2_tt_ve_dieu_sao
    title: Con diều sáo
    tags:
      - lang_xa
      - le_hoi
    life_stages:
      - thieu_thoi
    months:
      - 5
      - 6
      - 7
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 1
    icon: dieu
    text:
      - Gió nồm thổi lồng lộng. Anh lớn trong xóm chuốt được cái sáo diều kêu vi vu, bảo bán cho bạn.
    options:
      - id: mua_sao
        text: Đổi hết tiền riêng lấy cái sáo
        condition:
          var: player.own_money
          op: ">="
          value: 0.15
        effects:
          - type: own_money
            value: -0.15
            ledger: mua_sam
          - type: stress
            value: -4
        result:
          - Diều nhà bạn lên cao nhất bãi, tiếng sáo vọng về tận đầu làng.
      - id: tu_lam
        text: Tự vót tre làm lấy
        default: true
        effects:
          - type: skill_xp
            skill: sinh_ton
            value: 4
        result:
          - Cái sáo tự làm kêu khàn khàn, nhưng là của mình.
  - id: cn2_tt_em_be_khoc
    title: Trông em
    tags:
      - gia_dinh
    life_stages:
      - thieu_thoi
    condition:
      var: household.members
      op: ">="
      value: 5
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: tre_em
    text:
      - Cha mẹ ra đồng từ sớm, để bạn ở nhà trông đứa em nhỏ. Lũ bạn thì í ới gọi ra bờ sông tắm.
    options:
      - id: o_nha
        text: Ở nhà ru em ngủ
        default: true
        effects:
          - type: filial_piety
            value: 2
          - type: stress
            value: 1
        result:
          - Em ngủ ngon trên võng. Chiều mẹ về, khen bạn đã lớn.
      - id: cong_em_di
        text: Cõng em ra bờ sông chơi cùng
        effects:
          - type: stress
            value: -2
        result:
          - Em cười khanh khách. Về nhà cả hai lấm lem, bị mẹ mắng một trận.
  - id: cn2_nl_gat_thue
    title: Gặt thuê mùa vụ
    tags:
      - ruong_dong
      - lao_dong
    life_stages:
      - thanh_nien
      - lap_nghiep
    months:
      - 5
      - 10
    condition:
      var: world.settlement_type
      op: ==
      value: lang_nong
    roles:
      - id: bh
        from: village
        village_role: ba_ho
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: cay_lua
    text:
      - 'Ruộng nhà {role.bh.call} chín rộ mà thiếu người gặt. Quản gia đứng đầu bờ gọi: "Ai gặt đỡ ba ngày, trả công tiền mặt!"'
    options:
      - id: di_gat
        text: Xắn quần lội xuống gặt thuê
        effects:
          - type: own_money
            value: 0.8
            ledger: tien_cong
          - type: health
            value: -1
          - type: skill_xp
            skill: sinh_ton
            value: 8
        result:
          - Ba ngày lưng còng dưới nắng, đổi lại mấy tiền công nằm gọn trong túi.
      - id: o_nha
        text: Ruộng nhà còn chưa gặt xong
        default: true
        result:
          - Bạn lắc đầu, quay về với mấy sào lúa nhà mình.
  - id: cn2_nl_cau_doi_tet
    title: Viết câu đối Tết
    tags:
      - hoc_hanh
      - le_hoi
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    months:
      - 12
      - 1
    condition:
      var: player.skill.hoc_van
      op: ">="
      value: 3
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: sach
    text:
      - Giáp Tết, người làng nhờ bạn viết câu đối dán cột. Mấy nhà khá giả còn ngỏ ý trả tiền mực giấy.
    options:
      - id: ban_chu
        text: Bày chõng ra chợ viết thuê
        effects:
          - type: own_money
            value: 0.6
            ledger: tien_cong
          - type: skill_xp
            skill: hoc_van
            value: 6
        result:
          - Chữ bạn bay bổng, mấy cặp câu đối được người ta khen nức nở.
      - id: viet_cho
        text: Viết cho không, coi như lấy phúc
        default: true
        effects:
          - type: reputation
            group: dan_lang
            value: 2
          - type: scholarly_prestige
            value: 1
        result:
          - Nhà nào trong xóm cũng có câu đối do tay bạn viết.
  - id: cn2_nl_di_phu_dap_de
    title: Đi phu đắp đê
    tags:
      - lao_dong
      - lang_xa
    life_stages:
      - thanh_nien
      - lap_nghiep
    months:
      - 1
      - 2
      - 11
      - 12
    roles:
      - id: ly
        from: village
        village_role: ly_truong
    weight: 3
    once_per_life: true
    minor: true
    tension: 2
    importance: 2
    icon: lu
    text:
      - "{role.ly.call} gõ mõ gọi trai tráng đi phu đắp đê. Nhà nào không đi thì nộp tiền thay người."
    options:
      - id: di_phu
        text: Vác mai lên đê
        default: true
        effects:
          - type: health
            value: -2
          - type: reputation
            group: dan_lang
            value: 2
        result:
          - Nửa tháng gánh đất dưới gió bấc, vai bạn chai sạn thêm một lớp.
      - id: nop_tien
        text: Bỏ tiền riêng nộp thay người
        condition:
          var: player.own_money
          op: ">="
          value: 0.5
        effects:
          - type: own_money
            value: -0.5
            ledger: su_kien
        result:
          - Ông lý ghi tên bạn vào sổ "đã nộp". Không phải đi, nhưng túi vơi hẳn.
  - id: cn2_nl_choi_ho
    title: Chơi họ trong xóm
    tags:
      - lang_xa
      - kinh_te
