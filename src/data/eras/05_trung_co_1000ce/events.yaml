      all:
        - var: player.is_head
          op: ==
          value: true
        - var: player.mourning_months
          op: ">"
          value: 0
    text:
      - Khói hương trên bàn thờ chưa kịp nguội, sổ sách và chìa khóa rương đã nằm trong tay bạn. Ngoài sân, mấy người trong họ cùng chủ nợ, tá điền kéo đến dò xét xem người chủ mới của Đời thứ {dynasty.generation} họ {dynasty.family_name} sẽ điều hành cơ ngơi ra sao.
    options:
      - id: nhan_nhin_mem_mong
        text: Nén lòng nhẫn nhịn, ăn nói mềm mỏng để giữ hòa khí trong ngoài
        trait_stress:
          nong_nay: 12
        effects:
          - type: filial_piety
            value: 5
          - type: reputation
            group: dan_lang
            value: 5
          - type: dynasty_prestige
            value: 4
        result:
          - Dù có kẻ buông lời cậy thế bậc trưởng bối, bạn vẫn điềm tĩnh đối đáp đâu ra đấy. Ai nấy đều nể sự chín chắn của chủ hộ mới.
      - id: dap_ban_ran_de
        text: Đập bàn dằn mặt những kẻ định nhân lúc tang gia bối rối mà lấn lướt
        trait_stress:
          kien_nhan: 10
          nhan_tu: 8
        effects:
          - type: stress
            value: -6
          - type: reputation
            group: dan_lang
            value: -3
          - type: skill_xp
            skill: muu_luoc
            value: 18
        result:
          - Tiếng quát đanh thép của bạn khiến cả gian nhà im phăng phắc. Kẻ có ý đồ xấu phải cụp mắt rút lui, không ai dám xem thường chủ mới.
      - id: chấn_chỉnh_so_sach
        text: Khép cửa kiểm kê ruộng đất, thóc lúa và phân công lại việc nhà
        effects:
          - type: skill_xp
            skill: quan_tri
            value: 22
          - type: food
            value: 8
        result:
          - Bạn thức trắng đêm bên ngọn đèn dầu rà soát từng sào ruộng, từng thúng thóc, lập lại trật tự rõ ràng cho gia đình.
  - id: gd_di_nguyen_cha_ong
    title: Di nguyện còn dang dở của tiền nhân
    tags:
      - gia_dinh
      - hoc_tap
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    cooldown_years: 8
    once_per_life: true
    weight: 2.5
    condition:
      all:
        - var: dynasty.has_unfulfilled_wish
          op: ==
          value: true
        - var: player.age
          op: ">="
          value: 18
    text:
      - 'Đêm thanh vắng, bạn mở chiếc tráp gỗ cũ của {dynasty.wish_from}, đọc lại dòng chữ dặn dò con cháu về tâm nguyện chưa thành: "{dynasty.wish_text}". Ánh đèn dầu hắt lên bài vị tổ tiên như nhắc nhở trách nhiệm của người kế nghiệp.'
    options:
      - id: the_hoan_thanh
        text: Thề trước bàn thờ sẽ dốc sức hoàn thành tâm nguyện của tiền nhân
        effects:
          - type: filial_piety
            value: 8
          - type: dynasty_prestige
            value: 6
          - type: skill_xp
            skill: quan_tri
            value: 15
        result:
          - Bạn kính cẩn vái lạy trước bàn thờ. Ý chí nối nghiệp tổ tiên tiếp thêm sức mạnh cho bạn trên chặng đường phía trước.
      - id: hoan_thanh_ngay_bang_cua_cai
        text: Xuất 15 quan tiền tích lũy để thực hiện ngay di nguyện của cha ông
        condition:
          var: household.money
          op: ">="
          value: 15
        effects:
          - type: money
            value: -15
          - type: fulfill_wish
          - type: filial_piety
            value: 10
          - type: stress
            value: -10
        result:
          - Dùng số của cải chắt chiu được, bạn hoàn tất trọn vẹn di nguyện "{dynasty.wish_text}", tiếng thơm hiếu nghĩa vang khắp vùng.
      - id: tuy_duyen_lo_truoc_mat
        text: Cất kỹ vào tráp, ưu tiên lo miếng cơm manh áo cho người đang sống trước
        effects:
          - type: stress
            value: -4
          - type: filial_piety
            value: -3
        result:
          - Bạn khép tráp lại. Người khuất đã khuất, việc cấp bách trước mắt vẫn là giữ cho gia đình hiện tại được ấm no.
  - id: gd_nhan_con_nuoi_noi_doi
