# ══════════════════════════════════════════════════════════════════════════════
# MỐC 05: TRUNG ĐẠI THỊNH KỲ (1000 CN — trung_co_1000ce)
# Kho sự kiện quyết định (Decision Events) của Thời Trung Đại / Phong Kiến.
# ══════════════════════════════════════════════════════════════════════════════
events:
  - id: bn_cha_nga_mai_dinh
    title: Cha ngã từ mái đình
    tags:
      - gia_dinh
      - nguy_hiem
      - benh_tat
    life_stages:
      - thieu_thoi
    condition:
      var: player.age
      op: between
      value:
        - 9
        - 15
    roles:
      - id: cha
        from: family
        relation: father
        condition:
          all:
            - var: self.in_household
              op: ==
              value: true
            - var: self.health
              op: ">="
              value: 40
            - var: self.age
              op: <
              value: 60
    weight: 4
    once_per_life: true
    tension: 8
    importance: 9
    icon: om
    text:
      - Làng thay ngói đình trước hội, {role.cha.call} được cử lên mái vì nhẹ người và quen trèo. Đang nối kèo thì thanh tre gãy. Người ta khiêng {role.cha.call} về trên tấm phản, mặt tái như tàu lá, hai chân không cựa được.
      - 'Thầy lang nắn lưng {role.cha.call} một hồi rồi lắc đầu: "Gãy xương sống. Sống được, nhưng cày bừa thì chưa biết bao giờ." Mẹ ngồi bệt dưới hiên, nhìn ra mấy sào ruộng chưa cày ải. Bạn mới {player.age} tuổi.'
    options:
      - id: thay_cha_cay
        text: Gác sách vở, thay {role.cha.call} cầm cày
        hint: Nhà có người làm, nhưng bạn bỏ dở chữ nghĩa và tuổi nhỏ thì gánh không nổi lâu
        trait_stress:
          tu_do: 5
        effects:
          - type: health
            who: cha
            value: -30
          - type: health
            value: -12
          - type: stress
            value: 10
          - type: skill_xp
            skill: sinh_ton
            value: 45
          - type: filial_piety
            value: 12
          - type: opinion
            role: cha
            value: 25
          - type: modifier
            target: xp.hoc_van
            value: 0.6
            op: mul
            months: 48
            label: Bỏ học thay cha cày ruộng
          - type: set_flag
            flag: bn_bo_hoc_thay_cha
            years: 4
            label: Bỏ học thay cha làm trụ cột nhà
        result:
          - Con trâu cao hơn đầu bạn. Ngày đầu bạn ngã sấp mặt xuống bùn ba lần, người cả xóm đứng bờ ruộng mà cười. Đến cuối tháng thì không ai cười nữa. {role.cha.call} nằm trong buồng, nghe tiếng bạn quát trâu mà quay mặt vào vách.
      - id: lam_thue_lay_tien_thuoc
        text: Đi chăn trâu, gánh nước thuê nhà giàu, gom tiền mua thuốc cốt toái bổ
        hint: Thuốc tốt có khi cứu được lưng cha, nhưng nhà giàu đâu dễ trả công đứa trẻ
        effects:
          - type: health
            who: cha
            value: -30
          - type: health
            value: -8
          - type: stress
            value: 8
        chance:
          base: 0.45
          skill: ngoai_giao
          per_level: 0.05
        success:
          - type: health
            who: cha
            value: 20
          - type: filial_piety
            value: 10
          - type: opinion
            role: cha
            value: 20
          - type: skill_xp
            skill: ngoai_giao
            value: 25
        failure:
          - type: health
            value: -12
          - type: stress
            value: 10
          - type: filial_piety
            value: 4
        success_result:
          - Ba tháng chăn trâu, bạn ôm về được mấy gói thuốc rễ cây bọc lá chuối. Đến Tết, {role.cha.call} chống gậy ra được tới ngõ. Mẹ khóc, bạn cũng khóc.
        failure_result:
          - Nhà giàu cứ khất công, cuối cùng chỉ trả bằng mấy bát gạo mốc. Bạn bị con trâu húc ngã giữa đồng, về nằm sốt hai hôm. Thuốc thì vẫn chưa mua được.
      - id: vay_moi_thay_huyen
        text: Xin mẹ cầm chiếc vòng bạc, vay thêm, mời ông lang nắn xương trên huyện
        hint: Nhà gánh thêm 22 quan nợ; ông lang giỏi cũng có lúc nắn hỏng
        effects:
          - type: health
            who: cha
            value: -30
          - type: debt
            value: 22
            ledger: thuoc_men
          - type: stress
            value: 6
        chance:
          base: 0.55
        success:
          - type: health
            who: cha
            value: 28
          - type: opinion
            role: cha
            value: 15
        failure:
          - type: health
            who: cha
            value: -15
          - type: stress
            value: 12
        success_result:
          - Ông lang huyện đặt {role.cha.call} nằm sấp, hai tay ấn mạnh một cái nghe rắc. {role.cha.call} kêu lên một tiếng rồi lịm đi. Nửa năm sau, {role.cha.call} lại ra đồng được, tuy không còn gánh nặng như xưa.
        failure_result:
          - Nắn xong, chân {role.cha.call} sưng tím rồi chảy mủ. Ông lang huyện cầm tiền đi từ hôm ba, không quay lại. Nợ thì vẫn còn nguyên trong sổ.
      - id: len_chua_cau
        text: Theo bà lên chùa, khấn nguyện ăn chay trăm ngày cầu cho cha
        hint: Không tốn bao tiền, nhưng ruộng nhà bỏ hoang một vụ
        effects:
          - type: health
            who: cha
            value: -30
          - type: health
            value: -6
          - type: filial_piety
            value: 8
          - type: modifier
            target: harvest.yield
            value: 0.6
            op: mul
            months: 6
            label: Ruộng không ai cày cấy
        chance:
          base: 0.25
        success:
          - type: health
            who: cha
            value: 12
          - type: stress
            value: -6
        failure:
          - type: health
            who: cha
            value: -8
          - type: stress
            value: 8
        success_result:
          - Trăm ngày chay tịnh, bạn gầy rộc. Sáng hôm ấy {role.cha.call} tự ngồi dậy được, gọi bạn lại xoa đầu. Bà bảo là Phật thương. Bạn không dám nghĩ khác.
        failure_result:
          - Hương khói trăm ngày mà {role.cha.call} vẫn nằm đó, lưng loét dần. Ruộng bỏ cỏ mọc ngang người. Mùa ấy nhà ăn độn khoai từ tháng Chạp.
  - id: bn_di_o_do_tru_no
    title: Đi ở đợ trừ nợ
    tags:
      - gia_dinh
      - no_nan
      - lang_xa
    life_stages:
      - thieu_thoi
    condition:
      all:
        - var: player.age
          op: between
          value:
            - 9
            - 15
        - any:
            - var: household.debt
              op: ">="
              value: 15
            - all:
                - var: household.money
                  op: <
                  value: 3
                - var: household.food_months
                  op: <
                  value: 2
    roles:
      - id: cm
        from: family
        relation: parent
        pick: oldest
      - id: ba_ho
        from: village
        village_role: ba_ho
    weight: 5
    once_per_life: true
    tension: 7
    importance: 8
    icon: no
    text:
      - "Tối ấy {role.cm.call} gọi bạn lại bên bếp, mãi không nói được câu nào. Mãi sau mới bảo: {role.ba_ho.call} cần một đứa trẻ chăn trâu, quét sân, ở hẳn bên ấy ba năm. Ba năm công ấy trừ được món nợ đang đè cả nhà."
      - "Nhà đã hết thóc, nợ thì lãi mẹ đẻ lãi con. {role.ba_ho.call} ngỏ ý: cho đứa lớn sang nhà ông ở đợ ba năm, ông xóa bớt nợ. {role.cm.call} nhìn bạn, mắt đỏ hoe."
    options:
      - id: chiu_di_o
        text: Gật đầu, ôm bọc quần áo sang nhà {role.ba_ho.call}
        hint: Nhà bớt 25 quan nợ; ba năm bạn ăn cơm thừa, ngủ chuồng trâu
        trait_stress:
          tu_do: 8
        effects:
          - type: debt
            value: -25
            ledger: tra_no
          - type: health
            value: -10
          - type: stress
            value: 15
          - type: filial_piety
            value: 15
          - type: opinion
            role: cm
            value: 20
          - type: skill_xp
            skill: sinh_ton
            value: 40
          - type: modifier
            target: health.monthly
            value: -0.3
            months: 36
            label: Ở đợ nhà {role.ba_ho.call}
          - type: modifier
            target: xp.sinh_ton
            value: 1.3
            op: mul
            months: 36
            label: Ở đợ nhà {role.ba_ho.call}
          - type: set_flag
            flag: bn_di_o_do
            years: 3
            label: Đi ở đợ nhà {role.ba_ho.call} trừ nợ
        result:
          - Sáng hôm sau, bạn đi sau lưng người quản gia nhà {role.ba_ho.call}, không dám ngoái lại. Đêm đầu tiên nằm trên ổ rơm cạnh chuồng trâu, bạn nghe tiếng con trâu nhai mà nhớ nhà đến quặn ruột.
      - id: xin_lam_gap_doi
        text: Quỳ xin ở lại, hứa ngày làm ruộng, đêm đan rổ đan rá trả nợ dần
        hint: Giữ được bạn ở nhà, nhưng sức đứa trẻ có hạn
        effects:
          - type: health
            value: -10
          - type: stress
            value: 10
        chance:
          base: 0.4
          skill: sinh_ton
          per_level: 0.06
        success:
          - type: debt
            value: -12
            ledger: tra_no
          - type: skill_xp
            skill: sinh_ton
            value: 35
          - type: opinion
            role: cm
            value: 15
        failure:
          - type: health
            value: -15
          - type: debt
            value: 6
          - type: stress
            value: 10
        success_result:
          - Suốt một năm, đêm nào bạn cũng ngồi đan đến khi đèn cạn dầu. Rổ rá gánh ra chợ, từng đồng nhét vào ống tre. Đến cuối năm, món nợ vơi được một phần. {role.cm.call} không nói gì, chỉ gắp cho bạn miếng cá to nhất.
        failure_result:
          - Bạn đổ bệnh giữa mùa gặt. Rổ rá đan dở chất góc nhà, nợ thì cộng thêm lãi. {role.ba_ho.call} cho người sang nhắc, lần này giọng đã khác.
      - id: tron_theo_thuyen
        text: Đêm ấy lẻn ra bến, xin theo thuyền buôn đi xa kiếm sống
        hint: Thoát cảnh ở đợ, nhưng bỏ cha mẹ lại giữa lúc ngặt nghèo
        trait_stress:
          trong_gia_dinh: 10
          than_trong: 5
        effects:
          - type: opinion
            role: cm
            value: -35
          - type: filial_piety
            value: -15
          - type: debt
            value: 6
          - type: health
            value: -8
          - type: skill_xp
            skill: thuong_mai
            value: 40
          - type: skill_xp
            skill: ngoai_giao
            value: 25
          - type: set_flag
            flag: bn_bo_nha_ra_di
            years: 6
            label: Bỏ nhà theo thuyền buôn năm thiếu thời
        result:
          - Thuyền nhổ neo lúc gà gáy. Bạn nằm nép giữa mấy bao muối, nghe tiếng nước vỗ mạn mà tim đập thình thịch. Mấy mùa sau bạn mới dám về. {role.cm.call} ra đón ở ngõ, không mắng, chỉ nhìn bạn rất lâu. Nhà đã phải bán con lợn nái để khất nợ thay bạn.
      - id: xin_ba_ho_khat
        text: Tự sang nhà {role.ba_ho.call}, xin khất cho nhà, hứa lớn lên sẽ làm công trả đủ
        hint: Đứa trẻ dám ăn nói với bá hộ thì hoặc được thương, hoặc bị ghét
        chance:
          base: 0.25
          skill: ngoai_giao
          per_level: 0.06
        success:
          - type: set_flag
            flag: duoc_khat_no
            years: 2
            label: "{role.ba_ho.call} cho nhà khất nợ hai năm"
          - type: opinion
            role: ba_ho
            value: 15
          - type: opinion
            role: cm
            value: 10
          - type: skill_xp
            skill: ngoai_giao
            value: 30
        failure:
          - type: opinion
            role: ba_ho
            value: -25
          - type: debt
            value: 8
          - type: opinion
            role: cm
            value: -10
          - type: stress
            value: 12
        success_result:
          - '{role.ba_ho.call} nhìn đứa trẻ đứng thẳng lưng giữa sân, bật cười: "Đứa ranh này được. Thôi, cho nhà mày khất hai năm." Về nhà, {role.cm.call} ôm bạn mà không nói nên lời.'
        failure_result:
          - '{role.ba_ho.call} sai người lôi bạn ra cổng: "Trẻ ranh mà dám mặc cả với ông!" Hôm sau món nợ được ghi thêm mấy quan "tiền dạy dỗ". {role.cm.call} giận bạn suốt mấy tháng.'
  - id: bn_cuu_tre_duoi_nuoc
    title: Đứa trẻ chới với giữa vực sông
    tags:
      - nguy_hiem
      - lang_xa
      - quan_he
    life_stages:
      - thieu_thoi
    months:
      - 5
      - 6
      - 7
      - 8
      - 9
    condition:
      var: player.age
      op: between
      value:
        - 8
        - 15
    roles:
      - id: ba_ho
        from: village
        village_role: ba_ho
    weight: 4
    once_per_life: true
    tension: 8
    importance: 8
    icon: lu
    text:
      - Trưa hè, lũ trẻ trong xóm ra vực sông tắm. Thằng con út nhà {role.ba_ho.call} cậy biết bơi, bơi ra quá chỗ cây sung. Chỗ ấy nước xoáy. Bạn thấy cái đầu nó ngoi lên rồi chìm, ngoi lên rồi chìm, hai tay đập loạn xạ.
      - Bọn trẻ đứng trên bờ la hét, không đứa nào dám xuống. Người lớn gần nhất cũng đang ở tít ngoài ruộng. Nước vực đục ngầu, xoáy thành vòng.
    options:
      - id: lao_xuong_cuu
        text: Cởi áo, nhảy ùm xuống vực bơi ra
        hint: Vực sâu nước xoáy, cứu được người thì cả đời được nhớ ơn, không cứu được thì có khi mất cả hai
        chance:
          base: 0.45
          skill: sinh_ton
          per_level: 0.06
        success:
          - type: opinion
            role: ba_ho
            value: 40
          - type: favor
            role: ba_ho
            value: 15
          - type: own_money
            value: 15
            ledger: thu_khac
          - type: reputation
            group: dan_lang
            value: 15
          - type: health
            value: -10
        failure:
          - type: health
            value: -40
          - type: stress
            value: 18
          - type: opinion
            role: ba_ho
            value: 10
        success_result:
          - Bạn túm được tóc nó, cả hai bị xoáy kéo xuống hai lần mới quẫy được vào bờ. Nó nôn ra cả bụng nước rồi khóc thét. Chiều ấy {role.ba_ho.call} thân sang tận nhà, đặt lên bàn thờ một xâu tiền, cúi đầu trước cha mẹ bạn.
        failure_result:
          - Xoáy nước cuốn cả hai. Người ta lôi được hai đứa lên lúc cả hai đã tím tái. Thằng bé sống, bạn thì nằm mê man ba ngày, thầy lang bảo phổi đã ngấm nước. Từ đó cứ trở trời là bạn ho sù sụ.
      - id: quang_sao
        text: Vớ cây sào tre bên bờ, nằm bám rễ sung chìa ra cho nó
        hint: Cần nhanh trí; trượt chân thì chính mình rơi xuống
        chance:
          base: 0.4
          skill: muu_luoc
          per_level: 0.06
        success:
          - type: opinion
            role: ba_ho
            value: 30
          - type: favor
            role: ba_ho
            value: 10
          - type: own_money
            value: 10
            ledger: thu_khac
          - type: reputation
            group: dan_lang
            value: 10
          - type: skill_xp
            skill: muu_luoc
            value: 25
        failure:
          - type: health
            value: -22
          - type: opinion
            role: ba_ho
            value: -15
          - type: stress
            value: 15
        success_result:
          - Nó vồ được đầu sào, bạn ghì chặt rễ sung mà kéo. Tay bạn rách toạc, nhưng nó lên được bờ. Người làng kể mãi chuyện thằng bé nhà nghèo khôn hơn cả người lớn.
        failure_result:
          - Rễ sung trơn, bạn trượt tõm xuống nước. Cả hai được người đi cắt cỏ lôi lên. {role.ba_ho.call} không cảm ơn, còn bảo bạn rủ con ông ra vực.
      - id: chay_goi_nguoi
        text: Chạy thục mạng ra ruộng gọi người lớn
        hint: Không liều thân, nhưng chạy đi chạy về là mất mấy nhịp thở
        chance:
          base: 0.45
          skill: sinh_ton
          per_level: 0.04
        success:
          - type: opinion
            role: ba_ho
            value: 12
          - type: reputation
            group: dan_lang
            value: 4
        failure:
          - type: opinion
            role: ba_ho
            value: -30
          - type: stress
            value: 25
          - type: set_flag
            flag: bn_am_anh_vuc_song
            years: 10
            label: Ám ảnh đứa trẻ chết đuối ở vực sông
        success_result:
          - Mấy người đàn ông nhảy xuống kịp lôi nó lên. Nó sống. Người ta bảo may mà có đứa chạy nhanh.
        failure_result:
          - Lúc người lớn ra đến nơi, mặt nước đã phẳng lặng. Ba hôm sau xác nó nổi ở bến dưới. {role.ba_ho.call} gào lên giữa sân đình rằng lũ trẻ con nhà nghèo đứng nhìn con ông chết. Đêm nào bạn cũng mơ thấy hai bàn tay đập nước.
      - id: bo_chay
        text: Sợ quá, quay lưng chạy về nhà trốn
        hint: Giữ được mạng mình, nhưng có những thứ cả đời không rửa được
        trait_stress:
          can_dam: 12
          nhan_tu: 8
        effects:
          - type: stress
            value: 25
          - type: reputation
            group: dan_lang
            value: -10
          - type: add_trait
            trait: than_trong
            who: player
          - type: set_flag
            flag: bn_am_anh_vuc_song
            years: 15
            label: Ám ảnh lần bỏ chạy ở vực sông
        result:
          - Bạn chui xuống gầm phản, bịt tai. Tối ấy cả xóm đi đuốc dọc bờ sông. Có đứa kể rằng bạn đã đứng gần nhất. Không ai mắng bạn, nhưng từ đó bọn trẻ không rủ bạn chơi nữa.
  - id: bn_vu_oan_trom_trau
    title: Bị vu trộm trâu, giải lên huyện
    tags:
      - lang_xa
      - nguy_hiem
      - quan_he
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      all:
        - var: player.age
          op: between
          value:
            - 18
            - 55
        - not:
            has_flag: bn_ngoi_tu
    roles:
      - id: ly
        from: village
        village_role: ly_truong
      - id: hx
        from: village
        village_role: hang_xom
    weight: 4
