    icon: chen_tra
    text:
      - Ngày giỗ tổ của họ năm nay, bạn và {role.ae.call} ngồi hai đầu chiếu. Các cụ trong họ nhìn sang, lắc đầu. Mâm cỗ nguội dần mà chưa ai nâng chén.
    options:
      - id: rot_ruou
        text: Bưng chén rượu sang mời {role.ae.call} trước
        hint: Cần hạ mình và ăn nói khéo
        trait_stress:
          tham_vong: 3
        chance:
          base: 0.45
          skill: ngoai_giao
          per_level: 0.05
          modifiers:
            - condition:
                var: role.ae.opinion
                op: ">"
                value: -10
              add: 0.15
        success:
          - type: opinion
            role: ae
            value: 25
          - type: clear_flag
            flag: gd_anh_em_bat_hoa
          - type: filial_piety
            value: 4
          - type: stress
            value: -5
        failure:
          - type: opinion
            role: ae
            value: -5
          - type: stress
            value: 4
        success_result:
          - "{role.ae.call} nhìn chén rượu một lúc, rồi đỡ lấy uống cạn. Các cụ gõ đũa vào mâm cười vang."
        failure_result:
          - "{role.ae.call} quay mặt đi. Chén rượu trên tay bạn nguội dần, bạn đặt xuống chiếu."
      - id: nho_truong_ho
        text: Nhờ cụ trưởng họ đứng ra phân giải, góp 3 quan làm cỗ
        condition:
          var: household.money
          op: ">="
          value: 3
        effects:
          - type: money
            value: -3
            ledger: su_kien
          - type: opinion
            role: ae
            value: 15
          - type: reputation
            value: 3
          - type: filial_piety
            value: 3
          - type: clear_flag
            flag: gd_anh_em_bat_hoa
        result:
          - 'Cụ trưởng họ nói một câu: "Ruộng chia được, máu không chia được." Hai anh em cúi đầu, cùng thắp hương lên bàn thờ tổ.'
      - id: ngoi_im
        text: Ngồi im, đến tàn cỗ thì về
        effects:
          - type: stress
            value: 4
          - type: opinion
            role: ae
            value: -5
          - type: clear_flag
            flag: gd_anh_em_bat_hoa
        result:
          - Bạn về trước. Đường làng tối, sau lưng tiếng cười nói của họ hàng vẫn vọng ra.
  - id: gd_phung_duong_cha_me
    title: Cha mẹ yếu dần
    tags:
      - gia_dinh
      - benh_tat
    life_stages:
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    roles:
      - id: cm
        from: family
        relation: parent
        condition:
          all:
            - var: self.age
              op: ">="
              value: 62
            - var: self.health
              op: <
              value: 60
        pick: oldest
      - id: vc
        from: family
        relation: spouse
        optional: true
    weight: 6
    weight_modifiers:
      - condition:
          var: player.filial_piety
          op: ">="
          value: 60
        factor: 1.5
    cooldown_years: 4
    tension: 4
    importance: 6
    icon: gia_dinh
    text:
      - Năm nay {role.cm.call} yếu hẳn đi. Mỗi bữa chỉ ăn lưng bát cháo, đêm nằm ho khan đến sáng. Việc nhà, việc làm ăn vẫn chờ bạn ngoài kia.
    options:
      - id: tu_tay
        text: Tự tay hầu hạ, đêm nằm cạnh giường {role.cm.call}
        hint: Hiếu đạo tăng nhiều, bạn hao sức
        effects:
          - type: health
            value: -4
          - type: stress
            value: 5
          - type: filial_piety
            value: 10
          - type: health
            who: cm
            value: 8
          - type: opinion
            role: cm
            value: 10
        result:
          - Đêm nào bạn cũng trở dậy mấy lần, đỡ {role.cm.call} uống ngụm nước. Người làng nhắc đến nhà bạn bằng chữ hiếu.
      - id: thuoc_bo
        text: Mua thuốc bắc, thịt cá bồi dưỡng (3 quan)
        condition:
          var: household.money
          op: ">="
          value: 3
        effects:
          - type: money
            value: -3
            ledger: su_kien
          - type: health
            who: cm
            value: 12
          - type: filial_piety
            value: 5
        result:
          - Thang thuốc bổ, bát canh cá rô. Da dẻ {role.cm.call} hồng hào trở lại.
      - id: giao_vc
        text: Nhờ {role.vc.call} chăm, mình lo làm ăn
        condition:
          role: vc
          exists: true
        effects:
          - type: filial_piety
            value: -2
          - type: stress
            who: vc
            value: 6
          - type: opinion
            role: vc
            value: -6
          - type: health
            who: cm
            value: 5
        result:
          - "{role.vc.call} gánh thêm một việc, không than, nhưng bạn thấy rõ cái mệt trong mắt người bạn đời."
      - id: thue_nguoi
        text: Thuê một bà vú già về hầu {role.cm.call} (5 quan)
        condition:
          all:
            - var: household.career
              op: ==
              value: thuong_nhan
            - var: household.money
              op: ">="
              value: 5
        effects:
          - type: money
            value: -5
            ledger: su_kien
          - type: health
            who: cm
            value: 10
          - type: filial_piety
            value: 1
          - type: reputation
            value: -2
        result:
          - "Bà vú chăm khéo, {role.cm.call} khỏe lên. Có điều trong xóm lại có câu: con nhà buôn, đến hầu cha mẹ cũng thuê."
      - id: doc_sach_ben_giuong
        text: Sớm thăm tối viếng, đọc sách cho {role.cm.call} nghe
        condition:
          any:
            - var: player.origin
              op: ==
              value: quy_toc_nho
            - var: household.career
              op: ==
              value: si_tu
        effects:
          - type: filial_piety
            value: 6
          - type: scholarly_prestige
            value: 2
          - type: health
            who: cm
            value: 3
          - type: stress
            value: 2
        result:
          - Sáng nào bạn cũng vào buồng hỏi han rồi mới ra thư phòng. Tối, bạn đọc mấy trang Luận ngữ, {role.cm.call} nghe rồi thiu thiu ngủ.
  - id: gd_cha_me_gia_lan
    title: Người già đi lạc
    tags:
      - gia_dinh
    life_stages:
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    roles:
      - id: cm
        from: family
        relation: parent
        condition:
          var: self.age
          op: ">="
          value: 70
      - id: thay
        from: village
        village_role: thay_lang
        optional: true
    weight: 4
    cooldown_years: 5
    tension: 4
    importance: 5
    icon: gia_dinh
    text:
      - Chiều qua {role.cm.call} lại đi lạc. Cả nhà tìm mãi mới thấy ngồi dưới gốc gạo đầu làng, tay ôm cái nón, gọi tên một người đã mất từ lâu.
    options:
      - id: thay_phien
        text: Cả nhà thay phiên trông, buộc chiếc chuông nhỏ vào cổ tay {role.cm.call}
        effects:
          - type: stress
            value: 5
          - type: filial_piety
            value: 6
          - type: opinion
            role: cm
            value: 5
        result:
          - Tiếng chuông lanh canh đi khắp nhà. Nghe nó, bạn biết {role.cm.call} vẫn ở đây.
      - id: cham_cuu
        text: Mời {role.thay.call} châm cứu, bốc thuốc an thần (2 quan)
        condition:
          all:
            - role: thay
              exists: true
            - var: household.money
              op: ">="
              value: 2
        chance:
          base: 0.5
        effects:
          - type: money
            value: -2
            ledger: su_kien
        success:
          - type: health
            who: cm
            value: 6
          - type: stress
            value: -2
        failure:
          - type: stress
            value: 2
        success_result:
          - Mấy tuần sau {role.cm.call} ngủ được, ban ngày tỉnh táo hơn, còn nhận ra cả hàng xóm.
        failure_result:
          - "Thầy lắc đầu: tuổi già, thuốc nào chữa được. Tiền thì đã tiêu."
      - id: khoa_cong
        text: Đóng chặt cổng, giữ {role.cm.call} trong buồng cho yên
        trait_stress:
          nhan_tu: 5
          trong_gia_dinh: 3
        effects:
          - type: filial_piety
            value: -6
          - type: stress
            value: -3
          - type: health
            who: cm
            value: -3
        result:
          - Nhà yên, việc chạy. Nhưng mỗi lần đi qua buồng, bạn nghe tiếng gõ cửa khe khẽ.
      - id: nghe_chuyen_cu
        text: Ngồi nghe {role.cm.call} kể đi kể lại chuyện ngày xưa
        hint: Cần kiên nhẫn
        chance:
          base: 0.45
          modifiers:
            - condition:
                has_trait: kien_nhan
              add: 0.25
        success:
          - type: opinion
            role: cm
            value: 12
          - type: health
            who: cm
            value: 3
          - type: filial_piety
            value: 4
          - type: stress
            value: -2
        failure:
          - type: stress
            value: 5
        success_result:
          - Chuyện năm lụt, chuyện ngày cưới, chuyện bạn hồi còn bé. Kể xong, {role.cm.call} cười móm mém, ngủ yên cả đêm.
        failure_result:
          - Đến lần thứ ba bạn sốt ruột cắt ngang. {role.cm.call} ngơ ngác nhìn, rồi im hẳn.
  - id: gd_hoa_giai_ho_hang
    title: Hai chi trong họ
    tags:
      - gia_dinh
      - quan_he
      - tin_nguong
    life_stages:
      - trung_nien
      - tuoi_gia
    condition:
      any:
        - var: player.reputation
          op: ">="
          value: 5
        - var: player.filial_piety
          op: ">="
          value: 50
        - var: player.scholarly_prestige
          op: ">="
          value: 20
    weight: 4
    cooldown_years: 6
    tension: 3
    importance: 5
    icon: gia_dinh
    text:
      - Hai chi trong họ cãi nhau vì hàng cây quanh mộ tổ. Chi trên muốn chặt bán lấy tiền tu sửa nhà thờ họ, chi dưới bảo động vào cây mộ là động long mạch. Người ta tìm đến nhà bạn, nhờ đứng ra nói một lời.
    options:
      - id: phan_giai
        text: Mời đủ hai chi, đứng giữa phân giải
        hint: Cần tài ăn nói và tiếng nói có trọng lượng
        chance:
          base: 0.4
          skill: ngoai_giao
          per_level: 0.05
          modifiers:
            - condition:
                var: player.scholarly_prestige
                op: ">="
                value: 30
              add: 0.1
        success:
          - type: reputation
            value: 8
          - type: filial_piety
            value: 4
          - type: skill_xp
            skill: ngoai_giao
            value: 15
        failure:
          - type: reputation
            value: -3
          - type: stress
            value: 5
        success_result:
          - Bạn đề nghị chặt cây khô, giữ cây tươi, tiền bán cây khô góp vào sửa mái. Hai bên ngẫm một lúc rồi đều gật.
        failure_result:
          - Bạn vừa mở lời đã bị hai bên cùng gạt đi. Buổi họp tan trong tiếng to tiếng nhỏ.
      - id: bo_tien_sua
        text: Tự bỏ 4 quan tu sửa nhà thờ họ, giữ nguyên hàng cây
        condition:
          var: household.money
          op: ">="
          value: 4
        trait_stress:
          tham_lam: 4
        effects:
          - type: money
            value: -4
            ledger: su_kien
          - type: reputation
            value: 6
          - type: filial_piety
            value: 5
          - type: stress
            value: -2
        result:
          - Mái nhà thờ họ lợp lại ngói mới, hàng cây vẫn đứng nguyên. Tên bạn được khắc vào tấm bia công đức nhỏ.
      - id: theo_chi_tren
        text: "Đứng về chi trên: nhà thờ họ dột thì tổ tiên mới buồn"
        effects:
          - type: reputation
            value: -3
          - type: filial_piety
            value: 2
          - type: stress
            value: -1
        result:
          - Hàng cây bị chặt. Nhà thờ họ có mái mới, còn người chi dưới thì không chào bạn nữa.
      - id: tranh_mat
        text: Viện cớ đau lưng, không dính vào chuyện họ
        trait_stress:
          trong_gia_dinh: 3
        effects:
          - type: stress
            value: -2
          - type: reputation
            value: -4
          - type: filial_piety
            value: -2
        result:
          - Bạn nằm nhà nghe người ta kể lại. Chuyện họ chưa xong, chuyện bạn lánh mặt thì ai cũng biết.
  - id: gd_ga_con_gai
    title: Bà mối gõ cửa
    tags:
      - gia_dinh
      - quan_he
    life_stages:
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    condition:
      var: player.mourning_months
      op: ==
      value: 0
    roles:
      - id: con
        from: family
        relation: child
        condition:
          all:
            - var: self.sex
              op: ==
              value: f
            - var: self.age
              op: between
              value:
                - 16
                - 24
    weight: 5
    weight_modifiers:
      - condition:
          var: role.con.age
          op: ">="
          value: 20
        factor: 1.6
    cooldown_years: 3
    tension: 4
    importance: 7
    icon: cuoi
    text:
      - Bà mối lại sang, lần này mang theo cơi trầu của một nhà khá giả ở làng bên. Nhà ấy muốn hỏi {role.con.call} cho con trai út. Đứa con gái đứng sau bức vách, bạn nghe rõ tiếng thở dồn.
    options:
      - id: ga_nha_kha
        text: Nhận lời nhà khá giả, lấy sính lễ 4 quan
        trait_stress:
          nhan_tu: 3
        effects:
          - type: money
            value: 4
            ledger: thu_khac
          - type: reputation
            value: 2
          - type: opinion
            role: con
            value: -10
          - type: stress
            who: con
            value: 5
          - type: leave_household
            who: con
        result:
          - Ngày đưa dâu, {role.con.call} lạy bàn thờ ba lạy rồi theo nhà trai ra ngõ. Tiếng khóc nhỏ dần sau lũy tre.
      - id: hoi_y_con
        text: Hỏi ý con trước, con thương ai thì gả người ấy (lo 2 quan cỗ cưới)
        condition:
          var: household.money
          op: ">="
          value: 2
        trait_stress:
          tham_lam: 3
        effects:
          - type: money
            value: -2
            ledger: su_kien
          - type: opinion
            role: con
            value: 15
          - type: stress
            value: -2
          - type: leave_household
            who: con
        result:
          - Con chọn một chàng trai nghèo ở xóm chài. Cỗ cưới đơn sơ, nhưng hôm ấy {role.con.call} cười suốt.
      - id: ken_re_hoc_tro
        text: Kén rể là anh học trò nghèo có chữ, mong ngày đỗ đạt
        condition:
          any:
            - var: player.origin
              op: ==
              value: quy_toc_nho
            - var: household.career
              op: ==
              value: si_tu
        effects:
          - type: money
            value: -1
            ledger: su_kien
          - type: scholarly_prestige
            value: 3
          - type: opinion
            role: con
            value: 4
          - type: leave_household
            who: con
        result:
          - "Người làng cười nhà bạn gả con cho anh học trò ăn chực nằm chờ. Bạn chỉ đáp: nhà có chữ thì không nghèo mãi."
      - id: ga_nha_buon_vai
        text: Gả cho nhà buôn vải trên phố, hai nhà kết mối hàng
        condition:
          var: household.career
          op: ==
          value: thuong_nhan
        effects:
          - type: money
            value: 2
            ledger: thu_khac
          - type: modifier
            target: xp.thuong_mai
            value: 1.1
            op: mul
            months: 36
            label: Thông gia nhà buôn vải
          - type: opinion
            role: con
            value: -3
          - type: leave_household
            who: con
        result:
          - Thuyền hoa đón dâu cập bến. Từ hôm ấy, vải nhà thông gia về sạp bạn trước mọi nhà.
      - id: giu_con
        text: Con còn nhỏ, xin để vài năm nữa
        defer:
          months: 24
        effects:
          - type: opinion
            role: con
            value: 5
          - type: stress
            value: 2
        result:
          - Bà mối bĩu môi đi về. Tối ấy {role.con.call} bưng nước cho bạn rửa chân, không nói mà mắt đỏ hoe.
  - id: gd_xin_que_dau_nam
    title: Quẻ đầu năm
    tags:
      - tin_nguong
      - le_hoi
    life_stages:
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    months:
      - 1
      - 2
    weight: 5
    weight_modifiers:
      - condition:
          has_trait: mo_dao
        factor: 1.6
    cooldown_years: 4
    tension: 3
    importance: 4
    icon: hoi
    text:
      - "Đầu năm bạn lên chùa thắp hương. Ống thẻ lắc mấy vòng, rơi ra một thẻ hạ. Sư cụ đọc lời quẻ, giọng đều đều: trong năm chớ đi xa, chớ động thổ, trong nhà phải giữ gìn người già."
    options:
      - id: hoan_chuyen_hang
        text: Tin quẻ, hoãn chuyến hàng đầu xuân, bù tiền cọc cho chủ thuyền
        condition:
          all:
            - var: household.career
              op: ==
              value: thuong_nhan
            - var: household.money
              op: ">="
              value: 2
        effects:
          - type: money
            value: -2
            ledger: su_kien
          - type: stress
            value: -4
        result:
          - Chủ thuyền càu nhàu nhận tiền. Cả mùa xuân bạn ngồi sạp, lòng yên mà túi nhẹ.
      - id: tin_que
        text: Tin lời quẻ, cả năm giữ mình, không làm việc lớn
        trait_stress:
          tham_vong: 3
        effects:
          - type: stress
            value: -3
          - type: modifier
            target: xp.all
            value: 0.95
            op: mul
            months: 12
            label: Năm kiêng cữ theo quẻ
        result:
          - Năm ấy bạn không đi đâu xa, không động đến việc gì lớn. Năm trôi qua phẳng lặng như mặt ao.
      - id: giai_han
        text: Cúng dường 2 quan, xin sư làm lễ giải hạn
        condition:
          var: household.money
          op: ">="
          value: 2
        trait_stress:
          hoai_nghi: 4
        effects:
          - type: money
            value: -2
            ledger: su_kien
          - type: stress
            value: -5
        result:
          - Tiếng mõ, tiếng chuông suốt buổi chiều. Bạn ra về, thấy lòng như vừa trút được gánh nặng.
      - id: khong_tin
        text: "Cười xòa: gieo quẻ là chuyện may rủi"
        trait_stress:
          mo_dao: 5
        effects:
          - type: chance
            p: 0.3
            then:
              - type: stress
                value: 4
        result:
          - Bạn cắm thẻ lại vào ống rồi xuống dốc chùa. Gió đầu xuân thổi mát, chỉ thỉnh thoảng lời quẻ lại vẳng lên trong đầu.
  - id: gd_lam_nha_moi
    title: Nhà dột cột mục
    tags:
      - gia_dinh
      - kinh_te
    life_stages:
      - lap_nghiep
      - trung_nien
    months:
      - 10
      - 11
      - 12
      - 1
    condition:
      all:
        - has_property: nha_tranh
        - not:
            has_property: nha_go
        - not:
            has_property: phu_nho
        - var: household.money
          op: ">="
          value: 5
    weight: 4
    cooldown_years: 8
    tension: 3
    importance: 6
    icon: nha
    text:
      - Mùa mưa vừa rồi mái rạ dột mười chỗ, vách đất lở một mảng. Mấy cái cột tre mối đã ăn rỗng. Ai cũng bảo nhà này không qua thêm được một mùa bão.
    options:
      - id: dung_nha_go
        text: Mua gỗ lim, mời thợ dựng hẳn nhà gỗ ba gian (70 quan)
        condition:
          var: household.money
          op: ">="
          value: 70
        effects:
          - type: money
            value: -70
            ledger: su_kien
          - type: property_remove
            property: nha_tranh
            count: 1
          - type: property_add
            property: nha_go
            count: 1
          - type: reputation
            value: 6
        result:
          - Ngày cất nóc, thợ cả treo tấm vải đỏ lên xà, cả xóm sang mừng. Đêm đầu tiên ngủ dưới mái ngói, bạn nằm nghe mưa mà không phải dậy kê chậu.
      - id: xem_ngay_lop_lai
        text: Nhờ thầy xem ngày, thay cột, lợp lại mái, trát vách (6 quan)
        condition:
          var: household.money
          op: ">="
          value: 6
        trait_stress:
          hoai_nghi: 2
        effects:
          - type: money
            value: -6
            ledger: su_kien
          - type: modifier
            target: health.monthly
            value: 0.06
            op: add
            months: 60
            label: Nhà mới lợp lại
            who: household
          - type: stress
            value: -4
        result:
          - Thầy chọn ngày Hoàng đạo, giờ Thìn động thổ. Mái rạ mới vàng óng, vách trát lại phẳng phiu.
      - id: tu_lam
        text: Cả nhà tự chặt tre, cắt rạ về sửa (1 quan)
        hint: Rẻ, nhưng mệt và không bền bằng
        effects:
          - type: money
            value: -1
            ledger: su_kien
          - type: health
            value: -5
          - type: skill_xp
            skill: sinh_ton
            value: 12
          - type: modifier
            target: health.monthly
            value: 0.04
            op: add
            months: 36
            label: Nhà tự sửa
            who: household
        result:
          - Nửa tháng trèo lên trèo xuống, tay bạn chằng chịt vết tre cứa. Mái nhà kín lại, mỗi tội hơi xiêu.
      - id: de_sang_nam
        text: Chưa phải lúc, chống tạm thêm một năm
        defer:
          months: 12
        effects:
          - type: stress
            value: 3
        result:
          - Bạn chèn thêm mấy cái cột chống, phủ tạm tấm phên lên chỗ dột. Đêm mưa vẫn phải dậy kê chậu.
  - id: gd_sam_tho_duong
    title: Cỗ thọ đường
    tags:
      - gia_dinh
      - tin_nguong
    life_stages:
      - tuoi_gia
    condition:
      var: player.age
      op: ">="
      value: 60
    roles:
      - id: con
        from: family
        relation: child
        condition:
          var: self.age
          op: ">="
          value: 18
        pick: oldest
        optional: true
    weight: 5
    once_per_life: true
    tension: 3
    importance: 6
    icon: tang
    text:
      - Bạn đã ngoài sáu mươi. Theo lệ làng, người già nên sắm sẵn cỗ thọ đường kê ở chái nhà, để lúc trăm tuổi con cháu khỏi tất tả. Ông thợ mộc đầu làng vừa có mấy tấm gỗ vàng tâm tốt.
    options:
      - id: go_vang_tam
        text: Sắm cỗ gỗ vàng tâm, sơn son cẩn thận (6 quan)
        condition:
          var: household.money
          op: ">="
          value: 6
        effects:
          - type: money
            value: -6
            ledger: su_kien
          - type: stress
            value: -5
          - type: reputation
            value: 3
        result:
          - Cỗ thọ đường kê trên hai cái mễ ở chái nhà. Chiều chiều bạn ra gõ thử, nghe tiếng gỗ chắc mà yên lòng.
      - id: con_sam
        text: Để {role.con.call} đứng ra lo, coi như con báo hiếu (4 quan)
        condition:
          all:
            - role: con
              exists: true
            - var: household.money
              op: ">="
              value: 4
        effects:
          - type: money
            value: -4
            ledger: su_kien
          - type: stress
            value: -4
          - type: opinion
            role: con
            value: 5
        result:
          - "{role.con.call} đi mấy làng chọn gỗ, về khoe từng thớ vân. Bạn không nói gì, chỉ thấy mắt cay cay."
      - id: sinh_phan
        text: Nhờ thầy địa lý chọn đất trên gò, xây sẵn sinh phần (3 quan)
        condition:
          var: household.money
          op: ">="
          value: 3
        trait_stress:
          hoai_nghi: 3
        effects:
          - type: money
            value: -3
            ledger: su_kien
          - type: stress
            value: -3
        result:
          - Thầy cắm la bàn, chọn một chỗ nhìn ra sông. Bạn đứng đó, gió thổi lộng, nghĩ chỗ này nằm cũng mát.
      - id: chua_can
        text: Còn khỏe chán, lo chuyện ấy làm gì cho xui
        trait_stress:
          than_trong: 3
        effects:
          - type: stress
            value: -1
        result:
          - Bạn xua tay. Ông thợ mộc cười, bảo khi nào cần cứ sang, gỗ tốt thì không đợi ai.
  - id: gd_viet_di_chuc
    title: Lời dặn lại
    tags:
      - gia_dinh
    life_stages:
      - tuoi_gia
    condition:
