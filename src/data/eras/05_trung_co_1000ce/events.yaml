          - Quan Đề điệu bắt được sổ ghi tên những kẻ đút lót. Tên bạn nằm ở trang thứ ba. Bạn bị đuổi khỏi trường thi trước mặt hàng nghìn sĩ tử, tiền thì đã nằm trong túi kẻ khác.
