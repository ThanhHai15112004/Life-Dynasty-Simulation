          var: role.ba_ho.opinion
          op: <
          value: 0
        factor: 1.6
    cooldown_years: 6
    tension: 7
    importance: 8
    icon: tin_don
    text:
      - Nhà bạn mỗi năm một khá, ruộng mua thêm, nhà lợp ngói. {role.ba_ho.call} — xưa nay vẫn là nhà giàu nhất làng — bắt đầu khó chịu. Mùa này lão cho người đắp chặn mương dẫn nước qua ruộng lão vào ruộng nhà bạn, lại tung tin bạn làm giàu nhờ buôn đồ quốc cấm.
      - Ruộng nhà bạn bắt đầu khô nẻ. Ngoài chợ, có người đã không dám bán hàng cho nhà bạn nữa.
    options:
      - id: bieu_le_lam_lanh
        text: Sắm lễ 20 quan sang nhà {role.ba_ho.call} làm lành, nhận mình là đàn em
        hint: Yên chuyện, mương thông; nhưng từ nay phải nhún nhường
        condition:
          var: household.money
          op: ">="
          value: 20
        trait_stress:
          tham_vong: 6
          nong_nay: 4
        effects:
          - type: money
            value: -20
            ledger: su_kien
          - type: opinion
            role: ba_ho
            value: 25
          - type: stress
            value: 8
        result:
          - '{role.ba_ho.call} nhận lễ, cười khà khà, gọi bạn là "chú em". Hôm sau mương thông. Tin đồn cũng tắt. Nhưng đám giỗ nào có hai nhà, bạn cũng phải ngồi dưới lão một chiếu.'
      - id: doi_dau
        text: "Đối đầu: kêu làng mở lại mương theo lệ cũ, vạch mặt kẻ tung tin"
        hint: Thắng thì làng phục; thua thì lão càng thù, ruộng càng khô
        chance:
          base: 0.4
          skill: ngoai_giao
          per_level: 0.05
          modifiers:
            - condition:
                var: player.reputation
                op: ">="
                value: 30
              add: 0.15
        success:
          - type: reputation
            group: dan_lang
            value: 20
          - type: opinion
            role: ba_ho
            value: -30
        failure:
          - type: opinion
            role: ba_ho
            value: -40
          - type: modifier
            target: harvest.yield
            value: 0.7
            op: mul
            months: 12
            label: Mương nước bị bá hộ chặn
          - type: reputation
            group: dan_lang
            value: -10
          - type: stress
            value: 15
          - type: schedule_event
            event: grh_ba_ho_tra_dua
            months: 14
            label: "{role.ba_ho.call} còn để bụng"
        success_result:
          - Các cụ ra tận mương, xem sổ lệ làng, phán phải phá bờ chặn. Người đàn ông đi tung tin đứng ra thú nhận là được thuê. {role.ba_ho.call} mất mặt giữa đình, từ đó gặp bạn là quay đi.
        failure_result:
          - Các cụ ngồi đình, nửa nhìn bạn nửa nhìn {role.ba_ho.call}, rồi bảo "việc nhà giàu với nhau, tự liệu". Mương vẫn chặn. Mùa ấy nửa đồng ruộng nhà bạn trắng bông lúa lép.
      - id: ket_thong_gia
        text: Ngỏ lời kết thông gia, gả con cho nhà {role.ba_ho.call}
        hint: Biến thù thành thân; nhưng con mình thành con tin trong nhà người ta
        condition:
          var: player.children_count
          op: ">="
          value: 1
        effects:
          - type: arrange_child_marriage
          - type: money
            value:
              var: household.money
              factor: -0.2
              max: 0
              min: -30
            ledger: su_kien
          - type: opinion
            role: ba_ho
            value: 30
          - type: stress
            value: 10
        result:
          - Hai nhà giàu nhất làng làm thông gia, cỗ cưới bày kín hai sân. Mương thông, tin đồn tắt. Nhưng mỗi lần con về thăm, bạn đều thấy nó gầy đi một chút.
      - id: nhan_nhin
        text: Nhẫn nhịn, đào giếng khơi tưới tạm, không nói gì
        hint: Không gây thù, nhưng tốn công tốn của mà ruộng vẫn kém
        effects:
          - type: money
            value:
              var: household.money
              factor: -0.15
              max: 0
              min: -20
            ledger: su_kien
          - type: modifier
            target: harvest.yield
            value: 0.85
            op: mul
            months: 12
            label: Tưới bằng giếng khơi
          - type: health
            value: -6
          - type: stress
            value: 10
        result:
          - Cả nhà đào hai cái giếng khơi ở đầu ruộng, ngày ngày gánh nước tưới. Lúa không chết, nhưng không được như trước. {role.ba_ho.call} đi qua bờ ruộng, chắp tay sau lưng mà cười.
  - id: grh_ba_ho_tra_dua
    title: Bá hộ trả đũa
    tags:
      - lang_xa
      - quan_he
      - nguy_hiem
    scheduled_only: true
    condition:
      var: player.is_head
      op: ==
      value: true
    roles:
      - id: ba_ho
        from: village
        village_role: ba_ho
    weight: 1
    tension: 8
    importance: 8
    icon: tin_don
    text:
      - "Một buổi sáng, lính huyện ập vào nhà bạn khám xét: có đơn tố giác nhà bạn chứa đồ quốc cấm. Chúng lục tung mọi chum vại, rồi lôi ra từ đống rơm một bó giáo mác mà bạn chưa từng thấy bao giờ. Ai cũng biết đơn ấy ở đâu ra."
    options:
      - id: lot_lai
        text: Biếu viên đội 40 quan để "không thấy" bó giáo
        hint: Thoát tội ngay, mất một khoản lớn
        condition:
          var: household.money
          op: ">="
          value: 40
        effects:
          - type: money
            value: -40
            ledger: su_kien
          - type: stress
            value: 12
          - type: opinion
            role: ba_ho
            value: -10
        result:
          - Viên đội cầm tiền, cho lính vác bó giáo đi "trả lại chủ". Bạn đứng giữa sân lộn xộn, biết rằng chuyện này chưa xong.
      - id: keu_oan
        text: Kêu oan, xin quan cho truy người làm giáo, người đắp rơm
        hint: Gặp quan sáng thì kẻ vu cáo bị tội; không thì vào ngục
        chance:
          base: 0.35
          skill: ngoai_giao
          per_level: 0.05
        success:
          - type: reputation
            group: dan_lang
            value: 20
          - type: opinion
            role: ba_ho
            value: -20
        failure:
          - type: set_flag
            flag: bn_ngoi_tu
            years: 1
            label: Ngồi ngục vì bị vu chứa đồ quốc cấm
          - type: health
            value: -28
          - type: money
            value:
              var: household.money
              factor: -0.35
              max: 0
              min: -60
            ledger: su_kien
          - type: modifier
            target: death_risk
            value: 2
            op: mul
            months: 12
            label: Ngồi ngục huyện
          - type: stress
            value: 20
        success_result:
          - Quan cho gọi thợ rèn trong vùng. Một lão thợ khai ra người đặt rèn bó giáo là quản gia nhà {role.ba_ho.call}. Lão bá hộ phải nộp phạt, cúi đầu xin lỗi giữa đình. Cả làng hả hê.
        failure_result:
          - 'Quan phán: "Tang vật rành rành." Bạn bị gông giải đi giữa tiếng khóc của cả nhà. {role.ba_ho.call} đứng xem ở cổng, tay lần tràng hạt.'
      - id: cau_hoa
        text: Sang nhà {role.ba_ho.call} quỳ xin, bán lại cho lão hai sào ruộng giá rẻ
        hint: Lão rút đơn, nhưng mất ruộng và mất mặt
        condition:
          var: household.farmland
          op: ">="
          value: 2
        effects:
          - type: property_remove
            property: ruong
            count: 2
          - type: money
            value: 30
            ledger: ban_tai_san
          - type: opinion
            role: ba_ho
            value: 25
          - type: reputation
            group: dan_lang
            value: -15
          - type: stress
            value: 15
        result:
          - Lão bá hộ đọc tờ văn tự bán ruộng, gật gù, rồi sai người lên huyện rút đơn. Hai sào ruộng tốt về tay lão với giá chưa bằng nửa. Bạn về, ngồi một mình trong bóng tối rất lâu.
  - id: gd_ba_moi_dam_ngo
    title: Bà mối trong làng sang dạm ngõ
    tags:
      - gia_dinh
      - quan_he
    cooldown_years: 4
    weight: 2.5
    condition:
      all:
        - var: player.is_head
          op: ==
          value: true
        - var: player.has_marriageable_child
          op: ==
          value: true
    text:
      - "Bà mối cầm cơi trầu bước qua cổng tre, cười tươi rói nói rằng {child.marriageable_name} trong nhà đã đến tuổi trăng tròn, có ba đám trong làng tại {world.settlement} đang muốn dạm hỏi: một đám nhà khá giả có của ăn của để, một đám con nhà chữ nghĩa lễ phép, và một đám con nhà nông chăm chỉ hiền lành."
    options:
      - id: chon_nha_kha_gia
        text: Ưng thuận kết thông gia với nhà khá giả trong làng để nâng vị thế dòng họ
        effects:
          - type: arrange_child_marriage
            status: phu_ho
          - type: dynasty_prestige
            value: 8
          - type: reputation
            group: dan_lang
            value: 4
        result:
          - Hai họ trao lễ dạm ngõ trang trọng. Dân làng tại {world.settlement} ai cũng khen họ {dynasty.family_name} biết chọn nơi môn đăng hộ đối.
      - id: chon_nha_chu_nghia
        text: Trọng nết na chữ nghĩa, gả cưới vào nhà Nho học lễ giáo
        effects:
          - type: arrange_child_marriage
            status: si_phu
          - type: scholarly_prestige
            value: 6
          - type: stress
            value: -5
        result:
          - Lễ vật tuy giản dị nhưng ấm tình hiếu lễ, hai gia tộc kết mối giao hảo bền chặt.
      - id: hoi_y_con
        text: Chưa nhận lời ngay, để {child.marriageable_name} tự xem mặt và mở bảng Hôn sự cân nhắc
        effects:
          - type: stress
            value: -3
          - type: filial_piety
            value: 3
        result:
          - Bạn tiễn bà mối bằng chén trà thơm, hẹn sẽ bàn bạc kỹ với con cái trước khi quyết chuyện trăm năm.
  - id: gd_le_cuoi_lang_que
    title: Cỗ cưới rộn ràng và lệ nộp cheo làng
    tags:
      - gia_dinh
      - lang_xa
    cooldown_years: 6
    weight: 1.8
    condition:
      all:
        - var: player.is_head
          op: ==
          value: true
        - var: dynasty.in_laws_count
          op: ">="
          value: 1
    text:
      - Nhà họ {dynasty.family_name} vừa kết tình thông gia với một dòng họ trong làng {world.settlement}. Theo lệ làng, ngoài mâm cỗ mời họ hàng hai bên, gia chủ còn làm lễ báo gia tiên và nộp cheo ngoài đình để dân làng công nhận mối duyên mới.
    options:
      - id: mo_co_to
        text: Mổ lợn bày cỗ lớn mời khắp các họ trong làng (4 quan, 8 thúng thóc)
        condition:
          all:
            - var: household.money
              op: ">="
              value: 4
            - var: household.food
              op: ">="
              value: 8
        effects:
          - type: money
            value: -4
          - type: food
            value: -8
          - type: reputation
            group: dan_lang
            value: 8
          - type: dynasty_prestige
            value: 8
          - type: clan_relation
            value: 15
            tie: in_law
          - type: cutscene
            id: ket_hon
        result:
          - Tiếng trống chèo, tiếng chúc tụng vang khắp xóm. Họ thông gia vô cùng mát mặt, danh vọng họ {dynasty.family_name} vang xa.
      - id: le_vua_phai
        text: Làm mâm cỗ ấm cúng vừa sức nhà và nộp đủ lệ cheo làng (1 quan, 3 thúng thóc)
        condition:
          all:
            - var: household.money
              op: ">="
              value: 1
            - var: household.food
              op: ">="
              value: 3
        effects:
          - type: money
            value: -1
          - type: food
            value: -3
          - type: reputation
            group: dan_lang
            value: 3
          - type: stress
            value: -4
        result:
          - Buổi lễ trang nghiêm ấm áp, hai bên thông gia vui vẻ nâng chén rượu mừng.
      - id: tiet_kiem
        text: Chỉ làm lễ gia tiên trong nhà cho đỡ tốn kém
        effects:
          - type: reputation
            group: dan_lang
            value: -2
          - type: stress
            value: 2
        result:
          - Giữ được đồng tiền trong rương nhưng vài người trong làng xì xào chê nhà họ {dynasty.family_name} chặt chẽ.
  - id: gd_nang_dau_moi_ve_nha
    title: Chuyện mẹ chồng nàng dâu khi đón dâu mới về nhà
    tags:
      - gia_dinh
      - tinh_than
    cooldown_years: 5
    weight: 2
    condition:
      all:
        - var: player.married
          op: ==
          value: true
        - var: household.members
          op: ">="
          value: 4
    text:
      - Sống chung dưới một mái nhà đông người khó tránh lúc bát đũa xô nhau. Chuyện bếp núc, chi tiêu vụn vặt khiến lời qua tiếng lại giữa người trước kẻ sau làm bữa cơm chiều trở nên nặng nề.
    options:
      - id: khuyen_nhu_doi_ben
        text: Khéo léo lựa lời phân giải, giữ cả chữ Hiếu lẫn tình nghĩa vợ chồng
        trait_stress:
          nong_nay: 6
        effects:
          - type: filial_piety
            value: 4
          - type: stress
            value: -5
          - type: skill_xp
            skill: ngoai_giao
            value: 12
        result:
          - Nhờ sự điềm đạm của bạn, đôi bên đều nguôi giận, trong nhà lại êm ấm như xưa.
      - id: nghiem_khac_nep_nha
        text: Đứng ra chấn chỉnh gia phong, phân định rõ việc ai nấy làm
        trait_stress:
          nhan_tu: 5
        effects:
          - type: skill_xp
            skill: quan_tri
            value: 12
          - type: stress
            value: 4
        result:
          - Mọi người im lặng nghe theo, công việc trật tự hơn nhưng không khí còn đôi chút gượng gạo.
  - id: gd_anh_em_bat_hoa
    title: Anh em bất hòa chuyện công việc và gia sản
    tags:
      - gia_dinh
      - lao_dong
    cooldown_years: 5
    weight: 2
    condition:
      all:
        - var: player.children_count
          op: ">="
          value: 2
        - var: household.members
          op: ">="
          value: 4
    text:
      - Các con trong nhà ngày một khôn lớn, mỗi đứa một tính nết. Hôm nay chỉ vì chuyện phân chia việc đồng áng và đèn sách mà anh chị em to tiếng tranh cãi ngay ngoài sân, đứa kêu thiệt thòi vất vả, đứa trách người kia lười nhác.
    options:
      - id: day_nghia_dong_bao
        text: Gọi các con trước bàn thờ tổ tiên, răn dạy đạo lý anh em như thể tay chân
        effects:
          - type: filial_piety
            value: 5
          - type: dynasty_prestige
            value: 4
          - type: stress
            value: -4
        result:
          - Các con cúi đầu nhận lỗi, tự hứa từ nay trên thuận dưới hòa cùng vun đắp cơ nghiệp họ {dynasty.family_name}.
      - id: thuong_phat_cong_minh
        text: Chia lại công việc rõ ràng và thưởng thêm tiền tiêu vặt cho đứa chịu khó (1 quan)
        condition:
          var: household.money
          op: ">="
          value: 1
        effects:
          - type: money
            value: -1
          - type: skill_xp
            skill: quan_tri
            value: 15
          - type: stress
            value: -3
        result:
          - Thưởng phạt phân minh khiến đứa nào cũng tâm phục khẩu phục, hăng hái làm việc hơn.
      - id: quat_mang
        text: Quát mắng nghiêm khắc bắt tất cả im tiếng ra đồng làm việc
        trait_stress:
          nhan_tu: 6
        effects:
          - type: stress
            value: 5
        result:
          - Các con sợ hãi tản đi làm việc nhưng trong lòng vẫn còn ấm ức.
  - id: gd_con_trai_xin_di_thi
    title: Con trai học giỏi xin tiền lều chõng đi thi
    tags:
      - gia_dinh
      - hoc_hanh
    cooldown_years: 6
    weight: 3
    condition:
      all:
        - var: player.has_scholar_son
          op: ==
          value: true
    text:
      - Sau nhiều năm miệt mài đèn sách theo hướng giáo dục của gia đình, {child.scholar_name} đã thông thuộc kinh sử, được thầy đồ trong làng khen ngợi có chữ nghĩa hơn người. Kỳ thi Hương sắp mở, con quỳ trước thềm xin cha mẹ lo cho đôi quang gánh lều chõng và lộ phí lên trường thi thử sức.
    options:
      - id: lo_du_leu_chong
        text: Dốc tiền nhà sắm sửa lều chõng, giấy bút cho con đi thi (3 quan)
        condition:
          var: household.money
          op: ">="
          value: 3
        effects:
          - type: money
            value: -3
          - type: scholarly_prestige
            value: 12
          - type: dynasty_prestige
            value: 10
          - type: reputation
            group: dan_lang
            value: 5
          - type: stress
            value: -6
        result:
          - "{child.scholar_name} lạy tạ cha mẹ lên đường ứng thí, mang về tiếng thơm hiếu học cho dòng họ {dynasty.family_name}."
      - id: goi_ghiem_tiet_kiem
        text: Gói ghém nắm cơm, muối vừng và ít tiền lẻ cho con đi thi (1 quan)
        condition:
          var: household.money
          op: ">="
          value: 1
        effects:
          - type: money
            value: -1
          - type: scholarly_prestige
            value: 7
          - type: dynasty_prestige
            value: 6
        result:
          - Dù hành trang đạm bạc, {child.scholar_name} vẫn quyết tâm vượt vũ môn làm rạng danh nếp nhà.
      - id: giu_nha_phu_viec
        text: Nhà đang neo người thiếu thóc, bảo con tạm hoãn chờ khoa thi sau
        effects:
          - type: stress
            value: 6
          - type: food
            value: 4
            ledger: thu_hoach
        result:
          - "{child.scholar_name} buồn bã cất sách vở vào rương để ra đồng phụ giúp cha mẹ."
  - id: kt_lai_buon_ep_gia_dau_vu
    title: Lái buôn đến ngay sau mùa gặt
    tags:
      - buon_ban
      - thoi_co
      - ruong_dong
    months:
      - 5
      - 6
      - 10
      - 11
    condition:
      all:
        - var: player.is_head
          op: ==
          value: true
        - var: household.food_months
          op: ">="
          value: 5
    roles:
      - id: lai
        from: village
        village_role: lai_buon
    weight: 6
    cooldown_years: 2
    tension: 2
    importance: 4
    icon: tien
    text:
      - Thóc mới phơi chưa khô hẳn, {role.lai.call} đã đánh xe vào ngõ, dỡ cân ra giữa sân. "Đầu vụ thóc rẻ, nhưng tôi trả tiền ngay. Đợi giáp hạt thì được giá hơn, mà ai biết năm nay trời thế nào."
    options:
      - id: ban_ngay
        text: Bán bớt một phần cho xong, cầm tiền cho chắc
        hint: Giá thấp nhưng chắc tay
        effects:
          - type: sell_food
            share: 0.4
            keep_months: 5
        result:
          - Từng thúng thóc lên xe. Tiền đếm đủ, nhẹ cả lòng, dù biết bán thế là hớ.
      - id: mac_ca
        text: Mặc cả cho ra giá rồi mới bán
        hint: Cần con mắt buôn bán
        chance:
          base: 0.35
          skill: thuong_mai
          per_level: 0.06
        success:
          - type: sell_food
            share: 0.4
            keep_months: 5
            price_factor: 1.25
          - type: skill_xp
            skill: thuong_mai
            value: 15
        failure:
          - type: opinion
            role: lai
            value: -4
        success_result:
          - "{role.lai.call} gãi đầu mãi rồi cũng chịu giá của bạn. Lần này bán không hớ."
        failure_result:
          - "{role.lai.call} cười khẩy, xếp cân lên xe sang nhà khác. Thóc vẫn nằm trong kho."
      - id: tru_cho_gia
        text: Trữ lại, đợi đến giáp hạt hẵng bán
        hint: Có thể được giá, cũng có thể chuột mọt ăn mất
        trait_stress:
          an_phan: 2
        effects:
          - type: set_flag
            flag: tru_thoc_cho_gia
            years: 1
            label: Trữ thóc chờ giáp hạt bán được giá
        result:
          - Bạn đóng cửa kho, rắc thêm tro bếp quanh chân bồ. Giờ chỉ còn trông vào trời.
  - id: kt_giap_hat_gia_len
    title: Giáp hạt, giá thóc lên vùn vụt
    tags:
      - buon_ban
      - thoi_co
      - lang_xa
    months:
      - 2
      - 3
      - 8
      - 9
    condition:
