    tension: 6
    importance: 6
    icon: thue
    text:
      - "Muối là hàng nhà quan giữ mối, ai buôn cũng phải lấy qua kho trấn với giá đắt. {role.lb.call} kéo bạn ra góc bến thì thầm: có thuyền muối từ cửa biển lách vào lạch sau, cần người chở giúp vào kho trong ba đêm, trả công 5 quan."
