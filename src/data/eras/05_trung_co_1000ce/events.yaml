        result:
          - Bạn ngồi bên hiên nhà nghe tiếng mưa rơi, tự ôn lại những trang sách đã học.
  - id: het_chu_lang_que
    title: Hết chữ thầy làng
    text:
      - 'Sau nhiều năm dùi mài, thầy giáo trong vùng gập sách lại bảo: "Chữ nghĩa ở chốn thôn dã này ta đã dạy hết cho con. Muốn học lên cao nữa thì phải ra thị trấn hoặc lên phủ thành, chứ ở quê không còn trường lớp nào hơn."'
    tags:
      - hoc_hanh
      - van_minh
    life_stages:
      - thieu_thoi
      - thanh_nien
      - lap_nghiep
    condition:
