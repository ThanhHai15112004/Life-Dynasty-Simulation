        - var: player.is_head
          op: ==
          value: true
        - any:
            - var: household.net_worth
              op: ">="
              value: 120
            - var: household.money
              op: ">="
              value: 60
    roles:
      - id: con
        from: family
        relation: child
        condition:
          all:
            - var: self.sex
              op: ==
              value: m
            - var: self.age
              op: between
              value:
                - 17
                - 30
            - var: self.in_household
              op: ==
              value: true
    weight: 5
    weight_modifiers:
      - condition:
          var: household.net_worth
          op: ">="
          value: 300
        factor: 1.8
      - condition:
          var: household.net_worth
          op: ">="
          value: 800
        factor: 1.67
      - condition:
          has_trait: hao_phong
          who: con
        factor: 2
    cooldown_years: 8
    tension: 7
    importance: 8
    icon: tien
    text:
      - '{role.con.call} dạo này hay lên phố huyện, áo lụa thay áo nâu, tối về người sực mùi rượu và phấn. Hôm nay nó đứng giữa nhà, nói thẳng: "Nhà mình giàu thế mà cứ ru rú ở làng. Cho con năm chục quan, con ra phố mở hiệu, mấy năm là gấp đôi."'
      - Người ta kể {role.con.call} đã nợ mấy bữa rượu ở nhà cô đào trên phố. Nhưng đôi mắt nó lúc nói chuyện mở hiệu thì sáng rực, như ngày bạn mới lập nghiệp.
    options:
      - id: cho_50_quan
        text: Cho con 50 quan ra phố, để nó tự lập
        hint: Con biết làm ăn thì nhà có thêm cửa hiệu; không thì 50 quan ném xuống sông
        condition:
          var: household.money
          op: ">="
          value: 50
        effects:
          - type: money
            value: -50
            ledger: chuyen_khac
        chance:
          base: 0.35
          modifiers:
            - condition:
                var: role.con.skill.thuong_mai
                op: ">="
                value: 4
              add: 0.25
            - condition:
                has_trait: hao_phong
                who: con
              add: -0.15
        success:
          - type: opinion
            role: con
            value: 30
          - type: leave_household
            who: con
          - type: dynasty_prestige
            value: 8
          - type: set_flag
            flag: grh_con_mo_hieu
            years: 15
            label: "{role.con.call} mở hiệu trên phố huyện"
        failure:
          - type: opinion
            role: con
            value: 10
          - type: stress
            value: 15
          - type: debt
            value: 15
            ledger: tra_no
          - type: set_flag
            flag: grh_con_pha_cua
            years: 6
            label: "{role.con.call} phá sạch vốn trên phố"
        success_result:
          - Hai năm sau, đầu phố huyện có hiệu "Phúc Thịnh" bán chè, bán thuốc bắc. Tết về, {role.con.call} gánh biếu cha mẹ hai cân chè ngon và một tấm lụa. Bạn ngồi uống chè mà thấy lòng ấm.
        failure_result:
          - Chưa đầy năm, hiệu đóng cửa. Tiền vốn chảy vào chiếu bạc và nhà cô đào. {role.con.call} về làng, đầu cúi gằm, sau lưng là chủ nợ cầm giấy đòi thêm mười lăm quan.
      - id: cho_20_thu_suc
        text: Cho 20 quan thử sức, bảo con làm ra lãi rồi mới tính tiếp
        hint: Mất ít hơn nếu hỏng; nhưng con cho là cha không tin mình
        condition:
          var: household.money
          op: ">="
          value: 20
        effects:
          - type: money
            value: -20
            ledger: chuyen_khac
          - type: opinion
            role: con
            value: -5
        chance:
          base: 0.4
          modifiers:
            - condition:
                var: role.con.skill.thuong_mai
                op: ">="
                value: 3
              add: 0.2
        success:
          - type: money
            value: 30
            ledger: thu_khac
          - type: opinion
            role: con
            value: 15
        failure:
          - type: opinion
            role: con
            value: -10
          - type: stress
            value: 8
        success_result:
          - "{role.con.call} mang hai chục quan đi buôn chè, nửa năm sau mang về ba chục, đặt lên bàn thờ trước mặt bạn. Lần đầu tiên hai người ngồi uống rượu với nhau như hai người lớn."
        failure_result:
          - Hai chục quan đi không trở lại. {role.con.call} bảo vốn ít quá nên mới hỏng, lỗi tại nhà bủn xỉn. Bữa cơm từ đó nặng như chì.
      - id: bat_lam_viec_nha
        text: "Gạt phắt: ở nhà làm ruộng ba năm đã, của nhà không phải để mày ném vào nhà cô đào"
        hint: Giữ được của; nhưng con hư mà bị ép thì có khi tự lấy
        trait_stress:
          tu_do: 4
        effects:
          - type: opinion
            role: con
            value: -30
        chance:
          base: 0.5
          modifiers:
            - condition:
                has_trait: hao_phong
                who: con
              add: -0.2
        success:
          - type: stress
            value: 6
        failure:
          - type: money
            value:
              var: household.money
              factor: -0.3
              max: 0
              min: -45
            ledger: su_kien
          - type: opinion
            role: con
            value: -15
          - type: stress
            value: 18
          - type: set_flag
            flag: grh_con_lay_trom
            years: 6
            label: "{role.con.call} lấy trộm tiền nhà"
        success_result:
          - "{role.con.call} hằm hằm vác cày ra đồng. Một mùa, hai mùa. Rồi đến một chiều, bạn thấy nó đứng trên bờ ruộng chỉ bảo mấy người làm thuê, ra dáng chủ nhà."
        failure_result:
          - Đêm ấy cái rương ở buồng trong bị cạy. Sáng ra {role.con.call} đã đi, để lại chiếc áo nâu vắt trên cọc rào. Hàng xóm thấy nó đi về phía phố huyện.
      - id: cuoi_vo_giu_chan
        text: Lo cưới vợ cho con, bỏ 25 quan làm cỗ, mong có vợ con thì nó chín chắn
        hint: Tốn kém, con không chắc đã nghe; nhưng nhà thêm người
        condition:
          var: household.money
          op: ">="
          value: 25
        effects:
          - type: money
            value: -25
            ledger: su_kien
          - type: arrange_child_marriage
            sex: m
          - type: opinion
            role: con
            value: -12
          - type: reputation
            group: dan_lang
            value: 5
        result:
          - Đám cưới linh đình ba ngày. {role.con.call} uống say mềm ngay mâm đầu. Nàng dâu mới hiền lành, ít nói. Bạn chỉ mong cái dây ấy buộc được chân con.
  - id: grh_ho_kien_ruong_huong_hoa
    title: Họ tộc kiện đòi ruộng hương hỏa
    tags:
