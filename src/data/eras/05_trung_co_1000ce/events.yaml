          - type: health
            value: -3
          - type: modifier
            target: harvest.yield
            value: 1.05
            op: mul
            months: 6
            label: Ruộng cày ải kỹ
        result:
          - Ba buổi sáng, bạn dắt trâu nhà bên ra đồng từ lúc sương còn đặc. Đất lật lên thành từng tảng nâu sẫm, phơi nắng chờ Tết.
      - id: thue_trau
