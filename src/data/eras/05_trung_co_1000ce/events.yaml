        effects:
          - type: opinion
            role: con
            value: 5
          - type: career_merit
            value: -2
        result:
          - Bà mối về, nhà buôn gỗ cũng chẳng chờ. Nửa năm sau họ cưới con gái một nhà khác trên bến.
