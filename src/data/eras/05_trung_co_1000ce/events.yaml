      - id: kien_len_huyen
        text: Mang sổ điền cũ lên huyện kiện ông lý đo gian
        hint: Thắng thì ông lý mất mặt; thua thì nộp phạt nặng gấp đôi và thêm thù
        condition:
          var: household.money
          op: ">="
          value: 10
        effects:
          - type: money
            value: -10
            ledger: su_kien
          - type: stress
            value: 10
        chance:
          base: 0.35
          skill: ngoai_giao
          per_level: 0.05
        success:
          - type: reputation
            group: dan_lang
            value: 15
          - type: opinion
            role: ly
            value: -30
        failure:
          - type: money
            value:
              var: household.money
              factor: -0.3
              max: 0
              min: -45
            ledger: thue
          - type: opinion
            role: ly
            value: -40
          - type: set_flag
            flag: grh_thu_ly_truong
            years: 8
            label: Thù với {role.ly.call} sau vụ kiện ruộng
        success_result:
          - "Thư lại huyện so sổ điền cũ, thấy đường bờ khớp từng thước. Quan quở {role.ly.call} trước công đường. Dân làng kháo nhau mấy tháng liền: nhà ấy dám kiện cả lý trưởng."
        failure_result:
          - Quan huyện với {role.ly.call} vốn là chỗ quen. Đơn bị bác, bạn bị phạt tội "vu cáo chức dịch". Ra khỏi công đường, {role.ly.call} đứng ở cổng, mỉm cười.
      - id: chiu_truy_thu
        text: Nhịn cho xong, nộp đủ truy thu và tiền phạt 35 quan
        hint: Không gây thù, nhưng mất trắng một khoản lớn vì cái sai không phải của mình
        condition:
          var: household.money
          op: ">="
          value: 35
        effects:
          - type: money
            value: -35
            ledger: thue
          - type: stress
            value: 12
          - type: opinion
            role: ly
            value: 4
        result:
          - Bạn đếm đủ ba mươi lăm quan đặt lên án thư nhà ông lý. Ông ta ghi biên lai, nét chữ rất đẹp. Đêm ấy bạn đi ra đồng, đứng nhìn đường bờ ruộng của ông bà mà nghiến răng.
      - id: cat_ruong_bu
        text: Không có tiền mặt, đành cắt một sào ruộng cho làng làm công điền để trừ
        hint: Giữ tiền mặt, mất ruộng tốt
        effects:
          - type: property_remove
            property: ruong
            count: 1
          - type: stress
            value: 12
          - type: reputation
            group: dan_lang
            value: 4
        result:
          - Sào ruộng đầu bờ được cắm cọc tre "công điền". Năm sau, bạn thấy người cày trên sào ấy là em vợ ông lý.
  - id: grh_ho_hang_nuong_nho
