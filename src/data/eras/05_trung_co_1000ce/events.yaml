          - Bạn thuộc từng bờ rào, lối tắt trong xóm. Chẳng ai đuổi kịp, nhưng mỗi lần đi qua đầu ngõ bạn vẫn rảo bước.
  - id: tt_nhat_cua_roi
    title: Nhặt được túi tiền đánh rơi
    tags:
      - lang_xa
      - tin_don
    life_stages:
      - thieu_thoi
    condition:
      var: player.age
      op: between
      value:
        - 8
        - 15
    roles:
      - id: ly
        from: village
        village_role: ly_truong
    weight: 5
    once_per_life: true
    tension: 3
    importance: 6
    icon: tien
    text:
      - Tan phiên chợ {world.settlement}, bạn nhặt được một túi vải chàm buộc chặt dưới gốc đa. Bên trong có ba quan tiền kẽm và một lá thư gấp tư. Trong nhà đang cần tiền.
    options:
      - id: dung_cho
        text: Ngồi lại gốc đa chờ người đánh rơi quay lại
        hint: Có thể chờ uổng công
        chance:
          base: 0.55
          skill: sinh_ton
          per_level: 0.03
        success:
          - type: reputation
            group: dan_lang
            value: 5
          - type: skill_xp
            skill: ngoai_giao
            value: 10
          - type: schedule_event
            event: tt_nguoi_mat_cua_tra_on
            months: 84
            label: Người lái buôn hẹn có ngày trả ơn
        failure:
          - type: stress
            value: 3
          - type: opinion
            role: ly
            value: 4
        success_result:
          - Gần tối, một người lái buôn đường xa hớt hải chạy lại. Ông mở túi đếm, rồi nắm tay bạn hỏi tên cha mẹ, hứa có ngày quay lại tạ ơn.
        failure_result:
          - Chờ đến tối mịt không thấy ai. Bạn đành mang túi tiền nộp {role.ly.call} giữ hộ.
      - id: nop_ly_truong
        text: Mang lên đình nộp {role.ly.call}
        effects:
          - type: opinion
            role: ly
            value: 8
          - type: reputation
            group: dan_lang
            value: 3
        result:
          - "{role.ly.call} khen bạn thật thà trước mặt các cụ. Chẳng ai biết ba quan tiền ấy rồi có về được tay chủ hay không."
      - id: dua_me
        text: Mang về đưa cho mẹ
        trait_stress:
          nhan_tu: 4
        effects:
          - type: money
            value: 3
            ledger: thu_khac
          - type: filial_piety
            value: 2
          - type: stress
            value: 2
        result:
          - Mẹ cầm túi tiền, lặng đi một lúc rồi cất vào đáy rương. Cả nhà không ai nhắc lại chuyện ấy nữa.
      - id: giu_tieu_rieng
        text: Giấu đi, để dành mua quà vặt
        trait_stress:
          nhan_tu: 3
          trung_thanh: 2
        effects:
          - type: money
            value: 1
            ledger: thu_khac
          - type: stress
            value: -2
          - type: chance
            p: 0.3
            then:
              - type: reputation
                group: dan_lang
                value: -4
            else: []
        result:
          - Bạn chôn túi tiền dưới gốc chuối sau nhà, mỗi tháng đào lên lấy vài đồng mua bánh đa. Thỉnh thoảng nghe người ta kể chuyện ai đó mất tiền ở chợ, bạn giật mình.
  - id: tt_nguoi_mat_cua_tra_on
    title: Người lái buôn năm xưa trở lại
    tags:
      - quan_he
      - thoi_co
      - buon_ban
    scheduled_only: true
    weight: 1
    tension: 3
    importance: 7
    icon: nguoi_la
    text:
      - Một cỗ xe trâu đỗ trước ngõ. Người lái buôn đánh rơi túi tiền ở gốc đa năm nào giờ tóc đã hoa râm, áo gấm, theo sau có hai người gánh hàng. "Năm ấy không có cái túi ấy, cả nhà tôi đã mất trắng chuyến hàng," ông nói.
    options:
      - id: nhan_moi_hang
        text: Xin ông cho theo học việc và chia mối hàng
        effects:
          - type: skill_xp
            skill: thuong_mai
            value: 28
          - type: modifier
            target: xp.thuong_mai
            value: 1.15
            op: mul
            months: 36
            label: Được lái buôn quen dìu dắt
          - type: money
            value: 2
            ledger: buon_ban
        result:
          - Ông dẫn bạn đi khắp các bến trong vùng, chỉ cho bạn mối nào thật, mối nào hay ăn quỵt.
      - id: xin_thu_tien_cu
        text: Xin ông viết thư tiến cử với một thầy học giỏi trên phủ
        effects:
          - type: skill_xp
            skill: hoc_van
            value: 24
          - type: scholarly_prestige
            value: 4
          - type: modifier
            target: xp.hoc_van
            value: 1.1
            op: mul
            months: 36
            label: Học thầy giỏi trên phủ
        result:
          - Lá thư của ông mở được cửa nhà một ông nghè về hưu. Lần đầu bạn được đọc những bộ sách mà trường làng chưa từng có.
      - id: nhan_qua
        text: Nhận món quà tạ ơn, giữ tình quen biết
        effects:
          - type: money
            value: 5
            ledger: thu_khac
          - type: reputation
            group: dan_lang
            value: 3
        result:
          - Ông để lại năm quan tiền và tấm lụa biếu cha mẹ bạn. Cả xóm kéo sang xem, ai cũng nhắc lại chuyện cái túi tiền năm xưa.
      - id: tu_choi_qua
        text: Từ chối, việc nên làm thì không lấy ơn
        trait_stress:
          tham_lam: 4
          tham_vong: 3
        effects:
          - type: reputation
            group: dan_lang
            value: 6
          - type: scholarly_prestige
            value: 3
          - type: stress
            value: -2
        result:
          - Ông lái buôn nhìn bạn hồi lâu rồi vái một vái. Câu chuyện được các cụ kể lại ở đình như một tấm gương.
  - id: tt_giu_em
    title: Ở nhà giữ em
    tags:
      - gia_dinh
    life_stages:
      - thieu_thoi
    condition:
      var: player.age
      op: between
      value:
        - 7
        - 13
    roles:
      - id: em
        from: family
        relation: sibling
        pick: youngest
        condition:
          var: self.age
          op: <=
          value: 3
      - id: hx
        from: village
        village_role: hang_xom
    weight: 6
    cooldown_years: 4
    tension: 2
    importance: 4
    icon: gia_dinh
    text:
      - "Mẹ đi vắng cả ngày, giao {role.em.call} cho bạn trông. Giữa trưa lũ bạn đứng ngoài rào gọi í ới: ra bãi sông tắm, có cả trò bắt chuồn chuồn."
    options:
      - id: o_nha_ru_em
        text: Ở nhà võng em, nấu nồi cháo trưa
        trait_stress:
          tu_do: 3
        effects:
          - type: filial_piety
            value: 4
          - type: skill_xp
            skill: sinh_ton
            value: 10
          - type: stress
            value: 3
        result:
          - Bạn hát hết bài ru này đến bài khác. Chiều mẹ về thấy {role.em.call} ngủ ngoan, nồi cháo còn ấm.
      - id: dia_em_di_choi
        text: Địu em ra bãi sông chơi cùng lũ bạn
        chance:
          base: 0.6
          skill: sinh_ton
          per_level: 0.05
        success:
          - type: stress
            value: -4
          - type: skill_xp
            skill: ngoai_giao
            value: 8
        failure:
          - type: health
            value: -4
            who: em
          - type: filial_piety
            value: -4
          - type: stress
            value: 5
        success_result:
          - Em ngồi trên bãi cát cười khanh khách nhìn lũ trẻ té nước. Chẳng ai biết chuyện.
        failure_result:
          - Mải chơi, bạn quay lại thì {role.em.call} đã bò ra mép nước, ướt sũng, sặc mấy ngụm. Tối ấy em sốt, mẹ khóc mà không nỡ đánh bạn.
      - id: gui_hang_xom
        text: Gửi em sang nhờ {role.hx.call} trông hộ
        effects:
          - type: opinion
            role: hx
            value: -3
          - type: stress
            value: -3
          - type: filial_piety
            value: -1
        result:
          - "{role.hx.call} nhận trông nhưng vừa bế vừa cằn nhằn. Chuyện đến tai mẹ, mẹ phải mang sang biếu bà mấy quả cà."
  - id: tt_om_nang_hoi_nho
    title: Trận ốm thập tử nhất sinh
    tags:
      - benh_tat
      - gia_dinh
    life_stages:
      - thieu_thoi
    months:
      - 6
      - 7
      - 8
      - 9
    condition:
      var: player.age
      op: between
      value:
        - 6
        - 12
    roles:
      - id: cm
        from: family
        relation: parent
      - id: lang
        from: village
        village_role: thay_lang
    weight: 4
    once_per_life: true
    tension: 6
    importance: 7
    icon: om
    text:
      - Mùa nước lên, bạn sốt li bì ba ngày không dứt, môi khô nứt, nói mê. {role.cm.call} ngồi bên giường suốt đêm, hết đắp khăn lại rót nước cháo. Người làng bàn mỗi người một kiểu.
    options:
      - id: moi_thay_lang
        text: Mời {role.lang.call} bắt mạch bốc thuốc (2 quan)
        condition:
          var: household.money
          op: ">="
          value: 2
        effects:
          - type: money
            value: -2
            ledger: su_kien
          - type: health
            value: 4
        result:
          - Mấy thang thuốc đắng ngắt, {role.cm.call} phải bóp mũi bạn mà đổ. Đến ngày thứ bảy cơn sốt lui dần.
      - id: ban_do_chua
        text: Bán đồ quý trong nhà lấy tiền mời thầy
        condition:
          var: household.money
          op: <
          value: 2
        effects:
          - type: health
            value: 4
          - type: filial_piety
            value: 4
          - type: stress
            value: 3
            who: cm
        result:
          - "{role.cm.call} lặng lẽ mang chiếc vòng bạc của bà ra chợ. Bạn khỏi bệnh, lớn lên mãi mới biết cái vòng ấy đã đi đâu."
      - id: cung_bai
        text: Mời thầy cúng về trừ tà (1 quan)
        chance:
          base: 0.45
          modifiers:
            - condition:
                var: player.health
                op: ">="
                value: 55
              add: 0.2
        effects:
          - type: money
            value: -1
            ledger: su_kien
        success:
          - type: health
            value: 2
        failure:
          - type: health
            value: -6
          - type: add_disease
            disease: sot_ret
        success_result:
          - Thầy cúng khua chiêng gõ mõ cả đêm. Sáng ra không biết nhờ ai, cơn sốt cũng hạ.
        failure_result:
          - Bùa dán đầy cửa mà sốt vẫn hành từng cơn. Mãi cả tháng sau bạn mới gượng ngồi dậy được.
      - id: la_xong
        text: Nấu nồi lá xông theo cách các cụ
        chance:
          base: 0.5
          modifiers:
            - condition:
                var: player.health
                op: ">="
                value: 55
              add: 0.2
        success:
          - type: health
            value: 2
          - type: skill_xp
            skill: sinh_ton
            value: 8
        failure:
          - type: health
            value: -8
          - type: stress
            value: 4
        success_result:
          - Nồi lá bưởi, lá sả, lá tre trùm chăn xông đến vã mồ hôi. Hai hôm sau bạn đã đòi ăn cháo.
        failure_result:
          - Xông mãi không đỡ, bạn gầy rộc đi. Trận ốm ấy để lại dáng người mảnh khảnh suốt mấy năm.
  - id: tt_theo_tho_hoc_nghe
    title: Học thêm một nghề tay trái
    tags:
      - lao_dong
      - nghe_nghiep
    life_stages:
      - thieu_thoi
    condition:
      var: player.age
      op: between
      value:
        - 12
        - 15
    roles:
      - id: lang
        from: village
        village_role: thay_lang
        optional: true
    weight: 5
    once_per_life: true
    tension: 3
    importance: 5
    icon: ky_nang
    text:
      - Mười mấy tuổi đầu, người lớn bảo đã đến lúc học thêm một nghề phòng thân. Ông thợ mộc làng bên đang cần người phụ, người chài trên bến cũng nhận trẻ học việc.
    options:
      - id: hoc_tho_moc
        text: Theo ông thợ mộc học bào đục
        effects:
          - type: skill_xp
            skill: sinh_ton
            value: 16
          - type: skill_xp
            skill: quan_tri
            value: 8
          - type: health
            value: -2
        result:
          - Mấy tháng đầu chỉ được mài đục và khiêng gỗ. Nhưng đến khi tự tay đẽo được cái chuôi cày, bạn mừng như được của.
      - id: hoc_cheo_do
        text: Theo người chài học chèo đò, đan lưới
        condition:
          var: world.settlement_type
          op: ==
          value: thi_tran_ben_song
        effects:
          - type: skill_xp
            skill: sinh_ton
            value: 18
          - type: skill_xp
            skill: thuong_mai
            value: 6
          - type: money
            value: 1
            ledger: thu_khac
        result:
          - Bạn học được cách đọc con nước, thả lưới lúc trời vừa sẩm. Mẻ cá đầu tiên tự tay đánh, bạn mang về biếu mẹ.
      - id: hoc_boc_thuoc
        text: Xin {role.lang.call} cho theo hái thuốc, sắc thuốc
        condition:
          role: lang
          exists: true
        effects:
          - type: skill_xp
            skill: hoc_van
            value: 12
          - type: skill_xp
            skill: sinh_ton
            value: 12
          - type: opinion
            role: lang
            value: 10
        result:
          - "Bạn thuộc dần tên từng vị thuốc: cam thảo, ngải cứu, bạc hà. {role.lang.call} bảo bạn tay nhẹ, có duyên với nghề."
      - id: day_tre_ranh
        text: Không học nghề, nhận dạy chữ vỡ lòng cho lũ trẻ trong xóm
        condition:
          var: household.career
          op: ==
          value: si_tu
        effects:
          - type: skill_xp
            skill: hoc_van
            value: 14
          - type: skill_xp
            skill: ngoai_giao
            value: 8
          - type: money
            value: 1
            ledger: day_hoc
          - type: scholarly_prestige
            value: 2
        result:
          - Mỗi chiều mấy đứa trẻ ngồi quanh hiên nhà bạn đọc "thiên, địa, nhân". Học phí là thúng khoai, quả bí, nhưng các bà mẹ gọi bạn là "cậu đồ con".
      - id: o_nha_phu_viec
        text: Thôi, ở nhà phụ việc nhà cho đỡ cha mẹ
        trait_stress:
          tham_vong: 3
        effects:
          - type: filial_piety
            value: 3
          - type: skill_xp
            skill: sinh_ton
            value: 8
          - type: stress
            value: -2
        result:
          - Bạn ở nhà gánh nước, bổ củi, vá phên. Mẹ đỡ vất, cha thỉnh thoảng nhìn bạn như muốn nói điều gì.
  - id: tt_le_vao_dinh
    title: Lễ vào sổ đinh
    tags:
      - lang_xa
      - tin_nguong
      - le_hoi
    life_stages:
      - thieu_thoi
    months:
      - 1
      - 2
    condition:
      all:
        - var: player.sex
          op: ==
          value: m
        - var: player.age
          op: between
          value:
            - 14
            - 15
    roles:
      - id: ly
        from: village
        village_role: ly_truong
    weight: 8
    once_per_life: true
    tension: 3
    importance: 6
    icon: lang
    text:
      - Đầu năm, các cụ họp ở đình ghi tên những người con trai sắp đến tuổi vào sổ đinh. Từ nay bạn có chỗ ngồi chiếu dưới ở đình, cũng có phần gánh sưu, đi phu. Theo lệ, nhà có con vào đinh phải khao làng.
    options:
      - id: khao_to
        text: Làm mâm xôi gà, vò rượu khao cả giáp
        condition:
          var: household.money
          op: ">="
          value: 3
        effects:
          - type: money
            value: -3
            ledger: su_kien
          - type: reputation
            group: dan_lang
            value: 6
          - type: opinion
            role: ly
            value: 6
          - type: filial_piety
            value: 3
        result:
          - Cả giáp ngồi kín hai gian đình. Các cụ nâng chén chúc bạn sớm thành người, {role.ly.call} còn xếp cho bạn ngồi gần chiếu trên.
      - id: khao_vua
        text: Nộp lệ vừa đủ, mâm cỗ đơn sơ
        effects:
          - type: money
            value: -1
            ledger: su_kien
          - type: reputation
            group: dan_lang
            value: -1
        result:
          - Mâm cỗ chỉ có đĩa xôi đậu và bát canh. Mấy ông chiếu trên liếc nhau, nhưng tên bạn vẫn được ghi vào sổ.
      - id: van_than
        text: Xin ghi tên vào hàng văn thân vì nhà có nghiệp học
        condition:
          all:
            - var: household.career
              op: ==
              value: si_tu
            - var: player.skill.hoc_van
              op: ">="
              value: 2
        chance:
          base: 0.5
          skill: hoc_van
          per_level: 0.06
        success:
          - type: scholarly_prestige
            value: 6
          - type: filial_piety
            value: 3
          - type: opinion
            role: ly
            value: 4
        failure:
          - type: reputation
            group: dan_lang
            value: -3
          - type: stress
            value: 4
        success_result:
          - Các cụ thử bạn mấy câu kinh nghĩa. Bạn đáp trôi chảy, được ngồi chiếu văn thân dù còn ít tuổi nhất.
        failure_result:
          - Bạn đáp vấp, một ông kỳ mục cười khẩy "chưa đỗ đạt gì đã đòi ngồi chiếu trên". Cả đình cười ồ.
      - id: xin_khat
        text: Xin {role.ly.call} khất lệ sang mùa sau
        hint: Cần ăn nói khéo
        chance:
          base: 0.4
          skill: ngoai_giao
          per_level: 0.06
        success:
          - type: skill_xp
            skill: ngoai_giao
            value: 12
        failure:
          - type: reputation
            group: dan_lang
            value: -4
          - type: opinion
            role: ly
            value: -6
          - type: stress
            value: 3
        success_result:
          - "{role.ly.call} gật đầu cho khất. Ông còn khen bạn ăn nói ra dáng người lớn."
        failure_result:
          - "{role.ly.call} lạnh lùng gạch tên bạn khỏi phần chia thịt tế. Cả làng biết nhà bạn nợ lệ."
  - id: tt_hoi_lang_dau_tien
    title: Hội làng đầu tiên được đi một mình
    tags:
      - le_hoi
      - lang_xa
    life_stages:
      - thieu_thoi
    months:
      - 1
      - 2
      - 3
    condition:
      var: player.age
      op: between
      value:
        - 9
        - 14
    weight: 7
    once_per_life: true
    tension: 2
    importance: 5
    icon: hoi
    text:
      - "Năm nay lần đầu bạn được đi hội một mình, trong túi có mấy đồng mừng tuổi. Sân đình trống giục từ sáng: bên này xới vật, bên kia đu tre, đằng sau có gánh hát chèo."
    options:
      - id: vao_xoi_vat
        text: Xin vào xới vật của lũ trẻ
        trait_stress:
          than_trong: 3
        chance:
          base: 0.4
          skill: quan_su
          per_level: 0.08
        success:
          - type: skill_xp
            skill: quan_su
            value: 16
          - type: reputation
            group: dan_lang
            value: 3
        failure:
          - type: health
            value: -3
          - type: skill_xp
            skill: quan_su
            value: 8
        success_result:
          - Bạn quật ngã đứa to con nhất xóm Đông. Các cụ thưởng cho bạn một gói chè và câu "thằng này có sức".
        failure_result:
          - Bạn bị ném văng ra mép xới, rát cả lưng. Nhưng cả buổi bạn vẫn đứng xem, học từng miếng vật.
      - id: xem_hat_cheo
        text: Ngồi xem gánh chèo đến tối
        effects:
          - type: skill_xp
            skill: ngoai_giao
            value: 10
          - type: skill_xp
            skill: hoc_van
            value: 6
          - type: stress
            value: -4
        result:
          - Tích Quan Âm Thị Kính làm bạn rơm rớm nước mắt. Đêm ấy về, bạn còn ngâm nga mãi câu hát của anh hề.
      - id: phu_ban_quan
        text: Phụ mẹ dọn hàng quà bánh ở cổng hội
        condition:
          var: household.career
          op: ==
          value: thuong_nhan
        effects:
          - type: money
            value: 1
            ledger: buon_ban
          - type: skill_xp
            skill: thuong_mai
            value: 12
          - type: stress
            value: 2
        result:
          - Bánh gai, kẹo kéo bán hết từ trưa. Hội chưa kịp xem, nhưng túi tiền nhà nặng thêm.
      - id: theo_cha_le_than
        text: Theo cha vào hậu cung xem các cụ tế thần
        condition:
          var: household.career
          op: ==
          value: si_tu
        effects:
          - type: skill_xp
            skill: hoc_van
            value: 10
          - type: filial_piety
            value: 3
          - type: scholarly_prestige
            value: 1
        result:
          - Bạn đứng nép sau cột, nghe ông chủ tế đọc văn tế giọng sang sảng. Chữ nghĩa trong bài tế bạn đã hiểu được dăm câu.
      - id: tieu_het_tien
        text: Tiêu hết mấy đồng vào bánh đa, kẹo bột và trò ném vòng
        effects:
          - type: stress
            value: -5
        result:
          - Bạn về nhà tay không, miệng còn dính đường, nhưng đó là ngày vui nhất năm.
  - id: tt_ket_ban_dua_tre_lang_thang
    title: Đứa trẻ theo gánh xiếc rong
    tags:
      - quan_he
      - lang_xa
    life_stages:
      - thieu_thoi
    condition:
      var: player.age
      op: between
      value:
        - 8
        - 13
    weight: 5
    once_per_life: true
    tension: 3
    importance: 6
    icon: tre_em
    text:
      - Gánh xiếc rong dừng lại {world.settlement} mấy hôm. Có một đứa trẻ trạc tuổi bạn, gầy nhẳng, chuyên đi trên dây và đội chum. Chiều nào nó cũng ngồi một mình sau bụi tre, gặm củ khoai sống. Người làng dặn con cháu đừng chơi với "lũ hát rong".
    options:
      - id: ket_nghia
        text: Chia nắm cơm, kết nghĩa với nó
        trait_stress:
          than_trong: 2
        effects:
          - type: food
            value: -1
          - type: skill_xp
            skill: ngoai_giao
            value: 14
          - type: reputation
            group: dan_lang
            value: -1
          - type: schedule_event
            event: tt_ban_xa_tro_ve
            months: 108
            label: Người bạn gánh xiếc hẹn ngày gặp lại
        result:
          - Hai đứa cắt tay nhỏ máu vào bát nước như trong truyện. Hôm gánh xiếc nhổ sào, nó dúi cho bạn chiếc còi trúc, hẹn có ngày quay lại.
      - id: hoc_tro_xiec
        text: Đổi nắm xôi lấy mấy miếng nhào lộn
        effects:
          - type: food
            value: -1
          - type: skill_xp
            skill: quan_su
            value: 12
          - type: skill_xp
            skill: sinh_ton
            value: 6
          - type: stress
            value: -3
        result:
          - Ba buổi chiều sau bụi tre, bạn học được lộn ngược và đi cà kheo. Gánh xiếc đi rồi, lũ trẻ trong xóm cứ đòi bạn biểu diễn.
      - id: nghe_loi_nguoi_lon
        text: Nghe lời người lớn, tránh xa
        trait_stress:
          nhan_tu: 3
        effects:
          - type: filial_piety
            value: 2
        result:
          - Bạn đi vòng qua bụi tre. Hôm gánh xiếc đi, bạn thấy nó ngoái lại nhìn mãi về phía xóm.
  - id: tt_ban_xa_tro_ve
    title: Người anh em kết nghĩa năm xưa
    tags:
      - quan_he
      - nguy_hiem
    scheduled_only: true
    weight: 1
    tension: 6
    importance: 7
    icon: nguoi_la
    text:
      - Nửa đêm có tiếng gõ phên. Dưới ánh trăng, một gã đàn ông vai u thịt bắp, áo rách, cánh tay quấn giẻ thấm máu, giơ lên chiếc còi trúc y hệt cái bạn còn giữ. Đứa trẻ gánh xiếc năm xưa giờ đã thành người, và đang bị tuần đinh truy đuổi.
    options:
      - id: giau_trong_kho
        text: Giấu anh ấy trong kho rơm mấy hôm
        hint: Nếu bị phát hiện, nhà bạn mang tội chứa chấp
        trait_stress:
          than_trong: 5
        chance:
          base: 0.55
          skill: muu_luoc
          per_level: 0.06
        success:
          - type: money
            value: 4
            ledger: thu_khac
          - type: skill_xp
            skill: muu_luoc
            value: 16
        failure:
          - type: wanted
            value: 12
          - type: reputation
            group: dan_lang
            value: -6
          - type: stress
            value: 6
        success_result:
          - Đêm thứ ba anh ấy lặng lẽ đi, để lại dưới gối rơm một thỏi bạc và lời hẹn "có việc gì cứ ra bến đò Ngang hỏi tên tôi".
        failure_result:
          - Tuần đinh lục soát kho rơm. Anh ấy kịp phá vách chạy thoát, còn tên bạn thì bị ghi vào sổ kẻ chứa chấp.
      - id: cho_tien_di
        text: Đưa ít tiền, ít gạo rồi bảo đi ngay
        effects:
          - type: money
            value: -2
            ledger: su_kien
          - type: food
            value: -1
          - type: stress
            value: 2
        result:
          - Anh ấy cầm gói gạo, nhìn bạn một lúc rồi khuất vào bóng tre. Chiếc còi trúc bạn vẫn giữ, nhưng chẳng dám thổi nữa.
      - id: bao_tuan_dinh
        text: Đóng cửa, sáng ra báo tuần đinh
        trait_stress:
          nhan_tu: 5
          trung_thanh: 4
        effects:
          - type: reputation
            group: dan_lang
            value: 3
          - type: stress
            value: 5
        result:
          - Người ta bắt được anh ấy ở bến đò. Lúc bị giải qua cổng làng, anh ấy ngẩng lên nhìn đúng về phía nhà bạn.
  - id: grh_lang_bo_duc_chuong
    title: Làng bổ tiền đúc chuông theo của
    tags:
      - lang_xa
      - kinh_te
      - tin_nguong
    life_stages:
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    condition:
      all:
        - var: player.is_head
          op: ==
          value: true
        - any:
            - var: household.net_worth
              op: ">="
              value: 120
            - var: household.money
              op: ">="
              value: 60
    roles:
      - id: ly
        from: village
        village_role: ly_truong
    weight: 5
    weight_modifiers:
      - condition:
          var: household.net_worth
          op: ">="
          value: 300
        factor: 1.8
      - condition:
          var: household.net_worth
          op: ">="
          value: 800
        factor: 1.67
    cooldown_years: 8
    tension: 5
    importance: 7
    icon: lang
    text:
      - "Quả chuông chùa làng nứt từ trận bão năm ngoái. Các cụ họp ở đình, quyết đúc chuông mới nặng hơn trăm cân đồng. {role.ly.call} cầm sổ đọc: tiền bổ theo của, nhà nghèo góp vài tiền, nhà bạn — giàu nhì nhất làng — góp ba mươi quan."
      - Ai cũng biết tên nhà góp nhiều sẽ được khắc vào thân chuông, mỗi lần chuông thỉnh là một lần nhắc. Ai cũng biết nhà nào kêu nghèo thì làng sẽ nhớ.
    options:
      - id: gop_du
        text: Góp đủ 30 quan theo sổ
        hint: Yên chuyện với làng, hao một khoản lớn
        condition:
          var: household.money
          op: ">="
          value: 30
        effects:
          - type: money
            value: -30
            ledger: su_kien
          - type: reputation
            group: dan_lang
            value: 10
          - type: opinion
            role: ly
            value: 6
        result:
          - Bạn đặt ba mươi quan lên mâm đồng giữa đình. Thủ từ ghi tên vào sổ công đức. Không ai khen, nhưng cũng không ai nói gì.
      - id: gop_gap_doi
        text: Góp hẳn 55 quan, xin khắc tên nhà mình lên thân chuông
        hint: Tiếng thơm lâu đời, nhưng của đi như nước
        condition:
          var: household.money
          op: ">="
          value: 55
        trait_stress:
          tham_lam: 8
        effects:
          - type: money
            value: -55
            ledger: su_kien
          - type: reputation
            group: dan_lang
            value: 25
          - type: dynasty_prestige
            value: 8
          - type: opinion
            role: ly
            value: 12
        result:
          - Ngày đúc chuông, cả làng ra xem đồng chảy đỏ rực. Tên nhà bạn nằm ngay hàng đầu thân chuông. Tiếng chuông đầu tiên ngân xa ba xã. Người già trong nhà chắp tay khấn mà rơm rớm.
      - id: keu_ngheo
        text: Kêu mất mùa, xin góp 8 quan thôi
        hint: Giữ được tiền nếu làng tin; không tin thì mang tiếng keo kiệt
        condition:
          var: household.money
          op: ">="
          value: 8
        effects:
          - type: money
            value: -8
            ledger: su_kien
        chance:
          base: 0.35
          skill: ngoai_giao
          per_level: 0.05
        success:
          - type: reputation
            group: dan_lang
            value: -3
        failure:
          - type: reputation
            group: dan_lang
            value: -18
          - type: opinion
            role: ly
            value: -20
          - type: set_flag
            flag: grh_tieng_keo_kiet
            years: 6
            label: Mang tiếng giàu mà keo kiệt với làng
        success_result:
          - Các cụ nhìn nhau rồi gật đầu. Năm ấy quả thực nhiều nhà mất mùa. Sổ công đức ghi tên bạn ở hàng giữa.
        failure_result:
          - '{role.ly.call} đập tay xuống chiếu: "Kho nhà ông thóc đầy đến mái, mà kêu mất mùa!" Cả đình cười ồ. Từ đó mỗi lần chuông thỉnh, người ta lại kể chuyện ông nhà giàu góp tám quan.'
      - id: tu_choi
        text: "Thẳng thừng không góp: tiền nhà mình làm ra, làng không có quyền bổ"
        hint: Không mất đồng nào, nhưng thành cái gai trong mắt cả làng
        trait_stress:
          nhan_tu: 4
          an_phan: 4
        effects:
          - type: reputation
            group: dan_lang
            value: -25
          - type: opinion
            role: ly
            value: -30
          - type: set_flag
            flag: grh_bi_lang_ghet
            years: 6
            label: Làng ghét vì không góp đúc chuông
          - type: modifier
            target: stress.monthly
            value: 0.4
            months: 24
            label: Bị làng xa lánh
        result:
          - Bạn đứng dậy ra về giữa lúc các cụ còn ngồi. Hôm sau, mõ làng đi rao rằng nhà bạn "không đồng lòng với làng". Đám giỗ tháng ấy, không nhà nào mời bạn.
  - id: grh_ly_truong_do_ruong
