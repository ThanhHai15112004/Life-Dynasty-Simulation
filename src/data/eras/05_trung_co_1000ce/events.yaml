        failure_result:
          - Lá đơn đi vòng một vòng rồi về đúng tay kẻ bị tố. Đêm ấy lính đến tận chỗ trọ, gông bạn đi với tội "phỉ báng trường thi". Trong ngục, bạn ngồi đếm vết nứt trên tường mà nghĩ về chữ "sĩ".
  - id: bn_lua_mat_von_buon
