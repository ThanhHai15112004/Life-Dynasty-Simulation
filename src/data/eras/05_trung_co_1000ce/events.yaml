    tags:
      - gia_dinh
      - quan_he
      - kinh_te
    life_stages:
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    condition:
      all:
        - var: player.is_head
          op: ==
          value: true
        - any:
            - var: household.net_worth
              op: ">="
              value: 120
            - var: household.money
              op: ">="
              value: 60
    weight: 5
    weight_modifiers:
      - condition:
          var: household.net_worth
          op: ">="
          value: 300
        factor: 1.8
      - condition:
          var: household.net_worth
          op: ">="
          value: 800
        factor: 1.67
      - condition:
          var: world.harvest_quality
          op: in
          value:
            - kem
            - mat_mua
        factor: 1.6
    cooldown_years: 7
    tension: 5
    importance: 7
    icon: gia_dinh
    text:
      - Một buổi chiều, ông chú họ ba đời bên nội dắt díu cả nhà sáu miệng ăn đứng trước cổng. Quê ông mất mùa, đất bị bá hộ xiết. "Nghe nói nhà cháu nay đã khá, chú dắt các em sang nương nhờ ít lâu." Ít lâu là bao lâu, ông không nói.
      - Đứa nhỏ nhất ôm chân mẹ, đói lả. Ông chú cầm theo cuốn gia phả, giở đúng trang có tên ông nội bạn và ông nội ông là hai anh em ruột.
    options:
      - id: cho_o_lau_dai
        text: Dọn gian chái cho cả nhà chú ở, cơm ăn chung mâm
        hint: Trọn tình họ hàng; nhà thêm sáu miệng ăn mấy năm trời
        trait_stress:
          tham_lam: 8
        effects:
          - type: modifier
            target: living.cost
            value: 1.35
            op: mul
            months: 36
            label: Nuôi cả nhà chú họ
          - type: modifier
            target: food.consumption
            value: 1.3
            op: mul
            months: 36
            label: Nuôi cả nhà chú họ
          - type: adopt_relative
          - type: reputation
            group: dan_lang
            value: 12
          - type: dynasty_prestige
            value: 6
          - type: stress
            value: 8
        result:
          - Gian chái kê thêm hai chiếc chõng tre. Bữa cơm nhà bạn từ đó phải nấu hai nồi. Mấy năm sau cả nhà chú dọn đi, để lại một đứa cháu ở lại làm con nuôi.
      - id: cho_ruong_cay_re
        text: Cho chú cấy rẽ hai sào, dựng túp lều ở bãi sau, tự làm tự ăn
        hint: Bớt gánh cho nhà, nhưng mất phần hoa lợi của hai sào ấy
        condition:
          var: household.farmland
          op: ">="
          value: 3
        effects:
          - type: money
            value: -10
            ledger: su_kien
          - type: modifier
            target: harvest.yield
            value: 0.82
            op: mul
            months: 36
            label: Chia ruộng cho chú họ cấy rẽ
          - type: reputation
            group: dan_lang
            value: 8
        result:
          - Ông chú đi cày từ lúc trời chưa sáng, gặt xong mang sang biếu một gánh thóc ngon nhất. Bồ thóc nhà bạn vơi hơn mọi năm, nhưng sân nhà vẫn yên.
      - id: cho_tien_bao_di
        text: Đưa 20 quan làm lộ phí, khuyên chú lên trấn tìm việc
        hint: Giữ được nếp nhà, nhưng họ hàng sẽ bảo nhà giàu đuổi người cùng máu mủ
        condition:
          var: household.money
          op: ">="
          value: 20
        effects:
          - type: money
            value: -20
            ledger: su_kien
          - type: reputation
            group: dan_lang
            value: -6
          - type: dynasty_prestige
            value: -3
          - type: stress
            value: 4
        result:
          - Ông chú cầm tiền, cúi chào rồi dắt cả nhà đi. Đến chỗ ngoặt, ông quay lại nhìn cái nhà ngói một lúc lâu. Tết năm ấy, cả họ bên nội không ai sang chúc.
      - id: tu_choi
        text: "Chối phắt: nhà cũng chật vật, không nuôi thêm ai được"
        hint: Không tốn một đồng, nhưng tiếng ác lan nhanh hơn tiếng thiện
        trait_stress:
          nhan_tu: 10
          trong_gia_dinh: 6
        effects:
          - type: reputation
            group: dan_lang
            value: -20
          - type: dynasty_prestige
            value: -8
          - type: stress
            value: 10
          - type: set_flag
            flag: grh_ho_hang_oan
            years: 10
            label: Họ hàng bên nội oán vì không cho nương nhờ
        result:
          - Cánh cổng gỗ đóng lại. Đêm ấy cả nhà chú ngủ ở hiên đình làng. Sáng ra, bà hàng nước kể chuyện cho cả chợ nghe, thêm thắt rằng nhà bạn có ba kho thóc.
  - id: grh_trom_khoet_vach
    title: Trộm khoét vách đêm mưa
    tags:
      - nguy_hiem
      - lang_xa
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    condition:
      all:
        - var: player.is_head
          op: ==
          value: true
        - any:
            - var: household.net_worth
              op: ">="
              value: 120
            - var: household.money
              op: ">="
              value: 60
    weight: 5
    weight_modifiers:
      - condition:
          var: household.net_worth
          op: ">="
          value: 300
        factor: 1.8
      - condition:
          var: household.net_worth
          op: ">="
          value: 800
        factor: 1.67
      - condition:
          var: world.weather
          op: in
          value:
            - mua
            - mua_phun
        factor: 1.5
      - condition:
          has_flag: grh_nha_co_tuan_canh
        factor: 0.3
    cooldown_years: 5
    tension: 7
    importance: 7
    icon: tin_don
    text:
      - Đêm mưa to, bạn giật mình vì tiếng sột soạt ở vách buồng sau, chỗ kê cái rương đựng tiền. Một lỗ thủng to bằng cái nia đã khoét xong qua vách đất. Có bàn tay đang thò vào.
      - Ngoài sân lờ mờ hai bóng người, một đứa đứng canh cổng, tay cầm dao phay. Tiếng mưa át cả tiếng thở.
    options:
      - id: ho_hoan_duoi
        text: Vớ đòn gánh, hô hoán đuổi
        hint: Giữ được rương; nhưng bọn trộm đêm có dao
        chance:
          base: 0.45
          skill: quan_su
          per_level: 0.06
        success:
          - type: reputation
            group: dan_lang
            value: 6
          - type: health
            value: -5
          - type: skill_xp
            skill: quan_su
            value: 25
        failure:
          - type: health
            value: -25
          - type: money
            value:
              var: household.money
              factor: -0.35
              max: 0
              min: -60
            ledger: su_kien
          - type: stress
            value: 15
        success_result:
          - Bạn quật trúng một gã, nó rú lên rồi lủi qua bờ rào. Đuốc cả xóm bật sáng. Rương tiền còn nguyên, chỉ có vách nhà thủng một lỗ phải trát lại.
        failure_result:
          - Gã canh cổng xông vào, một nhát dao phay sượt qua cánh tay bạn. Bạn ngã vật ra. Lúc hàng xóm chạy sang thì bọn chúng đã ôm rương mất hút trong mưa.
      - id: nam_im
        text: Nằm im, mặc chúng lấy, giữ cái mạng cho cả nhà
        hint: Không ai bị thương, nhưng mất một khoản lớn
        trait_stress:
          can_dam: 8
          nong_nay: 6
        effects:
          - type: money
            value:
              var: household.money
              factor: -0.4
              max: 0
              min: -55
            ledger: su_kien
          - type: stress
            value: 15
        result:
          - Bạn nằm im trong bóng tối, ra hiệu cho cả nhà nín thở, nghe từng tiếng rương bị kéo lê. Sáng ra cái vách thủng nhìn thẳng ra vườn chuối. Cả nhà không ai nói gì suốt bữa sáng.
      - id: bao_quan_truy
        text: Sáng ra lên huyện trình báo, nộp 8 quan để lính truy bắt
        hint: Lính truy được thì lấy lại phần nào; không thì mất cả hai
        condition:
          var: household.money
          op: ">="
          value: 8
        effects:
          - type: money
            value:
              var: household.money
              factor: -0.4
              max: 0
              min: -55
            ledger: su_kien
          - type: money
            value: -8
            ledger: su_kien
        chance:
          base: 0.3
          skill: ngoai_giao
          per_level: 0.04
        success:
          - type: money
            value: 30
            ledger: thu_khac
          - type: reputation
            group: dan_lang
            value: 4
        failure:
          - type: stress
            value: 12
        success_result:
          - Một tháng sau, lính huyện tóm được bọn trộm khi chúng tiêu tiền ở sòng bạc trên phủ. Bạn nhận lại được non nửa, ký tên vào sổ ba lần.
        failure_result:
          - Lính về làng hỏi han lấy lệ, ăn một bữa cơm gà rồi đi. Tám quan lệ phí cũng theo bọn trộm mà đi.
      - id: xay_tuong_thue_canh
        text: Mất thì đã mất; bỏ 25 quan xây tường gạch, thuê tuần đinh canh đêm
        hint: Từ nay yên giấc, nhưng tiêu thêm một khoản trên đống đã mất
        condition:
          var: household.money
          op: ">="
          value: 25
        effects:
          - type: money
            value:
              var: household.money
              factor: -0.35
              max: 0
              min: -50
            ledger: su_kien
          - type: money
            value: -25
            ledger: mua_sam
          - type: set_flag
            flag: grh_nha_co_tuan_canh
            years: 8
            label: Nhà có tường gạch, có người canh đêm
          - type: stress
            value: -4
        result:
          - Bức tường gạch cao quá đầu người mọc lên quanh nhà, trên mặt cắm đầy mảnh chai. Đêm đêm có tiếng mõ tuần đinh gõ quanh ngõ. Người làng bảo nhà ấy giờ như dinh quan.
  - id: grh_con_doi_chia_cua
    title: Con trai đòi chia của ra phố
    tags:
