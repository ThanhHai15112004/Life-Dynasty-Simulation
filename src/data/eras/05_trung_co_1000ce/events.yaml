          op: ==
          value: linh
        - var: player.career_years
          op: ">="
          value: 2
    weight: 14
    cooldown_years: 6
    importance: 8
    icon: kiem
    options:
      - id: nhan_tien_thuong_giai_ngu
        text: Nhận tiền trợ cấp giải ngũ rồi khoác tay nải trở về quê
        effects:
          - type: money
            value: 6
          - type: set_career
