          - type: trigger_inheritance
            share_factor: 1.25
          - type: filial_piety
            value: -8
          - type: reputation
            group: dan_lang
            value: -6
          - type: stress
            value: 8
        result:
          - Bạn giữ được phần ruộng và tiền nhiều hơn, nhưng ánh mắt anh em họ hàng nhìn bạn từ đó lạnh nhạt hẳn.
  - id: gd_ho_hang_cuu_giup
