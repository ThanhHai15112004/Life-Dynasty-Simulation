          op: ">="
          value: 32
        - var: player.children_count
          op: ==
          value: 0
    text:
      - Tuổi đời ngày một chồng chất mà trong nhà vẫn vắng tiếng trẻ thơ. Các bậc trưởng bối trong họ {dynasty.family_name} bắt đầu nhắc chuyện nhận con nuôi hoặc đón cháu họ về lập tự để sau này có người chống gậy, giữ lửa hương hỏa.
    options:
      - id: nhan_con_nuoi
        text: Làm lễ nhận một đứa trẻ hiền lành làm con nuôi (2 quan)
        condition:
          var: household.money
          op: ">="
          value: 2
        effects:
          - type: money
            value: -2
          - type: adopt_child
            sex: m
          - type: stress
            value: -8
        result:
          - Từ hôm ấy trong nhà rộn ràng tiếng gọi cha mẹ. Bạn có người nối dõi sớm hôm quây quần.
      - id: don_chau_ho
        text: Đón một người cháu họ từ chi xa về truyền dạy nghề nhà (3 quan)
        condition:
          var: household.money
          op: ">="
          value: 3
        effects:
          - type: money
            value: -3
          - type: adopt_relative
            sex: m
          - type: filial_piety
            value: 4
        result:
          - Người cháu họ chăm chỉ về ở cùng, vừa phụ giúp đồng áng vừa giữ vững gốc gác huyết thống họ {dynasty.family_name}.
      - id: cho_duyen_troi
        text: Chưa vội, vẫn tin trời đất sẽ cho mình mụn con ruột
        effects:
          - type: stress
            value: 3
        result:
          - Bạn khước từ lời khuyên của họ tộc, lòng vẫn nuôi hy vọng vào duyên con cái.
  - id: theo_doan_nguoi_di_xa
    title: Đoàn người rủ đi làm ăn phương xa
    text:
      - Một đoàn thương buôn và phu mỏ đi ngang vùng đang tuyển người trai tráng theo thuyền vào phương Nam và lên vùng mỏ biên viễn. Đi xa vất vả, biền biệt mấy năm mới về, nhưng tiền công trả cao gấp nhiều lần ở quê.
    tags:
      - buoc_ngoat
      - co_hoi
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      all:
        - not:
            has_flag: di_lam_an_xa
        - var: player.health
          op: ">="
          value: 55
    weight: 9
    cooldown_years: 5
    importance: 7
    icon: thuyen
    options:
      - id: ky_giao_keo_di_xa
        text: Ký giao kèo theo đoàn đi làm ăn xa vài năm tích cóp vốn liếng
        trait_stress:
          trong_gia_dinh: 6
          an_phan: 5
        effects:
          - type: money
            value: 5
          - type: set_flag
            flag: di_lam_an_xa
            years: 3
            label: Đang đi làm ăn phương xa
          - type: skill_xp
            skill: sinh_ton
            value: 20
          - type: schedule_event
            event: thu_nha_tu_phuong_xa
            months: 6
            keep_roles: false
        result:
          - Bạn ngoái nhìn mái nhà lần cuối trong sương sớm rồi bước lên thuyền cùng đoàn người tha hương.
      - id: o_nha_cham_lo_gia_dinh
        text: Không đành lòng rời xa gia đình, ở lại quê nhà làm lụng
        effects:
          - type: stress
            value: -2
          - type: food
            value: 5
        result:
          - Bạn chọn sự bình yên bên người thân thay vì đánh đổi những năm tháng phiêu bạt.
  - id: thu_nha_tu_phuong_xa
    title: Cánh thư nhà nơi đất khách
    text:
      - Sau nửa năm đổ mồ hôi nơi đất khách quê người, bạn cầm trên tay túi tiền công vừa lĩnh cùng bức thư nhắn hỏi thăm của người nhà gửi theo thuyền buôn.
    tags:
      - gia_dinh
      - buon_ban
    scheduled_only: true
    weight: 10
    importance: 6
    icon: thu
    options:
      - id: gui_phan_lon_tien_ve_nha
        text: Gửi phần lớn tiền công về phụ giúp gia đình, chỉ giữ lại chút ít phòng thân
        effects:
          - type: money
            value: 8
          - type: filial_piety
            value: 6
          - type: stress
            value: -4
          - type: schedule_event
            event: ngay_tro_ve_sau_nam_thang
            months: 10
            keep_roles: false
        result:
          - Khoản tiền bạn gửi về giúp gia đình ở quê trang trải nợ nần và sửa sang lại mái nhà.
      - id: gom_von_mua_hang_buon_chuyen
        text: Giữ tiền gom mua đặc sản địa phương chờ ngày mang về bán kiếm lời gấp đôi
        chance:
          base: 0.65
          skill: thuong_mai
          per_level: 0.06
        success:
          - type: money
            value: 15
          - type: skill_xp
            skill: thuong_mai
            value: 30
          - type: schedule_event
            event: ngay_tro_ve_sau_nam_thang
            months: 10
            keep_roles: false
        failure:
          - type: money
            value: 2
          - type: stress
            value: 6
          - type: schedule_event
            event: ngay_tro_ve_sau_nam_thang
            months: 10
            keep_roles: false
        success_result:
          - Mẻ hàng trầm hương và vải quý bạn gom được tăng giá mạnh khi thuyền về xuôi.
        failure_result:
          - Mưa ẩm làm hỏng một phần kiện hàng, may mà vẫn giữ lại được chút tiền công gốc.
  - id: tai_nan_noi_dat_khach
    title: Hiểm nguy nơi công trường xa xứ
    text:
      - Một trận mưa bão lớn bất ngờ ập xuống khu lán trại nơi đất khách khiến hầm mỏ và kho hàng có nguy cơ sạt lở.
    tags:
      - tai_hoa
      - co_hoi
    condition:
      all:
        - has_flag: di_lam_an_xa
    weight: 8
    cooldown_years: 3
    importance: 6
    icon: mua
    options:
      - id: xong_vao_cuu_anh_em_va_kho
        text: Dẫn đầu anh em đồng hương chằng chống kho hàng và đưa người bị kẹt ra ngoài
        chance:
          base: 0.68
          skill: sinh_ton
          per_level: 0.05
        success:
          - type: money
            value: 9
          - type: reputation
            group: dan_lang
            value: 8
          - type: skill_xp
            skill: quan_su
            value: 20
        failure:
          - type: money
            value: 3
          - type: health
            value: -8
        success_result:
          - Chủ đoàn cảm kích trước sự dũng cảm của bạn, thưởng hậu và giao quyền trông coi cả đội.
        failure_result:
          - Bạn cứu được mọi người nhưng bị gỗ va trúng vai, phải nằm nghỉ mất nửa tháng.
      - id: tim_cho_tru_an_an_toan
        text: Nhanh chóng thu gom đồ đạc cá nhân rút lên gò cao lánh nạn
        effects:
          - type: stress
            value: 2
        result:
          - Bạn giữ được an toàn cho bản thân qua cơn giông bão nơi đất khách.
  - id: ngay_tro_ve_sau_nam_thang
    title: Ngày trở về sau tháng năm bôn ba
    text:
      - Chuyến đi làm ăn xa khép lại. Bước chân về tới đầu làng với vốn liếng và kinh nghiệm dày dặn sau chuỗi ngày tha hương, cả nhà ùa ra đón bạn trong niềm vui đoàn tụ.
    tags:
      - gia_dinh
      - buoc_ngoat
    scheduled_only: true
    weight: 10
    importance: 7
    icon: gia_dinh
    options:
      - id: dem_von_mua_them_ruong_vuon
        text: Đem tiền tích cóp dựng lại cơ ngơi và bồi đắp gia sản ở quê nhà
        effects:
          - type: clear_flag
            flag: di_lam_an_xa
          - type: money
            value: 10
          - type: stress
            value: -8
          - type: reputation
            group: dan_lang
            value: 6
        result:
          - Những giọt mồ hôi nơi xứ người đã hóa thành lưng vốn vững chắc cho gia đình.
      - id: dung_kinh_nghiem_mo_duong_buon
        text: Dùng mối quen biết từ chuyến đi xa để chuyển hẳn sang nghề buôn bán
        effects:
          - type: clear_flag
            flag: di_lam_an_xa
          - type: set_career
            career: thuong_nhan
          - type: money
            value: 7
          - type: skill_xp
            skill: thuong_mai
            value: 30
        result:
          - Bạn trở thành người kết nối nguồn hàng giữa quê nhà và những vùng đất từng đi qua.
  - id: sk_chuyen_ra_thi_tran
    title: Dời nhà ra thị trấn bến sông
    text:
      - Mấy phiên chợ gần đây, bến {world.town_name} thuyền bè tấp nập, hàng hóa xoay vòng nhanh gấp rưỡi trong làng. Nhìn lại cơ ngơi ở {world.settlement}, bạn bàn với người nhà chuyện dời hộ ra phố chợ để mở rộng đường làm ăn.
    tags:
      - buon_ban
      - gia_dinh
      - thoi_co
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
      all:
        - var: world.settlement_type
          op: ==
          value: lang_nong
        - var: player.is_head
          op: ==
          value: true
        - var: household.money
          op: ">="
          value: 10
    weight: 4
    cooldown_years: 8
    tension: 4
    importance: 7
    icon: nha
    options:
      - id: ban_ruong_ra_pho
        text: Bán hết ruộng vườn ở làng, dồn vốn dời cả nhà ra bến {world.town_name}
        hint: Thu tiền bán ruộng làm vốn lớn buôn bán ở thị trấn
        effects:
          - type: relocate_settlement
            settlement: thi_tran_ben_song
            sell_properties: true
            free: false
          - type: skill_xp
            skill: thuong_mai
            value: 18
        result:
          - Cả nhà thu xếp đồ đạc và tiền bán ruộng chuyển ra bến {world.town_name}. Trước mắt là phố chợ sầm uất đầy cơ hội.
      - id: giu_ruong_phat_canh
        text: Dời nhà ra bến {world.town_name} nhưng giữ lại ruộng quê cho tá điền cấy rẽ
        hint: Tốn phí chuyển nhà, giữ được nguồn thóc tô ở quê mỗi mùa gặt
        effects:
          - type: relocate_settlement
            settlement: thi_tran_ben_song
            sell_properties: false
            free: false
          - type: skill_xp
            skill: quan_tri
            value: 15
        result:
          - Gia đình dời ra thị trấn {world.town_name} mở hướng kinh doanh, còn ruộng vườn ở quê giao cho họ hàng trông nom thu tô.
      - id: o_lai_lang_cu
        text: Bám đất quê cha đất tổ, chưa vội rời làng lúc này
        hint: Giữ nếp sống ổn định nơi thôn dã
        effects:
          - type: stress
            value: -3
          - type: reputation
            group: dan_lang
            value: 3
        result:
          - Bạn quyết định ở lại {world.settlement}, giữ vững gốc rễ ruộng đồng.
  - id: sk_quan_van_nham_chuc_phu
    title: Sắc chỉ nhậm chức ở phủ thành
    text:
      - "Trát bổ nhiệm từ nha môn vừa truyền xuống: nhờ khoa danh và uy vọng sẵn có, bạn được triệu lên phủ {world.prefecture_name} nhận chức quan văn. Cổng thành cao vợi và quan trường rộng mở đang chờ phía trước."
    tags:
      - hoc_hanh
      - van_minh
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    condition:
      all:
        - var: world.settlement_type
          op: "!="
          value: phu_thanh
        - any:
            - var: player.exam_degree
              op: in
              value:
                - huong_cong
                - tien_si
            - all:
                - var: player.career
                  op: ==
                  value: si_tu
                - var: player.career_rank
                  op: ">="
                  value: 2
            - all:
                - var: player.career
                  op: ==
                  value: nha_lai
                - var: player.career_rank
                  op: ">="
                  value: 1
    weight: 6
    cooldown_years: 10
    tension: 5
    importance: 9
    icon: sach
    options:
      - id: dua_gia_quyen_len_phu
        text: Đưa cả gia quyến lên phủ {world.prefecture_name} nhậm chức, giữ ruộng quê thu tô
        hint: Dời hộ lên Phủ thành, nhận bổng lộc an gia và thăng bậc quan văn
        effects:
          - type: relocate_settlement
            settlement: phu_thanh
            sell_properties: false
            official: true
          - type: scholarly_prestige
            value: 8
          - type: dynasty_prestige
            value: 10
        result:
          - Võng lọng rợp đường đưa gia đình bạn lên phủ {world.prefecture_name}. Từ nay bước chân vào chốn quan trường nơi phủ lỵ.
      - id: ban_ruong_an_cu_phu_thanh
        text: Sang nhượng ruộng vườn ở quê, tậu cơ ngơi định cư hẳn trên phủ {world.prefecture_name}
        hint: Bán ruộng cũ lấy vốn lớn, dời hộ lên Phủ thành nhậm chức
        effects:
          - type: relocate_settlement
            settlement: phu_thanh
            sell_properties: true
            official: true
          - type: scholarly_prestige
            value: 6
          - type: skill_xp
            skill: quan_tri
            value: 20
        result:
          - Thu xếp xong việc nhà ở quê, bạn mang toàn bộ vốn liếng cùng gia đình lên định cư tại phủ {world.prefecture_name}.
      - id: tu_choi_o_lai_que
        text: Xin cáo bệnh ở lại quê nhà dạy học, giữ tiết thanh cao
        hint: Không lên phủ, tăng mạnh Danh vọng sĩ phu và giảm căng thẳng
        effects:
          - type: scholarly_prestige
            value: 10
          - type: reputation
            group: dan_lang
            value: 6
          - type: stress
            value: -8
        result:
          - Bạn dâng biểu từ chối chức quan trên phủ để ở lại quê nhà mở trường dạy chữ. Sĩ lâm khắp vùng đều nể trọng.
  - id: sk_dich_bung_thi_tran
    title: Dịch bệnh bùng lên nơi bến chợ
    text:
      - Những ngày nắng gắt xen mưa dầm, từ các thuyền buôn cập bến {world.town_name} bỗng bùng lên cơn dịch {world.epidemic_disease}. Chợ bến vắng hoe, khói đốt bồ kết và vôi bột phủ trắng các ngõ.
    tags:
      - nguy_hiem
      - lang_xa
    condition:
      any:
        - var: world.any_epidemic
          op: ==
          value: true
        - var: world.settlement_type
          op: ==
          value: thi_tran_ben_song
    weight: 6
    cooldown_years: 4
    tension: 7
    importance: 8
    icon: om
    options:
      - id: dong_cua_phong_dich
        text: Đóng chặt cổng ngõ, rắc vôi bột và sắc nước lá phòng dịch cho cả nhà
        hint: Tốn 2 quan mua thuốc phòng và vôi bột, bảo vệ sức khỏe gia đình
        effects:
          - type: money
            value: -2
            ledger: thuoc_men
          - type: health
            value: 5
            who: household
          - type: stress
            value: -3
        result:
          - Nhờ cẩn trọng rắc vôi và uống nước lá đun sôi, cả nhà giữ được sức vóc bình an giữa mùa dịch.
      - id: gop_thuoc_cuu_dan
        text: Xuất 4 quan mua thảo dược phát cho các hộ nghèo quanh bến
        hint: Tốn 4 quan, tăng mạnh danh tiếng và ân đức trong vùng
        condition:
          var: household.money
          op: ">="
          value: 4
        effects:
          - type: money
            value: -4
            ledger: thuoc_men
          - type: reputation
            group: dan_lang
            value: 10
          - type: filial_piety
            value: 5
          - type: skill_xp
            skill: sinh_ton
            value: 14
        result:
          - Nồi nước thuốc thơm nồng đầu ngõ cứu được nhiều người qua cơn sốt, bà con quanh vùng hết lời cảm kích.
      - id: tranh_dich_tam_thoi
        text: Cố gắng sinh hoạt cầm chừng, hạn chế ra bến sông
        hint: Không tốn tiền nhưng cả nhà lo lắng, giảm chút sức khỏe
        effects:
          - type: health
            value: -4
            who: household
          - type: stress
            value: 6
        result:
          - Mấy tháng dịch giã trôi qua trong thấp thỏm, ai nấy trong nhà đều gầy rộc đi.
  - id: sk_di_buon_nha_co_viec
    title: Đang đi buôn chuyến thì nhà nhắn tin gấp
    text:
      - "Đang nghỉ đêm ở quán trọ nơi {world.current_settlement_name} cùng kiện hàng chưa kịp bán hết, bạn bỗng gặp người làng hớt hải tìm đến báo tin: ở quê nhà {world.settlement} đang có việc bất trắc, người nhà ốm sốt và mái nhà dột nặng sau trận giông!"
    tags:
      - buon_ban
      - gia_dinh
      - nguy_hiem
    condition:
      any:
        - var: player.is_traveling
          op: ==
          value: true
        - var: flag.nha_co_viec_khi_di_xa
          op: ==
          value: true
    weight: 9
    cooldown_years: 2
    priority: true
    tension: 7
    importance: 8
    icon: buon
    options:
      - id: ban_thao_quay_ve_gap
        text: Bán tháo kiện hàng ngay tại bến, tức tốc quay về quê lo cho gia đình
        hint: Hủy chuyến buôn sớm (chịu thiệt 30% vốn hàng), giữ trọn đạo hiếu và sức khỏe người nhà
        effects:
          - type: clear_flag
            flag: nha_co_viec_khi_di_xa
          - type: end_trip
            cancel: true
          - type: health
            value: 6
            who: household
          - type: filial_piety
            value: 6
          - type: reputation
            group: dan_lang
            value: 4
        result:
          - Dù chịu thiệt một phần tiền hàng, bạn kịp về đến nhà sắc thuốc và chằng chống lại mái tranh, cả nhà mừng rơi nước mắt.
      - id: gui_tien_thuoc_ve_truoc
        text: Cậy người quen cầm 3 quan tiền thuốc về trước, mình ở lại bán nốt chuyến hàng
        hint: Tốn 3 quan gửi về, giữ nguyên chuyến buôn để thu hồi đủ vốn lời
        condition:
          var: household.money
          op: ">="
          value: 3
        effects:
          - type: clear_flag
            flag: nha_co_viec_khi_di_xa
          - type: money
            value: -3
            ledger: thuoc_men
          - type: end_trip
            cancel: false
          - type: stress
            value: 4
        result:
          - Nhờ khoản tiền gửi về kịp lúc, ở nhà mời được thầy lang chạy chữa, còn bạn cũng chốt xong chuyến hàng có lời.
      - id: co_ban_xong_moi_ve
        text: Cắn răng nán lại bán hết giá cao rồi mới lên đường về
        hint: Giữ trọn lời buôn chuyến nhưng người nhà suy giảm sức khỏe và trách móc
        effects:
