          value: 10
        pick: youngest
        optional: true
    weight: 6
    once_per_life: true
    tension: 4
    importance: 8
    icon: sach
    text:
      - Đêm ấy trở trời, bạn trằn trọc mãi. Sáng ra bạn cho mời cụ trưởng họ và một người biết chữ đến, bảo các con ngồi đủ. Đã đến lúc nói rõ chuyện nhà cửa, ruộng vườn sau này.
    options:
      - id: huong_hoa
        text: "Theo lệ: để phần hương hỏa lớn cho {role.ca.call}, giữ việc thờ cúng"
        effects:
          - type: opinion
            role: ca
            value: 12
          - type: opinion
            role: ut
            value: -8
          - type: reputation
            value: 3
          - type: filial_piety
            value: 3
        result:
          - Người viết chữ chép từng dòng, cụ trưởng họ điểm chỉ làm chứng. {role.ca.call} cúi lạy nhận phần hương hỏa.
      - id: chia_deu
        text: Chia đều cho các con, không thiên vị ai
        trait_stress:
          tham_vong: 2
        effects:
          - type: opinion
            role: ca
            value: -4
          - type: opinion
            role: ut
            value: 8
          - type: stress
            value: -3
        result:
          - "Cụ trưởng họ chau mày, bảo không đúng lệ. Bạn đáp: con nào cũng là con. Rồi bạn thấy người nhẹ hẳn."
      - id: giao_sap
        text: Giao sạp hàng và sổ nợ cho đứa con giỏi buôn nhất
        condition:
          var: household.career
          op: ==
          value: thuong_nhan
        effects:
          - type: opinion
            role: ca
            value: 8
          - type: opinion
            role: ut
            value: -5
          - type: skill_xp
            who: ca
            skill: thuong_mai
            value: 20
        result:
          - Bạn trao cuốn sổ nợ đã sờn gáy, dặn từng mối hàng, từng người nợ. Bàn tính lạch cạch, con ghi chép không sót chữ nào.
      - id: tu_sach
        text: "Để lại tủ sách và lời dặn: con cháu giữ nếp đèn sách"
        condition:
          any:
            - var: player.origin
              op: ==
              value: quy_toc_nho
            - var: household.career
              op: ==
              value: si_tu
        effects:
          - type: scholarly_prestige
            value: 4
          - type: skill_xp
            who: ca
            skill: hoc_van
            value: 15
          - type: stress
            value: -2
        result:
          - "Bạn viết mấy dòng gia huấn, treo ở gian giữa. Chữ đã run, nhưng ý thì rõ: ruộng có thể mất, chữ thì không ai lấy được."
      - id: cung_lang
        text: Trích một phần cúng vào chùa và quỹ nghĩa thương của làng (4 quan)
        condition:
          var: household.money
          op: ">="
          value: 4
        trait_stress:
          tham_lam: 5
        effects:
          - type: money
            value: -4
            ledger: su_kien
          - type: reputation
            value: 10
          - type: opinion
            role: ca
            value: -6
          - type: stress
            value: -4
        result:
          - Tên bạn được ghi vào sổ hậu của chùa. Các con không nói, nhưng bữa cơm hôm ấy im hơn thường lệ.
  - id: ln_doi_cong_cay_ai
    title: Đổi công cày ải
    tags:
      - ruong_dong
      - lao_dong
      - lang_xa
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    months:
      - 11
      - 12
    condition:
      all:
        - var: household.self_farms
          op: ==
