          all:
            - any:
                - var: player.origin
                  op: ==
                  value: quy_toc_nho
                - var: household.career
                  op: ==
                  value: si_tu
            - var: household.money
              op: ">="
              value: 4
        effects:
          - type: money
            value: -4
            ledger: su_kien
          - type: skill_xp
            who: con
            skill: hoc_van
            value: 30
          - type: scholarly_prestige
            value: 2
          - type: stress
            value: 2
        result:
          - Bạn gói cho con mấy bộ áo, một bao gạo và chiếc nghiên cũ của nhà. Con đi rồi, gian học vắng hẳn tiếng đọc bài.
      - id: theo_thuyen_hang
        text: Cho con theo thuyền hàng xuôi một chuyến, học nghề buôn
        condition:
