      - condition:
          var: household.net_worth
          op: ">="
          value: 800
        factor: 1.67
    cooldown_years: 8
    tension: 7
    importance: 8
    icon: ruong
    text:
      - "Trưởng chi thứ hai trong họ gửi đơn lên huyện: hai sào ruộng tốt nhất nhà bạn vốn là ruộng hương hỏa của cả họ, ông nội bạn chỉ được giao giữ, nay nhà bạn giàu rồi thì phải trả về cho họ. Kèm theo là một tờ văn tự cũ, giấy vàng ố, nét chữ không ai đọc rõ."
      - "Trát huyện về: hai bên ra công đường đối chất. Mấy ông chú trong họ thì ngả về phía ai có lợi."
    options:
      - id: theo_kien
        text: Thuê thầy cò viết đơn, theo kiện đến cùng (15 quan)
        hint: Thắng thì giữ trọn ruộng; thua thì mất cả ruộng lẫn tiền
        condition:
          var: household.money
          op: ">="
          value: 15
        effects:
          - type: money
            value: -15
            ledger: su_kien
          - type: stress
            value: 12
        chance:
          base: 0.45
          skill: ngoai_giao
          per_level: 0.05
        success:
          - type: reputation
            group: dan_lang
            value: 6
          - type: dynasty_prestige
            value: -4
        failure:
          - type: property_remove
            property: ruong
            count: 2
          - type: dynasty_prestige
            value: -6
          - type: stress
            value: 15
        success_result:
          - Quan soi tờ văn tự dưới đèn, thấy mực mới hơn giấy. Đơn bị bác. Bạn giữ được ruộng, nhưng đám giỗ tổ năm ấy, chi thứ hai không ai đến.
        failure_result:
          - Mấy ông chú lần lượt đứng ra làm chứng cho chi bên kia. Quan phán ruộng về họ. Hai sào ruộng mạ đang xanh, bạn phải đứng nhìn người khác ra cấy.
      - id: lot_quan
        text: Ngầm biếu quan huyện 35 quan cho chắc
        hint: Gần như chắc thắng, nhưng mất một khoản lớn và họ hàng sẽ đoán ra
        condition:
          var: household.money
          op: ">="
          value: 35
        trait_stress:
          nhan_tu: 4
        effects:
          - type: money
            value: -35
            ledger: su_kien
        chance:
          base: 0.8
        success:
          - type: dynasty_prestige
            value: -8
          - type: reputation
            group: dan_lang
            value: -6
        failure:
          - type: property_remove
            property: ruong
            count: 2
          - type: stress
            value: 20
        success_result:
          - Phiên xử chỉ kéo dài một tuần hương. Quan phán ruộng thuộc nhà bạn, chi thứ hai bị phạt tội kiện bừa. Cả họ thì thầm rằng tiền nhà ấy nói to hơn lý.
        failure_result:
          - Bên kia cũng lót, lại lót nhiều hơn. Quan nhận cả hai, xử cho bên đưa sau. Ra khỏi công đường, bạn đứng tựa gốc đa, thấy đất dưới chân như sụt xuống.
      - id: nhuong_mot_sao
        text: Đem một sào ra làm ruộng hương hỏa chung, giữ hòa khí trong họ
        hint: Giữ được lòng họ, mất một sào ruộng tốt
        effects:
          - type: property_remove
            property: ruong
            count: 1
          - type: dynasty_prestige
            value: 12
          - type: reputation
            group: dan_lang
            value: 10
          - type: stress
            value: 6
        result:
          - Ngày làm lễ, sào ruộng được cắm bia đá "Hương hỏa họ". Trưởng chi thứ hai rót rượu mời bạn trước bàn thờ tổ. Cái chén ấy uống vào hơi đắng.
      - id: nhan_lo_gio
        text: "Hòa giải: nhận lo trọn giỗ tổ cả họ hằng năm thay cho trả ruộng"
        hint: Giữ ruộng, nhưng gánh một khoản chi đều đặn nhiều năm
        effects:
          - type: money
            value: -10
            ledger: su_kien
          - type: modifier
            target: living.cost
            value: 1.15
            op: mul
            months: 60
            label: Gánh giỗ tổ cả họ
          - type: dynasty_prestige
            value: 6
          - type: set_flag
            flag: grh_lo_gio_ho
            years: 5
            label: Gánh giỗ tổ cả họ thay ruộng hương hỏa
        result:
          - Hai bên điểm chỉ vào tờ hòa giải. Từ năm ấy, cứ đến giỗ tổ là sân nhà bạn bày ba mươi mâm. Ruộng vẫn là ruộng nhà, nhưng mỗi năm mất đứt một vụ hoa lợi.
  - id: grh_quan_doi_quyen_luong
    title: Quan huyện về quyên lương thảo
    tags:
      - lang_xa
      - quan_su
      - kinh_te
    life_stages:
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    condition:
      all:
        - var: player.is_head
          op: ==
          value: true
        - any:
            - var: household.net_worth
              op: ">="
              value: 120
            - var: household.money
              op: ">="
              value: 60
    roles:
      - id: ly
        from: village
        village_role: ly_truong
    weight: 4
    weight_modifiers:
      - condition:
          var: household.net_worth
          op: ">="
          value: 300
        factor: 1.8
      - condition:
          var: household.net_worth
          op: ">="
          value: 800
        factor: 1.67
      - condition:
          var: world.military_alert
          op: ==
          value: chien_dich
        factor: 3
    cooldown_years: 6
    tension: 7
    importance: 8
    icon: thue
    text:
      - 'Biên giới có động. Quan huyện về đóng kiệu ở đình, cho gọi các nhà khá giả trong tổng đến "bàn việc nghĩa": mỗi nhà quyên lương thảo cho quân. Tên nhà bạn đứng hàng thứ ba trong tờ danh sách, bên cạnh ghi con số bốn mươi quan.'
      - '{role.ly.call} ghé tai: "Gọi là quyên, chứ nhà nào không quyên thì quan nhớ mặt. Năm sau đo ruộng, bắt phu, ông ấy nhớ cả."'
    options:
      - id: quyen_tien
        text: Quyên đủ 40 quan tiền mặt
        hint: Quan vui lòng, nhà hao hụt
        condition:
          var: household.money
          op: ">="
          value: 40
        effects:
          - type: money
            value: -40
            ledger: thue
          - type: reputation
            group: dan_lang
            value: 8
          - type: opinion
            role: ly
            value: 8
        result:
          - Quan huyện gật đầu, sai thư lại ghi tên. Chiều ấy kiệu quan lên đường, bụi bay mù cả lối. Bạn đứng nhìn theo, tự hỏi bốn mươi quan kia có bao nhiêu đồng đến được tay người lính.
      - id: quyen_thoc
        text: Quyên bằng 35 thúng thóc thay tiền
        hint: Giữ tiền mặt, nhưng kho vơi trước mùa giáp hạt
        condition:
          var: household.food
          op: ">="
          value: 35
        effects:
          - type: food
            value: -35
            ledger: thue
          - type: reputation
            group: dan_lang
            value: 6
          - type: opinion
            role: ly
            value: 5
        result:
          - Ba mươi lăm thúng thóc được đong lên xe bò. Người áp tải ghi sổ bằng đấu của quan, đấu to hơn đấu làng. Kho nhà vơi đi trông thấy.
      - id: quyen_gap_doi
        text: Quyên hẳn 80 quan, xin quan tâu lên ban hàm "nghĩa dân"
        hint: Có hàm có biển, làng nể; nhưng của đổ vào đấy là của đi luôn
        condition:
          var: household.money
          op: ">="
          value: 80
        trait_stress:
          tham_lam: 10
          an_phan: 4
        effects:
          - type: money
            value: -80
            ledger: thue
          - type: reputation
            group: dan_lang
            value: 30
          - type: dynasty_prestige
            value: 15
          - type: opinion
            role: ly
            value: 15
          - type: set_flag
            flag: grh_ham_nghia_dan
            years: 30
            label: Được ban hàm nghĩa dân vì quyên lương thảo
        result:
          - Nửa năm sau, chiếu ban hàm cửu phẩm về đến làng, kèm tấm biển sơn son "Nghĩa dân". Biển treo giữa nhà, ai qua cũng ngước nhìn. Nhưng mỗi lần thấy nó, bạn lại nhớ xâu tiền tám chục quan.
      - id: keu_ngheo
        text: Kêu nhà túng, chỉ quyên 10 quan lấy lệ
        hint: Giữ được tiền nếu quan tin; không thì quan nhớ mặt nhiều năm
        condition:
          var: household.money
          op: ">="
          value: 10
        effects:
          - type: money
            value: -10
            ledger: thue
        chance:
          base: 0.35
          skill: ngoai_giao
          per_level: 0.05
        success:
          - type: reputation
            group: dan_lang
            value: -4
        failure:
          - type: set_flag
            flag: grh_quan_nho_mat
            years: 6
            label: Quan huyện nhớ mặt nhà không chịu quyên
          - type: money
            value:
              var: household.money
              factor: -0.25
              max: 0
              min: -40
            ledger: thue
          - type: opinion
            role: ly
            value: -15
          - type: stress
            value: 15
        success_result:
          - Quan liếc nhìn bạn một cái rồi thôi. Năm ấy cả tổng nhiều nhà kêu túng thật, ông chẳng hỏi kỹ từng nhà.
        failure_result:
          - 'Quan cười nhạt: "Nhà ngói ba gian mà túng." Tháng sau lính huyện về đo lại ruộng, bắt nộp "tiền thiếu thuế năm cũ". Cái giá của mười quan lấy lệ hóa ra đắt gấp mấy lần.'
  - id: grh_le_khao_len_lao
    title: Lệ khao lên lão
    tags:
      - lang_xa
      - le_hoi
    life_stages:
      - trung_nien
      - tuoi_gia
    condition:
      all:
        - var: player.is_head
          op: ==
          value: true
        - var: player.age
          op: between
          value:
            - 50
            - 70
        - any:
            - var: household.net_worth
              op: ">="
              value: 120
            - var: household.money
              op: ">="
              value: 60
    roles:
      - id: ly
        from: village
        village_role: ly_truong
    weight: 5
    weight_modifiers:
      - condition:
          var: household.net_worth
          op: ">="
          value: 300
        factor: 1.8
      - condition:
          var: household.net_worth
          op: ">="
          value: 800
        factor: 1.67
    cooldown_years: 8
    tension: 4
    importance: 7
    icon: hoi
    text:
      - "Năm nay bạn đủ tuổi lên lão. Theo lệ làng, người lên lão phải khao: làm cỗ mời các cụ trong giáp, góp lễ vào đình, từ đó mới được ngồi chiếu lão. Nhà nghèo thì xôi gà một mâm cũng xong. Nhà khá như nhà bạn, cả làng đã đợi xem cỗ to cỡ nào."
      - '{role.ly.call} đến nhắc khéo: "Năm ngoái ông bá hộ khao những ba con lợn. Nhà mình mà kém thì làng cười."'
    options:
      - id: khao_to
        text: "Khao to: mổ trâu, ba ngày cỗ, góp lễ vào đình (45 quan)"
        hint: Rạng mặt cả nhà, ngồi chiếu trên; nhưng của đổ vào một bữa
        condition:
          var: household.money
          op: ">="
          value: 45
        effects:
          - type: money
            value: -45
            ledger: su_kien
          - type: reputation
            group: dan_lang
            value: 22
          - type: dynasty_prestige
            value: 8
          - type: opinion
            role: ly
            value: 12
          - type: health
            value: -4
        result:
          - Ba ngày cỗ, khói bếp bay kín trời. Các cụ ngồi đỏ mặt, gõ đũa bình phẩm từng món. Ngày thứ tư bạn được rước ra đình, ngồi chiếu lão hàng đầu. Đêm ấy bạn mệt lả, nhưng ngủ mỉm cười.
      - id: khao_vua
        text: "Khao vừa phải: hai con lợn, một ngày cỗ (18 quan)"
        hint: Đúng lệ, nhưng làng sẽ so với nhà bá hộ
        condition:
          var: household.money
          op: ">="
          value: 18
        effects:
          - type: money
            value: -18
            ledger: su_kien
          - type: reputation
            group: dan_lang
            value: 4
        result:
          - Cỗ đủ mâm, rượu đủ chén. Có cụ khen nhà biết tiết kiệm, có cụ bĩu môi bảo "giàu mà hà tiện". Bạn được ngồi chiếu lão, ở hàng giữa.
      - id: khao_thoc
        text: "Khao bằng thóc: đổ 30 thúng thóc vào kho làng thay cỗ"
        hint: Thiết thực, nhưng các cụ thích ăn hơn thích thóc
        condition:
          var: household.food
          op: ">="
          value: 30
        effects:
          - type: food
            value: -30
            ledger: su_kien
          - type: reputation
            group: dan_lang
            value: 8
          - type: opinion
            role: ly
            value: -8
        result:
          - 'Ba mươi thúng thóc vào kho nghĩa thương, mùa đói năm sau cứu được mấy nhà. Nhưng hôm ấy, các cụ ngồi đình nhìn nhau: "Lên lão mà không có miếng thịt."'
      - id: khong_khao
        text: "Không khao: tuổi già là của trời cho, không phải mua bằng cỗ"
        hint: Giữ được của, nhưng không được ngồi chiếu lão, mất mặt cả nhà
        trait_stress:
          tham_vong: 6
        effects:
          - type: reputation
            group: dan_lang
            value: -22
          - type: opinion
            role: ly
            value: -20
          - type: dynasty_prestige
            value: -6
          - type: set_flag
            flag: grh_khong_khao_lao
            years: 10
            label: Không khao lên lão, chưa được ngồi chiếu lão
        result:
          - Đến kỳ tế xuân, các cụ lên chiếu lão, chỗ của bạn bỏ trống. Bạn đứng dưới hiên đình cùng đám trai đinh. Con cháu đi ngoài đường cũng bị bạn bè trêu.
  - id: grh_chieu_bac_bip
    title: Bọn bịp từ phủ về mở chiếu lớn
    tags:
      - lang_xa
      - kinh_te
      - nguy_hiem
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    condition:
      all:
        - var: player.is_head
          op: ==
          value: true
        - var: household.money
          op: ">="
          value: 40
        - any:
            - var: household.net_worth
              op: ">="
              value: 120
            - var: household.money
              op: ">="
              value: 60
    roles:
      - id: ly
        from: village
        village_role: ly_truong
    weight: 4
    weight_modifiers:
      - condition:
          var: household.net_worth
          op: ">="
          value: 300
        factor: 1.8
      - condition:
          var: household.net_worth
          op: ">="
          value: 800
        factor: 1.67
      - condition:
          has_trait: hao_phong
        factor: 2
    cooldown_years: 6
    tension: 7
    importance: 7
    icon: tien
    text:
      - Một gã ăn mặc như con nhà quan, tự xưng là chủ hiệu vải trên phủ, thuê gian nhà đầu chợ mở chiếu xóc đĩa. Gã chỉ mời nhà khá giả, rượu ngon, đèn sáng, có cả cô đào hát. Đêm qua lão hàng xóm thắng hai chục quan, sáng nay khoe khắp làng.
      - 'Gã sai người mang thiếp mời đến tận nhà bạn: "Kính mời quan viên ghé chơi cho vui." Thiếp viết chữ son.'
    options:
      - id: choi_lon
        text: Đi, mang 40 quan theo, chơi một đêm cho biết
        hint: Có khi vớ bẫm; chiếu của bọn bịp thì nhà cái ít khi thua
        trait_stress:
          than_trong: 6
        effects:
          - type: money
            value: -40
            ledger: su_kien
        chance:
          base: 0.2
          skill: muu_luoc
          per_level: 0.04
        success:
          - type: money
            value: 95
            ledger: thu_khac
          - type: stress
            value: -6
          - type: set_flag
            flag: grh_me_co_bac
            years: 4
            label: Mê chiếu bạc sau một đêm thắng lớn
        failure:
          - type: debt
            value: 20
            ledger: vay
          - type: stress
            value: 20
          - type: reputation
            group: dan_lang
            value: -8
        success_result:
          - 'Đêm ấy bạn thắng như có thần giúp, ôm về gần trăm quan. Đến sáng gã chủ chiếu tiễn ra tận cổng, cười rất tươi: "Hôm nào quan viên lại ghé." Bàn tay bạn ngứa ran cả tuần.'
        failure_result:
          - Mấy ván đầu bạn thắng, rồi thua liền tù tì. Hết tiền, gã cho vay thêm hai chục quan "chỗ quen biết". Gà gáy, bạn bước ra, túi rỗng, tay cầm tờ giấy nợ. Mấy hôm sau cả bọn biến mất.
      - id: choi_tham_do
        text: Đi xem, chỉ đặt vài quan thăm dò
        hint: Mất ít, nhưng đã ngồi vào chiếu thì dễ ngồi lâu
        chance:
          base: 0.45
          skill: muu_luoc
          per_level: 0.05
        success:
          - type: skill_xp
            skill: muu_luoc
            value: 30
          - type: money
            value: 5
            ledger: thu_khac
        failure:
          - type: money
            value: -25
            ledger: su_kien
          - type: stress
            value: 12
          - type: set_flag
            flag: grh_me_co_bac
            years: 3
            label: Dây vào chiếu bạc của bọn bịp phủ
        success_result:
          - Ngồi một lúc, bạn để ý cái bát úp đĩa có đáy dày bất thường. Bạn đứng dậy về, không nói một lời. Sáng hôm sau, kể với ai cũng không ai tin.
        failure_result:
          - Định đặt hai quan, rồi gỡ, rồi gỡ nữa. Đến lúc tỉnh ra thì đã ném vào chiếu hai mươi lăm quan. Đi về qua cầu, bạn đứng nhìn xuống nước một lúc lâu.
      - id: bao_ly_bat
        text: Báo {role.ly.call} cho tuần đinh vây bắt chiếu bạc
        hint: Làng nể; nhưng bọn bịp có đàn em, chúng sẽ trả thù
        chance:
          base: 0.5
          skill: ngoai_giao
          per_level: 0.04
        success:
          - type: reputation
            group: dan_lang
            value: 15
          - type: opinion
            role: ly
            value: 12
        failure:
          - type: food
            value:
              var: household.food
              factor: -0.3
          - type: property_remove
            property: trau
            count: 1
          - type: stress
            value: 15
          - type: opinion
            role: ly
            value: -5
        success_result:
          - Tuần đinh vây gian nhà lúc nửa đêm, bắt được cả bát đĩa hai đáy. Gã chủ chiếu bị giải lên huyện. Mấy nhà mất tiền kéo đến cảm ơn bạn.
        failure_result:
          - Tin lọt ra trước. Tuần đinh đến thì gian nhà đã trống. Ba hôm sau, đống rơm nhà bạn bốc cháy lúc nửa đêm, con trâu trong chuồng bị chém đứt gân chân.
      - id: tu_choi
        text: Gửi trả thiếp, đóng cổng, dặn cả nhà không ai được bén mảng
        hint: Giữ của, nhưng bọn chúng sẽ dụ người trong nhà
        chance:
          base: 0.6
        success:
          - type: stress
            value: -2
        failure:
          - type: money
            value:
              var: household.money
              factor: -0.25
              max: 0
              min: -35
            ledger: su_kien
          - type: stress
            value: 12
        success_result:
          - Mấy tối liền, tiếng xóc đĩa vọng từ đầu chợ. Bạn ngồi hút thuốc lào ở hiên, nghe mà không đi. Nửa tháng sau, bọn chúng cuốn chiếu đi, để lại mấy nhà khóc ròng.
        failure_result:
          - Bạn không đi, nhưng người trong nhà thì lén đi. Tiền trong rương vơi dần, ai cũng nói dối là đi mua giống. Khi biết thì đã mất một khoản không nhỏ.
  - id: grh_ba_ho_ghen_ghet
