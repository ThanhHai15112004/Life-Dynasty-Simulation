            target: harvest.yield
            value: 0.95
            op: mul
            months: 4
            label: Lúa khát nước
          - type: stress
            value: -3
        failure:
          - type: modifier
            target: harvest.yield
            value: 0.82
            op: mul
            months: 4
            label: Ruộng chết khát
          - type: stress
            value: 3
        success_result:
          - Hai hôm sau trời đổ mưa rào. Các cụ bảo thành hoàng linh ứng, ai nấy thắp hương tạ ơn.
        failure_result:
