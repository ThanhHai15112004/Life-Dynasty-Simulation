        failure_result:
          - Mấy ông đồ trong làng viết đơn, hai chục người điểm chỉ, gửi thẳng lên huyện. Bạn phải lên công đường giải trình ba lần. Tiền gỡ được chẳng bù nổi tiền lót tay.
      - id: tu_choi
