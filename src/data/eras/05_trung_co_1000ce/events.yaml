          var: household.debt
          op: ">="
          value: 60
        factor: 1.5
    once_per_life: true
    tension: 10
    importance: 10
    icon: no
    text:
      - '{role.chu_no.call} đến ngồi giữa nhà, tay lần tràng hạt. "Món nợ {household.debt} quan, nhà này trả đến đời cháu cũng chưa xong. Tôi tính thế này: cho {role.con.call} sang hầu hạ bên nhà tôi, nợ xóa sạch, lại có chỗ ăn mặc."'
      - 'Ai cũng biết "hầu hạ" ở nhà {role.chu_no.call} nghĩa là gì: lão đã có ba bà vợ. {role.con.call} đứng sau tấm phên, nghe hết.'
    options:
      - id: gan_con
        text: Cúi đầu, để {role.con.call} sang nhà {role.chu_no.call}
        hint: Sạch nợ, nhưng bán con là vết nhơ không gì rửa nổi
        trait_stress:
          trong_gia_dinh: 15
          nhan_tu: 10
        effects:
          - type: debt
            value:
              var: household.debt
              factor: -1
            ledger: tra_no
          - type: opinion
            role: con
            value: -45
          - type: opinion
            role: chu_no
            value: 15
          - type: leave_household
            who: con
          - type: stress
            value: 30
          - type: reputation
            group: dan_lang
            value: -15
          - type: set_flag
            flag: bn_gan_con
            years: 30
            label: Gán {role.con.call} cho {role.chu_no.call} trừ nợ
        result:
          - Chiếc kiệu nhỏ đến lúc chạng vạng, không kèn không trống. {role.con.call} không khóc, chỉ lạy bàn thờ ba lạy rồi bước lên. Đêm ấy bạn ngồi ở hiên đến sáng. Sổ nợ nhà bá hộ gạch một nét đỏ.
      - id: ban_ruong_tra
        text: Bán một sào ruộng trả bớt nợ, nhất quyết giữ con
        hint: Giữ được con, nhưng ruộng đi là cái ăn đi theo
        condition:
          var: household.farmland
          op: ">="
          value: 1
        effects:
          - type: property_remove
            property: ruong
            count: 1
          - type: debt
            value: -32
            ledger: tra_no
          - type: opinion
            role: con
            value: 25
          - type: opinion
            role: chu_no
            value: -15
          - type: stress
            value: 12
        result:
          - Văn tự bán ruộng điểm chỉ xong, bạn đặt xâu tiền lên án thư trước mặt {role.chu_no.call}. Lão cười nhạt, đếm đi đếm lại. Tối ấy {role.con.call} bưng cơm lên cho bạn, hai tay run run.
      - id: ga_voi
        text: Gả vội {role.con.call} cho nhà khác, lấy sính lễ trả bớt nợ
        hint: Con khỏi vào cửa bá hộ, nhưng cũng chẳng được chọn chồng
        trait_stress:
          trong_gia_dinh: 5
        effects:
          - type: arrange_child_marriage
            sex: f
          - type: debt
            value: -14
            ledger: tra_no
          - type: opinion
            role: con
            value: -12
          - type: opinion
            role: chu_no
            value: -25
          - type: stress
            value: 12
        result:
          - Trong vòng một tháng, bà mối dạm, ăn hỏi, rước dâu dồn làm một. Nhà trai ở làng bên, nghèo nhưng hiền. {role.con.call} cúi đầu đi theo, không nhìn lại. {role.chu_no.call} nghe tin, đập vỡ chén trà.
      - id: cau_ly_truong
        text: Mang lễ lên nhà {role.ly.call}, xin làng đứng ra phân xử
        hint: Lý trưởng chịu nói thì bá hộ phải lùi; không thì thêm thù
        effects:
          - type: money
            value: -4
            ledger: su_kien
        chance:
          base: 0.3
          skill: ngoai_giao
          per_level: 0.05
          modifiers:
            - condition:
                var: role.ly.opinion
                op: ">="
                value: 20
              add: 0.2
        success:
          - type: set_flag
            flag: duoc_khat_no
            years: 2
            label: Làng đứng ra cho khất nợ {role.chu_no.call}
          - type: opinion
            role: chu_no
            value: -20
          - type: opinion
            role: con
            value: 20
          - type: opinion
            role: ly
            value: 5
        failure:
          - type: debt
            value: 12
          - type: opinion
            role: chu_no
            value: -35
          - type: stress
            value: 18
          - type: set_flag
            flag: bn_ba_ho_thu_han
            years: 8
            label: "{role.chu_no.call} để bụng thù nhà mình"
        success_result:
          - "{role.ly.call} họp các cụ ở đình, tuyên rằng lệ làng không cho lấy người gán nợ. {role.chu_no.call} cứng họng, đành cho khất. Lão nhìn bạn như nhìn con chuột lọt khỏi bẫy."
        failure_result:
          - '{role.ly.call} nhận lễ rồi lại bảo "việc nợ nần là việc riêng". Hôm sau {role.chu_no.call} cho người đến tính thêm tiền phạt "làm mất mặt". Món nợ dày lên, mối thù cũng thế.'
  - id: bn_thay_do_tien_cu_con
