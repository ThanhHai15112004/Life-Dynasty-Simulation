        condition:
          var: household.money
          op: ">="
          value: 2
        effects:
          - type: money
            value: -2
            ledger: su_kien
          - type: modifier
            target: harvest.yield
            value: 1.05
            op: mul
            months: 6
            label: Ruộng cày ải kỹ
        result:
          - Tiền trao, trâu cày. Không nợ ai ân tình, nhưng túi nhẹ hẳn đi trước mùa Tết.
      - id: cuoc_tay
        text: Cả nhà vác cuốc ra cuốc tay
        hint: Không tốn tiền, không nợ ai, chỉ tốn sức
        effects:
          - type: health
            value: -6
          - type: stress
            value: 4
          - type: skill_xp
            skill: sinh_ton
            value: 15
          - type: modifier
            target: harvest.yield
            value: 0.98
            op: mul
            months: 6
            label: Đất cuốc tay chưa ải
        result:
          - Nửa tháng trời, tay bạn phồng rộp rồi chai cứng. Ruộng cũng xong, dù đất lật chưa sâu bằng trâu cày.
