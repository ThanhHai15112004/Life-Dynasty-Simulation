            value: -8
          - type: relocate_settlement
            settlement: thi_tran_ben_song
            free: true
          - type: set_flag
            flag: o_nha_thue
            years: 5
            label: Đang ở thuê nơi phố thị
          - type: skill_xp
            skill: hoc_van
            value: 30
        result:
          - Cả nhà thu xếp đồ đạc chuyển ra {world.town_name}, mở ra chân trời học hành rộng lớn hơn.
      - id: dung_viec_hoc_o_que
        text: Chấp nhận dừng việc học ở đây, đem chút chữ nghĩa giúp việc sổ sách trong làng
        effects:
          - type: skill_xp
            skill: quan_tri
            value: 25
          - type: reputation
            group: dan_lang
            value: 5
        result:
          - Dù không đi học xa được, vốn chữ nghĩa sẵn có cũng đủ để bạn trở thành người biết tính toán sổ sách trong vùng.
  - id: tro_hoc_noi_thi_tran
    title: Đêm đèn sách nơi quán trọ
    text:
      - Căn gác trọ nơi phố thị chật hẹp nhưng lúc nào cũng rộn tiếng đọc bài của học trò tứ xứ. Chi phí ăn ở đắt đỏ khiến túi tiền vơi đi nhanh chóng, đổi lại bạn được tiếp xúc với nhiều sách vở quý hiếm.
    tags:
      - hoc_hanh
      - van_minh
    scheduled_only: true
    weight: 10
    importance: 6
    icon: sach
    options:
      - id: vua_hoc_vua_chep_thue
        text: Ban ngày nghe giảng, ban đêm nhận chép sách thuê kiếm tiền trọ
        effects:
          - type: own_money
            value: 2
          - type: skill_xp
            skill: hoc_van
            value: 32
          - type: stress
            value: 5
        result:
          - Đôi mắt cay xè dưới ngọn đèn dầu, nhưng bạn vừa tự trang trải được tiền trọ vừa thuộc làu nhiều kinh sử.
      - id: tap_trung_hoc_nhanh
        text: Dốc toàn bộ tiền tiết kiệm mua sách học thật nhanh rồi về
        condition:
          var: household.money
          op: ">="
          value: 3
        effects:
          - type: money
            value: -3
          - type: skill_xp
            skill: hoc_van
            value: 50
          - type: scholarly_prestige
            value: 6
        result:
          - Có đủ sách vở, học lực của bạn tiến bộ vượt bậc khiến thầy giáo và bạn đồng môn đều nể phục.
      - id: het_tien_quay_ve
        text: Chi phí đắt đỏ quá sức, đành thu xếp quay về quê sớm
        effects:
          - type: clear_flag
            flag: tro_hoc_xa_nha
          - type: skill_xp
            skill: hoc_van
            value: 15
          - type: stress
            value: -3
        result:
          - Bạn gói ghém sách vở trở về quê sau những tháng ngày mở mang tầm mắt nơi phố thị.
  - id: dem_mua_con_om_xa_thay
    title: Đêm khuya người ốm nơi hẻo lánh
    text:
      - Giữa đêm mưa gió, trong nhà có người lên cơn sốt cao co giật. Ở nơi thôn xóm xa xôi này không có y quán hay thầy thuốc giỏi, muốn tìm thầy lang lớn phải vượt đường đêm ra tận thị trấn.
    tags:
      - benh_tat
      - gia_dinh
    condition:
      all:
        - var: world.medical_tier
          op: <=
          value: 1
        - var: household.members
          op: ">="
          value: 2
    weight: 8
    cooldown_years: 4
    importance: 7
    icon: om
    options:
      - id: doi_mua_di_moi_thay_xa
        text: Đốt đuốc đội mưa chạy bộ ra thị trấn rước thầy thuốc giỏi
        hint: Tốn 3 quan tiền thuốc và tiền đò đêm
        condition:
          var: household.money
          op: ">="
          value: 3
        effects:
          - type: money
            value: -3
            ledger: thuoc_men
          - type: health
            value: 6
            who: household
          - type: stress
            value: 4
        result:
          - Gần sáng bạn mới cõng được thầy thuốc về tới nhà, kịp thời cắt cơn sốt nguy kịch.
      - id: hai_la_thuoc_quanh_nha
        text: Dùng kinh nghiệm dân gian hái lá thuốc quanh vườn sắc uống cầm cự
        chance:
          base: 0.55
          skill: sinh_ton
          per_level: 0.06
        success:
          - type: health
            value: 4
            who: household
          - type: skill_xp
            skill: sinh_ton
            value: 15
        failure:
          - type: health
            value: -8
            who: household
          - type: stress
            value: 8
        success_result:
          - May mắn thay bát nước lá rừng ấm nóng làm cơn sốt dịu dần khi trời vừa hửng sáng.
        failure_result:
          - Thuốc lá chỉ cầm chừng được phần ngọn, trận ốm kéo dài làm cả nhà kiệt quệ vì ở quá xa thầy thuốc.
  - id: gui_con_ra_pho_hoc
    title: Tương lai con trẻ nơi vùng xa
    text:
      - Nhìn con cái lớn lên giữa chốn thôn quê thiếu trường thiếu lớp, bạn trăn trở không biết nên giữ con ở lại nối nghiệp cày cấy hay bấm bụng gửi con ra phố học chữ.
    tags:
      - gia_dinh
      - hoc_hanh
    life_stages:
      - lap_nghiep
      - trung_nien
    condition:
      all:
        - var: world.school_tier
          op: <=
          value: 1
        - var: player.children_count
          op: ">="
          value: 1
    weight: 8
    cooldown_years: 5
    importance: 6
    icon: gia_dinh
    options:
      - id: chat_chiu_gui_con_di_hoc
        text: Thắt lưng buộc bụng gửi con lên thị trấn ăn học
        condition:
          var: household.money
          op: ">="
          value: 4
        effects:
          - type: money
            value: -4
          - type: reputation
            group: dan_lang
            value: 6
          - type: dynasty_prestige
            value: 4
        result:
          - Dù bữa cơm trong nhà đạm bạc hơn, nhìn con được cắp sách đến trường lớn khiến lòng bạn tràn đầy hy vọng.
      - id: day_con_nghe_que
        text: Ở xa trường quá, giữ con ở nhà truyền dạy nghề làm ăn của gia đình
        effects:
          - type: food
            value: 10
          - type: skill_xp
            skill: sinh_ton
            value: 18
        result:
          - Con cái sớm quen việc đồng áng và phụ giúp gia đình vững vàng qua từng mùa vụ.
  - id: lenh_giai_ngu_tro_ve
    title: Ngày giải ngũ rời doanh trại
    text:
      - Chiến dịch biên thùy khép lại, trống thu quân đã điểm. Sau những năm tháng cầm giáo gác đêm nơi gió cát, bạn nhận tờ giấy giải ngũ cùng mấy đồng tiền thưởng ít ỏi để trở về quê nhà.
      - Đợt cắt giảm binh lính sau mùa chinh chiến khiến đội ngũ của bạn được cho giải ngũ. Khoác chiếc tay nải bạc màu lên vai, trước mắt bạn là con đường về quê sau bao năm xa cách.
    tags:
      - quan_ngu
      - buoc_ngoat
    life_stages:
      - thanh_nien
      - lap_nghiep
      - trung_nien
    condition:
