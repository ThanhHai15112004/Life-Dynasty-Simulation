    tags:
      - lang_xa
      - quan_he
      - ruong_dong
    life_stages:
      - lap_nghiep
      - trung_nien
      - tuoi_gia
    condition:
      all:
        - var: player.is_head
          op: ==
          value: true
        - any:
            - var: household.net_worth
              op: ">="
              value: 120
            - var: household.money
              op: ">="
              value: 60
    roles:
      - id: ba_ho
        from: village
        village_role: ba_ho
    weight: 5
    weight_modifiers:
      - condition:
          var: household.net_worth
          op: ">="
          value: 300
        factor: 1.8
      - condition:
          var: household.net_worth
          op: ">="
          value: 800
        factor: 1.67
