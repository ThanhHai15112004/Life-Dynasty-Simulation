          - 'Cờ tiên phong cắm trên lũy giặc! Tiếng reo hò vang dậy, tên bạn được tâu lên trấn phủ.'
          - 'Bạn là người đầu tiên trèo qua hàng rào chông, phá cổng trại giặc cho quân sau tràn vào.'
          - 'Trận ấy bắt sống được tên đầu mục, quan võ trên trấn gọi tên bạn ra trước hàng quân mà khen.'
          - 'Giữa khói lửa, bạn cõng được người đồng ngũ bị thương về hậu doanh, cả đội nhớ ơn.'
          - 'Lũy giặc vỡ lúc trời vừa rạng, bạn đứng trên mô đất nhìn cờ phe mình bay mà nghẹn họng.'
        failure_log:
          - 'Trận đánh ác liệt hơn dự tính, bạn mang thương tích mở đường máu rút về.'
          - 'Mũi tên găm vào vai lúc vừa lên tới chân lũy, bạn bị kéo lùi về giữa tiếng trống thu quân.'
          - 'Quân tiên phong rơi vào bẫy hầm chông, mấy người đi cạnh bạn không còn trở về.'
          - 'Trận đánh không thành, bạn lết về trại với cái chân sưng tấy, đêm nằm nghe tiếng người rên.'
          - 'Giặc có phục binh hai bên sườn, cả mũi phải tan ra chạy, bạn mất cả khiên lẫn đao.'

  - id: thao_khau
