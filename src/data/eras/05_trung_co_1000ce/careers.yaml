          - 'Đứa học trò nghèo nhất lớp đọc thuộc làu Tam tự kinh, mẹ nó gánh sang biếu thầy một rổ trứng.'
          - 'Nhà bá hộ cũng gửi con sang học, lễ thầy đầu năm là cả xâu tiền với cặp gà trống thiến.'
          - 'Tiếng bọn trẻ đọc "Nhân chi sơ" vọng ra tận ngõ, người qua đường dừng lại nghe mà mỉm cười.'
          - 'Cuối mùa học, cả lớp viết được tên cha mẹ mình, phụ huynh rủ nhau mang gạo đến tạ thầy.'
        failure_log:
          - 'Mùa này nhà nào cũng túng, chỉ lèo tèo vài đứa trẻ theo học.'
          - 'Vào mùa gặt, cha mẹ gọi hết con về ra đồng, lớp học vắng tanh chỉ còn tiếng ve.'
          - 'Thằng bé nghịch nhất lớp làm đổ nghiên mực lên sách thầy, cha nó không đền lại còn bênh con.'
          - 'Nhà nào cũng hứa lễ thầy sau mùa, đến lúc ấy lại khất, bạn ngại chẳng dám đòi.'
          - 'Có người đồn thầy dạy chữ không chuẩn, mấy nhà rút con sang học ông đồ làng bên.'
      - id: binh_van_hoi_tho
        name: Dự hội bình văn của sĩ phu
        description: Mang văn bài đến hội tao đàn trên huyện, kết giao với các bậc khoa bảng.
        hint: 'Tốn 1 quan trà rượu; tăng Danh vọng sĩ phu và công trạng'
        cooldown_months: 8
        cost_money: 1
        chance:
          base: 0.5
          skill: ngoai_giao
          per_level: 0.06
        success:
          - { type: scholarly_prestige, value: 6 }
          - { type: career_merit, value: 12 }
          - { type: skill_xp, skill: ngoai_giao, value: 15 }
        failure:
          - { type: scholarly_prestige, value: 1 }
          - { type: stress, value: 3 }
        success_log:
          - 'Bài phú của bạn được cả hội chuyền tay ngâm nga, một vị Tiến sĩ hồi hưu mời bạn ghé nhà đàm đạo.'
          - 'Các bậc tiền bối gật gù khen văn khí sáng sủa.'
          - 'Một vị Hương cống xin chép bài văn của bạn mang về cho con cháu đọc, mặt bạn nóng bừng.'
          - 'Tan hội, mấy văn hữu trẻ rủ bạn uống rượu bên hồ, kết thành bạn đồng môn từ đấy.'
        failure_log:
          - 'Văn chương còn non, bạn chỉ ngồi nghe các bậc tiền bối bình phẩm.'
          - 'Bạn đọc đến câu thứ ba thì có người cắt ngang bắt lỗi điển cố, cả hội cười ồ.'
          - 'Văn hữu nhà giàu mang rượu quý đến, được chú ý hơn cả bài văn của bạn, ngồi mà chạnh lòng.'
          - 'Bài văn bị chê là sáo, nhắc lại ý người xưa mà không có ý mình, bạn về thức trắng đêm sửa.'
      - id: viet_van_khe
        name: Viết văn khế, đơn từ thuê
        description: Viết hộ dân làng văn tự mua bán ruộng đất, đơn kiện, câu đối Tết.
        hint: 'Kiếm tiền nhanh, sai sót thì mất tiếng'
        cooldown_months: 4
        chance:
          base: 0.7
          skill: hoc_van
          per_level: 0.03
