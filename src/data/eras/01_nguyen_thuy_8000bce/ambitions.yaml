      - id: diem_cu_tru_vung_vang
        name: Hình thành khu cư trú mới được nhiều người biết đến
        condition:
          all:
            - { var: household.net_worth, op: '>=', value: 50 }
            - { var: player.reputation, op: '>=', value: 14 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 14. Người sống qua tuổi già
  - id: nt_amb_song_qua_tuoi_gia
    name: Người sống qua tuổi già
    description: Sống đủ lâu để chứng kiến nhiều thế hệ trưởng thành và trở thành người lưu giữ ký ức của nhóm.
    icon: suc_khoe
