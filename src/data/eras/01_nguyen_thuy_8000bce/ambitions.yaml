        satisfaction_bonus: 8
      - id: day_con_ky_nang
        name: Nuôi dạy nhiều con cái và giữ gia đình đủ ăn
        condition:
          all:
            - { var: player.children_count, op: '>=', value: 2 }
            - { var: household.food_months, op: '>=', value: 3 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: the_he_tu_lap
        name: Chứng kiến các con khôn lớn và tiếp nối gia đình
        condition:
          all:
            - { var: player.children_count, op: '>=', value: 3 }
            - { var: player.age, op: '>=', value: 42 }
        stress_relief: 10
        satisfaction_bonus: 16

