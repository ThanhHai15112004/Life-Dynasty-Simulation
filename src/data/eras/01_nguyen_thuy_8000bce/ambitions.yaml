# ══════════════════════════════════════════════════════════════════════════════
# MỐC 01: BÌNH MINH NHÂN LOẠI (8000 TCN — nguyen_thuy_8000bce)
# Tham vọng cả đời (Ambitions) — 16 ước mơ sinh tồn, gia đình, tay nghề, uy tín và di sản.
# ══════════════════════════════════════════════════════════════════════════════
ambitions:
  # 01. Người săn thú lão luyện
  - id: nt_amb_san_thu_lao_luyen
    name: Người săn thú lão luyện
    description: Trở thành người có khả năng theo dấu và săn bắt những loài thú khó tiếp cận, được lớp trẻ tìm đến học hỏi.
    icon: quan_su
    traits: [can_dam, kien_nhan, tham_vong]
    milestones:
      - id: hoc_theo_dau
        name: Thành thạo kỹ năng sinh tồn và chiến đấu săn bắt
        condition:
          all:
            - { var: player.skill.sinh_ton, op: '>=', value: 2 }
            - { var: player.skill.quan_su, op: '>=', value: 2 }
        stress_relief: 6
        satisfaction_bonus: 8
      - id: tho_san_thanh_thao
        name: Đạt kỹ năng săn bắt bậc cao và giữ sức khỏe bền bỉ
        condition:
          all:
            - { var: player.skill.quan_su, op: '>=', value: 4 }
            - { var: player.health, op: '>=', value: 55 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: dan_doan_san_lon
        name: Trở thành người săn thú lão luyện được cộng đồng nể trọng
        condition:
          all:
            - { var: player.skill.quan_su, op: '>=', value: 6 }
            - { var: player.reputation, op: '>=', value: 15 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 02. Người dẫn đường qua vùng đất lạ
  - id: nt_amb_dan_duong_vung_la
    name: Người dẫn đường qua vùng đất lạ
    description: Khám phá con đường an toàn đến những nguồn tài nguyên chưa được nhóm mình biết tới.
    icon: focus
    traits: [tu_do, can_dam, than_trong]
    milestones:
      - id: nho_duong_quen
        name: Nắm vững kỹ năng định hướng và quan sát thiên nhiên
        condition:
          all:
            - { var: player.skill.sinh_ton, op: '>=', value: 2 }
            - { var: player.skill.muu_luoc, op: '>=', value: 2 }
        stress_relief: 6
        satisfaction_bonus: 8
      - id: mo_loi_di_xa
        name: Thông thuộc địa hình và gắn kết với các nhóm láng giềng
        condition:
          all:
            - { var: player.skill.sinh_ton, op: '>=', value: 4 }
            - { var: player.skill.ngoai_giao, op: '>=', value: 2 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: tuyen_duong_sinh_ton
        name: Mở ra tuyến đường giúp cộng đồng tồn tại lâu dài
        condition:
          all:
            - { var: player.skill.sinh_ton, op: '>=', value: 6 }
            - { var: player.reputation, op: '>=', value: 15 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 03. Người giữ lửa cho nhiều thế hệ
  - id: nt_amb_giu_lua_nhieu_the_he
    name: Người giữ lửa cho nhiều thế hệ
    description: Duy trì sự an toàn và ổn định của nơi cư trú, truyền kinh nghiệm sử dụng và bảo quản lửa qua nhiều mùa.
    icon: nha
    traits: [trong_gia_dinh, than_trong, trung_thanh]
    milestones:
      - id: giu_bep_am
        name: Có vật liệu giữ lửa và nơi trú ổn định
        condition:
          all:
            - { var: household.food_months, op: '>=', value: 2 }
            - { var: player.skill.sinh_ton, op: '>=', value: 2 }
        stress_relief: 6
        satisfaction_bonus: 8
      - id: mai_am_qua_mua
        name: Lập gia đình và giữ bếp lửa ấm qua nhiều mùa
        condition:
          all:
            - { var: player.married, op: '==', value: true }
            - { var: household.food_months, op: '>=', value: 4 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: truyen_lua_con_chau
        name: Có con cháu tiếp nối bên bếp lửa an toàn
        condition:
          all:
            - { var: player.children_count, op: '>=', value: 2 }
            - { var: player.age, op: '>=', value: 40 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 04. Gia đình vượt qua nhiều mùa đói
  - id: nt_amb_vuot_nhieu_mua_doi
    name: Gia đình vượt qua nhiều mùa đói
    description: Nuôi dưỡng con cháu qua những thời kỳ thức ăn khan hiếm nhờ biết dự trữ, kiếm ăn đa dạng và tương trợ.
    icon: thoc
    traits: [trong_gia_dinh, kien_nhan, than_trong]
    milestones:
      - id: du_an_qua_mua
        name: Dự trữ đủ lương thực cho ít nhất 4 tháng
        condition: { var: household.food_months, op: '>=', value: 4 }
        stress_relief: 6
        satisfaction_bonus: 8
      - id: kho_du_tru_day
        name: Dự trữ lương thực dồi dào và không mắc nợ
        condition:
          all:
            - { var: household.food_months, op: '>=', value: 8 }
            - { var: household.debt, op: '==', value: 0 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: gia_dinh_no_am
        name: Nuôi dạy con cái khỏe mạnh với nguồn dự trữ vững vàng
        condition:
          all:
            - { var: player.children_count, op: '>=', value: 2 }
            - { var: household.food_months, op: '>=', value: 10 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 05. Người chế tác công cụ xuất sắc
  - id: nt_amb_che_tac_xuat_sac
    name: Người chế tác công cụ xuất sắc
    description: Làm ra những công cụ đá, xương, gỗ hoặc đồ đựng bền chắc được nhiều người tin dùng và học theo.
    icon: focus
    traits: [kien_nhan, tham_vong, than_trong]
    milestones:
      - id: quen_tay_ghe_da
        name: Rèn luyện tay nghề chế tác và quản lý nguyên liệu
        condition: { var: player.skill.quan_tri, op: '>=', value: 2 }
        stress_relief: 6
        satisfaction_bonus: 8
      - id: cong_cu_ben_chac
        name: Tạo được công cụ sắc bền được láng giềng tìm đổi
        condition:
          all:
            - { var: player.skill.quan_tri, op: '>=', value: 4 }
            - { var: player.reputation, op: '>=', value: 8 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: bậc_thay_che_tac
        name: Kỹ thuật chế tác lan truyền khắp cộng đồng
        condition:
          all:
            - { var: player.skill.quan_tri, op: '>=', value: 6 }
            - { var: player.reputation, op: '>=', value: 18 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 06. Người tìm ra nguồn nước
  - id: nt_amb_tim_nguon_nuoc
    name: Người tìm ra nguồn nước
    description: Phát hiện hoặc duy trì một nguồn nước quan trọng giúp nơi cư trú tiếp tục tồn tại qua những mùa khô hạn.
    icon: thoc
    traits: [kien_nhan, nhan_tu, than_trong]
    milestones:
      - id: doc_dau_mach_nuoc
        name: Hiểu địa hình, mùa mưa và dấu vết mạch nước
        condition: { var: player.skill.sinh_ton, op: '>=', value: 3 }
        stress_relief: 6
        satisfaction_bonus: 8
      - id: giu_nguon_nuoc_sach
        name: Kết hợp quan sát tự nhiên và tri thức tích lũy
        condition:
          all:
            - { var: player.skill.sinh_ton, op: '>=', value: 5 }
            - { var: player.skill.hoc_van, op: '>=', value: 2 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: cuu_nhom_khoi_han
        name: Được cộng đồng kính trọng nhờ bảo đảm nguồn nước
        condition:
          all:
            - { var: player.skill.sinh_ton, op: '>=', value: 6 }
            - { var: player.reputation, op: '>=', value: 15 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 07. Người gắn kết những gia đình bất hòa
  - id: nt_amb_gan_ket_bat_hoa
    name: Người gắn kết những gia đình bất hòa
    description: Chấm dứt những mối bất đồng kéo dài về thức ăn, nơi ở và khôi phục sự hợp tác trong cộng đồng.
    icon: ngoai_giao
    traits: [nhan_tu, hao_phong, trung_thanh]
    milestones:
      - id: lang_nghe_hai_ben
        name: Biết lắng nghe và thương lượng khi có tranh cãi
        condition: { var: player.skill.ngoai_giao, op: '>=', value: 2 }
        stress_relief: 6
        satisfaction_bonus: 8
      - id: tieng_noi_cong_bang
        name: Xây dựng uy tín và tiếng nói công tâm trong nhóm
        condition:
          all:
            - { var: player.skill.ngoai_giao, op: '>=', value: 4 }
            - { var: player.reputation, op: '>=', value: 12 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: hoa_giai_cong_dong
        name: Gắn kết các gia đình cùng chung sống hòa thuận
        condition:
          all:
            - { var: player.skill.ngoai_giao, op: '>=', value: 6 }
            - { var: player.reputation, op: '>=', value: 22 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 08. Người xây dựng nơi trú bền vững
  - id: nt_amb_xay_noi_tru_ben_vung
    name: Người xây dựng nơi trú bền vững
    description: Tạo dựng nơi ở an toàn, che chắn gió mưa cho gia đình và những thế hệ tiếp theo.
    icon: nha
    traits: [kien_nhan, trong_gia_dinh, than_trong]
    milestones:
      - id: dung_mai_che_vung
        name: Thu gom vật liệu và nắm vững kỹ năng dựng nơi trú
        condition:
          all:
            - { var: player.skill.quan_tri, op: '>=', value: 2 }
            - { var: player.skill.sinh_ton, op: '>=', value: 2 }
        stress_relief: 6
        satisfaction_bonus: 8
      - id: gia_co_vach_mai
        name: Tích lũy nguồn lực để mở rộng và gia cố chỗ ở
        condition: { var: household.net_worth, op: '>=', value: 25 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: khu_tru_nhieu_doi
        name: Hoàn thiện khu cư trú bền vững cho cả gia đình
        condition:
          all:
            - { var: household.net_worth, op: '>=', value: 45 }
            - { var: player.children_count, op: '>=', value: 1 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 09. Người truyền lại tri thức
  - id: nt_amb_truyen_lai_tri_thuc
    name: Người truyền lại tri thức
    description: Đảm bảo những hiểu biết về cây cối, mùa vụ, công cụ và chuyện kể không biến mất khi mình qua đời.
    icon: hoc_van
    traits: [kien_nhan, nhan_tu, mo_dao]
    milestones:
      - id: ghi_nho_chuyen_ke
        name: Ghi nhớ chuyện kể và kinh nghiệm của người đi trước
        condition: { var: player.skill.hoc_van, op: '>=', value: 2 }
        stress_relief: 6
        satisfaction_bonus: 8
      - id: chi_day_lop_tre
        name: Hướng dẫn người trẻ nhận biết thiên nhiên và chế tác
        condition:
          all:
            - { var: player.skill.hoc_van, op: '>=', value: 4 }
            - { var: player.age, op: '>=', value: 30 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: di_san_truyen_mieng
        name: Trở thành người gìn giữ tri thức được cả nhóm tín nhiệm
        condition:
          all:
            - { var: player.skill.hoc_van, op: '>=', value: 6 }
            - { var: player.reputation, op: '>=', value: 16 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 10. Người tạo dựng quan hệ giữa các cộng đồng
  - id: nt_amb_quan_he_cong_dong
    name: Người tạo dựng quan hệ giữa các cộng đồng
    description: Có những người quen biết và sẵn lòng hợp tác, trao đổi nguyên liệu ở nhiều vùng khác nhau.
    icon: tien
    traits: [nhan_tu, hao_phong, tu_do]
    milestones:
      - id: quen_nhom_lang_gieng
        name: Tiếp xúc và trao đổi sản vật với nhóm láng giềng
