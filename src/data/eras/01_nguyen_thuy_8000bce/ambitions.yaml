        condition: { var: player.age, op: '>=', value: 70 }
        stress_relief: 12
        satisfaction_bonus: 20

  # 15. Người đứng sau một công trình chung
  - id: nt_amb_dung_sau_cong_trinh_chung
    name: Người đứng sau một công trình chung
    description: Góp phần tổ chức lao động và nguyên liệu để tạo dựng công trình được nhiều người sử dụng hoặc coi trọng.
