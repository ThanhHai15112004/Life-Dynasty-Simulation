        satisfaction_bonus: 8
      - id: giu_chu_tin_trao_doi
        name: Xây dựng lòng tin qua những chuyến đi xa
        condition:
          all:
            - { var: player.skill.thuong_mai, op: '>=', value: 4 }
            - { var: player.skill.ngoai_giao, op: '>=', value: 3 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: mang_luoi_lien_vung
        name: Thiết lập mạng lưới hợp tác lâu dài giữa các cộng đồng
        condition:
          all:
            - { var: player.skill.thuong_mai, op: '>=', value: 6 }
            - { var: player.reputation, op: '>=', value: 18 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 11. Người làm chủ một nguồn thức ăn ổn định
  - id: nt_amb_nguon_thuc_an_on_dinh
    name: Người làm chủ một nguồn thức ăn ổn định
    description: Duy trì khả năng kiếm ăn, chăm sóc cây lương thực hoặc dự trữ hiệu quả để giảm thiểu những năm thiếu đói.
    icon: thoc
    traits: [kien_nhan, than_trong, tham_vong]
    milestones:
      - id: nam_vung_mua_vu
        name: Hiểu rõ chu kỳ mùa và nguồn thức ăn quanh vùng
        condition: { var: player.skill.sinh_ton, op: '>=', value: 3 }
        stress_relief: 6
        satisfaction_bonus: 8
      - id: tich_tru_on_dinh
        name: Duy trì lượng thức ăn dự trữ đủ cho 6 tháng
        condition: { var: household.food_months, op: '>=', value: 6 }
        stress_relief: 8
        satisfaction_bonus: 12
      - id: chu_dong_nguon_luong
        name: Làm chủ nguồn thức ăn vững chắc cho cả gia đình
        condition:
          all:
            - { var: household.food_months, op: '>=', value: 10 }
            - { var: household.net_worth, op: '>=', value: 35 }
        stress_relief: 10
        satisfaction_bonus: 16

  # 12. Người có hậu duệ tiếp nối
  - id: nt_amb_hau_due_tiep_noi
    name: Người có hậu duệ tiếp nối
    description: Nuôi dưỡng những người con hoặc người trẻ được mình chăm sóc, để họ đủ kỹ năng sống độc lập.
    icon: nha
    traits: [trong_gia_dinh, nhan_tu, kien_nhan]
