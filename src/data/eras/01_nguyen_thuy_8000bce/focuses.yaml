  - id: nt_fc_di_xa_trao_doi
    name: Đi xa tìm đá và thăm nhóm khác
    description: Thực hiện những chuyến đi dài ngày qua nhiều vùng địa hình để tiếp cận mỏ đá quý hiếm và duy trì mạng lưới trao đổi.
    icon: tien
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
