  # ── Trọng tâm đặc thù (15–20) ──
  - id: nt_fc_canh_tac_so_khai
    name: Canh tác sơ khai
    description: Thử nghiệm chọn hạt giống không rụng, chuẩn bị vạt đất ẩm, chăm sóc và dự trữ hạt tại vùng thích hợp.
    icon: cay_lua
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition:
      any:
        - { var: world.polity_id, op: '==', value: luoi_liem_mau_mo_8000bce }
        - { has_property: nt_khu_cay_luong_thuc }
        - { var: player.career, op: '==', value: nt_nguoi_khai_thac_ngu_coc }
    skill_xp: { sinh_ton: 5, quan_tri: 2 }
    modifiers:
      - { target: harvest.yield, value: 1.12, op: mul }
    event_weights: { canh_tac: 2.5, du_tru: 1.6 }

  - id: nt_fc_cham_giu_dong_vat
    name: Chăm giữ động vật sơ khai
    description: Quan sát tập tính, hạn chế đàn thú bỏ chạy và bảo vệ nhóm động vật đang dần được con người quản lý ở Tây Á.
    icon: trau
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition:
      any:
        - { var: world.polity_id, op: '==', value: luoi_liem_mau_mo_8000bce }
        - { has_property: nt_nhom_dong_vat_quan_ly }
        - { var: player.career, op: '==', value: nt_nguoi_cham_giu_dong_vat }
    skill_xp: { sinh_ton: 5, quan_tri: 2 }
    modifiers:
      - { target: harvest.yield, value: 1.08, op: mul }
    event_weights: { chan_giu: 2.4 }

  - id: nt_fc_che_tac_chuyen_sau
    name: Chế tác chuyên sâu
    description: Dành trọn tâm sức cải tiến lưỡi đá, mũi xương hoặc đồ gốm để tạo ra những công cụ bền sắc được cả vùng tín nhiệm.
    icon: focus
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
