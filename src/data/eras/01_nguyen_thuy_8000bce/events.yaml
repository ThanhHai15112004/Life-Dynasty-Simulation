      - id: dung_ve_phia_mot_nguoi
        text: Lên tiếng bênh vực người mà bạn thấy có lý hơn
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
          - { type: stress, value: 3 }
        result:
          - Người được bạn ủng hộ rất hài lòng nhưng phía còn lại tỏ ra giận dỗi suốt nhiều ngày.
      - id: de_nghi_cung_phan_chia_lai
