    tags: [gia_dinh, di_cu, tuoi_gia]
    life_stages: [trung_nien, tuoi_gia]
    condition: { var: player.age, op: '>=', value: 51 }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: gia_dinh
    options:
      - id: ung_ho
        text: Vỗ vai khích lệ và chúc đứa cháu lên đường bình an để mở mang tầm mắt
        effects:
          - { type: stress, value: 2 }
          - { type: reputation, value: 4 }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
        result:
          - Đứa cháu rạng rỡ lên đường với niềm tin được tiếp thêm từ lời chúc của bạn.
      - id: khuyen_o_lai
