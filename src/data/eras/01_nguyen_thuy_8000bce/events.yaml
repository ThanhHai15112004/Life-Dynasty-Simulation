          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: skill_xp, skill: hoc_van, value: 8 }
        result:
          - Bạn học được bí quyết chọn cành gỗ dẻo và miết nhựa cây giúp mối buộc bền chắc hơn.

