        result:
          - Tình làng nghĩa xóm lúc tối lửa tắt đèn giúp gia đình bạn vượt qua giai đoạn ngặt nghèo nhất.
      - id: phan_cong_nhung_nguoi_con_khoe_tiep_tuc_kiem_an
        text: Sắp xếp một người ở nhà trông bệnh, còn mình cùng người khỏe cố đi kiếm thức ăn tươi
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: health, value: -3 }
          - { type: skill_xp, skill: quan_tri, value: 12 }
        result:
          - Gia đình duy trì được nguồn súp nóng bồi dưỡng cho người ốm dù bạn phải làm việc hết sức vất vả.
      - id: moi_nguoi_am_hieu_thao_duoc_trong_nhom_den_kham
