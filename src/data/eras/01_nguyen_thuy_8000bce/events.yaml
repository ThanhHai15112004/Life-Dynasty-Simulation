          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: reputation, value: 3 }
        result:
          - Người trẻ phát huy rất tốt năng khiếu ở công việc mới và mang về nguồn sản vật bổ trợ cho gia đình.
      - id: de_nghi_hoc_nhieu_viec
        text: Cho con thử sức qua nhiều công việc khác nhau để tìm ra hướng phù hợp nhất
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: skill_xp, skill: hoc_van, value: 8 }
        result:
          - Dù mất thêm thời gian trải nghiệm, người trẻ trở nên tháo vát và hiểu biết nhiều mặt của đời sống.
      - id: ket_hop_the_manh_cua_con_vao_cong_viec_chung
        text: Giữ phần việc kỹ thuật khó cho mình và giao cho con phần giao tiếp, trao đổi sản phẩm
        effects:
          - { type: money, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: thuong_mai, value: 12 }
          - { type: skill_xp, skill: muu_luoc, value: 10 }
        result:
          - Sự phối hợp khéo léo giữa hai thế hệ giúp công việc của gia đình phát đạt hơn cả trước kia.

  # 20. Bệnh tật trong gia đình
  - id: nt_m14_trn_20_benh_tat_trong_gia_dinh
    title: Nhiều người thân cùng ngã bệnh
    text:
      - Nhiều thành viên trong gia đình bị ốm gần cùng một thời điểm, khiến mọi công việc kiếm ăn hằng ngày bị đình trệ.
    tags: [benh_tat, gia_dinh, cham_soc]
