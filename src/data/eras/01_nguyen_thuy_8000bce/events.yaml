        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, value: 4 }
          - { type: stress, value: -3 }
        result:
          - Tình bạn xưa được nối lại bền chặt và người bạn nhanh chóng đóng góp sức lực cho cộng đồng.
      - id: de_nghi_ho_chung_minh_kha_nang_dong_gop
        text: Đề nghị họ cùng tham gia vài chuyến kiếm ăn trước để chứng minh thiện chí với cả nhóm
