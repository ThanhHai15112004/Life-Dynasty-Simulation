        result:
          - Nhờ sự chăm sóc tận tình và bếp lửa luôn ấm áp, cả mẹ và bé đều vượt qua những ngày yếu ớt nhất.
      - id: tang_cuong_kiem_thuc_an
        text: Nỗ lực đi săn và thu hái gấp đôi để mang về thức ăn giàu dinh dưỡng nhất
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: food, value: 4, ledger: su_kien }
