  # 11. Kho thức ăn bị hỏng [Tây Á]
  - id: nt_m14_trn_11_kho_thuc_an_bi_hong
    title: Hố dự trữ hạt bị ẩm mốc
    text:
      - Một phần lương thực dự trữ chung của nhiều gia đình trong khu cư trú bị ngấm nước mưa và chuột bọ phá hoại, không còn dùng được.
    tags: [kinh_te, canh_tac, tay_a, cong_dong]
    life_stages: [lap_nghiep, trung_nien]
    condition:
      all:
        - { var: player.age, op: 'between', value: [31, 50] }
        - any:
            - { var: world.polity_id, op: '==', value: luoi_liem_mau_mo_8000bce }
            - { var: player.origin, op: in, value: [nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_giu_kho] }
            - { var: player.career, op: in, value: [nt_nguoi_bao_quan_thuc_an, nt_nguoi_khai_thac_ngu_coc, nt_nguoi_dung_noi_tru] }
