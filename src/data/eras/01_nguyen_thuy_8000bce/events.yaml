          - { type: skill_xp, skill: quan_tri, value: 8 }
          - { type: stress, value: -2 }
        result:
          - Bạn dễ dàng tạo ra sản phẩm dùng được ngay dù chưa chinh phục được kỹ thuật khó.
      - id: tai_che_manh_gay_thanh_mui_nhon_nho
        text: Mài lại hai nửa bị gãy thành mũi đục và dao cắt nhỏ để không lãng phí công sức
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Sự linh hoạt giúp bạn biến một sản phẩm hỏng thành hai dụng cụ nhỏ hữu ích cho gia đình.

  # 14. Hạt giống để dành [Tây Á]
