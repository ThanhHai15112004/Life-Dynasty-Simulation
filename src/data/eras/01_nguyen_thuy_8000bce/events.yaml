      - id: giam_bot_viec_xa_giu_suc
        text: Tạm gác các chuyến đi xa, chỉ thu hái quanh nơi trú để giữ sức lâu dài
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: health, value: 3 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
        result:
          - Bạn học cách điều chỉnh nhịp độ lao động để không gục ngã khi cả gia đình đang trông cậy vào mình.

  # Chăm sóc 07: Một người có nhiều kinh nghiệm qua đời, khiến nhóm mất kiến thức quan trọng
  - id: nt_ev_cs_07_nguoi_kinh_nghiem_qua_doi
    title: Khoảng trống tri thức sau một đám tang
    text:
      - Một người lớn tuổi nắm giữ nhiều kinh nghiệm về nguồn nước mùa khô và cách xử lý thực vật độc vừa qua đời.
      - Cả nhóm nhận ra nhiều hiểu biết chưa kịp truyền lại đầy đủ cho thế hệ sau.
    tags: [truyen_thong, lang_xa]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_to_chuc_nghi_thuc, nt_nguoi_tim_nguon_nuoc, nt_nguoi_dieu_hoa] }
        factor: 1.4
    cooldown_years: 7
    importance: 6
    icon: tang
    options:
      - id: cung_moi_nguoi_khao_lai_tri_nho
        text: Tập hợp những người từng đi cùng người quá cố để kể lại và ghép nối các kinh nghiệm còn nhớ
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: reputation, value: 4 }
        result:
          - Qua nhiều đêm kể lại bên bếp lửa, phần lớn tri thức về đường nước và cây rừng đã được giữ lại cho lớp trẻ.
      - id: di_kiem_chung_lai_cac_diem_danh_dau
        text: Trực tiếp dẫn một nhóm nhỏ đi kiểm tra lại các vách đá và khe nước người ấy từng nhắc tới
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: skill_xp, skill: muu_luoc, value: 8 }
        result:
          - Bạn tìm thấy những hòn đá đánh dấu đường mòn của người quá cố và truyền lại cho những người đi đường kế tiếp.


