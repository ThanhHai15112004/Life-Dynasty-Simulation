          - { type: skill_xp, skill: muu_luoc, value: 8 }
          - { type: food, value: 4, ledger: su_kien }
        result:
          - Chuyến di cư vất vả đưa bạn tới vùng suối mới nhiều cá và củ rừng hơn nơi cũ.
      - id: o_lai_bam_tru
        text: Ở lại bám trụ, đào sâu hố trữ và mở rộng tầm tìm kiếm quanh lán cũ
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: money, value: 3, ledger: su_kien }
        result:
          - Nhờ ít người cạnh tranh hơn, những gia đình ở lại vẫn đủ thức ăn vượt qua mùa khô.
      - id: thuyet_phuc_do_duong_truoc
        text: Đứng ra thuyết phục các gia đình cử đội dò đường trước khi quyết định
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Lời đề nghị thận trọng của bạn giúp cộng đồng tránh được cảnh chia lìa vội vã.

  # 18. Trách nhiệm đầu tiên
  - id: nt_ev_18_trach_nhiem_dau_tien
    title: Trách nhiệm đầu tiên
    text:
      - Người thợ già vốn phụ trách công việc chính trong nhóm bất ngờ đổ bệnh nặng không thể tiếp tục.
      - Giữa lúc mùa vụ và chuyến săn đang gấp rút, mọi ánh mắt đều hướng về bạn đề nghị gánh vác vị trí ấy dù bạn chưa từng làm một mình.
    tags: [nghe, lang_xa]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_khai_thac_ngu_coc, nt_nguoi_cham_giu_dong_vat, nt_nguoi_che_tac_da, nt_nguoi_che_tac_xuong_go, nt_nguoi_dan_soi, nt_nguoi_lam_gom] }
        factor: 1.5
