  # 17. Lựa chọn ở lại hay đi xa
  - id: nt_ev_17_o_lai_hay_di_xa
    title: Lựa chọn ở lại hay đi xa
    text:
      - Sau hai mùa nguồn thức ăn quanh khu trú suy giảm rõ rệt, một số gia đình quyết định thu gom hành trang rời đi tìm thung lũng mới.
      - Những người khác muốn bám trụ thêm một mùa mưa nữa bên những hố trữ và bãi hái quen thuộc.
    tags: [kinh_te, lang_xa, di_cu]
    life_stages: [thanh_nien, lap_nghiep]
