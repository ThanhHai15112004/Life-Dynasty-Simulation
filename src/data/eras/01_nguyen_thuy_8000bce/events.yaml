          - { type: skill_xp, skill: thuong_mai, value: 12 }
        result:
          - Sự điềm đạm và từng trải của họ giúp các cuộc trao đổi vật phẩm luôn đạt kết quả tốt đẹp.

  # Chăm sóc 05: Một đứa trẻ qua khỏi bệnh nặng nhưng cần thời gian dài để hồi phục
  - id: nt_ev_cs_05_dua_tre_hoi_phuc_sau_benh
    title: Hơi ấm trở lại sau cơn sốt dài
    text:
      - Một đứa trẻ trong nhà vừa vượt qua trận sốt và tiêu chảy nguy kịch, nhưng cơ thể vẫn rất gầy yếu.
      - Những tuần tiếp theo sẽ quyết định đứa trẻ có phục hồi được sức vóc hay không.
    tags: [benh_tat, gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_cham_soc, nt_nguoi_thu_hai, nt_nguoi_danh_ca] }
        factor: 1.4
    cooldown_years: 6
    importance: 5
    icon: tre_em
    options:
      - id: danh_thuc_an_mem_va_nuoc_sach
        text: Dành riêng phần thức ăn dễ tiêu, củ nấu kỹ và nước suối trong cho đứa trẻ
        effects:
          - { type: food, value: -3, ledger: su_kien }
          - { type: stress, value: -5 }
          - { type: skill_xp, skill: hoc_van, value: 8 }
        result:
          - Đứa trẻ dần hồng hào trở lại và bắt đầu chạy nhảy quanh bếp lửa khi mùa nắng tới.
      - id: nho_nguoi_co_kinh_nghiem_theo_doi
        text: Nhờ người giàu kinh nghiệm chăm sóc trong nhóm thường xuyên ghé thăm và tìm lá thảo mộc
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        result:
          - Sự tận tình của cả nhóm giúp đứa trẻ vượt qua giai đoạn suy yếu sau bệnh.
      - id: bat_ca_nho_va_ham_xuong_lay_nuoc_ngot
        text: Chịu khó ra suối bắt cá tươi và ninh kỹ xương thú bằng đá nóng lấy nước ngọt bồi bổ
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: health, value: 4, who: household }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
        result:
          - Nước hầm ấm nóng giàu dưỡng chất giúp đứa trẻ nhanh chóng lại sức hơn hẳn.
      - id: cho_tre_suoi_nang_som_va_tap_di_lai_nhe_nhang
        text: Bế trẻ ra sưởi nắng ấm buổi sớm và kiên nhẫn tập cho trẻ vận động từng bước ngắn
        effects:
          - { type: stress, value: -4 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
        result:
          - Ánh nắng ấm áp và sự khích lệ của bạn giúp đôi chân đứa trẻ cứng cáp trở lại từng ngày.

  # Chăm sóc 06: Người chăm sóc bị kiệt sức vì phải làm việc thay cho nhiều thành viên khác
  - id: nt_ev_cs_06_nguoi_cham_soc_kiet_suc
    title: Gánh nặng của người giữ bếp lửa
    text:
      - Vì phải vừa chăm người ốm vừa gánh phần việc kiếm ăn thay cho nhiều thành viên trong nhà, sức lực của bạn gần như cạn kiệt.
      - Một buổi sáng thức dậy, đầu óc bạn quay cuồng và chân tay rã rời.
    tags: [benh_tat, lao_dong, gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_cham_soc, nt_nguoi_khai_thac_ngu_coc, nt_nguoi_cham_giu_dong_vat, nt_nguoi_dung_noi_tru] }
        factor: 1.4
    cooldown_years: 6
    importance: 5
    icon: suc_khoe
    options:
      - id: mo_loi_xin_nhom_san_se_viec
        text: Thẳng thắn nhờ các gia đình thân thuộc trong nhóm đỡ đần việc lấy củi và nước ít ngày
        effects:
          - { type: health, value: 4 }
          - { type: stress, value: -6 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
        result:
          - Những người hàng xóm lặng lẽ mang củi và nước tới trước cửa lán, giúp bạn có thời gian nghỉ ngơi hồi sức.
      - id: giam_bot_viec_xa_giu_suc
        text: Tạm gác các chuyến đi xa, chỉ thu hái quanh nơi trú để giữ sức lâu dài
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: health, value: 3 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
        result:
          - Bạn học cách điều chỉnh nhịp độ lao động để không gục ngã khi cả gia đình đang trông cậy vào mình.
      - id: day_tre_nho_trong_nha_phu_viec_vua_suc
        text: Hướng dẫn những đứa trẻ trong nhà tự giữ lửa, múc nước gần và nhặt củi nhỏ
        effects:
          - { type: health, value: 2 }
          - { type: stress, value: -4 }
          - { type: skill_xp, skill: quan_tri, value: 12 }
        result:
          - Lũ trẻ hiểu chuyện và tự giác đỡ đần việc vặt, giúp đôi vai bạn nhẹ gánh đi rất nhiều.
      - id: dung_du_tru_va_uong_nuoc_la_hoi_suc
        text: Mở phần thức ăn khô dự trữ ra dùng và tự nấu nước lá rừng uống để lấy lại sức
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: health, value: 5 }
          - { type: skill_xp, skill: hoc_van, value: 8 }
        result:
          - Sau hai ngày ăn đủ và ngủ sâu, cơ thể bạn lấy lại được sinh lực để tiếp tục gánh vác gia đình.

  # Chăm sóc 07: Một người có nhiều kinh nghiệm qua đời, khiến nhóm mất kiến thức quan trọng
  - id: nt_ev_cs_07_nguoi_kinh_nghiem_qua_doi
    title: Khoảng trống tri thức sau một đám tang
    text:
      - Một người lớn tuổi nắm giữ nhiều kinh nghiệm về nguồn nước mùa khô và cách xử lý thực vật độc vừa qua đời.
      - Cả nhóm nhận ra nhiều hiểu biết chưa kịp truyền lại đầy đủ cho thế hệ sau.
    tags: [truyen_thong, lang_xa]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_to_chuc_nghi_thuc, nt_nguoi_tim_nguon_nuoc, nt_nguoi_dieu_hoa] }
        factor: 1.4
    cooldown_years: 7
    importance: 6
    icon: tang
    options:
      - id: cung_moi_nguoi_khao_lai_tri_nho
        text: Tập hợp những người từng đi cùng người quá cố để kể lại và ghép nối các kinh nghiệm còn nhớ
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: reputation, value: 4 }
        result:
          - Qua nhiều đêm kể lại bên bếp lửa, phần lớn tri thức về đường nước và cây rừng đã được giữ lại cho lớp trẻ.
      - id: di_kiem_chung_lai_cac_diem_danh_dau
        text: Trực tiếp dẫn một nhóm nhỏ đi kiểm tra lại các vách đá và khe nước người ấy từng nhắc tới
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: skill_xp, skill: muu_luoc, value: 8 }
        result:
          - Bạn tìm thấy những hòn đá đánh dấu đường mòn của người quá cố và truyền lại cho những người đi đường kế tiếp.
      - id: xem_xet_bo_dung_cu_va_tui_thao_moc_de_lai
        text: Kiểm tra kỹ các túi hạt, rễ cây khô và công cụ mà người quá cố để lại để suy ra cách làm
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Từ những mẫu rễ cây được buộc phân loại cẩn thận trong túi da, bạn khôi phục được công thức chế biến quan trọng.
      - id: hoi_tham_nguoi_gia_o_nhom_lang_gieng_than_thiet
        text: Tìm gặp một bậc cao niên ở nhóm láng giềng từng giao hảo với người quá cố để hỏi thêm
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
        result:
          - Người bạn già ở nhóm bên cạnh xúc động chỉ lại cho bạn những mạch nước mùa khô mà hai người từng cùng phát hiện.


  # ══════════════════ TUỔI TRƯỞNG THÀNH (16–39) — MỤC 11.B (17–28) ══════════════════
  # 17. Lựa chọn ở lại hay đi xa
  - id: nt_ev_17_o_lai_hay_di_xa
    title: Lựa chọn ở lại hay đi xa
    text:
      - Sau hai mùa nguồn thức ăn quanh khu trú suy giảm rõ rệt, một số gia đình quyết định thu gom hành trang rời đi tìm thung lũng mới.
      - Những người khác muốn bám trụ thêm một mùa mưa nữa bên những hố trữ và bãi hái quen thuộc.
    tags: [kinh_te, lang_xa, di_cu]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_trao_doi, nt_nguoi_tim_duong, nt_nguoi_san_thu, nt_nguoi_thu_hai, nt_nguoi_danh_ca, nt_nguoi_tim_nguon_nuoc] }
        factor: 1.5
    cooldown_years: 8
    importance: 6
    icon: duong
    options:
      - id: cung_nhom_di_xa
        text: Thu gom hành trang đi cùng nhóm mở đường tìm vùng đất mới
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: skill_xp, skill: muu_luoc, value: 8 }
          - { type: food, value: 4, ledger: su_kien }
        result:
          - Chuyến di cư vất vả đưa bạn tới vùng suối mới nhiều cá và củ rừng hơn nơi cũ.
      - id: o_lai_bam_tru
        text: Ở lại bám trụ, đào sâu hố trữ và mở rộng tầm tìm kiếm quanh lán cũ
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: money, value: 3, ledger: su_kien }
        result:
          - Nhờ ít người cạnh tranh hơn, những gia đình ở lại vẫn đủ thức ăn vượt qua mùa khô.
      - id: thuyet_phuc_do_duong_truoc
        text: Đứng ra thuyết phục các gia đình cử đội dò đường trước khi quyết định
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Lời đề nghị thận trọng của bạn giúp cộng đồng tránh được cảnh chia lìa vội vã.
      - id: lap_trai_phu_theo_mua_giua_hai_noi
        text: Đề nghị giữ trại gốc và chỉ cử thanh niên khỏe mạnh lập trại săn hái theo mùa ở vùng mới
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: muu_luoc, value: 12 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Mô hình hai điểm trú giúp người già, trẻ nhỏ không phải vất vả di chuyển mà vẫn có thêm nguồn thức ăn mới.

  # 18. Trách nhiệm đầu tiên
  - id: nt_ev_18_trach_nhiem_dau_tien
    title: Trách nhiệm đầu tiên
    text:
      - Người thợ già vốn phụ trách công việc chính trong nhóm bất ngờ đổ bệnh nặng không thể tiếp tục.
      - Giữa lúc mùa vụ và chuyến săn đang gấp rút, mọi ánh mắt đều hướng về bạn đề nghị gánh vác vị trí ấy dù bạn chưa từng làm một mình.
    tags: [nghe, lang_xa]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_khai_thac_ngu_coc, nt_nguoi_cham_giu_dong_vat, nt_nguoi_che_tac_da, nt_nguoi_che_tac_xuong_go, nt_nguoi_dan_soi, nt_nguoi_lam_gom] }
        factor: 1.5
    cooldown_years: 8
    importance: 6
    icon: nghe
    options:
      - id: nhan_trach_nhiem
        text: Đứng ra nhận lấy phần việc nặng nhọc và làm hết sức mình
        effects:
          - { type: skill_xp, skill: quan_tri, value: 16 }
          - { type: reputation, group: lang, value: 5 }
          - { type: health, value: -2 }
        result:
          - Dù đôi tay còn lóng ngóng những ngày đầu, bạn thức khuya dậy sớm hoàn thành trọn vẹn phần việc được giao.
      - id: vua_lam_vua_hoi_nguoi_gia
        text: Nhận việc nhưng mỗi tối đều tới bên bếp lửa hỏi ý kiến người già
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
          - { type: stress, value: -3 }
        result:
          - Sự khiêm tốn giúp bạn tránh được những sai lầm nghiêm trọng khi lần đầu tự tay điều phối công việc.
      - id: de_nghi_chia_nho_viec
        text: Đề nghị chia phần việc cho ba người trẻ cùng gánh vác
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Cách làm chung giúp cả nhóm trẻ cùng tiến bộ và gắn kết chặt chẽ hơn.
      - id: chuan_bi_ky_cong_cu_truoc_khi_bat_tay_lam
        text: Dành một ngày kiểm tra và mài sắc toàn bộ công cụ chung để bù lại sự thiếu kinh nghiệm
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 12 }
          - { type: food, value: 2, ledger: su_kien }
        result:
          - Nhờ dụng cụ tốt và sự chuẩn bị chu đáo, tiến độ công việc không hề bị chậm trễ.

  # 19. Một cuộc săn nguy hiểm (id giữ tương thích kiểm thử: san_ban_thu_lon_nguyen_thuy)
  - id: san_ban_thu_lon_nguyen_thuy
    title: Một cuộc săn nguy hiểm
    text:
      - Đoàn săn phát hiện dấu chân rướm máu của một con bò rừng khổng lồ gần hẻm đá.
      - Tiếp tục truy kích có thể mang lại lượng thịt và da lớn cho cả khu cư trú, nhưng con thú đang bị kích động dữ dội và rất dễ húc trọng thương người áp sát.
    tags: [nghe, thien_nhien, rui_ro]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    weight: 5
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_san_thu, nt_nguoi_dieu_hoa, nt_nguoi_tim_duong, nt_nguoi_dan_soi, nt_nguoi_che_tac_da, nt_nguoi_che_tac_xuong_go] }
        factor: 1.8
    cooldown_years: 6
    importance: 7
    icon: kiem
    options:
      - id: lao_len_phong_lao
        text: Dẫn đầu mũi giáp công, áp sát phóng lao vào sườn con thú lớn
        effects:
          - { type: skill_xp, skill: quan_su, value: 18 }
          - { type: food, value: 8, ledger: su_kien }
          - { type: money, value: 5, ledger: su_kien }
          - { type: reputation, group: lang, value: 6 }
          - { type: health, value: -4 }
        result:
          - Mũi lao đá cắm sâu vào mục tiêu giữa tiếng gầm vang vọng vách núi; cả đoàn reo hò khi con mồi đổ gục.
      - id: dung_bay_va_lua_ep_goc
        text: Dùng đuốc lửa và tiếng hú dồn con thú vào vách đá hẹp rồi mới tấn công
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 16 }
          - { type: skill_xp, skill: quan_su, value: 8 }
          - { type: food, value: 6, ledger: su_kien }
          - { type: reputation, group: lang, value: 4 }
        result:
          - Kế hoạch vây ép bằng khói lửa giúp đoàn săn hạ gục con thú lớn mà không ai bị húc trọng thương.
      - id: rut_lui_chon_con_moi_nho
        text: Khuyên đoàn săn rút lui, chuyển sang bẫy đàn hươu nhỏ an toàn hơn
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: food, value: 3, ledger: su_kien }
          - { type: health, value: 2 }
        result:
          - Lượng thịt mang về ít hơn mong đợi nhưng toàn bộ đội săn đều trở về nguyên vẹn bên bếp lửa.
      - id: bam_theo_vet_mau_cho_con_thu_kiet_suc
        text: Giữ khoảng cách an toàn bám theo vết máu cho đến khi con thú mất sức mới ra đòn kết liễu
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: skill_xp, skill: muu_luoc, value: 10 }
          - { type: food, value: 6, ledger: su_kien }
        result:
          - Sự kiên nhẫn của thợ săn lão luyện giúp đoàn thu được con mồi lớn mà không tốn giọt máu nào.

  # 20. Mùa thu hoạch thất bại
  - id: nt_ev_20_mua_thu_hoach_that_bai
    title: Mùa thu hoạch thất bại
    text:
      - Tại cộng đồng canh tác sơ khai, đợt gió khô nóng kéo dài khiến lượng hạt thu được thấp hơn mong đợi rất nhiều.
      - "Cả nhóm đứng trước lựa chọn: ăn vào phần hạt giống dự trữ, tỏa đi tìm thức ăn tự nhiên hay sang xin hỗ trợ từ nhóm khác."
    tags: [kinh_te, thien_nhien, nong_nghiep]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_khai_thac_ngu_coc, nt_nguoi_bao_quan_thuc_an, nt_nguoi_thu_hai, nt_nguoi_cham_giu_dong_vat, nt_nguoi_lam_gom, nt_nguoi_dung_noi_tru] }
        factor: 1.5
    cooldown_years: 7
    importance: 6
    icon: lua
    options:
      - id: to_chuc_hai_luom_bu_dap
        text: Tạm gác việc đồng bãi, dẫn mọi người vào rừng sâu đào củ và hái hạt dẻ bù vào
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: food, value: 4, ledger: su_kien }
        result:
          - Sự linh hoạt quay lại nguồn thức ăn hoang dã giúp gia đình bạn bù đắp phần hạt giống bị mất.
      - id: giu_chat_hat_giong_an_de_sen
        text: Kiên quyết giữ nguyên phần hạt giống cho năm sau, cả nhà thắt lưng buộc bụng
        effects:
          - { type: skill_xp, skill: quan_tri, value: 15 }
          - { type: health, value: -2 }
          - { type: money, value: 4, ledger: su_kien }
        result:
          - Nhờ giữ được hạt giống tốt trong chum đất, vụ gieo trồng mùa mưa năm sau phục hồi nhanh chóng.
      - id: nho_ho_tro_cong_dong_lan_can
        text: Mang công cụ đá và đồ đan sang đổi lương thực hoặc xin hỗ trợ từ nhóm lân cận
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 12 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
          - { type: food, value: 3, ledger: su_kien }
          - { type: money, value: -2, ledger: su_kien }
        result:
          - Bạn đổi những lưỡi rìu đá sắc bén lấy vài giỏ hạt khô từ cộng đồng ven suối.
      - id: dao_ranh_dan_nuoc_cuu_phan_cay_con_xanh
        text: Huy động người nhà đào rãnh dẫn nước từ khe suối về cứu những vạt cây lương thực muộn còn xanh
        effects:
          - { type: health, value: -3 }
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 12 }
        result:
          - Những vạt lúa mạch gần rãnh nước hồi sinh kịp thời, vớt vát được một phần sản lượng quý giá.

  # 21. Người lạ xin trú nhờ
  - id: nt_ev_21_nguoi_la_xin_tru_nho
    title: Người lạ xin trú nhờ
    text:
      - Chiều muộn, một người cùng gia đình nhỏ tả tơi từ vùng đồi phía tây tìm tới bìa trại xin được ở lại.
      - Cộng đồng phải cân nhắc kỹ giữa nguồn lương thực hạn hẹp, sự an toàn và khả năng đóng góp của người mới.
    tags: [lang_xa, ngoai_giao]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_dieu_hoa, nt_nguoi_to_chuc_nghi_thuc, nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_bao_quan_thuc_an, nt_nguoi_cham_soc] }
        factor: 1.5
    cooldown_years: 7
    importance: 5
    icon: nguoi
    options:
      - id: cho_o_lai_va_chia_viec
        text: Đón họ vào lán, chia sẻ thức ăn và phân công họ phụ giúp kiếm củi, đan lát
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, group: lang, value: 5 }
          - { type: food, value: -2, ledger: su_kien }
        result:
          - Gia đình người lạ cảm kích sự cưu mang và chỉ cho nhóm bạn cách bẫy chim nước rất hiệu quả.
      - id: cho_tru_tam_ngan_ngay
        text: Cho họ trú tạm dưới mái hiên vài ngày chờ tạnh mưa rồi chỉ đường đi tiếp
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
        result:
          - Khi trời hửng nắng, gia đình người lạ để lại một chuỗi vỏ sò thay lời cảm ơn trước khi lên đường.
      - id: canh_giac_tu_choi
        text: Cẩn trọng từ chối cho vào trại vì sợ thiếu lương thực và rủi ro xung đột
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
          - { type: stress, value: 2 }
        result:
          - Bạn đặt sự sinh tồn của người nhà lên trên hết giữa mùa khan hiếm khắc nghiệt.
      - id: cho_dung_lan_o_ria_trai_de_thu_thach_truoc
        text: Cho phép họ dựng lán nhỏ ở rìa ngoài khu cư trú và cùng đi kiếm ăn thử một mùa
        effects:
          - { type: food, value: 1, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 10 }
          - { type: skill_xp, skill: muu_luoc, value: 8 }
        result:
          - Cách tiếp nhận từng bước vừa bảo đảm an toàn cho trại chính vừa giúp kiểm chứng sự chăm chỉ của người mới.

  # 22. Một đứa trẻ ra đời
  - id: nt_ev_22_dua_tre_ra_doi
    title: Một đứa trẻ ra đời
    text:
      - Tiếng khóc chào đời của một đứa trẻ vang lên trong lán nhỏ giữa đêm sương, mang lại niềm vui lớn cho gia đình.
      - Tuy nhiên, nhu cầu chăm sóc, giữ ấm, thức ăn và sức khỏe của cả người sinh lẫn trẻ nhỏ cũng trở nên cấp thiết hơn bao giờ hết.
    tags: [gia_dinh, suc_khoe]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_cham_soc, nt_nguoi_to_chuc_nghi_thuc, nt_nguoi_bao_quan_thuc_an, nt_nguoi_thu_hai, nt_nguoi_lam_gom] }
        factor: 1.5
    cooldown_years: 8
    importance: 6
    icon: tre
    options:
      - id: danh_tron_thoi_gian_cham_soc
        text: Dành trọn những tuần đầu giữ ấm bếp lửa, nấu nước thảo mộc và túc trực bên gia đình
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: stress, value: -6 }
          - { type: food, value: -2, ledger: su_kien }
        result:
          - Nhờ sự chăm sóc tận tình và bếp lửa luôn ấm áp, cả mẹ và bé đều vượt qua những ngày yếu ớt nhất.
      - id: tang_cuong_kiem_thuc_an
        text: Nỗ lực đi săn và thu hái gấp đôi để mang về thức ăn giàu dinh dưỡng nhất
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: food, value: 4, ledger: su_kien }
          - { type: health, value: -2 }
        result:
          - Bạn dầm sương vượt suối mang về những con cá tươi và mật ong rừng bồi dưỡng cho người thân.
      - id: nho_nguoi_gia_va_cong_dong_phu_giup
        text: Nhờ các bậc cao niên có kinh nghiệm đỡ đẻ và bà con trong nhóm cùng trông nom
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: reputation, group: lang, value: 3 }
        result:
          - Các bà, các mẹ trong cộng đồng mang lá thuốc ấm và tấm da thú mềm sang phụ giúp gia đình bạn.
      - id: chuan_bi_noi_nam_lot_da_thu_va_che_kin_gio
        text: Sửa sang lại góc ngủ kín gió, thuộc thêm tấm da thú mềm và dự trữ sẵn củi khô trong lán
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: stress, value: -4 }
        result:
          - Góc ổ ấm áp giúp đứa trẻ sơ sinh ngủ yên giấc bất chấp sương đêm lạnh giá bên ngoài.

  # 23. Người thân bị thương
  - id: nt_ev_23_nguoi_than_bi_thuong
    title: Người thân bị thương
    text:
      - Một người có vai trò quan trọng trong gia đình bị đá lở đè trúng chân và không thể lao động đi xa trong nhiều tháng.
      - Gia đình phải phân chia lại toàn bộ công việc hoặc nhờ tới sự hỗ trợ của cộng đồng.
    tags: [gia_dinh, suc_khoe]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_cham_soc, nt_nguoi_dung_noi_tru, nt_nguoi_danh_ca, nt_nguoi_tim_nguon_nuoc, nt_nguoi_dan_soi] }
        factor: 1.5
    cooldown_years: 7
    importance: 6
    icon: benh
    options:
      - id: ganh_vac_va_chua_tri
        text: Vừa tự mình gánh vác công việc kiếm ăn, vừa kiên trì bó nẹp và đắp lá thuốc mỗi ngày
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: health, value: -3 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Những tháng ngày vất vả không làm bạn chùn bước; vết thương của người thân dần lành lại.
      - id: sap_xep_viec_tai_cho
        text: Sắp xếp để người thân ngồi tại lán đan lưới, ghè đá trong khi bạn đi kiếm thức ăn
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: money, value: 3, ledger: su_kien }
        result:
          - Người thân của bạn vẫn tạo ra những chiếc giỏ và mũi lao sắc bén ngay tại lán.
      - id: xin_cong_dong_chia_se
        text: Đề nghị nhóm cư trú chia sẻ bớt phần thức ăn chung và hứa sẽ bù lại vào mùa sau
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: food, value: 3, ledger: su_kien }
        result:
          - Cộng đồng sẵn lòng san sẻ từng xâu cá khô giúp gia đình bạn không bị đứt bữa.
      - id: che_nan_go_chong_giup_nguoi_than_tap_di_lai
        text: Chọn cành gỗ chạc ba chắc chắn làm nạng chống và kiên nhẫn dìu người thân tập bước quanh lán
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: stress, value: -3 }
        result:
          - Chiếc nạng gỗ vừa vặn giúp người thân tự di chuyển nhẹ nhàng quanh bếp lửa và phục hồi nhanh hơn.

  # 24. Chuyến trao đổi dài ngày
  - id: nt_ev_24_chuyen_trao_doi_dai_ngay
    title: Chuyến trao đổi dài ngày
    text:
      - Bạn đi theo đoàn vượt qua hai dãy đồi tới điểm hẹn trao đổi với một cộng đồng khác.
      - Tại đây bạn bắt gặp những cách chế tác đá đen, bình gốm và tập quán mới, nhưng cũng phải đối mặt với rủi ro đường đi và quan hệ xa lạ.
    tags: [kinh_te, ngoai_giao, di_cu]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_trao_doi, nt_nguoi_tim_duong, nt_nguoi_che_tac_da, nt_nguoi_lam_gom, nt_nguoi_tim_nguon_nuoc, nt_nguoi_che_tac_xuong_go] }
        factor: 1.6
    cooldown_years: 7
    importance: 6
    icon: cho
    options:
      - id: doi_cong_cu_va_hoc_ky_thuat
        text: Trao đổi vật phẩm và chăm chú quan sát cách họ chế tác công cụ mới
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 14 }
          - { type: skill_xp, skill: hoc_van, value: 8 }
          - { type: money, value: 5, ledger: su_kien }
        result:
          - Bạn mang về những phiến đá quý hiếm cùng bí quyết ghè ép tạo lưỡi sắc mà cộng đồng bạn chưa từng biết.
      - id: ket_ban_va_lap_hen_mua_sau
        text: Tặng quà làm quen và thiết lập lời hẹn trao đổi định kỳ mỗi mùa khô
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 16 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Hai cộng đồng thống nhất lấy tảng đá lớn ven sông làm nơi gặp gỡ hòa bình hằng năm.
      - id: can_trong_giu_khoang_cach
        text: Chỉ đổi nhanh những thứ thiết yếu rồi rút về sớm để tránh bất trắc trên đường
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 12 }
          - { type: food, value: 3, ledger: su_kien }
        result:
          - Bạn hoàn thành việc trao đổi gọn gàng và đưa cả đoàn về tới lán trước khi cơn mưa rừng đổ xuống.
      - id: doi_hat_giong_va_thao_duoc_quy_cua_vung_khac
        text: Ưu tiên đổi lấy những loại hạt giống lạ, muối tự nhiên và thảo mộc khô từ vùng xa
        effects:
          - { type: food, value: 4, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: skill_xp, skill: thuong_mai, value: 10 }
        result:
          - Những sản vật quý hiếm bạn chọn đổi mang lại nguồn giống và thuốc chữa bệnh rất thiết thực cho quê nhà.

  # 25. Tranh chấp bãi kiếm ăn
  - id: nt_ev_25_tranh_chap_bai_kiem_an
    title: Tranh chấp bãi kiếm ăn
    text:
      - Hai nhóm cư trú cùng muốn sử dụng một khu vực nhiều quả chín và nguồn cá dồi dào.
      - Tình hình có thể dẫn đến thỏa thuận chia sẻ, chủ động tránh nhau, căng thẳng kéo dài hoặc xung đột trực diện.
    tags: [lang_xa, xung_dot, ngoai_giao]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_dieu_hoa, nt_nguoi_san_thu, nt_nguoi_danh_ca, nt_nguoi_thu_hai, nt_nguoi_to_chuc_nghi_thuc, nt_nguoi_cham_giu_dong_vat] }
        factor: 1.5
    cooldown_years: 7
    importance: 6
    icon: kiem
    options:
      - id: thuong_luong_chia_ranh_gioi
        text: Tiến lên không cầm vũ khí, đề nghị lấy con suối nhỏ làm ranh giới chia đôi bãi kiếm ăn
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 16 }
          - { type: reputation, group: lang, value: 6 }
        result:
          - Hai nhóm đồng ý chia khu vực khai thác, tránh được một cuộc đổ máu vô ích giữa rừng.
      - id: dan_doan_ap_dao
        text: Tập hợp những người khỏe mạnh cầm giáo đá dàn hàng buộc đối phương phải lùi bước
        effects:
          - { type: skill_xp, skill: quan_su, value: 16 }
          - { type: food, value: 5, ledger: su_kien }
          - { type: health, value: -3 }
        result:
          - Nhóm người kia phải thu lán rút về phía bên kia đồi sau màn đối đầu căng thẳng.
      - id: chu_dong_lui_tim_bai_khac
        text: Chủ động rút lui sang sườn núi phía bắc để bảo toàn lực lượng
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: stress, value: -2 }
        result:
          - Chuyến đi vòng vất vả hơn nhưng cả nhóm tìm được một thung lũng yên bình chưa có dấu chân người.
      - id: de_nghi_cung_danh_bat_va_chia_phan_tai_cho
        text: Đề nghị hai nhóm cùng giăng lưới quây cá lớn rồi chia đều chiến lợi phẩm ngay bên bờ suối
        effects:
          - { type: food, value: 4, ledger: su_kien }
          - { type: skill_xp, skill: thuong_mai, value: 10 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        result:
          - Cuộc hợp tác bất ngờ giúp lượng cá bắt được nhiều gấp đôi so với khi một nhóm làm riêng lẻ.

  # 26. Người bạn cũ trở về
  - id: nt_ev_26_nguoi_ban_cu_tro_ve
    title: Người bạn cũ trở về
    text:
      - Một người từng rời cộng đồng xuất hiện trở lại sau nhiều năm bôn ba ở những vùng đất khác.
      - Họ mang theo kiến thức, mối quan hệ mới nhưng cũng đang gặp khó khăn cần sự giúp đỡ của bạn.
    tags: [lang_xa, gia_dinh]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_trao_doi, nt_nguoi_dung_noi_tru, nt_nguoi_lam_gom] }
        factor: 1.5
    cooldown_years: 8
    importance: 5
    icon: nguoi
    options:
      - id: don_nhan_va_hoc_hoi
        text: Mở rộng vòng tay đón bạn cũ về lán, cùng chia sẻ thức ăn và lắng nghe tri thức mới
        effects:
          - { type: skill_xp, skill: hoc_van, value: 15 }
          - { type: stress, value: -4 }
        result:
          - Những đêm dài bên bếp lửa, người bạn kể cho bạn nghe về những ngôi làng xây bằng đá ở phương xa.
      - id: giup_ban_dung_lan_rieng
        text: Cùng mọi người giúp bạn cũ dựng một lán nhỏ và hòa nhập lại với cộng đồng
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, group: lang, value: 4 }
        result:
          - Nhờ sự bảo lãnh của bạn, cộng đồng nhanh chóng đón nhận lại người con đi xa trở về.
      - id: hoi_ky_ve_tuyen_duong_moi
        text: Hỏi kỹ về các nguồn đá, nguồn nước mà bạn ấy đã đi qua để ghi nhớ
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 14 }
          - { type: skill_xp, skill: thuong_mai, value: 8 }
        result:
          - Bản đồ truyền miệng của cộng đồng được mở rộng thêm nhiều vùng đất mới.
      - id: ru_ban_cung_mo_chuyen_trao_doi_voi_nhom_cu_cua_ho
        text: Đề nghị người bạn làm người dẫn đường nối lại giao thương với nhóm cư trú nơi họ vừa rời đi
        effects:
          - { type: money, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: thuong_mai, value: 14 }
        result:
          - Mối quen biết của người bạn giúp nhóm bạn mở thêm được một điểm trao đổi sản vật thuận lợi.

  # 27. Những dấu hiệu của mùa xấu
  - id: nt_ev_27_dau_hieu_mua_xau
    title: Những dấu hiệu của mùa xấu
    text:
      - "Thời tiết và nguồn thức ăn quanh vùng biến đổi bất lợi: nước suối rút nhanh và đàn chim bay đi sớm hơn thường lệ."
      - Nhân vật có thể chuẩn bị di chuyển, thay đổi công việc hoặc tăng cường tích trữ nhiều hơn trước khi mùa khô ập tới.
    tags: [thien_nhien, kinh_te]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_bao_quan_thuc_an, nt_nguoi_khai_thac_ngu_coc, nt_nguoi_cham_giu_dong_vat, nt_nguoi_tim_duong, nt_nguoi_dung_noi_tru] }
        factor: 1.5
    cooldown_years: 7
    importance: 6
    icon: mua
    options:
      - id: tang_cuong_tich_tru_khan_cap
        text: Huy động cả nhà phơi khô thịt cá, đào thêm hố lót đá trữ hạt và củ rừng ngay lập tức
        effects:
          - { type: skill_xp, skill: quan_tri, value: 15 }
          - { type: food, value: 5, ledger: su_kien }
        result:
          - Nhờ chuẩn bị từ sớm khi thức ăn còn dồi dào, kho dự trữ của gia đình bạn đầy ắp trước khi hạn hán xảy ra.
      - id: chuyen_doi_cach_kiem_an
        text: Chuyển sang khai thác các nguồn thức ăn chịu hạn như củ rừng sâu và nhuyễn thể ven sông lớn
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 15 }
          - { type: food, value: 3, ledger: su_kien }
        result:
          - Gia đình vẫn duy trì được bữa ăn đều đặn giữa lúc nhiều nơi khác thiếu đói.
      - id: de_xuat_di_chuyen_tam_thoi
        text: Đề xuất đưa cộng đồng tạm lánh lên vùng thung lũng cao gần nguồn suối đầu nguồn
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Chuyến di chuyển kịp thời lên vùng thượng nguồn giúp cả nhóm luôn có nước mát và bóng cây che chở.
      - id: nao_vet_va_ke_da_giu_nuoc_tai_cac_hoc_suoi
        text: Rủ thanh niên trong nhóm đắp đá ngăn các hốc nước trũng dọc suối để giữ nước dùng dần
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
          - { type: reputation, group: lang, value: 4 }
        result:
          - Các hốc nước được kè đá giữ lại nguồn nước quý giá cho cả khu cư trú suốt những tuần nắng gắt.

  # 28. Một kỹ thuật được truyền lại
  - id: nt_ev_28_ky_thuat_truyen_lai
    title: Một kỹ thuật được truyền lại
    text:
      - Nhân vật bắt đầu dạy một người trẻ trong nhóm phương pháp chế tác công cụ hoặc tìm kiếm thức ăn mà mình tâm đắc nhất.
      - Quá trình truyền dạy có thể thành công, gặp khó khăn hoặc được chính người học cải tiến thêm.
    tags: [nghe, hoc_tap]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_che_tac_da, nt_nguoi_che_tac_xuong_go, nt_nguoi_dan_soi, nt_nguoi_lam_gom, nt_nguoi_dung_noi_tru, nt_nguoi_gin_giu_chuyen_ke] }
        factor: 1.6
    cooldown_years: 7
    importance: 5
    icon: nghe
    options:
      - id: tan_tinh_chi_day_tung_buoc
        text: Kiên nhẫn cầm tay chỉ việc, truyền lại toàn bộ bí quyết cho lớp trẻ
        effects:
          - { type: skill_xp, skill: hoc_van, value: 15 }
          - { type: reputation, group: lang, value: 6 }
        result:
          - Kỹ thuật của bạn trở thành tài sản chung nâng cao sức sống của cả cộng đồng.
      - id: khuyen_khich_nguoi_hoc_cai_tien
        text: Dạy nền tảng rồi khuyến khích người học tự thử nghiệm cách làm mới của riêng họ
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
          - { type: money, value: 4, ledger: su_kien }
        result:
          - Một người học trò trẻ đã nảy ra cách buộc dây gân thú kiểu mới giúp công cụ bền chắc hơn hẳn.
      - id: chon_nguoi_kien_nhan_nhat
        text: Thử thách lòng kiên nhẫn trước, chỉ truyền dạy sâu cho người thực sự bền bỉ
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: reputation, group: lang, value: 4 }
        result:
          - Người học trò vượt qua thử thách đã tiếp thu trọn vẹn từng chi tiết khó nhất mà không làm hỏng nguyên liệu quý.
      - id: to_chuc_buoi_thuc_hanh_chung_quanh_bep_lua
        text: Mở buổi hướng dẫn chung cho mọi thiếu niên trong nhóm cùng xem và tập làm theo
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Không khí học hỏi sôi nổi lan tỏa khắp trại, giúp nhiều người trẻ cùng nắm được kỹ năng cơ bản.

  # ══════════════════ TUỔI TRUNG NIÊN & TUỔI GIÀ (40+) — MỤC 11.B (29–36) ══════════════════
  # 29. Sức lực không còn như trước
  - id: nt_ev_29_suc_luc_khong_con_nhu_truoc
    title: Sức lực không còn như trước
    text:
      - Một công việc từng quen thuộc như leo dốc mang nặng hay đi săn xa nay trở nên nặng nhọc hơn rất nhiều.
      - Nhân vật phải quyết định chuyển sang công việc phù hợp hơn, nghỉ ngơi nhiều hơn hoặc cố gắng tiếp tục và chấp nhận rủi ro.
    tags: [suc_khoe, nghe]
    life_stages: [trung_nien, tuoi_gia]
    weight: 5
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_san_thu, nt_nguoi_dieu_hoa, nt_nguoi_dung_noi_tru, nt_nguoi_trao_doi] }
        factor: 1.5
    cooldown_years: 8
    importance: 6
    icon: benh
    options:
      - id: chuyen_sang_viec_kheo_leo_tai_cho
        text: Chuyển dần sang chế tác công cụ, đan lát và coi sóc kho dự trữ tại khu trại
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: health, value: 3 }
        result:
          - Sức khỏe của bạn ổn định hơn nhờ tránh được những đêm dầm sương ngoài rừng sâu.
      - id: tap_trung_chi_huy_va_dan_dat
        text: Đi cùng đoàn ở nhịp độ vừa phải để chỉ đường, đọc dấu vết và điều phối chiến thuật
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 15 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Đám thanh niên luôn lắng nghe từng hiệu lệnh giàu kinh nghiệm của bạn trong mỗi chuyến đi.
      - id: co_gang_nhu_thoi_tre
        text: Nén cơn đau khớp, cố gắng mang vác nặng để chứng tỏ mình chưa già
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: health, value: -5 }
        result:
          - Sự gắng sức quá mức khiến lưng và đầu gối bạn sưng tấy, phải nằm nghỉ bên bếp lửa nhiều ngày liền.
      - id: boi_duong_bang_thao_moc_va_chia_viec_cho_con_chau
        text: Uống nước rễ cây ấm gân cốt và giao dần phần mang vác nặng cho con cháu đi cùng
        effects:
          - { type: health, value: 2 }
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        result:
          - Bạn vừa giữ được sự dẻo dai vừa tạo cơ hội cho lớp trẻ gánh vác công việc chung.

  # 30. Người bạn đầu tiên qua đời
  - id: nt_ev_30_nguoi_ban_dau_tien_qua_doi
    title: Người bạn đầu tiên qua đời
    text:
      - Một người đồng hành cùng bạn từ thời thơ ấu đã trút hơi thở cuối cùng sau cơn bệnh nặng.
      - Đứng bên bếp lửa, sự kiện này gợi lại những quyết định và biến cố hai người từng cùng nhau vượt qua.
    tags: [lang_xa, gia_dinh]
    life_stages: [trung_nien, tuoi_gia]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_to_chuc_nghi_thuc, nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_cham_soc] }
        factor: 1.5
    cooldown_years: 10
    importance: 6
    icon: tang
    options:
      - id: to_chuc_nghi_thuc_trang_trong
        text: Chuẩn bị đồ tùy táng bằng vỏ sò, thổ hoàng và kể lại cuộc đời bạn mình bên bếp lửa
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, group: lang, value: 5 }
          - { type: stress, value: -2 }
        result:
          - Câu chuyện của bạn khiến lớp trẻ hiểu được thế hệ đi trước đã vượt qua những gì để giữ lấy khu cư trú hôm nay.
      - id: cham_soc_gia_dinh_nguoi_ban
        text: San sẻ thức ăn và nhận hướng dẫn cho con cháu của người bạn quá cố
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: food, value: -2, ledger: su_kien }
          - { type: reputation, group: lang, value: 6 }
        result:
          - Con của người bạn coi bạn như bậc cha chú ruột thịt trong nhà.
      - id: lang_le_khac_dau_ky_niem
        text: Lặng lẽ khắc một ký hiệu lên vách đá nơi hai người từng ngồi trú mưa thuở nhỏ
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
        result:
          - Đường khắc mộc mạc trên đá lưu giữ dấu vết của một tình bạn đã đi trọn kiếp người.
      - id: hoan_thanh_tam_nguyen_dang_do_cua_nguoi_ban
        text: Tự tay hoàn thành nốt công việc hoặc chuyến đi mà người bạn còn ấp ủ trước lúc nhắm mắt
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: stress, value: -4 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Khi hoàn thành tâm nguyện cuối cùng của tri kỷ, bạn cảm thấy như người bạn vẫn đang mỉm cười đồng hành bên cạnh.

  # 31. Thế hệ trẻ chọn con đường khác
  - id: nt_ev_31_the_he_tre_chon_duong_khac
    title: Thế hệ trẻ chọn con đường khác
    text:
      - Con cái hoặc người trẻ trong nhóm không muốn tiếp tục công việc và vai trò quen thuộc của bạn.
      - Điều này có thể dẫn đến tranh cãi, thỏa hiệp hoặc việc người trẻ tách đi theo hướng mới.
    tags: [gia_dinh, nghe]
    life_stages: [trung_nien, tuoi_gia]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_khai_thac_ngu_coc, nt_nguoi_cham_giu_dong_vat, nt_nguoi_san_thu, nt_nguoi_thu_hai] }
        factor: 1.5
    cooldown_years: 8
    importance: 6
    icon: tre
    options:
      - id: ung_ho_va_trao_hanh_trang
        text: Mỉm cười ủng hộ, tặng họ những công cụ tốt nhất và dặn dò cách giữ mình
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: stress, value: -4 }
        result:
          - Sự cởi mở của bạn giúp người trẻ vững tin thử nghiệm con đường mới mà vẫn luôn hướng về gia đình.
      - id: thoa_hiep_ket_hop_cu_moi
        text: Đề nghị họ dành nửa mùa phụ việc chung của gia đình, nửa mùa thử nghiệm việc mới
        effects:
          - { type: skill_xp, skill: quan_tri, value: 15 }
          - { type: food, value: 3, ledger: su_kien }
        result:
          - Cách sắp xếp hợp lý giúp gia đình vừa giữ được nguồn thu ổn định, vừa mở ra hướng phát triển mới.
      - id: nghiem_khac_giu_nep_cu
        text: Nghiêm khắc yêu cầu họ phải thành thạo nghề cũ của gia đình trước khi nghĩ tới chuyện khác
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: stress, value: 3 }
        result:
          - Người trẻ miễn cưỡng nghe theo lời bạn để giữ hòa khí, nhưng ánh mắt vẫn hướng về những vùng đất xa.
      - id: tim_mot_hoc_tro_khac_trong_nhom_de_truyen_nghe
        text: Để con tự chọn đường riêng, còn mình nhận một đứa trẻ ham học khác trong nhóm làm truyền nhân
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: reputation, group: lang, value: 4 }
        result:
          - Con cái được tự do phát triển mà kỹ nghệ gia truyền của bạn vẫn có người kế thừa xứng đáng.

  # 32. Khu cư trú bắt đầu thay đổi
  - id: nt_ev_32_khu_cu_tru_thay_doi
    title: Khu cư trú bắt đầu thay đổi
    text:
      - Khu vực kiếm ăn quen thuộc không còn như trước sau hàng chục mùa mưa nắng.
      - Một số gia đình chuẩn bị rời đi lập trại mới, trong khi những người khác cố gắng cải tạo và duy trì nơi ở hiện tại.
    tags: [lang_xa, kinh_te]
    life_stages: [trung_nien, tuoi_gia]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_dung_noi_tru, nt_nguoi_bao_quan_thuc_an, nt_nguoi_to_chuc_nghi_thuc] }
        factor: 1.5
    cooldown_years: 8
    importance: 5
    icon: nha
    options:
      - id: gop_suc_xay_dung_nen_tang_moi
        text: Đóng góp kinh nghiệm quy hoạch kho dự trữ, rãnh thoát nước và bếp chung cho khu định cư
        effects:
          - { type: skill_xp, skill: quan_tri, value: 16 }
          - { type: reputation, group: lang, value: 6 }
        result:
          - Những lời khuyên từng trải của bạn giúp khu nhà mới tránh được hướng gió lùa và ngập úng mùa mưa.
      - id: giu_moi_lien_ket_giua_cac_nhom
        text: Đứng ra làm cầu nối giữa những hộ ở lại và những hộ tách sang bãi mới
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 15 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Các nhóm gia đình dù ở cách nhau một con suối vẫn thường xuyên qua lại đổi thức ăn và giúp nhau mùa vụ.
      - id: luu_giu_ky_uc_buoi_ban_dau
        text: Kể cho bọn trẻ nghe về hình dáng khu đất này thuở chỉ mới có vài bếp lửa sơ sài
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
        result:
          - Câu chuyện về buổi đầu dựng lán trở thành truyền thuyết cội nguồn của cả khu cư trú.
      - id: huong_dan_trong_bo_sung_cay_an_qua_va_giu_rung_gan
        text: Khuyên mọi người giữ lại những bụi cây ăn quả gần trại và không chặt phá hết cây chắn gió
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 12 }
        result:
          - Nhờ biết giữ gìn cảnh quan quanh trại, môi trường sống dần phục hồi và mát mẻ hơn.

  # 33. Người cuối cùng còn nhớ
  - id: nt_ev_33_nguoi_cuoi_cung_con_nho
    title: Người cuối cùng còn nhớ
    text:
      - Khi suối chính cạn khô và nguồn thức ăn quen thuộc khan hiếm, bạn nhận ra mình là một trong số ít người còn nhớ mạch nước ngầm, tuyến đường cổ và cách khử độc củ rừng từng dùng nhiều năm trước.
      - Khi hoàn cảnh thay đổi, tri thức tưởng chừng đã ngủ quên ấy lại trở nên sống còn đối với cả cộng đồng.
    tags: [hoc_tap, lang_xa, sinh_ton]
    life_stages: [trung_nien, tuoi_gia]
    weight: 5
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_tim_duong, nt_nguoi_cham_soc, nt_nguoi_che_tac_da] }
        factor: 1.6
    cooldown_years: 9
    importance: 7
    icon: sach
    options:
      - id: dan_doan_nguoi_tre_di_tim
        text: Chống gậy dẫn đám thanh niên tới tận nơi và chỉ dẫn tường tận cách xử lý
        effects:
