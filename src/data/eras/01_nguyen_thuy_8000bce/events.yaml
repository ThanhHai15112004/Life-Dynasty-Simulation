        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: reputation, value: 5 }
        result:
          - Nhờ trí nhớ minh mẫn của bạn, nhóm thanh niên tìm ra đúng thung lũng xưa và mang về đầy ắp thức ăn.
      - id: tu_di_cung
