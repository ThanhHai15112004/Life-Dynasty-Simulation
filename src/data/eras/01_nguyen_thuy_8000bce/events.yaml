        success_result:
          - Bạn phát hiện vệt rêu ẩm dưới chân vách đá, giúp cả nhóm khơi được hố nước ngầm mát lạnh.
        failure_result:
          - Chuyến đi dưới nắng gắt làm bạn kiệt sức và khát khô cổ mà chưa tìm ra điểm nước mới.
      - id: phu_van_chuyen_nuoc
