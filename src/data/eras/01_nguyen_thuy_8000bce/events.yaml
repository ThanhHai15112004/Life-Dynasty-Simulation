    cooldown_years: 6
    importance: 5
    icon: kiem
    options:
      - id: kien_nhan_buoc_va_thu_lai
        text: Kiên nhẫn tháo ra buộc lại dây sợi cho tới khi mũi lao cân bằng
        effects:
          - { type: skill_xp, skill: quan_su, value: 12 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Sau nhiều lần hỏng, kinh nghiệm tích lũy từ thất bại giúp bạn cầm chắc mũi lao đầu tiên của đời mình.
      - id: nho_nguoi_gioi_chi_cach_chon_go
        text: Hỏi người thợ lâu năm cách hơ lửa uốn thẳng thân gỗ trước khi gắn mũi nhọn
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: skill_xp, skill: hoc_van, value: 8 }
        result:
          - Bạn học được bí quyết chọn cành gỗ dẻo và miết nhựa cây giúp mối buộc bền chắc hơn.
      - id: thu_phong_vao_than_cay_muc_de_can_trong_tam
        text: Đem lao ra bãi trống tập phóng vào gốc cây mục để chỉnh lại trọng tâm
        effects:
          - { type: skill_xp, skill: quan_su, value: 14 }
        result:
          - Nhờ thử thực tế nhiều lần, bạn biết cách đặt điểm tựa ngón tay để đường lao bay thẳng.
      - id: lam_them_mot_mui_lao_nho_de_xien_ca
        text: Tận dụng nhánh gỗ nhỏ hơn làm thêm một chiếc đinh ba xiên cá có ngạnh xương
        effects:
          - { type: food, value: 1, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 12 }
        result:
          - Chiếc lao xiên cá vừa sức giúp bạn bắt được ngay vài con cá suối trong buổi chiều hôm ấy.

  # 10. Cuộc săn không thành
  - id: nt_ev_10_cuoc_san_khong_thanh
    title: Cuộc săn không thành
    text:
      - Đoàn săn đi từ sáng sớm đến chiều muộn nhưng trở về với rất ít thức ăn.
      - Nhìn những người lớn mệt mỏi bên bếp lửa, bạn nhận ra công sức bỏ ra không phải lúc nào cũng bảo đảm thành công.
    tags: [san_bat, gia_dinh]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
