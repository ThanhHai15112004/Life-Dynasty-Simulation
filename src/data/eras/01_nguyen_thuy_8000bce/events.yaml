          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: stress, value: 4 }
        result:
          - Cuộc sống vật chất của bạn vẫn vững vàng tại chỗ cũ dù lòng không tránh khỏi nỗi nhớ người đi xa.
      - id: de_nghi_hai_ben_duy_tri_lien_he
        text: Thống nhất điểm hẹn trao đổi sản vật mỗi mùa khô để hai bên thường xuyên gặp lại
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 12 }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: stress, value: -1 }
        result:
          - Khoảng cách địa lý không làm đứt đoạn tình thân mà còn mở ra tuyến trao đổi mới giữa hai nơi.
      - id: to_chuc_bua_an_chia_tay_am_cung
        text: Tổ chức bữa ăn sum họp toàn nhóm và tặng họ những công cụ bền nhất làm kỷ vật
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: reputation, value: 5 }
          - { type: stress, value: -3 }
        result:
