        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: stress, value: -3 }
        result:
          - Cả hai vừa ganh đua vừa chỉ dẫn cho nhau, tình bạn và tay nghề đều tiến bộ nhanh chóng.
      - id: am_tham_tap_luyen_rieng
        text: Âm thầm ở lại tập thêm mỗi chiều để không thua kém bạn cùng trang lứa
        effects:
          - { type: skill_xp, skill: quan_su, value: 14 }
          - { type: stress, value: 3 }
        result:
          - Sự nỗ lực bền bỉ giúp đôi tay bạn vững vàng hơn qua từng mùa.
      - id: tim_mot_linh_vuc_khac_de_phat_huy_so_truong
        text: Chuyển sang rèn luyện kỹ năng đan lát, nhận biết thảo mộc mà bạn có năng khiếu hơn
        effects:
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Bạn nhận ra mỗi người trong nhóm đều có một thế mạnh riêng để bổ trợ cho nhau.
      - id: khen_ngoi_ban_va_xin_lam_cap_doi_phoi_hop
        text: Thật lòng khen ngợi bạn và đề nghị hai đứa lập thành một cặp phối hợp khi đi làm
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: food, value: 2, ledger: su_kien }
        result:
          - Không còn lòng đố kỵ, hai bạn trở thành đôi bạn đồng hành ăn ý nhất trong lứa thiếu niên.

  # 12. Mùa thức ăn khan hiếm
  - id: nt_ev_12_mua_thuc_an_khan_hiem
    title: Mùa thức ăn khan hiếm
    text:
      - Thời tiết khắc nghiệt khiến quả rừng và thú săn đều vắng bóng, gia đình buộc phải giảm khẩu phần mỗi ngày.
      - Người thân bàn tính cách vượt qua những tuần thiếu hụt trước mắt.
    tags: [mat_mua, gia_dinh]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
