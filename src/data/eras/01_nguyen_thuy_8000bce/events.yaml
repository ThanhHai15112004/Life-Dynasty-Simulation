        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: money, value: -1, ledger: su_kien }
        result:
          - Tốn thêm nguyên liệu nhưng kinh nghiệm xương máu giúp sản phẩm thứ hai bền chắc hơn hẳn.
      - id: hoi_nguyen_nhan
        text: Mang mảnh gãy tới hỏi người thợ lâu năm để tìm hiểu nguyên nhân
        effects:
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
        result:
          - Bạn nhận ra vết rạn ngầm trong thớ đá và sửa được lỗi dùng lực quá mạnh khi ghè.
      - id: chuyen_sang_cong_cu_don_gian_hon
