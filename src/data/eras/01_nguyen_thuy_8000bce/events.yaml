      - id: de_nghi_ket_hop_hai_cach
        text: Đề nghị giữ một nửa nhân lực làm theo cách cũ làm nền tảng, một nửa thử cách mới
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: muu_luoc, value: 14 }
