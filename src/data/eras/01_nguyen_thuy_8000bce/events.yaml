      - id: lam_cong_cu_cho_ban_than
        text: Chế tác bộ lưỡi dao và mũi lao sắc bén để nâng cao hiệu quả lao động của bản thân
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: food, value: 2, ledger: su_kien }
        result:
          - Bộ công cụ mới sắc bén giúp bạn xẻ thịt, vót gỗ và làm việc nhanh nhạy hơn hẳn trước kia.
      - id: chia_nguyen_lieu_voi_nguoi_khac
        text: Tách các mảnh tước tốt chia cho những người thợ săn và chế tác trong nhóm
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: reputation, value: 5 }
        result:
          - Dù phần đá còn lại cho mình ít hơn, sự hào phóng của bạn khiến cả nhóm thêm gắn kết và quý trọng.
      - id: giu_lai_de_trao_doi
        text: Cất giữ khối đá nguyên vẹn chờ dịp trao đổi sản vật với các nhóm láng giềng
        effects:
          - { type: money, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: thuong_mai, value: 14 }
        result:
          - Đến kỳ gặp gỡ giữa các nhóm, khối đá hiếm giúp bạn đổi được nhiều thức ăn khô và đồ dùng tốt.
      - id: nho_nghe_nhan_gioi_nhat_che_tac_cung
        text: Mang khối đá đến nhờ người thợ lành nghề nhất nhóm cùng ghè đẽo để tránh lãng phí
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
          - { type: money, value: 1, ledger: su_kien }
        result:
          - Từng nhát ghè chuẩn xác tận dụng tối đa khối đá, vừa tạo ra lưỡi cắt tuyệt hảo vừa giúp bạn học được nghề tinh xảo.

  # 08. Tai nạn trong chuyến săn
  - id: nt_m14_thn_08_tai_nan_trong_chuyen_san
    title: Tai nạn giữa cuộc săn
    text:
      - Một người cùng đoàn bất ngờ bị thương khi vây thú, trong khi con mồi đang bị thương có thể chạy thoát bất cứ lúc nào.
    tags: [san_bat, nguy_hiem, cham_soc]
    life_stages: [thanh_nien, lap_nghiep]
    condition: { var: player.age, op: '<=', value: 30 }
    cooldown_years: 5
    weight: 4
    importance: 6
    icon: thuoc
    options:
      - id: dung_lai_giup_nguoi_bi_thuong
        text: Lập tức dừng truy đuổi để cầm máu và băng bó cho người đồng hành
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: reputation, value: 6 }
          - { type: food, value: -1, ledger: su_kien }
        result:
          - Con mồi chạy thoát vào rừng sâu nhưng nhờ được sơ cứu kịp thời, người bạn đi săn giữ được tính mạng.
      - id: tiep_tuc_san_cung_mot_phan_doan
        text: Để một người ở lại sơ cứu, còn mình cùng số người khỏe tiếp tục đuổi theo con thú
        chance: { base: 0.55, skill: quan_su, per_level: 0.08 }
        success:
          - { type: food, value: 5, ledger: su_kien }
          - { type: skill_xp, skill: quan_su, value: 16 }
        failure:
          - { type: health, value: -5 }
          - { type: stress, value: 6 }
        success_result:
          - Bạn hạ được con thú và kịp quay lại khiêng người bị thương về trại cùng chiến lợi phẩm.
        failure_result:
          - Đội hình mỏng khiến việc truy đuổi thất bại và việc đưa người bị thương về trại càng thêm chật vật.
      - id: de_nghi_ca_doan_rut_lui
        text: Đề nghị cả đoàn ngừng cuộc săn ngay để tập trung khiêng người bị thương về nơi trú
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: stress, value: -2 }
          - { type: reputation, value: 3 }
        result:
          - Chuyến săn về tay không nhưng cả đoàn giữ được an toàn trước khi trời tối.
      - id: danh_dau_vet_mau_roi_quay_lai_sau
        text: Giúp sơ cứu và đưa người bị thương về chỗ an toàn gần đó, đồng thời đánh dấu vết máu thú để lần theo sau
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: muu_luoc, value: 14 }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
        result:
          - Sự bình tĩnh của bạn giúp vừa lo chu toàn cho người gặp nạn vừa không mất hoàn toàn dấu vết con mồi.

  # 09. Bãi săn suy giảm
  - id: nt_m14_thn_09_bai_san_suy_giam
    title: Bãi săn quen thuộc suy giảm
    text:
      - Những đàn thú từng xuất hiện nhiều quanh khu vực quen thuộc nay trở nên thưa thớt và hiếm gặp.
    tags: [san_bat, sinh_ton, kinh_te]
    life_stages: [thanh_nien, lap_nghiep]
    condition: { var: player.age, op: '<=', value: 30 }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: rung
    options:
      - id: tim_bai_san_moi
        text: Tổ chức các chuyến thăm dò xa hơn để tìm bãi săn mới
        effects:
          - { type: health, value: -3 }
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 16 }
        result:
          - Sau nhiều ngày vượt đồi, bạn phát hiện một thung lũng mới nơi các đàn thú đang di chuyển tới.
      - id: chuyen_sang_danh_ca_hoac_hai_luom
        text: Chuyển trọng tâm sang đánh bắt cá ven sông và thu hái hạt, củ theo mùa
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
        result:
          - Việc đa dạng hóa nguồn thức ăn giúp gia đình không còn phụ thuộc hoàn toàn vào thịt thú săn.
      - id: tiep_tuc_san_tai_cho_cu
        text: Kiên trì bám trụ bãi săn cũ và đặt thêm nhiều bẫy nhỏ
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: quan_su, value: 8 }
          - { type: stress, value: 3 }
        result:
          - Bạn không phải thay đổi thói quen sinh hoạt nhưng lượng thịt mang về ngày càng ít ỏi.
      - id: de_nghi_nhom_cho_bai_san_nghi_theo_mua
        text: Đề xuất với nhóm tạm ngừng săn ở thung lũng gần nhà một mùa để thú rừng quay lại
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 14 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: reputation, value: 3 }
        result:
          - Nhiều người đồng tình với tầm nhìn xa của bạn và chuyển hướng khai thác luân phiên các vùng quanh trại.

  # 10. Một đứa trẻ ra đời
