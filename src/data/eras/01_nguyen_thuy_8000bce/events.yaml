      - id: tu_choi_gap
        text: Lắc đầu từ chối gặp mặt vì không muốn khơi lại chuyện buồn năm cũ
        effects:
          - { type: stress, value: 3 }
        result:
          - Người kia lặng lẽ quay về; sự im lặng nặng nề vẫn còn nguyên giữa hai mái lán.
      - id: khuyen_con_chau_hai_nha_khep_lai_chuyen_cu
        text: Nhân cuộc gặp này gọi con cháu hai gia đình tới chứng kiến và dặn không được nối tiếp hiềm khích đời trước
        effects:
          - { type: stress, value: -6 }
