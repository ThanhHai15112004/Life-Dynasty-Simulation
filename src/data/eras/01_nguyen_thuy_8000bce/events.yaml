    text:
      - Một số gia đình trong nhóm muốn dời trại đến vùng đất mới, trong khi những gia đình khác kiên quyết muốn ở lại nơi cũ.
    tags: [di_cu, cong_dong, ngoai_giao]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 6
    weight: 4
    importance: 6
    icon: ban_do
    options:
      - id: ung_ho_di_chuyen
