          - { type: reputation, value: 3 }
          - { type: stress, value: 3 }
        result:
          - Dù ban đầu có vài lời trách móc, sự thẳng thắn của bạn giúp cộng đồng kịp thời thắt lưng buộc bụng.
      - id: tim_nguon_thuc_an_bo_sung
        text: Lập tức dẫn người đi thu hái hạt hoang và săn bắt bổ sung vào phần bị hụt
        effects:
          - { type: health, value: -3 }
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 14 }
        result:
          - Công sức bỏ ra kịp thời giúp bù đắp phần lớn lượng lương thực bị hỏng.
      - id: tri_hoan_thong_bao
        text: Âm thầm lọc bỏ phần mốc và trì hoãn việc báo tin để tránh gây hoang mang
        effects:
          - { type: stress, value: 6 }
          - { type: reputation, value: -5 }
          - { type: skill_xp, skill: muu_luoc, value: 8 }
        result:
          - Khu cư trú yên ả được vài tuần nhưng khi sự thật lộ ra, nhiều người bất bình vì không kịp chuẩn bị.
      - id: cai_tien_kho_chua_lot_da_va_trat_dat_set
        text: Huy động mọi người phơi ngay phần hạt còn tốt và xây lại hố chứa lót đá phẳng, trát đất sét kín
        effects:
          - { type: money, value: -1, ledger: su_kien }
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: skill_xp, skill: quan_tri, value: 12 }
