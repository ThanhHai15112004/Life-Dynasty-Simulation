  # 21. Người lạ xin trú nhờ
  - id: nt_ev_21_nguoi_la_xin_tru_nho
    title: Người lạ xin trú nhờ
    text:
      - Chiều muộn, một người cùng gia đình nhỏ tả tơi từ vùng đồi phía tây tìm tới bìa trại xin được ở lại.
      - Cộng đồng phải cân nhắc kỹ giữa nguồn lương thực hạn hẹp, sự an toàn và khả năng đóng góp của người mới.
    tags: [lang_xa, ngoai_giao]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_dieu_hoa, nt_nguoi_to_chuc_nghi_thuc, nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_bao_quan_thuc_an, nt_nguoi_cham_soc] }
        factor: 1.5
    cooldown_years: 7
    importance: 5
    icon: nguoi
    options:
      - id: cho_o_lai_va_chia_viec
        text: Đón họ vào lán, chia sẻ thức ăn và phân công họ phụ giúp kiếm củi, đan lát
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, group: lang, value: 5 }
          - { type: food, value: -2, ledger: su_kien }
        result:
          - Gia đình người lạ cảm kích sự cưu mang và chỉ cho nhóm bạn cách bẫy chim nước rất hiệu quả.
      - id: cho_tru_tam_ngan_ngay
        text: Cho họ trú tạm dưới mái hiên vài ngày chờ tạnh mưa rồi chỉ đường đi tiếp
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
        result:
          - Khi trời hửng nắng, gia đình người lạ để lại một chuỗi vỏ sò thay lời cảm ơn trước khi lên đường.
      - id: canh_giac_tu_choi
        text: Cẩn trọng từ chối cho vào trại vì sợ thiếu lương thực và rủi ro xung đột
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
          - { type: stress, value: 2 }
        result:
          - Bạn đặt sự sinh tồn của người nhà lên trên hết giữa mùa khan hiếm khắc nghiệt.

  # 22. Một đứa trẻ ra đời
  - id: nt_ev_22_dua_tre_ra_doi
    title: Một đứa trẻ ra đời
    text:
