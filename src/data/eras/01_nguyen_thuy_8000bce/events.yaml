        result:
          - Giải pháp dung hòa đầy trí tuệ của bạn giúp cả nhóm vừa có cái ăn chắc chắn vừa tìm ra cải tiến mới.
      - id: truyen_lai_nhung_bai_hoc_that_bai_nam_xua
        text: Kể lại những lần thế hệ trước từng thử tương tự để lớp trẻ biết chỗ hiểm mà tránh
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
