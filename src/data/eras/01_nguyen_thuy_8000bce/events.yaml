        text: Đứng ra nhận lấy phần việc nặng nhọc và làm hết sức mình
        effects:
          - { type: skill_xp, skill: quan_tri, value: 16 }
          - { type: reputation, group: lang, value: 5 }
          - { type: health, value: -2 }
        result:
          - Dù đôi tay còn lóng ngóng những ngày đầu, bạn thức khuya dậy sớm hoàn thành trọn vẹn phần việc được giao.
      - id: vua_lam_vua_hoi_nguoi_gia
        text: Nhận việc nhưng mỗi tối đều tới bên bếp lửa hỏi ý kiến người già
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
          - { type: stress, value: -3 }
        result:
          - Sự khiêm tốn giúp bạn tránh được những sai lầm nghiêm trọng khi lần đầu tự tay điều phối công việc.
      - id: de_nghi_chia_nho_viec
        text: Đề nghị chia phần việc cho ba người trẻ cùng gánh vác
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Cách làm chung giúp cả nhóm trẻ cùng tiến bộ và gắn kết chặt chẽ hơn.

  # 19. Một cuộc săn nguy hiểm (id giữ tương thích kiểm thử: san_ban_thu_lon_nguyen_thuy)
  - id: san_ban_thu_lon_nguyen_thuy
    title: Một cuộc săn nguy hiểm
    text:
      - Đoàn săn phát hiện dấu chân rướm máu của một con bò rừng khổng lồ gần hẻm đá.
      - Tiếp tục truy kích có thể mang lại lượng thịt và da lớn cho cả khu cư trú, nhưng con thú đang bị kích động dữ dội và rất dễ húc trọng thương người áp sát.
