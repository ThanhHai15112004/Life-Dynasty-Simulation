          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: reputation, value: 4 }
        failure:
          - { type: health, value: -6 }
          - { type: money, value: 1, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 12 }
        success_result:
          - Bạn trở về với những mảnh đá vỏ chai đen bóng sắc như gương và thiết lập được mối giao hảo quý giá.
        failure_result:
          - Đường núi hiểm trở khiến bạn bị thương nhẹ và chỉ mang về được một ít mảnh đá nhỏ.
      - id: gui_vat_pham_nho_trao_doi
        text: Ở nhà nhưng gửi theo giỏ đan, hạt khô nhờ đoàn đổi giúp đá obsidian
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: money, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: thuong_mai, value: 10 }
