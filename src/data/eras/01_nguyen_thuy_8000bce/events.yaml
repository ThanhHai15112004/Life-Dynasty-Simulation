      - id: de_nghi_sua_chua_va_gia_co
        text: Chỉ dẫn mọi người xếp đá kè bờ và đào rãnh thoát nước để giữ lại nơi cư trú
        effects:
          - { type: health, value: -3 }
          - { type: skill_xp, skill: quan_tri, value: 14 }
