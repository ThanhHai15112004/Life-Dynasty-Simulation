        factor: 1.4
    cooldown_years: 5
    importance: 5
    icon: thuoc
    options:
      - id: o_lai_cham_va_lam_do_tai_cho
        text: Tự mình ở lại rửa vết thương, giữ lửa và tranh thủ đan sợi, sửa công cụ tại nơi trú
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: reputation, value: 3 }
        result:
          - Nhờ được giữ ấm và thay lá sạch đều đặn, vết thương của người thân bớt sưng tấy và dần khép miệng.
      - id: di_kiem_an_gap_doi
        text: Để người khác ở lại trông nom, còn mình nhận phần đi kiếm thức ăn bù cho cả hai
