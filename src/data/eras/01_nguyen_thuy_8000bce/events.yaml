  # 01. Người học trò cuối cùng
  - id: nt_m14_ln_01_nguoi_hoc_tro_cuoi_cung
    title: Người học trò cuối cùng
    text:
      - Một đứa trẻ sáng dạ trong nhóm tha thiết muốn học kỹ năng mà bạn đã thực hành và đúc kết suốt nhiều năm cuộc đời.
    tags: [hoc_hanh, truyen_thong, tuoi_gia]
    life_stages: [trung_nien, tuoi_gia]
    condition: { var: player.age, op: '>=', value: 51 }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: sach
    options:
      - id: day_tan_tinh
        text: Dành trọn tâm huyết chỉ dạy tận tình từng bí quyết nhỏ cho đứa trẻ
        effects:
          - { type: health, value: -3 }
          - { type: skill_xp, skill: hoc_van, value: 16 }
          - { type: reputation, value: 6 }
          - { type: stress, value: -3 }
        result:
          - Dù đôi tay già nua mỏi nhừ sau mỗi buổi dạy, bạn mãn nguyện khi thấy đứa trẻ tiếp thu trọn vẹn kỹ nghệ của đời mình.
      - id: chi_day_nhung_dieu_quan_trong_nhat
        text: Chỉ truyền đạt những nguyên lý cốt lõi nhất và để đứa trẻ tự rèn luyện thêm
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: reputation, value: 4 }
        result:
          - Bạn giữ được sức khỏe mà vẫn đặt được nền móng vững chắc cho thế hệ kế cận.
      - id: nho_nguoi_tre_khac_huong_dan
        text: Nhờ một người học trò cũ đã thành nghề trực tiếp kèm cặp đứa trẻ dưới sự giám sát của bạn
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: stress, value: -2 }
        result:
          - Kỹ năng được truyền nối qua ba thế hệ liên tiếp mà bạn không phải tốn nhiều sức lực.
      - id: vua_day_nghe_vua_ke_chuyen_coi_nguon
        text: Lồng ghép những câu chuyện về tổ tiên và lịch sử nhóm vào từng buổi hướng dẫn thực hành
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: reputation, value: 5 }
        result:
          - Đứa trẻ không chỉ học được cách làm công cụ mà còn thấm nhuần ký ức và đạo lý của cộng đồng.

  # 02. Chuyến đi cuối
  - id: nt_m14_ln_02_chuyen_di_cuoi
    title: Chuyến trở lại nơi cư trú xưa
    text:
      - Một nhóm người trẻ chuẩn bị trở lại thăm dò khu cư trú cũ nơi bạn từng gắn bó thời trai trẻ.
    tags: [di_cu, truyen_thong, tuoi_gia]
    life_stages: [trung_nien, tuoi_gia]
    condition: { var: player.age, op: '>=', value: 51 }
    cooldown_years: 8
    weight: 4
    importance: 5
    icon: ban_do
    options:
      - id: di_cung
        text: Chống gậy đi cùng đoàn để tận mắt nhìn lại mảnh đất xưa một lần cuối
        effects:
          - { type: health, value: -5 }
          - { type: stress, value: -6 }
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: reputation, value: 5 }
        result:
          - Đứng trước nền bếp lửa cũ đã phủ rêu xanh, bao ký ức một đời ùa về khiến lòng bạn dâng trào xúc động.
      - id: nho_nguoi_khac_tim_hieu_roi_ke_lai
        text: Ở lại trại và dặn người trẻ quan sát kỹ cảnh vật nơi cũ rồi về kể lại cho mình nghe
        effects:
          - { type: stress, value: -2 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        result:
          - Bạn tránh được chuyến đi vất vả quá sức và mỉm cười lắng nghe lời kể khi đoàn trở về.
      - id: o_lai_va_ke_nhung_ky_uc_ve_noi_ay
        text: Ở nhà bên bếp lửa và kể cho cả đoàn nghe tường tận từng con suối, hốc đá của vùng đất cũ trước khi họ đi
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: reputation, value: 4 }
        result:
          - Những chỉ dẫn từ ký ức của bạn giúp đoàn trẻ đi đường thuận lợi và thêm trân trọng cội nguồn.
      - id: nho_mang_ve_mot_vien_da_hoac_nam_dat_noi_cu
        text: Nhờ con cháu nhặt về một viên đá suối hoặc nhánh cây từ nơi ở cũ làm kỷ vật
        effects:
          - { type: stress, value: -4 }
          - { type: reputation, value: 3 }
        result:
          - Cầm viên đá mát lạnh từ mảnh đất tuổi thơ trên tay, bạn cảm thấy tâm hồn mình thật thanh thản.

  # 03. Người bạn cuối cùng
