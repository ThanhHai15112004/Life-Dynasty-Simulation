    weight: 4
    importance: 6
    icon: gia_dinh
    options:
      - id: danh_nhieu_thoi_gian_cham_soc
        text: Giảm các chuyến đi xa để ở nhà giữ lửa, nấu nước và chăm sóc mẹ con đứa trẻ
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: stress, value: -4 }
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: reputation, value: 4 }
        result:
          - Nhờ sự chăm chút tận tình của bạn, cả người mới sinh lẫn đứa trẻ đều khỏe mạnh vượt qua những tuần đầu tiên.
      - id: nho_nguoi_than_giup
        text: Nhờ những người lớn tuổi và họ hàng trong nhóm sang đỡ đần việc chăm sóc
        effects:
