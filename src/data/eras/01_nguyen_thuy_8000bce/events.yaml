          - { type: reputation, value: 3 }
        result:
          - Cộng đồng giữ được sự ổn định và những tài sản cố định đã dày công xây dựng.
      - id: de_nghi_mot_nhom_tham_do_truoc
        text: Đề xuất cử một đội tiền trạm đi khảo sát thực tế vùng đất mới rồi mới quyết định chung
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: muu_luoc, value: 14 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: reputation, value: 5 }
        result:
          - Cách giải quyết thận trọng của bạn làm dịu cuộc tranh cãi và giúp cả nhóm có thông tin xác thực.
      - id: thoa_thuan_tach_nhom_theo_mua_roi_hoi_hop
        text: Đề nghị nhóm thích đi xa tách ra lập trại mùa khô, hẹn đến mùa mưa cùng hội tụ trao đổi sản vật
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: thuong_mai, value: 12 }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
        result:
          - Cả hai phía đều thỏa nguyện mà không gây chia rẽ, lại giảm được áp lực khai thác lên một vùng đất.

  # 19. Người con không giỏi nghề cũ
  - id: nt_m14_trn_19_nguoi_con_khong_gioi_nghe_cu
    title: Người trẻ không hợp nghề truyền thống
    text:
      - Người trẻ trong gia đình tỏ ra vụng về và không có năng khiếu với công việc mà bạn đã gắn bó suốt nhiều năm.
    tags: [gia_dinh, nghe, hoc_hanh]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 6
    weight: 4
    importance: 4
    icon: gia_dinh
    options:
      - id: tiep_tuc_huong_dan
        text: Nghiêm khắc yêu cầu người trẻ tiếp tục rèn luyện nghề của gia đình
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
