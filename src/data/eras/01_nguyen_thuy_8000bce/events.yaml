        result:
          - Bạn dầm sương vượt suối mang về những con cá tươi và mật ong rừng bồi dưỡng cho người thân.
      - id: nho_nguoi_gia_va_cong_dong_phu_giup
        text: Nhờ các bậc cao niên có kinh nghiệm đỡ đẻ và bà con trong nhóm cùng trông nom
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: reputation, group: lang, value: 3 }
        result:
          - Các bà, các mẹ trong cộng đồng mang lá thuốc ấm và tấm da thú mềm sang phụ giúp gia đình bạn.

  # 23. Người thân bị thương
  - id: nt_ev_23_nguoi_than_bi_thuong
