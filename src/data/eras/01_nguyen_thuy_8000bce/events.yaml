      - id: den_ke_lai_chuyen_cu
        text: Đến ngồi bên cạnh ôn lại những kỷ niệm vui buồn thuở hai đứa còn chạy nhảy trong rừng
        effects:
          - { type: stress, value: -4 }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
        result:
          - Người bạn mỉm cười yếu ớt khi nhớ lại những năm tháng thanh xuân, cơn đau thể xác dường như dịu bớt.
      - id: hua_se_doi_theo_va_chi_bao_con_chau_cua_ban
        text: Nắm tay bạn hứa sẽ thay họ chỉ bảo và trông nom con cháu trong gia đình họ
        effects:
          - { type: reputation, value: 7 }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
