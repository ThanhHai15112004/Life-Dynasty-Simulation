    text:
      - Đoàn săn đi từ sáng sớm đến chiều muộn nhưng trở về với rất ít thức ăn.
      - Nhìn những người lớn mệt mỏi bên bếp lửa, bạn nhận ra công sức bỏ ra không phải lúc nào cũng bảo đảm thành công.
