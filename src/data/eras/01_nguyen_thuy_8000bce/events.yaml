        effects:
          - { type: skill_xp, skill: quan_su, value: 12 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Sau nhiều lần hỏng, kinh nghiệm tích lũy từ thất bại giúp bạn cầm chắc mũi lao đầu tiên của đời mình.
      - id: nho_nguoi_gioi_chi_cach_chon_go
        text: Hỏi người thợ lâu năm cách hơ lửa uốn thẳng thân gỗ trước khi gắn mũi nhọn
