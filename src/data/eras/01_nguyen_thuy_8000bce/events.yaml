        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_tim_nguon_nuoc, nt_nguoi_tim_duong] }
        factor: 1.3
    cooldown_years: 6
    importance: 4
    icon: nuoc
    options:
      - id: danh_dau_duong_den_vung_nuoc
        text: Xếp mấy hòn đá làm dấu đường dẫn tới vũng nước mới
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: reputation, value: 2 }
        result:
          - Điểm nước nhỏ ấy giúp những người đi hái lượm quanh đồi có chỗ uống nước sạch suốt mùa nắng.
      - id: quan_sat_dau_chan_thu_lon
        text: Ngồi xuống đo thử độ sâu và hướng đi của dấu chân thú lớn cùng người đi săn
        effects:
          - { type: skill_xp, skill: quan_su, value: 10 }
          - { type: skill_xp, skill: muu_luoc, value: 6 }
        result:
          - Lần đầu tiên bạn cảm nhận rõ cả sự hùng vĩ lẫn mối hiểm nguy luôn rình rập nơi rừng hoang.

