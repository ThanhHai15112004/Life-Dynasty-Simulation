  # 09. Mũi lao đầu tiên
  - id: nt_ev_09_mui_lao_dau_tien
    title: Mũi lao đầu tiên
    text:
      - Một người lớn trong nhóm hướng dẫn bạn tự tay buộc và chỉnh thẳng một mũi lao đơn giản.
      - Lần thử đầu tiên cán gỗ dễ bị lệch và dây buộc chưa đủ chặt, đòi hỏi nhiều lần làm lại.
