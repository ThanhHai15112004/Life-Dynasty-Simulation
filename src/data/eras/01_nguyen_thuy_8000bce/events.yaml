  # 11. Người bạn giỏi hơn mình
  - id: nt_ev_11_nguoi_ban_gioi_hon
    title: Người bạn giỏi hơn mình
    text:
      - Một người bạn cùng lứa học cách ghè đá và theo dấu nhanh hơn bạn thấy rõ, được người lớn khen ngợi trước mặt cả nhóm.
      - Cảm giác cạnh tranh trỗi dậy trong lòng bạn sau buổi làm việc chung.
