        text: Lặng lẽ làm ngơ coi như chưa nhìn thấy để tránh xung đột khó xử
        effects:
          - { type: stress, value: 4 }
          - { type: skill_xp, skill: muu_luoc, value: 8 }
        result:
          - Không có cuộc cãi vã nào nổ ra nhưng trong lòng bạn không còn giữ được sự tin cậy như xưa.
      - id: yeu_cau_ho_gop_cong_lam_viec_bu_lai
        text: Giữ kín chuyện nhưng yêu cầu họ phải đi kiếm thêm củi và thức ăn gấp đôi để bù vào kho chung
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: skill_xp, skill: muu_luoc, value: 10 }
        result:
          - Kho lương thực của nhóm được bù đắp đầy đủ mà không gây xáo trộn hay chia rẽ nội bộ.

  # 16. Lời mời đi xa lần nữa
  - id: nt_m14_trn_16_loi_moi_di_xa_lan_nua
    title: Lời mời khám phá vùng đất mới ở tuổi trung niên
    text:
      - Một người bạn cũ dày dạn kinh nghiệm đề nghị bạn tham gia chuyến khảo sát tìm địa điểm cư trú mới ở vùng thung lũng xa.
    tags: [di_cu, quan_he, sinh_ton]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: ban_do
    options:
      - id: tham_gia
        text: Gác lại việc nhà ít ngày để cùng bạn cũ lên đường khảo sát vùng đất mới
        effects:
          - { type: health, value: -3 }
          - { type: money, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 16 }
          - { type: reputation, value: 4 }
        result:
          - Đôi mắt tinh tường của tuổi trung niên giúp đoàn tìm ra tuyến đường an toàn và nguồn đá quý mới.
      - id: cu_nguoi_co_kha_nang_phu_hop_hon
        text: Đề cử một thanh niên khỏe mạnh trong gia đình đi thay mình
        effects:
          - { type: food, value: 1, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: reputation, value: 3 }
        result:
          - Bạn giữ được sức khỏe ở nhà trong khi thế hệ trẻ của gia đình có cơ hội rèn luyện bản lĩnh.
      - id: tu_choi
        text: Từ chối chuyến đi xa để chuyên tâm giữ gìn nề nếp sinh hoạt hiện tại
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: stress, value: -2 }
        result:
          - Công việc của gia đình diễn ra êm đềm và ổn định không chút xáo trộn.
      - id: cung_cap_luong_kho_va_chi_dan_duong_di_cu
        text: Không đi trực tiếp nhưng chia sẻ lương khô và chỉ dẫn tỉ mỉ những mốc địa hình bạn từng biết
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: reputation, value: 4 }
        result:
          - Đoàn khảo sát nhờ sự chỉ dẫn của bạn mà đi về bình an và chia cho bạn một phần sản vật mới.

  # 17. Chuyến săn có người bị thương
  - id: nt_m14_trn_17_chuyen_san_co_nguoi_bi_thuong
    title: Bạn đồng hành bị thương nặng trên đường săn
    text:
      - Trong chuyến đi săn xa nơi cư trú, người bạn đồng hành của bạn bị thú húc trọng thương khiến cả đoàn phải thay đổi kế hoạch.
    tags: [san_bat, nguy_hiem, cham_soc]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 5
    weight: 4
    importance: 6
    icon: thuoc
    options:
      - id: dung_chuyen_san_de_dua_nguoi_ay_ve
        text: Ra lệnh hủy ngay chuyến săn, kết cáng gỗ đưa người bị thương về trại càng sớm càng tốt
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: reputation, value: 7 }
          - { type: skill_xp, skill: quan_tri, value: 12 }
        result:
          - Dù trở về tay trắng, việc đưa người gặp nạn về kịp lúc giúp giữ được mạng sống quý giá của thành viên trong nhóm.
      - id: chia_doan_thanh_hai_nhom
        text: 'Chia đoàn làm hai: một nửa khiêng người bị thương về trước, một nửa tiếp tục kiếm thức ăn'
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: health, value: -3 }
          - { type: skill_xp, skill: quan_tri, value: 14 }
        result:
          - Cả hai nhóm đều phải gồng mình làm việc gấp đôi nhưng vừa cứu được người vừa có thịt mang về.
      - id: dung_noi_tru_tam_cho_hoi_phuc
        text: Dựng lán tạm ngay tại hốc đá kín gió để cầm máu và chờ người bị thương qua cơn nguy kịch rồi mới di chuyển
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
        result:
          - Quyết định không khiêng đi xóc nảy trên đường dốc giúp vết thương không bị chảy máu thêm.
      - id: cu_nguoi_chay_nhanh_ve_bao_tin_goi_chi_vien
        text: Sơ cứu tại chỗ đồng thời cử người trẻ khỏe nhất chạy về trại gọi thêm người mang cáng và thuốc lá tới đón
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 16 }
          - { type: reputation, value: 5 }
        result:
          - Đội tiếp ứng từ trại kịp thời chạy tới hỗ trợ, đưa cả đoàn về nơi trú an toàn trước khi đêm xuống.

  # 18. Tranh cãi về nơi cư trú
  - id: nt_m14_trn_18_tranh_cai_ve_noi_cu_tru
