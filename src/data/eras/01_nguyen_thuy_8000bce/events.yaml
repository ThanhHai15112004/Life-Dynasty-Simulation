  # 12. Người dẫn nhóm qua đời
  - id: nt_m14_trn_12_nguoi_dan_nhom_qua_doi
    title: Bậc trưởng bối dẫn nhóm qua đời
    text:
      - Một thành viên có uy tín lớn, người thường đứng ra điều phối các công việc chung của cả nhóm, bất ngờ qua đời.
