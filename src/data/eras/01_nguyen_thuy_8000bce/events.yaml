  # 14. Công cụ bị vỡ
  - id: nt_ev_14_cong_cu_bi_vo
    title: Công cụ bị vỡ
    text:
      - Giữa lúc đang làm việc, lưỡi đá trên công cụ quan trọng của bạn bị nứt vỡ làm đôi.
      - Nếu không có dụng cụ thay thế, bạn sẽ khó tiếp tục phần việc của mình trong những ngày tới.
