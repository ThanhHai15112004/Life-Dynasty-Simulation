          - Lao động chung biến sự đối đầu thành hợp tác, mạch nước được khơi thông dồi dào hơn trước.

  # 14. Thử nghiệm cây lương thực [Tây Á]
  - id: nt_m14_thn_14_thu_nghiem_cay_luong_thuc
    title: Thử nghiệm cách chọn và gieo hạt mới
    text:
      - Bạn nhận thấy những bông lúa mì và đại mạch có trục bông dai không dễ rụng hạt và muốn thay đổi cách chọn giống, gieo hạt so với kinh nghiệm cũ.
    tags: [canh_tac, hoc_hanh, tay_a]
    life_stages: [thanh_nien, lap_nghiep]
    condition:
      all:
        - { var: player.age, op: '<=', value: 30 }
        - any:
            - { var: world.polity_id, op: '==', value: luoi_liem_mau_mo_8000bce }
            - { var: player.origin, op: in, value: [nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_giu_kho] }
            - { var: player.career, op: in, value: [nt_nguoi_khai_thac_ngu_coc, nt_nguoi_bao_quan_thuc_an] }
            - { has_property: nt_khu_cay_luong_thuc }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: lua
    options:
      - id: danh_mot_khu_nho_de_thu
        text: Dành riêng một khoảnh đất ẩm ven bãi bồi để gieo thử nghiệm những hạt chọn lọc
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
        result:
          - Khoảnh đất thử nghiệm mọc đều và ít rụng hạt, mang lại kinh nghiệm quý mà không làm ảnh hưởng vụ mùa chính.
      - id: ap_dung_tren_toan_khu_canh_tac
        text: Áp dụng ngay cách chọn hạt và mật độ gieo mới trên toàn bộ bãi cây lương thực
        chance: { base: 0.55, skill: hoc_van, per_level: 0.08 }
        success:
          - { type: food, value: 6, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 16 }
          - { type: reputation, value: 5 }
        failure:
          - { type: food, value: -3, ledger: su_kien }
          - { type: stress, value: 6 }
        success_result:
          - Vụ thu hoạch đạt sản lượng vượt trội khiến cả khu cư trú học theo phương pháp của bạn.
        failure_result:
          - Thời tiết thất thường khiến giống hạt mới nảy mầm không đều, sản lượng sụt giảm đáng tiếc.
      - id: giu_cach_cu
        text: Tiếp tục thu hái và gieo hạt theo cách truyền thống đã quen thuộc
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
        result:
          - Vụ mùa giữ mức ổn định như mọi năm dù bạn bỏ lỡ cơ hội cải tiến kỹ thuật canh tác.
      - id: trao_doi_hat_giong_voi_khu_cu_tru_lang_gieng
        text: Đem một phần hạt giống tốt đổi với nhóm canh tác láng giềng để gieo đối chứng
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: thuong_mai, value: 10 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
        result:
          - Việc kết hợp hai nguồn hạt giúp cây khỏe hơn và chịu hạn tốt hơn trên đất sườn đồi.

  # 15. Một con vật bị bắt giữ [Tây Á, nơi có chăn giữ sơ khai]
  - id: nt_m14_thn_15_mot_con_vat_bi_bat_giu
    title: Con thú non trong rào chắn
    text:
      - Nhóm đang chăm giữ một con dê hoặc cừu hoang non bắt được sau chuyến săn, nhưng nó liên tục húc rào tìm cách thoát ra.
    tags: [chan_nuoi, tay_a, sinh_ton]
    life_stages: [thanh_nien, lap_nghiep]
    condition:
      all:
        - { var: player.age, op: '<=', value: 30 }
        - any:
            - { var: world.polity_id, op: '==', value: luoi_liem_mau_mo_8000bce }
            - { var: player.origin, op: in, value: [nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_giu_kho, nt_con_nguoi_san_thu] }
            - { var: player.career, op: in, value: [nt_nguoi_cham_giu_dong_vat, nt_nguoi_san_thu] }
            - { has_property: nt_nhom_dong_vat_quan_ly }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: trau
    options:
      - id: tiep_tuc_cham_giu
        text: Kiên trì gia cố rào chắn và đem cỏ non, nước uống đến làm quen mỗi ngày
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
        result:
          - Sau nhiều tuần lễ kiên nhẫn, con vật dần bớt hoảng sợ và quen với sự hiện diện của con người.
      - id: tha_con_vat
        text: Mở rào thả con vật về rừng để đỡ tốn thức ăn và công sức canh giữ
        effects:
          - { type: stress, value: -2 }
          - { type: skill_xp, skill: sinh_ton, value: 6 }
        result:
          - Bạn giảm được gánh nặng chăm sóc hằng ngày nhưng bỏ dở cuộc thử nghiệm thuần dưỡng.
      - id: nho_nguoi_co_kinh_nghiem_quan_sat
        text: Mời người am hiểu tập tính thú rừng đến quan sát và điều chỉnh chỗ nhốt
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
        result:
          - Bạn hiểu ra con vật hoảng loạn vì chỗ nhốt quá hẹp và ồn ào, từ đó biết cách làm chuồng thoáng hơn.
      - id: dung_thit_ngay_truoc_khi_no_gay_chin
        text: Làm thịt con vật để bổ sung bữa ăn ngay cho gia đình thay vì giữ lâu
        effects:
          - { type: food, value: 3, ledger: su_kien }
        result:
          - Gia đình có một bữa thịt tươi no nê nhưng không còn cơ hội gây dựng đàn vật nuôi.

  # 16. Lời nghi ngờ
  - id: nt_m14_thn_16_loi_nghi_ngo
    title: Lời xì xào về phần thức ăn
    text:
      - Một số người trong nhóm cho rằng bạn đã lén giữ lại nhiều thức ăn hơn phần được chia chung sau chuyến đi vừa rồi.
    tags: [quan_he, cong_dong, danh_tieng]
    life_stages: [thanh_nien, lap_nghiep]
    condition: { var: player.age, op: '<=', value: 30 }
    cooldown_years: 6
    weight: 3
    importance: 5
    icon: canh_bao
    options:
      - id: giai_thich_truoc_nhom
        text: Đứng ra giải thích rõ ràng trước bếp lửa chung và mở túi dự trữ cho mọi người xem
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, value: 3 }
          - { type: stress, value: 3 }
        result:
          - Sự minh bạch của bạn xóa tan phần lớn hiểu lầm dù cuộc tranh luận làm không khí căng thẳng một lúc.
      - id: nho_nguoi_chung_kien_xac_nhan
        text: Nhờ người bạn đi cùng chuyến kiếm ăn hôm đó đứng ra làm chứng cho mình
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 12 }
          - { type: reputation, value: 4 }
        result:
          - Lời xác nhận khách quan của người đi cùng khiến những kẻ nghi ngờ phải im lặng.
      - id: im_lang
        text: Giữ im lặng và tập trung làm việc vì không muốn đôi co ồn ào
        effects:
          - { type: reputation, value: -4 }
          - { type: stress, value: 5 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
        result:
          - Bạn tránh được cuộc cãi vã trực diện nhưng ánh mắt dè chừng của vài người vẫn đeo bám suốt mùa.
      - id: chu_dong_gop_them_phan_kiem_duoc_vao_bep_chung
        text: Đi kiếm thêm một gùi thức ăn mới và đặt ngay ngắn ở bếp chung để chứng minh bằng hành động
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: health, value: -2 }
          - { type: reputation, value: 6 }
        result:
          - Hành động hào sảng của bạn khiến những lời đồn đoán tự khắc biến mất.

  # 17. Mái nhà riêng
  - id: nt_m14_thn_17_mai_nha_rieng
    title: Dựng nơi trú riêng
    text:
      - Bạn đã trưởng thành và có cơ hội xây dựng hoặc sử dụng một nơi trú riêng cho gia đình nhỏ của mình.
    tags: [gia_dinh, tai_san, xay_dung]
    life_stages: [thanh_nien, lap_nghiep]
    condition: { var: player.age, op: '<=', value: 30 }
    cooldown_years: 8
    weight: 4
    importance: 5
    icon: nha
    options:
      - id: tu_dung_noi_tru
        text: Tự tay chặt gỗ, chèn đá và lợp mái dựng một nơi trú riêng độc lập
        effects:
          - { type: health, value: -4 }
          - { type: money, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 16 }
          - { type: stress, value: -4 }
        result:
          - Dù mất nhiều ngày đổ mồ hôi, bạn tự hào khi có một không gian sinh hoạt riêng vững chãi.
      - id: tiep_tuc_song_cung_gia_dinh_lon
        text: Tiếp tục ở chung dưới mái che lớn của đại gia đình để tiết kiệm sức lực
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
        result:
          - Việc giữ lửa và trông trẻ được san sẻ dễ dàng, dù đôi lúc sinh hoạt chung khá chật chội.
      - id: hop_tac_dung_noi_tru_voi_nguoi_than
        text: Cùng anh chị em hoặc người thân dựng một khu lán ghép liền kề nhau
        effects:
          - { type: health, value: -2 }
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        result:
          - Nhờ làm chung nên công việc hoàn thành nhanh chóng, hai gia đình vừa có góc riêng vừa dễ hỗ trợ nhau.
      - id: cai_tao_hoc_da_hoac_nen_lan_cu
        text: Tận dụng nền đất và khung đá của một nơi trú cũ bị bỏ trống để sửa sang lại
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 12 }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
        result:
          - Bạn tiết kiệm được một nửa công sức tìm vật liệu mà vẫn có chỗ ở kín gió trước mùa mưa.

  # 18. Người trẻ muốn theo học
  - id: nt_m14_thn_18_nguoi_tre_muon_theo_hoc
    title: Thiếu niên xin theo học nghề
    text:
      - Một thiếu niên trong nhóm ngưỡng mộ tay nghề của bạn và ngỏ lời xin được đi theo học hỏi.
    tags: [hoc_hanh, nghe, quan_he]
    life_stages: [thanh_nien, lap_nghiep]
    condition: { var: player.age, op: '<=', value: 30 }
    cooldown_years: 5
    weight: 4
    importance: 4
    icon: sach
    options:
      - id: nhan_huong_dan
        text: Nhận lời chỉ dạy tận tình từ những thao tác cơ bản nhất
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: reputation, value: 5 }
        result:
          - Việc giảng giải cho người trẻ giúp chính bạn hệ thống lại kinh nghiệm của mình và được gia đình họ quý mến.
      - id: de_nguoi_ay_quan_sat_truoc
        text: Cho phép cậu thiếu niên đi theo phụ việc vặt và tự quan sát trước một thời gian
        effects:
          - { type: food, value: 1, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 12 }
        result:
          - Bạn không bị chậm tiến độ công việc riêng mà còn có thêm người phụ mang vác dụng cụ.
      - id: gioi_thieu_nguoi_day_khac
        text: Giới thiệu thiếu niên ấy đến học một người lớn tuổi có nhiều thời gian rảnh hơn
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        result:
          - Cậu thiếu niên tìm được người thầy phù hợp còn bạn giữ được sự tập trung cho công việc của mình.
      - id: giao_bai_thu_thach_kien_nhan
        text: Giao một việc chuẩn bị nguyên liệu đòi hỏi sự tỉ mỉ để thử lòng kiên nhẫn rồi mới truyền nghề
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 12 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: reputation, value: 3 }
        result:
          - Thấy người trẻ chịu khó hoàn thành thử thách không một lời than vãn, bạn yên tâm truyền dạy kỹ năng quý.

  # 19. Chuyến đi qua rừng
  - id: nt_m14_thn_19_chuyen_di_qua_rung
    title: Đoạn đường rừng nhiều dấu hiệu bất thường
    text:
      - Đoàn di chuyển của bạn gặp một đoạn đường rừng rậm có nhiều dấu chân thú dữ mới in và cành cây gãy bất thường.
    tags: [di_cu, nguy_hiem, sinh_ton]
    life_stages: [thanh_nien, lap_nghiep]
    condition: { var: player.age, op: '<=', value: 30 }
    cooldown_years: 5
    weight: 4
    importance: 5
    icon: rung
    options:
      - id: tiep_tuc_theo_duong_ngan
        text: Cầm chắc giáo mác và đi nhanh qua đoạn đường ngắn để kịp tới nơi trước hoàng hôn
        chance: { base: 0.55, skill: quan_su, per_level: 0.08 }
        success:
          - { type: skill_xp, skill: quan_su, value: 14 }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
        failure:
          - { type: health, value: -7 }
          - { type: stress, value: 6 }
        success_result:
          - Đoàn giữ đội hình chặt chẽ và vượt qua khu rừng an toàn trước khi trời sập tối.
        failure_result:
          - Một con thú dữ bất ngờ lao ra từ bụi rậm làm cả đoàn hoảng loạn và bạn bị trầy xước khi cản đường.
      - id: di_vong
        text: Chấp nhận đi đường vòng qua sườn đồi thoáng đãng hơn để tránh nguy hiểm
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: health, value: -2 }
          - { type: skill_xp, skill: sinh_ton, value: 12 }
        result:
          - Đoàn tốn thêm lương thực và mỏi chân hơn nhưng không ai gặp nguy hiểm.
      - id: dung_lai_quan_sat
        text: Cho đoàn dừng lại ở triền cao để quan sát hướng gió và lắng nghe động tĩnh
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: muu_luoc, value: 14 }
        result:
          - Bạn chờ đến khi con thú lớn đi khuất khỏi lối mòn rồi mới dẫn đoàn đi qua an toàn.
      - id: dot_bo_cui_kho_tao_khoi_xua_thu
        text: Đốt các bó đuốc lá ẩm tạo khói và gõ gậy gỗ tạo tiếng động lớn khi đi qua
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Mùi khói lửa và âm thanh dứt khoát khiến thú dữ ẩn nấp trong bụi rậm tự khắc tránh xa đoàn người.

  # 20. Bữa ăn sau cuộc săn
  - id: nt_m14_thn_20_bua_an_sau_cuoc_san
    title: Bất đồng khi chia thịt sau cuộc săn
    text:
      - Đoàn săn hạ được một con thú lớn nhưng bên bếp lửa bắt đầu nổ ra bất đồng về cách chia các phần thịt ngon.
    tags: [san_bat, cong_dong, ngoai_giao]
    life_stages: [thanh_nien, lap_nghiep]
    condition: { var: player.age, op: '<=', value: 30 }
    cooldown_years: 5
    weight: 4
    importance: 5
    icon: lua
    options:
      - id: de_nghi_chia_theo_tap_quan_quen_thuoc
        text: 'Đề nghị chia đúng theo tập quán cũ: người phóng mũi lao đầu tiên nhận phần thưởng, còn lại chia đều'
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: reputation, value: 2 }
        result:
          - Đa số thành viên gật đầu chấp thuận theo lệ cũ dù vài người phụ việc vẫn thoáng chút so bì.
      - id: de_nghi_uu_tien_nguoi_dang_thieu_thuc_an
        text: Đề xuất ưu tiên thêm phần thịt cho những gia đình có trẻ nhỏ và người bệnh đang thiếu ăn
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, value: 5 }
        result:
          - Dù một số thợ săn trẻ tranh luận, các bậc cao niên ủng hộ tấm lòng vì cộng đồng của bạn.
      - id: de_nguoi_co_uy_tin_giai_quyet
        text: Mời người lớn tuổi có uy tín nhất trong nhóm đứng ra cầm dao phân chia
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: stress, value: -2 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
        result:
          - Bạn không bị cuốn vào cuộc tranh cãi và mọi người đều phục tùng phán quyết của bậc trưởng bối.
      - id: nau_mot_phan_chung_ngay_tai_bep_lua_lon
        text: Đề nghị nướng và nấu ngay phần nội tạng cùng xương sườn tại bếp lửa chung cho cả nhóm cùng ăn mừng
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: stress, value: -5 }
          - { type: skill_xp, skill: muu_luoc, value: 12 }
          - { type: reputation, value: 4 }
        result:
