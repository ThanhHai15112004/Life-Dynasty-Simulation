        text: Đón đoàn khi họ trở về để xin học kỹ thuật ép tước lưỡi đá vỏ chai siêu mỏng
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
        result:
          - Bạn nắm được cách kiểm soát lực ép tinh tế trên chất liệu đá giòn và sắc bậc nhất thời đại.

  # 12. Người bạn trở về
