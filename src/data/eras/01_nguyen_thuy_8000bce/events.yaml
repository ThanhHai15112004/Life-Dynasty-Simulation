      - id: tan_dung_binh_nut_dung_do_kho
        text: Dùng dây sợi buộc cố định quanh thân chiếc bình nứt để đựng hạt khô thay vì đun nước
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Chiếc bình nứt vẫn phát huy tác dụng giữ hạt khô khỏi chuột bọ và gợi ý cách in hoa văn dây thừng trên gốm.

