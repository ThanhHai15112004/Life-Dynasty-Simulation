          - Hành trang tri thức bạn trao tặng giúp đứa cháu tự tin vượt qua chuyến đi và trở về trưởng thành hơn.
      - id: trao_tang_mui_lao_hoac_bua_ho_menh_cua_minh
        text: Trao tặng chiếc công cụ tốt nhất hoặc chuỗi hạt xương kỷ vật của đời mình để cháu mang theo
        effects:
          - { type: money, value: -1, ledger: su_kien }
          - { type: stress, value: -3 }
          - { type: reputation, value: 6 }
        result:
          - Món kỷ vật thiêng liêng gắn kết hai thế hệ, tiếp thêm dũng khí cho người trẻ trên suốt dặm trường.

  # 07. Nguồn thức ăn cũ
