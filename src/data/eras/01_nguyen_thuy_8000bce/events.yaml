          - { type: skill_xp, skill: muu_luoc, value: 10 }
          - { type: skill_xp, skill: quan_tri, value: 6 }
        result:
          - Cách xử trí vừa cẩn thận vừa tôn trọng tập thể giúp giữ trọn cả con mồi lẫn chiếc bẫy.

