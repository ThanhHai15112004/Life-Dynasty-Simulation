      - id: o_lai_dung_da_dia_phuong
        text: Ở lại khu cư trú và tiếp tục tận dụng nguồn đá lửa sẵn có tại địa phương
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: food, value: 1, ledger: su_kien }
        result:
          - Công việc hằng ngày của bạn được duy trì đều đặn dù không có nguyên liệu đá núi lửa mới.
