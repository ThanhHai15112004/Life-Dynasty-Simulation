  # ══════════════════ 7 TÌNH HUỐNG CHĂM SÓC CỘNG ĐỒNG (MỤC 9) ══════════════════
  # Chăm sóc 01: Gia đình phân chia công việc để một người ở lại chăm người bị thương
  - id: nt_ev_cs_01_phan_cong_cham_nguoi_bi_thuong
    title: Cắt cử người ở lại bên bếp lửa
    text:
      - Một thành viên trong nhà bị thương nặng chưa thể đi lại, trong khi mùa thu hái và săn bắt đang vào lúc khẩn trương.
      - Gia đình phải bàn cách phân chia công việc để vừa có người ở lại chăm sóc vừa không đứt bữa.
    tags: [benh_tat, gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
