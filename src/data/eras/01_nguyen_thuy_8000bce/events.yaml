          - { type: skill_xp, skill: ngoai_giao, value: 6 }
        success_result:
          - Người ấy mỉm cười đáp lại tình cảm của bạn, những chuyến đi rừng trở nên ấm áp hơn bao giờ hết.
        failure_result:
          - Người ấy còn ngại ngùng từ chối khiến bạn buồn mất ít ngày, nhưng hai người vẫn giữ sự tôn trọng.
