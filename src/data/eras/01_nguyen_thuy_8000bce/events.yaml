      - id: dan_nguoi_tre_den_xem_dau_vet_ranh_gioi_cu
        text: Chỉ cho người trẻ những mốc đá ranh giới và quy ước hòa ước từng được lập sau cuộc xung đột ấy
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
