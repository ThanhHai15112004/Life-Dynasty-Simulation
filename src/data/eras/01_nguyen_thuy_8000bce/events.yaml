        result:
          - Người lớn dùng khói cỏ khô lấy được một ít mật rừng ngọt lịm chia cho cả nhóm.

  # Làm hỏng công cụ của người thân
  - id: nt_ev_08c_lam_hong_cong_cu_nguoi_than
    title: Làm mẻ lưỡi đá của người thân
    text:
