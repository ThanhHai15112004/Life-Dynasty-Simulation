        effects:
          - { type: money, value: -1, ledger: su_kien }
          - { type: health, value: 6, who: household }
          - { type: skill_xp, skill: hoc_van, value: 10 }
        result:
          - Những nắm lá thuốc đúng bệnh giúp người thân của bạn nhanh chóng cắt cơn sốt và lại sức.

