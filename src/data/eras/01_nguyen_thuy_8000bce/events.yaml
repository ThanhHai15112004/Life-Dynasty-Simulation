          - { type: reputation, value: 5 }
        result:
          - Bạn không bị mất sức lao động nặng mà vẫn đóng góp phần quan trọng giúp công trình sớm hoàn thiện.
      - id: khong_tham_gia
        text: Cáo bận để tập trung lo việc kiếm ăn và dự trữ riêng của gia đình
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: reputation, value: -4 }
        result:
          - Gia đình bạn bảo toàn được nguồn lực riêng nhưng khó tránh khỏi ánh mắt lạnh nhạt từ hàng xóm.
      - id: nhan_vai_tro_do_dac_va_dieu_phoi_viec_xay_dung
        text: Dùng kinh nghiệm của mình để đo đạc nền móng, chọn đá chịu lực và phân công từng tổ thợ
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: reputation, value: 6 }
        result:
          - Nhờ sự chỉ huy khoa học của bạn, bức tường đá được xếp khít vững chãi và tiết kiệm rất nhiều công sức.

  # 23. Người kế tục
  - id: nt_m14_trn_23_nguoi_ke_tuc
    title: Người trẻ muốn tiếp nhận vai trò của bạn
    text:
      - Một người trẻ có năng lực trong nhóm bày tỏ mong muốn tiếp nhận vai trò chủ chốt mà bạn đang đảm nhiệm bấy lâu nay.
    tags: [nghe, cong_dong, moc_doi]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: moc_doi
    options:
      - id: chu_dong_truyen_lai
        text: Vui vẻ truyền giao trách nhiệm và lui về làm người hướng dẫn phía sau
        effects:
          - { type: stress, value: -5 }
          - { type: reputation, value: 6 }
          - { type: skill_xp, skill: hoc_van, value: 12 }
        result:
          - Sự nhường bước đúng lúc của bạn khiến người trẻ hết lòng kính trọng và bạn có thêm thời gian nghỉ ngơi.
      - id: tiep_tuc_giu_vai_tro
        text: Khẳng định mình vẫn còn đủ sức khỏe và kinh nghiệm để tiếp tục gánh vác công việc
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: reputation, value: 2 }
          - { type: stress, value: 4 }
        result:
          - Bạn giữ vững vị trí của mình trong nhóm dù người trẻ không giấu được vẻ sốt ruột, thất vọng.
      - id: cung_chia_se_cong_viec
        text: Đề nghị người trẻ làm phó trợ lý, cùng gánh vác công việc để chuyển giao từng bước
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
          - { type: stress, value: -2 }
        result:
          - Hai thế hệ bổ trợ cho nhau nhịp nhàng, vừa giữ được sự ổn định vừa chuẩn bị vững vàng cho tương lai.
      - id: giao_mot_nhiem_vu_kho_de_kiem_chung_ban_linh
        text: Giao cho người trẻ tự chủ trì một đợt công việc mùa tới để chứng minh năng lực trước cả nhóm
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: muu_luoc, value: 14 }
          - { type: reputation, value: 5 }
        result:
          - Thử thách công tâm của bạn giúp người trẻ rèn giũa bản lĩnh thực sự và khiến mọi người trong nhóm đều tâm phục.

