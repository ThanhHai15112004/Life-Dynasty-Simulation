          - Gia đình bạn đủ ăn qua ngày nhưng ánh mắt trách móc của các lán xung quanh khiến không khí nặng nề.
      - id: huong_dan_che_bien_thuc_pham_du_phong
        text: Chỉ dẫn mọi người cách ngâm kỹ các loại hạt đắng và rễ cây già để ăn thay lương thực chính
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: reputation, value: 4 }
        result:
          - Tri thức tích lũy nhiều năm của bạn giúp cả nhóm tận dụng được nguồn thực vật rừng mà không bị ngộ độc.

  # 02. Người con muốn rời đi
  - id: nt_m14_trn_02_nguoi_con_muon_roi_di
    title: Người trẻ muốn theo đoàn đi xa
    text:
      - Một người trẻ do bạn chăm sóc từ nhỏ nay đã cứng cáp và ngỏ ý muốn theo một nhóm khác đến sinh sống ở vùng đất xa.
    tags: [gia_dinh, di_cu, quan_he]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: gia_dinh
    options:
      - id: ung_ho
        text: Ủng hộ quyết định của con và chuẩn bị hành trang, công cụ tốt cho chuyến đi
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: stress, value: 2 }
          - { type: reputation, value: 4 }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
        result:
          - Dù lòng trống trải khi nhìn bóng người trẻ khuất dần sau rặng đồi, bạn giữ trọn được sự kính trọng và yêu thương.
      - id: khuyen_o_lai
        text: Khuyên nhủ và giữ người trẻ ở lại để tiếp tục phụ giúp gia đình
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: stress, value: 5 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
        result:
          - Người trẻ miễn cưỡng ở lại làm việc cùng gia đình nhưng thường ngồi trầm ngâm nhìn về phía chân trời xa.
      - id: de_nghi_cung_di_tim_hieu_noi_moi_truoc
        text: Đề nghị cùng đi một chuyến ngắn ngày tới nơi mới để xem xét điều kiện sống trước khi quyết định
        effects:
          - { type: health, value: -3 }
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: stress, value: -2 }
        result:
          - Chuyến đi chung giúp bạn yên tâm về nơi ở mới của con và gắn kết sâu sắc thêm tình cảm hai thế hệ.
      - id: gui_gam_cho_nguoi_quen_trong_nhom_di_cung
        text: Tìm gặp người dẫn đoàn của nhóm kia để gửi gắm và kết nghĩa thông gia, bạn hữu
        effects:
          - { type: money, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: thuong_mai, value: 10 }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
        result:
          - Nhờ sự chu đáo của bạn, người trẻ được nhóm mới đón nhận chu toàn và thường xuyên gửi tin tức về.

  # 03. Người bạn cũ gặp nạn
  - id: nt_m14_trn_03_nguoi_ban_cu_gap_nan
    title: Người bạn thuở hàn vi gặp nạn
    text:
      - Một người bạn từng cưu mang, giúp đỡ bạn khi còn trẻ nay bị thương nặng và không còn khả năng tự kiếm ăn.
    tags: [quan_he, cham_soc, dao_duc]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: thuoc
    options:
      - id: truc_tiep_cham_soc
        text: Đón bạn về gần lán hoặc trực tiếp mang thức ăn, thuốc lá sang chăm sóc mỗi ngày
        effects:
          - { type: food, value: -3, ledger: su_kien }
          - { type: reputation, value: 7 }
          - { type: stress, value: -3 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
        result:
          - Bạn trả trọn ân nghĩa năm xưa; cả cộng đồng đều lấy tấm gương trọng tình của bạn để dạy bảo con cháu.
      - id: keu_goi_cong_dong_ho_tro
        text: Đứng ra vận động các gia đình trong nhóm thay phiên nhau góp củi và thức ăn giúp người bạn
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, value: 4 }
        result:
          - Nhiều người cảm thông và cùng chung tay đỡ đần, giúp gánh nặng không đè lên riêng một gia đình nào.
      - id: chi_giup_trong_kha_nang_hien_tai
        text: Chỉ biếu một ít thức ăn trong khả năng dư dả để không ảnh hưởng đến việc riêng của nhà mình
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: stress, value: 2 }
        result:
          - Gia đình bạn giữ được nhịp sống ổn định nhưng người bạn cũ vẫn phải chật vật xoay xở từng bữa.
      - id: mang_nguyen_lieu_den_nho_ban_lam_viec_nhe_doi_thuc_an
        text: Đem sợi cây và gỗ nhỏ đến nhờ bạn đan lát tại chỗ rồi đổi thức ăn để họ không mặc cảm
        effects:
          - { type: money, value: 1, ledger: su_kien }
          - { type: skill_xp, skill: muu_luoc, value: 12 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
          - { type: reputation, value: 5 }
        result:
          - Cách giúp đỡ tinh tế của bạn khiến người bạn cũ giữ được lòng tự trọng và vẫn thấy mình có ích cho nhóm.

  # 04. Tranh chấp chỗ ở
  - id: nt_m14_trn_04_tranh_chap_cho_o
    title: Tranh chấp nền đất dựng lán
    text:
      - Hai gia đình trong khu cư trú bất đồng gay gắt về quyền sử dụng một khoảnh đất cao ráo, kín gió gần nguồn nước.
    tags: [xung_dot, cong_dong, ngoai_giao]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 5
    weight: 4
    importance: 5
    icon: nha
    options:
      - id: dung_ra_hoa_giai
        text: Đứng ra phân giải và đề nghị chia đôi khoảnh đất hoặc luân phiên quyền lợi
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 16 }
          - { type: reputation, value: 5 }
          - { type: stress, value: 2 }
        result:
          - Dù một bên còn hơi ấm ức, uy tín tuổi trung niên của bạn giúp dập tắt cuộc cãi vã trước khi thành ẩu đả.
      - id: ung_ho_gia_dinh_than_thiet
        text: Lên tiếng bênh vực gia đình có quan hệ thân thiết với nhà mình
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
          - { type: reputation, value: -2 }
          - { type: stress, value: 4 }
        result:
          - Gia đình thân thiết giữ được mảnh đất tốt nhưng phía bên kia mang lòng oán giận bạn ra mặt.
      - id: khong_tham_gia
        text: Giữ thái độ trung lập và không can dự vào chuyện riêng của hai nhà
        effects:
          - { type: stress, value: -2 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
        result:
          - Bạn không làm mất lòng ai nhưng tiếng cãi cọ âm ỉ nhiều tuần làm xáo trộn sinh hoạt chung.
      - id: cung_moi_nguoi_san_phang_them_nen_dat_ke_ben
        text: Kêu gọi thanh niên dùng cuốc đá và cọc gỗ san phẳng thêm khoảnh sườn đồi kế bên để đủ chỗ cho cả hai
        effects:
          - { type: health, value: -2 }
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: reputation, value: 6 }
        result:
          - Giải pháp thiết thực của bạn mở rộng không gian cư trú, khiến cả hai gia đình đều tâm phục khẩu phục.

  # 05. Một người học trò thất bại
  - id: nt_m14_trn_05_mot_nguoi_hoc_tro_that_bai
    title: Người học trò liên tục làm hỏng công cụ
    text:
      - Người trẻ mà bạn nhận hướng dẫn liên tục ghè vỡ đá và làm gãy cán công cụ, khiến nguyên liệu hao hụt đáng kể.
    tags: [hoc_hanh, nghe, che_tac]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 5
    weight: 4
    importance: 4
    icon: baki
    options:
      - id: kien_nhan_day_lai
        text: Kiên nhẫn cầm tay chỉ lại từng góc ghè và nhịp lực cho đến khi họ làm được
        effects:
          - { type: money, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 16 }
          - { type: reputation, value: 4 }
        result:
          - Sự bao dung của bạn giúp người học trò vượt qua nỗi sợ thất bại và dần tạo ra được lưỡi đá hoàn chỉnh.
      - id: doi_sang_viec_don_gian_hon
        text: Chuyển họ sang làm các khâu sơ chế nguyên liệu và mài nhẵn đơn giản hơn
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: food, value: 1, ledger: su_kien }
        result:
          - Nguyên liệu không còn bị hỏng lãng phí và người học trò hoàn thành tốt phần việc phụ trợ.
      - id: gioi_thieu_nghe_khac
        text: Khuyên họ chuyển sang học đi săn hoặc thu hái phù hợp với thể chất hơn
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: stress, value: -1 }
        result:
          - Dù thoáng buồn vì không theo được nghề của bạn, người trẻ sớm tìm thấy niềm vui ở công việc ngoài trời.
      - id: cho_tap_tren_da_thuong_truoc_khi_dung_da_tot
        text: Yêu cầu học trò tập ghè trên những viên cuội suối phổ biến trước khi chạm vào lõi đá lửa quý
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 12 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
        result:
          - Cách rèn luyện từng bước giúp tiết kiệm nguyên liệu quý mà vẫn giữ được nhiệt huyết cho người học.

  # 06. Chỗ trú bắt đầu xuống cấp
  - id: nt_m14_trn_06_cho_tru_bat_dau_xuong_cap
    title: Mái trú dột nát sau nhiều năm
    text:
      - Nơi gia đình bạn sinh sống suốt nhiều năm qua đã mục cọc gỗ và dột mái lá, không còn che mưa chắn gió tốt như trước.
    tags: [gia_dinh, tai_san, xay_dung]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: nha
    options:
      - id: sua_chua_ngay
        text: Tạm gác việc đi kiếm ăn vài ngày để tự mình thay cọc gỗ và lợp lại mái mới
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: health, value: -2 }
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: stress, value: -3 }
        result:
          - Mái lán được gia cố vững chắc trước mùa mưa, cả gia đình ngủ ngon giấc bên bếp lửa khô ráo.
      - id: nho_nhieu_nguoi_cung_sua
        text: Nấu một bữa ăn ấm cúng nhờ hàng xóm và người thân sang hợp sức sửa nhà trong một ngày
        effects:
          - { type: food, value: -3, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, value: 3 }
        result:
          - Nhờ đông tay vỗ nên kêu, nơi trú được sửa sang khang trang chỉ trong một buổi chiều rộn tiếng cười nói.
      - id: cho_qua_mua_ban_ron
        text: Chỉ chằng buộc tạm bợ để ưu tiên toàn bộ thời gian cho mùa kiếm ăn đang rộ
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: health, value: -4, who: household }
          - { type: stress, value: 4 }
        result:
          - Bạn thu hoạch được nhiều thức ăn nhưng những đêm mưa tạt gió lùa khiến người trong nhà dễ nhiễm lạnh.
      - id: nang_cap_nen_dat_va_vach_chan_bang_da_bun
        text: Nhân dịp này kè thêm chân đá và trát đất sét pha cỏ khô để nơi trú bền vững lâu dài
        effects:
          - { type: money, value: -1, ledger: su_kien }
          - { type: health, value: -3 }
          - { type: skill_xp, skill: quan_tri, value: 16 }
          - { type: reputation, value: 4 }
        result:
          - Nơi trú của gia đình bạn trở nên kiên cố và ấm áp bậc nhất trong khu cư trú.

  # 07. Nguồn nước của hai nhóm
  - id: nt_m14_trn_07_nguon_nuoc_cua_hai_nhom
    title: Nhóm láng giềng xin dùng chung nguồn nước
    text:
      - Một nhóm cư trú láng giềng cử người lớn tuổi sang đề nghị được sử dụng chung con suối mà cộng đồng bạn thường khai thác.
    tags: [ngoai_giao, cong_dong, thien_nhien]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: nuoc
    options:
      - id: dong_y_chia_se_co_thoa_thuan
        text: Ủng hộ việc chia sẻ nguồn nước kèm quy ước rõ ràng về điểm múc nước uống và điểm giặt rửa
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 16 }
          - { type: skill_xp, skill: quan_tri, value: 10 }
          - { type: reputation, value: 5 }
        result:
          - Quy ước phân khúc dòng suối giúp nước luôn sạch sẽ và hai nhóm giữ được tình hòa hiếu bền lâu.
      - id: tu_choi
        text: Kiên quyết từ chối vì lo ngại nguồn nước và cá suối không đủ cho cả hai nhóm
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: stress, value: 4 }
          - { type: skill_xp, skill: quan_su, value: 10 }
        result:
          - Cộng đồng bạn giữ độc quyền dòng suối nhưng phải thường xuyên cắt cử người canh chừng xung đột.
      - id: cung_tim_them_nguon_nuoc
        text: Đề nghị cử người dẫn nhóm bạn đi khảo sát nhánh suối phía thượng nguồn để mở điểm lấy nước mới
        effects:
          - { type: health, value: -2 }
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        result:
          - Chuyến khảo sát chung tìm được một hốc nước trong vắt, giải quyết êm thấm nỗi lo thiếu nước.
      - id: doi_quyen_dung_nuoc_lay_san_vat_theo_mua
        text: Thỏa thuận cho họ dùng nước đổi lại việc chia sẻ một phần đá sắc hoặc sản vật săn bắt mỗi mùa
        effects:
          - { type: money, value: 2, ledger: su_kien }
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: thuong_mai, value: 16 }
        result:
          - Thỏa thuận trao đổi mang lại nguồn lợi thiết thực cho cả khu cư trú của bạn.

  # 08. Sức khỏe suy giảm
  - id: nt_m14_trn_08_suc_khoe_suy_giam
    title: Những cơn đau mỏi tuổi trung niên
    text:
      - Bạn nhận ra những chuyến đi săn và kiếm ăn dài ngày bắt đầu khiến lưng và khớp gối đau nhức lâu khỏi hơn trước.
    tags: [suc_khoe, nghe, moc_doi]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 6
    weight: 4
    importance: 5
    icon: suc_khoe
    options:
      - id: giam_cong_viec_nang
        text: Chủ động giảm bớt các chuyến đi xa nặng nhọc để bảo toàn sức khỏe lâu dài
        effects:
          - { type: health, value: 4 }
          - { type: food, value: -1, ledger: su_kien }
          - { type: stress, value: -3 }
        result:
          - Cơ thể bạn đỡ hẳn những cơn đau buốt về đêm dù lượng thức ăn tự tay kiếm được có giảm đi đôi chút.
      - id: tiep_tuc_nhu_cu
        text: Cố gắng duy trì cường độ lao động như thời thanh niên để làm gương cho con cháu
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: health, value: -6 }
          - { type: reputation, value: 3 }
          - { type: stress, value: 4 }
        result:
          - Bạn vẫn mang về nhiều thức ăn cho gia đình nhưng cơ thể ngày càng mỏi mệt sau mỗi mùa mưa.
      - id: hoc_them_nghe_gan_noi_tru
        text: Chuyển dần sang chế tác công cụ, đan lát và bảo quản thức ăn tại nơi cư trú
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: money, value: 1, ledger: su_kien }
        result:
          - Công việc tĩnh tại gần bếp lửa giúp bạn giữ gìn sức lực mà vẫn tạo ra nhiều sản vật giá trị.
      - id: chuyen_sang_chi_huy_va_truyen_day_lop_tre
        text: Nhường việc chạy đuổi nặng nhọc cho lớp trẻ, còn mình đảm nhận việc chọn hướng và chỉ huy
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 14 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: reputation, value: 4 }
        result:
          - Sự từng trải của bạn kết hợp với sức vóc của thanh niên giúp các chuyến đi đạt hiệu quả cao mà bạn không bị quá sức.

  # 09. Người trẻ phản đối
  - id: nt_m14_trn_09_nguoi_tre_phan_doi
    title: Người trẻ muốn đổi cách săn bắt
    text:
      - Một thợ săn trẻ đầy nhiệt huyết đề nghị thay đổi phương pháp vây bắt mà bạn và thế hệ trước đã sử dụng suốt nhiều năm.
    tags: [san_bat, cong_dong, hoc_hanh]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 5
    weight: 4
    importance: 4
    icon: kiem
    options:
      - id: cho_phep_thu_o_quy_mo_nho
        text: Cho phép nhóm trẻ thử nghiệm cách vây mới ở một bãi săn nhỏ để kiểm chứng
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: reputation, value: 4 }
        result:
          - Cách ứng xử cởi mở của bạn vừa khích lệ được lớp trẻ vừa giữ an toàn cho nguồn lương thực chính.
      - id: bac_bo
        text: Bác bỏ ý kiến vì không muốn mạo hiểm sinh mạng và bữa ăn của cả nhóm
        effects:
          - { type: food, value: 1, ledger: su_kien }
          - { type: skill_xp, skill: quan_su, value: 10 }
          - { type: stress, value: 2 }
        result:
          - Chuyến săn diễn ra an toàn theo lối cũ nhưng những người trẻ tỏ ra kém hào hứng.
      - id: cung_thu_nghiem
        text: Trực tiếp cùng người trẻ bàn bạc, kết hợp kinh nghiệm cũ của bạn vào ý tưởng mới của họ
        effects:
          - { type: food, value: 4, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: skill_xp, skill: quan_su, value: 12 }
          - { type: reputation, value: 5 }
        result:
          - Sự dung hợp giữa kinh nghiệm và sáng tạo mang lại một chuyến săn thắng lợi vang dội.
      - id: dung_nhanh_cay_ve_so_do_tren_cat_de_phan_tich
        text: Dùng nhánh cây vẽ địa hình trên nền đất để phân tích ưu nhược điểm từng cách trước cả đoàn
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 16 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        result:
          - Người trẻ nhận ra lỗ hổng trong kế hoạch của mình và tâm phục khẩu phục tầm nhìn của bạn.

  # 10. Một người thân rời cộng đồng
  - id: nt_m14_trn_10_mot_nguoi_than_roi_cong_dong
    title: Người gắn bó lâu năm chuyển đi
    text:
      - Một người thân thiết đã sát cánh bên bạn suốt nhiều năm quyết định chuyển tới sinh sống ở một khu cư trú khác.
    tags: [gia_dinh, quan_he, di_cu]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.age, op: 'between', value: [31, 50] }
    cooldown_years: 6
    weight: 3
    importance: 5
    icon: gia_dinh
    options:
      - id: di_theo
        text: Thu xếp gia đình cùng chuyển tới nơi ở mới để không phải chia lìa
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: stress, value: -2 }
        result:
          - Dù phải làm quen lại từ đầu ở vùng đất mới, đại gia đình của bạn vẫn luôn quây quần bên nhau.
      - id: o_lai
        text: Ở lại giữ gìn nơi trú và cơ nghiệp đã gây dựng suốt nửa đời người
