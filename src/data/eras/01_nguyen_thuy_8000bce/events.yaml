      - id: lam_do_thu_cong_ngay_tai_noi_tru
        text: Đem đá, gỗ và sợi về chế tác ngay bên hiên lán để vừa làm việc vừa trông chừng gia đình
        effects:
          - { type: money, value: 1, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: stress, value: -2 }
        result:
          - Bạn khéo léo dung hòa cả hai nhu cầu, vừa tạo ra vật dụng đổi thức ăn vừa luôn có mặt khi người thân cần.

  # 11. Chuyến đi tìm obsidian [Tây Á]
  - id: nt_m14_thn_11_chuyen_di_tim_obsidian
    title: Chuyến đi tìm đá vỏ chai (Obsidian)
    text:
      - Một nhóm chuẩn bị hành trình tới vùng núi lửa xa xôi để tiếp cận nguồn đá vỏ chai (obsidian) sắc bén và muốn bạn tham gia.
