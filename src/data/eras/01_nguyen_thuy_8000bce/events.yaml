        result:
          - Những món đồ kỷ niệm vẫn nằm nguyên bên chỗ ngủ của bạn như những người bạn già trung thành.
      - id: cung_nguoi_tre_che_tac_mot_bo_moi_giong_het
        text: Đưa bộ công cụ của mình làm mẫu và hướng dẫn họ tự tay chế tác một bộ mới tương tự
        effects:
          - { type: skill_xp, skill: hoc_van, value: 16 }
          - { type: reputation, value: 6 }
        result:
