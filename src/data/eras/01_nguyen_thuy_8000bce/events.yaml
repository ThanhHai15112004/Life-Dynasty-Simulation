          - { type: food, value: 4, ledger: su_kien }
          - { type: health, value: -5 }
          - { type: reputation, value: 6 }
        result:
          - Bạn dẫn đoàn tới tận bãi cây cổ thụ không sai một bước, dù lúc về phải nhờ con cháu dìu qua dốc.
      - id: khong_de_xuat
        text: Giữ lại trong lòng vì sợ sau bao nhiêu năm địa hình đã đổi khác khiến lớp trẻ mất công
        effects:
          - { type: stress, value: -1 }
        result:
          - Bạn tránh được rủi ro làm đoàn đi lạc, dù đôi lúc vẫn tự hỏi liệu thung lũng xưa có còn trù phú.
      - id: ve_ban_do_tren_dat_set_hoac_vo_cay
        text: Khắc sơ đồ đường đi lên mảnh vỏ cây hoặc đất sét khô để người trẻ cầm theo đối chiếu
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: muu_luoc, value: 14 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
        result:
          - Những ký hiệu trực quan bạn vạch ra giúp đoàn đi không bị lạc và lưu giữ lại đường đi cho nhiều đời sau.

  # 08. Người từng gây thù oán
  - id: nt_m14_ln_08_nguoi_tung_gay_thu_oan
    title: Cuộc gặp với người từng bất hòa năm xưa
    text:
      - Một người từng có mâu thuẫn sâu sắc với bạn từ nhiều năm trước nay tóc cũng đã bạc và chủ động tìm đến muốn nói chuyện.
