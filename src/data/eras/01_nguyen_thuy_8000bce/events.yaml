    title: Người bạn thuở thiếu thời lâm bệnh nặng
    text:
      - Người bạn cuối cùng từng đồng hành với bạn từ thời thơ ấu nay đang nằm bệnh nặng và yếu dần theo từng ngày.
    tags: [quan_he, cham_soc, tuoi_gia]
    life_stages: [trung_nien, tuoi_gia]
    condition: { var: player.age, op: '>=', value: 51 }
    cooldown_years: 7
    weight: 4
    importance: 6
    icon: tang
    options:
