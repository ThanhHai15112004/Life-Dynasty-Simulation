  # 12. Nguồn nước xa dần
  - id: nt_m14_tn_12_nguon_nuoc_xa_dan
    title: Nguồn nước xa dần
    text:
      - Khe suối gần trại cạn trơ đáy, cả nhóm phải đi xa hơn rất nhiều để lấy nước trong mùa khô.
    tags: [thien_nhien, sinh_ton, lang_xa]
    life_stages: [thieu_thoi]
