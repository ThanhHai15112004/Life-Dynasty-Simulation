events:
  # ══════════════════ TUỔI THƠ (0–11) — MỤC 11.B (01–08) ══════════════════
  # 01. Mùa lạnh đầu tiên
  - id: nt_ev_01_mua_lanh_dau_tien
    title: Mùa lạnh đầu tiên
    text:
      - Gió lạnh kéo dài qua nhiều ngày, củi khô quanh khu cư trú trở nên khó tìm hơn.
      - Người chăm sóc phải dành nhiều thời gian giữ cho nơi ngủ ấm hơn, trong khi nguồn dự trữ vơi dần.
    tags: [thien_nhien, gia_dinh, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
    cooldown_years: 6
    importance: 5
    icon: mua
    options:
      - id: nho_nguoi_than_giup
        text: Dựa vào sự giúp đỡ của những hộ thân thuộc quanh bếp lửa chung
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: stress, value: -3 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
        result:
          - Nhờ sự đùm bọc của các gia đình quanh bếp lửa, cả nhà vượt qua đợt giá lạnh đầu tiên bình an.
      - id: phu_tim_cui_che_chan
        text: Đi nhặt cành khô và phụ người lớn chèn lại vách chắn gió
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: health, value: -2 }
        result:
          - Bàn tay tê cóng vì gió lạnh, nhưng bạn học được cách tìm củi khô trong hốc đá và che chắn nơi ngủ.
      - id: lot_them_co_kho_va_la_day_cho_nam
        text: Gom cỏ khô và lá dày trải thêm dưới chỗ ngủ để giữ hơi ấm từ nền đất
        effects:
          - { type: skill_xp, skill: quan_tri, value: 10 }
          - { type: health, value: 2 }
        result:
          - Lớp cỏ khô êm ái giúp cả nhà đỡ bị hơi lạnh từ đất thấm vào lưng suốt đêm dài.
      - id: nung_da_cuoi_ben_bep_lua_de_suoi
        text: Phụ người lớn xếp đá cuội quanh bếp lửa để giữ nhiệt lâu hơn khi củi vơi
        effects:
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: stress, value: -2 }
        result:
          - Những viên đá nóng tỏa hơi ấm dịu dàng suốt đêm giúp tiết kiệm được nhiều củi khô.

  # 02. Đêm mất lửa
  - id: nt_ev_02_dem_mat_lua
    title: Đêm mất lửa
    text:
      - Bếp lửa của gia đình tắt ngấm sau một trận mưa lớn bất ngờ.
      - Người lớn loay hoay tìm bùi nhùi khô để tạo lại lửa hoặc sang xin than hồng từ nơi trú láng giềng.
    tags: [gia_dinh, lang_xa, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
    cooldown_years: 6
    importance: 5
    icon: nha
    options:
      - id: sang_xin_than_hong
        text: Theo người lớn sang xin than hồng từ gia đình láng giềng
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: stress, value: -2 }
        result:
          - Bạn tận mắt chứng kiến tầm quan trọng của việc duy trì quan hệ tốt với những người sống quanh mình.
      - id: giu_vat_lieu_kho
        text: Lục tìm phần vỏ cây và bùi nhùi được cất sâu dưới mái che
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: skill_xp, skill: quan_tri, value: 6 }
        result:
          - Ngọn lửa bùng lên trở lại từ nắm bùi nhùi khô, dạy bạn bài học nhớ đời về việc giữ vật liệu nhóm lửa.
      - id: bo_tro_tim_dom_lua_con_am_i
        text: Kiên nhẫn bới lớp tro dày dưới đáy bếp để tìm hòn than nhỏ còn âm ỉ
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
          - { type: skill_xp, skill: sinh_ton, value: 6 }
        result:
          - Sâu dưới lớp tro xám vẫn còn một đốm đỏ; bạn thổi nhẹ cùng xơ cây khô làm ngọn lửa sống lại.
      - id: quan_sat_nguoi_lon_ma_sat_go_hoac_da_lua
        text: Ngồi sát bên phụ giữ thanh gỗ khô để người lớn xoay que tạo lửa mới
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
        result:
          - Bạn học được cách chọn gỗ mềm làm đế và gỗ cứng làm mũi xoay để tạo ra tia lửa giữa đêm ẩm.

  # 03. Một quả lạ trong rừng
  - id: nt_ev_03_qua_la_trong_rung
    title: Một quả lạ trong rừng
    text:
      - Trong lúc đi theo người lớn, bạn nhìn thấy một chùm quả có màu sắc bắt mắt chưa từng ăn bao giờ.
      - Người chăm sóc từng nghiêm giọng cảnh báo không được tự ý thử những loại quả và nấm chưa biết rõ.
    tags: [hai_luom, thien_nhien, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_thu_hai, nt_nguoi_cham_soc, nt_nguoi_bao_quan_thuc_an] }
        factor: 1.3
    cooldown_years: 6
    importance: 4
    icon: la
    options:
      - id: mang_ve_hoi_nguoi_lon
        text: Hái một cành nhỏ mang về hỏi người dạy dỗ trước khi đụng vào
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: skill_xp, skill: hoc_van, value: 8 }
        result:
          - Người lớn khen bạn biết thận trọng và chỉ rõ dấu hiệu trên lá để phân biệt cây độc với cây ăn được.
      - id: len_nem_thu
        text: Tò mò nếm thử một miếng nhỏ xem vị thế nào
        chance: { base: 0.45, skill: sinh_ton, per_level: 0.05 }
        success:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: food, value: 2, ledger: su_kien }
        failure:
          - { type: health, value: -8 }
          - { type: stress, value: 5 }
        success_result:
          - May mắn đó là thứ quả rừng ăn được; bạn tìm thêm được một bụi quả mới cho gia đình.
        failure_result:
          - Vị chát đắng làm bạn đau bụng quặn thắt suốt đêm — từ đó bạn không bao giờ dám coi thường lời dặn của người đi trước.
      - id: quan_sat_chim_va_thu_nho_co_an_khong
        text: Đứng nấp sau gốc cây xem chim chóc hay sóc rừng có ăn loại quả đó không
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
          - { type: skill_xp, skill: sinh_ton, value: 6 }
        result:
          - Bạn học được thói quen quan sát muông thú trước khi chạm vào thức ăn lạ.
      - id: bo_qua_va_chi_hai_qua_quen_thuoc
        text: Lắc đầu bỏ qua và chỉ hái những loại quả quen thuộc đã được dặn
        effects:
          - { type: food, value: 1, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Bạn giữ an toàn tuyệt đối cho bản thân và mang về giỏ quả rừng quen thuộc.

  # 04. Người bạn bị lạc
  - id: nt_ev_04_nguoi_ban_bi_lac
    title: Người bạn bị lạc
    text:
      - Sau một buổi chiều hái lượm gần bìa rừng, một đứa trẻ cùng lứa vẫn chưa trở về khi mặt trời sắp khuất.
      - Những người lớn vội vã cầm lao và đuốc tổ chức tìm kiếm trước khi bóng tối buông xuống.
    tags: [quan_he, thien_nhien, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_tim_duong, nt_nguoi_san_thu] }
        factor: 1.3
    cooldown_years: 8
    importance: 5
    icon: duong
    options:
      - id: chi_noi_nhin_thay_ban
        text: Cố nhớ lại nơi cuối cùng nhìn thấy bạn và chỉ hướng cho người lớn
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
          - { type: reputation, value: 2 }
        result:
          - Nhờ trí nhớ chính xác của bạn về gốc cây và khe suối, đoàn tìm kiếm đã đưa được người bạn về trước khi trời tối hẳn.
      - id: o_lai_giu_lua_bao_hieu
        text: Ở lại khu trú chất thêm củi cho ngọn lửa cháy cao làm dấu hiệu
        effects:
          - { type: skill_xp, skill: quan_tri, value: 8 }
          - { type: stress, value: -2 }
        result:
          - Ánh lửa bập bùng và làn khói giúp đoàn tìm kiếm định hướng quay về an toàn trong đêm sương.
      - id: dung_tieng_hu_quen_thuoc_goi_ban
        text: Đứng ở bìa rừng cất tiếng hú gọi quen thuộc của đám trẻ để bạn nhận ra hướng trại
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: reputation, value: 3 }
        result:
          - Tiếng gọi vang vọng qua vách đá giúp người bạn đang hoảng sợ nghe thấy và lần theo tiếng vọng trở về.
      - id: di_theo_nguoi_lon_soi_dau_chan_tren_bun
        text: Xin đi sát theo chân người lớn để phụ tìm chiếc giỏ rơi hoặc dấu chân nhỏ bên bờ suối
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
        result:
          - Bạn phát hiện những cành cây gãy bên bụi mâm xôi, giúp người lớn nhanh chóng tìm thấy bạn mình.

  # 05. Một con vật đi theo
  - id: nt_ev_05_con_vat_di_theo
    title: Một con vật đi theo
    text:
      - Một con chó đã quen sống quanh nhóm người thường xuất hiện gần nơi trú mỗi khi có mùi thịt nướng.
      - Bạn tìm cách tiếp cận và quan sát phản ứng của nó bên rìa bãi sinh hoạt.
    tags: [san_bat, thien_nhien, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_san_thu, nt_nguoi_cham_giu_dong_vat] }
        factor: 1.3
    cooldown_years: 8
    importance: 4
    icon: trang
    options:
      - id: chia_phan_xuong_thit
        text: Chia cho nó một mẩu xương và kiên nhẫn để nó quen hơi
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: stress, value: -4 }
        result:
          - Con vật dần quen tiếng bước chân bạn và thường sủa báo hiệu mỗi khi có động tĩnh lạ quanh nơi trú.
      - id: giu_khoang_cach_quan_sat
        text: Giữ khoảng cách an toàn, chỉ quan sát tập tính của nó như lời người lớn dặn
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
        result:
          - Bạn hiểu rằng động vật sống quanh nhóm tuy có ích nhưng vẫn cần sự thận trọng.
      - id: tap_ra_hieu_bang_tieng_huyt_sao
        text: Tập huýt sáo và vỗ tay ra hiệu mỗi khi cho ăn để dạy nó nghe lệnh
        effects:
          - { type: skill_xp, skill: quan_su, value: 8 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Con chó nhanh chóng nhận ra hiệu lệnh của bạn và biết chạy theo phụ đuổi thú nhỏ.
      - id: hoi_nguoi_di_san_cach_dung_cho_danh_hoi
        text: Hỏi các thợ săn trong nhóm cách dẫn chó đi theo tìm dấu vết con mồi
        effects:
          - { type: skill_xp, skill: hoc_van, value: 8 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
        result:
          - Bạn học được cách nhìn phản ứng vểnh tai và hướng mũi đánh hơi của loài chó săn.

  # 06. Tiếng động ngoài hang
  - id: nt_ev_06_tieng_dong_ngoai_hang
    title: Tiếng động ngoài nơi trú
    text:
      - Giữa đêm khuya có âm thanh sột soạt bất thường vọng lại từ phía ngoài cửa hang và hàng rào cành khô.
      - Đó có thể là một con thú ăn đêm, người trong nhóm về muộn hoặc cành cây gãy vì gió.
    tags: [nguy_hiem, thien_nhien, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
    cooldown_years: 6
    importance: 4
    icon: trang
    options:
      - id: lay_nguoi_lon_day
        text: Lặng lẽ chạm tay đánh thức người lớn và chỉ về phía có tiếng động
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: skill_xp, skill: muu_luoc, value: 6 }
        result:
          - Người lớn kịp thời cầm cây củi đang cháy xua đuổi một con thú hoang đang mò tìm thức ăn dự trữ.
      - id: nam_yen_lang_nghe
        text: Nằm im gần bếp lửa và lắng nghe nhịp bước chân cho tới khi tiếng động xa dần
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 8 }
          - { type: stress, value: 2 }
        result:
          - Tiếng bước chân lặng lẽ rời đi trong bóng tối; bạn học được cách phân biệt tiếng bước chân người và thú.
      - id: kheu_bep_lua_bung_sang_len
        text: Khều nhẹ cành củi khô vào than hồng để ánh lửa bùng sáng chiếu ra cửa hang
        effects:
          - { type: skill_xp, skill: quan_tri, value: 10 }
          - { type: stress, value: -2 }
        result:
          - Ánh lửa bùng lên khiến con thú ăn đêm giật mình bỏ chạy khỏi hàng rào.
      - id: sang_som_ra_kiem_tra_dau_chan
        text: Chờ trời sáng hẳn rồi ra ngoài bờ rào xem xét dấu chân để lại trên đất
        effects:
          - { type: skill_xp, skill: hoc_van, value: 8 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
        result:
          - Bạn nhận diện được dấu chân chồn rừng và gia cố lại chỗ giỏ treo thức ăn.

  # 07. Lần đầu nhìn thấy người lạ
  - id: nt_ev_07_lan_dau_thay_nguoi_la
    title: Lần đầu nhìn thấy người lạ
    text:
      - Một nhóm nhỏ từ nơi khác đi ngang gần khu cư trú, mang theo những mũi đá và chuỗi vỏ sò khác lạ.
      - Đứng sau lưng người thân, bạn vừa tò mò nhìn những vật dụng của họ vừa nghe người lớn bàn cách ứng xử.
    tags: [quan_he, buon_ban, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_trao_doi, nt_nguoi_dieu_hoa] }
        factor: 1.3
    cooldown_years: 6
    importance: 4
    icon: duong
    options:
      - id: quan_sat_cong_cu_trang_suc
        text: Chăm chú quan sát cách họ buộc mũi đá và trao đổi vật phẩm với người lớn
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 10 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
        result:
          - Bạn nhận ra ngoài cộng đồng của mình còn có những nhóm người với kỹ thuật và sản vật rất khác biệt.
      - id: dung_canh_nguoi_than_canh_giac
        text: Đứng sát bên người thân và giữ chừng mực trước người chưa quen biết
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
        result:
          - Cuộc gặp diễn ra ngắn ngủi nhưng bình yên; hai nhóm giữ khoảng cách tôn trọng rồi tiếp tục hành trình.
      - id: phu_mang_nuoc_uong_moi_khach
        text: Phụ người lớn mang bầu nước mát ra mời những người khách đi đường xa
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: reputation, value: 2 }
        result:
          - Sự hiếu khách lễ phép của bạn khiến nhóm người lạ mỉm cười thiện cảm và tặng lại một chiếc vỏ ốc nhỏ.
      - id: lang_nghe_cach_nguoi_lon_ra_hieu_hoa_binh
        text: Ghi nhớ từng cử chỉ đặt giáo xuống đất và xòe bàn tay khi hai nhóm gặp nhau
        effects:
          - { type: skill_xp, skill: hoc_van, value: 8 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
        result:
          - Bạn hiểu được nghi thức giữ hòa khí để tránh đổ máu khi chạm mặt nhóm khác.

  # 08. Món quà từ người già
  - id: nt_ev_08_mon_qua_tu_nguoi_gia
    title: Món quà từ người già
    text:
      - Một người lớn tuổi giàu kinh nghiệm trong nhóm gọi bạn lại bên bếp lửa và trao cho bạn một vật nhỏ tự tay làm.
      - Đó là một lưỡi đá nhỏ đã mài cẩn thận cùng một hạt chuỗi bằng xương đục lỗ.
    tags: [truyen_thong, gia_dinh, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_to_chuc_nghi_thuc] }
        factor: 1.3
    cooldown_years: 8
    once_per_life: true
    importance: 5
    icon: sach
    options:
      - id: gin_giu_nhu_ky_vat
        text: Đeo hạt xương bên người và lắng nghe câu chuyện về những mùa xưa cũ
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: stress, value: -4 }
        result:
          - Nhiều năm về sau, món quà giản dị ấy trở thành kỷ vật nhắc bạn nhớ về thế hệ đã nuôi dưỡng mình.
      - id: dung_luoi_da_tap_lam_viec
        text: Dùng ngay công cụ nhỏ ấy để tập cắt sợi và gọt cành gỗ
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: skill_xp, skill: sinh_ton, value: 6 }
        result:
          - Bạn sớm quen tay sử dụng công cụ và được người già chỉ thêm cách giữ lưỡi đá lâu cùn.
      - id: xin_hoc_cach_duc_lo_va_mai_xuong
        text: Hỏi người già cách dùng mũi đá nhọn xoay tròn để đục lỗ trên mảnh xương
        effects:
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Người già vui vẻ cầm tay chỉ cho bạn kỹ thuật khoan xương tỉ mỉ bằng mũi đá.
      - id: bieu_lai_qua_chin_hoac_cui_kho_dap_le
        text: Hái những quả rừng chín ngọt nhất mang đến biếu lại người già để tỏ lòng biết ơn
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: reputation, value: 3 }
        result:
          - Cử chỉ lễ phép và hiếu thảo của bạn được mọi người quanh bếp lửa khen ngợi.

  # ══════════════════ SỰ KIỆN TUỔI THƠ BỔ SUNG TỪ MỤC 2 ══════════════════
  # Bị ong đốt khi tìm mật và quả
  - id: nt_ev_08b_bi_ong_dot
    title: Tổ ong trên cành thấp
    text:
      - Khi vạch bụi cây tìm quả chín, bạn bất ngờ chạm phải một tổ ong rừng ẩn dưới tán lá.
      - Đàn ong vù bay ra khiến lũ trẻ đi cùng hoảng hốt chạy tán loạn.
    tags: [hai_luom, nguy_hiem, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu] }
        factor: 1.2
    cooldown_years: 6
    importance: 4
    icon: la
    options:
      - id: chay_ve_suoi_dap_bun
        text: Lùi nhanh về phía khe suối và nhờ người lớn đắp lá mát giảm sưng
        effects:
          - { type: health, value: -3 }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
        result:
          - Vết ong đốt sưng tấy mấy ngày, nhưng từ đó bạn biết nhìn đường bay của ong để tránh nguy hiểm hoặc tìm mật.
      - id: nho_vi_tri_bao_nguoi_lon
        text: Ghi nhớ vị trí cái cây rồi về chỉ cho người có kinh nghiệm dùng khói lấy sáp và mật
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: muu_luoc, value: 10 }
        result:
          - Người lớn dùng khói cỏ khô lấy được một ít mật rừng ngọt lịm chia cho cả nhóm.
      - id: keo_em_nho_nam_thap_xuong_co_day
        text: Kéo đứa trẻ nhỏ nhất cúi thấp người nấp dưới bụi cỏ dày chờ đàn ong tản đi
        effects:
          - { type: skill_xp, skill: quan_su, value: 8 }
          - { type: reputation, value: 3 }
        result:
          - Nhờ phản ứng nhanh nhạy của bạn, em nhỏ đi cùng không bị đốt nhiều.
      - id: hoc_nhan_biet_loai_la_rung_giam_dau
        text: Nhờ người chăm sóc chỉ cho loại lá rừng giã nát đắp lên vết đốt để rút nọc
        effects:
          - { type: skill_xp, skill: hoc_van, value: 10 }
        result:
          - Bạn biết thêm một loại thảo mộc sơ cứu hữu ích khi đi rừng.

  # Làm hỏng công cụ của người thân
  - id: nt_ev_08c_lam_hong_cong_cu_nguoi_than
    title: Làm mẻ lưỡi đá của người thân
    text:
      - Trong lúc tự ý cầm chiếc rìu đá của người lớn đập vào tảng đá cứng, bạn vô tình làm sứt một mảng lưỡi cắt.
      - Đây là công cụ mà người thân đã mất nhiều ngày chọn đá và ghè sửa mới có được.
    tags: [thu_cong, gia_dinh, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_che_tac_da, nt_nguoi_che_tac_xuong_go] }
        factor: 1.3
    cooldown_years: 6
    importance: 4
    icon: da
    options:
      - id: thu_nhan_va_ngoi_hoc_sua
        text: Đưa công cụ bị mẻ cho người thân và xin ngồi cạnh học cách ghè sửa lại lưỡi
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: stress, value: 2 }
        result:
          - Người thân không trách nặng lời mà bắt bạn ngồi nhìn cách ghè lại mép đá bị sứt để hiểu công sức làm ra công cụ.
      - id: di_nhat_da_cuoi_bu_lai
        text: Ra bờ suối tìm mấy viên đá cuội tốt mang về đền lại
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
        result:
          - Bạn học được cách gõ thử vào viên đá để nghe tiếng đanh hay bở trước khi mang về nơi trú.
      - id: kien_nhan_mai_lai_luoi_ri_tren_da_nham
        text: Mang chiếc rìu mẻ ra phiến đá nhám bên suối kỳ cọ mài lại suốt buổi chiều
        effects:
          - { type: skill_xp, skill: quan_tri, value: 10 }
          - { type: reputation, value: 2 }
        result:
          - Vết mẻ dần phẳng lại nhờ nước suối và cát nhám, người thân hài lòng trước sự biết lỗi của bạn.
      - id: nhat_manh_da_vo_lam_mui_nao_nho
        text: Nhặt mảnh đá vừa sứt ra để tận dụng làm mũi khắc gỗ nhỏ không bỏ phí
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
        result:
          - Bạn hiểu rằng mỗi mảnh đá tốt đều có thể tái sử dụng vào việc phù hợp.

  # Lần đầu nhìn thấy thú lớn & phát hiện vũng nước mới
  - id: nt_ev_08d_thay_thu_lon_va_vung_nuoc
    title: Vũng nước mới và bóng thú lớn
    text:
      - Khi theo người lớn đi qua sườn đồi sau mưa, bạn phát hiện một hốc đá trũng giữ được làn nước trong vắt.
      - Trên bùn ẩm cạnh vũng nước in hằn dấu chân rất sâu của một con thú lớn vừa đi qua chưa lâu.
    tags: [san_bat, thien_nhien, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_tim_nguon_nuoc, nt_nguoi_tim_duong] }
        factor: 1.3
    cooldown_years: 6
    importance: 4
    icon: nuoc
    options:
      - id: danh_dau_duong_den_vung_nuoc
        text: Xếp mấy hòn đá làm dấu đường dẫn tới vũng nước mới
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: reputation, value: 2 }
        result:
          - Điểm nước nhỏ ấy giúp những người đi hái lượm quanh đồi có chỗ uống nước sạch suốt mùa nắng.
      - id: quan_sat_dau_chan_thu_lon
        text: Ngồi xuống đo thử độ sâu và hướng đi của dấu chân thú lớn cùng người đi săn
        effects:
          - { type: skill_xp, skill: quan_su, value: 10 }
          - { type: skill_xp, skill: muu_luoc, value: 6 }
        result:
          - Lần đầu tiên bạn cảm nhận rõ cả sự hùng vĩ lẫn mối hiểm nguy luôn rình rập nơi rừng hoang.
      - id: nhac_moi_nguoi_khong_den_lay_nuoc_luc_chang_vang
        text: Ghi nhớ giờ thú lớn hay ra uống nước để nhắc các bạn nhỏ tránh đến vào lúc chập tối
        effects:
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: reputation, value: 2 }
        result:
          - Sự cẩn trọng của bạn giúp mọi người khai thác vũng nước mới mà không chạm mặt thú dữ.
      - id: xem_xet_cac_loai_cay_ua_am_quanh_hoc_da
        text: Quan sát những bụi cây ưa ẩm mọc quanh hốc đá để học cách tìm nước ngầm
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 8 }
          - { type: skill_xp, skill: hoc_van, value: 6 }
        result:
          - Bạn nhận ra nơi nào có loài cỏ xanh mướt ấy thì dưới chân đá thường có nước đọng.

  # ══════════════════ TUỔI THIẾU NIÊN (12–15) — MỤC 11.B (09–16) ══════════════════
  # 09. Mũi lao đầu tiên
  - id: nt_ev_09_mui_lao_dau_tien
