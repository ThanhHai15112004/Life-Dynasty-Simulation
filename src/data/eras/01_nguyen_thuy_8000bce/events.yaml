          - { type: stress, value: -3 }
        result:
          - Nghĩa cử sẻ chia của gia đình bạn làm dịu đi cuộc tranh cãi quanh bếp lửa.

  # Chăm sóc 04: Một người phục hồi sau nhiều tháng và tìm cách đảm nhiệm công việc mới
