          - Đôi vai mỏi nhừ mỗi ngày nhưng bạn giúp giảm đáng kể gánh nặng sinh hoạt cho cả nhà.
      - id: de_nghi_chuyen_cho_tru
        text: Đề nghị gia đình bàn với nhóm chuyển lán trại tới gần bờ sông hơn
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: skill_xp, skill: muu_luoc, value: 6 }
        result:
          - Ý kiến hợp lý mở ra cuộc thảo luận sôi nổi dù một số hộ vẫn ngại bỏ nơi ở hiện tại.
      - id: lam_ong_tre_va_bich_da_giu_nuoc
        text: Chế thêm các vật đựng bằng vỏ cây, bầu khô và da thú để mỗi chuyến đi mang được nhiều nước hơn
