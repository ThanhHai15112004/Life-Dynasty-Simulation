  # 20. Mùa thu hoạch thất bại
  - id: nt_ev_20_mua_thu_hoach_that_bai
    title: Mùa thu hoạch thất bại
    text:
      - Tại cộng đồng canh tác sơ khai, đợt gió khô nóng kéo dài khiến lượng hạt thu được thấp hơn mong đợi rất nhiều.
      - "Cả nhóm đứng trước lựa chọn: ăn vào phần hạt giống dự trữ, tỏa đi tìm thức ăn tự nhiên hay sang xin hỗ trợ từ nhóm khác."
    tags: [kinh_te, thien_nhien, nong_nghiep]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_khai_thac_ngu_coc, nt_nguoi_bao_quan_thuc_an, nt_nguoi_thu_hai, nt_nguoi_cham_giu_dong_vat, nt_nguoi_lam_gom, nt_nguoi_dung_noi_tru] }
        factor: 1.5
    cooldown_years: 7
    importance: 6
    icon: lua
    options:
      - id: to_chuc_hai_luom_bu_dap
        text: Tạm gác việc đồng bãi, dẫn mọi người vào rừng sâu đào củ và hái hạt dẻ bù vào
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: food, value: 4, ledger: su_kien }
        result:
          - Sự linh hoạt quay lại nguồn thức ăn hoang dã giúp gia đình bạn bù đắp phần hạt giống bị mất.
      - id: giu_chat_hat_giong_an_de_sen
        text: Kiên quyết giữ nguyên phần hạt giống cho năm sau, cả nhà thắt lưng buộc bụng
        effects:
          - { type: skill_xp, skill: quan_tri, value: 15 }
          - { type: health, value: -2 }
          - { type: money, value: 4, ledger: su_kien }
        result:
          - Nhờ giữ được hạt giống tốt trong chum đất, vụ gieo trồng mùa mưa năm sau phục hồi nhanh chóng.
      - id: nho_ho_tro_cong_dong_lan_can
        text: Mang công cụ đá và đồ đan sang đổi lương thực hoặc xin hỗ trợ từ nhóm lân cận
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 12 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
          - { type: food, value: 3, ledger: su_kien }
          - { type: money, value: -2, ledger: su_kien }
        result:
