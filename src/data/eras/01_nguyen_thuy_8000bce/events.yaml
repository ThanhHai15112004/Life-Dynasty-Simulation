      - id: chi_dan_cach_tim_hat_va_re_cay_cuu_doi_it_ai_biet
        text: Nhớ lại những loại củ rừng sâu và vỏ cây ăn được từ trận đói hàng chục năm trước để chỉ cho con cháu
        effects:
          - { type: food, value: 4, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 16 }
          - { type: reputation, value: 8 }
        result:
          - Ký ức sinh tồn của bậc cao niên một lần nữa cứu sống cả khu cư trú qua cơn bĩ cực.

