      - id: cu_nguoi_chay_ve_goi_them_tho_san
        text: Để hai người bám theo dấu vết từ xa còn bạn chạy về trại gọi thêm thợ săn tiếp ứng
        effects:
          - { type: food, value: 4, ledger: su_kien }
