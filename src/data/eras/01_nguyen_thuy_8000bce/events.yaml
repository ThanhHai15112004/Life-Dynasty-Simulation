          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: stress, value: -2 }
        result:
          - Những người có kinh nghiệm trong nhóm sẵn lòng sang giúp bế ẵm, giúp bạn yên tâm vừa làm việc vừa lo cho nhà.
      - id: tiep_tuc_kiem_an_nhieu_hon
        text: Tăng cường đi săn và hái lượm nhiều hơn để đảm bảo nguồn thức ăn bồi dưỡng
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: health, value: -3 }
          - { type: stress, value: 4 }
          - { type: skill_xp, skill: sinh_ton, value: 12 }
