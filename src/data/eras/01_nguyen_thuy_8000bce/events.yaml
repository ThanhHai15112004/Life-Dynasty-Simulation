        text: Đưa công cụ bị mẻ cho người thân và xin ngồi cạnh học cách ghè sửa lại lưỡi
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: stress, value: 2 }
        result:
          - Người thân không trách nặng lời mà bắt bạn ngồi nhìn cách ghè lại mép đá bị sứt để hiểu công sức làm ra công cụ.
      - id: di_nhat_da_cuoi_bu_lai
        text: Ra bờ suối tìm mấy viên đá cuội tốt mang về đền lại
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
        result:
          - Bạn học được cách gõ thử vào viên đá để nghe tiếng đanh hay bở trước khi mang về nơi trú.

  # Lần đầu nhìn thấy thú lớn & phát hiện vũng nước mới
  - id: nt_ev_08d_thay_thu_lon_va_vung_nuoc
    title: Vũng nước mới và bóng thú lớn
    text:
      - Khi theo người lớn đi qua sườn đồi sau mưa, bạn phát hiện một hốc đá trũng giữ được làn nước trong vắt.
      - Trên bùn ẩm cạnh vũng nước in hằn dấu chân rất sâu của một con thú lớn vừa đi qua chưa lâu.
    tags: [san_bat, thien_nhien, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
