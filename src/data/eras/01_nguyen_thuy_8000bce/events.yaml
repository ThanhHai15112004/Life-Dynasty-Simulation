        result:
          - Giỏ củ rừng và cá nhỏ giúp cả nhà không phải đi ngủ với cái bụng đói sau ngày săn thất bát.
      - id: nghe_phan_tich_ly_do_that_bai
        text: Ngồi nghe những người đi săn rút kinh nghiệm vì sao đàn thú đánh hơi được
        effects:
          - { type: skill_xp, skill: quan_su, value: 10 }
          - { type: skill_xp, skill: muu_luoc, value: 8 }
        result:
          - Bạn hiểu rõ hơn về hướng gió, tiếng bước chân và sự kiên nhẫn cần có trong mỗi chuyến đi.
      - id: phu_sua_lai_vu_khi_va_day_bay_cho_doan
        text: Đem nước ấm cho người lớn và ngồi phụ buộc lại những mũi lao bị lỏng dây
        effects:
          - { type: skill_xp, skill: quan_tri, value: 10 }
          - { type: reputation, value: 2 }
        result:
          - Sự chu đáo của bạn giúp các thợ săn vơi bớt mệt nhọc và sẵn sàng cho chuyến đi hôm sau.
      - id: kiem_tra_lai_vong_bay_nho_quanh_trai
        text: Đi thăm các bẫy thòng lọng nhỏ đặt quanh bìa rừng xem có bắt được chim hay thỏ không
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
