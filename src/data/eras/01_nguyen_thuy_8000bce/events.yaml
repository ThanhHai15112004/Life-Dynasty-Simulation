      - id: chuyen_sang_noi_canh_tac_khac
        text: Bỏ khoảnh đất bạc màu hiện tại để phát quang một bãi đất bồi mới gần nguồn nước hơn
        effects:
          - { type: health, value: -4 }
          - { type: food, value: 3, ledger: su_kien }
