        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 12 }
        result:
          - Những rễ cây và hạt dại bạn kiên trì đào bới đã giúp gia đình cầm cự qua lúc ngặt nghèo.
      - id: o_nha_cham_nguoi_yeu
        text: Nhường phần ăn cho trẻ nhỏ và phụ chăm sóc người yếu trong nhà
        effects:
          - { type: health, value: -3 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: reputation, value: 3 }
        result:
          - Cả nhà thương nhau vượt qua mùa đói, ai trong nhóm cũng quý tấm lòng biết nghĩ cho người thân của bạn.
      - id: dap_dap_nho_bat_ca_va_oc_ven_suoi
        text: Cùng đám bạn be bờ đá ở khúc suối cạn để bắt cá nhỏ, cua và ốc đá
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 10 }
        result:
          - Nguồn thủy sản nhỏ ven suối giúp bổ sung chất đạm quý giá khi thú rừng khan hiếm.
      - id: hoc_cach_nghien_hat_cung_tren_ban_da
        text: Phụ người lớn nghiền kỹ các loại hạt vỏ cứng và củ xơ trên bàn nghiền đá để nấu cháo loãng
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 8 }
        result:
          - Nhờ nghiền mịn và nấu kỹ, lượng thức ăn ít ỏi trở nên dễ tiêu hóa và nuôi sống được cả nhà.

  # 13. Tiếng gọi từ bên kia sông
  - id: nt_ev_13_tieng_goi_ben_kia_song
    title: Tiếng gọi từ bên kia sông
    text:
      - Một nhóm cư trú bên kia sông đề nghị thanh niên trong nhóm bạn cùng tham gia một chuyến kiếm ăn chung ở vùng bãi bồi.
      - Đây có thể là cơ hội học kỹ năng mới và kết bạn, nhưng cũng tiềm ẩn rủi ro khi đi xa nhà.
    tags: [quan_he, thoi_co, nguy_hiem]
    life_stages: [thieu_thoi]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
    cooldown_years: 6
    importance: 5
    icon: nuoc
    options:
      - id: xin_phep_di_cung_doan
        text: Xin phép người thân vượt sông tham gia chuyến kiếm ăn cùng nhóm bạn
        chance: { base: 0.7, skill: sinh_ton, per_level: 0.05 }
        success:
          - { type: food, value: 4, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
        failure:
          - { type: health, value: -5 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
        success_result:
          - Bạn học được cách đặt bẫy cá mới của nhóm bên kia sông và mang về phần thức ăn đáng kể.
        failure_result:
          - Dòng nước chảy xiết khiến bạn bị trầy xước khi lội qua bãi đá, nhưng chuyến đi vẫn cho bạn nhiều kinh nghiệm.
      - id: kiem_an_quanh_vung_quen
        text: Ở lại phụ gia đình khai thác những bãi kiếm ăn quen thuộc bên này sông
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Bạn giữ an toàn cho bản thân và hoàn thành trọn vẹn phần việc được giao tại nơi trú.
      - id: doi_do_dan_lay_ca_tai_ben_song
        text: Không vượt sông nhưng mang dây sợi, giỏ đan ra bến nước để trao đổi thức ăn khi đoàn trở về
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: skill_xp, skill: thuong_mai, value: 12 }
        result:
          - Bạn đổi được những con cá lớn mà không phải mạo hiểm lội qua khúc sông nước xiết.
      - id: di_theo_nguoi_lon_giam_sat_o_bo_ben_nay
        text: Cùng một người lớn đứng canh ở khúc sông cạn để hỗ trợ dây kéo và tiếp ứng cho đoàn
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 8 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
        result:
          - Sự hỗ trợ kịp thời của bạn ở bến sông giúp cả hai nhóm qua lại an toàn và thân thiện.

  # 14. Công cụ bị vỡ
  - id: nt_ev_14_cong_cu_bi_vo
    title: Công cụ bị vỡ
    text:
      - Giữa lúc đang làm việc, lưỡi đá trên công cụ quan trọng của bạn bị nứt vỡ làm đôi.
      - Nếu không có dụng cụ thay thế, bạn sẽ khó tiếp tục phần việc của mình trong những ngày tới.
    tags: [thu_cong, lao_dong]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_che_tac_da, nt_nguoi_che_tac_xuong_go, nt_nguoi_dan_soi] }
        factor: 1.3
    cooldown_years: 5
    importance: 4
    icon: da
    options:
      - id: tan_dung_manh_vo_che_tac_lai
        text: Tận dụng mảnh đá vỡ để ghè lại thành lưỡi nạo nhỏ và buộc cán mới
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: skill_xp, skill: sinh_ton, value: 6 }
        result:
          - "Bạn học được cách không bỏ phí nguyên liệu: mảnh đá gãy trở thành chiếc nạo da sắc bén."
      - id: doi_cui_nho_nguoi_tho_ghe_giup
        text: Mang một bó củi khô tới nhờ người thợ đá lành nghề trong nhóm làm giúp lưỡi mới
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: skill_xp, skill: thuong_mai, value: 6 }
        result:
          - Người thợ vui vẻ nhận củi khô và vừa ghè lưỡi đá mới vừa chỉ cho bạn cách tránh gõ lệch tâm đá.
      - id: dung_xuong_hoac_sung_thu_thay_the_tam
        text: Chuyển sang mài một mảnh xương ống hoặc sừng thú cứng để làm mũi nhọn thay thế
        effects:
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
        result:
          - Công cụ bằng xương dẻo dai hơn đá giúp bạn hoàn thành công việc mà không sợ giòn gãy.
      - id: di_doc_suoi_tim_vien_da_lua_tot_hon
        text: Dành buổi chiều lội dọc suối tìm một viên đá có thớ mịn và ít vết rạn hơn
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
        result:
          - Bạn tự tìm được nguồn đá tốt hơn và hiểu vì sao viên đá cũ bị nứt ngầm bên trong.

  # 15. Người dạy nghề ra đi
  - id: nt_ev_15_nguoi_day_nghe_ra_di
    title: Người dạy nghề ra đi
    text:
      - Người lớn tuổi từng kiên nhẫn chỉ dạy kỹ năng sinh tồn và chế tác cho bạn không còn ở bên nữa.
      - Bạn đứng trước khoảng trống lớn khi phải tự mình tiếp tục con đường học nghề.
    tags: [truyen_thong, hoc_hanh]
    life_stages: [thieu_thoi]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
    cooldown_years: 8
    once_per_life: true
    importance: 6
    icon: tang
    options:
      - id: tu_ren_luyen_theo_loi_dan
        text: Tự mình thực hành lại từng thao tác mà người thầy đã truyền dạy
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
        result:
          - Mỗi nhát ghè đá và mỗi bước chân trong rừng đều nhắc bạn nhớ những lời chỉ bảo quý giá năm xưa.
      - id: xin_theo_hoc_mot_nguoi_khac
        text: Tìm đến một thành viên giàu kinh nghiệm khác trong cộng đồng để xin học tiếp
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        result:
          - Người hướng dẫn mới có cách làm khác biệt, giúp bạn kết hợp được kinh nghiệm của cả hai người đi trước.
      - id: cung_ban_dong_mon_on_luyen_ky_nang
        text: Rủ những đứa trẻ từng học chung với mình cùng nhau ôn luyện lại mỗi ngày
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: stress, value: -3 }
        result:
          - Người này nhớ điều người kia quên, cả nhóm trẻ cùng giữ trọn được những gì thầy đã dạy.
      - id: gin_giu_va_hoan_thien_mon_do_thay_lam_do
        text: Xin nhận lại món công cụ người thầy đang làm dở để tự tay hoàn thiện
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: reputation, value: 3 }
        result:
          - Khi món công cụ hoàn thành, mọi người trong nhóm đều nhìn nhận bạn đã thực sự trưởng thành.

  # 16. Tình cảm đầu đời
  - id: nt_ev_16_tinh_cam_dau_doi
    title: Tình cảm đầu đời
    text:
      - Qua những mùa cùng đi nhặt quả, lấy nước và ngồi quanh đống lửa, bạn bắt đầu quan tâm đặc biệt đến một người bạn cùng lứa.
      - Mỗi khi đoàn chuẩn bị di chuyển hoặc chia việc, ánh mắt hai người thường tìm nhau.
    tags: [quan_he, gia_dinh]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
