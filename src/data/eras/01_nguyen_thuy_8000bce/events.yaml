  # 15. Người dạy nghề ra đi
  - id: nt_ev_15_nguoi_day_nghe_ra_di
    title: Người dạy nghề ra đi
    text:
      - Người lớn tuổi từng kiên nhẫn chỉ dạy kỹ năng sinh tồn và chế tác cho bạn không còn ở bên nữa.
      - Bạn đứng trước khoảng trống lớn khi phải tự mình tiếp tục con đường học nghề.
