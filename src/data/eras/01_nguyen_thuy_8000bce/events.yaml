      - id: nho_nguoi_am_hieu_thao_duoc_trong_nhom_kham_giup
        text: Đổi một ít công cụ nhỏ nhờ người giỏi chữa lành trong nhóm sang đắp lá thuốc mỗi sáng
        effects:
          - { type: money, value: -1, ledger: su_kien }
          - { type: health, value: 4, who: household }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        result:
          - Có người thạo thảo mộc theo dõi sát sao, vết thương không bị nhiễm trùng và mau lành hơn.
      - id: chia_ca_thay_phien_giua_cac_thanh_vien
        text: Sắp xếp lịch thay phiên nửa ngày đi hái lượm gần, nửa ngày ở nhà giữ lửa chăm bệnh
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: stress, value: -2 }
        result:
          - Cách phân ca hợp lý giúp không ai bị kiệt sức mà người bị thương luôn có người bên cạnh.

  # Chăm sóc 02: Người bệnh không đủ sức đi theo nhóm khi chuyển chỗ trú
  - id: nt_ev_cs_02_nguoi_benh_khi_chuyen_cho_tru
    title: Bước chân chậm lại trên đường chuyển trại
    text:
      - Khi cả nhóm chuẩn bị rời sang điểm cư trú theo mùa mới, một người đang ốm yếu không đủ sức tự đi bộ qua đoạn đèo dốc.
