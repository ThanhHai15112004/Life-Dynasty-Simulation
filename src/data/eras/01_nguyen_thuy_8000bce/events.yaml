events:
  # ══════════════════ TUỔI THƠ (0–11) — MỤC 11.B (01–08) ══════════════════
  # 01. Mùa lạnh đầu tiên
  - id: nt_ev_01_mua_lanh_dau_tien
    title: Mùa lạnh đầu tiên
    text:
      - Gió lạnh kéo dài qua nhiều ngày, củi khô quanh khu cư trú trở nên khó tìm hơn.
      - Người chăm sóc phải dành nhiều thời gian giữ cho nơi ngủ ấm hơn, trong khi nguồn dự trữ vơi dần.
    tags: [thien_nhien, gia_dinh, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
    cooldown_years: 6
    importance: 5
    icon: mua
    options:
      - id: nho_nguoi_than_giup
        text: Dựa vào sự giúp đỡ của những hộ thân thuộc quanh bếp lửa chung
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: stress, value: -3 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
        result:
          - Nhờ sự đùm bọc của các gia đình quanh bếp lửa, cả nhà vượt qua đợt giá lạnh đầu tiên bình an.
      - id: phu_tim_cui_che_chan
        text: Đi nhặt cành khô và phụ người lớn chèn lại vách chắn gió
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: health, value: -2 }
        result:
          - Bàn tay tê cóng vì gió lạnh, nhưng bạn học được cách tìm củi khô trong hốc đá và che chắn nơi ngủ.

  # 02. Đêm mất lửa
  - id: nt_ev_02_dem_mat_lua
    title: Đêm mất lửa
    text:
      - Bếp lửa của gia đình tắt ngấm sau một trận mưa lớn bất ngờ.
      - Người lớn loay hoay tìm bùi nhùi khô để tạo lại lửa hoặc sang xin than hồng từ nơi trú láng giềng.
    tags: [gia_dinh, lang_xa, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
    cooldown_years: 6
    importance: 5
    icon: nha
    options:
      - id: sang_xin_than_hong
        text: Theo người lớn sang xin than hồng từ gia đình láng giềng
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: stress, value: -2 }
        result:
          - Bạn tận mắt chứng kiến tầm quan trọng của việc duy trì quan hệ tốt với những người sống quanh mình.
      - id: giu_vat_lieu_kho
        text: Lục tìm phần vỏ cây và bùi nhùi được cất sâu dưới mái che
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: skill_xp, skill: quan_tri, value: 6 }
        result:
          - Ngọn lửa bùng lên trở lại từ nắm bùi nhùi khô, dạy bạn bài học nhớ đời về việc giữ vật liệu nhóm lửa.

  # 03. Một quả lạ trong rừng
  - id: nt_ev_03_qua_la_trong_rung
    title: Một quả lạ trong rừng
    text:
      - Trong lúc đi theo người lớn, bạn nhìn thấy một chùm quả có màu sắc bắt mắt chưa từng ăn bao giờ.
      - Người chăm sóc từng nghiêm giọng cảnh báo không được tự ý thử những loại quả và nấm chưa biết rõ.
    tags: [hai_luom, thien_nhien, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_thu_hai, nt_nguoi_cham_soc, nt_nguoi_bao_quan_thuc_an] }
        factor: 1.3
    cooldown_years: 6
    importance: 4
    icon: la
    options:
      - id: mang_ve_hoi_nguoi_lon
        text: Hái một cành nhỏ mang về hỏi người dạy dỗ trước khi đụng vào
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: skill_xp, skill: hoc_van, value: 8 }
        result:
          - Người lớn khen bạn biết thận trọng và chỉ rõ dấu hiệu trên lá để phân biệt cây độc với cây ăn được.
      - id: len_nem_thu
        text: Tò mò nếm thử một miếng nhỏ xem vị thế nào
        chance: { base: 0.45, skill: sinh_ton, per_level: 0.05 }
        success:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: food, value: 2, ledger: su_kien }
        failure:
          - { type: health, value: -8 }
          - { type: stress, value: 5 }
        success_result:
          - May mắn đó là thứ quả rừng ăn được; bạn tìm thêm được một bụi quả mới cho gia đình.
        failure_result:
          - Vị chát đắng làm bạn đau bụng quặn thắt suốt đêm — từ đó bạn không bao giờ dám coi thường lời dặn của người đi trước.

  # 04. Người bạn bị lạc
  - id: nt_ev_04_nguoi_ban_bi_lac
    title: Người bạn bị lạc
    text:
      - Sau một buổi chiều hái lượm gần bìa rừng, một đứa trẻ cùng lứa vẫn chưa trở về khi mặt trời sắp khuất.
      - Những người lớn vội vã cầm lao và đuốc tổ chức tìm kiếm trước khi bóng tối buông xuống.
    tags: [quan_he, thien_nhien, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_tim_duong, nt_nguoi_san_thu] }
        factor: 1.3
    cooldown_years: 8
    importance: 5
    icon: duong
    options:
      - id: chi_noi_nhin_thay_ban
        text: Cố nhớ lại nơi cuối cùng nhìn thấy bạn và chỉ hướng cho người lớn
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
          - { type: reputation, value: 2 }
        result:
          - Nhờ trí nhớ chính xác của bạn về gốc cây và khe suối, đoàn tìm kiếm đã đưa được người bạn về trước khi trời tối hẳn.
      - id: o_lai_giu_lua_bao_hieu
        text: Ở lại khu trú chất thêm củi cho ngọn lửa cháy cao làm dấu hiệu
        effects:
          - { type: skill_xp, skill: quan_tri, value: 8 }
          - { type: stress, value: -2 }
        result:
          - Ánh lửa bập bùng và làn khói giúp đoàn tìm kiếm định hướng quay về an toàn trong đêm sương.

  # 05. Một con vật đi theo
  - id: nt_ev_05_con_vat_di_theo
    title: Một con vật đi theo
    text:
      - Một con chó đã quen sống quanh nhóm người thường xuất hiện gần nơi trú mỗi khi có mùi thịt nướng.
      - Bạn tìm cách tiếp cận và quan sát phản ứng của nó bên rìa bãi sinh hoạt.
    tags: [san_bat, thien_nhien, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 3.5
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_san_thu, nt_nguoi_cham_giu_dong_vat] }
        factor: 1.3
    cooldown_years: 8
    importance: 4
    icon: trang
    options:
      - id: chia_phan_xuong_thit
        text: Chia cho nó một mẩu xương và kiên nhẫn để nó quen hơi
        effects:
          - { type: food, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: stress, value: -4 }
        result:
          - Con vật dần quen tiếng bước chân bạn và thường sủa báo hiệu mỗi khi có động tĩnh lạ quanh nơi trú.
      - id: giu_khoang_cach_quan_sat
        text: Giữ khoảng cách an toàn, chỉ quan sát tập tính của nó như lời người lớn dặn
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
        result:
          - Bạn hiểu rằng động vật sống quanh nhóm tuy có ích nhưng vẫn cần sự thận trọng.

  # 06. Tiếng động ngoài hang
  - id: nt_ev_06_tieng_dong_ngoai_hang
    title: Tiếng động ngoài nơi trú
    text:
      - Giữa đêm khuya có âm thanh sột soạt bất thường vọng lại từ phía ngoài cửa hang và hàng rào cành khô.
      - Đó có thể là một con thú ăn đêm, người trong nhóm về muộn hoặc cành cây gãy vì gió.
    tags: [nguy_hiem, thien_nhien, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
    cooldown_years: 6
    importance: 4
    icon: trang
    options:
      - id: lay_nguoi_lon_day
        text: Lặng lẽ chạm tay đánh thức người lớn và chỉ về phía có tiếng động
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: skill_xp, skill: muu_luoc, value: 6 }
        result:
          - Người lớn kịp thời cầm cây củi đang cháy xua đuổi một con thú hoang đang mò tìm thức ăn dự trữ.
      - id: nam_yen_lang_nghe
        text: Nằm im gần bếp lửa và lắng nghe nhịp bước chân cho tới khi tiếng động xa dần
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 8 }
          - { type: stress, value: 2 }
        result:
          - Tiếng bước chân lặng lẽ rời đi trong bóng tối; bạn học được cách phân biệt tiếng bước chân người và thú.

  # 07. Lần đầu nhìn thấy người lạ
  - id: nt_ev_07_lan_dau_thay_nguoi_la
    title: Lần đầu nhìn thấy người lạ
    text:
      - Một nhóm nhỏ từ nơi khác đi ngang gần khu cư trú, mang theo những mũi đá và chuỗi vỏ sò khác lạ.
      - Đứng sau lưng người thân, bạn vừa tò mò nhìn những vật dụng của họ vừa nghe người lớn bàn cách ứng xử.
    tags: [quan_he, buon_ban, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_trao_doi, nt_nguoi_dieu_hoa] }
        factor: 1.3
    cooldown_years: 6
    importance: 4
    icon: duong
    options:
      - id: quan_sat_cong_cu_trang_suc
        text: Chăm chú quan sát cách họ buộc mũi đá và trao đổi vật phẩm với người lớn
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 10 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
        result:
          - Bạn nhận ra ngoài cộng đồng của mình còn có những nhóm người với kỹ thuật và sản vật rất khác biệt.
      - id: dung_canh_nguoi_than_canh_giac
        text: Đứng sát bên người thân và giữ chừng mực trước người chưa quen biết
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 10 }
        result:
          - Cuộc gặp diễn ra ngắn ngủi nhưng bình yên; hai nhóm giữ khoảng cách tôn trọng rồi tiếp tục hành trình.

  # 08. Món quà từ người già
  - id: nt_ev_08_mon_qua_tu_nguoi_gia
    title: Món quà từ người già
    text:
      - Một người lớn tuổi giàu kinh nghiệm trong nhóm gọi bạn lại bên bếp lửa và trao cho bạn một vật nhỏ tự tay làm.
      - Đó là một lưỡi đá nhỏ đã mài cẩn thận cùng một hạt chuỗi bằng xương đục lỗ.
    tags: [truyen_thong, gia_dinh, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 4
    weight_modifiers:
      - condition: { var: player.origin, op: in, value: [nt_con_nguoi_san_thu, nt_con_nguoi_hai_luom, nt_con_nguoi_danh_ca_song, nt_con_cong_dong_ven_bien, nt_dua_tre_nhom_di_cu, nt_con_nguoi_trong_ngu_coc, nt_con_nguoi_dung_nha, nt_con_nguoi_che_tac_da, nt_con_nguoi_giu_kho, nt_con_cu_dan_hang_da, nt_con_cong_dong_ho_sahara, nt_con_nguoi_lam_gom, nt_con_nguoi_tim_da_quy, nt_con_nguoi_cham_soc, nt_dua_tre_khong_nguoi_than] }
        factor: 1.2
      - condition: { var: player.career, op: in, value: [nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_to_chuc_nghi_thuc] }
        factor: 1.3
    cooldown_years: 8
    once_per_life: true
    importance: 5
    icon: sach
    options:
      - id: gin_giu_nhu_ky_vat
        text: Đeo hạt xương bên người và lắng nghe câu chuyện về những mùa xưa cũ
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: stress, value: -4 }
        result:
          - Nhiều năm về sau, món quà giản dị ấy trở thành kỷ vật nhắc bạn nhớ về thế hệ đã nuôi dưỡng mình.
      - id: dung_luoi_da_tap_lam_viec
        text: Dùng ngay công cụ nhỏ ấy để tập cắt sợi và gọt cành gỗ
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: skill_xp, skill: sinh_ton, value: 6 }
        result:
          - Bạn sớm quen tay sử dụng công cụ và được người già chỉ thêm cách giữ lưỡi đá lâu cùn.

  # ══════════════════ SỰ KIỆN TUỔI THƠ BỔ SUNG TỪ MỤC 2 ══════════════════
  # Bị ong đốt khi tìm mật và quả
  - id: nt_ev_08b_bi_ong_dot
    title: Tổ ong trên cành thấp
    text:
      - Khi vạch bụi cây tìm quả chín, bạn bất ngờ chạm phải một tổ ong rừng ẩn dưới tán lá.
      - Đàn ong vù bay ra khiến lũ trẻ đi cùng hoảng hốt chạy tán loạn.
    tags: [hai_luom, nguy_hiem, tuoi_tho]
    life_stages: [thieu_thoi]
    weight: 3.5
