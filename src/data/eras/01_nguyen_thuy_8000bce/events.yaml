      - id: dong_y_chuyen_di
        text: Khuyên con cháu thu dọn đồ đạc và đồng ý cùng cả nhóm dời đi nơi khác an toàn hơn
        effects:
          - { type: food, value: -2, ledger: su_kien }
          - { type: health, value: -2 }
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: reputation, value: 4 }
