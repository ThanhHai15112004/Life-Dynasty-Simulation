          - Tay nghề của bạn tiến bộ rõ rệt dù cơ thể nhiều hôm mỏi nhừ vì tập quá sức.
      - id: nho_ban_huong_dan
        text: Gạt bỏ tự ái để nhờ chính người bạn ấy chỉ dẫn bí quyết
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
