      - id: nhan_viec_giu_lua_va_trong_tre_nho_cho_dai_gia_dinh
        text: Về ở chung và chủ động nhận việc giữ mồi lửa, kể chuyện trông các cháu nhỏ để con cái yên tâm đi làm
        effects:
          - { type: food, value: 1, ledger: su_kien }
          - { type: reputation, value: 5 }
          - { type: stress, value: -4 }
