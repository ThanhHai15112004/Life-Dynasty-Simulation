        chance: { base: 0.6, skill: quan_tri, per_level: 0.08 }
        success:
          - { type: reputation, value: 8 }
          - { type: skill_xp, skill: quan_tri, value: 18 }
          - { type: stress, value: 5 }
        failure:
          - { type: reputation, value: -2 }
          - { type: stress, value: 7 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        success_result:
          - Đa số các gia đình tín nhiệm kinh nghiệm của bạn; bạn trở thành người cầm trịch mới của nhóm.
        failure_result:
          - Một số người khác không phục khiến bạn phải tốn nhiều công sức thuyết phục trong những tháng đầu.
      - id: de_xuat_nhieu_nguoi_cung_dieu_phoi
        text: Đề xuất lập nhóm các bậc trung niên có kinh nghiệm cùng bàn bạc quyết định việc chung
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, value: 5 }
          - { type: stress, value: 1 }
        result:
          - Trách nhiệm được san sẻ đồng đều, giúp giữ hòa khí dù mỗi quyết định lớn cần nhiều thời gian bàn thảo hơn.
      - id: khong_tham_gia
        text: Không tham gia tranh luận quyền dẫn dắt mà tập trung chăm lo cho gia đình mình
        effects:
          - { type: food, value: 2, ledger: su_kien }
          - { type: stress, value: -3 }
        result:
          - Bạn giữ được sự thảnh thơi cá nhân dù tiếng nói của gia đình trong các việc chung giảm bớt.
      - id: ung_ho_mot_nguoi_co_nang_luc_va_lam_co_van
        text: Đề cử một người uy tín khác đứng đầu và nhận vai trò cố vấn, hỗ trợ phía sau
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 16 }
          - { type: reputation, value: 6 }
        result:
          - Người dẫn dắt mới rất cảm kích sự ủng hộ của bạn và luôn hỏi ý kiến bạn trước mọi việc quan trọng.

  # 13. Một mùa thu hoạch kém [Tây Á]
