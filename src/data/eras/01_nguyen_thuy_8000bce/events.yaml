  # 13. Tiếng gọi từ bên kia sông
  - id: nt_ev_13_tieng_goi_ben_kia_song
    title: Tiếng gọi từ bên kia sông
    text:
      - Một nhóm cư trú bên kia sông đề nghị thanh niên trong nhóm bạn cùng tham gia một chuyến kiếm ăn chung ở vùng bãi bồi.
      - Đây có thể là cơ hội học kỹ năng mới và kết bạn, nhưng cũng tiềm ẩn rủi ro khi đi xa nhà.
    tags: [quan_he, thoi_co, nguy_hiem]
    life_stages: [thieu_thoi]
    weight: 3.5
    weight_modifiers:
