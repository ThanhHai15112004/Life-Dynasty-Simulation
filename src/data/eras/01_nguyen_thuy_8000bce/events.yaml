          - { type: skill_xp, skill: sinh_ton, value: 8 }
        success_result:
          - Bạn học được cách đặt bẫy cá mới của nhóm bên kia sông và mang về phần thức ăn đáng kể.
        failure_result:
          - Dòng nước chảy xiết khiến bạn bị trầy xước khi lội qua bãi đá, nhưng chuyến đi vẫn cho bạn nhiều kinh nghiệm.
      - id: kiem_an_quanh_vung_quen
