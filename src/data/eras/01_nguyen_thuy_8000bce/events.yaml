      - id: xin_cong_dong_chia_se
        text: Đề nghị nhóm cư trú chia sẻ bớt phần thức ăn chung và hứa sẽ bù lại vào mùa sau
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: food, value: 3, ledger: su_kien }
        result:
          - Cộng đồng sẵn lòng san sẻ từng xâu cá khô giúp gia đình bạn không bị đứt bữa.

  # 24. Chuyến trao đổi dài ngày
  - id: nt_ev_24_chuyen_trao_doi_dai_ngay
    title: Chuyến trao đổi dài ngày
    text:
      - Bạn đi theo đoàn vượt qua hai dãy đồi tới điểm hẹn trao đổi với một cộng đồng khác.
      - Tại đây bạn bắt gặp những cách chế tác đá đen, bình gốm và tập quán mới, nhưng cũng phải đối mặt với rủi ro đường đi và quan hệ xa lạ.
    tags: [kinh_te, ngoai_giao, di_cu]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_trao_doi, nt_nguoi_tim_duong, nt_nguoi_che_tac_da, nt_nguoi_lam_gom, nt_nguoi_tim_nguon_nuoc, nt_nguoi_che_tac_xuong_go] }
        factor: 1.6
    cooldown_years: 7
    importance: 6
    icon: cho
    options:
      - id: doi_cong_cu_va_hoc_ky_thuat
        text: Trao đổi vật phẩm và chăm chú quan sát cách họ chế tác công cụ mới
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 14 }
          - { type: skill_xp, skill: hoc_van, value: 8 }
          - { type: money, value: 5, ledger: su_kien }
        result:
          - Bạn mang về những phiến đá quý hiếm cùng bí quyết ghè ép tạo lưỡi sắc mà cộng đồng bạn chưa từng biết.
      - id: ket_ban_va_lap_hen_mua_sau
        text: Tặng quà làm quen và thiết lập lời hẹn trao đổi định kỳ mỗi mùa khô
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 16 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Hai cộng đồng thống nhất lấy tảng đá lớn ven sông làm nơi gặp gỡ hòa bình hằng năm.
      - id: can_trong_giu_khoang_cach
        text: Chỉ đổi nhanh những thứ thiết yếu rồi rút về sớm để tránh bất trắc trên đường
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 12 }
          - { type: food, value: 3, ledger: su_kien }
        result:
          - Bạn hoàn thành việc trao đổi gọn gàng và đưa cả đoàn về tới lán trước khi cơn mưa rừng đổ xuống.

  # 25. Tranh chấp bãi kiếm ăn
  - id: nt_ev_25_tranh_chap_bai_kiem_an
    title: Tranh chấp bãi kiếm ăn
    text:
      - Hai nhóm cư trú cùng muốn sử dụng một khu vực nhiều quả chín và nguồn cá dồi dào.
      - Tình hình có thể dẫn đến thỏa thuận chia sẻ, chủ động tránh nhau, căng thẳng kéo dài hoặc xung đột trực diện.
    tags: [lang_xa, xung_dot, ngoai_giao]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_dieu_hoa, nt_nguoi_san_thu, nt_nguoi_danh_ca, nt_nguoi_thu_hai, nt_nguoi_to_chuc_nghi_thuc, nt_nguoi_cham_giu_dong_vat] }
        factor: 1.5
    cooldown_years: 7
    importance: 6
    icon: kiem
    options:
      - id: thuong_luong_chia_ranh_gioi
        text: Tiến lên không cầm vũ khí, đề nghị lấy con suối nhỏ làm ranh giới chia đôi bãi kiếm ăn
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 16 }
          - { type: reputation, group: lang, value: 6 }
        result:
          - Hai nhóm đồng ý chia khu vực khai thác, tránh được một cuộc đổ máu vô ích giữa rừng.
      - id: dan_doan_ap_dao
        text: Tập hợp những người khỏe mạnh cầm giáo đá dàn hàng buộc đối phương phải lùi bước
        effects:
          - { type: skill_xp, skill: quan_su, value: 16 }
          - { type: food, value: 5, ledger: su_kien }
          - { type: health, value: -3 }
        result:
          - Nhóm người kia phải thu lán rút về phía bên kia đồi sau màn đối đầu căng thẳng.
      - id: chu_dong_lui_tim_bai_khac
        text: Chủ động rút lui sang sườn núi phía bắc để bảo toàn lực lượng
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: stress, value: -2 }
        result:
          - Chuyến đi vòng vất vả hơn nhưng cả nhóm tìm được một thung lũng yên bình chưa có dấu chân người.

  # 26. Người bạn cũ trở về
  - id: nt_ev_26_nguoi_ban_cu_tro_ve
    title: Người bạn cũ trở về
    text:
      - Một người từng rời cộng đồng xuất hiện trở lại sau nhiều năm bôn ba ở những vùng đất khác.
      - Họ mang theo kiến thức, mối quan hệ mới nhưng cũng đang gặp khó khăn cần sự giúp đỡ của bạn.
    tags: [lang_xa, gia_dinh]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_trao_doi, nt_nguoi_dung_noi_tru, nt_nguoi_lam_gom] }
        factor: 1.5
    cooldown_years: 8
    importance: 5
    icon: nguoi
    options:
      - id: don_nhan_va_hoc_hoi
        text: Mở rộng vòng tay đón bạn cũ về lán, cùng chia sẻ thức ăn và lắng nghe tri thức mới
        effects:
          - { type: skill_xp, skill: hoc_van, value: 15 }
          - { type: stress, value: -4 }
        result:
          - Những đêm dài bên bếp lửa, người bạn kể cho bạn nghe về những ngôi làng xây bằng đá ở phương xa.
      - id: giup_ban_dung_lan_rieng
        text: Cùng mọi người giúp bạn cũ dựng một lán nhỏ và hòa nhập lại với cộng đồng
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, group: lang, value: 4 }
        result:
          - Nhờ sự bảo lãnh của bạn, cộng đồng nhanh chóng đón nhận lại người con đi xa trở về.
      - id: hoi_ky_ve_tuyen_duong_moi
        text: Hỏi kỹ về các nguồn đá, nguồn nước mà bạn ấy đã đi qua để ghi nhớ
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 14 }
          - { type: skill_xp, skill: thuong_mai, value: 8 }
        result:
          - Bản đồ truyền miệng của cộng đồng được mở rộng thêm nhiều vùng đất mới.

  # 27. Những dấu hiệu của mùa xấu
  - id: nt_ev_27_dau_hieu_mua_xau
    title: Những dấu hiệu của mùa xấu
    text:
      - "Thời tiết và nguồn thức ăn quanh vùng biến đổi bất lợi: nước suối rút nhanh và đàn chim bay đi sớm hơn thường lệ."
      - Nhân vật có thể chuẩn bị di chuyển, thay đổi công việc hoặc tăng cường tích trữ nhiều hơn trước khi mùa khô ập tới.
    tags: [thien_nhien, kinh_te]
    life_stages: [thanh_nien, lap_nghiep]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_bao_quan_thuc_an, nt_nguoi_khai_thac_ngu_coc, nt_nguoi_cham_giu_dong_vat, nt_nguoi_tim_duong, nt_nguoi_dung_noi_tru] }
        factor: 1.5
    cooldown_years: 7
    importance: 6
    icon: mua
    options:
      - id: tang_cuong_tich_tru_khan_cap
        text: Huy động cả nhà phơi khô thịt cá, đào thêm hố lót đá trữ hạt và củ rừng ngay lập tức
        effects:
          - { type: skill_xp, skill: quan_tri, value: 15 }
          - { type: food, value: 5, ledger: su_kien }
        result:
          - Nhờ chuẩn bị từ sớm khi thức ăn còn dồi dào, kho dự trữ của gia đình bạn đầy ắp trước khi hạn hán xảy ra.
      - id: chuyen_doi_cach_kiem_an
        text: Chuyển sang khai thác các nguồn thức ăn chịu hạn như củ rừng sâu và nhuyễn thể ven sông lớn
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 15 }
          - { type: food, value: 3, ledger: su_kien }
        result:
          - Gia đình vẫn duy trì được bữa ăn đều đặn giữa lúc nhiều nơi khác thiếu đói.
      - id: de_xuat_di_chuyen_tam_thoi
        text: Đề xuất đưa cộng đồng tạm lánh lên vùng thung lũng cao gần nguồn suối đầu nguồn
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Chuyến di chuyển kịp thời lên vùng thượng nguồn giúp cả nhóm luôn có nước mát và bóng cây che chở.

  # 28. Một kỹ thuật được truyền lại
  - id: nt_ev_28_ky_thuat_truyen_lai
    title: Một kỹ thuật được truyền lại
    text:
      - Nhân vật bắt đầu dạy một người trẻ trong nhóm phương pháp chế tác công cụ hoặc tìm kiếm thức ăn mà mình tâm đắc nhất.
      - Quá trình truyền dạy có thể thành công, gặp khó khăn hoặc được chính người học cải tiến thêm.
    tags: [nghe, hoc_tap]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_che_tac_da, nt_nguoi_che_tac_xuong_go, nt_nguoi_dan_soi, nt_nguoi_lam_gom, nt_nguoi_dung_noi_tru, nt_nguoi_gin_giu_chuyen_ke] }
        factor: 1.6
    cooldown_years: 7
    importance: 5
    icon: nghe
    options:
      - id: tan_tinh_chi_day_tung_buoc
        text: Kiên nhẫn cầm tay chỉ việc, truyền lại toàn bộ bí quyết cho lớp trẻ
        effects:
          - { type: skill_xp, skill: hoc_van, value: 15 }
          - { type: reputation, group: lang, value: 6 }
        result:
          - Kỹ thuật của bạn trở thành tài sản chung nâng cao sức sống của cả cộng đồng.
      - id: khuyen_khich_nguoi_hoc_cai_tien
        text: Dạy nền tảng rồi khuyến khích người học tự thử nghiệm cách làm mới của riêng họ
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
          - { type: money, value: 4, ledger: su_kien }
        result:
          - Một người học trò trẻ đã nảy ra cách buộc dây gân thú kiểu mới giúp công cụ bền chắc hơn hẳn.
      - id: chon_nguoi_kien_nhan_nhat
        text: Thử thách lòng kiên nhẫn trước, chỉ truyền dạy sâu cho người thực sự bền bỉ
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: reputation, group: lang, value: 4 }
        result:
          - Người học trò vượt qua thử thách đã tiếp thu trọn vẹn từng chi tiết khó nhất mà không làm hỏng nguyên liệu quý.

  # ══════════════════ TUỔI TRUNG NIÊN & TUỔI GIÀ (40+) — MỤC 11.B (29–36) ══════════════════
  # 29. Sức lực không còn như trước
  - id: nt_ev_29_suc_luc_khong_con_nhu_truoc
    title: Sức lực không còn như trước
    text:
      - Một công việc từng quen thuộc như leo dốc mang nặng hay đi săn xa nay trở nên nặng nhọc hơn rất nhiều.
      - Nhân vật phải quyết định chuyển sang công việc phù hợp hơn, nghỉ ngơi nhiều hơn hoặc cố gắng tiếp tục và chấp nhận rủi ro.
    tags: [suc_khoe, nghe]
    life_stages: [trung_nien, tuoi_gia]
    weight: 5
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_san_thu, nt_nguoi_dieu_hoa, nt_nguoi_dung_noi_tru, nt_nguoi_trao_doi] }
        factor: 1.5
    cooldown_years: 8
    importance: 6
    icon: benh
    options:
      - id: chuyen_sang_viec_kheo_leo_tai_cho
        text: Chuyển dần sang chế tác công cụ, đan lát và coi sóc kho dự trữ tại khu trại
        effects:
          - { type: skill_xp, skill: quan_tri, value: 14 }
          - { type: health, value: 3 }
        result:
          - Sức khỏe của bạn ổn định hơn nhờ tránh được những đêm dầm sương ngoài rừng sâu.
      - id: tap_trung_chi_huy_va_dan_dat
        text: Đi cùng đoàn ở nhịp độ vừa phải để chỉ đường, đọc dấu vết và điều phối chiến thuật
        effects:
          - { type: skill_xp, skill: muu_luoc, value: 15 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Đám thanh niên luôn lắng nghe từng hiệu lệnh giàu kinh nghiệm của bạn trong mỗi chuyến đi.
      - id: co_gang_nhu_thoi_tre
        text: Nén cơn đau khớp, cố gắng mang vác nặng để chứng tỏ mình chưa già
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: health, value: -5 }
        result:
          - Sự gắng sức quá mức khiến lưng và đầu gối bạn sưng tấy, phải nằm nghỉ bên bếp lửa nhiều ngày liền.

  # 30. Người bạn đầu tiên qua đời
  - id: nt_ev_30_nguoi_ban_dau_tien_qua_doi
    title: Người bạn đầu tiên qua đời
    text:
      - Một người đồng hành cùng bạn từ thời thơ ấu đã trút hơi thở cuối cùng sau cơn bệnh nặng.
      - Đứng bên bếp lửa, sự kiện này gợi lại những quyết định và biến cố hai người từng cùng nhau vượt qua.
    tags: [lang_xa, gia_dinh]
    life_stages: [trung_nien, tuoi_gia]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_to_chuc_nghi_thuc, nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_cham_soc] }
        factor: 1.5
    cooldown_years: 10
    importance: 6
    icon: tang
    options:
      - id: to_chuc_nghi_thuc_trang_trong
        text: Chuẩn bị đồ tùy táng bằng vỏ sò, thổ hoàng và kể lại cuộc đời bạn mình bên bếp lửa
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, group: lang, value: 5 }
          - { type: stress, value: -2 }
        result:
          - Câu chuyện của bạn khiến lớp trẻ hiểu được thế hệ đi trước đã vượt qua những gì để giữ lấy khu cư trú hôm nay.
      - id: cham_soc_gia_dinh_nguoi_ban
        text: San sẻ thức ăn và nhận hướng dẫn cho con cháu của người bạn quá cố
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: food, value: -2, ledger: su_kien }
          - { type: reputation, group: lang, value: 6 }
        result:
          - Con của người bạn coi bạn như bậc cha chú ruột thịt trong nhà.
      - id: lang_le_khac_dau_ky_niem
        text: Lặng lẽ khắc một ký hiệu lên vách đá nơi hai người từng ngồi trú mưa thuở nhỏ
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
        result:
          - Đường khắc mộc mạc trên đá lưu giữ dấu vết của một tình bạn đã đi trọn kiếp người.

  # 31. Thế hệ trẻ chọn con đường khác
  - id: nt_ev_31_the_he_tre_chon_duong_khac
    title: Thế hệ trẻ chọn con đường khác
    text:
      - Con cái hoặc người trẻ trong nhóm không muốn tiếp tục công việc và vai trò quen thuộc của bạn.
      - Điều này có thể dẫn đến tranh cãi, thỏa hiệp hoặc việc người trẻ tách đi theo hướng mới.
    tags: [gia_dinh, nghe]
    life_stages: [trung_nien, tuoi_gia]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_khai_thac_ngu_coc, nt_nguoi_cham_giu_dong_vat, nt_nguoi_san_thu, nt_nguoi_thu_hai] }
        factor: 1.5
    cooldown_years: 8
    importance: 6
    icon: tre
    options:
      - id: ung_ho_va_trao_hanh_trang
        text: Mỉm cười ủng hộ, tặng họ những công cụ tốt nhất và dặn dò cách giữ mình
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: stress, value: -4 }
        result:
          - Sự cởi mở của bạn giúp người trẻ vững tin thử nghiệm con đường mới mà vẫn luôn hướng về gia đình.
      - id: thoa_hiep_ket_hop_cu_moi
        text: Đề nghị họ dành nửa mùa phụ việc chung của gia đình, nửa mùa thử nghiệm việc mới
        effects:
          - { type: skill_xp, skill: quan_tri, value: 15 }
          - { type: food, value: 3, ledger: su_kien }
        result:
          - Cách sắp xếp hợp lý giúp gia đình vừa giữ được nguồn thu ổn định, vừa mở ra hướng phát triển mới.
      - id: nghiem_khac_giu_nep_cu
        text: Nghiêm khắc yêu cầu họ phải thành thạo nghề cũ của gia đình trước khi nghĩ tới chuyện khác
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: stress, value: 3 }
        result:
          - Người trẻ miễn cưỡng nghe theo lời bạn để giữ hòa khí, nhưng ánh mắt vẫn hướng về những vùng đất xa.

  # 32. Khu cư trú bắt đầu thay đổi
  - id: nt_ev_32_khu_cu_tru_thay_doi
    title: Khu cư trú bắt đầu thay đổi
    text:
      - Khu vực kiếm ăn quen thuộc không còn như trước sau hàng chục mùa mưa nắng.
      - Một số gia đình chuẩn bị rời đi lập trại mới, trong khi những người khác cố gắng cải tạo và duy trì nơi ở hiện tại.
    tags: [lang_xa, kinh_te]
    life_stages: [trung_nien, tuoi_gia]
    weight: 4
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_dung_noi_tru, nt_nguoi_bao_quan_thuc_an, nt_nguoi_to_chuc_nghi_thuc] }
        factor: 1.5
    cooldown_years: 8
    importance: 5
    icon: nha
    options:
      - id: gop_suc_xay_dung_nen_tang_moi
        text: Đóng góp kinh nghiệm quy hoạch kho dự trữ, rãnh thoát nước và bếp chung cho khu định cư
        effects:
          - { type: skill_xp, skill: quan_tri, value: 16 }
          - { type: reputation, group: lang, value: 6 }
        result:
          - Những lời khuyên từng trải của bạn giúp khu nhà mới tránh được hướng gió lùa và ngập úng mùa mưa.
      - id: giu_moi_lien_ket_giua_cac_nhom
        text: Đứng ra làm cầu nối giữa những hộ ở lại và những hộ tách sang bãi mới
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 15 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Các nhóm gia đình dù ở cách nhau một con suối vẫn thường xuyên qua lại đổi thức ăn và giúp nhau mùa vụ.
      - id: luu_giu_ky_uc_buoi_ban_dau
        text: Kể cho bọn trẻ nghe về hình dáng khu đất này thuở chỉ mới có vài bếp lửa sơ sài
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
        result:
          - Câu chuyện về buổi đầu dựng lán trở thành truyền thuyết cội nguồn của cả khu cư trú.

  # 33. Người cuối cùng còn nhớ
  - id: nt_ev_33_nguoi_cuoi_cung_con_nho
    title: Người cuối cùng còn nhớ
    text:
      - Khi suối chính cạn khô và nguồn thức ăn quen thuộc khan hiếm, bạn nhận ra mình là một trong số ít người còn nhớ mạch nước ngầm, tuyến đường cổ và cách khử độc củ rừng từng dùng nhiều năm trước.
      - Khi hoàn cảnh thay đổi, tri thức tưởng chừng đã ngủ quên ấy lại trở nên sống còn đối với cả cộng đồng.
    tags: [hoc_tap, lang_xa, sinh_ton]
    life_stages: [trung_nien, tuoi_gia]
    weight: 5
    weight_modifiers:
      - condition: { var: player.career, op: in, value: [nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_tim_duong, nt_nguoi_cham_soc, nt_nguoi_che_tac_da] }
        factor: 1.6
    cooldown_years: 9
    importance: 7
    icon: sach
    options:
      - id: dan_doan_nguoi_tre_di_tim
        text: Chống gậy dẫn đám thanh niên tới tận nơi và chỉ dẫn tường tận cách xử lý
        effects:
          - { type: skill_xp, skill: hoc_van, value: 18 }
          - { type: reputation, group: lang, value: 8 }
          - { type: stress, value: -5 }
        result:
          - Dòng nước mát lành từ hốc đá cổ và cách ngâm khử độc củ rừng của bạn đã cứu cả khu trại khỏi cơn khát và cái đói.
      - id: ve_so_do_va_chi_dan_chi_tiet
        text: Vẽ sơ đồ trên nền đất và dặn kỹ từng dấu hiệu nhận biết để người trẻ tự đi tìm
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 16 }
          - { type: reputation, group: lang, value: 6 }
        result:
          - Đám thanh niên làm theo đúng lời chỉ dẫn của bạn và mang về những bầu nước đầy cùng những giỏ củ rừng an toàn.
      - id: truyen_lai_thanh_bai_ve
        text: Truyền lại thành những câu vè ngắn gọn để con cháu đời sau không bao giờ quên nữa
        effects:
          - { type: skill_xp, skill: hoc_van, value: 16 }
          - { type: reputation, group: lang, value: 6 }
        result:
          - Những câu vè chỉ đường và cách sơ chế thức ăn mùa hạn được bọn trẻ thuộc nằm lòng bên bếp lửa.

  # 34. Mùa thu hoạch của con cháu
  - id: nt_ev_34_mua_thu_hoach_cua_con_chau
    title: Mùa thu hoạch của con cháu
    text:
      - Ngồi dưới mái hiên, bạn nhìn thấy thế hệ sau trở về với những giỏ hạt đầy, những xâu cá tươi và những công cụ sắc bén.
      - Những công việc bạn từng vật lộn khi còn trẻ nay được con cháu hoàn thành vững vàng, mang lại cảm giác mãn nguyện và nhận ra thời đại đang đổi thay.
    tags: [gia_dinh, kinh_te]
    life_stages: [trung_nien, tuoi_gia]
    weight: 4
    cooldown_years: 8
    importance: 6
    icon: lua
    options:
      - id: khen_ngoi_va_chung_vui
        text: Dành lời khen ngợi chân thành và cùng con cháu mở bữa ăn mừng ấm cúng
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: stress, value: -6 }
        result:
          - Con cháu kính cẩn dâng phần thức ăn ngon nhất mời bạn bên bếp lửa rực hồng.
      - id: nhac_nho_du_tru_cho_mua_kho
        text: Mỉm cười chung vui nhưng không quên nhắc con cháu cất kỹ một phần vào hố dự trữ
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: food, value: 4, ledger: su_kien }
        result:
          - Con cháu vui vẻ nghe lời dặn của bạn, dành riêng những hạt chắc nhất và cá khô tốt nhất cho mùa lạnh.
      - id: trao_lai_vat_gia_truyen
        text: Nhân dịp này trao lại công cụ đá hoặc chuỗi vỏ sò quý nhất của mình cho người kế tục
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: reputation, group: lang, value: 5 }
        result:
          - Người trẻ nâng niu kỷ vật thấm đẫm dấu vân tay của bạn với niềm tự hào sâu sắc.

  # 35. Ngày không còn đi xa
  - id: nt_ev_35_ngay_khong_con_di_xa
    title: Ngày không còn đi xa
    text:
      - Sức khỏe và đôi chân đã mỏi khiến bạn không còn theo các đoàn đi xa vượt đồi lội suối như trước nữa.
      - Trọng tâm cuộc sống của bạn nay chuyển hẳn sang những người ở gần, ký ức và việc truyền đạt kinh nghiệm bên mái lán.
    tags: [suc_khoe, gia_dinh]
    life_stages: [tuoi_gia]
    weight: 5
    cooldown_years: 10
    importance: 6
    icon: nha
    options:
      - id: cham_soc_tre_nho_va_giu_lua
        text: Ở nhà trông nom lũ trẻ, giữ cho bếp lửa luôn ấm và chuẩn bị nước sạch đón đoàn về
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: stress, value: -5 }
        result:
          - Khi đoàn người mệt mỏi trở về lúc chiều tà, bếp lửa ấm và nồi nước nóng của bạn là niềm an ủi lớn nhất.
      - id: ti_man_sua_chua_do_dac
        text: Ngồi dưới hiên tỉ mẩn mài lại từng mũi lao, vá lại từng tấm lưới cho con cháu
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: money, value: 3, ledger: su_kien }
        result:
          - Dù không đi xa, dấu ấn đôi tay của bạn vẫn hiện diện trong từng chuyến đi của cộng đồng.
      - id: ngam_nhin_bau_troi_suy_ngam
        text: Ngồi trên phiến đá quen thuộc, ngắm nhìn mây trôi và chiêm nghiệm về chặng đường đã qua
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: health, value: 2 }
        result:
          - Tâm hồn bạn nhẹ nhõm, thư thái hòa cùng nhịp thở của đất trời buổi sơ khai.

  # 36. Một lần cuối bên bếp lửa
  - id: nt_ev_36_mot_lan_cuoi_ben_bep_lua
    title: Một lần cuối bên bếp lửa
    text:
      - Đêm cuối mùa lạnh, cả khu cư trú quây quần đông đủ quanh bếp lửa lớn lắng nghe bạn.
      - Bạn chọn cách kể lại câu chuyện quan trọng nhất của đời mình cho những người ngồi quanh ánh lửa.
    tags: [gia_dinh, lang_xa]
    life_stages: [tuoi_gia]
    weight: 5
    cooldown_years: 12
    importance: 7
    icon: sach
    options:
      - id: ke_ve_long_dung_cam_va_sinh_ton
        text: Kể về những mùa khắc nghiệt nhất và dặn con cháu không bao giờ được bỏ cuộc trước thiên nhiên
        effects:
          - { type: skill_xp, skill: hoc_van, value: 16 }
          - { type: reputation, group: lang, value: 8 }
          - { type: stress, value: -6 }
        result:
          - Giọng kể trầm ấm của bạn hòa cùng tiếng củi nổ lách tách, thắp lên ngọn lửa nghị lực trong mắt những người trẻ.
      - id: ke_ve_tinh_nguoi_va_su_se_chia
        text: Nhắc nhở mọi người rằng con người chỉ sống sót được khi biết san sẻ từng nắm hạt và giữ ấm cho nhau
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 16 }
          - { type: reputation, group: lang, value: 8 }
          - { type: stress, value: -6 }
        result:
          - Những bàn tay quanh bếp lửa siết chặt lấy nhau khi nghe lời tâm huyết từ cả cuộc đời từng trải của bạn.
      - id: chi_dan_nhung_vung_dat_va_tri_thuc
        text: Truyền lại cặn kẽ những con đường, nguồn nước và bí quyết chế tác quý giá nhất mà mình biết
        effects:
          - { type: skill_xp, skill: hoc_van, value: 16 }
          - { type: reputation, group: lang, value: 8 }
        result:
          - Những người trẻ chăm chú khắc ghi từng lời chỉ dẫn của bạn như nhận lấy kho báu vô hình của tiền nhân.
