        text: Nhắc lại công sức năm xưa của họ và đề nghị để họ phụ sửa công cụ, dạy lớp trẻ tại nơi trú
        effects:
          - { type: reputation, value: 5 }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
        result:
          - Lời nói hợp tình hợp lý của bạn khiến mọi người tâm phục; người thợ săn già tiếp tục truyền dạy kinh nghiệm quý cho nhóm.
      - id: trich_phan_nha_minh_bu_them
        text: Tự nguyện san sẻ một phần thức ăn của gia đình mình để giữ hòa khí trong nhóm
