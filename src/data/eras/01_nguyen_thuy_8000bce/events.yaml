        effects:
          - { type: skill_xp, skill: muu_luoc, value: 14 }
          - { type: stress, value: -2 }
        result:
          - Gia đình có sẵn điểm lánh nạn an toàn nên không hề hoảng loạn khi mưa lớn kéo về.
      - id: chi_dan_vi_tri_hang_da_cao_tung_tru_nam_xua
        text: Nhớ lại một hang đá cao ráo từng trú ẩn thời trẻ và chỉ đường cho cả nhóm di chuyển lên đó
