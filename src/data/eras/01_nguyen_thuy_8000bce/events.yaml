          - { type: skill_xp, skill: quan_tri, value: 12 }
        result:
          - Bạn rút ra được bài học về độ ẩm của đất và chuẩn bị nền tảng tốt hơn cho vụ mùa tới.
      - id: tang_tim_kiem_thuc_an_tu_nhien
        text: Tạm giảm công chăm cây để tăng cường đi săn thú và thu hái hạt dại bù đắp
        effects:
          - { type: food, value: 3, ledger: su_kien }
          - { type: skill_xp, skill: sinh_ton, value: 14 }
        result:
