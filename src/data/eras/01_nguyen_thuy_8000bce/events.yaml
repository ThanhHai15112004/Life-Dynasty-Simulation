          - { type: reputation, value: 7 }
          - { type: stress, value: -4 }
        result:
          - Nhìn bộ công cụ của đời mình tiếp tục sống động trong tay người trẻ, bạn cảm thấy công sức cả đời được nối dài.
      - id: chia_mot_phan
