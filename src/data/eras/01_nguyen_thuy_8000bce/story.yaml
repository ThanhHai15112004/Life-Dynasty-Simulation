      label: con của người làm gốm
      condition: { var: world.polity_id, op: '==', value: dong_a_hoang_ha_8000bce }
      weight: 3
      death_factor: 1.05
      milestones:
        - age: 8
          chance: 0.85
          outcomes:
            - { weight: 3, text: '{name} ({label}) thích ngồi bên bờ suối nhào đất sét và nặn những vật đựng nhỏ.' }
        - age: 17
          chance: 0.8
          outcomes:
            - { weight: 3, text: '{name} ({label}) học cách trộn đất và canh lửa nung để bình gốm bớt nứt vỡ.' }
        - age: 27
          chance: 0.75
          outcomes:
            - { weight: 3, text: '{name} ({label}) trở thành người chế tác đồ gốm lành nghề, giúp các gia đình nấu và giữ thức ăn tốt hơn.' }
            - { weight: 2, text: 'Khi nhóm phải di chuyển sang vùng thiếu đất sét phù hợp, {name} ({label}) chuyển sang nghề đánh cá và đan giỏ.' }

    # 18. Đứa trẻ từng sống sót qua nạn đói
    - id: nt_peer_song_sot_nan_doi
      label: đứa trẻ từng sống sót qua nạn đói
      weight: 3
      death_factor: 1.3
      milestones:
        - age: 7
          chance: 0.85
          outcomes:
            - { weight: 3, text: 'Những năm đầu đời thiếu thức ăn khiến {name} ({label}) gầy gò và luôn nâng niu từng nắm hạt, mẩu củ khô.' }
        - age: 16
          chance: 0.8
          outcomes:
            - { weight: 3, text: '{name} ({label}) đặc biệt thận trọng trong việc phơi sấy và cất giữ thức ăn dự phòng.' }
        - age: 26
          chance: 0.75
          outcomes:
            - { weight: 3, text: 'Nhờ tính cẩn trọng tích trữ từ nhỏ, gia đình {name} ({label}) trụ vững qua một mùa khô khắc nghiệt.' }
            - { weight: 2, text: 'Ám ảnh cảnh thiếu đói năm xưa, {name} ({label}) quyết định rời đi ngay khi nguồn thức ăn quanh vùng có dấu hiệu suy giảm.' }

# ══════════════════ C. CÂU HỎI SUY NGẪM THEO CỘT MỐC CUỘC ĐỜI ══════════════════
reflections:
  # Tuổi 5 — Nhìn thế giới lần đầu
  - { age: 5, question: 'Đâu là nơi ngươi thấy an toàn nhất?' }
  - { age: 5, question: 'Ngươi sợ bóng tối, tiếng thú hay việc không còn ai ở bên?' }
  - { age: 5, question: 'Ai là người đã dạy ngươi tìm thức ăn?' }
  - { age: 5, question: 'Ngươi muốn lớn lên giống ai?' }
  - { age: 5, question: 'Nếu có một ngày được đi xa, ngươi muốn nhìn thấy điều gì?' }

  # Tuổi 15 — Trước ngưỡng trưởng thành
  - { age: 15, question: 'Ngươi đã đủ khả năng tự kiếm sống chưa?' }
  - { age: 15, question: 'Có điều gì người lớn làm mà ngươi vẫn chưa hiểu?' }
  - { age: 15, question: 'Ngươi muốn đi theo con đường của gia đình hay thử một lối sống khác?' }
  - { age: 15, question: 'Ai là người ngươi tin tưởng nhất?' }
  - { age: 15, question: 'Nếu phải rời nơi đã lớn lên, ngươi sẽ mang theo thứ gì?' }

  # Tuổi 30 — Những năm gánh vác
  - { age: 30, question: 'Ngươi đã xây dựng được cuộc sống mình mong muốn chưa?' }
  - { age: 30, question: 'Ai đang phụ thuộc vào những quyết định của ngươi?' }
  - { age: 30, question: 'Thành tựu lớn nhất của ngươi đến từ kỹ năng, quan hệ hay may mắn?' }
  - { age: 30, question: 'Điều gì ngươi từng tin khi trẻ nhưng nay không còn tin nữa?' }
  - { age: 30, question: 'Nếu được chọn lại một lần, ngươi sẽ ở lại hay rời đi?' }

  # Tuổi 50 — Những mùa đã qua
  - { age: 50, question: 'Ngươi còn có thể làm những việc từng làm khi trẻ không?' }
  - { age: 50, question: 'Những người quan trọng nhất trong đời ngươi hiện đang ở đâu?' }
  - { age: 50, question: 'Điều gì ngươi đã truyền lại cho thế hệ sau?' }
  - { age: 50, question: 'Có ai ngươi vẫn muốn gặp thêm một lần?' }
  - { age: 50, question: 'Những năm đã qua khiến ngươi hối tiếc điều gì?' }

  # Tuổi 70 — Lời kể cuối cùng
  - { age: 70, question: 'Ngươi đã sống qua bao nhiêu mùa mà người thân không còn được chứng kiến?' }
  - { age: 70, question: 'Ai sẽ nhớ câu chuyện của ngươi?' }
  - { age: 70, question: 'Nếu những đứa trẻ hỏi cuộc đời có ý nghĩa gì, ngươi sẽ nói thế nào?' }
  - { age: 70, question: 'Ngươi muốn người khác giữ lại điều gì sau khi mình rời đi?' }
  - { age: 70, question: 'Có phải sống lâu cũng đồng nghĩa với sống một cuộc đời tốt đẹp?' }

# ══════════════════ E. VĂN BIA CUỐI ĐỜI — LỜI KỂ CỦA HẬU THẾ ══════════════════
epitaphs:
  # 12. Cuộc đời người chết trẻ
  - condition: { var: player.age, op: '<', value: 22 }
    weight: 10
    text: 'Người ấy chưa có đủ thời gian để hoàn thành những điều từng mong muốn. Một tai nạn đã kết thúc cuộc đời đang mở ra. Những người còn sống vẫn nhớ tiếng cười, những lời hứa và những ngày cùng lớn lên.'

  # 11. Cuộc đời người sống rất lâu
  - condition: { var: player.age, op: '>=', value: 65 }
    weight: 8
    text: 'Người ấy đã nhìn thấy những đứa trẻ lớn lên, trở thành cha mẹ rồi già đi. Nhiều người từng quen biết nay chỉ còn trong ký ức. Sống lâu giúp người ấy chứng kiến nhiều đổi thay, nhưng cũng đồng nghĩa phải trải qua nhiều lần chia ly.'

  # 01. Cuộc đời người săn thú
  - condition: { var: player.career, op: '==', value: nt_nguoi_san_thu }
    weight: 6
    text: 'Người ấy từng đi qua những khu rừng xa, biết dấu chân thú và từng trở về với thức ăn khi nhiều người đã tuyệt vọng. Đến khi không còn đủ sức cầm lao, người ấy dạy lớp trẻ cách lắng nghe khu rừng. Những chuyến săn vẫn tiếp tục sau khi người ấy qua đời.'

  # 02. Cuộc đời người hái lượm
  - condition: { var: player.career, op: 'in', value: [nt_nguoi_thu_hai, nt_nguoi_danh_ca] }
    weight: 6
    text: 'Người ấy không để lại công trình lớn. Nhưng nhiều gia đình từng sống qua mùa đói nhờ những nguồn cây mà người ấy tìm ra. Có những điều quan trọng với cuộc sống nhưng không bao giờ được ghi thành tên tuổi.'

  # 03. Cuộc đời người cha hoặc mẹ
  - condition: { var: player.children_count, op: '>=', value: 3 }
    weight: 5
    text: 'Người ấy dành phần lớn cuộc đời để chăm sóc gia đình. Những đứa trẻ từng được bế trong vòng tay nay đã có thể tự kiếm sống. Cuộc đời ấy không tránh khỏi mất mát, nhưng tình thương vẫn còn trong những người ở lại.'

  # 04. Cuộc đời người chế tác
  - condition: { var: player.career, op: 'in', value: [nt_nguoi_che_tac_da, nt_nguoi_che_tac_xuong_go, nt_nguoi_dan_soi, nt_nguoi_lam_gom] }
    weight: 6
    text: 'Bàn tay người ấy từng biến đá thô thành công cụ hữu ích. Một vài công cụ đã hỏng, những công cụ khác được người đời sau tiếp tục sử dụng. Kỹ thuật ấy còn sống ngay cả khi người tạo ra nó đã mất.'

  # 05. Cuộc đời người dẫn đường
  - condition: { var: player.career, op: 'in', value: [nt_nguoi_tim_duong, nt_nguoi_tim_nguon_nuoc, nt_nguoi_trao_doi] }
    weight: 6
    text: 'Người ấy biết những con đường mà nhiều người không dám đi. Có chuyến đi mang về thức ăn, có chuyến đi chỉ đem lại thương tích. Nhưng những tuyến đường được khám phá đã giúp người khác nhìn thấy thế giới xa hơn.'

  # 06. Cuộc đời người định cư
  - condition: { var: player.career, op: 'in', value: [nt_nguoi_khai_thac_ngu_coc, nt_nguoi_cham_giu_dong_vat, nt_nguoi_bao_quan_thuc_an] }
    weight: 6
    text: 'Người ấy sinh ra khi nơi này chỉ có vài chỗ trú. Khi qua đời, nhiều gia đình đã cùng sinh sống ở đây. Nơi cư trú có thể sẽ thay đổi trong tương lai, nhưng dấu vết một đời xây dựng vẫn còn.'

  # 07. Cuộc đời người lưu lạc
  - condition: { var: player.origin, op: 'in', value: [nt_dua_tre_nhom_di_cu, nt_dua_tre_khong_nguoi_than] }
    weight: 5
    text: 'Người ấy đã rời bỏ nhiều nơi và mất đi nhiều người thân. Sau những năm dài di chuyển, cuối cùng người ấy tìm được một cộng đồng sẵn lòng chia sẻ thức ăn và nơi trú. Không phải ai có quê hương cũng sinh ra ở đó.'

  # 08. Cuộc đời người thất bại
  - condition: { all: [{ var: player.sick, op: '==', value: true }, { var: player.satisfaction, op: '<', value: 45 }] }
    weight: 5
    text: 'Người ấy từng mong trở thành thợ săn giỏi, nhưng thương tích khiến ước mơ không thể thành. Nhiều năm sau, người ấy tìm được vai trò khác trong cộng đồng. Cuộc đời không đi theo mong muốn ban đầu, nhưng cũng không vì thế mà hoàn toàn vô nghĩa.'

  # 09. Cuộc đời người bị lãng quên
  - condition: { all: [{ var: player.reputation, op: '<', value: 10 }, { var: player.children_count, op: '==', value: 0 }] }
    weight: 4
    text: 'Không còn nhiều người nhớ tên người ấy. Những nơi từng đi qua đã thay đổi, và những người từng cùng sống phần lớn cũng không còn. Nhưng người ấy đã từng có một cuộc đời, với những mùa vui, nỗi đau và lựa chọn của riêng mình.'

  # 10. Cuộc đời người được tin cậy
  - condition: { var: player.reputation, op: '>=', value: 35 }
    weight: 5
    text: 'Trong những năm khó khăn, nhiều người từng tìm đến người ấy để hỏi ý kiến. Có quyết định mang lại bình yên, cũng có quyết định khiến người ấy phải hối tiếc. Khi người ấy qua đời, cộng đồng vẫn tiếp tục sống với kết quả của những lựa chọn đó.'

  # 13. Cuộc đời người giữ gìn tri thức
  - condition: { var: player.career, op: 'in', value: [nt_nguoi_gin_giu_chuyen_ke, nt_nguoi_to_chuc_nghi_thuc, nt_nguoi_cham_soc] }
    weight: 6
    text: 'Người ấy dành nhiều năm truyền lại những hiểu biết học được từ người đi trước. Có điều được ghi nhớ, có điều biến mất theo thời gian. Nhưng những người trẻ từng lắng nghe đã mang một phần cuộc đời ấy đi tiếp.'

  # 14. Cuộc đời người xây dựng
  - condition: { var: player.career, op: '==', value: nt_nguoi_dung_noi_tru }
    weight: 6
    text: 'Những bức vách sẽ đổ, mái che sẽ mục và nơi cư trú rồi có thể bị bỏ hoang. Nhưng trong những mùa người ấy còn sống, công sức xây dựng đã giúp nhiều người có nơi tránh gió mưa. Đó là di sản của một đời lao động.'

  # 15. Cuộc đời người hòa giải
  - condition: { var: player.career, op: '==', value: nt_nguoi_dieu_hoa }
    weight: 6
    text: 'Người ấy từng đứng giữa những gia đình bất hòa. Không phải cuộc tranh cãi nào cũng kết thúc tốt đẹp, nhưng có những người đã cùng chia sẻ thức ăn thay vì quay lưng với nhau. Sự bình yên ấy không dễ nhìn thấy như một công trình đá, nhưng cũng cần rất nhiều công sức.'

  # 16. Cuộc đời đầy biến cố (mặc định / bao quát)
  - weight: 2
    text: 'Người ấy sinh ra ở một nơi, lớn lên ở một nơi khác và chết giữa những người không cùng chung tuổi thơ. Đã từng có mùa thức ăn dồi dào, những ngày đói và những cuộc chia ly. Không ai có thể đoán trước cuộc đời ấy sẽ đi đến đâu.'
