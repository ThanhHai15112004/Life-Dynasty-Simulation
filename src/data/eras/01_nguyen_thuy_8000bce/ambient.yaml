# ══════════════════════════════════════════════════════════════════════════════
# MỐC 01: BÌNH MINH NHÂN LOẠI (8000 TCN — nguyen_thuy_8000bce)
# Nhật ký dòng đời (ambient.yaml):
# - 15 biến cố khởi đầu theo xuất thân (nt_start_01..15)
# - Ghi đè thông báo hệ thống (sys.*) theo ngữ cảnh 8000 TCN
# - 40 thông báo & nhật ký đời sống từ Mục 11.D theo các giai đoạn đời
# ══════════════════════════════════════════════════════════════════════════════
templates:
  # ══════════════════ 15 BIẾN CỐ KHỞI ĐẦU THEO XUẤT THÂN (MỤC 1) ══════════════════
  - id: nt_start_01_san_thu
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của người săn thú tại {world.settlement}. Vừa qua một người thân bị thương trong chuyến săn khiến gia đình mất đi nguồn thức ăn quan trọng.'

  - id: nt_start_02_hai_luom
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của người hái lượm tại {world.settlement}. Một bãi cây quen thuộc vừa bị lũ phá hủy, buộc gia đình phải tìm kiếm khu vực thu hái mới.'

  - id: nt_start_03_danh_ca_song
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của người đánh cá ven sông tại {world.settlement}. Một trận lũ vừa làm thay đổi dòng chảy và cuốn đi bãi đánh cá quen thuộc của gia đình.'

  - id: nt_start_04_ven_bien
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, lớn lên trong cộng đồng ven biển tại {world.settlement}. Nước biển dâng dần đang làm hư hại khu cắm trại cũ của gia đình.'

  - id: nt_start_05_di_cu
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, đứa trẻ của nhóm người di cư theo mùa tại {world.settlement}. Nhóm vừa quyết định không quay về bãi trú cũ, khiến gia đình đứng trước lựa chọn đi theo hay ở lại.'

  - id: nt_start_06_ngu_coc
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của người thu hái và trồng ngũ cốc tại {world.settlement}. Một vụ thu hoạch kém vừa qua khiến gia đình phải xin chia sẻ hạt từ các hộ khác.'

  - id: nt_start_07_dung_nha
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của người dựng nhà tại {world.settlement}. Những trận mưa lớn làm sạt một phần tường đất đá, buộc gia đình phải lựa chọn sửa lại nơi ở hay chuyển đi.'

  - id: nt_start_08_che_tac_da
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của người chế tác đá tại {world.settlement}. Một khối đá lạ vừa được đưa đến khu cư trú, mở ra cơ hội học kỹ thuật ghè tách mới.'

  - id: nt_start_09_giu_kho
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của người giữ kho thức ăn tại {world.settlement}. Một phần kho hạt vừa bị ẩm mốc và gia đình đang được cộng đồng yêu cầu giải thích nguyên nhân.'

  - id: nt_start_10_hang_da
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của cư dân hang đá tại {world.settlement}. Một mùa mưa kéo dài làm nước tràn ngập nền hang, cả nhóm phải gấp rút tìm nơi trú mới.'

  - id: nt_start_11_ho_sahara
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của cộng đồng ven hồ tại {world.settlement}. Mùa này mặt hồ cạn bất thường và các đàn thú hoang không còn tìm đến bờ nước như mọi năm.'

  - id: nt_start_12_lam_gom
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của người làm gốm sơ khai tại {world.settlement}. Một chiếc nồi đất vừa nứt toác trong lúc nung, nhưng người thân đã nhận ra cách trộn đất để cải thiện sản phẩm.'

  - id: nt_start_13_tim_da_quy
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của người tìm đá và nguyên liệu hiếm tại {world.settlement}. Người thân vừa mang về những mảnh đá obsidian sắc bén từ mạng lưới trao đổi xa, làm thay đổi vị thế của gia đình.'

  - id: nt_start_14_cham_soc
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con của người chăm sóc cộng đồng tại {world.settlement}. Một đứa trẻ trong nhóm đang sốt cao, buộc gia đình đối diện giới hạn của những cách chăm sóc quen thuộc.'

  - id: nt_start_15_khong_nguoi_than
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, đứa trẻ không còn người chăm sóc ruột thịt tại {world.settlement}. Một gia đình trong nhóm đề nghị nhận bạn về sống cùng, nhưng bạn phải rời xa người từng đùm bọc mình.'

  # ══════════════════ GHI ĐÈ THÔNG BÁO HỆ THỐNG (sys.*) — MỤC 11.D ══════════════════
  - id: sys.khoi_dau
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, sinh sống cùng cộng đồng tại {world.settlement}. Nguồn dự trữ của gia đình hiện có {household.food} {lex.food}.'

  - id: sys.sinh_nhat
    kind: bao_cao
    importance: 1
    icon: sinh_nhat
    short: 'qua mùa thứ {age}'
    variants:
      - 'Thêm một mùa mưa nắng đi qua: bạn đã sống trọn {age} tuổi.'
      - 'Người thân nhìn vết khắc bên vách đá: bạn vừa tròn {age} tuổi.'

  - id: sys.giai_doan_doi
    kind: he_thong
    importance: 6
    highlight: true
    icon: moc_doi
    variants:
      - 'Bạn đã bước sang một giai đoạn mới của cuộc đời ({stage}).'
      - 'Một chặng đời mới mở ra bên bếp lửa cộng đồng: {stage}.'

  - id: sys.ky_nang_tang
    kind: bao_cao
    importance: 2
    icon: ky_nang
    short: '{skill} lên bậc {level}'
    variants:
      - 'Kinh nghiệm {skill} của bạn đã tăng (bậc {level}).'
      - 'Qua nhiều ngày thực hành và quan sát, kỹ năng {skill} của bạn đạt bậc {level}.'

  - id: sys.sinh_con
    kind: he_thong
    importance: 7
    highlight: true
    tone: vui
    icon: tre_em
    variants:
      - 'Một đứa trẻ đã chào đời. Gia đình có thêm thành viên và trách nhiệm chăm sóc.'
      - 'Gia đình có thêm một thành viên cần được chăm sóc bên bếp lửa.'

  - id: sys.mac_benh
    kind: he_thong
    importance: 5
    tone: buon
    icon: benh
    variants:
      - 'Một thành viên trong gia đình đang bị bệnh ({title}).'
      - 'Cơ thể suy yếu vì {title}, cần người thân ở bên chăm sóc và giữ ấm.'

  - id: sys.khoi_benh
    kind: bao_cao
    importance: 3
    tone: vui
    icon: suc_khoe
    variants:
      - 'Sức khỏe của bạn đang phục hồi sau chấn thương và cơn bệnh ({title}).'
      - 'Qua những ngày nghỉ ngơi bên bếp lửa, cơn {title} đã lui dần.'

  - id: sys.nguoi_than_mat
    kind: he_thong
    importance: 8
    highlight: true
    tone: buon
    icon: tang
    variants:
      - '{call} từng chăm sóc và gắn bó với bạn đã qua đời ở tuổi {age} vì {cause}.'
      - 'Bếp lửa lặng đi: {call} đã khép lại cuộc đời ở tuổi {age} vì {cause}.'
    effects:
      - { type: stress, value: 12 }

  - id: sys.nguoi_lang_mat
    kind: nguoi_quanh
    importance: 3
    tone: buon
    icon: tang
    variants:
      - 'Một người từng cùng bạn lớn lên hoặc sinh sống trong cộng đồng ({call}) đã qua đời ở tuổi {age}.'
      - '{call} trong nhóm không qua khỏi ở tuổi {age} vì {cause}.'

  - id: sys.doi_kem
    kind: he_thong
    importance: 6
    highlight: true
    tone: buon
    icon: mat_mua
    variants:
      - 'Nguồn thức ăn dự trữ đang giảm nhanh. Cả gia đình phải đào rễ cây và nhặt hạt dại cầm hơi qua ngày.'
      - 'Thức ăn trong khu vực trở nên khó tìm hơn, phần dự trữ đã cạn kiệt.'
    effects:
      - { type: stress, value: 6 }

  - id: sys.diem_bao_om_yeu
    kind: diem_bao
    importance: 6
    highlight: true
    tone: buon
    icon: benh
    variants:
      - 'Cơ thể bạn không còn hồi phục nhanh như trước. Cuộc đời bạn đang đi đến những năm cuối cùng.'
      - 'Hơi thở nặng nhọc mỗi khi gió lạnh tràn về — cuộc đời bạn đang đi đến những năm cuối cùng.'

  - id: sys.ket_hon
    kind: he_thong
    importance: 7
    highlight: true
    tone: vui
    icon: gia_dinh
    variants:
      - 'Bạn và {partner} chính thức gắn bó bên nhau, cùng chia sẻ thức ăn và dựng nơi trú chung.'

  - id: sys.lam_chu_ho
    kind: he_thong
    importance: 7
    highlight: true
    icon: nha
    variants:
      - 'Người trẻ trong gia đình đã có thể tự đảm nhiệm nhiều công việc — từ nay bạn gánh vác vai trò trụ cột nơi trú.'

