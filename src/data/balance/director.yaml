# [0] Event Director (GDD 05 §5): điều nhịp, không gian lận xúc xắc
max_decisions_per_year: 3
base_monthly_chance: 0.14
# Đã gặp n lần thì trọng số × hệ số^n: chuyện mới được ưu tiên, chuyện cũ vẫn có thể quay lại
repeat_weight_factor: 0.05   # [1.8] hạ từ 0.08: ưu tiên tối đa sự kiện chưa từng gặp trong đời
ambient_repeat_weight_factor: 0.25
min_months_between: 2
# [1] Chuyện nhỏ: hiện ngay trong nhật ký, dừng thời gian chờ chọn (bật "Tự quyết chuyện nhỏ" thì game chọn phương án default)
# Nhịp mục tiêu: quyết định + chuyện nhỏ ≈ 1,5–2,5 lần dừng/năm (KPI pauses_per_year)
minor:
  monthly_chance: 0.09            # [1.5] hạ từ 0.12: ~0,5–0,6 chuyện nhỏ/năm
  max_per_year: 2
  min_months_between: 4
  min_months_after_decision: 2     # vừa có quyết định thì để người chơi thở vài tháng
  max_repeats_per_life: 1          # [1.5] mỗi chuyện nhỏ chỉ gặp một lần trong đời (trước 2 lần, đời nào cũng gặp lại)
# Năm chưa có quyết định nào: mỗi tháng trôi qua cộng thêm xác suất (KPI 1–2 quyết định/năm)
drought_bonus_per_month: 0.015
tension:
  decay_per_month: 0.4
  high_threshold: 8
  high_factor: 0.35        # căng thẳng cao → bớt sự kiện, cho người chơi thở
ambient:
  # Năm có tang (R6): nhân trọng số mẫu nhật ký theo tông
  mourning_tone_factor: { vui: 0.15, an_ui: 4 }
  merge_importance_max: 2  # dòng có điểm quan trọng ≤ mức này được gộp (R4)
  digest_template: sys.tong_hop_nam
  digest_separator: ', '
decision_log_template: '{title} — {result}'
chance_display:
  # Khoảng xác suất hiển thị = p ± độ rộng; kỹ năng cao → khoảng hẹp (kính lúp thông tin)
  base_spread: 0.3
  spread_per_level: 0.02
  min_spread: 0.06
# [2] Đỡ xui (bad-luck protection): sau chuỗi biến cố xấu liên tiếp thì nâng trọng số sự kiện cứu vãn
bad_luck_protection:
  consecutive_bad_threshold: 3
  salvation_event_boost: 2.5
  bad_event_dampen: 0.4
  salvation_tags: [tinh_lang, co_hoi, gia_dinh, mua_mang]
  bad_tags: [no_nan, benh_tat, tai_hoa, mat_mua]
# Một sự kiện quyết định gặp tối đa chừng này lần mỗi đời (trước không giới hạn: bà mối gõ cửa 10 lần một đời)
max_decision_repeats_per_life: 3
# "Chưa phải lúc" chỉ hẹn lại khi sự kiện mới gặp dưới chừng này lần; quá thì thôi, chuyện tự qua
max_defer_fires: 2
# Bước ngoặt lớn (importance ≥ 8: cháy nhà, vỡ đê, bị bắt lính...) cách nhau ít nhất 4 năm
major_events: { min_importance: 8, min_gap_years: 4 }
# Sự kiện quyết định không khai báo life_stages chỉ phát cho người lớn (trẻ con không quyết chuyện mua ruộng, vay nợ)
default_event_life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
# [9] Ngưỡng độ dày nội dung tối thiểu (validate cảnh báo khi nghề, giai đoạn đời hoặc xuất thân ít sự kiện hơn ngưỡng)
content_density:
  min_events_per_origin: 18
  min_events_per_life_stage: 20
  min_events_per_career_depth:
    sau: 20
    vua: 4
    nhe: 3
