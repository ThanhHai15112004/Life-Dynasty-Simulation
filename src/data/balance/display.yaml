  - { min: 20, key: axis.band.low }
  - { min: 0, key: axis.band.very_low }
# Kho thóc đủ ăn ít hơn chừng này tháng thì cảnh báo
food_months_warning: 2
# Việc dang dở (GDD 01 §10.1) — luôn có vài việc chờ để "chơi thêm một năm nữa"
open_loop_rules:
  - condition: { var: world.months_to_harvest, op: between, value: [1, 3] }
    text: 'Còn {world.months_to_harvest} tháng nữa đến mùa gặt'
  - condition: { var: world.months_to_harvest, op: '==', value: 0 }
    text: 'Đang mùa gặt'
  - condition: { var: household.debt, op: '>', value: 0 }
    text: 'Món nợ {household.debt} quan, lãi mẹ đẻ lãi con'
  - condition: { var: household.debt, op: '>', value: 35 }
    text: 'Nợ sắp quá ngưỡng — chủ nợ có thể xiết ruộng cuối năm'
  - condition: { var: household.food_months, op: '<', value: 3 }
    text: 'Kho thóc chỉ đủ ăn {household.food_months} tháng'
  - condition: { var: player.age, op: between, value: [14, 15] }
    text: 'Sắp đến tuổi trưởng thành'
  - condition: { var: player.health, op: '<', value: 40 }
    text: 'Sức khỏe đang sa sút'
  - condition: { var: player.sick, op: '==', value: true }
    text: 'Đang mang bệnh trong người, cần nghỉ ngơi hoặc chạy chữa'
  - condition:
      all:
        - { var: player.age, op: between, value: [18, 32] }
        - { var: player.married, op: '==', value: false }
    text: 'Đã đến tuổi dựng vợ gả chồng'
# Dòng nhật ký có điểm quan trọng từ mức này trở lên được in đậm và vào bản tổng kết đời
highlight_importance: 6
life_map_marks_per_year: 2   # số biểu tượng dấu mốc trên một ô Bản đồ cuộc đời
chronicle_shown: 6           # số biến cố biên niên gần nhất hiện trên màn hình
life_map_extra_rows: 1       # bản đồ cuộc đời vẽ thêm chừng này hàng sau tuổi thọ kỳ vọng
default_language: vi
journal_years_shown: 8
