# [0] Hiển thị bằng lời (GDD 08 §6.4): dải giá trị → khóa chữ trong src/data/lang
health_bands:
  - { min: 85, key: health.very_good }
  - { min: 70, key: health.good }
  - { min: 50, key: health.fair }
  - { min: 30, key: health.weak }
  - { min: 15, key: health.sick }
  - { min: 0, key: health.dying }
stress_bands:
  - { min: 85, key: stress.breaking }
  - { min: 60, key: stress.high }
  - { min: 30, key: stress.mild }
  - { min: 0, key: stress.calm }
chance_bands:
  - { min: 0.82, key: chance.very_high }
  - { min: 0.65, key: chance.high }
  - { min: 0.45, key: chance.mid }
  - { min: 0.25, key: chance.low }
  - { min: 0, key: chance.very_low }
reputation_bands:
  - { min: 40, key: reputation.revered }
  - { min: 15, key: reputation.respected }
  - { min: -10, key: reputation.normal }
  - { min: -30, key: reputation.disliked }
  - { min: -999, key: reputation.shunned }
satisfaction_bands:
  - { min: 80, key: satisfaction.fulfilled }
  - { min: 60, key: satisfaction.content }
  - { min: 40, key: satisfaction.ordinary }
  - { min: 20, key: satisfaction.unfulfilled }
  - { min: 0, key: satisfaction.bitter }
summary_axis_bands:
  - { min: 80, key: axis.band.very_high }
  - { min: 60, key: axis.band.high }
  - { min: 40, key: axis.band.mid }
  - { min: 20, key: axis.band.low }
  - { min: 0, key: axis.band.very_low }
# Kho thóc đủ ăn ít hơn chừng này tháng thì cảnh báo
food_months_warning: 2
# [1.5] Gia cảnh nhà cha mẹ (chữ) khi bạn chưa làm chủ hộ, theo tài sản ròng của hộ
family_bands:
  - { min: 1200, key: family.band.phu_ho }
  - { min: 500, key: family.band.kha_gia }
  - { min: 150, key: family.band.du_an }
  - { min: -99999, key: family.band.ngheo }
# [1.5] Thẻ tài sản kiểu 1in8b: quan/sào là đơn vị chính, dòng nhỏ quy ra giá ngày nay cho dễ hình dung
wealth:
  modern_per_quan: 300000   # neo theo giá thóc: 1 thúng ≈ 20 kg ≈ 150.000 đ, giá gốc 0,5 quan/thúng
  m2_per_sao: 360           # sào Bắc Bộ
  year_lines: 5             # chốt sổ năm: tối đa chừng này dòng lý do, còn lại gộp "Chuyện khác"
  line_min: 0.5             # bỏ qua khoản nhỏ hơn chừng này quan
# Việc dang dở (GDD 01 §10.1) — luôn có vài việc chờ để "chơi thêm một năm nữa"
open_loop_rules:
  - condition: { var: world.months_to_harvest, op: between, value: [1, 3] }
    text: 'Còn {world.months_to_harvest} tháng nữa đến mùa gặt'
  - condition: { var: world.months_to_harvest, op: '==', value: 0 }
    text: 'Đang mùa gặt'
  - condition: { var: household.debt, op: '>', value: 0 }
    text: 'Món nợ {household.debt} quan, lãi mẹ đẻ lãi con'
  - condition: { var: household.debt, op: '>', value: 35 }
    text: 'Nợ sắp quá ngưỡng — chủ nợ có thể xiết ruộng cuối năm'
  - condition: { var: household.food_months, op: '<', value: 3 }
    text: 'Kho thóc chỉ đủ ăn {household.food_months} tháng'
  - condition: { var: player.age, op: between, value: [14, 15] }
    text: 'Sắp đến tuổi trưởng thành'
  - condition: { var: player.health, op: '<', value: 40 }
    text: 'Sức khỏe đang sa sút'
  - condition: { var: player.sick, op: '==', value: true }
    text: 'Đang mang bệnh trong người, cần nghỉ ngơi hoặc chạy chữa'
  - condition:
      all:
        - { var: player.age, op: between, value: [18, 32] }
        - { var: player.married, op: '==', value: false }
    text: 'Đã đến tuổi dựng vợ gả chồng'
# Dòng nhật ký có điểm quan trọng từ mức này trở lên được in đậm và vào bản tổng kết đời
highlight_importance: 6
life_map_marks_per_year: 2   # số biểu tượng dấu mốc trên một ô Bản đồ cuộc đời
chronicle_shown: 6           # số biến cố biên niên gần nhất hiện trên màn hình
life_map_extra_rows: 1       # bản đồ cuộc đời vẽ thêm chừng này hàng sau tuổi thọ kỳ vọng
# [1] Gợi ý tác động dưới mỗi trọng tâm (kỹ năng được XP luôn hiện trước, rồi tới các chỉ số này)
focus_hints:
  - { target: harvest.yield, key: hint.harvest, higher_is_good: true }
  - { target: health.monthly, key: hint.health, higher_is_good: true }
  - { target: stress.monthly, key: hint.stress, higher_is_good: false }
  - { target: living.cost, key: hint.cost, higher_is_good: false }
  - { target: food.consumption, key: hint.food, higher_is_good: false }
  - { target: death_risk, key: hint.death_risk, higher_is_good: false }
focus_hints_max: 3
# [1] Bậc kỹ năng hiện bằng chữ (bậc 0 = chưa biết, ẩn khỏi bảng)
skill_bands:
  - { min: 15, key: skill.band.lao_luyen }
  - { min: 10, key: skill.band.tinh_thong }
  - { min: 6, key: skill.band.gioi }
  - { min: 3, key: skill.band.kha }
  - { min: 1, key: skill.band.moi_hoc }
  - { min: 0, key: skill.band.chua_biet }
default_language: vi
journal_years_shown: 8
