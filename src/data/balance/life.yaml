# [0] Đời sống: giai đoạn đời, sức khỏe, tử vong (GDD 01 §4, §8)
life_stages:
  # ambient_lines: số dòng nhật ký thường mỗi năm [tối thiểu, tối đa] (R3)
  # default_focuses: lớn sang giai đoạn này thì tự chọn trọng tâm đầu tiên khả dụng (nghề nhà có default_focus thì ưu tiên)
  - { id: au_tho, name: Ấu thơ, min_age: 0, ambient_lines: [2, 4], decisions: false, can_choose_focus: false, default_focuses: [] }
  - { id: thieu_thoi, name: Thiếu thời, min_age: 6, ambient_lines: [4, 7], decisions: true, can_choose_focus: true, default_focuses: [phu_viec_dong, phu_sap, hoc_chu, giup_viec_nha] }
  - { id: thanh_nien, name: Thanh niên, min_age: 16, ambient_lines: [4, 8], decisions: true, can_choose_focus: true, default_focuses: [lam_an, kinh_doanh, hoc_tap, giao_luu] }
  - { id: lap_nghiep, name: Lập nghiệp, min_age: 26, ambient_lines: [4, 8], decisions: true, can_choose_focus: true, default_focuses: [lam_an, kinh_doanh, hoc_tap, gia_dinh] }
  - { id: trung_nien, name: Trung niên, min_age: 41, ambient_lines: [4, 8], decisions: true, can_choose_focus: true, default_focuses: [lam_an, kinh_doanh, gia_dinh, suc_khoe] }
  - { id: tuoi_gia, name: Tuổi già, min_age: 56, ambient_lines: [3, 7], decisions: true, can_choose_focus: true, default_focuses: [day_con_chau, suc_khoe, le_chua] }

health:
  max: 100
  # Trần sức khỏe theo tuổi: người già không thể khỏe như trai tráng
  cap_by_age:
    - { age: 0, cap: 90 }
    - { age: 18, cap: 100 }
    - { age: 40, cap: 95 }
    - { age: 55, cap: 85 }
    - { age: 70, cap: 70 }
    - { age: 85, cap: 55 }
  npc_default: 70

stress:
  max: 100
  start: 20

mortality:
  # Tỷ lệ chết mỗi NĂM theo tuổi khi sức khỏe bình thường; engine tự quy ra tháng.
  # Mục tiêu KPI: tử vong trẻ em 0–5 tuổi ~15–25%, tuổi thọ người chơi 50–65.
  annual_by_age:
    - { age: 0, rate: 0.09 }
    - { age: 1, rate: 0.065 }
    - { age: 3, rate: 0.036 }
    - { age: 5, rate: 0.012 }
    - { age: 10, rate: 0.004 }
    - { age: 16, rate: 0.005 }
    - { age: 30, rate: 0.007 }
    - { age: 40, rate: 0.011 }
    - { age: 50, rate: 0.02 }
    - { age: 60, rate: 0.04 }
    - { age: 70, rate: 0.085 }
    - { age: 80, rate: 0.18 }
    - { age: 90, rate: 0.4 }
  # Hệ số nhân theo sức khỏe hiện tại
  health_factor:
    - { health: 0, factor: 500 }
    - { health: 10, factor: 60 }
    - { health: 25, factor: 6 }
    - { health: 40, factor: 2 }
    - { health: 60, factor: 1.1 }
    - { health: 75, factor: 0.9 }
    - { health: 100, factor: 0.7 }
  max_monthly: 0.5
  # Nguyên nhân chết: chọn theo trọng số trong số nguyên nhân hợp điều kiện (biến self.*)
  causes:
    - id: benh
      name: bạo bệnh
      weight: 4
      weight_modifiers:
        - { condition: { var: self.health, op: '<', value: 40 }, factor: 3 }
    - id: sot_ret
      name: sốt rét
      weight: 1
      weight_modifiers:
        - { condition: { var: world.season, op: 'in', value: [ha, thu] }, factor: 2.5 }
    - id: soi
      name: lên sởi
      weight: 6
      condition: { var: self.age, op: '<', value: 10 }
    - id: gia_yeu
      name: tuổi già sức yếu
      weight: 1
      condition: { var: self.age, op: '>=', value: 55 }
      weight_modifiers:
        - { condition: { var: self.age, op: '>=', value: 65 }, factor: 6 }
    - id: doi_ret
      name: đói rét
      weight: 0.2
      weight_modifiers:
        - { condition: { var: household.living_standard, op: '==', value: kho_cuc }, factor: 10 }
        - { condition: { var: world.season, op: '==', value: dong }, factor: 2 }
    - id: lao_luc
      name: lao lực kiệt sức
      weight: 0.3
      weight_modifiers:
        - { condition: { var: self.stress, op: '>=', value: 80 }, factor: 8 }
    - id: tai_nan
      name: tai nạn bất ngờ
      weight: 0.35
      unexpected: true
  # Bad-luck protection: tối đa số cái chết hoàn toàn bất ngờ trong hộ mỗi năm
  max_unexpected_household_deaths_per_year: 1

age_groups:
  - { id: tre_nho, max_age: 5 }
  - { id: thieu_nien, max_age: 15 }
  - { id: nguoi_lon, max_age: 55 }
  - { id: nguoi_gia, max_age: 999 }
adult_age: 16
male_ratio: 0.5
npc_trait_count: 1

marriage:
  min_age: 16
  fertility_age_f: [17, 42]
  base_conception_chance_month: 0.03
  pregnancy_months: 9
  max_children_in_household: 5
  spouse_age_offset: [-3, 3]
  spouse_health: [65, 85]
  newborn_health: [60, 88]
  conception_health_ref: 75
  conception_health_factor: [0.4, 1.2]
  wedding_cutscene: ket_hon
  birth_cutscene: sinh_con

max_concurrent_diseases: 2

# [1] Chạy chữa bệnh (giá và xác suất khỏi ở diseases.yaml). Chưa làm chủ hộ thì nhà tự lo cho bệnh nặng.
treatment:
  retry_months: 2
  auto_severities: [nang, nguy_kich]
  auto_keep_months: 2

# [1] Nghề riêng khi bắt đầu tự lập (đến tuổi trưởng thành): nhà có nghề thì phụ việc nhà, không thì thất nghiệp.
# Làm chủ hộ thì thừa kế nghề nhà, kinh nghiệm phụ việc được tính theo hệ số dưới.
career_start:
  helper: phu_gia_dinh
  jobless: that_nghiep
  inherit_merit_factor: 1

happiness:
  start: 50
  min: 0
  max: 100
  adaptation_rate_year: 0.3
  wealth_factor: 0.4
  stress_penalty_factor: 0.25
  family_death_penalty: 8
  family_death_penalty_cap: 24
  marriage_bonus: 6
  child_bonus: 4
  child_bonus_cap: 12
  health_ref: 60
  health_factor: 0.15
  mood_wealth_clamp: [-15, 15]
  satisfaction_wealth_clamp: [-18, 22]
  satisfaction_stress_share: 0.6
  # Hệ giá trị theo tính cách (GDD 01 §7.2): sống đúng điều mình coi trọng thì mãn nguyện hơn
  value_rules:
    - { condition: { all: [{ has_trait: trong_gia_dinh }, { var: player.married, op: '==', value: true }] }, value: 6 }
    - { condition: { all: [{ has_trait: trong_gia_dinh }, { var: player.married, op: '==', value: false }] }, value: -4 }
    - { condition: { all: [{ has_trait: trong_gia_dinh }, { var: player.children_count, op: '>=', value: 1 }] }, value: 4 }
    - { condition: { all: [{ has_trait: trong_gia_dinh }, { var: player.children_count, op: '>=', value: 2 }] }, value: 4 }
    - { condition: { all: [{ has_trait: trong_gia_dinh }, { var: player.children_count, op: '>=', value: 3 }] }, value: 4 }
    - { condition: { all: [{ has_trait: tham_vong }, { var: household.net_worth, op: '>=', value: 180 }] }, value: 8 }
    - { condition: { all: [{ has_trait: tham_vong }, { var: household.net_worth, op: '<', value: 90 }, { var: player.age, op: '>=', value: 30 }] }, value: -8 }
    - { condition: { all: [{ has_trait: tham_vong }, { var: player.exam_degree, op: 'in', value: [huong_cong, tien_si] }] }, value: 6 }
    - { condition: { all: [{ has_trait: an_phan }, { var: household.debt, op: '<=', value: 0 }] }, value: 6 }
    - { condition: { all: [{ has_trait: an_phan }, { var: household.debt, op: '>', value: 0 }] }, value: -6 }
    - { condition: { all: [{ any: [{ has_trait: hao_phong }, { has_trait: nhan_tu }] }, { var: player.reputation, op: '>=', value: 15 }] }, value: 5 }
    - { condition: { all: [{ any: [{ has_trait: hao_phong }, { has_trait: nhan_tu }] }, { var: player.reputation, op: '<', value: 0 }] }, value: -5 }
    # Khuôn Nho giáo: người con chí hiếu thấy lòng thanh thản, bất hiếu thì day dứt
    - { condition: { var: player.filial_piety, op: '>=', value: 80 }, value: 4 }
    - { condition: { var: player.filial_piety, op: '<', value: 30 }, value: -6 }

# [1] Bản tổng kết đời 5 trục độc lập (GDD 01 §7.3): trục = base + Σ(biến × hệ số), kẹp 0..100.
# min/max kẹp phần đóng góp của từng biến.
summary_axes:
  - id: man_nguyen
    terms:
      - { var: player.satisfaction, factor: 1 }
  - id: di_san
    base: 15
    terms:
      - { var: household.farmland, factor: 7 }
      - { var: household.net_worth, factor: 0.2, min: 0 }
      - { var: player.children_count, factor: 8 }
      - { var: household.debt, factor: -0.8 }
  - id: dau_an
    base: 25
    terms:
      - { var: player.reputation, factor: 1.1 }
      - { var: player.favor_total, factor: 8 }
      - { var: player.best_skill, factor: 4 }
      - { var: player.scholarly_prestige, factor: 0.3 }
      - { var: player.career_rank, factor: 3 }
  - id: gia_dinh
    base: 20
    terms:
      - { var: player.married, factor: 25 }
      - { var: player.children_count, factor: 15 }
      - { var: household.members, factor: 5 }
  - id: tham_vong
    base: 15
    terms:
      - { var: player.ambition_progress, factor: 85 }
