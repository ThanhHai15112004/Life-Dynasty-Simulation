# [0] Kinh tế hộ nông dân (GDD 03 §5.3). Đơn vị: tiền = quan, thóc = thúng.
# Mục tiêu cảm giác: năm thường vừa đủ ăn, năm được mùa dư chút ít, năm mất mùa phải vay — tích trữ và bán đúng lúc là kỹ năng.
harvest:
  months: [5, 10]          # vụ chiêm, vụ mùa
  yield_per_sao: 8         # thúng thóc mỗi sào mỗi vụ, trước các hệ số
  skill: sinh_ton
  skill_bonus_per_level: 0.04
  worker_min_age: 10
  worker_max_age: 65
  # Đủ người làm thì mới gặt đủ: số người làm / số sào → hệ số sản lượng
  # Ruộng nhiều mà người ít thì bỏ hoang một phần — giới hạn tự nhiên chống "tích ruộng vô hạn"
  labor_factor:
    - { workers_per_sao: 0, factor: 0.1 }
    - { workers_per_sao: 0.2, factor: 0.35 }
    - { workers_per_sao: 0.4, factor: 0.7 }
    - { workers_per_sao: 0.6, factor: 0.92 }
    - { workers_per_sao: 0.8, factor: 1.0 }
    - { workers_per_sao: 1.5, factor: 1.04 }
  full_workers_per_sao: 0.8
  spare_worker_wage_month: 0.45   # công làm thuê ≈ đủ nuôi miệng mình, không tích lũy được

# [1] Hộ không tự cày (nhà buôn, nhà nho): ruộng phát canh cho tá điền, mùa gặt thu tô bằng thóc
tenancy:
  rent_share: 0.5          # "tô rẽ" chia đôi sản lượng với tá điền
  business_runners: 1      # một người trong nhà lo việc nghề chính, không tính là lao động dư
  food_reserve_months: 2   # nhà buôn, nhà nho đong thóc dự trữ đủ ăn chừng này tháng khi có tiền
  reserve_cash_months: 2   # [1.5] đong thóc xong vẫn giữ tiền tiêu chừng này tháng (không dốc sạch túi rồi lại đi vay)
  # Ruộng càng nhiều càng khó tìm tá điền, phần lớn phải để rẻ hoặc bỏ hoang
  # [1.5] Nới ra cho địa chủ có doanh thu thật; giới hạn chính chuyển sang thuế ruộng và sự kiện
  rent_factor_by_sao:
    - { sao: 0, factor: 1.0 }
    - { sao: 20, factor: 1.0 }
    - { sao: 40, factor: 0.85 }
    - { sao: 80, factor: 0.65 }

# Trời định đầu năm (ẩn), lộ dần qua thời tiết, giá thóc và điềm báo
harvest_qualities:
  - id: duoc_mua
    name: Được mùa
    weight: 25
    yield_factor: 1.25
    price_factor: 0.8
    weather_bias: { mua: 1.3, han: 0.3 }
    harvest_log: sys.thu_hoach_duoc_mua
    quiet_year_log: sys.nam_yen_duoc_mua
    cutscene: thu_hoach_lon
  - id: binh_thuong
    name: Mùa thường
    weight: 45
    yield_factor: 1.0
    price_factor: 1.0
    harvest_log: sys.thu_hoach_binh_thuong
    quiet_year_log: sys.nam_yen_binh_thuong
  - id: kem
    name: Mùa kém
    weight: 20
    yield_factor: 0.78
    price_factor: 1.25
    weather_bias: { han: 2 }
    harvest_log: sys.thu_hoach_kem
    quiet_year_log: sys.nam_yen_kem
  - id: mat_mua
    name: Mất mùa
    weight: 10
    yield_factor: 0.5
    price_factor: 1.7
    weather_bias: { han: 3.5, mua: 0.6 }
    harvest_log: sys.thu_hoach_mat_mua
    quiet_year_log: sys.nam_yen_mat_mua

price:
  base: 0.5                # quan / thúng
  # Theo tháng 1..12: rẻ ngay sau gặt (5, 10), đắt mùa giáp hạt (3, 8–9)
  monthly_factor: [1.15, 1.25, 1.3, 1.2, 0.85, 0.9, 1.0, 1.1, 1.15, 0.85, 0.9, 1.0]
  noise: 0.05
  sell_factor: 0.9         # bán cho lái buôn bị ép giá
  buy_factor: 1.1          # mua lại phải trả thêm

# Hệ số khẩu phần theo nhóm tuổi (nhân với khẩu phần của mức sống)
consumption_by_age_group:
  tre_nho: 0.4
  thieu_nien: 0.75
  nguoi_lon: 1.0
  nguoi_gia: 0.85

tax:
  month: 11
  food_per_sao: 2.5        # thuế ruộng nộp bằng thóc (nhiều ruộng thì thuế nặng)
  food_per_sao_tenanted: 1.2   # [1.5] ruộng phát canh: tá điền gánh một phần thuế điền
  money_per_adult: 0.4     # tiền sưu mỗi người lớn

debt:
  annual_interest: 0.3     # vay nặng lãi
  auto_borrow: true
  borrow_limit: 70
  interest_cap: 120
  repay_keep_months: 2     # [1.5] lãi tính hằng tháng; có dư là trả ngay, chỉ giữ lại đủ tiêu chừng này tháng
  # Nợ quá ngưỡng: cuối năm chủ nợ xiết một sào ruộng, trừ nợ theo giá bị ép
  seize: { threshold: 45, property: ruong, value_factor: 0.7, keep_min: 0 }

# Thiếu tiền tiêu thì tự bán thóc dư, giữ lại đủ ăn chừng này tháng; còn thiếu mới vay
auto_sell_keep_months: 3

# [1.5] Sau vụ gặt / thu tô, nhà tự lo bán thóc vượt quá chừng này tháng ăn — của cải thành tiền, không ôm thóc vô hạn
surplus_keep_months: 7

# [1.5] Đầu năm có dư thì mua thêm của: luật đầu tiên đúng và đủ tiền (còn đủ tiêu keep_months tháng) thì mua một món
auto_invest:
  - property: trau
    condition:
      all:
        - { var: household.self_farms, op: '==', value: true }
        - { var: household.property.trau, op: '<', value: 1 }
        - { var: household.farmland, op: '>=', value: 3 }
        - { var: household.debt, op: '<=', value: 0 }
    keep_months: 6
  - property: ruong
    condition:
      all:
        - { var: household.self_farms, op: '==', value: true }
        - { var: household.spare_workers, op: '>=', value: 1 }
        - { var: household.debt, op: '<=', value: 0 }
    keep_months: 6
  - property: ruong
    condition:
      all:
        - { var: household.self_farms, op: '==', value: false }
        - { var: household.farmland, op: '<', value: 18 }
        - { var: household.debt, op: '<=', value: 0 }
    keep_months: 12
  - property: ao_ca
    condition:
      all:
        - { var: household.property.ao_ca, op: '<', value: 1 }
        - { var: household.debt, op: '<=', value: 0 }
    keep_months: 12

# [1.5] Túi tiền riêng của bạn khi chưa làm chủ hộ (kiểu 1in8b): tài sản trên thẻ là của bạn, không phải của cha mẹ
purse:
  contribute_share: 0.5     # tiền mình làm ra (lương nghề riêng, buôn bán theo trọng tâm) góp chừng này phần cho nhà
  pocket_min_age: 12        # từ tuổi này cha mẹ cho tiền tiêu vặt mỗi tháng (theo mức sống của nhà)
  pocket_money_month: { kho_cuc: 0, dam_bac: 0.03, du_day: 0.06, sung_tuc: 0.12, xa_hoa: 0.3 }
  board_from_age: 16        # từ tuổi này sổ riêng ghi "Ăn ở trong nhà" / "Cha mẹ lo ăn ở" (triệt tiêu nhau)
  income_ledgers: [luong_nghe, buon_ban, day_hoc, tien_cong, nghe_tay_trai]   # khoản tính là thu nhập của bạn (tiêu vặt, lì xì thì không)

# [1.5] Khoản "làm ra" cộng vào thu nhập năm (thóc quy theo giá gốc)
income_ledgers: [thu_hoach, thu_to, lam_thue, phu_viec, buon_ban, day_hoc, luong_nghe, nghe_tay_trai, thu_khac]
# [1.5] Khoản chỉ đổi dạng của cải: không hiện thành lý do tài sản ròng tăng giảm (chênh giá dồn vào "Chuyện khác")
transfer_ledgers: [vay, tra_no, mua_thoc, ban_thoc, mua_tai_san, ban_tai_san]

property_sell_factor: 0.8
trade_amounts: [10, 30, 100]
ledger_history_years: 10
