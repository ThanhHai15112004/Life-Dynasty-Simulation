# [2] Chế độ chơi (One Life / Dynasty) & Chế độ số phận (GDD 01 §9, GDD 09 §3)
default_play_mode: dynasty
play_modes:
  - id: dynasty
    name_key: play_mode.dynasty.name
    desc_key: play_mode.dynasty.desc
    succession: true
  - id: one_life
    name_key: play_mode.one_life.name
    desc_key: play_mode.one_life.desc
    succession: false
  - id: legacy_of_ages
    name_key: play_mode.legacy_of_ages.name
    desc_key: play_mode.legacy_of_ages.desc
    succession: true

default_mode: doi_thuc
modes:
  - id: binh_lang
    name_key: fate.binh_lang.name
    desc_key: fate.binh_lang.desc
    mortality_factor: 0.7
    disease_factor: 0.7
    disaster_factor: 0.6
    bad_event_factor: 0.7
  - id: doi_thuc
    name_key: fate.doi_thuc.name
    desc_key: fate.doi_thuc.desc
    mortality_factor: 1.0
    disease_factor: 1.0
    disaster_factor: 1.0
    bad_event_factor: 1.0
  - id: khac_nghiet
    name_key: fate.khac_nghiet.name
    desc_key: fate.khac_nghiet.desc
    mortality_factor: 1.3
    disease_factor: 1.3
    disaster_factor: 1.4
    bad_event_factor: 1.4
