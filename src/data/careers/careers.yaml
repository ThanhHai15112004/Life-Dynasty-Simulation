          - 'Thằng bé nghịch nhất lớp làm đổ nghiên mực lên sách thầy, cha nó không đền lại còn bênh con.'
          - 'Nhà nào cũng hứa lễ thầy sau mùa, đến lúc ấy lại khất, bạn ngại chẳng dám đòi.'
          - 'Có người đồn thầy dạy chữ không chuẩn, mấy nhà rút con sang học ông đồ làng bên.'
