    actions:
      - id: chan_duong_thuong_khach
        name: Thu mãi lộ trên đèo
        description: Đón lõng các đoàn xe buôn qua đèo vắng để thu tiền mãi lộ.
        hint: 'Dễ thành công khi Mức tuần tra quan phủ < 40; tăng mức truy nã'
