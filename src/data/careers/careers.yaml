          - 'Các bậc tiền bối gật gù khen văn khí sáng sủa.'
          - 'Một vị Hương cống xin chép bài văn của bạn mang về cho con cháu đọc, mặt bạn nóng bừng.'
          - 'Tan hội, mấy văn hữu trẻ rủ bạn uống rượu bên hồ, kết thành bạn đồng môn từ đấy.'
        failure_log:
          - 'Văn chương còn non, bạn chỉ ngồi nghe các bậc tiền bối bình phẩm.'
          - 'Bạn đọc đến câu thứ ba thì có người cắt ngang bắt lỗi điển cố, cả hội cười ồ.'
          - 'Văn hữu nhà giàu mang rượu quý đến, được chú ý hơn cả bài văn của bạn, ngồi mà chạnh lòng.'
          - 'Bài văn bị chê là sáo, nhắc lại ý người xưa mà không có ý mình, bạn về thức trắng đêm sửa.'
      - id: viet_van_khe
        name: Viết văn khế, đơn từ thuê
        description: Viết hộ dân làng văn tự mua bán ruộng đất, đơn kiện, câu đối Tết.
        hint: 'Kiếm tiền nhanh, sai sót thì mất tiếng'
        cooldown_months: 4
        chance:
          base: 0.7
          skill: hoc_van
          per_level: 0.03
        success:
          - { type: money, value: 2, ledger: day_hoc }
          - { type: career_merit, value: 5 }
        failure:
          - { type: reputation, group: dan_lang, value: -2 }
          - { type: stress, value: 2 }
        success_log:
          - 'Nét chữ rồng bay phượng múa, khách cầm văn khế về còn biếu thêm buồng cau.'
          - 'Văn tự mua bán ruộng viết rành rọt từng bờ từng thửa, hai bên đọc xong điểm chỉ chẳng ai cãi.'
          - 'Bà góa nhờ viết đơn kêu quan, đơn được thụ lý, bà mang sang biếu bạn mấy quả bưởi đầu mùa.'
          - 'Gần Tết người ta xếp hàng xin câu đối, bạn viết đến mỏi cổ tay mà túi tiền rủng rỉnh.'
          - 'Ông lý xem văn khế bạn viết rồi khen chữ có nét, từ đó việc giấy tờ trong làng hay gọi đến bạn.'
        failure_log:
          - 'Viết sót một chữ trong văn tự, hai bên kiện cáo nhau rồi đổ lỗi cho bạn.'
          - 'Khách nhờ viết đơn kiện hàng xóm, quan bác đơn, khách quay lại trách bạn viết không đủ lý.'
          - 'Mực nhòe vì mưa hắt vào hiên, tờ văn tự phải viết lại, khách cằn nhằn mãi.'
          - 'Người ta trả công bằng mấy bát gạo mốc, bạn ngại chẳng nói, đành ôm về.'
          - 'Viết hộ văn khế cho kẻ gian bán ruộng không phải của mình, đến khi vỡ chuyện bạn cũng bị gọi lên hỏi.'

