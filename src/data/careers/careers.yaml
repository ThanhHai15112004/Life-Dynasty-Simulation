          - 'Gặp đúng phiên hội, khách thập phương đông nghịt, gánh hàng chưa kịp đặt xuống đã có người hỏi.'
          - 'Mấy bà buôn ở chợ xa quen mặt, để dành chỗ ngồi đẹp cho bạn đầu dãy hàng.'
          - 'Về đến cổng làng lúc trời nhá nhem, đôi vai mỏi rã nhưng túi tiền đếm lại vẫn thấy vui.'
        failure_log:
