          - 'Chuột đồng kéo về ruộng chân trũng cắn phá, đêm nào cũng đi đánh mà chẳng xuể.'
          - 'Quản gia nhà điền chủ đo lại ruộng, bảo bạn cấy lấn sang, phạt thêm một thúng thóc.'

