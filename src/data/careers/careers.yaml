          - { type: skill_xp, skill: muu_luoc, value: 18 }
        failure:
          - { type: health, value: -9 }
          - { type: wanted, value: 12 }
          - { type: stress, value: 5 }
        success_log:
          - 'Đoàn xe buôn vội vã nộp tiền mãi lộ rồi chạy biến. Anh em trong trại mở tiệc lớn.'
          - 'Đoàn buôn chè đặt sẵn túi tiền bên vệ đường, chẳng cần rút đao, anh em chia nhau đủ tiêu cả tháng.'
          - 'Tên chủ hàng run run hỏi lệ, bạn đếm đủ rồi cho đi, lại dặn lần sau qua đèo cứ nộp là yên.'
          - 'Đón trúng chuyến hàng muối lớn, cả trại có muối ăn quanh năm, phần dư đem đổi lấy gạo.'
          - 'Tin đồn trại trên đèo nói là giữ lời lan khắp các bến, nhà buôn tự tìm đến nộp lệ cho chắc.'
        failure_log:
          - 'Ngờ đâu gặp phải đoàn hộ tống có lính trấn đi kèm! Cả toán phải lẩn vào rừng sâu.'
          - 'Đoàn buôn mang theo chó săn và gậy gộc, đánh nhau một trận, anh em mang thương về trại tay trắng.'
          - 'Có kẻ trong đoàn chạy thoát về báo quan, ba hôm sau đã thấy lính trấn lùng sục dưới chân núi.'
          - 'Chờ lõng hai đêm sương lạnh mà chẳng có ai qua, anh em chửi đổng rồi bỏ về.'
          - 'Túi tiền giành được hóa ra toàn đồng kẽm mỏng, đem ra chợ người ta chẳng nhận.'
