        success_log:
          - 'Bắt gọn toán cướp cỏ trên đèo, quan trên ban thưởng tiền và ghi sổ quân công.'
          - 'Toán tuần bắt được hai tên trộm trâu đang lùa trâu qua khe núi, dân bản mang rượu ra tận đồn cảm tạ.'
          - 'Đường đèo yên ắng suốt mùa, các đoàn buôn qua lại đều vái chào toán lính của bạn.'
          - 'Bạn lần theo vết chân trên bùn, tìm ra hang ổ bọn cướp vặt, thu lại được mấy gánh hàng bị cướp.'
          - 'Viên đội trưởng ghi tên bạn vào sổ khen, cuối tháng được thưởng thêm thóc và một bầu rượu.'
        failure_log:
          - 'Đường rừng hiểm trở lại gặp mưa tên phục kích, bạn bị xây xát nhẹ khi rút quân.'
          - 'Đi trọn ba ngày đường rừng chẳng thấy bóng giặc, chỉ thấy vắt bám đầy chân, về đồn bị quở là lười.'
          - 'Một tên lính trong toán trượt chân xuống vực, cả toán phải bỏ tuần để khiêng người về.'
          - 'Bọn cướp nghe động rút trước, chỉ để lại đống lửa còn ấm, công cốc một chuyến.'
          - 'Mưa núi đổ xuống bất chợt, suối lũ chặn đường, toán tuần mắc kẹt hai đêm, ai cũng sốt.'
      - id: xung_phong_chien_dich
        name: Xung phong lập chiến công
        description: Tình nguyện đi mũi tiên phong trong đợt tập kích sào huyệt địch.
        hint: 'Rủi ro bị thương cao, nhưng thắng lợi sẽ thăng tiến vượt bậc'
