    actions:
      - id: tuan_tra_anh_ai
        name: Tuần tiễu đường đèo
        description: Dẫn toán lính tuần tra đường đèo, truy quét trộm cướp bảo vệ dân lành.
        hint: 'Lập công nhanh khi biên ải đang mức Tuần tra hoặc Chiến dịch'
