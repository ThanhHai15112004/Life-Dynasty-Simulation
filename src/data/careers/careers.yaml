          - 'Tiếng bọn trẻ đọc "Nhân chi sơ" vọng ra tận ngõ, người qua đường dừng lại nghe mà mỉm cười.'
          - 'Cuối mùa học, cả lớp viết được tên cha mẹ mình, phụ huynh rủ nhau mang gạo đến tạ thầy.'
