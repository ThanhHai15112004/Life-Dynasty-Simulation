# [1] Hợp đồng nghề sâu (GDD 04 §5, §15) + [2] Nghề nghiệp v2 (Phase 5: 10 nghề nhẹ/vừa, thâm niên, lối ra chuyển nghề & nghề tay trái)
careers:
  - id: nong_dan
    name: Nông dân
    description: Bám đất bám làng, trông trời trông đất trông mây. Chậm mà chắc, tích lũy ruộng vườn qua từng mùa gặt.
    icon: lua
    sector: nong_nghiep
    depth: sau
    settlement_types: [lang_nong, thi_tran_ben_song]
    skills: [sinh_ton, quan_tri]
    components: [farmland]
    default_focus: lam_an
    event_tags: [ruong_dong, lao_dong]
    event_weights: { ruong_dong: 1.4, lao_dong: 1.3, buon_ban: 0.6 }
    work_effects:
      health_month: 0.02
      stress_month: -0.05
      skill_xp: { sinh_ton: 1.2 }
    economy:
      self_farm: true
    entry_condition:
      any:
        - { var: household.farmland, op: '>=', value: 1 }
        - { var: player.career, op: '==', value: that_nghiep }
    join: { cost_money: 0, hint: 'Nhà có ruộng thì tự cày; chưa có việc thì đi làm thuê cấy hái.' }
    duties:
      - Canh tác ruộng đồng và nộp thuế đinh, thuế điền mỗi năm
      - Gánh vác việc sưu dịch, hộ đê cùng dân làng
    exits:
      - to: ta_dien
        hint: 'Mất ruộng hoặc nợ nần có thể nhận ruộng cấy rẽ làm Tá điền'
      - to: ban_rong
        condition: { var: player.skill.thuong_mai, op: '>=', value: 1 }
        hint: 'Có chút đầu óc buôn bán có thể xoay sang gánh hàng Bán rong'
      - to: tho_moc
        condition: { var: player.skill.sinh_ton, op: '>=', value: 2 }
        hint: 'Quen tay đục đẽo nông cụ có thể chuyển sang làm Thợ mộc'
      - to: linh
        condition: { var: player.health, op: '>=', value: 55 }
        hint: 'Trai tráng khỏe mạnh có thể đầu quân đi Lính'
    ranks:
      - id: ta_dien
        name: Dân cày nghèo
        min_merit: 0
        min_years: 0
        income_range: [2, 6]
        condition: { var: household.farmland, op: '<', value: 3 }
      - id: nong_dan_tu_canh
        name: Nông phu tự canh
        min_merit: 15
        min_years: 0
        income_range: [6, 14]
        condition: { var: household.farmland, op: '>=', value: 3 }
        modifiers:
          - { target: harvest.yield, value: 1.05, op: mul }
      - id: phu_nong
        name: Phú nông có của
        min_merit: 45
        min_years: 3
        income_range: [14, 28]
        condition:
          all:
            - { var: household.farmland, op: '>=', value: 7 }
            - { has_property: trau }
        stipend_money_month: 0.4
        modifiers:
          - { target: harvest.yield, value: 1.12, op: mul }
      - id: dien_chu
        name: Điền chủ trong vùng
        min_merit: 90
        min_years: 6
        min_reputation: 15
        income_range: [28, 60]
        condition:
          all:
            - { var: household.farmland, op: '>=', value: 11 }
            - { var: player.reputation, op: '>=', value: 15 }
        stipend_money_month: 1.2
        modifiers:
          - { target: harvest.yield, value: 1.2, op: mul }
    actions:
      - id: khan_hoang_bai_boi
        name: Khẩn hoang bãi bồi
        description: Tranh thủ lúc nông nhàn ra bãi sông cuốc đất, cải tạo thêm vạt ruộng màu mỡ.
        hint: 'Thuận lợi hơn vào mùa xuân/thu, tăng năng suất và công trạng nghề nông'
        cooldown_months: 6
        cost_food: 2
        chance:
          base: 0.55
          skill: sinh_ton
          per_level: 0.05
          modifiers:
            - { condition: { var: world.season, op: 'in', value: [xuan, thu] }, add: 0.15 }
        success:
          - { type: career_merit, value: 12 }
          - { type: food, value: 6, ledger: thu_hoach }
          - { type: skill_xp, skill: sinh_ton, value: 18 }
        failure:
          - { type: health, value: -4 }
          - { type: stress, value: 3 }
        success_log:
          - 'Vạt đất bãi bồi tơi xốp, gieo thử một lứa khoai đậu thu về đầy bồ.'
          - 'Cuốc sâu xuống ba lưỡi đã gặp lớp phù sa đen nhánh, bạn bốc một nắm lên ngửi mà thấy thơm mùi đất mới.'
          - 'Vạt bãi phát xong cỏ lau, đắp được bờ con chạch, mùa nước sau chắc gieo được một lứa đỗ xanh.'
          - 'Mấy hôm liền cuốc từ tinh mơ, đến rằm thì vạt đất đã phẳng, khoai lang cắm hom xuống là bén rễ.'
          - 'Ông lão chăn vịt ven sông đi qua, ngó vạt đất mà gật gù: "Đất này nuôi người được đấy."'
        failure_log:
          - 'Đất lẫn toàn sỏi đá, cuốc rộp cả tay mà chẳng trồng trọt được gì.'
          - 'Nước sông lên bất chợt một đêm, sáng ra vạt đất mới cuốc đã ngập trắng, công sức trôi theo dòng.'
          - 'Bãi toàn cát chạy, tưới bao nhiêu cũng ráo, mầm đậu nhú lên được ba hôm thì héo rũ.'
          - 'Lau sậy mọc lại nhanh hơn người phát, nửa tháng trời chỉ được một khoảnh bằng cái chiếu.'
          - 'Cuốc phải mảnh sành cũ, lưỡi mẻ một miếng, tay rách một đường, đành vác cuốc về sớm.'
      - id: giup_viec_dinh_lang
        name: Đứng ra lo việc đình đám
        description: Bỏ công sức giúp làng tu sửa đình miếu, kênh mương để gây dựng uy tín.
        hint: 'Tăng danh tiếng làng xã và điểm thăng tiến điền chủ'
        cooldown_months: 8
        cost_money: 1
        chance:
          base: 0.6
          skill: quan_tri
          per_level: 0.05
        success:
          - { type: career_merit, value: 15 }
          - { type: reputation, group: dan_lang, value: 6 }
          - { type: skill_xp, skill: quan_tri, value: 15 }
        failure:
          - { type: stress, value: 4 }
        success_log:
          - 'Kênh mương thông suốt, các cụ bô lão ngoài đình gật gù khen ngợi.'
          - 'Mái đình lợp lại ngói mới, hôm cúng thành hoàng các cụ cho bạn ngồi gần chiếu giữa.'
          - 'Bạn đứng ra chia phiên đào mương, nhà nào cũng có người ra, nước về tận ruộng chân cao.'
          - 'Ông thủ từ vỗ vai bạn: "Làng có người chịu đứng mũi chịu sào thế này thì còn lo gì."'
          - 'Cây cầu tre qua lạch được nối lại chắc chắn, đàn bà đi chợ sớm không còn phải lội nước.'
        failure_log:
          - 'Chín người mười ý, việc làng vừa mệt người vừa chẳng ai khen.'
          - 'Tiền góp sửa đình thiếu trước hụt sau, người ta xì xào bạn ăn bớt dù bạn chẳng đụng một đồng.'
          - 'Mấy nhà khá giả cứ khất không ra công, việc đình bỏ dở giữa chừng, mưa xuống lại dột như cũ.'
          - 'Hai xóm cãi nhau chuyện đắp mương qua đất ai, bạn đứng giữa bị cả hai bên trách.'
          - 'Cụ tiên chỉ chê cách làm của bạn trước mặt cả đình, đến tối về vẫn còn ấm ức.'

  - id: thuong_nhan
    name: Thương nhân
    description: Mua nơi thừa, bán nơi thiếu. Đọc thời cơ giá cả và lèo lái những chuyến hàng vượt sông, qua đèo.
    icon: tien
    sector: thuong_mai
    depth: sau
    settlement_types: [lang_nong, thi_tran_ben_song, phu_thanh, huyen_ly, kinh_thanh]
    skills: [thuong_mai, ngoai_giao]
    components: [trade_route]
    default_focus: kinh_doanh
    event_tags: [buon_ban, thoi_co]
    event_weights: { buon_ban: 2.0, thoi_co: 1.5, ruong_dong: 0.3, lao_dong: 0.5 }
    work_effects:
      health_month: 0
      stress_month: 0.08
      skill_xp: { thuong_mai: 1.5, ngoai_giao: 0.5 }
    economy:
      self_farm: false
      family_wage_month: 0.28
      income: { money_month: 0.2, skill: thuong_mai, per_level: 0.045, trade_scaled: true, capital: { rate_year: 0.08, max: 150 }, ledger: buon_ban }
    entry_condition:
      all:
        - { var: player.skill.thuong_mai, op: '>=', value: 2 }
        - any:
            - { var: household.money, op: '>=', value: 5 }
            - { has_property: sap_hang }
    join: { cost_money: 5, hint: 'Cần biết buôn bán (Thương mại từ bậc 2) và 5 quan làm vốn.' }
    duties:
      - Giữ chữ tín với thương hội và bạn hàng các bến
      - Nộp thuế thương chính và phí bến bãi
    exits:
      - to: ban_rong
        hint: 'Khi sa cơ thất thế có thể thu nhỏ về gánh hàng Bán rong'
      - to: chu_do
        condition: { var: household.money, op: '>=', value: 4 }
        hint: 'Quen sông nước bến bãi có thể sắm đò làm Chủ đò'
    ranks:
      - id: hang_xao
        name: Tiểu thương gánh chợ
        min_merit: 0
        min_years: 0
        income_range: [5, 12]
        stipend_money_month: 0.2
        modifiers:
          - { target: xp.thuong_mai, value: 1.15, op: mul }
      - id: chu_sap
        name: Chủ sạp bến sông
        min_merit: 25
        min_years: 0
        min_skill: { skill: thuong_mai, level: 3 }
        income_range: [10, 22]
        condition: { var: player.skill.thuong_mai, op: '>=', value: 3 }
        stipend_money_month: 0.5
        modifiers:
          - { target: xp.thuong_mai, value: 1.2, op: mul }
          - { target: xp.ngoai_giao, value: 1.1, op: mul }
      - id: lai_buon_duong_dai
        name: Thương khách đường dài
        min_merit: 60
        min_years: 4
        min_skill: { skill: thuong_mai, level: 5 }
        income_range: [20, 42]
        condition: { var: player.skill.thuong_mai, op: '>=', value: 5 }
        stipend_money_month: 1.0
        modifiers:
          - { target: xp.thuong_mai, value: 1.25, op: mul }
      - id: phu_thuong_hoi_chu
        name: Đại chưởng quỹ thương hội
        min_merit: 110
        min_years: 7
        min_skill: { skill: thuong_mai, level: 7 }
        income_range: [40, 90]
        condition:
          all:
            - { var: player.skill.thuong_mai, op: '>=', value: 7 }
            - { var: household.money, op: '>=', value: 60 }
        stipend_money_month: 2.0
        modifiers:
          - { target: xp.thuong_mai, value: 1.3, op: mul }
          - { target: living.cost, value: 0.9, op: mul }
    actions:
      - id: chuyen_buon_len_tran
        name: Đánh chuyến hàng lên trấn
        description: Gom nông sản, vải vóc chở thuyền lên chợ trấn bán kiếm lời theo thời giá.
        hint: 'Lời to khi Chỉ số giá buôn >= 1.1; coi chừng thảo khấu khi tuần tra thấp'
        cooldown_months: 5
        cost_money: 4
        chance:
          base: 0.5
          skill: thuong_mai
          per_level: 0.05
          max: 0.85
          modifiers:
            - { condition: { var: world.trade_index, op: '>=', value: 1.12 }, add: 0.2 }
            - { condition: { var: world.trade_index, op: '<', value: 0.9 }, add: -0.15 }
        success:
          - { type: money, value: { var: world.trade_index, factor: 7, round: true }, ledger: buon_ban }
          - { type: career_merit, value: 15 }
          - { type: skill_xp, skill: thuong_mai, value: 20 }
        failure:
          - { type: stress, value: 5 }
          - { type: career_merit, value: 3 }
        success_log:
          - 'Đúng lúc trên trấn khan hàng! Chuyến buôn bán đắt như tôm tươi, thu lời đậm.'
          - 'Thuyền vừa cập bến trấn đã có lái buôn chờ sẵn, cả mạn hàng bán đổ đống chẳng phải mặc cả.'
          - 'Giá vải trên trấn đang lên, bán xong bạn còn kịp cất một chuyến muối về xuôi bán tiếp.'
          - 'Gặp được mối quen là chủ hiệu tạp hóa đầu phố, ông ta ôm trọn chỗ hàng lại hẹn chuyến sau.'
          - 'Xuôi về, bạn ngồi đầu mũi thuyền đếm tiền, gió sông thổi mát mà lòng thì nóng hổi.'
        failure_log:
          - 'Hàng ế ẩm lại gặp mưa ẩm mốc, chuyến đi chỉ vừa đủ bù chi phí.'
          - 'Lên đến nơi mới biết mấy thuyền khác đã chở cùng một thứ hàng, giá rớt chỉ còn non nửa.'
          - 'Sai nha ở trạm thu lệ đòi thêm tiền qua bến, chuyến hàng còn chưa bán đã hụt một khoản.'
          - 'Đến trấn đúng phiên vắng, bạn nằm thuyền ba hôm chờ khách, hàng thì mỗi ngày một héo.'
          - 'Thuyền va phải cọc ngầm, nước rỉ vào khoang làm ướt mấy bao hàng, bán được nửa giá là may.'
      - id: dau_co_mua_giap_hat
        name: Thu gom hàng hiếm chờ thời
        description: Bỏ vốn lớn gom muối mắm và lụa tốt, đợi tháng khan hiếm tung ra thị trường.
        hint: 'Cần vốn 8 quan, thắng lớn khi giá buôn cao'
        cooldown_months: 8
        cost_money: 8
        chance:
          base: 0.45
          skill: thuong_mai
          per_level: 0.05
          max: 0.8
          modifiers:
            - { condition: { var: world.trade_index, op: '>=', value: 1.15 }, add: 0.25 }
        success:
          - { type: money, value: 14, ledger: buon_ban }
          - { type: career_merit, value: 22 }
          - { type: skill_xp, skill: thuong_mai, value: 25 }
        failure:
          - { type: money, value: 3, ledger: buon_ban }
          - { type: stress, value: 6 }
        success_log:
          - 'Con mắt nhìn xa trông rộng giúp bạn thắng lớn, tiền bạc chảy đầy tay nải.'
          - 'Tháng giáp hạt cả chợ không đâu có muối, người ta đến tận nhà bạn hỏi mua, giá gấp đôi lúc gom.'
          - 'Mấy súc lụa tốt cất kỹ trong rương gỗ, đến dịp cưới hỏi cuối năm bán chẳng kịp đếm tiền.'
          - 'Bạn nhả hàng ra từ từ từng mẻ một, giá cứ thế giữ vững, cả mùa lời đều tay.'
          - 'Lái buôn trên trấn nghe tiếng tìm về tận làng, ôm hết chỗ hàng tích trữ với giá khá hời.'
        failure_log:
          - 'Thuyền hàng nơi khác ập về phá giá, đành bán tháo thu hồi một phần vốn.'
          - 'Muối cất lâu chảy nước, chuột cắn thủng mấy bao, đến lúc giá lên thì hàng đã hao một phần.'
          - 'Năm nay được mùa, chẳng ai thiếu thứ gì, hàng gom về nằm chật kho mà không ai hỏi.'
          - 'Quan trên ra lệnh bình giá, cấm bán cao, bạn đành bán ngang giá vốn cho xong.'
          - 'Người ta đồn bạn găm hàng ép giá, mấy mối quen ngoảnh mặt, hàng bán chậm như rùa.'

  - id: linh
    name: Lính → Tướng
    description: Khoác áo lính, cầm giáo giữ biên cương. Đổi mồ hôi và máu trên chiến trường lấy quân công, bổng lộc và chức tước.
    icon: phu
    sector: quan_binh
    depth: sau
    settlement_types: [lang_nong, thi_tran_ben_song, phu_thanh, huyen_ly, kinh_thanh]
    skills: [quan_su, quan_tri]
    components: [military_rank]
    default_focus: ren_luyen
    event_tags: [quan_su, vo_nghe, nguy_hiem]
    event_weights: { quan_su: 2.0, vo_nghe: 1.6, nguy_hiem: 1.3 }
    work_effects:
      health_month: -0.05
      stress_month: 0.1
      skill_xp: { quan_su: 1.8 }
    economy:
      self_farm: true
    entry_condition:
      all:
        - { var: player.health, op: '>=', value: 55 }
        - { var: player.wanted, op: '==', value: 0 }
    join: { cost_money: 0, hint: 'Cần sức khỏe tốt và không vướng truy nã. Vào lính là xa nhà, nhiều hiểm nguy.' }
    duties:
      - Tuân lệnh điều động tuần biên, dẹp loạn
      - Rèn luyện võ nghệ và giữ kỷ luật quân ngũ
    exits:
      - to: nha_lai
        condition: { var: player.skill.quan_tri, op: '>=', value: 2 }
        hint: 'Giải ngũ có quân công có thể xin vào làm Nha lại ở huyện'
      - to: nong_dan
        hint: 'Xuất ngũ về quê cày ruộng dưỡng già'
      - to: thao_khau
        condition: { var: player.wanted, op: '>', value: 0 }
        hint: 'Phạm quân pháp hoặc bất mãn có thể trốn lên núi làm Thảo khấu'
    ranks:
      - id: tan_binh
        name: Binh đinh
        min_merit: 0
        min_years: 0
        income_range: [9, 15]
        stipend_money_month: 0.8
        stipend_food_month: 1.5
        modifiers:
          - { target: xp.quan_su, value: 1.2, op: mul }
          - { target: death_risk, value: 1.1, op: mul }
      - id: ngu_truong
        name: Ngũ trưởng
        min_merit: 25
        min_years: 0
        min_skill: { skill: quan_su, level: 2 }
        income_range: [16, 25]
        condition: { var: player.skill.quan_su, op: '>=', value: 2 }
        stipend_money_month: 1.4
        stipend_food_month: 2.0
        modifiers:
          - { target: xp.quan_su, value: 1.25, op: mul }
          - { target: death_risk, value: 1.12, op: mul }
      - id: doi_truong
        name: Đội trưởng cấm vệ
        min_merit: 55
        min_years: 4
        min_skill: { skill: quan_su, level: 4 }
        income_range: [28, 42]
        condition: { var: player.skill.quan_su, op: '>=', value: 4 }
        stipend_money_month: 2.4
        stipend_food_month: 3.0
        modifiers:
          - { target: xp.quan_su, value: 1.3, op: mul }
          - { target: xp.quan_tri, value: 1.15, op: mul }
      - id: do_uy
        name: Đô úy thống binh
        min_merit: 95
        min_years: 6
        min_skill: { skill: quan_su, level: 6 }
        income_range: [45, 70]
        condition: { var: player.skill.quan_su, op: '>=', value: 6 }
        stipend_money_month: 4.0
        stipend_food_month: 4.0
        modifiers:
          - { target: xp.quan_su, value: 1.35, op: mul }
      - id: tuong_quan
        name: Trấn thủ Tướng quân
        min_merit: 150
        min_years: 9
        min_skill: { skill: quan_su, level: 8 }
        min_reputation: 20
        income_range: [75, 120]
        condition:
          all:
            - { var: player.skill.quan_su, op: '>=', value: 8 }
            - { var: player.reputation, op: '>=', value: 20 }
        stipend_money_month: 6.5
        stipend_food_month: 6.0
        modifiers:
