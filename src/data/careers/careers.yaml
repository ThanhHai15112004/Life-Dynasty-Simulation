          skill: muu_luoc
          per_level: 0.05
        success:
          - { type: wanted, value: -18 }
          - { type: stress, value: -5 }
          - { type: skill_xp, skill: muu_luoc, value: 15 }
        failure:
          - { type: wanted, value: -5 }
        success_log:
          - 'Quan quân tưởng toán cướp đã dạt sang xứ khác, lệnh truy tầm lắng xuống hẳn.'
          - 'Anh em tản về các làng giả làm phu gặt, mấy tháng liền không ai nhắc đến trại trên núi nữa.'
          - 'Bạn sai người tung tin toán cướp đã bị quân triều đình đánh tan, cáo thị truy nã cũng được gỡ xuống.'
          - 'Lối mòn lên trại được lấp kín bằng gai rừng, lính tuần đi qua mấy lượt chẳng nhận ra.'
          - 'Một tay sai của nha môn nhận chút lễ, ghi vào sổ rằng vùng núi này đã yên.'
        failure_log:
          - 'Mấy tên tuần đinh vẫn lảng vảng dưới chân núi, chỉ giảm được chút ít nghi ngờ.'
          - 'Một tên trong trại say rượu ở chợ huyện buột miệng khoe khoang, tin lại lọt đến tai quan.'
          - 'Khói bếp trại bốc lên giữa ngày nắng ráo, người kiếm củi trông thấy, chẳng giấu được bao lâu.'
          - 'Lệnh truy nã vẫn dán ở cổng chợ, mặt bạn vẽ trên đó tuy không giống lắm nhưng ai cũng nhìn kỹ.'
          - 'Anh em nằm im lâu ngày sinh cãi cọ, có đứa bỏ trại xuống núi, chẳng biết có khai ra không.'

