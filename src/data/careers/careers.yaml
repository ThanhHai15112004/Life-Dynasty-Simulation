# [1] Hợp đồng nghề sâu (GDD 04 §5, §15): Nông dân · Thương nhân · Lính→Tướng · Thảo khấu
# + Sĩ tử → Quan văn (nghề nhà của Quý tộc nhỏ, nối với Khoa cử của khuôn Nho giáo)
careers:
  - id: nong_dan
    name: Nông dân
    description: Bám đất bám làng, trông trời trông đất trông mây. Chậm mà chắc, tích lũy ruộng vườn qua từng mùa gặt.
    icon: lua
    components: [farmland]
    default_focus: lam_an
    event_weights: { ruong_dong: 1.4, lao_dong: 1.3, buon_ban: 0.6 }
    economy:
      self_farm: true
    entry_condition:
      any:
        - { var: household.farmland, op: '>=', value: 1 }
        - { var: player.career, op: '==', value: that_nghiep }
    join: { cost_money: 0, hint: 'Nhà có ruộng thì tự cày; chưa có việc thì đi làm thuê cấy hái.' }
    duties:
      - Canh tác ruộng đồng và nộp thuế đinh, thuế điền mỗi năm
      - Gánh vác việc sưu dịch, hộ đê cùng dân làng
    ranks:
      - id: ta_dien
        name: Dân cày nghèo
        min_merit: 0
        condition: { var: household.farmland, op: '<', value: 3 }
      - id: nong_dan_tu_canh
        name: Nông phu tự canh
        min_merit: 15
        condition: { var: household.farmland, op: '>=', value: 3 }
        modifiers:
          - { target: harvest.yield, value: 1.05, op: mul }
      - id: phu_nong
        name: Phú nông có của
        min_merit: 45
        condition:
          all:
            - { var: household.farmland, op: '>=', value: 7 }
            - { has_property: trau }
        stipend_money_month: 0.4
        modifiers:
          - { target: harvest.yield, value: 1.12, op: mul }
      - id: dien_chu
        name: Điền chủ trong vùng
        min_merit: 90
        condition:
          all:
            - { var: household.farmland, op: '>=', value: 11 }
            - { var: player.reputation, op: '>=', value: 15 }
        stipend_money_month: 1.2
        modifiers:
          - { target: harvest.yield, value: 1.2, op: mul }
    actions:
      - id: khan_hoang_bai_boi
        name: Khẩn hoang bãi bồi
        description: Tranh thủ lúc nông nhàn ra bãi sông cuốc đất, cải tạo thêm vạt ruộng màu mỡ.
        hint: 'Thuận lợi hơn vào mùa xuân/thu, tăng năng suất và công trạng nghề nông'
        cooldown_months: 6
        cost_food: 2
        chance:
          base: 0.55
          skill: sinh_ton
          per_level: 0.05
          modifiers:
            - { condition: { var: world.season, op: 'in', value: [xuan, thu] }, add: 0.15 }
        success:
          - { type: career_merit, value: 12 }
          - { type: food, value: 6, ledger: thu_hoach }
          - { type: skill_xp, skill: sinh_ton, value: 18 }
        failure:
          - { type: health, value: -4 }
          - { type: stress, value: 3 }
        success_log:
          - 'Vạt đất bãi bồi tơi xốp, gieo thử một lứa khoai đậu thu về đầy bồ.'
        failure_log:
          - 'Đất lẫn toàn sỏi đá, cuốc rộp cả tay mà chẳng trồng trọt được gì.'
      - id: giup_viec_dinh_lang
        name: Đứng ra lo việc đình đám
        description: Bỏ công sức giúp làng tu sửa đình miếu, kênh mương để gây dựng uy tín.
        hint: 'Tăng danh tiếng làng xã và điểm thăng tiến điền chủ'
        cooldown_months: 8
        cost_money: 1
        chance:
          base: 0.6
          skill: quan_tri
          per_level: 0.05
        success:
          - { type: career_merit, value: 15 }
          - { type: reputation, group: dan_lang, value: 6 }
          - { type: skill_xp, skill: quan_tri, value: 15 }
        failure:
          - { type: stress, value: 4 }
        success_log:
          - 'Kênh mương thông suốt, các cụ bô lão ngoài đình gật gù khen ngợi.'
        failure_log:
          - 'Chín người mười ý, việc làng vừa mệt người vừa chẳng ai khen.'

  - id: thuong_nhan
    name: Thương nhân
    description: Mua nơi thừa, bán nơi thiếu. Đọc thời cơ giá cả và lèo lái những chuyến hàng vượt sông, qua đèo.
    icon: tien
    components: [trade_route]
    default_focus: kinh_doanh
    event_weights: { buon_ban: 2.0, thoi_co: 1.5, ruong_dong: 0.3, lao_dong: 0.5 }
    # Nhà buôn không tự cày: ruộng phát canh thu tô, người nhà phụ sạp hàng, tiền lời theo Thời cơ giá buôn
    economy:
      self_farm: false
      family_wage_month: 0.28   # [1.5] hạ từ 0.4: người nhà phụ sạp không phải nguồn giàu chính
      # [1.5] Lời theo vốn: tiền mặt quay vòng buôn bán (tối đa max quan) sinh lời rate_year mỗi năm, nhân Thời cơ
      income: { money_month: 0.2, skill: thuong_mai, per_level: 0.045, trade_scaled: true, capital: { rate_year: 0.08, max: 150 }, ledger: buon_ban }
    entry_condition:
      all:
        - { var: player.skill.thuong_mai, op: '>=', value: 2 }
        - any:
            - { var: household.money, op: '>=', value: 5 }
            - { has_property: sap_hang }
    join: { cost_money: 5, hint: 'Cần biết buôn bán (Thương mại từ bậc 2) và 5 quan làm vốn.' }
    duties:
      - Giữ chữ tín với thương hội và bạn hàng các bến
      - Nộp thuế thương chính và phí bến bãi
    ranks:
      - id: hang_xao
        name: Tiểu thương gánh chợ
        min_merit: 0
        stipend_money_month: 0.2
        modifiers:
          - { target: xp.thuong_mai, value: 1.15, op: mul }
      - id: chu_sap
        name: Chủ sạp bến sông
        min_merit: 25
        condition: { var: player.skill.thuong_mai, op: '>=', value: 3 }
        stipend_money_month: 0.5
        modifiers:
          - { target: xp.thuong_mai, value: 1.2, op: mul }
          - { target: xp.ngoai_giao, value: 1.1, op: mul }
      - id: lai_buon_duong_dai
        name: Thương khách đường dài
        min_merit: 60
        condition: { var: player.skill.thuong_mai, op: '>=', value: 5 }
        stipend_money_month: 1.0
        modifiers:
          - { target: xp.thuong_mai, value: 1.25, op: mul }
      - id: phu_thuong_hoi_chu
        name: Đại chưởng quỹ thương hội
        min_merit: 110
        condition:
          all:
            - { var: player.skill.thuong_mai, op: '>=', value: 7 }
            - { var: household.money, op: '>=', value: 60 }
        stipend_money_month: 2.0
        modifiers:
          - { target: xp.thuong_mai, value: 1.3, op: mul }
          - { target: living.cost, value: 0.9, op: mul }
    actions:
      - id: chuyen_buon_len_tran
        name: Đánh chuyến hàng lên trấn
        description: Gom nông sản, vải vóc chở thuyền lên chợ trấn bán kiếm lời theo thời giá.
        hint: 'Lời to khi Chỉ số giá buôn >= 1.1; coi chừng thảo khấu khi tuần tra thấp'
        cooldown_months: 5
        cost_money: 4
        chance:
          base: 0.5
          skill: thuong_mai
          per_level: 0.05
          max: 0.85
          modifiers:
            - { condition: { var: world.trade_index, op: '>=', value: 1.12 }, add: 0.2 }
            - { condition: { var: world.trade_index, op: '<', value: 0.9 }, add: -0.15 }
        success:
          - { type: money, value: { var: world.trade_index, factor: 7, round: true }, ledger: buon_ban }
          - { type: career_merit, value: 15 }
          - { type: skill_xp, skill: thuong_mai, value: 20 }
        failure:
          - { type: stress, value: 5 }
          - { type: career_merit, value: 3 }
        success_log:
          - 'Đúng lúc trên trấn khan hàng! Chuyến buôn bán đắt như tôm tươi, thu lời đậm.'
        failure_log:
          - 'Hàng ế ẩm lại gặp mưa ẩm mốc, chuyến đi chỉ vừa đủ bù chi phí.'
      - id: dau_co_mua_giap_hat
        name: Thu gom hàng hiếm chờ thời
        description: Bỏ vốn lớn gom muối mắm và lụa tốt, đợi tháng khan hiếm tung ra thị trường.
        hint: 'Cần vốn 8 quan, thắng lớn khi giá buôn cao'
        cooldown_months: 8
        cost_money: 8
        chance:
          base: 0.45
          skill: thuong_mai
          per_level: 0.05
          max: 0.8
          modifiers:
            - { condition: { var: world.trade_index, op: '>=', value: 1.15 }, add: 0.25 }
        success:
          - { type: money, value: 14, ledger: buon_ban }
          - { type: career_merit, value: 22 }
          - { type: skill_xp, skill: thuong_mai, value: 25 }
        failure:
          - { type: money, value: 3, ledger: buon_ban }
          - { type: stress, value: 6 }
        success_log:
          - 'Con mắt nhìn xa trông rộng giúp bạn thắng lớn, tiền bạc chảy đầy tay nải.'
        failure_log:
          - 'Thuyền hàng nơi khác ập về phá giá, đành bán tháo thu hồi một phần vốn.'

  - id: linh
    name: Lính → Tướng
    description: Khoác áo lính, cầm giáo giữ biên cương. Đổi mồ hôi và máu trên chiến trường lấy quân công, bổng lộc và chức tước.
    icon: phu
    components: [military_rank]
    default_focus: ren_luyen
    event_weights: { quan_su: 2.0, vo_nghe: 1.6, nguy_hiem: 1.3 }
    economy:
      self_farm: true
    entry_condition:
      all:
        - { var: player.health, op: '>=', value: 55 }
        - { var: player.wanted, op: '==', value: 0 }
    join: { cost_money: 0, hint: 'Cần sức khỏe tốt và không vướng truy nã. Vào lính là xa nhà, nhiều hiểm nguy.' }
    duties:
      - Tuân lệnh điều động tuần biên, dẹp loạn
      - Rèn luyện võ nghệ và giữ kỷ luật quân ngũ
    ranks:
      - id: tan_binh
        name: Binh đinh
        min_merit: 0
        stipend_money_month: 0.8
        stipend_food_month: 1.5
        modifiers:
          - { target: xp.quan_su, value: 1.2, op: mul }
          - { target: death_risk, value: 1.1, op: mul }
      - id: ngu_truong
        name: Ngũ trưởng
        min_merit: 25
        condition: { var: player.skill.quan_su, op: '>=', value: 2 }
        stipend_money_month: 1.4
        stipend_food_month: 2.0
        modifiers:
          - { target: xp.quan_su, value: 1.25, op: mul }
          - { target: death_risk, value: 1.12, op: mul }
      - id: doi_truong
        name: Đội trưởng cấm vệ
        min_merit: 55
        condition: { var: player.skill.quan_su, op: '>=', value: 4 }
        stipend_money_month: 2.4
        stipend_food_month: 3.0
        modifiers:
          - { target: xp.quan_su, value: 1.3, op: mul }
          - { target: xp.quan_tri, value: 1.15, op: mul }
      - id: do_uy
        name: Đô úy thống binh
        min_merit: 95
        condition: { var: player.skill.quan_su, op: '>=', value: 6 }
        stipend_money_month: 4.0
        stipend_food_month: 4.0
        modifiers:
          - { target: xp.quan_su, value: 1.35, op: mul }
      - id: tuong_quan
        name: Trấn thủ Tướng quân
        min_merit: 150
        condition:
          all:
            - { var: player.skill.quan_su, op: '>=', value: 8 }
            - { var: player.reputation, op: '>=', value: 20 }
        stipend_money_month: 6.5
        stipend_food_month: 6.0
        modifiers:
          - { target: xp.quan_su, value: 1.4, op: mul }
          - { target: living.cost, value: 0.85, op: mul }
    actions:
      - id: tuan_tra_anh_ai
        name: Tuần tiễu đường đèo
        description: Dẫn toán lính tuần tra đường đèo, truy quét trộm cướp bảo vệ dân lành.
        hint: 'Lập công nhanh khi biên ải đang mức Tuần tra hoặc Chiến dịch'
        cooldown_months: 5
        chance:
          base: 0.55
          skill: quan_su
          per_level: 0.05
          modifiers:
            - { condition: { var: world.military_alert, op: 'in', value: [tuan_tra, chien_dich] }, add: 0.15 }
        success:
          - { type: career_merit, value: 16 }
          - { type: money, value: 3, ledger: luong_nghe }
          - { type: reputation, group: dan_lang, value: 4 }
          - { type: skill_xp, skill: quan_su, value: 20 }
        failure:
          - { type: health, value: -7 }
          - { type: stress, value: 4 }
        success_log:
          - 'Bắt gọn toán cướp cỏ trên đèo, quan trên ban thưởng tiền và ghi sổ quân công.'
        failure_log:
          - 'Đường rừng hiểm trở lại gặp mưa tên phục kích, bạn bị xây xát nhẹ khi rút quân.'
      - id: xung_phong_chien_dich
        name: Xung phong lập chiến công
        description: Tình nguyện đi mũi tiên phong trong đợt tập kích sào huyệt địch.
        hint: 'Rủi ro bị thương cao, nhưng thắng lợi sẽ thăng tiến vượt bậc'
        cooldown_months: 8
        chance:
          base: 0.45
          skill: quan_su
          per_level: 0.06
          modifiers:
            - { condition: { var: world.military_alert, op: '==', value: chien_dich }, add: 0.2 }
        success:
          - { type: career_merit, value: 28 }
          - { type: money, value: 8, ledger: luong_nghe }
          - { type: reputation, group: dan_lang, value: 8 }
          - { type: skill_xp, skill: quan_su, value: 30 }
        failure:
          - { type: health, value: -14 }
          - { type: stress, value: 7 }
          - { type: career_merit, value: 5 }
        success_log:
          - 'Cờ tiên phong cắm trên lũy giặc! Tiếng reo hò vang dậy, tên bạn được tâu lên trấn phủ.'
        failure_log:
          - 'Trận đánh ác liệt hơn dự tính, bạn mang thương tích mở đường máu rút về.'

  - id: thao_khau
    name: Thảo khấu
    description: Sống ngoài vòng pháp luật nơi rừng xanh núi đỏ. Tự do tự tại, lấy của nhà giàu chia cho anh em, nhưng luôn đối mặt lệnh truy nã của quan phủ.
    icon: nguy_hiem
    components: [outlaw_band]
    default_focus: ren_luyen
    event_weights: { nguy_hiem: 1.8, quan_su: 1.3, lang_xa: 0.7 }
    economy:
      self_farm: true
    entry_condition:
      all:
        - any:
            - { var: household.debt, op: '>=', value: 25 }
            - { var: player.wanted, op: '>', value: 0 }
            - { var: player.status_rank, op: '==', value: dan_ngheo }
        - any:
            - { has_trait: can_dam }
            - { has_trait: tu_do }
            - { has_trait: tan_nhan }
    join: { cost_money: 0, hint: 'Chỉ khi cùng đường (nợ nặng, bị truy nã hoặc nghèo khổ) và đủ gan. Mất tiếng lương thiện.' }
    duties:
      - Giữ uy tín và chia chiến lợi phẩm công bằng cho anh em trong trại
      - Tránh tai mắt tuần tiễu của quan quân trên trấn
    ranks:
      - id: tot_do
        name: Tốt đỏ rừng xanh
        min_merit: 0
        modifiers:
          - { target: xp.muu_luoc, value: 1.15, op: mul }
          - { target: xp.quan_su, value: 1.15, op: mul }
          - { target: death_risk, value: 1.12, op: mul }
      - id: dau_muc
        name: Đầu mục tuần sơn
        min_merit: 25
        stipend_money_month: 0.8
        modifiers:
          - { target: xp.muu_luoc, value: 1.2, op: mul }
          - { target: xp.quan_su, value: 1.2, op: mul }
      - id: nhi_duong_gia
        name: Nhị đương gia sơn trại
        min_merit: 60
        condition: { var: player.skill.muu_luoc, op: '>=', value: 4 }
        stipend_money_month: 1.8
        modifiers:
          - { target: xp.muu_luoc, value: 1.25, op: mul }
          - { target: xp.quan_su, value: 1.25, op: mul }
      - id: dai_duong_gia
        name: Đại đương gia một cõi
        min_merit: 110
        condition:
          all:
            - { var: player.skill.quan_su, op: '>=', value: 6 }
            - { var: player.skill.muu_luoc, op: '>=', value: 5 }
        stipend_money_month: 3.5
        modifiers:
          - { target: xp.muu_luoc, value: 1.3, op: mul }
          - { target: xp.quan_su, value: 1.3, op: mul }
    actions:
      - id: chan_duong_thuong_khach
        name: Thu mãi lộ trên đèo
        description: Đón lõng các đoàn xe buôn qua đèo vắng để thu tiền mãi lộ.
        hint: 'Dễ thành công khi Mức tuần tra quan phủ < 40; tăng mức truy nã'
        cooldown_months: 5
        chance:
          base: 0.55
          skill: muu_luoc
          per_level: 0.05
          modifiers:
            - { condition: { var: world.patrol_level, op: '<', value: 35 }, add: 0.2 }
            - { condition: { var: world.patrol_level, op: '>=', value: 55 }, add: -0.25 }
        success:
          - { type: money, value: 9, ledger: su_kien }
          - { type: food, value: 8, ledger: su_kien }
          - { type: career_merit, value: 16 }
          - { type: wanted, value: 8 }
          - { type: skill_xp, skill: muu_luoc, value: 18 }
        failure:
          - { type: health, value: -9 }
          - { type: wanted, value: 12 }
          - { type: stress, value: 5 }
        success_log:
          - 'Đoàn xe buôn vội vã nộp tiền mãi lộ rồi chạy biến. Anh em trong trại mở tiệc lớn.'
        failure_log:
          - 'Ngờ đâu gặp phải đoàn hộ tống có lính trấn đi kèm! Cả toán phải lẩn vào rừng sâu.'
      - id: an_nau_xoa_dau_vet
        name: Ẩn mình xóa dấu vết
        description: Tạm đóng cửa sơn trại, tung tin giả để làm nguội lệnh truy nã của quan phủ.
        hint: 'Giảm mạnh mức truy nã và căng thẳng'
        cooldown_months: 6
        cost_money: 2
        chance:
          base: 0.65
          skill: muu_luoc
          per_level: 0.05
        success:
          - { type: wanted, value: -18 }
          - { type: stress, value: -5 }
          - { type: skill_xp, skill: muu_luoc, value: 15 }
        failure:
          - { type: wanted, value: -5 }
        success_log:
          - 'Quan quân tưởng toán cướp đã dạt sang xứ khác, lệnh truy tầm lắng xuống hẳn.'
        failure_log:
          - 'Mấy tên tuần đinh vẫn lảng vảng dưới chân núi, chỉ giảm được chút ít nghi ngờ.'

  - id: si_tu
    name: Sĩ tử → Quan văn
    description: Dùi mài kinh sử, lều chõng đi thi. Đỗ đạt thì được bổ làm quan, rạng danh tông tộc; lận đận thì làm thầy đồ dạy chữ nuôi thân.
    icon: sach
    components: [exam_ladder]
    youth_career: si_tu          # con nhà nho đến tuổi thì làm Nho sinh (đi học), không phụ việc nhà
    default_focus: hoc_tap
    event_weights: { hoc_hanh: 2.0, van_minh: 1.6, ruong_dong: 0.4, lao_dong: 0.5 }
    entry_condition:
      any:
        - { var: player.skill.hoc_van, op: '>=', value: 3 }
        - { var: player.exam_degree, op: '!=', value: none }
    join: { cost_money: 1, hint: 'Cần Học vấn từ bậc 3 và 1 quan giấy bút. Nhà bớt một tay làm.' }
    duties:
      - Dùi mài kinh sử, ứng thí mỗi khoa thi
      - Giữ lễ nghĩa, làm gương cho dân làng và con cháu
    # Nhà nho không cầm cày: ruộng phát canh thu tô, sống bằng nghề chữ; người nhà chỉ dệt vải, chép sách kiếm thêm
    economy:
      self_farm: false
      family_wage_month: 0.2    # [1.5] hạ từ 0.3
      income: { money_month: 0.4, skill: hoc_van, per_level: 0.07, ledger: day_hoc }
    ranks:
      - id: nho_sinh
        name: Nho sinh dùi mài kinh sử
        min_merit: 0
        modifiers:
          - { target: xp.hoc_van, value: 1.15, op: mul }
      - id: thay_do
        name: Thầy đồ trường làng
        min_merit: 20
        condition: { var: player.skill.hoc_van, op: '>=', value: 3 }
        stipend_money_month: 0.4
        modifiers:
          - { target: xp.hoc_van, value: 1.15, op: mul }
          - { target: xp.ngoai_giao, value: 1.05, op: mul }
      - id: huan_dao
        name: Huấn đạo hàng huyện
        min_merit: 40
        condition: { var: player.exam_degree, op: 'in', value: [huong_cong, tien_si] }
        stipend_money_month: 0.9
        modifiers:
          - { target: xp.quan_tri, value: 1.2, op: mul }
      - id: tri_huyen
        name: Tri huyện
        min_merit: 70
        condition:
          any:
            - { var: player.exam_degree, op: '==', value: tien_si }
            - { all: [{ var: player.exam_degree, op: '==', value: huong_cong }, { var: player.skill.quan_tri, op: '>=', value: 5 }] }
        stipend_money_month: 2.0
        modifiers:
          - { target: xp.quan_tri, value: 1.3, op: mul }
          - { target: living.cost, value: 0.9, op: mul }
    actions:
      - id: mo_lop_day_chu
        name: Mở lớp dạy chữ
        description: Nhận con em trong làng về hiên nhà dạy Tam tự kinh, lấy lễ thầy bằng gạo tiền.
        hint: 'Học vấn càng cao càng đông học trò; tăng công trạng và danh tiếng làng'
        cooldown_months: 6
        chance:
          base: 0.6
          skill: hoc_van
          per_level: 0.04
        success:
          - { type: money, value: 3, ledger: day_hoc }
          - { type: career_merit, value: 10 }
          - { type: reputation, group: dan_lang, value: 3 }
          - { type: skill_xp, skill: hoc_van, value: 12 }
        failure:
          - { type: money, value: 1, ledger: day_hoc }
          - { type: stress, value: 3 }
        success_log:
          - 'Học trò kéo đến đông vui, tiếng ê a đọc sách vang cả xóm, lễ thầy cuối mùa đầy một thúng.'
        failure_log:
          - 'Mùa này nhà nào cũng túng, chỉ lèo tèo vài đứa trẻ theo học.'
      - id: binh_van_hoi_tho
        name: Dự hội bình văn của sĩ phu
        description: Mang văn bài đến hội tao đàn trên huyện, kết giao với các bậc khoa bảng.
        hint: 'Tốn 1 quan trà rượu; tăng Danh vọng sĩ phu và công trạng'
        cooldown_months: 8
        cost_money: 1
        chance:
          base: 0.5
          skill: ngoai_giao
          per_level: 0.06
        success:
          - { type: scholarly_prestige, value: 6 }
          - { type: career_merit, value: 12 }
          - { type: skill_xp, skill: ngoai_giao, value: 15 }
        failure:
          - { type: scholarly_prestige, value: 1 }
          - { type: stress, value: 3 }
        success_log:
          - 'Bài phú của bạn được cả hội chuyền tay ngâm nga, một vị Tiến sĩ hồi hưu mời bạn ghé nhà đàm đạo.'
        failure_log:
          - 'Văn chương còn non, bạn chỉ ngồi nghe các bậc tiền bối bình phẩm.'
      - id: viet_van_khe
        name: Viết văn khế, đơn từ thuê
        description: Viết hộ dân làng văn tự mua bán ruộng đất, đơn kiện, câu đối Tết.
        hint: 'Kiếm tiền nhanh, sai sót thì mất tiếng'
        cooldown_months: 4
        chance:
          base: 0.7
          skill: hoc_van
          per_level: 0.03
        success:
          - { type: money, value: 2, ledger: day_hoc }
          - { type: career_merit, value: 5 }
        failure:
          - { type: reputation, group: dan_lang, value: -2 }
          - { type: stress, value: 2 }
        success_log:
          - 'Nét chữ rồng bay phượng múa, khách cầm văn khế về còn biếu thêm buồng cau.'
        failure_log:
          - 'Viết sót một chữ trong văn tự, hai bên kiện cáo nhau rồi đổ lỗi cho bạn.'

  # ── Chưa có nghề riêng (kind: trang_thai) — không có lương, hành động, thăng bậc ──
  - id: phu_gia_dinh
    name: Phụ việc nhà
    kind: trang_thai
    description: Chưa có nghề riêng, phụ cha mẹ trong nghề nhà. Mỗi tháng thêm chút kinh nghiệm — khi làm chủ hộ sẽ tiếp quản nghề nhà, hoặc đủ điều kiện thì ra làm riêng.
    icon: nha
    merit_month: 1
    duties:
      - Phụ giúp nghề nhà, nghe lời cha mẹ
    ranks:
      - id: phu_viec
        name: Phụ giúp nghề nhà
  - id: that_nghiep
    name: Thất nghiệp
    kind: trang_thai
    description: Chưa có việc làm. Có thể tìm việc, theo người học nghề, đi lính — hoặc chờ một cơ hội.
    icon: su_kien
    duties:
      - Tìm việc làm, kiếm bữa qua ngày
    ranks:
      - id: khong_viec
        name: Chưa có việc
        modifiers:
          - { target: stress.monthly, value: 0.15 }

