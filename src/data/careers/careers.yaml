          - 'Sổ sách bị chuột cắn mất mấy trang, phải đi lại từng xã hỏi, mất cả tháng trời.'
          - 'Thư lại đồng liêu ghen tị, mách quan rằng bạn nhận quà của các làng, bạn phải giải trình mỏi miệng.'
