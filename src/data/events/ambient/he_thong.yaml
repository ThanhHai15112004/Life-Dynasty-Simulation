  - id: sys.nam_yen_binh_thuong
    kind: he_thong
    importance: 2
    icon: binh_yen
    variants:
      - 'Một năm trôi qua lặng lẽ, ngày ra đồng, tối về bên bếp lửa.'
  - id: sys.nam_yen_kem
    kind: he_thong
    importance: 2
    tone: buon
    icon: binh_yen
    variants:
