  - id: sys.chuyen_nghe
    kind: he_thong
    importance: 7
    highlight: true
    icon: moc_doi
    variants:
      - 'Bạn rẽ sang con đường mới: theo nghề {title} ({stage}).'
      - 'Một ngã rẽ cuộc đời: từ nay bạn bước vào nghề {title}, bậc {stage}.'
  - id: sys.thang_bac_nghe
    kind: he_thong
    importance: 7
    highlight: true
    tone: vui
    icon: moc_doi
    variants:
      - 'Nhờ công trạng tích lũy, bạn được thăng lên bậc "{stage}" trong nghề {title}!'
      - 'Tiếng tăm và bản lĩnh được ghi nhận: bạn bước lên bậc "{stage}" ({title}).'
  - id: sys.do_khoa_cu
    kind: he_thong
    importance: 9
    highlight: true
    tone: vui
    icon: sach
    variants:
