      - 'Sau bao năm đèn sách, bạn chính thức đỗ "{title}", rạng danh tông tộc!'
  - id: sys.bat_dau_cu_tang
    kind: he_thong
    importance: 7
    highlight: true
    tone: buon
    icon: tang
    variants:
      - 'Theo lễ Nho giáo, bạn bước vào kỳ cư tang {call} trong {amount} tháng.'
      - 'Nhà có đại tang {call}: bạn giữ lễ cư tang {amount} tháng để trọn đạo hiếu.'
  - id: sys.dia_vi_len
    kind: he_thong
    importance: 7
    highlight: true
    tone: vui
    icon: moc_doi
    variants:
