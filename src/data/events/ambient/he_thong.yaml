      - 'Trái gió trở trời, {call} mắc chứng {title}.'
  - id: sys.khoi_benh
    kind: bao_cao
    importance: 3
    tone: vui
    icon: binh_yen
    short: '{call} khỏi bệnh {title}'
    variants:
