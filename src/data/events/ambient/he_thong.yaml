      - { type: stress, value: -6 }
  - id: sys.sinh_con
    kind: he_thong
    importance: 8
    highlight: true
    tone: vui
    icon: sinh_nhat
    variants:
      - 'Tiếng khóc chào đời vang trong gian nhà: bạn đón thêm một {title} — {call}.'
      - 'Tin mừng trong nhà: {call} vừa chào đời khỏe mạnh.'
    effects:
      - { type: stress, value: -4 }
  - id: sys.mac_benh
    kind: he_thong
    importance: 5
    tone: buon
    icon: om
    variants:
