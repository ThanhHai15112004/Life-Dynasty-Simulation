# [0] Mẫu nhật ký do mô phỏng tự sinh (nguồn a — GDD 05 §12.2). Code gọi theo id, chữ nằm ở đây.
# Token tham số: {age}, {amount}, {sao}, {food}, {money}, {skill}, {level}, {stage}, {call}, {cause}, {title}, {items}
templates:
  - id: sys.khoi_dau
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con nhà nông ở làng {world.settlement}. Nhà có {household.farmland} sào ruộng, kho còn {household.food} thúng thóc.'
  - id: sys.khoi_dau_nha_buon
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con nhà buôn ở bến {world.settlement}. Nhà có một sạp hàng ngoài chợ, {household.money} quan vốn xoay vòng và {household.farmland} sào ruộng cho cấy rẽ.'
  - id: sys.khoi_dau_nha_nho
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con cháu một dòng hương hào ở làng {world.settlement}. Nếp nhà ngói cổ còn đó, {household.farmland} sào ruộng hương hỏa, nhưng nợ cũ đã lên {household.debt} quan.'
  - id: sys.sinh_nhat
    kind: bao_cao
    importance: 1
    icon: sinh_nhat
    short: 'tròn {age} tuổi'
    variants:
      - 'Bạn tròn {age} tuổi.'
      - 'Thêm một tuổi: bạn đã {age}.'
      - 'Mẹ đếm trên đầu ngón tay: bạn vừa tròn {age}.'
  - id: sys.giai_doan_doi
    kind: he_thong
    importance: 6
    highlight: true
    icon: moc_doi
    variants:
      - 'Bạn bước vào tuổi {stage}.'
      - 'Một chặng đời mới bắt đầu: {stage}.'
  - id: sys.ky_nang_tang
    kind: bao_cao
    importance: 2
    icon: ky_nang
    short: '{skill} lên bậc {level}'
    variants:
      - 'Kỹ năng {skill} của bạn lên bậc {level}.'
      - 'Bạn thấy mình khá hơn hẳn về {skill} (bậc {level}).'
  - id: sys.nop_thue
    kind: bao_cao
    importance: 1
    icon: thue
    short: 'nộp thuế {food} thúng, {money} quan sưu'
    variants:
      - 'Mõ làng gọi nộp thuế: nhà nộp {food} thúng thóc và {money} quan tiền sưu.'
      - 'Đến kỳ thuế, nhà gánh {food} thúng thóc ra đình và nộp {money} quan sưu.'
  - id: sys.vay_nang_lai
    kind: bao_cao
    importance: 4
