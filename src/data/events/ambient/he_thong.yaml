      - 'Người của chủ nợ đến cắm cọc: một {title} không còn là của nhà nữa. Nợ chỉ bớt được {amount} quan.'
    effects:
      - { type: stress, value: 8 }
  - id: sys.doi_kem
    kind: he_thong
    importance: 6
    highlight: true
    tone: buon
    icon: mat_mua
    variants:
