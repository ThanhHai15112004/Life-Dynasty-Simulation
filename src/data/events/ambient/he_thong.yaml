      - 'Chỗ ngồi nơi đình trung đã đổi: bạn bước lên hàng "{title}".'
  - id: sys.dia_vi_xuong
    kind: he_thong
    importance: 7
    highlight: true
    tone: buon
    icon: moc_doi
    variants:
      - 'Thế nhà sa sút, người làng giờ xếp bạn vào hàng "{title}".'
      - 'Lời chào ngoài ngõ đã khác trước: bạn chỉ còn là "{title}".'
  - id: sys.thu_to
    kind: bao_cao
    importance: 2
    icon: lua
    short: 'thu {amount} thúng thóc tô'
    variants:
      - 'Tá điền gánh thóc tô đến nộp: được {amount} thúng từ {sao} sào ruộng phát canh.'
      - 'Mùa gặt, ruộng cho cấy rẽ nộp về {amount} thúng thóc tô.'
  # [1.5] Nhà tự lo vun vén: bán thóc dư sau gặt, mua thêm của, cha mẹ già giao việc nhà
  - id: sys.ban_thoc_du
    kind: bao_cao
    importance: 1
    icon: tien
    short: 'bán {amount} thúng thóc dư được {money} quan'
    variants:
      - 'Gặt xong, nhà để lại đủ thóc ăn, gánh {amount} thúng dư ra chợ bán được {money} quan.'
      - 'Kho đã đầy, {amount} thúng thóc dư bán cho lái buôn, thu về {money} quan.'
  - id: sys.mua_them_cua
    kind: he_thong
    importance: 5
    highlight: true
    icon: nha
    short: 'mua thêm {title}'
    variants:
      - 'Dành dụm mấy năm, nhà mua thêm {title} hết {money} quan.'
      - 'Có của để dành, nhà bỏ ra {money} quan sắm thêm {title}.'
  - id: sys.giao_viec_nha
    kind: he_thong
    importance: 7
    highlight: true
    icon: nha
    variants:
      - '{call} tuổi đã cao, gọi bạn lại giao chìa khóa rương và sổ sách. Từ nay bạn là chủ hộ, lo liệu việc nhà.'
      - 'Thấy bạn đã yên bề gia thất, {call} giao lại việc nhà. Từ nay bạn làm chủ hộ, cha mẹ chỉ còn ngồi trông cháu.'
  - id: sys.chua_khoi
    kind: bao_cao
    importance: 4
    tone: vui
    icon: binh_yen
    short: 'chạy thuốc cho {call}, khỏi {title}'
    variants:
      - 'Bỏ ra {money} quan mời thầy bốc thuốc cho {call}. Mấy thang thuốc đắng, cơn {title} lui hẳn.'
      - 'Thầy lang bắt mạch, kê đơn, lấy {money} quan tiền thuốc. Chẳng bao lâu {call} đã khỏi {title}.'
  - id: sys.chua_khong_do
    kind: bao_cao
    importance: 4
    tone: buon
    icon: om
    short: 'chạy thuốc cho {call} mà chưa đỡ'
    variants:
      - 'Tốn {money} quan tiền thuốc mà bệnh {title} của {call} vẫn chưa thuyên giảm. Đành chờ thêm ít lâu.'
      - 'Thang thuốc {money} quan sắc đi sắc lại, {call} vẫn chưa dứt cơn {title}.'
  - id: sys.thua_ke_nghe
    kind: he_thong
    importance: 7
    highlight: true
    icon: moc_doi
    variants:
      - 'Từ nay bạn đứng ra gánh vác nhà cửa, tiếp quản nghề nhà: {title}, bậc "{stage}".'
      - 'Bao năm phụ việc nay thành người cầm trịch: bạn tiếp quản nghề {title} ({stage}).'
  - id: sys.bat_dau_tu_lap
    kind: he_thong
    importance: 6
    highlight: true
    icon: moc_doi
    variants:
      - 'Bạn đã đến tuổi tự lo cho mình. Chưa có nghề riêng, bạn bắt đầu bằng việc: {title}.'
      - 'Lớn rồi, bạn bắt đầu tự lập. Việc của bạn lúc này: {title}; nghề nhà vẫn là {stage}.'
  # [2] Tách hộ, thừa kế và điềm báo trước cái chết (Phase 2)
  - id: sys.tach_ho
    kind: he_thong
    importance: 8
    highlight: true
    tone: vui
    icon: nha
    variants:
      - 'Đã yên bề gia thất, vợ chồng bạn xin phép {call} ra ở riêng. Cha mẹ cắt cho {sao} sào ruộng, {money} quan tiền và {food} thúng thóc làm vốn lập hộ mới.'
      - 'Ngày phân gia: bạn dựng mái nhà tranh riêng cạnh vườn cũ, nhận {sao} sào ruộng cùng {money} quan tiền cha mẹ chia cho.'
  - id: sys.anh_em_tach_ho
    kind: he_thong
    importance: 5
    icon: nha
    variants:
      - '{call} đã thành gia lập thất, xin tách ra ở riêng với {sao} sào ruộng và {money} quan tiền vốn.'
      - 'Nhà chia phần cho {call} ra lập hộ mới ({sao} sào ruộng, {money} quan tiền).'
  - id: sys.thua_ke
    kind: he_thong
    importance: 8
    highlight: true
    icon: nha
    variants:
      - 'Sau lễ tang {call}, họ tộc mở sổ phân chia di sản theo luật Nho giáo: phần của bạn là {sao} sào ruộng và {money} quan tiền.'
      - 'Chiếu theo lệ hương hỏa và di ngôn của {call}, bạn tiếp nhận {sao} sào ruộng cùng {money} quan tiền di sản.'
  - id: sys.diem_bao_om_yeu
    kind: he_thong
    importance: 6
    highlight: true
    tone: buon
    icon: om
    variants:
      - 'Điềm chẳng lành: {call} ({age} tuổi) hơi thở yếu ớt, sắc mặt xám ngoét, e chẳng qua nổi mấy tháng tới nếu không có thuốc tiên.'
      - 'Đêm nghe tiếng cú kêu ngoài đầu hồi: bệnh tình và sức vóc của {call} ({age} tuổi) đã suy kiệt đến mức thập tử nhất sinh.'
  # [2] Truyền đời (Phase 3 — Dynasty)
  - id: sys.tiep_noi_dong_doi
    kind: he_thong
    importance: 9
    highlight: true
    tone: trung_tinh
    icon: moc_doi
    variants:
      - 'Khép lại cuộc đời của {prev}, bạn tiếp bước làm chủ Đời thứ {generation} của dòng họ với {sao} sào ruộng và {money} quan tiền.'
      - 'Tre già măng mọc: sau tang lễ {prev}, bạn đứng ra gánh vác Đời thứ {generation} ({sao} sào ruộng, {money} quan tiền).'
  - id: sys.giam_ho_tuoi_tho
    kind: he_thong
    importance: 8
    highlight: true
    tone: trung_tinh
    icon: nha
    variants:
      - '{prev} qua đời khi bạn còn thơ ấu. {call} đứng ra làm người giám hộ, thay bạn trông coi việc nhà Đời thứ {generation} cho đến ngày trưởng thành.'
      - 'Bạn bước vào Đời thứ {generation} khi tuổi còn nhỏ. Mọi việc đồng áng, sổ sách tạm giao cho {call} giám hộ.'
  - id: sys.nhan_con_nuoi
    kind: he_thong
    importance: 8
    highlight: true
    tone: vui
    icon: sinh_nhat
    variants:
      - 'Lập lễ trước bàn thờ gia tiên, bạn nhận {call} ({age} tuổi) làm con nuôi để nối dõi tông đường.'
      - 'Từ nay {call} ({age} tuổi) chính thức mang họ nhà bạn, sớm hôm quây quần dưới mái nhà.'
  - id: sys.don_chau_ho
    kind: he_thong
    importance: 8
    highlight: true
    tone: vui
    icon: nha
    variants:
      - 'Bạn đón {call} ({age} tuổi) từ chi xa về ở cùng, truyền dạy nếp nhà để ngày sau có người hương khói.'
      - 'Họ tộc chứng giám: {call} ({age} tuổi) được đón về lập tự, tiếp nối huyết mạch dòng họ.'
  - id: sys.hoan_thanh_di_nguyen
    kind: he_thong
    importance: 9
    highlight: true
    tone: vui
    icon: moc_doi
