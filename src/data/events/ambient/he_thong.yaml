# [0] Mẫu nhật ký do mô phỏng tự sinh (nguồn a — GDD 05 §12.2). Code gọi theo id, chữ nằm ở đây.
# Token tham số: {age}, {amount}, {sao}, {food}, {money}, {skill}, {level}, {stage}, {call}, {cause}, {title}, {items}
templates:
  - id: sys.khoi_dau
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con nhà lao động ở {world.settlement}. Nhà có {household.farmland} {lex.land}, dự trữ còn {household.food} {lex.food}.'
  - id: sys.khoi_dau_nha_buon
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con nhà buôn ở {world.settlement}. Gia đình có cơ sở buôn bán, {household.money} {lex.currency} vốn xoay vòng và {household.farmland} {lex.land} cho thuê.'
  - id: sys.khoi_dau_nha_nho
    kind: he_thong
    importance: 7
    highlight: true
    icon: khoi_dau
    variants:
      - 'Bạn là {player.name}, {player.age} tuổi, con cháu một dòng họ danh giá cũ ở {world.settlement}. Nếp nhà xưa còn đó cùng {household.farmland} {lex.land} gia sản, nhưng nợ cũ đã lên {household.debt} {lex.currency}.'
  - id: sys.sinh_nhat
    kind: bao_cao
    importance: 1
    icon: sinh_nhat
    short: 'tròn {age} tuổi'
    variants:
      - 'Bạn tròn {age} tuổi.'
      - 'Thêm một tuổi: bạn đã {age}.'
      - 'Mẹ đếm trên đầu ngón tay: bạn vừa tròn {age}.'
  - id: sys.giai_doan_doi
    kind: he_thong
    importance: 6
    highlight: true
    icon: moc_doi
    variants:
      - 'Bạn bước vào tuổi {stage}.'
      - 'Một chặng đời mới bắt đầu: {stage}.'
  - id: sys.ky_nang_tang
    kind: bao_cao
    importance: 2
    icon: ky_nang
    short: '{skill} lên bậc {level}'
    variants:
      - 'Kỹ năng {skill} của bạn lên bậc {level}.'
      - 'Bạn thấy mình khá hơn hẳn về {skill} (bậc {level}).'
  - id: sys.nop_thue
    kind: bao_cao
    importance: 1
    icon: thue
    short: 'nộp thuế {food} {lex.food}, {money} {lex.currency}'
    variants:
      - 'Đến kỳ nghĩa vụ thuế khóa: gia đình nộp {food} {lex.food} lương thực và {money} {lex.currency}.'
      - 'Đóng thuế định kỳ: nhà nộp {food} {lex.food} và {money} {lex.currency} vào công quỹ.'
  - id: sys.vay_nang_lai
    kind: bao_cao
    importance: 4
    tone: buon
    icon: no
    variants:
      - 'Nhà hết tiền, phải vay nặng lãi {amount} {lex.currency} để xoay xở.'
      - 'Túng quá, gia đình đành đi vay {amount} {lex.currency}, lãi suất nặng nề.'
  - id: sys.ban_thoc_tieu
    kind: bao_cao
    importance: 1
    icon: tien
    short: 'bán {amount} {lex.food} lấy tiền tiêu'
    variants:
      - 'Cạn ngân quỹ chi dùng, nhà đem đổi {amount} {lex.food} dự trữ lấy {lex.currency}.'
      - 'Ngân quỹ cạn, gia đình đổi {amount} {lex.food} lương thực lấy tiền sinh hoạt.'
  - id: sys.bi_xiet_no
    kind: he_thong
    importance: 7
    highlight: true
    tone: buon
    icon: no
    variants:
      - 'Nợ chồng chất quá hạn. Chủ nợ xiết mất một {title}, trừ {amount} {lex.currency} vào sổ nợ.'
      - 'Chủ nợ đến thu giữ tài sản: một {title} không còn là của nhà nữa. Nợ chỉ bớt được {amount} {lex.currency}.'
    effects:
      - { type: stress, value: 8 }
  - id: sys.doi_kem
    kind: he_thong
    importance: 6
    highlight: true
    tone: buon
    icon: mat_mua
    variants:
      - 'Dự trữ trống rỗng, chẳng còn nơi vay mượn. Cả nhà đói lả, phải kiếm rễ cây rau dại cầm hơi.'
      - 'Cạn kiệt cái ăn, không còn ai cứu giúp. Bữa ăn cả nhà chỉ còn chút thức ăn hẩm hiu.'
    effects:
      - { type: stress, value: 6 }
  - id: sys.nguoi_than_mat
    kind: he_thong
    importance: 8
    highlight: true
    tone: buon
    icon: tang
    variants:
      - '{call} qua đời ở tuổi {age} vì {cause}.'
      - 'Nhà có tang: {call} đã mất vì {cause}, hưởng dương {age} tuổi.'
    effects:
      - { type: stress, value: 12 }
  - id: sys.nguoi_lang_mat
    kind: nguoi_quanh
    importance: 3
    tone: buon
    icon: tang
    variants:
      - '{call} quanh vùng qua đời ở tuổi {age}.'
      - 'Tin buồn trong cộng đồng: {call} mất vì {cause}, thọ {age} tuổi.'
  - id: sys.nguoi_lang_moi
    kind: nguoi_quanh
    importance: 2
    icon: lang
    variants:
      - '{call} đảm nhận vai trò {title} trong cộng đồng.'
  - id: sys.lam_chu_ho
    kind: he_thong
    importance: 7
    highlight: true
    icon: nha
    variants:
      - 'Từ nay bạn là chủ hộ, gánh vác cả nhà.'
  - id: sys.thu_hoach_duoc_mua
    kind: bao_cao
    importance: 3
    tone: vui
    icon: lua
    variants:
      - 'Được mùa lớn! {sao} {lex.land} canh tác thu về {amount} {lex.food} ({lex.crop}), kho bãi đầy ắp.'
      - 'Mùa màng bội thu ({lex.crop}): nhà thu hoạch được {amount} {lex.food}, ai cũng rạng rỡ.'
  - id: sys.thu_hoach_binh_thuong
    kind: bao_cao
    importance: 2
    icon: lua
    short: 'thu hoạch {amount} {lex.food}'
    variants:
      - 'Vụ này gia đình thu hoạch được {amount} {lex.food} ({lex.crop}).'
      - 'Mùa vụ khép lại, nhà thu về {amount} {lex.food} lương thực.'
  - id: sys.thu_hoach_kem
    kind: bao_cao
    importance: 3
    tone: buon
    icon: lua
    variants:
      - 'Thời tiết bất lợi, vụ này chỉ thu được {amount} {lex.food}.'
      - 'Mùa vụ kém: {sao} {lex.land} chỉ cho {amount} {lex.food} lương thực.'
  - id: sys.thu_hoach_mat_mua
    kind: bao_cao
    importance: 5
    tone: buon
    icon: mat_mua
    variants:
      - 'Mất mùa nặng. Cả nhà vất vả lắm mới thu vén được {amount} {lex.food}.'
      - 'Đồng bãi xơ xác, vụ này chỉ thu được {amount} {lex.food}. Cả nhà lo lắng nhìn kho dự trữ.'
  - id: sys.nam_yen_duoc_mua
    kind: he_thong
    importance: 2
    tone: vui
    icon: binh_yen
    variants:
      - 'Một năm bình yên. Mùa màng ({lex.crop}) thuận lợi, cả nhà no đủ.'
  - id: sys.nam_yen_binh_thuong
    kind: he_thong
    importance: 2
    icon: binh_yen
    variants:
      - 'Một năm trôi qua lặng lẽ, ngày chăm chỉ làm lụng, tối quây quần bên mái nhà.'
  - id: sys.nam_yen_kem
    kind: he_thong
    importance: 2
    tone: buon
    icon: binh_yen
    variants:
      - 'Năm nay chẳng có biến cố lớn, nhưng làm ăn kém thuận, bữa ăn phải dè sẻn hơn.'
  - id: sys.nam_yen_mat_mua
    kind: he_thong
    importance: 2
    tone: buon
    icon: mat_mua
    variants:
      - 'Một năm khó khăn. Cả vùng thắt lưng buộc bụng chờ thời vận năm sau.'
  - id: sys.nam_yen_hien_dai
    kind: he_thong
    importance: 2
    icon: binh_yen
    variants:
      - 'Một năm trôi qua trong nhịp sống bận rộn thường nhật: đi làm, lo toan chi phí sinh hoạt và giữ gìn mái ấm.'
      - 'Năm tháng lặng lẽ trôi giữa dòng đời hiện đại, gia đình bình an qua bốn mùa.'
  - id: sys.nam_yen_song_nuoc
    kind: he_thong
    importance: 2
    icon: binh_yen
    variants:
      - 'Một năm bình yên nơi bến nước: thuyền bè vào ra theo con nước, tôm cá đủ nuôi sống cả nhà.'
      - 'Sóng êm gió lặng trên sông: những buổi quăng chài, chở đò trôi qua êm ả.'
  - id: sys.nam_yen_pho_cho
    kind: he_thong
    importance: 2
    icon: binh_yen
    variants:
      - 'Một năm yên ả nơi phố thị: chợ búa họp đều, việc buôn bán và làm nghề giữ cho gia đình đủ sống.'
      - 'Năm tháng trôi qua nhịp nhàng theo tiếng người mua kẻ bán ngoài phố chợ.'
  - id: sys.tong_hop_nam
    kind: he_thong
    importance: 2
    icon: tong_hop
    variants:
      - 'Năm nay: {items}.'
  - id: sys.ket_hon
    kind: he_thong
    importance: 8
    highlight: true
    tone: vui
    icon: cuoi
    variants:
      - 'Lễ cưới ấm cúng: bạn nên duyên vợ chồng với {call} ({age} tuổi).'
      - 'Ngày vui sum họp, từ nay {call} về chung một mái nhà với bạn.'
    effects:
      - { type: stress, value: -6 }
  - id: sys.sinh_con
    kind: he_thong
    importance: 8
    highlight: true
    tone: vui
    icon: sinh_nhat
    variants:
      - 'Tiếng khóc chào đời vang trong gian nhà: bạn đón thêm một {title} — {call}.'
      - 'Tin mừng trong nhà: {call} vừa chào đời khỏe mạnh.'
    effects:
      - { type: stress, value: -4 }
  - id: sys.mac_benh
    kind: he_thong
    importance: 5
    tone: buon
    icon: om
    variants:
      - '{call} phát bệnh {title}, người mệt mỏi rã rời.'
      - 'Trái gió trở trời, {call} mắc chứng {title}.'
  - id: sys.khoi_benh
    kind: bao_cao
    importance: 3
    tone: vui
    icon: binh_yen
    short: '{call} khỏi bệnh {title}'
    variants:
      - 'Sau những ngày thuốc thang nghỉ ngơi, {call} đã khỏi chứng {title}.'
      - 'Sắc mặt hồng hào trở lại: {call} đã vượt qua cơn {title}.'
  - id: sys.dat_moc_tham_vong
    kind: he_thong
    importance: 7
    highlight: true
    tone: vui
    icon: moc_doi
    variants:
      - 'Một bước tiến lớn trên đường đời: bạn đạt được mốc "{title}".'
      - 'Nhìn lại công sức bỏ ra, lòng bạn mãn nguyện khi đạt mốc "{title}".'
  - id: sys.chuyen_nghe
    kind: he_thong
    importance: 7
    highlight: true
    icon: moc_doi
    variants:
      - 'Bạn rẽ sang con đường mới: theo nghề {title} ({stage}).'
      - 'Một ngã rẽ cuộc đời: từ nay bạn bước vào nghề {title}, bậc {stage}.'
  - id: sys.thang_bac_nghe
    kind: he_thong
    importance: 7
    highlight: true
    tone: vui
    icon: moc_doi
    variants:
      - 'Nhờ công trạng tích lũy, bạn được thăng lên bậc "{stage}" trong nghề {title}!'
      - 'Tiếng tăm và bản lĩnh được ghi nhận: bạn bước lên bậc "{stage}" ({title}).'
  - id: sys.do_khoa_cu
    kind: he_thong
    importance: 9
    highlight: true
    tone: vui
    icon: sach
    variants:
      - 'Tin mừng học vị! Bạn chính thức đạt học vị "{title}", rạng danh gia đình khắp vùng.'
      - 'Sau bao năm miệt mài đèn sách, bạn chính thức đỗ đạt học vị "{title}"!'
  - id: sys.bat_dau_cu_tang
    kind: he_thong
    importance: 7
    highlight: true
    tone: buon
    icon: tang
    variants:
      - 'Gia đình có đại tang {call}: bạn bước vào kỳ để tang trong {amount} tháng.'
      - 'Tưởng nhớ {call} vừa khuất, bạn giữ lễ để tang {amount} tháng để trọn đạo hiếu nghĩa.'
  - id: sys.dia_vi_len
    kind: he_thong
    importance: 7
    highlight: true
    tone: vui
    icon: moc_doi
    variants:
      - 'Mọi người xung quanh nhìn gia đình bạn bằng con mắt trọng vọng: từ nay bạn thuộc tầng lớp "{title}".'
      - 'Vị thế xã hội đã đổi khác: bạn bước lên hàng "{title}".'
  - id: sys.dia_vi_xuong
    kind: he_thong
    importance: 7
    highlight: true
    tone: buon
    icon: moc_doi
    variants:
      - 'Cơ ngơi sa sút, người đời giờ xếp gia đình bạn vào hàng "{title}".'
      - 'Ánh mắt người xung quanh đã khác trước: bạn chỉ còn ở bậc "{title}".'
  - id: sys.thu_to
    kind: bao_cao
    importance: 2
    icon: lua
    short: 'thu {amount} {lex.food} tô điền sản'
    variants:
      - 'Người thuê đất nộp tô định kỳ: thu về {amount} {lex.food} từ {sao} {lex.land} cho thuê.'
      - 'Mùa thu hoạch, đất cho thuê nộp về {amount} {lex.food} lợi tức.'
  # [1.5] Nhà tự lo vun vén: bán thóc dư sau gặt, mua thêm của, cha mẹ già giao việc nhà
  - id: sys.ban_thoc_du
    kind: bao_cao
    importance: 1
    icon: tien
    short: 'bán {amount} {lex.food} dư được {money} {lex.currency}'
    variants:
      - 'Sau mùa thu hoạch, nhà giữ lại đủ ăn, đem {amount} {lex.food} dư đi trao đổi thu về {money} {lex.currency}.'
      - 'Kho dự trữ đã đầy, {amount} {lex.food} dư bán cho thương lái thu về {money} {lex.currency}.'
  - id: sys.mua_them_cua
    kind: he_thong
    importance: 5
    highlight: true
    icon: nha
    short: 'mua thêm {title}'
    variants:
      - 'Dành dụm mấy năm, nhà mua thêm {title} hết {money} {lex.currency}.'
      - 'Có của để dành, nhà bỏ ra {money} {lex.currency} sắm thêm {title}.'
  - id: sys.giao_viec_nha
    kind: he_thong
    importance: 7
    highlight: true
    icon: nha
    variants:
      - '{call} tuổi đã cao, gọi bạn lại giao quyền trông coi gia sản. Từ nay bạn là chủ hộ, lo liệu việc nhà.'
      - 'Thấy bạn đã vững vàng, {call} giao lại việc nhà. Từ nay bạn làm chủ hộ, gánh vác gia đình.'
  - id: sys.chua_khoi
    kind: bao_cao
    importance: 4
    tone: vui
    icon: binh_yen
    short: 'chạy chữa cho {call}, khỏi {title}'
    variants:
      - 'Bỏ ra {money} {lex.currency} chạy chữa thuốc thang cho {call}. Sau đợt điều trị, cơn {title} lui hẳn.'
      - 'Người chữa bệnh thăm khám, cứu chữa với chi phí {money} {lex.currency}. Chẳng bao lâu {call} đã khỏi {title}.'
  - id: sys.chua_khong_do
    kind: bao_cao
    importance: 4
    tone: buon
    icon: om
    short: 'chạy chữa cho {call} mà chưa đỡ'
    variants:
      - 'Tốn {money} {lex.currency} tiền thuốc thang mà bệnh {title} của {call} vẫn chưa thuyên giảm. Đành chờ thêm ít lâu.'
      - 'Chi hết {money} {lex.currency} điều trị, nhưng {call} vẫn chưa dứt cơn {title}.'
  - id: sys.thua_ke_nghe
    kind: he_thong
    importance: 7
    highlight: true
    icon: moc_doi
    variants:
      - 'Từ nay bạn đứng ra gánh vác nhà cửa, tiếp quản nghề nhà: {title}, bậc "{stage}".'
      - 'Bao năm phụ việc nay thành người cầm trịch: bạn tiếp quản nghề {title} ({stage}).'
  - id: sys.bat_dau_tu_lap
    kind: he_thong
    importance: 6
    highlight: true
    icon: moc_doi
    variants:
      - 'Bạn đã đến tuổi tự lo cho mình. Chưa có nghề riêng, bạn bắt đầu bằng việc: {title}.'
      - 'Lớn rồi, bạn bắt đầu tự lập. Việc của bạn lúc này: {title}; nghề nhà vẫn là {stage}.'
  # [2] Tách hộ, thừa kế và điềm báo trước cái chết (Phase 2)
  - id: sys.tach_ho
    kind: he_thong
    importance: 8
    highlight: true
    tone: vui
    icon: nha
    variants:
      - 'Đã yên bề gia thất, vợ chồng bạn xin phép {call} ra ở riêng. Cha mẹ chia cho {sao} {lex.land}, {money} {lex.currency} và {food} {lex.food} làm vốn lập hộ mới.'
      - 'Ngày phân gia: bạn dựng mái nhà riêng, nhận {sao} {lex.land} cùng {money} {lex.currency} cha mẹ chia cho.'
  - id: sys.anh_em_tach_ho
    kind: he_thong
    importance: 5
    icon: nha
    variants:
      - '{call} đã thành gia lập thất, xin tách ra ở riêng với {sao} {lex.land} và {money} {lex.currency} vốn.'
      - 'Nhà chia phần cho {call} ra lập hộ mới ({sao} {lex.land}, {money} {lex.currency}).'
  - id: sys.thua_ke
    kind: he_thong
    importance: 8
    highlight: true
    icon: nha
    variants:
      - 'Sau lễ tang {call}, gia tộc mở sổ phân chia di sản: phần của bạn là {sao} {lex.land} và {money} {lex.currency}.'
      - 'Chiếu theo lệ thừa kế và di ngôn của {call}, bạn tiếp nhận {sao} {lex.land} cùng {money} {lex.currency} di sản.'
  - id: sys.diem_bao_om_yeu
    kind: he_thong
    importance: 6
    highlight: true
    tone: buon
    icon: om
    variants:
      - 'Điềm chẳng lành: {call} ({age} tuổi) hơi thở yếu ớt, sắc mặt xám ngoét, e chẳng qua nổi mấy tháng tới nếu không kịp chạy chữa.'
      - 'Sức vóc của {call} ({age} tuổi) đã suy kiệt đến mức thập tử nhất sinh.'
  # [2] Truyền đời (Phase 3 — Dynasty)
  - id: sys.tiep_noi_dong_doi
    kind: he_thong
    importance: 9
    highlight: true
    tone: trung_tinh
    icon: moc_doi
    variants:
      - 'Khép lại cuộc đời của {prev}, bạn tiếp bước làm chủ Đời thứ {generation} của dòng họ với {sao} {lex.land} và {money} {lex.currency}.'
      - 'Tre già măng mọc: sau tang lễ {prev}, bạn đứng ra gánh vác Đời thứ {generation} ({sao} {lex.land}, {money} {lex.currency}).'
  - id: sys.giam_ho_tuoi_tho
    kind: he_thong
    importance: 8
