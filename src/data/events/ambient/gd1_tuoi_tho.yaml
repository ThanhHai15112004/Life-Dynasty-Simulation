    cooldown_years: 2
    importance: 1
    tone: trung_tinh
    icon: ruong
    short: 'tát nước gàu sòng'
    variants:
      - 'Ruộng cạn nước. Bạn đứng một đầu dây gàu sòng, {role.cha.call} một đầu, tát đến lúc trăng lên. Tay bạn rộp cả mấy chỗ.'
      - 'Bạn tập tát gàu dai, mấy lần đầu nước toàn đổ ngược vào người. Đến chiều thì nhịp tay đã khớp với {role.cha.call}.'
    effects: [{ type: skill_xp, skill: sinh_ton, value: 8 }]
  - id: tt_nong_mo_cua
    kind: chuyen_vat
    tags: [ruong_dong]
    life_stages: [thieu_thoi]
    months: [5, 6, 7, 8]
    condition: { var: player.career, op: '==', value: nong_dan }
    weight: 5
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: ca
    short: 'mò cua bắt ốc'
    variants:
      - 'Bạn theo lũ bạn mò cua dưới ruộng chiêm, được lưng giỏ cua và mấy con cá rô. Mẹ nấu canh chua cả nhà ăn.'
      - 'Bạn thò tay vào hang cua, bị con cua càng to kẹp chặt ngón tay, la oai oái giữa đồng.'
      - 'Chiều mưa, ốc bò lên bờ ruộng đầy. Bạn nhặt được cả rổ, tối ấy nhà có ốc luộc lá chanh.'
  - id: tt_nong_cat_co_trau
    kind: chuyen_vat
    tags: [ruong_dong, lao_dong]
