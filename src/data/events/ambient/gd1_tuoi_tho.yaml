      - 'Bạn lấy nước lã viết chữ lên phiến gạch ngoài hiên. Nắng lên chữ khô dần, bạn lại viết đè lên.'
      - 'Bạn tập viết lên tàu lá chuối, nét bút lông trượt đi trơn tuột, mãi mới ra được chữ "vĩnh".'
