# [1] Nhật ký dòng đời tuổi thơ: ấu thơ (0–5) và thiếu thời (6–15)
# Chia theo hoàn cảnh: nhà nông (player.career nong_dan), nhà buôn bến sông (thuong_nhan), nhà nho (si_tu), cùng mảng chung.
# Quy tắc: weight 2–6 · importance 1–3 · tác động nhỏ (skill_xp 5–12, stress ±1–3) ở khoảng 1/3 số mẫu.
templates:
  # ══ Ấu thơ — chung ══
  - id: tt_at_thoi_noi
    kind: chuyen_vat
    tags: [gia_dinh, tin_nguong]
    life_stages: [au_tho]
    condition: { var: player.age, op: '==', value: 1 }
    weight: 6
    once_per_life: true
    importance: 3
    tone: vui
    icon: sinh_nhat
    variants:
      - 'Lễ thôi nôi, cả nhà bày mâm cho bạn bốc đồ. Bạn bò thẳng tới quyển sách, cắn luôn vào gáy. Bà cười: "Mai sau làm thầy đồ."'
      - 'Lễ thôi nôi, bạn bỏ qua cái bút lông, nắm chặt nắm thóc không chịu buông. Cha bảo thế là đời này không lo đói.'
      - 'Lễ thôi nôi, bạn vồ lấy xâu tiền kẽm rồi lắc leng keng. Cả họ vỗ tay, đoán sau này bạn đi buôn.'
  - id: tt_at_bap_be
    kind: chuyen_vat
    tags: [gia_dinh]
    life_stages: [au_tho]
    condition: { var: player.age, op: between, value: [1, 2] }
    roles: [{ id: cm, from: family, relation: parent }]
    weight: 6
    once_per_life: true
    importance: 3
    tone: vui
    icon: tre_em
    variants:
      - 'Bạn bập bẹ gọi tiếng đầu tiên. {role.cm.call} mừng quá, bế bạn chạy khắp xóm khoe.'
      - 'Tiếng đầu tiên bạn nói không phải "mẹ" cũng chẳng phải "cha", mà là "măm". Cả nhà cười nghiêng ngả.'
  - id: tt_at_so_sam
    kind: chuyen_vat
    tags: [gia_dinh]
    life_stages: [au_tho]
    months: [5, 6, 7, 8]
    condition: { var: player.age, op: '>=', value: 2 }
    roles: [{ id: cm, from: family, relation: parent }]
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: buon
    icon: mua
    short: 'sợ sấm chui vào lòng mẹ'
    variants:
      - 'Đêm giông, sấm nổ ngay đầu hồi. Bạn khóc thét, rúc vào lòng {role.cm.call} đến sáng.'
      - 'Chớp lóe trắng cả vách nứa. Bạn trùm chăn kín đầu, {role.cm.call} vỗ lưng bảo ông sét chỉ đánh kẻ ác.'
    effects: [{ type: stress, value: 1 }]
  - id: tt_at_duoc_be_di_hoi
    kind: chuyen_vat
    tags: [le_hoi, gia_dinh]
    life_stages: [au_tho]
    months: [1, 2]
    condition: { var: player.age, op: '>=', value: 1 }
    roles: [{ id: cm, from: family, relation: parent }]
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: hoi
    short: 'được bế đi hội'
    variants:
      - '{role.cm.call} công kênh bạn trên vai đi xem hội. Bạn nắm chặt cái chong chóng giấy, mắt tròn xoe nhìn người ta đánh đu.'
      - 'Hội làng đông nghẹt, bạn được bế đứng xem rước kiệu. Tiếng trống làm bạn giật mình rồi lại cười.'
      - 'Đi hội về, bạn ngủ gục trên vai {role.cm.call}, tay vẫn nắm cái bánh khảo ăn dở.'
  - id: tt_at_an_vung
    kind: chuyen_vat
    tags: [gia_dinh]
    life_stages: [au_tho]
    condition: { var: player.age, op: between, value: [3, 5] }
    weight: 5
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: gia_dinh
    short: 'ăn vụng bị bắt quả tang'
    variants:
      - 'Bạn trèo lên chạn ăn vụng miếng đường phèn, bị bắt quả tang với cái miệng dính đầy đường.'
      - 'Bạn lén bẻ quả chuối trên mâm cúng. Bà bảo ăn vụng đồ cúng thì đau bụng, đêm ấy bạn sợ không dám ngủ.'
      - 'Bạn bốc trộm miếng cơm cháy trong nồi, nóng bỏng tay mà vẫn không chịu nhả.'
  - id: tt_at_om_vat
    kind: bao_cao
    tags: [benh_tat]
    life_stages: [au_tho]
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: buon
    icon: om
    short: 'ốm vặt'
    variants:
      - 'Mùa hè bạn nổi rôm sảy khắp lưng, đêm nào cũng gãi đến bật máu. Mẹ tắm cho bạn bằng nước lá chè xanh.'
      - 'Bạn sổ mũi, ho khù khụ cả tuần. Bà giã tỏi đắp gan bàn chân cho bạn.'
      - 'Bạn đau bụng vì ăn ổi xanh, khóc ri rỉ cả buổi chiều.'
    effects: [{ type: stress, value: 1 }]
  - id: tt_at_so_ong_ba_bi
    kind: chuyen_vat
    tags: [gia_dinh]
    life_stages: [au_tho]
    condition: { var: player.age, op: between, value: [3, 5] }
    weight: 4
    cooldown_years: 3
    importance: 1
    tone: trung_tinh
    icon: giac_mo
    variants:
      - 'Bạn không chịu ngủ trưa. Bà dọa "ông ba bị chín quai mười hai con mắt" sắp đến bắt, bạn nhắm tịt mắt nằm im.'
      - 'Đêm ấy bạn mơ thấy ông ba bị đeo cái bị to tướng đứng ngoài ngõ. Sáng dậy bạn cứ bám chân mẹ không rời.'
    effects: [{ type: stress, value: 1 }]
  - id: tt_at_nan_dat
    kind: chuyen_vat
    tags: [gia_dinh]
    life_stages: [au_tho]
    condition: { var: player.age, op: between, value: [3, 5] }
    weight: 5
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: tre_em
    short: 'nặn đồ chơi bằng đất'
    variants:
      - 'Bạn nặn con trâu đất, cắm hai que tăm làm sừng, phơi trên bậc thềm cho khô.'
      - 'Bạn bày đồ hàng bằng lá mít, lá bàng, mời lũ trẻ hàng xóm "ăn cỗ".'
      - 'Bạn nhào bùn làm bánh đúc, xếp thành hàng dài trên bờ ao.'
  - id: tt_at_nga_tray
    kind: chuyen_vat
    tags: [gia_dinh]
    life_stages: [au_tho]
    condition: { var: player.age, op: between, value: [2, 5] }
    weight: 4
    cooldown_years: 3
    importance: 1
    tone: an_ui
    icon: tre_em
    variants:
      - 'Bạn chạy theo con gà, vấp bậc cửa ngã trầy cả đầu gối. Bà nhai lá thuốc đắp lên, thổi phù phù cho đỡ rát.'
      - 'Bạn ngã sấp mặt xuống sân gạch, sưng u trán. Mẹ lấy quả trứng luộc lăn khắp chỗ sưng.'
  - id: tt_at_dong_dao
    kind: chuyen_vat
    tags: [gia_dinh, quan_he]
    life_stages: [au_tho]
    condition: { var: player.age, op: between, value: [2, 5] }
    weight: 5
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: tre_em
    short: 'học đồng dao'
    variants:
      - 'Bà dạy bạn chơi "chi chi chành chành". Bạn rụt tay chậm, lần nào cũng bị bắt, cười như nắc nẻ.'
      - 'Lũ trẻ trong xóm nắm tay nhau hát "dung dăng dung dẻ, dắt trẻ đi chơi". Bạn lẫm chẫm chạy theo cuối hàng.'
      - 'Bạn thuộc bài "con mèo mà trèo cây cau", đọc đi đọc lại cho cả nhà nghe.'
    effects: [{ type: skill_xp, skill: ngoai_giao, value: 5 }]

  # ══ Ấu thơ — nhà nông ══
  - id: tt_at_nong_vong_bo_tre
    kind: chuyen_vat
    tags: [ruong_dong, gia_dinh]
    life_stages: [au_tho]
    months: [1, 2, 6, 7]
    condition: { var: player.career, op: '==', value: nong_dan }
    roles: [{ id: me, from: family, relation: mother }]
    weight: 5
    cooldown_years: 2
    importance: 1
    tone: trung_tinh
    icon: ruong
    short: 'ngủ võng bờ ruộng'
    variants:
      - 'Mùa cấy, {role.me.call} mắc võng cho bạn ở gốc tre đầu bờ. Bạn nằm nghe tiếng ếch nhái rồi ngủ lúc nào không hay.'
      - '{role.me.call} đặt bạn ngồi trong cái thúng dưới bóng tre, thỉnh thoảng lại ngẩng lên khỏi ruộng gọi tên bạn.'
  - id: tt_at_nong_cuoi_trau
    kind: chuyen_vat
    tags: [ruong_dong]
    life_stages: [au_tho]
    condition:
      all:
        - { var: player.career, op: '==', value: nong_dan }
        - { has_property: trau }
        - { var: player.age, op: between, value: [3, 5] }
    roles: [{ id: cm, from: family, relation: parent }]
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: vui
    icon: trau
    variants:
      - '{role.cm.call} nhấc bạn lên lưng trâu. Con trâu đi chậm rãi, bạn bám chặt lấy u vai nó mà cười khanh khách.'
      - 'Bạn sờ vào cái mũi ướt của con trâu, nó thở phì một cái làm bạn ngã ngồi ra sân.'
  - id: tt_at_nong_dong_rom
    kind: chuyen_vat
    tags: [ruong_dong]
    life_stages: [au_tho]
    months: [5, 6, 10, 11]
    condition: { all: [{ var: player.career, op: '==', value: nong_dan }, { var: player.age, op: between, value: [2, 5] }] }
    weight: 5
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: cay_lua
    short: 'lăn trên đống rơm mùa gặt'
    variants:
      - 'Sân phơi đầy rơm mới. Bạn lăn lộn trên đống rơm thơm mùi nắng, tối về ngứa ngáy khắp người.'
      - 'Bạn chui vào ổ rơm chơi trốn tìm với anh chị, ngủ quên đến lúc mẹ gọi về ăn cơm.'
  - id: tt_at_nong_ga_con
    kind: chuyen_vat
    tags: [ruong_dong]
    life_stages: [au_tho]
    condition: { all: [{ var: player.career, op: '==', value: nong_dan }, { var: player.age, op: between, value: [2, 5] }] }
    weight: 4
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: ga
    variants:
      - 'Gà mẹ dẫn đàn con ra vườn. Bạn lẽo đẽo đuổi theo, bị gà mẹ xù lông mổ cho một phát vào tay.'
      - 'Bạn ngồi xổm cả buổi nhìn đàn vịt con lội ao, ném vụn cơm cho chúng tranh nhau.'
  - id: tt_at_nong_chao_khoai
    kind: bao_cao
    tags: [gia_dinh, kinh_te]
    life_stages: [au_tho]
    condition:
      all:
        - { var: player.career, op: '==', value: nong_dan }
        - { var: household.food_months, op: '<', value: 4 }
        - { var: player.age, op: between, value: [2, 5] }
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: kho
    variants:
      - 'Giáp hạt, bữa nào cũng cháo khoai lỏng. Bạn khóc đòi cơm trắng, mẹ lặng lẽ vét nồi cho bạn mấy hạt cơm cháy.'
      - 'Nhà độn sắn vào cơm. Bạn nhặt riêng từng hạt gạo ra ăn trước, cha nhìn mà không nói gì.'

  # ══ Ấu thơ — nhà buôn bến sông ══
  - id: tt_at_buon_ngoi_thung
    kind: chuyen_vat
    tags: [buon_ban, gia_dinh]
    life_stages: [au_tho]
    condition: { all: [{ var: player.career, op: '==', value: thuong_nhan }, { var: player.age, op: between, value: [1, 4] }] }
    roles: [{ id: me, from: family, relation: mother }]
    weight: 5
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: cho
    short: 'ngồi thúng theo mẹ ra chợ'
    variants:
      - '{role.me.call} gánh hàng ra chợ, một đầu là vải, đầu kia là bạn ngồi trong thúng, đung đưa theo nhịp đòn gánh.'
      - 'Bạn ngồi trong thúng sau sạp hàng, bóc từng hạt lạc, thỉnh thoảng lại ngóc đầu nhìn khách.'
  - id: tt_at_buon_ho_thuyen
    kind: chuyen_vat
    tags: [buon_ban]
    life_stages: [au_tho]
    condition: { all: [{ var: world.settlement_type, op: '==', value: thi_tran_ben_song }, { var: player.age, op: between, value: [2, 5] }] }
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: cho
    variants:
      - 'Bạn đứng trên bậc đá bến sông, bắt chước người kéo thuyền hò "dô ta". Mấy ông phu cười ầm.'
      - 'Thuyền mành căng buồm nâu đi qua, bạn vẫy tay mãi đến khi cánh buồm khuất sau bãi ngô.'
  - id: tt_at_buon_khach_cho_keo
    kind: nguoi_quanh
    tags: [buon_ban, quan_he]
    life_stages: [au_tho]
    condition: { all: [{ var: player.career, op: '==', value: thuong_nhan }, { var: player.age, op: between, value: [2, 5] }] }
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: nguoi_la
    variants:
      - 'Bà khách quen bán cau dúi cho bạn miếng kẹo vừng, bảo "con nhà này trắng trẻo, sau lấy được vợ đẹp".'
      - 'Ông lái buôn đường xa xoa đầu bạn, cho một con chim bằng đất nung thổi kêu tu tu.'
  - id: tt_at_buon_lac_cho
    kind: chuyen_vat
    tags: [buon_ban, gia_dinh]
    life_stages: [au_tho]
    condition: { all: [{ var: player.career, op: '==', value: thuong_nhan }, { var: player.age, op: between, value: [3, 5] }] }
    weight: 3
    once_per_life: true
    importance: 2
    tone: buon
    icon: cho
    variants:
      - 'Mải xem người ta làm kẹo kéo, bạn lạc mất mẹ giữa chợ. Bà bán cá dắt bạn đi hỏi từng sạp mới tìm được nhà.'
      - 'Chợ phiên đông nghẹt, bạn tuột tay mẹ, đứng khóc giữa dãy hàng nồi đất cho đến khi cha chạy tới bế lên.'
    effects: [{ type: stress, value: 2 }]
  - id: tt_at_buon_tha_thuyen_la
    kind: chuyen_vat
    tags: [buon_ban]
    life_stages: [au_tho]
    condition: { all: [{ var: world.settlement_type, op: '==', value: thi_tran_ben_song }, { var: player.age, op: between, value: [3, 5] }] }
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: la
    variants:
      - 'Bạn gấp lá bàng làm thuyền, thả xuống mép nước bến sông, đếm xem chiếc nào trôi xa nhất.'
      - 'Bạn bỏ một hạt thóc lên thuyền lá, bảo đấy là chuyến hàng của nhà mình, rồi thả cho nó trôi.'

  # ══ Ấu thơ — nhà nho ══
  - id: tt_at_nho_nghich_nghien
    kind: chuyen_vat
    tags: [hoc_hanh, gia_dinh]
    life_stages: [au_tho]
    condition: { all: [{ var: player.career, op: '==', value: si_tu }, { var: player.age, op: between, value: [2, 5] }] }
    weight: 5
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: sach
    short: 'nghịch nghiên mực'
    variants:
      - 'Bạn thò tay vào nghiên mực của cha, bôi đen cả mặt rồi chạy ra sân. Bà giật mình tưởng có ma.'
      - 'Bạn lấy bút lông của cha vẽ con mèo lên vách, cha nhìn hồi lâu rồi bảo "nét này cũng có hồn".'
  - id: tt_at_nho_nghe_doc_tho
    kind: chuyen_vat
    tags: [hoc_hanh, gia_dinh]
    life_stages: [au_tho]
    condition: { all: [{ var: player.career, op: '==', value: si_tu }, { var: player.age, op: between, value: [2, 5] }] }
    roles: [{ id: cha, from: family, relation: father }]
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: an_ui
    icon: sach
    variants:
      - 'Tối nào bạn cũng ngồi trong lòng {role.cha.call} nghe cha ngâm thơ Đường. Chữ chẳng hiểu, nhưng giọng cha trầm ấm làm bạn buồn ngủ.'
      - '{role.cha.call} đọc to một câu trong sách, bạn nhắc lại líu lo. Cha vui, gõ nhẹ quạt lên trán bạn.'
    effects: [{ type: skill_xp, skill: hoc_van, value: 6 }]
  - id: tt_at_nho_vai_ban_tho
    kind: chuyen_vat
    tags: [gia_dinh, tin_nguong]
    life_stages: [au_tho]
    condition: { all: [{ var: player.career, op: '==', value: si_tu }, { var: player.age, op: between, value: [3, 5] }] }
    weight: 4
    once_per_life: true
    importance: 2
    tone: trung_tinh
    icon: tang
    variants:
      - 'Ngày giỗ cụ, bạn được dạy chắp tay vái ba vái trước bàn thờ tổ. Bạn vái lệch, cả họ cười, chỉ ông trưởng họ nghiêm mặt.'
      - 'Bà dắt bạn đến trước dãy bài vị sơn son, chỉ từng cái mà kể đây là cụ nào, đỗ khoa nào.'
  - id: tt_at_nho_so_nghe_da
    kind: chuyen_vat
    tags: [gia_dinh]
    life_stages: [au_tho]
    condition: { all: [{ var: player.career, op: '==', value: si_tu }, { has_property: phu_nho }, { var: player.age, op: between, value: [2, 5] }] }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: trung_tinh
    icon: nha
    variants:
      - 'Đôi nghê đá phủ rêu ở cổng tư dinh nhe răng trong bóng tối. Bạn không dám đi qua cổng một mình khi trời đã nhá nhem.'
      - 'Bạn cưỡi lên lưng con nghê đá ở cổng, tự xưng là quan về làng. Mẹ ra kéo xuống vì sợ ngã.'
  - id: tt_at_nho_dem_dot_tay
    kind: chuyen_vat
    tags: [hoc_hanh]
    life_stages: [au_tho]
    condition: { all: [{ var: player.career, op: '==', value: si_tu }, { var: player.age, op: between, value: [4, 5] }] }
    roles: [{ id: cha, from: family, relation: father }]
    weight: 4
    once_per_life: true
    importance: 2
    tone: vui
    icon: sach
    variants:
      - '{role.cha.call} dạy bạn đếm đốt ngón tay "nhất, nhị, tam, tứ". Đến "ngũ" thì bạn quên, lại đếm lại từ đầu.'
      - 'Bạn nhận ra chữ "nhân" trên câu đối ở cột nhà, chạy đi khoe với bà. Bà thưởng cho bạn miếng bánh gai.'
    effects: [{ type: skill_xp, skill: hoc_van, value: 5 }]

  # ══ Thiếu thời — nhà nông ══
  - id: tt_nong_tat_nuoc
    kind: chuyen_vat
    tags: [ruong_dong, lao_dong]
