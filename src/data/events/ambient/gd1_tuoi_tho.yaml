    months: [10, 11, 12]
    condition: { var: player.career, op: '==', value: nong_dan }
    weight: 5
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: lua
    short: 'nướng khoai ngoài đồng'
    variants:
      - 'Chiều đông, lũ chăn trâu đốt rơm nướng khoai trên gò. Khoai cháy đen mà ngọt lịm, đứa nào cũng nhọ nhem mặt mũi.'
      - 'Bạn đào trộm mấy củ khoai lang ở ruộng hoang, vùi vào đống tro nóng, ngồi chờ thơm phức mới moi ra.'
  - id: tt_nong_cho_phien_ban_rau
    kind: chuyen_vat
    tags: [ruong_dong, buon_ban]
    life_stages: [thieu_thoi]
    condition: { var: player.career, op: '==', value: nong_dan }
    roles: [{ id: me, from: family, relation: mother }]
    weight: 4
    cooldown_years: 2
    importance: 2
    tone: trung_tinh
    icon: cho
    variants:
      - 'Bạn theo {role.me.call} gánh rau ra chợ phiên. Mẹ dặn: bó nào héo thì bán rẻ, đừng để mang về.'
      - '{role.me.call} để bạn tự bán mớ cà pháo. Bạn bán được ba đồng, nắm chặt trong tay cả đường về.'
    effects: [{ type: skill_xp, skill: thuong_mai, value: 6 }]
  - id: tt_nong_leu_canh_ruong
