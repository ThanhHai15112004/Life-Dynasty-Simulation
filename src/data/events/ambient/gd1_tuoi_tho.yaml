    importance: 2
    tone: buon
    icon: sach
    variants:
      - 'Quên mất hai câu trong bài, bạn bị {role.cha.call} phạt quỳ trên chiếu cạp điều trước bàn thờ suốt một nén hương.'
      - '{role.cha.call} gõ thước vào lòng bàn tay bạn ba cái vì viết chữ ẩu. Đêm ấy bạn viết lại cả trang đến khuya.'
