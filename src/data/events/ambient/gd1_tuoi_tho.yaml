    weight: 4
    cooldown_years: 3
    importance: 2
    tone: trung_tinh
    icon: tien
    variants:
      - '{role.cha.call} dạy bạn gõ đồng tiền lên mặt cối đá nghe tiếng. Tiền đồng kêu trong, tiền pha chì kêu đục.'
      - 'Bạn nhặt ra được một đồng tiền mỏng dính trong xâu tiền khách trả. {role.cha.call} cầm lên soi, rồi gật đầu khen.'
    effects: [{ type: skill_xp, skill: thuong_mai, value: 6 }]
  - id: tt_buon_cho_tet_phu_sap
    kind: chuyen_vat
    tags: [buon_ban, le_hoi]
    life_stages: [thieu_thoi]
    months: [12, 1]
    condition: { var: player.career, op: '==', value: thuong_nhan }
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: tet
    short: 'phụ sạp chợ Tết'
    variants:
      - 'Chợ Tết bạn phụ sạp từ tờ mờ sáng, chiều ba mươi mới được về. Mẹ cho bạn một manh áo mới may bằng vải thừa.'
      - 'Bạn ngủ gật trên bao gạo lúc chợ đã vãn. Tỉnh dậy thấy pháo đã nổ lẹt đẹt khắp phố bến.'

  # ══ Thiếu thời — nhà nho ══
