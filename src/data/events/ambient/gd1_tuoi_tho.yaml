    cooldown_years: 2
    importance: 1
    tone: trung_tinh
    icon: tang
    variants:
      - 'Bạn quét sân từ đường, lau bụi trên mấy tấm hoành phi sơn son đã tróc. Chữ vàng "Thế đức lưu phương" mờ gần hết.'
      - 'Bạn đánh bóng lư hương đồng bằng tro bếp, bóng loáng soi được cả mặt. Ông trưởng họ đi qua gật đầu.'
  - id: tt_nho_cau_doi_bieu
    kind: chuyen_vat
    tags: [hoc_hanh, lang_xa]
    life_stages: [thieu_thoi]
    months: [12]
    condition: { var: player.career, op: '==', value: si_tu }
    roles: [{ id: cha, from: family, relation: father }]
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: an_ui
    icon: tet
    variants:
      - 'Giáp Tết, người làng mang giấy đỏ đến xin chữ. {role.cha.call} viết cho từng nhà, không lấy một đồng, chỉ nhận mấy quả cam.'
      - 'Bạn bưng nghiên mực đứng hầu {role.cha.call} viết câu đối cho bà góa đầu xóm. Bà cầm về mà mắt đỏ hoe.'
  - id: tt_nho_si_tu_qua_lang
    kind: tin_the_gioi
    tags: [hoc_hanh, van_minh]
    life_stages: [thieu_thoi]
    condition: { var: world.exam_stage, op: in, value: [huong, hoi] }
    weight: 4
    cooldown_years: 3
    importance: 2
    icon: sach
    variants:
      - 'Năm có khoa thi, từng tốp sĩ tử gánh lều chõng đi qua đường cái. Bạn đứng ở gốc đa nhìn theo đến khi khuất bóng.'
      - 'Có một ông đồ đi thi ghé quán nước đầu làng, vừa uống trà vừa bình văn. Lũ trẻ đứng vòng ngoài nghe mà không hiểu gì.'
    trait_reactions:
      tham_vong: 'Bạn thầm nghĩ mai này mình cũng sẽ gánh lều chõng như thế.'
  - id: tt_nho_ao_the_cu
    kind: chuyen_vat
    tags: [gia_dinh, no_nan]
    life_stages: [thieu_thoi]
    condition: { all: [{ var: player.career, op: '==', value: si_tu }, { var: household.money, op: '<', value: 6 }] }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: buon
    icon: nha
    variants:
      - 'Mẹ lấy chiếc áo the cũ của cha sửa lại cho bạn. Vạt áo vẫn dài quá gối, bạn phải buộc túm lại mới đi được.'
      - 'Đôi guốc mộc của bạn mòn vẹt một bên. Bạn đi tập tễnh, nhưng nhất định không chịu đi chân đất đến trường.'
  - id: tt_nho_doc_len_truyen
    kind: chuyen_vat
    tags: [hoc_hanh]
    life_stages: [thieu_thoi]
    condition: { all: [{ var: player.career, op: '==', value: si_tu }, { var: player.age, op: between, value: [10, 15] }] }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: sach
    variants:
      - 'Bạn giấu tập truyện truyền kỳ dưới quyển Mạnh Tử, đọc say đến mức cha đứng sau lưng lúc nào không biết.'
      - 'Đêm khuya bạn khêu đèn đọc chuyện hồ ly hóa người, sợ đến mức không dám ra sân đi tiểu.'
    effects: [{ type: stress, value: -2 }]
  - id: tt_nho_van_chi
    kind: chuyen_vat
    tags: [hoc_hanh, van_minh, tin_nguong]
    life_stages: [thieu_thoi]
    months: [2, 8]
    condition: { var: player.career, op: '==', value: si_tu }
    roles: [{ id: cha, from: family, relation: father }]
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: trung_tinh
    icon: chen_tra
    variants:
      - 'Bạn theo {role.cha.call} ra văn chỉ làng dự lễ tế Khổng Tử. Các bậc khoa mục khăn đóng áo dài đứng thành hàng nghiêm trang.'
      - 'Tế xong ở văn chỉ, các cụ ngồi bình thơ. {role.cha.call} được mời đọc một bài, bạn đứng sau thấy lưng cha thẳng hơn mọi ngày.'
    effects: [{ type: skill_xp, skill: hoc_van, value: 5 }]
  - id: tt_nho_cha_ban_sach
    kind: bao_cao
    tags: [gia_dinh, no_nan]
    life_stages: [thieu_thoi]
    condition: { all: [{ var: player.career, op: '==', value: si_tu }, { var: household.money, op: '<', value: 3 }] }
    roles: [{ id: cha, from: family, relation: father }]
    weight: 3
    once_per_life: true
    importance: 3
    tone: buon
    icon: sach
    variants:
      - 'Một người nhà giàu trên huyện đến chở đi hai hòm sách của ông nội. Đêm ấy {role.cha.call} ngồi trước giá sách trống, không thắp đèn.'
      - '{role.cha.call} bán bộ Tứ thư chép tay của cụ tổ để trả nợ. Bạn chép vội mấy trang cuối trước khi người ta mang đi.'
  - id: tt_nho_viet_so_dinh
    kind: chuyen_vat
    tags: [hoc_hanh, lang_xa]
    life_stages: [thieu_thoi]
    condition: { all: [{ var: player.career, op: '==', value: si_tu }, { var: player.skill.hoc_van, op: '>=', value: 2 }] }
    weight: 3
    once_per_life: true
    importance: 3
    tone: vui
    icon: lang
    variants:
      - 'Các cụ trong làng nhờ bạn chép lại tờ sớ cầu mùa vì chữ bạn sạch đẹp. Lần đầu chữ của bạn được đặt lên ban thờ đình.'
      - 'Ông lý cần người chép sổ đinh, cha bạn đề cử bạn. Bạn ngồi chép cả buổi, các cụ chuyền tay nhau xem nét chữ.'

  # ══ Thiếu thời — chung: mùa, lễ Tết, trò chơi, anh chị em, người làng ══
  - id: tt_chung_goi_banh_chung
    kind: chuyen_vat
    tags: [le_hoi, gia_dinh]
    life_stages: [thieu_thoi]
    months: [12]
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: tet
    short: 'canh nồi bánh chưng'
    variants:
      - 'Đêm hai chín Tết, bạn ngồi canh nồi bánh chưng, thêm củi đến gần sáng. Cái bánh nhỏ gói riêng cho bạn chín trước nhất.'
      - 'Bạn được giao rửa lá dong, lau từng tàu cho sạch. Bà dạy bạn gấp góc lá cho vuông, gói mãi cái bánh vẫn méo.'
  - id: tt_chung_mung_tuoi
    kind: chuyen_vat
    tags: [le_hoi, gia_dinh]
    life_stages: [thieu_thoi]
    months: [1]
    weight: 5
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: tet
    short: 'được mừng tuổi'
    variants:
      - 'Sáng mùng một, bạn khoanh tay chúc Tết ông bà, được mừng tuổi mấy đồng tiền xu buộc chỉ đỏ. Bạn giấu dưới gối cả tháng.'
      - 'Ngày Tết lũ trẻ đi chúc Tết từng nhà, túi áo bạn kêu leng keng tiền xu, miệng còn ngậm miếng mứt gừng.'
  - id: tt_chung_trung_thu
    kind: chuyen_vat
    tags: [le_hoi]
    life_stages: [thieu_thoi]
    months: [8]
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: trang
    variants:
      - 'Rằm tháng Tám, lũ trẻ rước đèn ông sao quanh xóm. Đèn của bạn bắt lửa cháy mất một cánh, bạn vẫn giơ cao mà đi.'
      - 'Đêm Trung thu, bạn được chia một miếng bánh nướng và nửa quả bưởi. Lũ trẻ ngồi sân đình chờ chị Hằng.'
      - 'Bạn cùng anh chị vót tre dán giấy bóng làm đèn kéo quân, hình ông lão đánh cá cứ quay mãi trong ánh nến.'
  - id: tt_chung_doan_ngo
    kind: chuyen_vat
    tags: [le_hoi, tin_nguong]
    life_stages: [thieu_thoi]
    months: [5]
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: nang
    short: 'Tết giết sâu bọ'
    variants:
      - 'Sáng mùng năm tháng Năm, mẹ dựng bạn dậy ăn rượu nếp và mấy quả mận chua "cho giết sâu bọ".'
      - 'Tết Đoan ngọ, bà giã lá móng nhuộm đỏ móng tay cho lũ trẻ, bảo để tránh tà.'
  - id: tt_chung_danh_khang
    kind: chuyen_vat
    tags: [quan_he]
    life_stages: [thieu_thoi]
    weight: 5
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: tre_em
    short: 'đánh khăng, đánh đáo'
    variants:
      - 'Bạn đánh khăng thắng cả xóm, con khăng bay vèo qua ba bờ ruộng. Thằng thua phải cõng bạn một vòng sân đình.'
      - 'Bạn chơi đánh đáo bằng mấy đồng tiền xu, thua sạch, về nhà nói dối là đánh rơi.'
      - 'Lũ trẻ chơi bịt mắt bắt dê ngoài bãi. Bạn bị bịt mắt, mò mãi lại vồ trúng cột đình.'
    effects: [{ type: stress, value: -1 }]
  - id: tt_chung_choi_de
    kind: chuyen_vat
    tags: [quan_he]
    life_stages: [thieu_thoi]
    months: [6, 7, 8]
    weight: 4
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: tre_em
    variants:
      - 'Bạn đổ nước bắt được con dế than cánh bóng. Nó thắng liền năm trận, cả xóm gọi là "dế tướng".'
      - 'Con dế chọi của bạn bị cắn gãy càng. Bạn chôn nó dưới gốc khế, cắm một nén hương bằng que cỏ.'
  - id: tt_chung_tron_tim_dem_trang
    kind: chuyen_vat
    tags: [quan_he]
    life_stages: [thieu_thoi]
    months: [7, 8, 9]
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: trang
    short: 'trốn tìm đêm trăng'
    variants:
      - 'Đêm trăng sáng, lũ trẻ chơi trốn tìm quanh đống rơm. Bạn trốn kỹ đến mức cả bọn bỏ về hết mà không ai tìm ra.'
      - 'Lũ trẻ nắm tay nhau chơi rồng rắn lên mây ngoài sân. Bạn làm đuôi, bị "thầy thuốc" bắt mất ba lần.'
  - id: tt_chung_cai_nhau_anh_em
    kind: nguoi_quanh
    tags: [gia_dinh]
    life_stages: [thieu_thoi]
    roles:
      - { id: ae, from: family, relation: sibling, condition: { var: self.age, op: between, value: [4, 20] } }
    weight: 4
    cooldown_years: 3
    importance: 1
    tone: trung_tinh
    icon: gia_dinh
    variants:
      - 'Bạn và {role.ae.call} tranh nhau cái đùi gà ngày giỗ, cãi nhau om sòm. Bà cầm roi, cả hai đứa bị đứng góc nhà.'
      - '{role.ae.call} làm gãy con diều bạn mới dán. Bạn giận cả ba hôm, rồi lại cùng nhau vót tre làm con khác.'
      - 'Bạn với {role.ae.call} giận nhau, ngủ quay lưng. Nửa đêm sấm chớp, hai đứa lại rúc vào nhau.'
    effects: [{ type: stress, value: 1 }]
  - id: tt_chung_ong_mo_rao
    kind: nguoi_quanh
    tags: [lang_xa]
    life_stages: [thieu_thoi]
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: lang
    variants:
      - 'Ông mõ gõ mõ đi khắp xóm rao: "Ai có tai thì nghe, mai làng đi đắp đê." Lũ trẻ chạy theo sau nhại lại.'
      - 'Tiếng mõ gõ cốc cốc giữa trưa, ông mõ rao nhà nào mất con gà mái hoa mơ thì lên đình nhận.'
  - id: tt_chung_tam_song
    kind: chuyen_vat
    tags: [quan_he]
    life_stages: [thieu_thoi]
    months: [5, 6, 7]
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: nang
    short: 'trốn ngủ trưa đi tắm sông'
    variants:
      - 'Trưa hè bạn trốn ngủ đi tắm sông với lũ bạn. Về nhà mẹ lấy móng tay cào vào tay, thấy vệt trắng là biết ngay, đánh cho mấy roi.'
      - 'Lũ trẻ thi nhau nhảy từ cành gạo xuống vực sông. Bạn nhắm mắt nhảy, lúc ngoi lên thấy mình vừa làm được việc lớn.'
  - id: tt_chung_ret_dong
    kind: bao_cao
    tags: [gia_dinh]
    life_stages: [thieu_thoi]
    months: [12, 1]
    condition: { var: household.living_standard, op: in, value: [kho_cuc, dam_bac] }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: buon
    icon: la
    variants:
      - 'Gió bấc rít qua vách nứa. Bạn nằm ổ rơm với anh chị em, đắp chung một chiếc chiếu, chân ai cũng lạnh như đá.'
      - 'Sáng rét căm căm, bạn hơ tay trên bếp rơm rồi mới dám đi gánh nước. Gót chân nứt nẻ rớm máu.'
    effects: [{ type: stress, value: 1 }]
  - id: tt_chung_thach_cay_gao
    kind: chuyen_vat
    tags: [quan_he, tin_nguong]
    life_stages: [thieu_thoi]
    condition: { var: player.age, op: between, value: [9, 15] }
    weight: 3
    once_per_life: true
    importance: 2
    tone: trung_tinh
    icon: giac_mo
    variants:
      - 'Lũ trẻ thách nhau nửa đêm đi qua cây gạo đầu làng, nơi người ta đồn có ma treo cổ. Bạn đi một mạch, tim đập thình thịch, về đến ngõ mới dám thở.'
      - 'Bạn nhận lời thách ra miếu hoang lấy nén nhang về làm bằng. Gió thổi lá đa xào xạc, bạn chạy về mất cả một chiếc dép.'
    trait_reactions:
      can_dam: 'Từ hôm ấy, lũ trẻ trong xóm gọi bạn là "anh cả".'
      than_trong: 'Bạn thề sẽ không bao giờ nhận lời thách dại dột như thế nữa.'
    effects: [{ type: skill_xp, skill: quan_su, value: 5 }]
