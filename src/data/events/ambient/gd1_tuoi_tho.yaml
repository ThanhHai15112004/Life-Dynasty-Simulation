    life_stages: [thieu_thoi]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 2
    rumor: true
    icon: nguoi_la
    variants:
      - 'Thuyền đi ngược thượng nguồn về, người chèo kể trên ấy người ta đổi sừng tê, quế rừng lấy muối, một thúng muối được cả bó quế.'
      - 'Lũ trẻ bến sông xúm quanh ông lái già nghe kể chuyện thác dữ trên nguồn, nơi thuyền phải kéo bằng dây song.'
  - id: tt_buon_tieng_rao_dem
    kind: nguoi_quanh
    tags: [lang_xa]
    life_stages: [thieu_thoi]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 2
    importance: 1
    tone: an_ui
    icon: trang
    short: 'tiếng rao đêm phố bến'
    variants:
      - 'Đêm khuya phố bến vẫn có tiếng rao "ai bánh giò nóng đây". Bạn nằm trên gác sạp, nghe tiếng rao xa dần về phía đầu đê.'
      - 'Bà cụ bán chè đỗ đen gánh qua cửa, bạn chạy xuống mua một bát bằng mấy đồng tự để dành.'
  - id: tt_buon_ghi_so_no
    kind: chuyen_vat
    tags: [buon_ban, hoc_hanh]
    life_stages: [thieu_thoi]
    condition: { all: [{ var: player.career, op: '==', value: thuong_nhan }, { var: player.skill.hoc_van, op: '>=', value: 1 }] }
    roles: [{ id: cha, from: family, relation: parent }]
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: trung_tinh
    icon: sach
    variants:
      - '{role.cha.call} giao cho bạn ghi sổ nợ khách. Chữ bạn còn xiêu vẹo, nhưng từ nay chẳng ai cãi được nợ nhà mình.'
      - 'Bạn dò sổ, phát hiện một khách quen ghi thiếu hai chục đồng từ năm ngoái. {role.cha.call} gật gù: "Biết chữ cũng có lợi."'
  - id: tt_buon_nuoc_len_pho
    kind: bao_cao
    tags: [buon_ban, thien_tai]
    life_stages: [thieu_thoi]
    months: [7, 8, 9]
    condition: { all: [{ var: player.career, op: '==', value: thuong_nhan }, { var: world.settlement_type, op: '==', value: thi_tran_ben_song }] }
    weight: 3
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: lu
    variants:
      - 'Nước sông dâng ngập lối chợ. Cả nhà thức trắng đêm khiêng hàng lên gác, bạn khuân đến rã rời hai tay.'
      - 'Mùa lũ, sạp hàng nhà bạn phải kê lên mấy chồng gạch. Bạn ngồi trên gác nhìn thuyền chèo ngay giữa phố.'
    effects: [{ type: stress, value: 1 }]
  - id: tt_buon_ban_pho
    kind: nguoi_quanh
    tags: [quan_he]
    life_stages: [thieu_thoi]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 4
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: tre_em
    variants:
      - 'Bạn kết thân với thằng con nhà thợ rèn cuối phố. Hai đứa ngồi xem bễ lửa phì phò, đòi cha nó cho quai thử búa.'
      - 'Con bé nhà thợ nhuộm tay lúc nào cũng xanh lam. Nó dạy bạn nhận màu chàm, màu nâu củ nâu, màu vàng hoa hòe.'
  - id: tt_buon_tien_gia
    kind: chuyen_vat
    tags: [buon_ban]
    life_stages: [thieu_thoi]
    condition: { all: [{ var: player.career, op: '==', value: thuong_nhan }, { var: player.age, op: between, value: [9, 15] }] }
