    weight: 4
    once_per_life: true
    importance: 2
    tone: vui
    icon: ca
    variants:
      - 'Lũ trẻ bến sông đẩy bạn xuống nước. Bạn sặc mấy ngụm, quẫy loạn xạ rồi tự nhiên biết bơi chó.'
      - 'Ông lái đò buộc quả bầu khô vào lưng bạn, dạy bạn đạp nước. Đến cuối hè bạn đã bơi qua được cái lạch nhỏ.'
    effects: [{ type: skill_xp, skill: sinh_ton, value: 8 }]
  - id: tt_buon_bi_quyt
    kind: chuyen_vat
    tags: [buon_ban]
    life_stages: [thieu_thoi]
    condition: { var: player.career, op: '==', value: thuong_nhan }
    weight: 3
    cooldown_years: 4
    importance: 2
    tone: buon
    icon: tien
    variants:
      - 'Lúc cha vắng, một gã khách ôm gói muối rồi chạy biến vào đám đông. Bạn đuổi theo đến bến thì hắn đã nhảy lên đò.'
      - 'Bạn cả tin cho một bà khách ghi nợ, hẹn phiên sau trả. Mấy phiên rồi chẳng thấy bóng bà đâu.'
    effects: [{ type: stress, value: 2 }]
  - id: tt_buon_chuyen_thuong_nguon
    kind: tin_the_gioi
