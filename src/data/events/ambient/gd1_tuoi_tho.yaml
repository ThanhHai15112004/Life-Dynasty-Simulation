    condition: { all: [{ var: player.career, op: '==', value: nong_dan }, { has_property: trau }] }
    weight: 4
    cooldown_years: 3
    importance: 1
    tone: trung_tinh
    icon: trau
    variants:
      - 'Bạn đi cắt cỏ cho trâu, liềm trượt cứa vào ngón tay. Bạn nhai lá cỏ mực đắp lên rồi cắt tiếp cho đầy gánh.'
      - 'Gánh cỏ to hơn người, bạn gồng mình gánh về. Con trâu thấy bạn từ xa đã rống lên đòi ăn.'
  - id: tt_nong_duoi_chim
