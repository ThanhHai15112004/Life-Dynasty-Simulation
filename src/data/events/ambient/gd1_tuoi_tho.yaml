    cooldown_years: 3
    importance: 1
    tone: trung_tinh
    icon: ruong
    short: 'bị đỉa bám chân'
    variants:
      - 'Lội ruộng lên, bạn thấy ba con đỉa căng máu bám ở bắp chân. Bạn hét toáng, lũ bạn cười lăn ra bờ.'
      - 'Con đỉa bám chặt không chịu nhả, bạn phải xin chút vôi của bà cụ ăn trầu xoa vào nó mới rơi.'
    effects: [{ type: stress, value: 1 }]
  - id: tt_nong_ruong_lep
