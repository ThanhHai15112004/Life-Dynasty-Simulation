      - 'Ruộng nứt nẻ như mai rùa. Bữa cơm tối cả nhà ăn im lặng, chỉ có tiếng đũa chạm bát.'
    effects: [{ type: stress, value: 2 }]
  - id: tt_nong_gia_gao_dem
    kind: chuyen_vat
    tags: [lao_dong, gia_dinh]
    life_stages: [thieu_thoi]
    condition: { var: player.career, op: '==', value: nong_dan }
    roles: [{ id: me, from: family, relation: mother }]
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: an_ui
    icon: trang
    variants:
      - 'Đêm trăng, bạn cùng {role.me.call} giã gạo ngoài sân. Chày nặng tay, nhưng mẹ hát mấy câu hò làm bạn quên mỏi.'
      - 'Bạn ngồi sàng gạo dưới ánh đèn dầu, học mẹ hất cái sàng cho trấu bay mà gạo không rơi.'

  # ══ Thiếu thời — nhà buôn bến sông ══
