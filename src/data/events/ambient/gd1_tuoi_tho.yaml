    weight: 4
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: cay_lua
    short: 'đuổi chim ngoài ruộng lúa chín'
    variants:
      - 'Lúa chín vàng, bạn ngồi chòi đầu bờ giật dây ống bương cho kêu lốc cốc đuổi chim sẻ.'
      - 'Bạn dựng con bù nhìn đội nón mê cũ của cha, đứng xa ngắm thấy giống người thật, thích lắm.'
  - id: tt_nong_mot_lua
    kind: bao_cao
    tags: [ruong_dong, kinh_te]
    life_stages: [thieu_thoi]
    months: [5, 6, 10, 11]
    condition: { all: [{ var: player.career, op: '==', value: nong_dan }, { var: household.food_months, op: '<', value: 6 }] }
    weight: 4
    cooldown_years: 2
    importance: 2
    tone: buon
    icon: cay_lua
    variants:
      - 'Gặt xong, bạn theo mẹ đi mót lúa ở ruộng nhà giàu. Cả buổi được nửa bị bông lúa rơi, lưng còng xuống như bà cụ.'
      - 'Bạn nhặt từng bông lúa sót trên ruộng bá hộ, bị người nhà ông ta quát đuổi, phải chạy sang ruộng khác.'
  - id: tt_nong_nuong_khoai
    kind: chuyen_vat
    tags: [ruong_dong, quan_he]
