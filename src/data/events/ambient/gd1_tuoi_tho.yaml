    roles: [{ id: cha, from: family, relation: father }]
    weight: 3
    cooldown_years: 3
    importance: 2
    tone: an_ui
    icon: trang
    variants:
      - 'Bạn theo {role.cha.call} ra lều canh lúa ban đêm. Hai cha con nằm nghe dế kêu, cha chỉ cho bạn sao Hôm, sao Mai.'
      - 'Đêm canh ruộng, {role.cha.call} kể chuyện năm lụt lớn hồi cha còn bé. Bạn nghe đến khi mắt díp lại.'
  - id: tt_nong_dia_can
    kind: chuyen_vat
