# [7] Nhật ký dòng đời riêng của Phủ thành, Thị trấn bến sông, Đường đi buôn & Nhà trọ (Phase 7)
templates:
  - id: amb.phu_thanh_trong_lau
    kind: tin_the_gioi
    tags: [van_minh, hoc_hanh]
    condition: { var: player.current_settlement, op: '==', value: phu_thanh }
    weight: 4
    cooldown_years: 2
    importance: 2
    tone: trung_tinh
    icon: sach
    variants:
      - 'Tiếng trống lầu canh trên tường thành {world.prefecture_name} ngân dài mỗi buổi sớm, lính tuần mặc áo nẹp đỏ đi đều bước trên đường lát đá.'
      - 'Trước cổng nha môn phủ {world.prefecture_name}, ngựa trạm đeo nhạc đồng phi nước đại mang công văn khẩn từ kinh đô về.'
      - 'Bên hiên Văn Miếu phủ {world.prefecture_name}, các nho sinh áo dài xanh tụ tập bình văn, bàn chuyện khoa thi sắp tới.'

  - id: amb.phu_thanh_pho_phuong
    kind: chuyen_vat
    tags: [buon_ban, van_minh]
    condition: { var: player.current_settlement, op: '==', value: phu_thanh }
    weight: 4
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: tien
    variants:
      - 'Phố phường quanh phủ {world.prefecture_name} san sát hiệu lụa, tiệm thuốc bắc và trà lâu hai tầng treo đèn lồng đỏ.'
      - 'Phiên chợ lớn trước cửa Đông phủ {world.prefecture_name} bày đủ đồ sứ, trà mạn và gấm vóc từ khắp vùng đổ về.'

  - id: amb.duong_di_quan_tro
    kind: chuyen_vat
    tags: [buon_ban, thoi_co]
    condition: { var: player.is_traveling, op: '==', value: true }
    weight: 6
    cooldown_years: 1
    importance: 3
    tone: trung_tinh
    icon: tien
    variants:
      - 'Đêm ngủ lại quán trọ ven đường đi {world.current_settlement_name}, nghe khách thương hồ bàn tán rôm rả về giá lúa gạo và thuế bến năm nay.'
      - 'Đoàn thuyền buôn xuôi dòng về {world.current_settlement_name} ghé bến nghỉ trưa, khói cơm niêu trên mũi thuyền tỏa mùi thơm phức.'
      - 'Dọc đường thiên lý tới {world.current_settlement_name}, từng tốp phu gánh muối và xe trâu chở hàng nối đuôi nhau qua đèo.'

  - id: amb.dich_benh_am_anh
    kind: diem_bao
    tags: [nguy_hiem, lang_xa]
    condition: { var: world.any_epidemic, op: '==', value: true }
    weight: 5
    cooldown_years: 1
    importance: 4
    tone: buon
    icon: om
    variants:
      - 'Tin dịch {world.epidemic_disease} lan theo đường thuyền buôn khiến các bến đò đều dựng rào tre xét hỏi người lạ.'
      - 'Khắp xóm ngoài phố nhà nào cũng treo cành ngải cứu và đốt bồ kết đầu ngõ để xua khí độc mùa dịch {world.epidemic_disease}.'
