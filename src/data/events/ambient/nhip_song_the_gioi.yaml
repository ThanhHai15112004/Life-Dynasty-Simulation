# [1.8] Nhật ký dòng đời đa dạng theo Vị trí địa lý, Di cư, Cựu binh, Tha hương & Các thời đại thế giới (1in8b style)
templates:
  # ══════════════════════════════════════════════════════════════════════════
  # 1. VÙNG SÂU HẺO LÁNH & TRỌ HỌC XA NHÀ
  # ══════════════════════════════════════════════════════════════════════════
  - id: amb_duong_xa_chan_moi
    kind: chuyen_vat
    tags: [hoc_hanh]
    condition:
      all:
        - { var: world.is_remote, op: '==', value: true }
        - { var: focus.primary, op: 'in', value: [hoc_tap, hoc_chu] }
    weight: 8
    cooldown_years: 2
    importance: 2
    tone: trung_tinh
    icon: sach
    short: 'cuốc bộ đường xa đi học'
    variants:
      - 'Sáng sớm sương còn đọng trên cỏ, bạn đã phải cuốc bộ cả dặm đường đất để kịp giờ học.'
      - 'Đường từ nhà tới chỗ học xa ngái, đôi dép mòn vẹt sau một năm vượt dốc băng đồng.'
    effects: [{ type: skill_xp, skill: hoc_van, value: 6 }, { type: skill_xp, skill: sinh_ton, value: 4 }]

  - id: amb_tro_hoc_nho_nha
    kind: chuyen_vat
    tags: [hoc_hanh]
    condition: { has_flag: tro_hoc_xa_nha }
    weight: 9
    cooldown_years: 2
    importance: 3
    tone: buon
    icon: sach
    short: 'chong đèn trọ học nơi đất khách'
    variants:
      - 'Đêm mưa nơi quán trọ, nghe tiếng gió lùa qua chấn sổ mà lòng chợt nhớ bữa cơm nóng ở quê nhà.'
      - 'Ở trọ học xa nhà, bạn tự nhóm bếp nấu nồi cháo loãng rồi lại chong đèn đọc sách tới khuya.'
    effects: [{ type: skill_xp, skill: hoc_van, value: 12 }, { type: stress, value: 1 }]

  - id: amb_vung_xa_cho_phien_thua
    kind: bao_cao
    tags: [lang_xa]
    condition: { var: world.remoteness, op: '>=', value: 0.5 }
    weight: 6
    cooldown_years: 2
    importance: 2
    tone: trung_tinh
    icon: cho
    short: 'đi chợ phiên vùng xa'
    variants:
      - 'Ở vùng quê xa xôi, mỗi tháng chỉ có vài phiên chợ lớn; muốn mua cân muối hay tấm vải đều phải tính trước cả tuần.'
      - 'Đoàn gánh hàng rong hiếm hoi ghé qua xóm nhỏ, lũ trẻ ùa ra đầu ngõ xem như hội.'

  # ══════════════════════════════════════════════════════════════════════════
  # 2. ĐỜI SỐNG ĐÔ THỊ & Ở NHÀ THUÊ
  # ══════════════════════════════════════════════════════════════════════════
  - id: amb_pho_thi_nhon_nhip
    kind: chuyen_vat
    tags: [buon_ban]
    condition: { var: world.is_urban, op: '==', value: true }
    weight: 8
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: cho
    short: 'hòa vào nhịp sống phố thị'
    variants:
      - 'Phố phường từ sáng sớm đã rộn tiếng xe cộ, thuyền bè và tiếng gọi nhau í ới ngoài bến chợ.'
      - 'Đêm xuống, ánh đèn từ các dãy phố hắt xuống mặt đường tạo nên vẻ hoa lệ khác hẳn chốn thôn quê.'
    effects: [{ type: skill_xp, skill: thuong_mai, value: 6 }]

  - id: amb_phong_tro_chat_choi
    kind: bao_cao
    tags: [buon_ban]
    condition:
      all:
        - { var: world.is_urban, op: '==', value: true }
        - { has_flag: o_nha_thue }
    weight: 9
    cooldown_years: 2
    importance: 3
    tone: buon
    icon: nha
    short: 'lo tiền thuê nhà nơi phố thị'
    variants:
      - 'Mỗi dịp cuối năm, khoản tiền thuê nhà nơi phố thị lại khiến bạn phải cân đo đong đếm từng đồng chi tiêu.'
      - 'Căn phòng thuê nơi ngõ nhỏ mùa hè thì hầmập, mùa mưa thì ẩm thấp, nhưng là chỗ dựa để bám trụ đất phố.'
    effects: [{ type: stress, value: 2 }]

  # ══════════════════════════════════════════════════════════════════════════
  # 3. CỰU BINH & THẤT NGHIỆP SAU QUÂN NGŨ
  # ══════════════════════════════════════════════════════════════════════════
  - id: amb_cuu_binh_nho_dong_doi
    kind: chuyen_vat
    tags: [quan_ngu]
    condition: { has_flag: cuu_binh }
    weight: 8
    cooldown_years: 2
    importance: 3
    tone: trung_tinh
    icon: kiem
    short: 'nhớ lại những năm trong quân ngũ'
    variants:
      - 'Nhìn vết sẹo cũ trên cánh tay, bạn bất giác nhớ tới những đêm đốt lửa canh gác cùng đồng đội nơi biên ải.'
      - 'Thói quen dậy sớm từ hồi còn trong quân ngũ khiến bạn luôn là người thức dậy đầu tiên trong xóm.'
    effects: [{ type: skill_xp, skill: quan_su, value: 5 }]

  - id: amb_that_nghiep_di_tim_viec
    kind: bao_cao
    tags: [nghe_nghiep]
    condition: { var: player.career, op: '==', value: that_nghiep }
    weight: 10
    cooldown_years: 1
    importance: 3
    tone: buon
    icon: buon
    short: 'chật vật đi tìm việc làm'
    variants:
      - 'Một năm trôi qua trong cảnh chưa có nghề nghiệp ổn định, bạn đi hỏi việc khắp nơi mà chỉ toàn việc thời vụ ngắn ngày.'
      - 'Ngồi nhìn người ta tất bật đi làm mỗi sáng, nỗi lo thất nghiệp lại đè nặng trong lòng.'
    effects: [{ type: stress, value: 3 }]

  # ══════════════════════════════════════════════════════════════════════════
  # 4. THA HƯƠNG LẬP NGHIỆP & KINH DOANH
  # ══════════════════════════════════════════════════════════════════════════
  - id: amb_tha_huong_chieu_muon
    kind: chuyen_vat
    tags: [buon_ban]
    condition: { has_flag: di_lam_an_xa }
    weight: 9
    cooldown_years: 2
    importance: 3
    tone: buon
    icon: thuyen
    short: 'bôn ba nơi đất khách quê người'
    variants:
      - 'Chiều muộn nơi đất khách, nhìn khói bếp bay lên từ những mái nhà xa lạ mà lòng nao nao nhớ quê.'
      - 'Những tháng ngày đi làm ăn xa giúp bạn học được cách nhìn người và xoay xở giữa trăm bề thiếu thốn.'
    effects: [{ type: skill_xp, skill: sinh_ton, value: 8 }, { type: own_money, value: 2 }]

  - id: amb_so_sach_cua_tiem_cuoi_nam
    kind: bao_cao
    tags: [buon_ban]
    condition: { var: household.ventures_count, op: '>=', value: 1 }
    weight: 8
    cooldown_years: 2
    importance: 3
    tone: vui
    icon: tien
    short: 'kiểm kê sổ sách cơ nghiệp cuối năm'
    variants:
      - 'Cuối năm ngồi cộng sổ tiền hàng, nhìn từng đồng lãi tích tụ qua cả năm buôn bán mà lòng vững dạ.'
      - 'Khách quen ghé tiệm ngày một đều, uy tín buôn bán của gia đình được gây dựng vững vàng.'
    effects: [{ type: skill_xp, skill: thuong_mai, value: 8 }]

  # ══════════════════════════════════════════════════════════════════════════
  # 5. BỐI CẢNH THỜI ĐẠI THẾ GIỚI (8000 TCN -> 2025 CN)
  # ══════════════════════════════════════════════════════════════════════════
  - id: amb_nguyen_thuy_ve_tranh_hang_da
    kind: chuyen_vat
    condition: { var: world.year, op: '<', value: -1000 }
    weight: 9
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: lua
    short: 'nghe kể chuyện bên đống lửa bộ lạc'
    variants:
      - 'Bên ánh lửa bập bùng trong hang đá, các bô lão kể lại truyền thuyết về tổ tiên và những mùa săn lớn.'
      - 'Bạn ngồi ghè từng mảnh đá lửa bên bờ suối, chế tạo mũi giáo và lưỡi nạo da thú.'
    effects: [{ type: skill_xp, skill: sinh_ton, value: 8 }]

  - id: amb_con_duong_to_lua_va_thanh_bang
    kind: tin_the_gioi
    condition: { var: world.year, op: between, value: [-1000, 1750] }
    weight: 7
    cooldown_years: 3
    importance: 2
    tone: trung_tinh
    icon: tin_don
    short: 'nghe chuyện thương đoàn tứ xứ'
    variants:
      - 'Những người lữ hành đi qua kể chuyện các vương quốc phương xa đang mở mang thương cảng và đúc tiền vàng.'
      - 'Tiếng chuông và tiếng trống từ khu chợ trung tâm báo hiệu một mùa giao thương nhộn nhịp nữa lại về.'
    effects: [{ type: skill_xp, skill: ngoai_giao, value: 5 }]

  - id: amb_thoi_cong_nghiep_khoi_may
    kind: tin_the_gioi
    condition: { var: world.year, op: between, value: [1750, 1945] }
    weight: 9
    cooldown_years: 2
    importance: 2
    tone: trung_tinh
    icon: tin_don
    short: 'nhịp sống thời máy móc công nghiệp'
    variants:
      - 'Tiếng còi tàu hỏa rền vang từ phía nhà ga, mang theo báo chí và hàng hóa sản xuất hàng loạt từ các đô thị lớn.'
      - 'Đèn đường và những xưởng dệt chạy máy hơi nước đang làm thay đổi diện mạo cả vùng.'
    effects: [{ type: skill_xp, skill: quan_tri, value: 6 }]

  - id: amb_hien_dai_nhip_song_so
    kind: chuyen_vat
    condition: { var: world.year, op: '>=', value: 1945 }
    weight: 10
    cooldown_years: 2
    importance: 2
    tone: trung_tinh
    icon: tin_don
    short: 'hối hả trong nhịp sống hiện đại'
    variants:
      - 'Một năm trôi qua giữa dòng xe cộ tấp nập, hóa đơn sinh hoạt và những bản tin kinh tế thế giới cập nhật từng giờ.'
      - 'Tan ca chiều muộn dưới ánh đèn cao áp, bạn ghé mua vội túi đồ ăn về chuẩn bị bữa tối cho gia đình.'
      - 'Những khu phố mới, trường học và bệnh viện hiện đại mọc lên ngày một nhiều quanh nơi bạn sống.'
    effects: [{ type: skill_xp, skill: quan_tri, value: 6 }]

