# [1] Nhật ký dòng đời riêng theo nghề nhà và nơi ở: con nhà buôn bến sông, con nhà nho sa sút, đời sống thị trấn
templates:
  # ── Con nhà buôn ──
  - id: buon_hoc_ban_tinh
    kind: chuyen_vat
    tags: [buon_ban, gia_dinh]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: player.age, op: between, value: [6, 15] }] }
    roles: [{ id: cha, from: family, relation: father }]
    weight: 6
    once_per_life: true
    importance: 3
    icon: tien
    variants:
      - '{role.cha.call} dạy bạn gảy bàn tính. Tiếng hạt gỗ lách cách đến khuya, bạn tính đúng một phép cộng dài, cha thưởng cho miếng kẹo lạc.'
      - 'Lần đầu bạn tự tay cân hàng cho khách. Cán cân hơi lệch, {role.cha.call} nhắc khẽ: "Buôn bán cốt chữ tín."'
    effects: [{ type: skill_xp, skill: thuong_mai, value: 12 }]
  - id: buon_ngu_tren_bao_hang
    kind: chuyen_vat
    tags: [buon_ban]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: player.age, op: between, value: [3, 12] }] }
    weight: 4
    cooldown_years: 3
    importance: 1
    icon: tien
    variants:
      - 'Bạn ngủ quên trên đống bao gạo sau sạp hàng, tỉnh dậy thấy trời đã tối và mẹ đang đi tìm khắp chợ.'
      - 'Bạn ngồi đếm đồng kẽm cho mẹ cả buổi, đếm sai ba lần vẫn cố đếm lại.'
  - id: buon_khach_mien_xuoi
    kind: nguoi_quanh
    tags: [buon_ban, tin_don]
    condition: { var: household.career, op: '==', value: thuong_nhan }
    weight: 3
    cooldown_years: 2
    importance: 2
    icon: nguoi_la
    variants:
      - 'Thuyền khách miền xuôi ghé sạp, kể chuyện ngoài cửa biển có tàu lạ mắt xanh đến xin buôn bán.'
      - 'Một lái buôn đường xa ghé nghỉ, trả tiền bằng thoi bạc nặng trĩu. Cả nhà xúm lại ngắm.'
  - id: buon_lo_hang_e
    kind: bao_cao
    tags: [buon_ban]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: world.trade_index, op: '<', value: 0.92 }] }
    weight: 4
    cooldown_years: 1
    importance: 2
    tone: buon
    icon: tien
    short: 'hàng ế ẩm'
    variants:
      - 'Hàng sau vụ gặt ế ẩm, sạp nhà bạn cả buổi chỉ bán được dăm ba đồng.'
      - 'Chợ vãn sớm, vải vóc chất đống chẳng ai hỏi. Cả nhà ăn cơm muộn trong im lặng.'
  - id: buon_cho_tet_dat_hang
    kind: bao_cao
    tags: [buon_ban]
    months: [11, 12, 1]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: world.trade_index, op: '>=', value: 1.15 }] }
    weight: 5
    cooldown_years: 1
    importance: 2
    tone: vui
    icon: tet
    short: 'chợ Tết đắt hàng'
    variants:
      - 'Chợ giáp Tết đông nghịt, sạp nhà bạn bán hết sạch hàng từ trưa.'
      - 'Người mua sắm Tết chen nhau trước sạp, cả nhà bán không kịp tay.'

  # ── Con nhà nho ──
  - id: nho_mai_muc_chep_sach
    kind: chuyen_vat
    tags: [hoc_hanh, gia_dinh]
    condition: { all: [{ var: household.career, op: '==', value: si_tu }, { var: player.age, op: between, value: [5, 14] }] }
    roles: [{ id: cha, from: family, relation: father }]
    weight: 6
    once_per_life: true
    importance: 3
    icon: sach
    variants:
      - 'Lần đầu bạn được mài mực cho {role.cha.call} viết câu đối Tết. Mực bắn lem cả vạt áo, cha bật cười.'
      - '{role.cha.call} cầm tay bạn viết nét sổ đầu tiên. "Chữ ngay thì người mới ngay," cha nói.'
    effects: [{ type: skill_xp, skill: hoc_van, value: 12 }]
  - id: nho_nha_ngoi_dot
    kind: bao_cao
    tags: [gia_dinh, no_nan]
    condition: { all: [{ var: household.career, op: '==', value: si_tu }, { has_property: phu_nho }, { var: household.money, op: '<', value: 4 }] }
    weight: 4
    cooldown_years: 2
    importance: 2
    tone: buon
    icon: nha
    variants:
      - 'Mưa đêm, mái ngói tư dinh dột mấy chỗ. Cả nhà kê chậu hứng nước, chẳng ai nói ra chuyện tiền sửa mái.'
      - 'Bộ sập gụ ông nội để lại lại có người đến hỏi mua. Mẹ lắc đầu, nhưng lần này lâu hơn mọi lần.'
  - id: nho_nghe_chuyen_ong_noi
    kind: chuyen_vat
    tags: [gia_dinh, hoc_hanh]
    condition: { all: [{ var: household.career, op: '==', value: si_tu }, { var: player.age, op: between, value: [4, 14] }] }
    weight: 3
    once_per_life: true
    importance: 2
    icon: ky_uc
    variants:
      - 'Bà kể ngày xưa ông nội vinh quy, cả huyện ra đón, cờ lọng dài từ đầu đê đến cổng làng. Bạn mơ thấy mình cưỡi ngựa trắng.'
    effects: [{ type: filial_piety, value: 3 }]
  - id: nho_ban_be_che_mot_sach
    kind: nguoi_quanh
    tags: [quan_he, hoc_hanh]
    condition: { all: [{ var: household.career, op: '==', value: si_tu }, { var: player.age, op: between, value: [8, 18] }] }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: tre_em
    variants:
      - 'Lũ trẻ trong xóm gọi bạn là "cậu đồ mọt sách" khi bạn từ chối ra bãi thả diều.'
      - 'Con nhà phú hộ khoe áo mới, bạn chỉ có cái áo the cũ của anh để lại. Bạn giả vờ không để ý.'
  - id: nho_ta_dien_nop_to
    kind: nguoi_quanh
    tags: [ruong_dong, lang_xa]
    months: [5, 10]
    condition: { all: [{ var: household.self_farms, op: '==', value: false }, { var: household.farmland, op: '>=', value: 1 }] }
    weight: 3
    cooldown_years: 2
    importance: 1
    icon: ruong
    variants:
      - 'Tá điền gánh thóc tô vào sân, đôi vai gầy run run. Bạn để ý ông lão đi chân đất giữa trời rét.'
      - 'Bà tá điền nộp tô xong còn nán lại xin ít cám về nuôi lợn.'

  # ── Thị trấn bến sông ──
  - id: tran_ben_song_sang_som
    kind: tin_the_gioi
    tags: [lang_xa]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 2
    importance: 1
    icon: cho
    variants:
      - 'Sáng sớm, tiếng hò kéo thuyền vang khắp bến. Chợ thị trấn đã đông từ lúc trời còn tối.'
      - 'Thuyền mành từ cửa biển cập bến, mùi cá khô và hồ tiêu bay khắp phố chợ.'
  - id: tran_ben_song_tin_kinh_thanh
    kind: tin_the_gioi
    tags: [tin_don]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 2
    cooldown_years: 3
    importance: 2
    rumor: true
    icon: tin_don
    variants:
      - 'Người trên thuyền từ Kinh về kể: triều đình sắp mở khoa thi, sĩ tử khắp nơi đang rục rịch.'
      - 'Đồn rằng quan trấn thủ mới về nhậm chức, sẽ tăng thuế bến bãi từ năm sau.'
  - id: tran_ben_song_hoi_dua_thuyen
    kind: chuyen_vat
    tags: [lang_xa]
    months: [5, 6]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: hoi
    variants:
      - 'Hội đua thuyền trên sông, cả thị trấn đổ ra bờ reo hò. Thuyền phường chài thắng giải năm nay.'
    effects: [{ type: stress, value: -2 }]
