      - 'Tế thu ở văn chỉ, bạn được cử đọc văn tế. Giọng bạn run ở câu đầu, đến câu cuối thì vang khắp sân.'
    effects: [{ type: scholarly_prestige, value: 1 }]

  - id: nq_le_van_te_gio_to
    kind: chuyen_vat
