    cooldown_years: 2
    importance: 1
    icon: nguoi_la
    variants:
      - 'Anh lính người miền biển kể chuyện cá voi dạt vào bờ, cả làng lập miếu thờ. Cả lều nghe say, quên cả muỗi.'
      - 'Đồng ngũ ngồi đan giỏ tre, kể vợ mới sinh con trai mà chưa được về nhìn mặt. Kể xong anh im lặng đan tiếp.'
      - 'Một lão lính già hai mươi năm quân ngũ chỉ cho bạn cách buộc xà cạp để đi rừng không bị vắt bám.'

  - id: nq_linh_linh_luong
    kind: bao_cao
    tags: [quan_su, nghe_nghiep]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
