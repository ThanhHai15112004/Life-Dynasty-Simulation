    cooldown_years: 3
    importance: 1
    icon: hoi
    variants:
      - 'Ngày rằm, bạn thắp hương bàn thờ gia tiên rồi gọi con cháu đến, đọc cho nghe mấy điều gia huấn ông nội để lại.'
      - 'Sáng mồng một, bạn lau bài vị, thay nước, đặt đĩa trầu cau. Việc nhỏ mà làm đã bốn mươi năm.'

