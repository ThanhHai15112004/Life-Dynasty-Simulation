    cooldown_years: 3
    importance: 2
    tone: buon
    icon: cay_lua
    variants:
      - 'Mùa gặt ở quê. Trên đồn nghe gió thổi qua cỏ tranh, bạn tưởng như nghe tiếng liềm cắt lúa.'
      - 'Đêm qua bạn mơ thấy mình đang gánh lúa về sân, tỉnh dậy thấy hai vai vẫn còn mỏi.'

  - id: nq_linh_dong_ngu_ke_chuyen
    kind: nguoi_quanh
    tags: [quan_su, quan_he]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition: { var: player.career, op: '==', value: linh }
