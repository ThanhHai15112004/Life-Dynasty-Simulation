    condition: { all: [{ var: player.career, op: '==', value: linh }, { var: player.career_rank, op: '<=', value: 2 }] }
    weight: 5
    cooldown_years: 2
    importance: 1
    icon: trang
    variants:
      - 'Đêm canh đồn, sương núi xuống trắng cả lũy tre. Bạn ôm ngọn giáo ngồi bên đống lửa, nghe xa xa tiếng hoẵng kêu.'
      - 'Canh tư, bạn thấy một đốm lửa lập lòe bên kia khe núi. Cả đồn thức dậy cầm giáo, chờ mãi mới biết là người đi rừng đốt đuốc.'
      - 'Trăng rằm trên đồn biên to và lạnh. Bạn ngồi gác, đếm từng tiếng mõ canh, nghĩ ở nhà giờ này chắc mẹ đã ngủ.'

  - id: nq_linh_thao_luyen
    kind: bao_cao
    tags: [quan_su, vo_nghe]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition: { var: player.career, op: '==', value: linh }
    weight: 4
    cooldown_years: 2
    importance: 1
    icon: kiem
    short: 'thao luyện bãi tập'
    variants:
      - 'Cả tháng thao luyện ngoài bãi tập. Múa giáo dài đến rộp cả lòng bàn tay, tối về nằm không muốn trở mình.'
      - 'Đội trưởng bắt tập bày trận "rắn cuộn" dưới nắng trưa. Sai một bước là cả hàng phải làm lại từ đầu.'
    effects: [{ type: skill_xp, skill: quan_su, value: 6 }]

  - id: nq_linh_com_doanh
    kind: chuyen_vat
