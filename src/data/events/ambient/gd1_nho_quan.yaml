      - 'Đọc xong văn tế, bạn hóa tờ giấy trong lư đồng. Tàn tro bay lên mái từ đường, mấy đứa trẻ đuổi theo nhặt.'
    effects: [{ type: filial_piety, value: 1 }]

  - id: nq_le_ram_mong_mot
    kind: chuyen_vat
