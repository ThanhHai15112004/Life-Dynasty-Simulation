    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }] }
