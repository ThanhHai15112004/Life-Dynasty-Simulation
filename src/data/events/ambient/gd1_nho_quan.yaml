      - 'Kỳ lĩnh lương, bạn nhận mấy xâu tiền và một thúng gạo. Đồng ngũ rủ ra quán đầu doanh uống bát rượu, bạn chỉ uống một bát.'
      - 'Lương quân phát đủ, lại thêm mỗi người một tấm vải. Bạn gói kỹ, định Tết về may áo cho mẹ.'

