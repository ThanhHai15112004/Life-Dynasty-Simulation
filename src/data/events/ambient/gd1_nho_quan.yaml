# [1] Nhật ký dòng đời: đèn sách, thư phòng, nha môn, lễ nghi Nho giáo, tư dinh sa sút (si_tu);
# lính thú, đêm canh đồn (linh); trại cướp trong núi (thao_khau). Từ 16 tuổi.
templates:
  # ── Đèn sách ──
  - id: nq_den_sach_dem_dong
    kind: chuyen_vat
    tags: [hoc_hanh]
    life_stages: [thanh_nien, lap_nghiep]
    months: [11, 12, 1]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.exam_degree, op: 'in', value: [none, sinh_do] }] }
    weight: 4
    cooldown_years: 2
    importance: 1
    icon: sach
    short: 'đèn sách đêm đông'
    variants:
      - 'Đêm rét, bạn ủ chân trong ổ rơm mà đọc Kinh Thi. Ngọn đèn dầu lạc leo lét, chữ nhòe dần theo hơi thở.'
      - 'Gió bấc lùa qua liếp cửa. Bạn quấn chăn ngồi chép bài, mực đông lại trên nghiên phải hà hơi cho tan.'
      - 'Cả nhà đã ngủ. Chỉ còn tiếng bạn khẽ đọc Luận ngữ và tiếng chuột chạy trên gác bếp.'
    effects: [{ type: skill_xp, skill: hoc_van, value: 5 }]

  - id: nq_den_sach_chep_sach_muon
    kind: chuyen_vat
    tags: [hoc_hanh]
    life_stages: [thanh_nien, lap_nghiep]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.exam_degree, op: 'in', value: [none, sinh_do] }] }
    weight: 4
    cooldown_years: 3
    importance: 1
    icon: sach
    variants:
      - 'Bạn mượn được bộ Xuân Thu của một nhà khoa bảng làng bên, hẹn nửa tháng phải trả. Đêm nào cũng chép đến canh ba.'
      - 'Giấy dó đắt, bạn chép chữ nhỏ li ti, viết kín cả lề. Thầy đồ xem xong bảo chữ thì được, chỉ sợ hỏng mắt.'
    effects: [{ type: skill_xp, skill: hoc_van, value: 6 }]

  - id: nq_den_sach_bai_luyen
    kind: bao_cao
    tags: [hoc_hanh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.exam_degree, op: 'in', value: [none, sinh_do, huong_cong] }] }
    weight: 4
    cooldown_years: 2
    importance: 1
    icon: sach
    short: 'làm bài luyện thi'
    variants:
      - 'Bạn làm một bài kinh nghĩa luyện tay. Thầy phê bên lề bốn chữ "ý được, văn non", khuyên đọc thêm sách cổ.'
      - 'Bài phú luyện thi được thầy khuyên son mấy chỗ. Bạn chép lại sạch sẽ, dán lên vách để sớm tối nhìn.'
      - 'Ba ngày làm một bài văn sách. Đọc lại thấy câu nào cũng muốn sửa, cuối cùng đốt đi viết lại từ đầu.'
    effects: [{ type: skill_xp, skill: hoc_van, value: 4 }]

  - id: nq_den_sach_ngu_gat
    kind: chuyen_vat
    tags: [hoc_hanh]
    life_stages: [thanh_nien]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }] }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: sach
    variants:
      - 'Học khuya, bạn ngủ gục trên án, sáng ra trán in nguyên một hàng chữ ngược. Em nhỏ trong nhà cười mãi.'
      - 'Bắt chước người xưa, bạn buộc búi tóc lên xà nhà cho khỏi ngủ gật. Được hai đêm thì đứt dây, ngã chúi xuống chiếu.'
    trait_reactions:
      kien_nhan: 'Đêm sau bạn lại ngồi vào án như chưa có gì.'
      nong_nay: 'Bạn vứt cuốn sách sang một bên, đi ngủ cho xong.'

  - id: nq_den_sach_mua_ha
    kind: chuyen_vat
    tags: [hoc_hanh]
    life_stages: [thanh_nien, lap_nghiep]
    months: [5, 6, 7]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }] }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: nang
    variants:
      - 'Trưa hè oi nồng, bạn mang sách ra gốc nhãn đầu ngõ đọc. Ve kêu inh ỏi, đọc mãi một trang không vào.'
      - 'Muỗi mùa hạ đốt chi chít bắp chân. Bạn đặt hai chân vào chum nước mà đọc sách đến khuya.'
      - 'Mưa rào chiều hè, bạn ngồi bên hiên nghe nước chảy, chợt hiểu ra một câu trong Kinh Dịch đọc mãi không thông.'

  - id: nq_den_sach_hong_thi_nguoi_cuoi
    kind: nguoi_quanh
    tags: [hoc_hanh, lang_xa, tin_don]
    life_stages: [lap_nghiep, trung_nien]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.exam_degree, op: '==', value: none }] }
    roles: [{ id: hx, from: village, village_role: hang_xom, optional: true }]
    weight: 3
    cooldown_years: 4
    importance: 2
    tone: buon
    icon: tin_don
    variants:
      - 'Ra giếng làng, bạn nghe mấy bà thì thầm "học đến bạc đầu chưa đỗ nổi cái tú tài". Bạn gánh nước về, không ngoái lại.'
      - 'Người ta hỏi bạn năm nay có đi thi không, giọng nửa thật nửa đùa. Bạn cười, bảo còn phải đọc thêm.'
    trait_reactions:
      tham_vong: 'Đêm ấy bạn thắp đèn đọc sách đến sáng.'
      an_phan: 'Bạn nghĩ đỗ hay không thì sách vẫn là sách.'
    effects: [{ type: stress, value: 2 }]

  - id: nq_den_sach_sam_leu_chong
    kind: bao_cao
    tags: [hoc_hanh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: world.exam_stage, op: '==', value: huong }, { var: player.exam_degree, op: 'in', value: [none, sinh_do] }] }
    weight: 5
    cooldown_years: 2
    importance: 2
    icon: sach
    short: 'sắm lều chõng đi thi'
    variants:
      - 'Năm thi Hương, bạn sắm lều chõng, ống quyển, dao rọc giấy. Mẹ rang sẵn mấy đấu gạo, nắm muối vừng gói trong lá chuối.'
      - 'Lều vải cũ của cha được lôi ra phơi nắng, vá lại mấy chỗ thủng. Chiếc chõng tre thì phải đóng mới.'

  - id: nq_den_sach_mong_ca_chep
    kind: diem_bao
    tags: [hoc_hanh, tin_nguong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: world.exam_stage, op: '!=', value: none }] }
    weight: 3
    cooldown_years: 3
    importance: 2
    icon: giac_mo
    variants:
      - 'Đêm qua bạn mơ thấy con cá chép đỏ vượt qua cửa đập. Mẹ nghe kể thì vội ra đền thắp hương.'
      - 'Bạn mơ đứng trước bảng vàng, tìm mãi không thấy tên mình, tỉnh dậy mồ hôi ướt lưng áo.'
      - 'Con chim khách đậu trên mái nhà kêu suốt buổi sáng. Bà nội bảo năm nay thế nào cũng có tin vui.'

  # ── Thư phòng ──
  - id: nq_thu_phong_phoi_sach
    kind: chuyen_vat
    tags: [hoc_hanh, gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [6, 7]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }] }
    weight: 4
    cooldown_years: 3
    importance: 1
    icon: sach
    variants:
      - 'Qua mùa nồm, sách trong thư phòng lốm đốm mốc. Bạn bày ra sân phơi, lật từng trang, nhặt từng con mọt.'
      - 'Hôm phơi sách, bạn tìm thấy kẹp trong bộ Mạnh Tử một tờ giấy cha viết dở từ hồi còn trẻ.'
      - 'Mấy cuốn sách tổ tiên để lại đã rách gáy. Bạn ngồi cả buổi khâu lại bằng chỉ gai.'

  - id: nq_thu_phong_nghien_muc
    kind: chuyen_vat
    tags: [hoc_hanh, gia_dinh]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }] }
    weight: 3
    cooldown_years: 4
    importance: 1
    icon: ky_uc
    variants:
      - 'Bạn mài thỏi mực Tàu cuối cùng trên nghiên đá ông nội để lại. Mực thơm mùi xạ, nét chữ đen nhánh như mới.'
      - 'Cây bút lông dùng đã ba năm toè ngọn. Bạn chưa nỡ vứt, cắm lại vào ống tre bên cạnh mấy cây mới.'

  - id: nq_thu_phong_ban_cu_dam_dao
    kind: nguoi_quanh
    tags: [hoc_hanh, quan_he]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.exam_degree, op: '!=', value: none }] }
    weight: 3
    cooldown_years: 3
    importance: 2
    tone: vui
    icon: chen_tra
    variants:
      - 'Một người bạn cùng khoa ghé chơi. Hai người pha ấm chè mạn, bình thơ Đường đến khi trăng lên đỉnh tre.'
      - 'Người bạn đồng khoa đi ngang qua huyện, ghé tặng bạn một tập thơ chép tay. Bạn tiễn ra tận bến đò.'
    effects: [{ type: stress, value: -2 }]

  # ── Thầy đồ ──
  - id: nq_thay_do_le_tet_thay
    kind: nguoi_quanh
    tags: [hoc_hanh, le_hoi]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [12, 1]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 1 }] }
    weight: 4
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: tet
    short: 'học trò mang lễ Tết thầy'
    variants:
      - 'Học trò lần lượt mang lễ Tết thầy: con gà sống, đấu gạo nếp, buồng cau. Thằng bé nghèo nhất lớp mang mấy quả trứng gói lá chuối.'
      - 'Phụ huynh học trò đến chúc Tết, ngồi chật cả hiên. Bạn pha chè mời, nghe họ kể con mình ở nhà đã biết đọc câu đối.'

  - id: nq_thay_do_tro_nghich
    kind: nguoi_quanh
    tags: [hoc_hanh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 1 }] }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: tre_em
    variants:
      - 'Hai đứa học trò trốn học ra đầm bắt cá, chiều về quần áo lấm bùn. Bạn phạt chép mười lượt chữ "Hiếu".'
      - 'Có đứa vẽ con rùa vào vở bạn cùng lớp. Bạn giận, rồi thấy nét vẽ khéo quá, suýt bật cười.'
      - 'Thằng bé con nhà bán bún đọc sai chữ cả lớp cười ồ. Hôm sau nó đến sớm nhất, ngồi đọc lại một mình.'

  - id: nq_thay_do_tro_cu_do_dat
    kind: nguoi_quanh
    tags: [hoc_hanh, quan_he]
    life_stages: [trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 1 }, { var: player.skill.hoc_van, op: '>=', value: 4 }] }
    weight: 2
    cooldown_years: 5
    importance: 3
    tone: vui
    icon: sach
    variants:
      - 'Một học trò cũ vừa đỗ Sinh đồ, áo mũ chỉnh tề về lạy tạ thầy. Bạn nhớ hồi nó mới cầm bút còn khóc vì nét sổ không thẳng.'
      - 'Tin về: đứa học trò năm nào giờ đã làm thư lại ở phủ. Nó nhờ người gửi biếu thầy một gói chè ngon.'
    effects: [{ type: scholarly_prestige, value: 2 }]

  # ── Nha môn ──
  - id: nq_nha_mon_cong_van
    kind: bao_cao
    tags: [nghe_nghiep, van_minh]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 2 }] }
    weight: 5
    cooldown_years: 2
    importance: 1
    icon: thue
    short: 'công văn nha môn'
    variants:
      - 'Công văn từ phủ xuống chồng cao trên án: sổ đinh, sổ điền, lệnh sửa đê. Bạn đóng dấu son đến mỏi cổ tay.'
      - 'Viên thư lại ôm vào một bó văn thư mới, bảo còn ba bó nữa đang trên thuyền.'
      - 'Bộ Lễ gửi công văn hỏi số học trò trong hạt, hạn trong tháng phải trình lên.'

  - id: nq_nha_mon_trong_keu_oan
    kind: nguoi_quanh
    tags: [nghe_nghiep, lang_xa]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 3 }] }
    weight: 4
    cooldown_years: 2
    importance: 2
    icon: su_kien
    variants:
      - 'Sáng sớm có người đánh trống trước cổng nha. Một ông lão kêu con trâu bị hàng xóm dắt mất, nói ba câu thì khóc hai câu.'
      - 'Hai nhà tranh nhau một cái giếng, kéo cả họ lên công đường. Bạn ngồi nghe đến trưa vẫn chưa ai chịu ai.'
      - 'Người đàn bà bán xôi kiện viên lính lệ ăn quỵt. Lính lệ đứng cúi đầu, cả nha môn nín cười.'

  - id: nq_nha_mon_thu_lai_gia
    kind: nguoi_quanh
    tags: [nghe_nghiep, quan_he]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 2 }] }
    weight: 3
    cooldown_years: 4
    importance: 1
    icon: nguoi_la
    variants:
      - 'Viên thư lại già đã qua tay năm đời quan. Ông thuộc từng thửa ruộng trong sổ địa bạ, cũng thuộc từng nhà nào biết "lo".'
      - 'Thư lại nhắc khẽ: lệ nha môn, đơn từ nộp vào phải kèm "tiền giấy mực". Bạn nhìn ông, ông nhìn xuống đất.'
    trait_reactions:
      tham_lam: 'Bạn lặng im, coi như chưa nghe.'
      hao_phong: 'Bạn bảo từ nay nha này không có lệ ấy.'

  - id: nq_nha_mon_tuan_de
    kind: chuyen_vat
    tags: [nghe_nghiep, thien_tai]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    months: [6, 7, 8]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 3 }] }
    weight: 4
    cooldown_years: 2
    importance: 2
    icon: lu
    variants:
      - 'Mùa nước lên, bạn ngồi cáng đi tuần đê trong hạt. Chỗ nào đê rỉ, lý trưởng các làng đứng chờ sẵn, mặt xám như đất.'
      - 'Mưa ba ngày, bạn đội nón ra đê cùng dân hộ đê. Tối về áo quan ướt sũng, giày ngập bùn.'
    effects: [{ type: health, value: -2 }]

  - id: nq_nha_mon_le_vat
    kind: nguoi_quanh
    tags: [nghe_nghiep, quan_he]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 3 }] }
    weight: 3
    cooldown_years: 3
    importance: 2
    icon: bac
    variants:
      - 'Ngày rằm, lễ vật các làng gửi lên tư dinh: gà, rượu, mấy cân chè. Người nhà hỏi nhận hay trả, bạn ngồi nhìn mâm lễ hồi lâu.'
      - 'Một phú hộ trong hạt mừng thọ mẹ bạn bằng đôi câu đối dát bạc. Lời chúc rất đẹp, chỉ là ông đang có vụ kiện chờ xử.'
    trait_reactions:
      tham_lam: 'Bạn cho cất cả vào kho.'
      hao_phong: 'Bạn sai người gánh trả, chỉ giữ lại mấy cân chè.'

  - id: nq_nha_mon_dem_duyet_an
    kind: chuyen_vat
    tags: [nghe_nghiep]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 3 }] }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: sach
    variants:
      - 'Đêm khuya bạn còn ngồi đọc lại hồ sơ một vụ án mạng. Lời khai hai bên vênh nhau một chữ, chính chữ ấy làm bạn mất ngủ.'
      - 'Ngọn nến trên án cháy hết lúc nào không hay. Bạn ngẩng lên đã nghe gà gáy, chồng hồ sơ vẫn còn quá nửa.'
    effects: [{ type: stress, value: 2 }, { type: skill_xp, skill: quan_tri, value: 5 }]

  # ── Tin triều đình ──
  - id: nq_tin_trieu_mo_khoa
    kind: tin_the_gioi
