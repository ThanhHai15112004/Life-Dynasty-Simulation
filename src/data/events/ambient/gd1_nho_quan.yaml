    weight: 5
    cooldown_years: 2
    importance: 1
    icon: kiem
    short: 'đổi phiên lính thú'
    variants:
      - 'Đến kỳ đổi phiên. Toán lính cũ xuống núi, toán mới lên thay, hai bên gặp nhau ở đầu đèo trao lại thẻ bài và nồi đồng.'
      - 'Đổi phiên giữa trời mưa phùn. Bạn nhận lại cái chòi canh, trên vách còn khắc tên mấy lớp lính trước.'
      - 'Hết phiên thú, toán của bạn hành quân về doanh dưới xuôi. Đi ba ngày, đến cánh đồng đầu tiên thì cả toán reo lên.'

  - id: nq_linh_dem_canh_don
