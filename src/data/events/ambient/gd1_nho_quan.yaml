    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { has_property: phu_nho }, { var: household.money, op: '<', value: 3 }] }
    weight: 3
    cooldown_years: 4
    importance: 2
    tone: buon
    icon: nguoi_la
    variants:
