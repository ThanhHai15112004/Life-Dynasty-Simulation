    variants:
      - 'Sứ thần phương Bắc sắp sang. Triều đình chọn người giỏi thơ văn ra biên giới tiếp sứ, nghe nói ai đối đáp kém sẽ bị quở.'
      - 'Đoàn sứ bộ nước ta đi sứ phương Bắc đã về. Người ta truyền nhau bài thơ ông Chánh sứ làm khi qua ải.'

  - id: nq_tin_trieu_dai_xa
    kind: tin_the_gioi
    tags: [tin_don, van_minh]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { var: player.status_rank, op: 'in', value: [si_phu, quan_lai] }] }
