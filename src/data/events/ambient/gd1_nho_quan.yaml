    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { any: [{ var: player.career, op: '==', value: si_tu }, { var: player.status_rank, op: 'in', value: [si_phu, quan_lai] }] }] }
