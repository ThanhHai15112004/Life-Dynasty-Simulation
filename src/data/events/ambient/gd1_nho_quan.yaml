      - 'Quan Thượng thư bộ Lại vừa về hưu, ghế ấy chưa biết vào tay ai. Cả giới quan trường đều đang ngóng.'
      - 'Người ta kể vị Tiến sĩ đỗ đầu khoa trước đã mất ở nhiệm sở miền núi vì sốt rét, mới ngoài ba mươi.'

  - id: nq_tin_trieu_su_than
