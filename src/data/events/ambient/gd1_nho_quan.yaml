    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { has_property: phu_nho }, { var: household.debt, op: '>', value: 10 }] }
    weight: 3
    cooldown_years: 4
    importance: 3
    tone: buon
    icon: no
    variants:
      - 'Đôi lục bình men lam bày ở gian thờ đã theo lái buôn về trấn. Chỗ để trống trên án, mẹ đặt tạm hai bình hoa cúc.'
      - 'Bộ ấm chén ông cố được vua ban năm xưa, nay đem cầm ở hiệu cầm đồ chợ huyện. Người ta trả chưa được nửa giá.'
    trait_reactions:
      trong_gia_dinh: 'Bạn thề sẽ chuộc lại bằng được.'

  - id: nq_tu_dinh_nguoi_o_xin_nghi
