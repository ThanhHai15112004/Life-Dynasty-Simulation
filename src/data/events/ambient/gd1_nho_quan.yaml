      - 'Thằng ở cuối cùng cũng xin nghỉ, sang làm cho nhà phú hộ đầu làng. Sáng ra không ai quét sân, bạn tự cầm chổi.'

  - id: nq_tu_dinh_khach_soi_moi
    kind: nguoi_quanh
