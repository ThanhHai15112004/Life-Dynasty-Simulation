    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }, { has_property: phu_nho }, { var: player.status_rank, op: 'in', value: [dan_ngheo, thuong_dan] }] }
    weight: 3
    cooldown_years: 4
    importance: 2
    icon: tin_don
    variants:
      - 'Vợ ông lái buôn đến chơi, mắt nhìn khắp gian nhà, khen "cột kèo đẹp quá, giá mà sửa lại". Bạn chỉ cười, rót thêm chén nước.'
      - 'Người làng gọi nhà bạn là "nhà cụ Cử cũ", chữ "cũ" kéo dài ra. Bạn nghe mãi cũng quen.'
    effects: [{ type: stress, value: 2 }]

  # ── Lính ──
  - id: nq_linh_doi_phien
