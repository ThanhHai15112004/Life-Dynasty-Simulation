    cooldown_years: 3
    importance: 1
    tone: buon
    icon: kho
    variants:
      - 'Cơm doanh trại gạo cũ lẫn sạn, ăn với mắm tép mặn chát. Bạn nhớ bát canh cua rau đay mẹ nấu đến thắt ruột.'
      - 'Thuyền lương đến chậm nửa tháng, cả doanh ăn cháo loãng. Đồng ngũ đùa nhau rằng húp mạnh tay thì thấy cả bóng mình.'

  - id: nq_linh_nho_mua_gat
