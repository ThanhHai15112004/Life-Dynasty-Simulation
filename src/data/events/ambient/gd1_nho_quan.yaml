    weight: 3
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: nha
    short: 'tư dinh xuống cấp'
    variants:
      - 'Cột gỗ lim ở gian giữa đã bị mọt khoét một lỗ to bằng nắm tay. Bạn gõ thử, nghe tiếng rỗng mà lạnh người.'
      - 'Sân gạch tư dinh rêu phủ xanh. Mấy viên ngói mũi hài rơi vỡ, chưa có tiền thay, đành xếp tạm lá cọ.'
      - 'Bức hoành phi "Tích thiện gia" sơn đã tróc gần hết. Đứng dưới nhìn lên, chỉ còn đọc được chữ "thiện".'

  - id: nq_tu_dinh_ban_do_co
