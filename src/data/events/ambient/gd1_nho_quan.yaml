      - 'Người trên thuyền lương kể đại quân đã qua đèo. Nhà nào có con đi lính đều ra đình thắp hương.'

  # ── Lễ nghi Nho giáo ──
  - id: nq_le_te_van_chi
    kind: chuyen_vat
