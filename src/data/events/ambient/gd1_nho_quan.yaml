    importance: 2
    tone: vui
    icon: tet
    variants:
      - 'Sáng mồng ba, bạn khai bút đầu xuân. Mài mực, trải giấy, viết bốn chữ "Tân xuân đại cát" rồi dán lên cột nhà.'
      - 'Khai bút năm mới, bạn viết một bài thơ ngắn tả cành đào trước sân. Đọc lại thấy cũng được, cất vào hòm.'
    effects: [{ type: stress, value: -2 }]

  # ── Tư dinh sa sút ──
  - id: nq_tu_dinh_cot_mot
