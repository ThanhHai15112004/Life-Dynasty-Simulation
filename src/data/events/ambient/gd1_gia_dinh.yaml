# [gd1] Nhật ký dòng đời — gia đình, con cái, cha mẹ già, giỗ Tết, tín ngưỡng, tuổi già, tự nhìn lại đời mình (người lớn)
# Quy tắc: R1 điều kiện khớp trạng thái thật · R5 cooldown + nhiều cách viết · R9 tác động ±1–3
templates:
  # ── Vợ chồng, bữa cơm ──
  - id: gd_bua_com_chieu
    kind: chuyen_vat
    tags: [gia_dinh]
    life_stages: [lap_nghiep, trung_nien]
    condition: { all: [{ var: player.married, op: '==', value: true }, { var: household.food_months, op: '>=', value: 3 }] }
    weight: 5
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: gia_dinh
    short: 'bữa cơm chiều đủ mặt cả nhà'
    variants:
      - 'Bữa cơm chiều có đĩa rau muống luộc, bát canh cua. Cả nhà ngồi quanh mâm, ai cũng ăn đến bát thứ ba.'
      - 'Trời nhá nhem, cả nhà trải chiếu ra sân ăn cơm. Gió đồng thổi lên mát rượi.'
      - 'Bữa tối chỉ có cà muối với cá kho, nhưng đủ mặt mọi người. Bạn thấy lòng yên.'
    effects: [{ type: stress, value: -1 }]

  - id: gd_bua_com_thieu
    kind: bao_cao
    tags: [gia_dinh, kinh_te]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: household.food_months, op: '<', value: 2 }, { var: player.children_count, op: '>=', value: 1 }] }
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: gia_dinh
    short: 'nhường phần cơm cho con'
    variants:
      - 'Nồi cơm độn khoai nhiều hơn gạo. Bạn xới cho các con trước, phần mình chỉ còn lớp cháy.'
      - 'Bữa tối nay chỉ có cháo loãng với muối vừng. Bạn bảo mình no rồi, để phần cho con.'
    effects: [{ type: stress, value: 2 }]

  - id: gd_vo_chong_gian_nhau
    kind: nguoi_quanh
    tags: [gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition: { var: player.married, op: '==', value: true }
    roles: [{ id: vc, from: family, relation: spouse }]
    weight: 4
    weight_modifiers:
      - { condition: { var: household.debt, op: '>', value: 10 }, factor: 1.5 }
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: gia_dinh
    short: 'vợ chồng giận nhau'
    variants:
      - 'Bạn với {role.vc.call} giận nhau vì chuyện tiền chợ. Cả ngày hai người không nói với nhau câu nào.'
      - 'Một câu nặng lời lúc mệt mỏi, thế là {role.vc.call} ôm gối sang buồng bên ngủ.'
      - 'Hai vợ chồng cãi nhau to. Đến tối, {role.vc.call} vẫn lặng lẽ dọn cơm cho bạn.'
    trait_reactions:
      nong_nay: 'Bạn biết mình nóng nảy, nhưng câu xin lỗi cứ mắc ở cổ.'
      nhan_tu: 'Đêm ấy bạn sang ngồi bên giường, nói khẽ một câu làm lành.'
    effects: [{ type: stress, value: 2 }]

  - id: gd_vo_chong_lam_lanh
    kind: nguoi_quanh
    tags: [gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition: { var: player.married, op: '==', value: true }
    roles: [{ id: vc, from: family, relation: spouse }]
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: an_ui
    icon: chen_tra
    variants:
      - 'Sáng ra {role.vc.call} pha cho bạn ấm chè xanh. Chuyện hôm qua chẳng ai nhắc lại.'
      - 'Bạn mua ở chợ về mấy cái bánh đúc, để phần {role.vc.call}. Thế là làm lành.'
    effects: [{ type: stress, value: -2 }]

  - id: gd_vo_chong_tam_su
    kind: nguoi_quanh
    tags: [gia_dinh]
    life_stages: [lap_nghiep, trung_nien]
    condition: { all: [{ var: player.married, op: '==', value: true }, { var: player.children_count, op: '>=', value: 1 }] }
    roles: [{ id: vc, from: family, relation: spouse }]
    weight: 4
    cooldown_years: 3
    importance: 1
    tone: an_ui
    icon: trang
    variants:
      - 'Đêm khuya, bạn với {role.vc.call} nằm nghe mưa trên mái, bàn chuyện dựng vợ gả chồng cho con sau này.'
      - 'Hai vợ chồng ngồi đếm từng đồng tiền kẽm trong ống tre, tính xem Tết này sắm cho con được bộ áo không.'
      - 'Con ngủ cả rồi, bạn và {role.vc.call} ngồi bên bếp tro, nói chuyện vặt đến khi gà gáy canh một.'
    effects: [{ type: stress, value: -1 }]

  - id: gd_vo_chong_om
    kind: bao_cao
    tags: [gia_dinh, benh_tat]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    roles: [{ id: vc, from: family, relation: spouse, condition: { var: self.health, op: '<', value: 50 } }]
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: thuoc
    variants:
      - 'Mấy hôm nay {role.vc.call} ốm. Bạn tự tay sắc thuốc, thổi nguội từng thìa cháo.'
      - 'Người bạn đời nằm sốt cả tuần. Bạn vừa lo việc nhà vừa chạy ra chạy vào bên giường.'
    trait_reactions:
      trong_gia_dinh: 'Việc ngoài bạn gác hết, chỉ ngồi bên giường.'
    effects: [{ type: stress, value: 2 }]

  - id: gd_vo_chong_tuoi_gia
    kind: chuyen_vat
    tags: [gia_dinh]
    life_stages: [tuoi_gia]
    roles: [{ id: vc, from: family, relation: spouse }]
    weight: 5
    cooldown_years: 3
    importance: 2
    tone: an_ui
    icon: binh_yen
    short: 'hai ông bà ngồi hiên'
    variants:
      - 'Chiều chiều hai ông bà ngồi hiên nhai trầu, nhìn đàn gà mổ thóc ngoài sân.'
      - 'Tóc {role.vc.call} đã bạc trắng. Bạn ngồi nhìn người bạn đời, chợt nhớ ngày mới về chung một nhà.'
      - 'Đêm lạnh, hai người già nằm nghe gió, kể lại chuyện mấy chục năm trước mà vẫn cười.'
    effects: [{ type: stress, value: -2 }]

  - id: gd_ve_nha_ngoai
    kind: chuyen_vat
    tags: [gia_dinh, le_hoi]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    months: [1]
    condition: { all: [{ var: player.sex, op: '==', value: m }, { var: player.married, op: '==', value: true }] }
    roles: [{ id: vo, from: family, relation: spouse }]
    weight: 4
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: tet
    variants:
      - 'Mồng hai Tết, bạn theo {role.vo.call} về nhà ngoại, mang biếu cặp bánh chưng và chai rượu nếp.'
      - 'Theo lệ "mồng một nhà cha, mồng hai nhà mẹ", bạn đội nón đi bên {role.vo.call} qua mấy cánh đồng về làng ngoại.'
    effects: [{ type: stress, value: -1 }]

  # ── Con cái ──
  - id: gd_con_tap_noi
    kind: chuyen_vat
    tags: [gia_dinh]
    roles: [{ id: con, from: family, relation: child, condition: { var: self.age, op: between, value: [1, 2] }, pick: youngest }]
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: tre_em
    short: 'con tập nói'
    variants:
      - 'Hôm nay {role.con.call} bập bẹ gọi được tiếng đầu tiên. Cả nhà tranh nhau bảo nó gọi tên mình.'
      - 'Đứa nhỏ học nói, ai nói gì cũng nhại theo, lẫn cả câu chửi của bà hàng xóm.'
      - 'Bạn nhìn {role.con.call} men theo vách chập chững, ngã rồi lại đứng lên, không khóc.'
    effects: [{ type: stress, value: -2 }]

  - id: gd_con_khoc_dem
    kind: chuyen_vat
    tags: [gia_dinh]
    roles: [{ id: con, from: family, relation: child, condition: { var: self.age, op: '==', value: 0 }, pick: youngest }]
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: trung_tinh
    icon: tre_em
    short: 'thức đêm dỗ con'
    variants:
      - 'Đêm nào {role.con.call} cũng khóc từ canh hai đến canh tư. Bạn bế con đi quanh sân, mắt díp lại.'
      - 'Đứa bé mọc răng, quấy khóc suốt đêm. Sáng ra bạn vẫn phải dậy sớm đi làm.'
    effects: [{ type: stress, value: 1 }]

  - id: gd_con_nghich
    kind: nguoi_quanh
    tags: [gia_dinh]
    roles: [{ id: con, from: family, relation: child, condition: { var: self.age, op: between, value: [4, 9] } }]
    weight: 5
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: tre_em
    variants:
      - 'Hôm nay {role.con.call} trèo cây ổi nhà hàng xóm, ngã trầy cả đầu gối. Bạn vừa giận vừa thương.'
      - 'Đứa trẻ lấy than vẽ kín vách nhà, nào trâu nào gà, trông cũng ra dáng.'
      - 'Bạn bắt gặp {role.con.call} rủ lũ trẻ ra sông tắm một mình, hú vía cả buổi chiều.'
    effects: [{ type: stress, value: -1 }]

  - id: gd_con_doc_bai
    kind: chuyen_vat
    tags: [gia_dinh, hoc_hanh]
    condition: { any: [{ var: player.origin, op: '==', value: quy_toc_nho }, { var: household.career, op: '==', value: si_tu }] }
    roles: [{ id: con, from: family, relation: child, condition: { var: self.age, op: between, value: [6, 15] } }]
    weight: 5
    cooldown_years: 3
    importance: 2
    tone: vui
    icon: sach
    variants:
      - 'Tối tối {role.con.call} ngồi bên đèn đọc to bài "Nhân chi sơ". Bạn ngồi nghe mà nhớ thời mình đi học.'
      - 'Bạn cầm tay {role.con.call} viết nét sổ, nét mác. Chữ còn run, nhưng đã ra hình.'
    effects: [{ type: skill_xp, who: con, skill: hoc_van, value: 5 }]

  - id: gd_con_phu_viec_dong
    kind: chuyen_vat
    tags: [gia_dinh, ruong_dong]
    condition: { var: household.self_farms, op: '==', value: true }
    roles: [{ id: con, from: family, relation: child, condition: { var: self.age, op: between, value: [9, 15] } }]
    weight: 5
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: ruong
    variants:
      - 'Bạn dắt {role.con.call} ra đồng nhổ mạ. Bùn lấm đến tận mang tai mà đứa trẻ không kêu một tiếng.'
      - 'Chiều về đã thấy {role.con.call} cắt xong gánh cỏ cho trâu, nồi cơm cũng đã sôi.'
    effects: [{ type: skill_xp, who: con, skill: sinh_ton, value: 5 }]

  - id: gd_con_ra_sap
    kind: chuyen_vat
    tags: [gia_dinh, buon_ban]
    condition: { var: household.career, op: '==', value: thuong_nhan }
    roles: [{ id: con, from: family, relation: child, condition: { var: self.age, op: between, value: [10, 16] } }]
    weight: 5
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: cho
    variants:
      - 'Bạn cho {role.con.call} ra sạp phụ cân muối. Đứa trẻ mời khách còn ngọt hơn người lớn.'
      - 'Bạn dạy {role.con.call} nhận mặt đồng tiền kẽm pha chì. Đứa trẻ học nhanh, mắt sáng lên.'
    effects: [{ type: skill_xp, who: con, skill: thuong_mai, value: 5 }]

  - id: gd_con_om_vat
    kind: bao_cao
    tags: [gia_dinh, benh_tat]
    roles: [{ id: con, from: family, relation: child, condition: { var: self.age, op: between, value: [0, 8] } }]
    weight: 4
    cooldown_years: 2
    importance: 2
    tone: buon
    icon: om
    short: 'con ốm vặt'
    variants:
      - 'Mấy hôm nay {role.con.call} sổ mũi, ho khan. Bạn giã gừng với mật ong cho con ngậm.'
      - 'Đêm qua {role.con.call} sốt nóng hầm hập, cả nhà thức trắng chườm khăn.'
    effects:
      - { type: health, who: con, value: -2 }
      - { type: stress, value: 1 }

  - id: gd_con_lon_khon
    kind: nguoi_quanh
    tags: [gia_dinh]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    roles: [{ id: con, from: family, relation: child, condition: { var: self.age, op: between, value: [16, 24] } }]
    weight: 4
    cooldown_years: 4
    importance: 2
    tone: an_ui
    icon: ky_uc
    variants:
      - 'Gánh lúa nặng, {role.con.call} giành lấy gánh thay bạn. Con đã cao hơn bạn nửa cái đầu.'
      - 'Nhìn {role.con.call} đứng giữa sân, bạn chợt nhận ra con đã thành người lớn từ lúc nào.'
    effects: [{ type: stress, value: -1 }]

  - id: gd_con_cai_lai
    kind: nguoi_quanh
    tags: [gia_dinh]
    roles: [{ id: con, from: family, relation: child, condition: { all: [{ var: self.age, op: between, value: [13, 22] }, { var: self.opinion, op: '<', value: 0 }] } }]
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: gia_dinh
    variants:
      - 'Hôm nay {role.con.call} cãi lại bạn một câu rồi bỏ ra ngõ. Bạn đứng lặng, nhớ ngày mình cũng từng như thế.'
      - 'Bạn gọi mấy lần {role.con.call} mới thưa. Dạo này đứa trẻ ít nói với bạn hẳn.'
    trait_reactions:
      nong_nay: 'Bạn suýt vớ lấy cái roi, rồi lại thôi.'
      kien_nhan: 'Bạn để con nguôi đã, tối mới gọi lại nói chuyện.'
    effects: [{ type: stress, value: 2 }]

  - id: gd_nha_dong_con
    kind: chuyen_vat
    tags: [gia_dinh]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.children_count, op: '>=', value: 3 }
    weight: 4
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: gia_dinh
    short: 'nhà đông con ầm ĩ'
    variants:
      - 'Nhà đông con, sáng nào cũng ầm ĩ như cái chợ. Nồi cơm vừa bắc ra đã hết.'
      - 'Mấy đứa con chí chóe tranh nhau cái bánh đa. Bạn bẻ ra chia đều, đứa nào cũng phụng phịu.'
      - 'Tối đến, lũ trẻ nằm xếp hàng trên chiếc giường tre, đứa này gác chân lên đứa kia mà ngủ.'
    effects: [{ type: stress, value: -1 }]

  - id: gd_hiem_muon
    kind: chuyen_vat
    tags: [gia_dinh]
    condition:
      all:
        - { var: player.married, op: '==', value: true }
        - { var: player.children_count, op: '==', value: 0 }
        - { var: player.age, op: between, value: [26, 42] }
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: gia_dinh
    variants:
      - 'Đi qua nhà hàng xóm nghe tiếng trẻ con khóc, bạn đứng lại một lúc lâu.'
      - 'Giỗ họ năm nay, cụ trưởng họ lại hỏi bao giờ nhà có cháu. Bạn cười trừ, cúi xuống mâm.'
    effects: [{ type: stress, value: 2 }]

  - id: gd_buon_xa_nho_con
    kind: chuyen_vat
    tags: [gia_dinh, buon_ban]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: player.children_count, op: '>=', value: 1 }] }
    life_stages: [lap_nghiep, trung_nien]
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: gia_dinh
    variants:
      - 'Theo thuyền hàng xuôi nửa tháng, đêm nằm khoang nghe sóng vỗ, bạn nhớ tiếng con gọi ở bến nhà.'
      - 'Đi buôn về, bạn mở tay nải lấy ra mấy con giống bột mua ở phố huyện. Lũ trẻ reo lên.'
    effects: [{ type: stress, value: -1 }]

  - id: gd_nho_gia_huan
    kind: chuyen_vat
    tags: [gia_dinh, hoc_hanh]
    condition: { all: [{ var: player.origin, op: '==', value: quy_toc_nho }, { var: player.children_count, op: '>=', value: 1 }] }
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    weight: 3
    cooldown_years: 4
    importance: 2
    tone: trung_tinh
    icon: sach
    variants:
      - 'Rằm tháng giêng, bạn gọi các con ra gian giữa, đọc lại mấy điều gia huấn ông nội để lại.'
      - 'Mái ngói nhà cũ dột thêm một chỗ. Bạn bảo con: nhà có thể dột, nếp nhà thì đừng để dột.'
    effects: [{ type: filial_piety, value: 1 }]

  # ── Cha mẹ già ──
  - id: gd_cha_me_yeu
    kind: bao_cao
    tags: [gia_dinh, benh_tat]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    roles: [{ id: cm, from: family, relation: parent, condition: { all: [{ var: self.age, op: '>=', value: 60 }, { var: self.health, op: '<', value: 55 }] } }]
    weight: 5
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: om
    short: 'cha mẹ già yếu đi'
    variants:
      - 'Dạo này {role.cm.call} đi vài bước đã thở dốc, phải chống gậy ra vườn.'
      - 'Bữa cơm, {role.cm.call} chỉ ăn được mấy thìa cháo rồi buông đũa.'
      - 'Đêm nào cũng nghe tiếng {role.cm.call} ho húng hắng ở buồng bên.'
    effects: [{ type: stress, value: 2 }]

  - id: gd_me_gia_bep
    kind: nguoi_quanh
    tags: [gia_dinh]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    roles: [{ id: me, from: family, relation: mother, condition: { var: self.age, op: '>=', value: 60 } }]
    weight: 4
    cooldown_years: 3
    importance: 1
    tone: an_ui
    icon: gia_dinh
    variants:
      - 'Đã già mà {role.me.call} vẫn dậy sớm nhóm bếp, bảo nằm mãi thì xương cốt nó cứng lại.'
      - 'Bạn về muộn, thấy {role.me.call} vẫn ngồi đợi bên mâm cơm đậy lồng bàn.'
    effects: [{ type: stress, value: -1 }]

  - id: gd_cha_gia_dan_do
    kind: nguoi_quanh
    tags: [gia_dinh]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    roles: [{ id: cha, from: family, relation: father, condition: { var: self.age, op: '>=', value: 62 } }]
    weight: 4
    cooldown_years: 4
    importance: 2
    tone: trung_tinh
    icon: ky_uc
    variants:
      - 'Ngồi hiên, {role.cha.call} kể chuyện năm lụt lớn, chuyện làng ngày xưa. Bạn nghe đến lần thứ mười vẫn gật gù.'
      - 'Chiều nay {role.cha.call} gọi bạn ra chỉ chỗ cất giấy tờ ruộng đất, dặn đi dặn lại.'
    effects: [{ type: stress, value: -1 }]

