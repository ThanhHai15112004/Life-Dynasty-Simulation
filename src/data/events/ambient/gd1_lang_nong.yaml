      - 'Ở quán nước đầu làng, người ta đồn nhà phú hộ xóm bên sắp gả con gái cho con quan huyện.'
      - 'Ngồi hóng mát gốc đa, bạn nghe ông lão kể chuyện thời trai trẻ đi lính thú tận biên ải.'
