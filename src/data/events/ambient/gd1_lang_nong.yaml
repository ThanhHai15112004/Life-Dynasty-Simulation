# [1] Nhật ký dòng đời — nhà nông & đời sống làng xã cho người lớn (16 tuổi trở lên). Tiền tố id: ln_
# Lịch nông vụ theo tháng âm: tháng chạp trồng khoai, tháng giêng trồng đậu, tháng ba cày vỡ, tháng tư làm mạ,
# tháng năm gặt chiêm, tháng sáu cấy mùa, tháng mười gặt mùa, tháng một cày ải gieo mạ chiêm.
# Việc đồng gắn household.self_farms == true; chuyện làng gắn world.settlement_type == lang_nong.
templates:
  # ── Việc đồng theo tháng ──
  - id: ln_cay_ai_phoi_dat
    kind: bao_cao
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    months: [11, 12]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 4
    cooldown_years: 2
    importance: 1
    icon: trau
    short: 'cày ải phơi đất'
    variants:
      - 'Gió bấc thổi rát mặt. Bạn theo sau đường cày từ lúc sương còn trắng đồng, đất lật lên từng tảng phơi cho ải.'
      - 'Cả tuần cày ải, bàn chân bạn nứt nẻ vì bùn lạnh. Ruộng giờ là những luống đất nâu chờ nắng hanh.'
      - 'Bạn cày xong thửa cuối khi mặt trời đã lặn sau lũy tre. Con trâu thở phì phò, bạn cũng vậy.'
    effects: [{ type: skill_xp, skill: sinh_ton, value: 4 }]
  - id: ln_gieo_ma_chiem
    kind: bao_cao
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [11, 12]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: cay_lua
    short: 'gieo mạ chiêm'
    variants:
      - 'Thóc giống ngâm ba ngày, ủ hai đêm đã nứt nanh. Bạn vãi đều tay xuống ruộng mạ, phủ một lớp tro bếp chống rét.'
      - 'Đêm nay trời rét, cả nhà ra ruộng mạ phủ rơm. Mạ non xanh mỏng như tơ, chết một lứa là lỡ cả vụ.'
  - id: ln_cay_chiem_giua_ret
    kind: bao_cao
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    months: [12, 1]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 4
    cooldown_years: 2
    importance: 2
    tone: buon
    icon: ruong
    short: 'cấy chiêm giữa rét'
    variants:
      - 'Cấy chiêm giữa tiết đại hàn, nước ruộng lạnh buốt tới xương. Bạn cắm từng dảnh mạ, môi tím tái.'
      - 'Mưa phùn lất phất cả buổi cấy. Đến trưa, tay bạn cứng đờ, cầm nắm cơm cũng run.'
    effects: [{ type: health, value: -1 }]
  - id: ln_trong_khoai_thang_chap
    kind: chuyen_vat
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [12]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: la
    variants:
      - '"Tháng chạp là tháng trồng khoai." Bạn vun mấy luống đất bãi, cắm dây khoai lang, mong giáp hạt có cái độn cơm.'
      - 'Bạn trồng nốt vạt khoai bờ sông. Mẹ dặn khoai năm nay phải để dành đến tháng ba.'
  - id: ln_lam_co_lua_chiem
    kind: bao_cao
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [2, 3]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 4
    cooldown_years: 2
    importance: 1
    icon: ruong
    short: 'làm cỏ lúa chiêm'
    variants:
      - 'Bạn bò dọc từng hàng lúa, sục tay xuống bùn nhổ cỏ lồng vực. Đỉa bám đầy bắp chân lúc nào không hay.'
      - 'Làm cỏ đợt hai, lúa đã lên xanh đều. Bạn đứng thẳng lưng, nghe xương sống kêu răng rắc.'
      - 'Nắng xuân hanh hao, cả nhà làm cỏ đến xế chiều. Nón lá ai cũng ướt đẫm mồ hôi.'
  - id: ln_bon_phan_chuong
    kind: chuyen_vat
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    months: [1, 2, 7]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: ruong
    variants:
      - 'Bạn gánh phân chuồng trộn tro bếp ra ruộng, mùi hôi bám theo đến tận bữa cơm. "Người đẹp vì lụa, lúa tốt vì phân."'
      - 'Bạn vớt bèo hoa dâu dưới ao lên ủ, đem rải khắp ruộng. Lúa hôm sau đã như xanh thêm một nước.'
  - id: ln_tat_nuoc_gau_dai
    kind: bao_cao
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    months: [3, 4, 6]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 4
    cooldown_years: 2
    importance: 1
    icon: nang
    short: 'tát nước vào ruộng'
    variants:
      - 'Hai người hai đầu dây gầu, nhịp tát đều đều dưới trăng. Nước lạch từng gầu đổ vào ruộng, sáng lấp lánh.'
      - 'Bạn đứng gầu sòng cả buổi trưa, vai mỏi rã. Chân ruộng mới ngấp nghé nước.'
    effects: [{ type: health, value: -1 }]
  - id: ln_giap_hat_thang_ba
    kind: bao_cao
    tags: [ruong_dong, kinh_te]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [2, 3]
    condition:
      all:
        - { var: household.self_farms, op: '==', value: true }
        - { var: household.food_months, op: '<', value: 3 }
        - { var: household.money, op: '<', value: 10 }
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: buon
    icon: kho
    short: 'giáp hạt tháng ba'
    variants:
      - '"Tháng ba ngày tám", bồ thóc nhà bạn đã chạm đáy. Bữa cơm độn khoai, độn cả rau má.'
      - 'Lúa ngoài đồng còn xanh, thóc trong nhà đã cạn. Bạn ra bãi đào củ chuối về nấu cháo.'
    effects: [{ type: stress, value: 2 }]
  - id: ln_lua_chiem_tro_dong
    kind: chuyen_vat
    tags: [ruong_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [4]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: cay_lua
    variants:
      - 'Lúa chiêm đã trổ đòng, gió đầu hè thổi qua cả cánh đồng thơm mùi sữa non. Bạn đứng trên bờ, nhẩm tính mùa.'
      - 'Bông lúa đầu tiên trổ ra khỏi bẹ. Bạn ngắt một hạt, bóp thử, thấy sữa trắng ứa ra.'
  - id: ln_gat_chiem
    kind: bao_cao
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [5]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: lua
    short: 'gặt chiêm tháng năm'
    variants:
      - 'Tháng năm gặt chiêm, liềm cắt soàn soạt từ tờ mờ sáng. Gánh lúa nặng oằn vai, bạn vẫn đi như chạy.'
      - 'Nắng tháng năm như đổ lửa. Cả nhà gặt vội cho kịp trước cơn mưa rào chiều nào cũng kéo đến.'
      - 'Bạn bó lúa thành lượm, xếp đầy bờ ruộng. Chim sẻ ríu rít theo sau nhặt hạt rơi.'
  - id: ln_phoi_thoc_chay_mua
    kind: chuyen_vat
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [5, 6, 10]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 4
    cooldown_years: 2
    importance: 1
    icon: mua
    variants:
      - 'Thóc đang phơi đầy sân thì mây đen kéo tới. Cả nhà vơ cào, vơ chổi, quét thóc vào nhà trước khi hạt mưa đầu rơi xuống.'
      - 'Bạn đảo thóc trên sân gạch, chân trần bỏng rát. Hạt thóc vàng khô giòn, cắn nghe tách một tiếng.'
  - id: ln_dap_lua_dem_trang
    kind: chuyen_vat
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    months: [5, 10]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: trang
    variants:
      - 'Đêm trăng sáng, cả xóm đập lúa trên sân. Tiếng bồ đập thình thịch, tiếng hát ví vọng qua mấy nhà.'
      - 'Bạn quật từng lượm lúa vào cối đá đến khuya. Rơm vụn bám đầy tóc, ngứa ran cả cổ.'
  - id: ln_cay_mua
    kind: bao_cao
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    months: [6, 7]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 4
    cooldown_years: 2
    importance: 1
    icon: ruong
    short: 'cấy lúa mùa'
    variants:
      - 'Gặt chiêm xong chưa kịp nghỉ đã phải cày bừa cấy mùa. Bùn ngập đến đầu gối, nắng trên lưng như rang.'
      - 'Mưa đầu mùa đổ xuống, bạn nhổ mạ bó thành từng nắm, ném ra khắp ruộng cho người cấy.'
      - 'Hàng lúa bạn cấy thẳng tắp như kẻ chỉ. Bà cụ bên cạnh khen một câu, bạn vui suốt buổi.'
  - id: ln_lam_co_lua_mua
    kind: bao_cao
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [7, 8]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: ruong
    short: 'làm cỏ lúa mùa'
    variants:
      - 'Mưa ngâu rả rích, bạn đội áo tơi đi làm cỏ lúa mùa. Ruộng sũng nước, cỏ mọc nhanh hơn lúa.'
      - 'Bạn sục bùn quanh gốc lúa, vùi cỏ xuống làm phân. Đến chiều về, tay nhăn nheo như tay ông lão.'
  - id: ln_bat_sau_cuon_la
    kind: bao_cao
    tags: [ruong_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [8, 9]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 3
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: sau
    short: 'sâu phá lúa'
    variants:
      - 'Sâu cuốn lá phá một góc ruộng, lá lúa trắng bạc. Cả nhà cầm đèn ra đồng bắt sâu, rảy tro bếp đến nửa đêm.'
      - 'Rầy nâu bám đặc gốc lúa. Bạn tháo cạn nước ruộng, nhìn cả thửa vàng úa mà xót ruột.'
  - id: ln_duoi_chim_se
    kind: chuyen_vat
    tags: [ruong_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [9, 4]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: ruong
    variants:
      - 'Lúa sắp chín, chim sẻ kéo về từng đàn. Bạn cắm bù nhìn rơm đội nón rách, lại buộc ống bương gõ lóc cóc trên bờ.'
      - 'Bạn đứng giữa ruộng vung sào đuổi chim cả buổi. Đàn chim bay lên một vòng rồi lại sà xuống chỗ khác.'
  - id: ln_gat_mua
    kind: bao_cao
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [10]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: lua
    short: 'gặt mùa tháng mười'
    variants:
      - 'Tháng mười gặt mùa, trời hanh và cao. Lúa chín vàng ươm, gánh về đến đâu thơm đến đó.'
      - 'Đồng làng ngày gặt rộn như hội. Bạn gánh lúa qua cầu tre, nghe nó kẽo kẹt dưới chân.'
      - 'Bạn gặt thửa cuối khi gió bấc đầu mùa vừa về. Rơm rạ chất cao hơn đầu người sau hè.'
  - id: ln_phoi_rom_dun_bep
    kind: chuyen_vat
    tags: [ruong_dong, gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [10, 11]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: nang
    variants:
      - 'Rơm trải vàng khắp ngõ, phơi cho khô để đun bếp, lợp chuồng trâu. Mùi rơm mới ngai ngái theo vào giấc ngủ.'
      - 'Bạn đánh đống rơm sau nhà, vun cao như cái nấm. Mùa đông này trâu có cái ăn, bếp có cái đun.'
  - id: ln_duoc_mua_dong_bo
    kind: bao_cao
    tags: [ruong_dong, kinh_te]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [5, 10]
    condition:
      all:
        - { var: household.self_farms, op: '==', value: true }
        - { var: world.harvest_quality, op: '==', value: duoc_mua }
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: kho
    short: 'được mùa, thóc đầy bồ'
    variants:
      - 'Năm nay được mùa, bông lúa trĩu nặng cong cả cọng. Đong thóc vào bồ, bồ đầy lại phải quây thêm cót.'
      - 'Thóc mẩy hạt, đong đấu nào đầy đấu nấy. Tối ấy cả nhà ăn bữa cơm trắng không độn.'
    effects: [{ type: stress, value: -2 }]
  - id: ln_mat_mua_thoc_lep
    kind: bao_cao
    tags: [ruong_dong, kinh_te]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [5, 10]
    condition:
      all:
        - { var: household.self_farms, op: '==', value: true }
        - { var: world.harvest_quality, op: 'in', value: [kem, mat_mua] }
    weight: 5
    cooldown_years: 2
    importance: 3
    tone: buon
    icon: mat_mua
    short: 'mùa kém, thóc lép'
    variants:
      - 'Bông lúa lép kẹp, cầm lên nhẹ bẫng. Gặt cả ngày mà gánh về chẳng được mấy.'
      - 'Bạn sàng thóc, trấu bay mù mịt, hạt chắc còn lại chỉ lưng thúng. Cả nhà nhìn nhau không nói.'
    effects: [{ type: stress, value: 3 }]
  - id: ln_tat_ao_cuoi_nam
    kind: bao_cao
    tags: [lao_dong, kinh_te]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [12]
    condition: { has_property: ao_ca }
    weight: 4
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: ca
    short: 'tát ao bắt cá'
    variants:
      - 'Cuối năm tát ao, cả nhà lội bùn bắt cá. Con cá trắm to nhất để dành cúng ông Công ông Táo.'
      - 'Ao cạn trơ đáy, cá quẫy lấp lánh. Lũ trẻ hàng xóm đứng kín bờ chờ mò cá sót.'
  - id: ln_xay_lua_gia_gao
    kind: chuyen_vat
    tags: [lao_dong, gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: nha
    variants:
      - 'Đêm khuya, bạn ngồi xay lúa bên cối đất, tiếng cối ù ù đều như tiếng gió. Sáng mai giã gạo, giần sàng cho xong.'
      - 'Chày giã gạo nhịp đôi thình thịch dưới hiên. Bạn vừa giã vừa nghe mẹ kể chuyện ngày xưa.'
  - id: ln_cat_co_trau
    kind: chuyen_vat
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition: { has_property: trau }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: trau
    variants:
      - 'Bạn ra bãi sông cắt một gánh cỏ gà cho trâu. Con trâu thấy bạn về, rống lên một tiếng dài.'
      - 'Chiều mùa đông, bạn đốt đống rơm trước chuồng sưởi cho trâu. Hơi thở nó phả ra trắng xóa.'
      - 'Bạn dắt trâu xuống sông tắm, kỳ cọ lưng nó bằng nắm rơm. Nó lim dim mắt như người.'
  - id: ln_gia_trong_vit_ngoai_dong
    kind: chuyen_vat
    tags: [ruong_dong, gia_dinh]
    life_stages: [tuoi_gia]
    condition: { var: household.self_farms, op: '==', value: true }
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: an_ui
    icon: ruong
    variants:
      - 'Không cày nổi nữa, bạn ngồi đầu bờ trông vịt, chỉ việc cho con cháu. Tay vẫn nhớ từng đường cày năm xưa.'
      - 'Bạn đan rổ rá dưới gốc tre, mắt vẫn dõi ra đồng. Lúa năm nay con cấy, thẳng hàng như cha dạy.'

  # ── Điềm thời tiết ──
  - id: ln_diem_chuon_chuon
    kind: diem_bao
    tags: [ruong_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [4, 5, 6, 7]
    condition: { var: world.settlement_type, op: '==', value: lang_nong }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: mua
    variants:
      - 'Chuồn chuồn bay thấp là là mặt ruộng. "Chuồn chuồn bay thấp thì mưa", bạn vội gọi người nhà cất thóc.'
      - 'Chiều nay chuồn chuồn bay đầy ngõ. Ông cụ đầu xóm bảo đêm thế nào cũng có mưa to.'
