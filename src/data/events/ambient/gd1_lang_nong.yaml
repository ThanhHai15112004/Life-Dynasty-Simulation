      - 'Chợ phiên họp dưới gốc gạo bên bến. Tiếng mặc cả, tiếng gà vịt kêu, tiếng rao bánh đúc lẫn vào nhau.'
      - 'Bạn đi chợ phiên chỉ để mua cân muối, về đến nhà tay đã xách thêm nải chuối với gói kẹo vừng.'
