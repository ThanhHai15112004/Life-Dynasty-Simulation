# [0] Nhật ký dòng đời: làng xã, tin thế giới, điềm báo (nguồn b, c, e — GDD 05 §12)
# Điềm báo phải "thật" (R1): gắn với thời tiết/được-mất mùa đã định đầu năm → người tinh ý đọc được thời cơ.
templates:
  # ── Làng xã ──
  - id: ba_ho_an_khao
    kind: nguoi_quanh
    tags: [lang_xa]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    roles: [{ id: ba_ho, from: village, village_role: ba_ho }]
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: lang
    short: 'xem nhà bá hộ ăn khao'
    variants:
      - 'Nhà {role.ba_ho.call} ăn khao linh đình, cả xóm kéo đến xem.'
      - '{role.ba_ho.call} dựng thêm dãy nhà ngói, thợ làm ròng rã cả tháng.'
  - id: ly_truong_dan_thue
    kind: nguoi_quanh
    tags: [lang_xa]
    months: [8, 9, 10]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    roles: [{ id: ly, from: village, village_role: ly_truong }]
    weight: 3
    cooldown_years: 2
    importance: 1
    icon: thue
    short: 'nghe ông lý nhắc thuế'
    variants:
      - '{role.ly.call} đi từng nhà dặn năm nay phải nộp thuế cho đủ.'
      - 'Mõ làng rao: {role.ly.call} cho gọi các suất đinh ra đình bàn việc thuế.'
  - id: hang_xom_cho_rau
    kind: nguoi_quanh
    tags: [lang_xa, quan_he]
    roles: [{ id: hx, from: village, village_role: hang_xom, condition: { var: self.opinion, op: '>', value: 10 } }]
    weight: 4
    cooldown_years: 2
    importance: 1
    tone: vui
    icon: lang
    short: '{role.hx.call} cho rổ rau'
    variants:
      - '{role.hx.call} sang cho nhà một rổ rau tươi mới hái.'
      - '{role.hx.call} biếu nhà bát canh nóng mới nấu.'
    effects: [{ type: opinion, role: hx, value: 2 }, { type: stress, value: -1 }]
  - id: hang_xom_cai_nhau_ga
    kind: nguoi_quanh
    tags: [lang_xa, quan_he]
    condition: { has_property: dan_ga }
    roles: [{ id: hx, from: village, village_role: hang_xom }]
    weight: 3
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: ga
    variants:
      - '{role.hx.call} sang cằn nhằn vì gà nhà bạn bới nát luống rau.'
      - 'Gà nhà bạn sang mổ {lex.food} phơi, {role.hx.call} chửi đổng cả buổi.'
    effects: [{ type: opinion, role: hx, value: -5 }, { type: stress, value: 1 }]
  - id: thay_lang_bat_mach
    kind: nguoi_quanh
    tags: [benh_tat]
    roles:
      - { id: thay, from: village, village_role: thay_lang }
      - { id: benh, from: family, relation: member, condition: { var: self.health, op: '<', value: 45 } }
    weight: 6
    cooldown_years: 1
    importance: 3
    icon: thuoc
    variants:
      - '{role.thay.call} ghé qua thăm khám, kê cho {role.benh.call} mấy phần thuốc.'
      - '{role.thay.call} xem bệnh cho {role.benh.call}, dặn nghỉ ngơi và kiêng gió.'
    effects: [{ type: health, who: benh, value: 3 }, { type: money, value: -0.3 }]
  - id: dinh_lang_hop
    kind: nguoi_quanh
    tags: [lang_xa]
    condition: { all: [{ var: player.age, op: '>=', value: 18 }, { var: world.civilization_id, op: '==', value: nho_giao }] }
    weight: 3
    cooldown_years: 2
    importance: 1
    icon: lang
    short: 'ra đình bàn việc làng'
    variants:
      - 'Bạn được gọi ra đình góp ý chuyện đắp lại bờ mương.'
      - 'Làng họp ở đình, bàn chuyện tu sửa ngôi chùa đầu xóm.'
  - id: hoi_lang_dau_xuan
    kind: chuyen_vat
    tags: [lang_xa]
    months: [1, 2]
    condition: { var: world.civilization_id, op: '==', value: nho_giao }
    weight: 6
    cooldown_years: 1
    importance: 1
    tone: vui
    icon: hoi
    short: 'đi hội làng đầu xuân'
    variants:
      - 'Làng mở hội đầu xuân, bạn chen chân xem đánh vật.'
      - 'Hội làng có đu tiên và kéo co, bạn chơi đến khàn cả giọng.'
    effects: [{ type: stress, value: -2 }]
  - id: tet_no_du
    kind: chuyen_vat
    tags: [gia_dinh]
    months: [1]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: household.food_months, op: '>=', value: 2 }, { not: { var: household.living_standard, op: '==', value: kho_cuc } }] }
    weight: 8
    cooldown_years: 1
    importance: 2
    tone: vui
    icon: tet
    short: 'ăn Tết đủ đầy'
    variants:
      - 'Tết đến, nhà gói được nồi bánh chưng, treo câu đối đỏ.'
      - 'Đêm giao thừa cả nhà ngồi canh nồi bánh, nghe pháo nổ xa xa.'
    effects: [{ type: stress, value: -2 }]
  - id: tet_ngheo
    kind: chuyen_vat
    tags: [gia_dinh]
    months: [1]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { any: [{ var: household.food_months, op: '<', value: 2 }, { var: household.living_standard, op: '==', value: kho_cuc }] }, { var: household.money, op: '<', value: 10 }] }
    weight: 8
    cooldown_years: 1
    importance: 3
    tone: buon
    icon: tet
    variants:
      - 'Tết nghèo, nhà chẳng có nổi nồi bánh chưng. Lũ trẻ nhìn sang nhà hàng xóm.'
      - 'Ba ngày Tết mà bữa cơm vẫn độn khoai, chỉ có nén hương là đủ.'
    effects: [{ type: stress, value: 2 }]
  - id: gat_thue_ba_ho
    kind: chuyen_vat
    tags: [lao_dong, ruong_dong]
    months: [5, 10]
    condition: { all: [{ var: player.age, op: '>=', value: 14 }, { var: household.money, op: '<', value: 3 }, { var: household.self_farms, op: '==', value: true }, { var: world.year, op: '<', value: 1945 }] }
    roles: [{ id: ba_ho, from: village, village_role: ba_ho }]
    weight: 5
    cooldown_years: 1
    importance: 2
    icon: cay
    short: 'đi gặt thuê kiếm thêm'
    variants:
      - 'Bạn đi gặt thuê cho nhà {role.ba_ho.call}, kiếm thêm được ít tiền.'
      - 'Xong ruộng nhà, bạn sang gánh {lex.crop} thuê cho {role.ba_ho.call}.'
    effects: [{ type: money, value: 0.6 }, { type: health, value: -1 }]

  # ── Tin thế giới vọng tới (tin đồn — R12) ──
  - id: don_kinh_thanh_co_bien
    kind: tin_the_gioi
    tags: [tin_don]
    condition: { all: [{ var: world.year, op: '<', value: 1945 }, { var: world.year, op: '>=', value: -500 }] }
    rumor: true
    weight: 2
    cooldown_years: 4
    importance: 2
    icon: tin_don
    variants:
      - 'Nghe đồn ở kinh đô vừa có biến, chẳng rõ thực hư.'
      - 'Người đi chợ về kể chốn quan trường đang lục đục.'
  - id: don_phia_bac_co_loan
    kind: tin_the_gioi
    tags: [tin_don]
    condition: { all: [{ var: world.year, op: '<', value: 1945 }, { var: world.year, op: '>=', value: -500 }] }
    rumor: true
    roles: [{ id: lai, from: village, village_role: lai_buon }]
    weight: 2
    cooldown_years: 4
    importance: 2
    icon: tin_don
    variants:
      - '{role.lai.call} kể vùng biên viễn phía bắc đang có loạn.'
      - '{role.lai.call} bảo đường buôn xa dạo này nhiều kẻ cướp.'
  - id: don_mo_khoa_thi
    kind: tin_the_gioi
    tags: [tin_don, hoc_hanh]
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    rumor: true
    weight: 2
    cooldown_years: 5
    importance: 2
    icon: sach
    variants:
      - 'Nghe nói triều đình sắp mở khoa thi, sĩ tử khắp nơi nô nức.'

  # ── Giá cả (báo cáo thật, nhuốm Thời cơ) ──
  - id: gia_thoc_len
    kind: bao_cao
    tags: [thoi_co, buon_ban]
    condition: { var: world.food_price, op: '>', value: 0.72 }
    weight: 5
    cooldown_years: 1
    importance: 3
    icon: tien
    variants:
      - 'Giá {lex.food} ngoài chợ đã lên {world.food_price} {lex.currency} một phần.'
      - 'Lương thực lên giá, ngoài chợ rao {world.food_price} {lex.currency} mà vẫn có người mua.'
  - id: gia_thoc_re
    kind: bao_cao
    tags: [thoi_co, buon_ban]
    condition: { var: world.food_price, op: '<', value: 0.42 }
    weight: 4
    cooldown_years: 1
    importance: 2
    icon: tien
    variants:
      - 'Lương thực ngoài chợ hạ giá mạnh, chỉ còn {world.food_price} {lex.currency} một phần.'
      - 'Thương lái ép giá thu mua, {lex.food} chỉ còn {world.food_price} {lex.currency}.'

  # ── Điềm báo (gieo mầm Thời cơ) ──
  - id: diem_bao_han
    kind: diem_bao
    tags: [thoi_co, ruong_dong]
    condition: { all: [{ var: world.weather, op: '==', value: han }, { var: household.self_farms, op: '==', value: true }] }
    weight: 6
    cooldown_years: 1
    importance: 3
    icon: nang
    variants:
      - 'Trời hạn sớm, đất nứt nẻ, giá {lex.food} bắt đầu nhích lên.'
      - 'Nắng như đổ lửa, mương nước cạn trơ đáy. Ai nấy đều lo cho vụ mùa tới.'
  - id: diem_bao_mua_thuan
    kind: diem_bao
    tags: [ruong_dong]
    months: [2, 3, 4, 7, 8]
    condition: { all: [{ var: world.weather, op: '==', value: mua }, { var: world.harvest_quality, op: '==', value: duoc_mua }, { var: household.self_farms, op: '==', value: true }] }
    weight: 5
    cooldown_years: 1
    importance: 2
    tone: vui
    icon: lua
    variants:
      - 'Mưa thuận gió hòa, mầm {lex.crop} lên xanh mướt, báo hiệu năm nay được mùa.'
      - 'Đồng {lex.crop} mơn mởn, đứng nhìn mà ấm lòng.'
  - id: diem_bao_chuot_dong
    kind: diem_bao
    tags: [ruong_dong]
    months: [3, 4, 8, 9]
    condition: { all: [{ var: world.harvest_quality, op: 'in', value: [kem, mat_mua] }, { var: household.self_farms, op: '==', value: true }] }
    weight: 4
    cooldown_years: 1
    importance: 3
    tone: buon
    icon: chuot
    variants:
      - 'Chuột đồng kéo về phá mùa màng, cả xóm phải đi đặt bẫy.'
      - 'Sâu bệnh loang khắp cánh đồng, lá {lex.crop} vàng úa từng mảng.'
  - id: diem_bao_nguoi_la
    kind: diem_bao
    tags: [tin_don]
    rumor: true
    weight: 1
    cooldown_years: 5
    importance: 2
    icon: tin_don
    variants:
      - 'Dạo này có người lạ mặt hay lảng vảng quanh làng lúc chập tối.'
  - id: mua_lon_tran_bo
    kind: diem_bao
    tags: [ruong_dong]
    months: [6, 7, 8]
    condition: { var: world.weather, op: '==', value: mua }
    weight: 3
    cooldown_years: 2
    importance: 2
    tone: buon
    icon: mua
    variants:
      - 'Mưa to mấy ngày liền, nước tràn bờ ruộng, đường làng lội bì bõm.'
    effects: [{ type: set_flag, flag: lu_lut, years: 0.15 }]
