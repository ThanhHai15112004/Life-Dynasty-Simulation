    weight: 3
    cooldown_years: 3
    importance: 1
    icon: sach
    variants:
      - 'Năm thi, sĩ tử các huyện xuống bến đón thuyền về trường thi. Người gánh lều chõng, người ôm tráp, ai cũng gầy gò.'
      - 'Một cậu sĩ tử nghèo xin ngủ nhờ dưới mái hiên nhà bạn chờ thuyền. Đêm ấy cậu thắp đèn đọc sách đến sáng.'

  - id: bs_linh_xuong_thuyen
    kind: tin_the_gioi
    tags: [quan_su]
    condition: { all: [{ var: world.settlement_type, op: '==', value: thi_tran_ben_song }, { var: world.military_alert, op: '!=', value: binh_yen }] }
    weight: 3
    cooldown_years: 3
    importance: 2
    icon: kiem
    short: 'lính xuống thuyền'
    variants:
      - 'Một toán lính từ dinh trấn xuống bến, trưng dụng mấy thuyền to chở lương. Các chủ thuyền mặt mày ủ dột.'
      - 'Lính thú xếp hàng xuống thuyền, giáo dựng như rừng tre. Mẹ già vợ trẻ đứng chật bậc bến tiễn đưa.'

  # ── Tin đồn Kinh thành và cửa biển ──
  - id: bs_don_kinh_xay_chua
    kind: tin_the_gioi
    tags: [tin_don, buon_ban]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 4
    importance: 2
    rumor: true
    icon: tin_don
    variants:
      - 'Người trên thuyền gỗ về kể: triều đình đang dựng ngôi chùa lớn ở Kinh, cần gỗ lim cả nghìn cây. Giá gỗ ở bến trên đã nhích.'
      - 'Đồn rằng nhà vua sai đúc quả chuông lớn, thu đồng khắp các lộ. Mấy nhà buôn đồng nát đang ráo riết gom hàng.'

  - id: bs_don_cua_bien_cuop
    kind: tin_the_gioi
    tags: [tin_don, nguy_hiem]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 4
    importance: 2
    rumor: true
    icon: tin_don
    variants:
      - 'Thuyền muối từ cửa biển về kể ngoài đó có bọn cướp biển rình ở các đảo nhỏ, chuyên chặn thuyền buôn lúc sẩm tối.'
      - 'Người ta đồn một thuyền buôn lớn bị cướp ở cửa sông, chủ thuyền bị bắt đòi chuộc. Thật hư chưa ai rõ.'

  - id: bs_don_thue_thuyen_moi
    kind: tin_the_gioi
    tags: [tin_don, kinh_te]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 4
    importance: 2
    rumor: true
    icon: tin_don
    variants:
      - 'Đồn rằng triều đình sắp đặt lệ thu thuế thuyền theo số khoang. Chủ thuyền nào cũng lo sẽ phải đóng gấp đôi.'
      - 'Có tin bộ Hộ sai người về kiểm sổ các bến. Mấy viên đề lại dạo này tự nhiên hiền hẳn.'

  - id: bs_don_vua_tuan_du
    kind: tin_the_gioi
    tags: [tin_don, le_hoi]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 2
    cooldown_years: 5
    importance: 2
    rumor: true
    icon: tin_don
    variants:
      - 'Đồn rằng thuyền rồng của nhà vua sắp đi tuần qua khúc sông này. Dinh trấn cho người sửa bậc bến, quét đường phố chợ.'
      - 'Người ta bảo năm ngoái thuyền ngự đi ngang bến trên, dân hai bờ quỳ lạy kín bãi. Năm nay ai cũng mong được thấy.'

  - id: bs_don_thuyen_chiem_dat
    kind: tin_the_gioi
    tags: [tin_don]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 2
    cooldown_years: 4
    importance: 2
    rumor: true
    icon: tin_don
    variants:
      - 'Đồn rằng có thuyền người Chiêm Thành bị bão dạt vào cửa biển, trên thuyền toàn ngà voi và trầm hương. Quan trấn đã sai lính ra giữ.'
      - 'Người cửa biển kể có chiếc thuyền lạ cột buồm ba tầng neo ngoài khơi mấy hôm rồi đi mất, chẳng ai biết từ đâu đến.'

  - id: bs_don_kinh_gao_dat
    kind: tin_the_gioi
    tags: [tin_don, kinh_te]
    condition: { all: [{ var: world.settlement_type, op: '==', value: thi_tran_ben_song }, { var: world.harvest_quality, op: in, value: [kem, mat_mua] }] }
    weight: 3
    cooldown_years: 3
    importance: 2
    rumor: true
    icon: tin_don
    variants:
      - 'Thuyền ở Kinh về kể gạo trên ấy đắt như vàng, quan phải mở kho bán rẻ cho dân. Lái buôn bến này đang rục rịch chở gạo lên.'
      - 'Đồn rằng các lộ phía nam mất mùa nặng, người đói kéo nhau ra Kinh. Giá gạo ở bến cũng theo đó mà lên.'

  - id: bs_don_mo_vang_mien_nguoc
    kind: tin_the_gioi
    tags: [tin_don, thoi_co]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 2
    cooldown_years: 5
    importance: 2
    rumor: true
    icon: tin_don
    variants:
      - 'Đồn rằng trên miền ngược có người đãi được vàng cám ở khe suối. Mấy anh phu thuyền bỏ việc rủ nhau đi tìm.'
      - 'Người miền ngược xuống chợ trả tiền bằng vàng vụn đựng trong ống trúc. Cả bến bàn tán suốt mấy hôm.'

  - id: bs_don_dinh_tran_mo_ben
    kind: tin_the_gioi
