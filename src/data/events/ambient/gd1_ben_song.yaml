    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 2
    cooldown_years: 4
    importance: 2
    rumor: true
    icon: tin_don
    variants:
      - 'Nghe nói dinh trấn sắp kè đá thêm một đoạn bến cho thuyền lớn đậu. Nhà nào có đất ven sông đều đang ngồi chờ giá.'
      - 'Đồn rằng nhà buôn muối lớn nhất bến vừa gả con gái làm vợ lẽ quan trấn. Từ nay muối nhà ấy chắc khỏi phải qua kho.'

