    weight: 2
    cooldown_years: 4
    importance: 1
    tone: an_ui
    icon: nguoi_la
    variants:
      - 'Một nhà sư hành cước từ phương xa ghé hiên xin bát nước. Ngài uống xong, chắp tay niệm Phật rồi đi tiếp về phía chùa bến.'
      - 'Nhà sư lạ ngồi nghỉ dưới mái hiên, kể chuyện chùa trên núi Tiên Du mây phủ quanh năm. Bạn nghe mà thấy lòng nhẹ đi.'
    effects: [{ type: stress, value: -1 }]

  - id: bs_nguoi_mu_hat_rong
    kind: nguoi_quanh
    tags: [lang_xa]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 2
    cooldown_years: 4
    importance: 1
    tone: buon
    icon: nguoi_la
    variants:
      - 'Một ông mù dắt đứa cháu nhỏ đi hát rong qua bến, cây nhị cũ kêu cò cử. Người đi chợ thả vào nón mấy đồng.'
      - 'Tiếng hát rong buồn buồn vẳng lên từ bậc bến, kể chuyện người chinh phu không về. Mấy bà hàng chè quệt nước mắt.'

  - id: bs_khach_buon_ngua
    kind: nguoi_quanh
    tags: [buon_ban]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 2
    cooldown_years: 4
    importance: 1
    icon: nguoi_la
    variants:
      - 'Mấy người buôn ngựa từ miền ngược xuống, dắt cả đàn ngựa thồ thấp lùn qua phố chợ. Ngựa hí vang cả bến.'
      - 'Khách buôn ngựa nói giọng lạ, mặc áo chàm, đổi ngựa lấy muối và vải. Bạn đứng xem họ mặc cả bằng ngón tay.'

  - id: bs_si_tu_tro_thuyen
    kind: nguoi_quanh
    tags: [hoc_hanh]
