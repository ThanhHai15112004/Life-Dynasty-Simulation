# [1] Nhật ký dòng đời: thị trấn bến sông và nhà buôn
# Nhịp chợ theo mùa và giá buôn (world.trade_index), thuyền bè, phố chợ, khách lạ, tin đồn Kinh thành và cửa biển,
# gia đình nhà buôn, hội đua thuyền, chùa bến sông. Tác động nhỏ ±1–3.
templates:
  # ── Nhịp chợ theo mùa và giá buôn ──
  - id: bs_cho_khai_hang_dau_nam
    kind: bao_cao
    tags: [buon_ban, le_hoi]
    months: [1, 2]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: world.settlement_type, op: '==', value: thi_tran_ben_song }] }
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: vui
    icon: tet
    short: 'khai hàng đầu năm'
    variants:
      - 'Mồng sáu Tết, nhà bạn mở sạp khai hàng. Người mua đầu tiên là một bà cụ vui tính, cả nhà mừng như bắt được vàng.'
      - 'Ngày khai chợ, bạn đặt đĩa trầu cau lên mặt sạp, bán món hàng đầu tiên với giá thấp cho lấy may.'
      - 'Chợ đầu năm còn thưa, người ta đi chợ lấy lộc nhiều hơn đi mua. Bạn cũng chẳng nài, chỉ cười chào từng người.'

  - id: bs_gia_len_thuyen_chen
    kind: bao_cao
    tags: [buon_ban, thoi_co]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: world.trade_index, op: '>=', value: 1.25 }] }
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: vui
    icon: tien
    short: 'giá buôn lên'
    variants:
      - 'Giá hàng trên bến lên từng phiên. Thuyền chen nhau cập bến, mái chèo va lách cách, chủ thuyền gọi nhau khản cả cổ.'
      - 'Năm nay buôn thuận. Hàng vừa dỡ khỏi thuyền đã có người đứng chờ mua, chẳng cần mặc cả.'
      - 'Kho nhà bạn vơi nhanh hơn mọi năm. Tối nào cũng phải ngồi gảy bàn tính đến canh hai.'
    effects: [{ type: skill_xp, skill: thuong_mai, value: 5 }]

  - id: bs_gia_xuong_ep_gia
    kind: bao_cao
    tags: [buon_ban, kinh_te]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: world.trade_index, op: '<', value: 0.85 }] }
    weight: 5
    cooldown_years: 2
    importance: 2
    tone: buon
    icon: tien
    short: 'lái buôn ép giá'
    variants:
      - 'Lái buôn đường xa trả giá như cắt cổ, biết thừa nhà bạn đang tồn hàng. Bạn nghiến răng bán một nửa.'
      - 'Bến vắng thuyền. Mấy bao hàng xếp trong kho đã bắt đầu có mùi ẩm.'
      - 'Chợ chiều, các sạp quanh bến dọn sớm. Ai cũng than năm nay buôn đâu lỗ đấy.'
    trait_reactions:
      kien_nhan: 'Bạn bảo người nhà cứ giữ hàng, sang mùa giá sẽ lên.'
      nong_nay: 'Bạn cáu với cả người nhà, rồi tối về ngồi thở dài.'
    effects: [{ type: stress, value: 1 }]

  - id: bs_cho_giap_hat_vang
    kind: tin_the_gioi
    tags: [kinh_te, lang_xa]
    months: [3, 4]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: buon
    icon: cho
    short: 'chợ giáp hạt vắng'
    variants:
      - 'Tháng ba giáp hạt, chợ bến thưa hẳn. Người ta mua gạo từng bơ, mua muối từng nhúm.'
      - 'Chợ giáp hạt, mấy bà hàng xén ngồi quạt ruồi suốt buổi. Chỉ hàng cám hàng sắn là còn người hỏi.'

  - id: bs_mua_nuoc_hang_ve
    kind: tin_the_gioi
    tags: [buon_ban]
    months: [7, 8]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: lu
    short: 'mùa nước hàng về nhiều'
    variants:
      - 'Mùa nước lớn, thuyền to từ miền xuôi lên được tận bến. Vải vóc, nồi niêu về nhiều, giá hạ hẳn.'
      - 'Nước sông lên ngập bậc bến thứ ba. Thuyền buôn đậu sát chân phố, khách bước thẳng từ mạn thuyền lên sạp.'

  - id: bs_phien_ram_dong
    kind: tin_the_gioi
    tags: [buon_ban, lang_xa]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: cho
    short: 'phiên chợ rằm'
    variants:
      - 'Phiên chợ rằm, người các làng ven sông gánh hàng ra từ lúc gà gáy. Đến trưa thì đường bến đặc người.'
      - 'Chợ phiên họp kín từ đầu dốc đến gốc đa. Tiếng rao, tiếng gà vịt, tiếng mặc cả lẫn vào nhau như nước sôi.'
      - 'Phiên chợ hôm nay có cả người miền ngược mang mật ong và nấm hương xuống bán. Ai cũng xúm lại xem.'

  - id: bs_hang_tet_chuan_bi
    kind: bao_cao
    tags: [buon_ban, le_hoi]
    months: [12]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: world.trade_index, op: between, value: [0.85, 1.15] }] }
    weight: 4
    cooldown_years: 2
    importance: 1
    icon: tet
    short: 'cất hàng Tết'
    variants:
      - 'Tháng chạp, nhà bạn cất thêm lá dong, giấy đỏ và mứt gừng về bày sạp. Chẳng biết năm nay Tết có đắt hàng không.'
      - 'Cả nhà xúm vào gói từng gói chè, buộc từng bó hương bán Tết. Mùi trầm bám vào áo suốt mấy ngày.'

  - id: bs_gia_muoi_nhich
    kind: bao_cao
    tags: [buon_ban, thoi_co]
    months: [9, 10, 11]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: world.trade_index, op: '>=', value: 1.1 }] }
    weight: 3
    cooldown_years: 3
    importance: 2
    tone: vui
    icon: tien
    short: 'muối lên giá mùa muối cà'
    variants:
      - 'Vào mùa muối cà muối dưa, nhà nào cũng cần muối. Giá muối trên bến nhích lên mỗi phiên một ít.'
      - 'Các bà các chị gánh chum đến sạp đong muối. Bạn đong không kịp tay, muối dính trắng cả cổ tay áo.'

  - id: bs_so_sach_cuoi_nam_lai
    kind: bao_cao
    tags: [buon_ban, gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [12]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: household.money, op: '>=', value: 12 }] }
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: vui
    icon: tien
    short: 'sổ cuối năm có lãi'
    variants:
      - 'Cuối năm ngồi tính sổ, trừ hết nợ nần lệ phí vẫn còn dư. Bạn gói riêng một ít tiền để dành cho chuyến hàng đầu xuân.'
      - 'Bàn tính lách cách đến khuya. Gạch xong dòng cuối, bạn thở ra một hơi dài nhẹ nhõm.'
    effects: [{ type: stress, value: -2 }]

  - id: bs_so_sach_cuoi_nam_lo
    kind: bao_cao
    tags: [buon_ban, no_nan]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [12]
    condition: { all: [{ var: household.career, op: '==', value: thuong_nhan }, { var: household.money, op: '<', value: 3 }] }
    weight: 4
    cooldown_years: 3
    importance: 2
    tone: buon
    icon: no
    short: 'sổ cuối năm thâm hụt'
    variants:
      - 'Cuối năm tính sổ, cột chi dài hơn cột thu. Bạn đếm đi đếm lại mấy xâu tiền, vẫn không đủ.'
      - 'Bạn hàng gửi người đến nhắc khoản nợ cũ. Bạn hẹn sau Tết, giọng nhỏ hơn mình muốn.'
    effects: [{ type: stress, value: 2 }]

  - id: bs_cho_he_vai_chin
    kind: tin_the_gioi
    tags: [buon_ban]
    months: [5, 6]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: cay
    short: 'mùa vải chín'
    variants:
      - 'Mùa vải chín, thuyền chở vải đỏ rực cả khoang cập bến. Cả phố chợ thơm mùi quả chín.'
      - 'Người làng trên gánh nhãn, gánh vải xuống bán. Vỏ vải vứt đầy bậc bến, lũ ruồi vo ve cả ngày.'

  - id: bs_lua_mua_ve_ben
    kind: tin_the_gioi
    tags: [buon_ban, kinh_te]
    months: [10, 11]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: cay_lua
    short: 'thóc mùa về bến'
    variants:
      - 'Lúa mùa gặt xong, thuyền thóc các làng ven sông lũ lượt chở về bến bán. Lái buôn đứng trên bờ, tay cầm đấu đong.'
      - 'Bến đầy những thuyền thóc chờ cân. Bụi trấu bay vàng cả một khúc sông.'

  # ── Thuyền bè ──
  - id: bs_thuyen_neo_dem
    kind: chuyen_vat
    tags: [lang_xa]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: an_ui
    icon: trang
    short: 'đèn thuyền đêm'
    variants:
      - 'Đêm, thuyền neo kín bến, đèn dầu trên mui lập lòe như đom đóm. Có tiếng ai hát ru con trên sông.'
      - 'Bạn ngồi ở bậc bến hóng mát. Nước vỗ mạn thuyền óc ách, xa xa có tiếng mái chèo khua.'
    effects: [{ type: stress, value: -1 }]

  - id: bs_phu_keo_thuyen_gio_bac
    kind: nguoi_quanh
    tags: [lao_dong]
    months: [11, 12, 1]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: buon
    icon: phu
    short: 'phu kéo thuyền ngược gió'
    variants:
      - 'Gió bấc thổi ngược, phu kéo thuyền cởi trần cúi rạp trên bãi cát, dây chão hằn đỏ vai.'
      - 'Một tốp phu kéo thuyền nghỉ chân dưới gốc đa, chia nhau nắm cơm nắm muối vừng.'

  - id: bs_thuyen_moi_ha_thuy
    kind: chuyen_vat
    tags: [lang_xa, le_hoi]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 4
    importance: 2
    tone: vui
    icon: hoi
    short: 'lễ hạ thủy thuyền mới'
    variants:
      - 'Nhà đóng thuyền đầu bến hạ thủy chiếc thuyền mới. Ông thợ cả vẽ đôi mắt lên mũi thuyền, khấn Hà Bá cho đi về bình yên.'
      - 'Cả bến ra xem đẩy thuyền mới xuống nước. Thuyền trượt trên cây lăn, đánh ùm một tiếng, lũ trẻ reo ầm.'

  - id: bs_thuyen_nha_xam_dau
    kind: chuyen_vat
    tags: [buon_ban, lao_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    months: [3, 4]
    condition: { var: household.career, op: '==', value: thuong_nhan }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: phu
    variants:
      - 'Mùa khô, bạn kéo thuyền nhà lên bãi, cùng thợ trét dầu rái, xảm lại các khe ván. Mùi dầu nồng cả tuần.'
      - 'Bạn lật ngửa thuyền phơi nắng, cạo hà bám dưới đáy. Ván đáy đã mỏng, chắc vài năm nữa phải thay.'
    effects: [{ type: skill_xp, skill: sinh_ton, value: 4 }]

  - id: bs_thuyen_dam_khuc_duoi
    kind: tin_the_gioi
    tags: [nguy_hiem, thien_tai]
    months: [6, 7, 8]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 2
    cooldown_years: 4
    importance: 2
    tone: buon
    icon: lu
    short: 'thuyền đắm khúc dưới'
    variants:
      - 'Một thuyền chở đá ong đắm ở khúc sông dưới trong cơn nước xoáy. Hai người chèo không ai tìm thấy.'
      - 'Thuyền gỗ lật ở bãi cát ngầm, người dân bến dưới vớt được mấy bao gạo trôi dạt. Chủ thuyền ngồi khóc trên bờ.'

  - id: bs_do_ngang_phien_cho
    kind: chuyen_vat
    tags: [lang_xa]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: lang
    variants:
      - 'Đò ngang phiên chợ chở quá đông, mạn thuyền chỉ cách mặt nước một gang tay. Ông lái đò quát mọi người ngồi im.'
      - 'Bạn đi đò sang bờ bên kia. Người đi chợ ôm gà, gánh rau chen chúc, con gà trống cứ chực bay xuống nước.'

  - id: bs_thuyen_chum_vai
    kind: chuyen_vat
    tags: [buon_ban]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 4
    importance: 1
    icon: chen_tra
    variants:
      - 'Thuyền chở chum vại từ làng gốm miền xuôi cập bến. Người ta gõ vào từng cái chum nghe tiếng, ngân thì mới mua.'
      - 'Một thuyền mành bán nồi đất, bát đàn ghé bến. Mẹ con nhà hàng xóm đứng chọn mãi được một cái niêu.'

  - id: bs_suong_mu_tren_ben
    kind: diem_bao
    tags: [lang_xa]
    condition: { all: [{ var: world.settlement_type, op: '==', value: thi_tran_ben_song }, { var: world.weather, op: '==', value: suong_mu }] }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: binh_yen
    short: 'sương mù phủ sông'
    variants:
      - 'Sương mù phủ kín mặt sông, đứng trên bến không thấy bờ bên kia. Thuyền gõ mạn cốc cốc để báo nhau.'
      - 'Sáng sương dày, thuyền nào cũng neo chờ nắng lên. Chợ bến mở muộn đến gần trưa.'

  # ── Phố chợ ──
  - id: bs_pho_lo_ren
    kind: chuyen_vat
    tags: [lang_xa]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 4
    importance: 1
    icon: kiem
    variants:
      - 'Tiếng búa lò rèn cuối phố đều đặn từ sáng đến tối. Người ta mang lưỡi cày, dao rựa đến đánh lại trước vụ.'
      - 'Lũ trẻ đứng ở cửa lò rèn xem thợ quai búa, tia lửa bắn ra sáng rực mà chẳng đứa nào chịu lùi.'

  - id: bs_quan_com_ben
    kind: nguoi_quanh
    tags: [lang_xa, lao_dong]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: lua
    variants:
      - 'Quán cơm đầu bến đông nghịt phu khuân vác. Bà chủ múc canh cua không kịp, một bát chia hai người.'
      - 'Bạn ghé quán nước đầu bến uống bát chè xanh. Người ta đang bàn chuyện giá gạo trên trấn.'

  - id: bs_tre_nhat_thoc_roi
    kind: nguoi_quanh
    tags: [lang_xa]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 4
    importance: 1
    tone: buon
    icon: tre_em
    variants:
      - 'Mấy đứa trẻ rách rưới lom khom nhặt từng hạt thóc rơi ở chỗ khuân vác. Một đứa bỏ cả vào vạt áo, mặt mừng rỡ.'
      - 'Đứa bé con nhà phu thuyền ngồi đợi cha ở bậc bến từ trưa đến tối, tay cầm củ khoai đã nguội.'

  - id: bs_hang_rong_dem
    kind: chuyen_vat
    tags: [lang_xa]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 1
    tone: vui
    icon: trang
    variants:
      - 'Tối, có bà hàng chè gánh qua ngõ rao lanh lảnh. Bạn mua một bát chè con ông, ngồi ăn ở bậc cửa.'
      - 'Ông bán bánh đúc gõ mõ đi dọc phố bến. Mùi tương bần thơm nức, ai đi qua cũng ngoái lại.'

  - id: bs_mo_cho_rao
    kind: nguoi_quanh
    tags: [lang_xa]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 3
    importance: 1
    icon: lang
    variants:
      - 'Mõ chợ đi dọc dãy sạp rao: "Ai nhặt được cái túi gấm thêu hoa sen thì đem trả, chủ nhà hậu tạ."'
      - 'Mõ chợ gõ ba hồi, rao lệnh dinh trấn cấm đổ rác xuống bến. Các bà hàng cá nhìn nhau cười.'

  - id: bs_cai_nhau_hang_ca
    kind: nguoi_quanh
    tags: [lang_xa]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 3
    cooldown_years: 4
    importance: 1
    tone: vui
    icon: ca
    variants:
      - 'Hai bà hàng cá cãi nhau vì một chỗ ngồi, chửi từ chuyện con cá đến chuyện ông bà ba đời. Cả chợ đứng xem.'
      - 'Bà hàng cá dỗi khách trả rẻ, ném con cá trở lại chậu. Con cá quẫy nước bắn ướt cả váy người mua.'

  - id: bs_thay_boi_dau_cho
    kind: nguoi_quanh
    tags: [tin_nguong]
    condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 2
    cooldown_years: 4
    importance: 1
    icon: giac_mo
    variants:
      - 'Ông thầy bói mù ngồi dưới gốc gạo đầu chợ, gieo quẻ cho một chị buôn thúng. Chị nghe xong, mặt tái đi.'
      - 'Thầy bói đầu chợ gọi với theo bạn: "Tướng này sau có của." Bạn cười, không dừng lại.'
    trait_reactions:
      mo_dao: 'Bạn quay lại, đặt mấy đồng vào cái mẹt trước mặt ông.'
      hoai_nghi: 'Bạn lẩm bẩm: của thì phải buôn mới có.'

  # ── Khách lạ ──
  - id: bs_su_hanh_cuoc_xin_nuoc
    kind: nguoi_quanh
    tags: [tin_nguong, quan_he]
