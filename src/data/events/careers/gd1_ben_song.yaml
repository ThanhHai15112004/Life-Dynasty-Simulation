          - { type: money, value: -4, ledger: su_kien }
          - { type: health, value: -3 }
          - { type: stress, value: 6 }
        success_result: ['Ba đêm chèo thuyền tắt đèn, nghe tiếng mõ tuần xa xa mà tim đập thình thịch. Sáng thứ tư, {role.lb.call} dúi vào tay bạn gói tiền.']
        failure_result: ['Đêm thứ hai, đuốc sai nha sáng rực đầu lạch. Bạn nhảy xuống sông lội vào bờ, mất cả tiền cọc lẫn đôi dép.']
      - id: mua_re
        text: 'Không chở, chỉ mua lại ít muối giá rẻ về bán'
        condition: { var: household.career, op: '==', value: thuong_nhan }
        chance: { base: 0.8, skill: muu_luoc, per_level: 0.02 }
        success:
          - { type: money, value: 3, ledger: buon_ban }
          - { type: opinion, role: lb, value: 3 }
        failure:
          - { type: money, value: -1, ledger: su_kien }
          - { type: wanted, value: 5 }
        success_result: ['Mấy thúng muối trắng hạt to, bạn trộn lẫn vào muối kho mà bán. Chẳng ai hỏi han gì.']
        failure_result: ['Sai nha khám sạp, thấy muối không có dấu kho. Bạn mất muối lại phải nộp phạt.']
      - id: tu_choi
        text: 'Lắc đầu, coi như chưa nghe gì'
        effects:
          - { type: opinion, role: lb, value: -5 }
