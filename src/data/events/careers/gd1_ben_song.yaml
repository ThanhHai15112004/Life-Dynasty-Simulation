        chance:
          base: 0.55
          skill: muu_luoc
          per_level: 0.04
          modifiers:
            - { condition: { var: world.patrol_level, op: '>=', value: 60 }, add: -0.2 }
            - { condition: { var: world.military_alert, op: '==', value: binh_yen }, add: 0.1 }
        success:
          - { type: money, value: 5, ledger: su_kien }
          - { type: opinion, role: lb, value: 10 }
        failure:
