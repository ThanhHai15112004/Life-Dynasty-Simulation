# [1] Sự kiện quyết định: nhà buôn và thị trấn bến sông (16 tuổi trở lên).
# Phần lớn gắn nghề nhà thuong_nhan; vài sự kiện thị trấn (cháy chợ, lũ, muối lậu, thuyền lạ) mở cho mọi nghề sống ở bến.
# Chuỗi: bs_chu_tin_ban_hang → bs_ban_hang_bao_dap · bs_cho_vay_nang_lai → bs_doi_no_chu_do
#        bs_len_nguoc_khoi_hanh → bs_len_nguoc_cho_nui → bs_len_nguoc_tro_ve
events:
  # ── Chuỗi chữ tín ──
  - id: bs_chu_tin_ban_hang
    title: Lời hẹn với bạn hàng miền xuôi
    tags: [buon_ban, quan_he, thoi_co]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: household.career, op: '==', value: thuong_nhan }
        - { var: world.trade_index, op: '>=', value: 1.1 }
        - { not: { has_flag: bs_giu_chu_tin } }
    roles:
      - { id: lb, from: village, village_role: lai_buon }
    weight: 5
    cooldown_years: 6
    tension: 4
    importance: 6
    icon: tien
    text:
      - 'Đầu năm bạn nhận tiền cọc của một bạn hàng miền xuôi, hẹn giao ba chục bao gạo nếp theo giá cũ. Nay giá gạo vọt lên. {role.lb.call} đến tận kho, trả gấp rưỡi nếu bạn bán lô ấy cho hắn.'
    options:
      - id: giu_loi
        text: 'Giao đủ hàng theo giá đã hẹn'
        trait_stress: { tham_lam: 4 }
        effects:
          - { type: money, value: 2, ledger: buon_ban }
          - { type: career_merit, value: 6 }
          - { type: opinion, role: lb, value: -5 }
          - { type: set_flag, flag: bs_giu_chu_tin, years: 10 }
          - { type: schedule_event, event: bs_ban_hang_bao_dap, months: 30, keep_roles: false }
        result: ['Thuyền bạn hàng nhận đủ ba chục bao, người lái cầm sổ cười mãi. {role.lb.call} bỏ về, lẩm bẩm "ngốc".']
      - id: ban_gia_cao
        text: 'Bán cho {role.lb.call}, trả lại tiền cọc kèm lời xin lỗi'
        trait_stress: { trung_thanh: 5 }
        effects:
          - { type: money, value: 6, ledger: buon_ban }
          - { type: opinion, role: lb, value: 8 }
          - { type: reputation, group: dan_lang, value: -4 }
          - { type: career_merit, value: -2 }
        result: ['Túi nặng thêm. Mấy tháng sau, thuyền miền xuôi cập bến nhưng không ghé kho nhà bạn nữa.']
      - id: chia_doi
        text: 'Giao một nửa, nửa kia bán giá mới, xin bạn hàng thông cảm'
        hint: 'Cần tài ăn nói'
        chance: { base: 0.45, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: money, value: 4, ledger: buon_ban }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
        failure:
          - { type: money, value: 3, ledger: buon_ban }
          - { type: reputation, group: dan_lang, value: -6 }
          - { type: stress, value: 3 }
        success_result: ['Bạn hàng nghe bạn kể giá trên bến, gật gù bảo "buôn bán ai cũng phải sống". Hai bên vẫn giữ mối.']
        failure_result: ['Bạn hàng không nói gì, chỉ ghi vào sổ một dòng. Chuyện nhà bạn "hẹn một đằng giao một nẻo" lan khắp bến xuôi.']

  - id: bs_ban_hang_bao_dap
    title: Bạn hàng cũ trả nghĩa
    tags: [buon_ban, quan_he, thoi_co]
    scheduled_only: true
    condition:
      all:
        - { var: household.career, op: '==', value: thuong_nhan }
        - { has_flag: bs_giu_chu_tin }
    weight: 1
    tension: 2
    importance: 7
    icon: tien
    text:
      - 'Thuyền của người bạn hàng miền xuôi năm nào lại cập bến. Ông mang theo một tin: muối ngoài cửa biển năm nay về ít, ai gom trước sẽ được giá. Ông muốn giao trước cho bạn cả thuyền, sang mùa mới lấy tiền.'
    options:
      - id: nhan_moi
        text: 'Nhận cả thuyền muối, chịu tiền sau'
        hint: 'Tin ấy đúng thì lời to, sai thì phải bù'
        chance: { base: 0.6, skill: thuong_mai, per_level: 0.04 }
        effects:
          - { type: clear_flag, flag: bs_giu_chu_tin }
        success:
          - { type: money, value: 10, ledger: buon_ban }
          - { type: career_merit, value: 12 }
        failure:
          - { type: money, value: -3, ledger: su_kien }
          - { type: stress, value: 4 }
        success_result: ['Đúng như lời ông nói, muối khan cả vùng. Bạn trả đủ tiền mà vẫn còn dư một khoản dày.']
        failure_result: ['Thuyền muối nhà quan về sớm hơn dự liệu, giá rớt. Bạn bù tiền cho bạn hàng, ông vỗ vai bảo "lần sau".']
      - id: ket_nghia
        text: 'Làm mâm rượu kết nghĩa, hẹn làm ăn lâu dài'
        effects:
          - { type: clear_flag, flag: bs_giu_chu_tin }
          - { type: money, value: -1, ledger: su_kien }
          - { type: set_flag, flag: bs_ban_hang_mien_xuoi, years: 15, label: 'Có bạn hàng tin cậy ở miền xuôi' }
          - { type: modifier, target: xp.thuong_mai, value: 1.1, op: mul, months: 60, label: 'Mối hàng miền xuôi' }
          - { type: stress, value: -3 }
        result: ['Hai người rót chén rượu trước bàn thờ thổ công. Từ đó mỗi mùa nước, thuyền miền xuôi đều ghé kho nhà bạn trước tiên.']
      - id: nhuong_hoi
        text: 'Cảm ơn ông, đem mối ấy chia cho các nhà buôn trên bến'
        trait_stress: { tham_vong: 3 }
        effects:
          - { type: clear_flag, flag: bs_giu_chu_tin }
          - { type: reputation, group: dan_lang, value: 8 }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: career_merit, value: 4 }
        result: ['Mỗi nhà một ít, ai cũng có phần. Phiên họp phường sau, các chủ thuyền mời bạn ngồi mâm trên.']

  # ── Hàng gian, cân non ──
  - id: bs_hang_gia_moi_nhap
    title: Kiện lụa pha sợi gai
    tags: [buon_ban, nghe_nghiep]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition: { var: household.career, op: '==', value: thuong_nhan }
    weight: 5
    cooldown_years: 5
    tension: 4
    importance: 5
    icon: tien
    text:
      - 'Bạn tháo kiện lụa mới nhập từ thuyền phương Bắc. Sờ kỹ mới thấy mặt trong dệt pha sợi gai, hồ bột cho bóng. Người bán đã nhổ neo từ hôm kia. Nhìn qua thì chẳng mấy ai phân biệt được.'
    options:
      - id: ban_nhu_that
        text: 'Cứ bán như lụa thật, ai biết thì đành chịu'
        trait_stress: { nhan_tu: 4 }
        chance: { base: 0.55, skill: muu_luoc, per_level: 0.04 }
        success:
          - { type: money, value: 5, ledger: buon_ban }
        failure:
          - { type: money, value: 1, ledger: buon_ban }
          - { type: reputation, group: dan_lang, value: -10 }
          - { type: career_merit, value: -6 }
        success_result: ['Lụa bán hết trước Tết. Đêm ấy bạn đếm tiền, đếm hai lần vẫn thấy thiêu thiếu một thứ gì.']
        failure_result: ['Một bà khách giặt thử, vải co rúm như lá héo. Bà mang ra giữa chợ giơ lên cho cả bến xem.']
      - id: ban_dung_gia
        text: 'Nói thật là vải pha, hạ giá mà bán'
        effects:
          - { type: money, value: -2, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: 4 }
          - { type: career_merit, value: 3 }
          - { type: skill_xp, skill: thuong_mai, value: 12 }
        result: ['Lỗ một ít. Các bà quen bảo nhau "sạp ấy nói thật", rồi rủ nhau sang mua thêm mấy thứ khác.']
      - id: duoi_theo
        text: 'Nhờ thuyền xuôi chuyển thư đến bến dưới, đòi người bán trả tiền'
        chance: { base: 0.3, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: money, value: 1, ledger: su_kien }
          - { type: career_merit, value: 5 }
        failure:
          - { type: money, value: -4, ledger: su_kien }
          - { type: stress, value: 4 }
        success_result: ['Người bán bị phường bến dưới giữ thuyền lại, đành nhờ người gửi trả tiền kèm lời xin lỗi.']
        failure_result: ['Thư đi mấy tháng không có hồi âm. Kiện lụa vẫn nằm trong góc kho, bụi phủ một lớp.']

  - id: bs_can_non_sap_ben
    title: Quả cân non ở sạp bên
    tags: [buon_ban, lang_xa]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition: { var: household.career, op: '==', value: thuong_nhan }
    roles:
      - { id: ly, from: village, village_role: ly_truong }
    weight: 5
    cooldown_years: 5
    tension: 4
    importance: 5
    icon: cho
    text:
      - 'Mấy tháng nay khách bỏ sạp nhà bạn sang sạp bên cạnh, vì bên ấy rẻ hơn một đồng. Bạn nhờ người mua hộ một gói muối bên ấy về cân lại: thiếu gần hai lạng. Người buôn trên bến ai cũng ngờ ngợ, nhưng chưa ai nói ra.'
    options:
      - id: to_giac
        text: 'Mang gói muối lên trình {role.ly.call}'
        chance: { base: 0.5, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: reputation, group: dan_lang, value: 6 }
          - { type: career_merit, value: 6 }
          - { type: money, value: 2, ledger: buon_ban }
        failure:
          - { type: opinion, role: ly, value: -5 }
          - { type: stress, value: 5 }
        success_result: ['{role.ly.call} cho người đến thu quả cân, đập vỡ giữa chợ. Khách lục tục quay về sạp nhà bạn.']
        failure_result: ['{role.ly.call} xua tay bảo chuyện vặt ngoài chợ. Hôm sau, bạn thấy nhà bên mang lễ vào nhà ông lý.']
      - id: mai_can
        text: 'Mình cũng mài bớt quả cân cho bằng người ta'
        trait_stress: { nhan_tu: 5 }
        chance: { base: 0.65, skill: muu_luoc, per_level: 0.03 }
        success:
          - { type: money, value: 4, ledger: buon_ban }
        failure:
          - { type: money, value: -2, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: -10 }
          - { type: career_merit, value: -5 }
        success_result: ['Khách quay lại. Mỗi tối dọn sạp, bạn tránh nhìn quả cân.']
        failure_result: ['Một ông lão mang cân riêng ra chợ cân lại, rồi đứng giữa bến chửi cả hai nhà.']
      - id: treo_bang_can_du
        text: 'Treo bảng "cân đủ, thiếu đền gấp đôi", mời khách tự cân lại'
        effects:
          - { type: money, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: thuong_mai, value: 15 }
          - { type: reputation, group: dan_lang, value: 5 }
          - { type: career_merit, value: 4 }
        result: ['Ban đầu chẳng ai để ý. Rồi một bà khách cân thử, gật đầu, kể với cả xóm. Sạp bên lặng lẽ thay quả cân mới.']

  # ── Thuế bến, sai nha ──
  - id: bs_sai_nha_do_thuyen
    title: Sai nha đo thuyền tính thuế bến
    tags: [buon_ban, kinh_te, quan_he]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: household.career, op: '==', value: thuong_nhan }
        - { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 5
    cooldown_years: 4
    tension: 5
    importance: 5
    icon: thue
    text:
      - 'Sai nha trên trấn xuống bến đo lại thuyền buôn để tính thuế bến bãi. Đến thuyền nhà bạn, cây thước tre cứ dài thêm một gang, thuế vì thế tăng gần gấp đôi. Viên đề lại đứng nhai trầu, nhìn sang chỗ khác.'
    options:
      - id: lot_tay
        text: 'Dúi cho viên đề lại 2 quan "tiền nước"'
        condition: { var: household.money, op: '>=', value: 2 }
        effects:
          - { type: money, value: -2, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
          - { type: stress, value: 1 }
        result: ['Cây thước bỗng ngắn lại. Viên đề lại ghi sổ, gật đầu rất hiền.']
      - id: nop_du
        text: 'Chịu nộp theo thước đo của họ'
        effects:
          - { type: money, value: -4, ledger: su_kien }
          - { type: stress, value: 2 }
        result: ['Bạn đếm tiền nộp, không cãi một lời. Đêm về nằm tính lại sổ, mất ngủ đến canh ba.']
      - id: dong_don
        text: 'Cùng các chủ thuyền làm đơn kêu lên quan trấn'
        hint: 'Biết chữ và quen quan thì dễ thành'
        chance:
          base: 0.4
          skill: ngoai_giao
          per_level: 0.05
          modifiers:
            - { condition: { var: player.skill.hoc_van, op: '>=', value: 3 }, add: 0.1 }
            - { condition: { has_flag: bs_than_quan_tran }, add: 0.25 }
        success:
          - { type: reputation, group: dan_lang, value: 8 }
          - { type: career_merit, value: 8 }
          - { type: skill_xp, skill: quan_tri, value: 12 }
        failure:
          - { type: money, value: -5, ledger: su_kien }
          - { type: stress, value: 6 }
        success_result: ['Quan trấn cho đo lại bằng thước của dinh. Viên đề lại bị phạt đòn, các chủ thuyền mời bạn chén rượu.']
        failure_result: ['Đơn chưa đến tay quan đã quay về tay viên đề lại. Thuyền nhà bạn bị đo lại lần nữa, lần này dài thêm hai gang.']

  - id: bs_tranh_cho_sap
    title: Tranh chỗ sạp phiên chợ Tết
    tags: [buon_ban, lang_xa, quan_he]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [11, 12, 1]
    condition: { var: household.career, op: '==', value: thuong_nhan }
    weight: 5
    cooldown_years: 5
    tension: 4
    importance: 5
    icon: cho
    text:
      - 'Chỗ sạp đầu dốc bến, nhà bạn bày hàng đã mấy năm, sáng nay bị một nhà buôn mới dọn về chiếm mất. Họ bảo đã nộp tiền cho mõ chợ. Phiên chợ Tết chỉ còn mươi ngày.'
    options:
      - id: dep_hang_ho
        text: 'Gọi người nhà ra dẹp hàng họ sang bên'
        trait_stress: { than_trong: 4 }
        chance: { base: 0.5, skill: quan_su, per_level: 0.04 }
        success:
          - { type: money, value: 3, ledger: buon_ban }
          - { type: reputation, group: dan_lang, value: -3 }
          - { type: stress, value: 2 }
        failure:
          - { type: health, value: -4 }
          - { type: money, value: -2, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: -6 }
        success_result: ['Nhà kia đông mồm nhưng ít người, đành dọn vào cuối dãy. Phiên Tết năm ấy bạn bán đắt, chỉ có điều chẳng ai chào nhau nữa.']
        failure_result: ['Hai bên xô xát giữa chợ, gánh hàng đổ tung. Bạn sưng một bên mắt, mõ chợ phạt cả hai nhà.']
      - id: lo_mo_cho
        text: 'Biếu thêm mõ chợ để lấy lại chỗ cũ'
        condition: { var: household.money, op: '>=', value: 2 }
        chance: { base: 0.7, skill: thuong_mai, per_level: 0.03 }
        effects:
          - { type: money, value: -2, ledger: su_kien }
        success:
          - { type: money, value: 5, ledger: buon_ban }
        failure:
          - { type: money, value: 1, ledger: buon_ban }
          - { type: stress, value: 3 }
        success_result: ['Mõ chợ đổi ý ngay trong buổi. Sạp nhà bạn lại đứng đầu dốc, khách Tết chen nhau mua.']
        failure_result: ['Mõ chợ nhận tiền cả hai nhà, rồi chia đôi chỗ sạp. Phiên Tết bán chẳng được bao nhiêu.']
      - id: nhuong_cho
        text: 'Nhường, dọn vào giữa chợ, mời nhà kia chén trà làm quen'
        trait_stress: { nong_nay: 4, tham_vong: 3 }
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
          - { type: reputation, group: dan_lang, value: 3 }
          - { type: stress, value: -1 }
        result: ['Chủ nhà kia ngượng, sau Tết mang sang biếu một cân chè. Hai nhà thỉnh thoảng gửi khách cho nhau.']

  # ── Thời cơ, buôn lậu ──
  - id: bs_thuyen_buom_la
    title: Thuyền buồm lạ cập bến
    tags: [buon_ban, thoi_co, tin_don]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition:
      any:
        - { var: household.career, op: '==', value: thuong_nhan }
        - { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
    weight: 4
    cooldown_years: 6
    tension: 5
    importance: 6
    icon: nguoi_la
    text:
      - 'Một chiếc thuyền buồm cánh dơi của khách buôn phương Bắc cập bến, chở sứ men xanh, thuốc bắc và giấy hoa tiên. Họ nói tiếng lơ lớ, muốn đổi lấy quế, sừng và tơ sống. Quan trấn chưa cho phép mua bán, nhưng đêm nào cũng có người bến lén xuống thuyền xem hàng.'
    options:
      - id: doi_hang_dem
        text: 'Xuống thuyền đổi hàng ngay trong đêm (4 quan)'
        condition: { var: household.money, op: '>=', value: 4 }
        hint: 'Mắt hàng tốt thì lời; sai nha tuần gắt thì dễ bị bắt'
        chance:
          base: 0.5
          skill: thuong_mai
          per_level: 0.05
          modifiers:
            - { condition: { var: world.patrol_level, op: '>=', value: 60 }, add: -0.15 }
        effects:
          - { type: money, value: -4, ledger: su_kien }
        success:
          - { type: money, value: 10, ledger: buon_ban }
          - { type: career_merit, value: 8 }
          - { type: skill_xp, skill: thuong_mai, value: 15 }
        failure:
          - { type: money, value: 1, ledger: buon_ban }
          - { type: wanted, value: 5 }
          - { type: stress, value: 5 }
        success_result: ['Mấy chồng bát sứ men xanh bày lên sạp chưa đầy tuần đã có nhà phú hộ trên trấn đến mua cả.']
        failure_result: ['Sai nha soi đuốc ra bến đúng lúc bạn khuân hàng lên. Phải vứt xuống sông quá nửa mới thoát.']
      - id: dat_moi
        text: 'Làm người dắt mối giữa khách lạ và các nhà buôn bến'
