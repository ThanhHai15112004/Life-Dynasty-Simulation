# [1] Sự kiện giao thoa giữa các con đường đời (Crossover Events — GDD 04 & 05)
events:
  - id: giao_thoa_chan_duong_deo_vang
    title: Tiếng hú nơi đèo vắng
    tags: [giao_thoa, nguy_hiem, kinh_te]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.career, op: 'in', value: [thuong_nhan, nong_dan] }
        - { var: household.money, op: '>=', value: 4 }
    weight: 5
    weight_modifiers:
      - { condition: { var: world.patrol_level, op: '<', value: 30 }, factor: 1.8 }
    cooldown_years: 4
    tension: 7
    importance: 6
    icon: nguy_hiem
    text:
      - 'Khi xe hàng vừa qua khúc quanh rợp bóng cây cổ thụ, một tiếng còi trúc vang lên. Năm sáu gã thảo khấu tay lăm lăm mã tấu từ sườn đồi nhảy xuống chặn ngang đường!'
    options:
      - id: nop_tien_mai_lo
        text: 'Chắp tay nói lời hòa nhã, nộp 3 quan tiền mãi lộ'
        condition: { var: household.money, op: '>=', value: 3 }
        effects:
          - { type: money, value: -3, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        result:
          - 'Tên đầu mục tung hứng túi tiền gật đầu hài lòng, còn cắm cho bạn một chiếc lông gà làm tín hiệu miễn chặn đường lượt về.'
      - id: thuong_luong_lam_an
        text: 'Gợi ý bán muối và thuốc trị thương cho sơn trại với giá hữu nghị'
        hint: 'Biến nguy thành cơ nếu giỏi Thương mại và Mưu lược'
        chance:
          base: 0.45
          skill: thuong_mai
          per_level: 0.06
        success:
          - { type: money, value: 5, ledger: luong_nghe }
          - { type: career_merit, value: 12 }
          - { type: skill_xp, skill: muu_luoc, value: 15 }
        failure:
          - { type: money, value: -4, ledger: su_kien }
          - { type: stress, value: 6 }
        success_result:
          - 'Đám sơn tặc đang thiếu muối và vải vóc nên mừng rỡ mua sạch xe hàng bằng bạc nén!'
        failure_result:
          - 'Tên đầu mục nghi bạn dò la tin tức cho quan phủ nên thu mất bốn quan tiền rồi đuổi đi.'
      - id: danh_duong_mau_thoat
        text: 'Rút gậy gỗ hộ thân, thúc trâu xe lao thẳng qua vòng vây'
        chance:
          base: 0.4
          skill: quan_su
          per_level: 0.06
        success:
          - { type: skill_xp, skill: quan_su, value: 18 }
          - { type: reputation, group: dan_lang, value: 4 }
        failure:
          - { type: health, value: -12 }
          - { type: money, value: -4, ledger: su_kien }
        success_result:
          - 'Đường gậy dũng mãnh của bạn quật ngã tên chặn đầu, chiếc xe lao vút xuống chân đèo trước khi chúng kịp đuổi theo!'
        failure_result:
          - 'Bánh xe vướng rễ cây lật nghiêng, bạn bị đánh bầm dập và mất một túi tiền.'

  - id: giao_thoa_gap_nguoi_cu_noi_tram_gac
    title: Ánh mắt quen nơi trạm gác tuần tiễu
    tags: [giao_thoa, quan_he, quan_su]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.career, op: 'in', value: [linh, thao_khau] }
    roles:
      - { id: hx, from: village, village_role: hang_xom }
    weight: 5
    cooldown_years: 4
    tension: 6
    importance: 6
    icon: lang
    text:
      - 'Giữa lúc toán tuần tiễu đang xét hỏi người qua lại ở bến đò, bạn sững người khi nhận ra người đứng đối diện trong đám đông có dáng dấp rất giống người quen ở làng quê năm nào, nhưng nay lại đang mang theo kiện hàng lậu.'
    options:
      - id: lam_ngo_cho_qua
        text: 'Giả vờ nhìn đi chỗ khác, khẽ ra hiệu cho người ấy lách qua cổng phụ'
        trait_stress: { tan_nhan: 4 }
        effects:
          - { type: opinion, role: hx, value: 18 }
          - { type: favor, role: hx, value: 1 }
          - { type: skill_xp, skill: muu_luoc, value: 10 }
        result:
          - 'Một cái gật đầu kín đáo giữa chốn đông người. Người làng giữ được cơ nghiệp, và bạn có thêm một mối ân tình sâu nặng.'
      - id: bat_giu_lap_cong
        text: 'Theo đúng phép công hoặc quy tắc giang hồ mà thu giữ kiện hàng'
        trait_stress: { nhan_tu: 5, trong_gia_dinh: 4 }
        effects:
          - { type: career_merit, value: 15 }
          - { type: money, value: 3, ledger: luong_nghe }
          - { type: opinion, role: hx, value: -20 }
          - { type: reputation, group: dan_lang, value: -5 }
        result:
          - 'Bạn thu được kiện hàng và được cấp trên khen thưởng, nhưng tiếng thở dài oán trách của người đồng hương cứ ám ảnh mãi.'
      - id: dung_ra_bao_lanh
        text: 'Bỏ 2 quan tiền riêng ra nộp phạt thay để giải vây êm đẹp'
        condition: { var: household.money, op: '>=', value: 2 }
        effects:
          - { type: money, value: -2, ledger: su_kien }
          - { type: career_merit, value: 6 }
          - { type: opinion, role: hx, value: 25 }
          - { type: favor, role: hx, value: 2 }
          - { type: reputation, group: dan_lang, value: 6 }
        result:
          - 'Vừa vẹn phép công vừa trọn nghĩa tình làng xóm, ai chứng kiến cũng phải nể phục cách xử trí của bạn.'
