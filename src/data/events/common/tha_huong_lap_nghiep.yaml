# [1.8] Chuỗi sự kiện Đi làm ăn xa / Tha hương lập nghiệp (học theo nhân quả 1in8b)
events:
  - id: theo_doan_nguoi_di_xa
    title: Đoàn người rủ đi làm ăn phương xa
    text:
      - 'Một đoàn thương buôn và phu mỏ đi ngang vùng đang tuyển người trai tráng theo thuyền vào phương Nam và lên vùng mỏ biên viễn. Đi xa vất vả, biền biệt mấy năm mới về, nhưng tiền công trả cao gấp nhiều lần ở quê.'
    tags: [buoc_ngoat, co_hoi]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition:
      all:
        - { not: { has_flag: di_lam_an_xa } }
        - { var: player.health, op: '>=', value: 55 }
    weight: 9
    cooldown_years: 5
    importance: 7
    icon: thuyen
    options:
      - id: ky_giao_keo_di_xa
        text: Ký giao kèo theo đoàn đi làm ăn xa vài năm tích cóp vốn liếng
        trait_stress: { trong_gia_dinh: 6, an_phan: 5 }
        effects:
          - { type: money, value: 5 }
          - { type: set_flag, flag: di_lam_an_xa, years: 3, label: 'Đang đi làm ăn phương xa' }
          - { type: skill_xp, skill: sinh_ton, value: 20 }
          - { type: schedule_event, event: thu_nha_tu_phuong_xa, months: 6, keep_roles: false }
        result:
          - 'Bạn ngoái nhìn mái nhà lần cuối trong sương sớm rồi bước lên thuyền cùng đoàn người tha hương.'
      - id: o_nha_cham_lo_gia_dinh
        text: Không đành lòng rời xa gia đình, ở lại quê nhà làm lụng
        effects:
          - { type: stress, value: -2 }
          - { type: food, value: 5 }
        result:
          - 'Bạn chọn sự bình yên bên người thân thay vì đánh đổi những năm tháng phiêu bạt.'

  - id: thu_nha_tu_phuong_xa
    title: Cánh thư nhà nơi đất khách
    text:
      - 'Sau nửa năm đổ mồ hôi nơi đất khách quê người, bạn cầm trên tay túi tiền công vừa lĩnh cùng bức thư nhắn hỏi thăm của người nhà gửi theo thuyền buôn.'
    tags: [gia_dinh, buon_ban]
    scheduled_only: true
    weight: 10
    importance: 6
    icon: thu
    options:
      - id: gui_phan_lon_tien_ve_nha
        text: Gửi phần lớn tiền công về phụ giúp gia đình, chỉ giữ lại chút ít phòng thân
        effects:
          - { type: money, value: 8 }
          - { type: filial_piety, value: 6 }
          - { type: stress, value: -4 }
          - { type: schedule_event, event: ngay_tro_ve_sau_nam_thang, months: 10, keep_roles: false }
        result:
          - 'Khoản tiền bạn gửi về giúp gia đình ở quê trang trải nợ nần và sửa sang lại mái nhà.'
      - id: gom_von_mua_hang_buon_chuyen
        text: Giữ tiền gom mua đặc sản địa phương chờ ngày mang về bán kiếm lời gấp đôi
        chance:
          base: 0.65
          skill: thuong_mai
          per_level: 0.06
        success:
          - { type: money, value: 15 }
          - { type: skill_xp, skill: thuong_mai, value: 30 }
          - { type: schedule_event, event: ngay_tro_ve_sau_nam_thang, months: 10, keep_roles: false }
        failure:
          - { type: money, value: 2 }
          - { type: stress, value: 6 }
          - { type: schedule_event, event: ngay_tro_ve_sau_nam_thang, months: 10, keep_roles: false }
        success_result:
          - 'Mẻ hàng trầm hương và vải quý bạn gom được tăng giá mạnh khi thuyền về xuôi.'
        failure_result:
          - 'Mưa ẩm làm hỏng một phần kiện hàng, may mà vẫn giữ lại được chút tiền công gốc.'

  - id: tai_nan_noi_dat_khach
    title: Hiểm nguy nơi công trường xa xứ
    text:
      - 'Một trận mưa bão lớn bất ngờ ập xuống khu lán trại nơi đất khách khiến hầm mỏ và kho hàng có nguy cơ sạt lở.'
    tags: [tai_hoa, co_hoi]
    condition:
      all:
        - { has_flag: di_lam_an_xa }
    weight: 8
    cooldown_years: 3
    importance: 6
    icon: mua
    options:
      - id: xong_vao_cuu_anh_em_va_kho
        text: Dẫn đầu anh em đồng hương chằng chống kho hàng và đưa người bị kẹt ra ngoài
        chance:
          base: 0.68
          skill: sinh_ton
          per_level: 0.05
        success:
          - { type: money, value: 9 }
          - { type: reputation, group: dan_lang, value: 8 }
          - { type: skill_xp, skill: quan_su, value: 20 }
        failure:
          - { type: money, value: 3 }
          - { type: health, value: -8 }
        success_result:
          - 'Chủ đoàn cảm kích trước sự dũng cảm của bạn, thưởng hậu và giao quyền trông coi cả đội.'
        failure_result:
          - 'Bạn cứu được mọi người nhưng bị gỗ va trúng vai, phải nằm nghỉ mất nửa tháng.'
      - id: tim_cho_tru_an_an_toan
        text: Nhanh chóng thu gom đồ đạc cá nhân rút lên gò cao lánh nạn
        effects:
          - { type: stress, value: 2 }
        result:
          - 'Bạn giữ được an toàn cho bản thân qua cơn giông bão nơi đất khách.'

  - id: ngay_tro_ve_sau_nam_thang
    title: Ngày trở về sau tháng năm bôn ba
    text:
      - 'Chuyến đi làm ăn xa khép lại. Bước chân về tới đầu làng với vốn liếng và kinh nghiệm dày dặn sau chuỗi ngày tha hương, cả nhà ùa ra đón bạn trong niềm vui đoàn tụ.'
    tags: [gia_dinh, buoc_ngoat]
    scheduled_only: true
    weight: 10
    importance: 7
    icon: gia_dinh
    options:
      - id: dem_von_mua_them_ruong_vuon
        text: Đem tiền tích cóp dựng lại cơ ngơi và bồi đắp gia sản ở quê nhà
        effects:
          - { type: clear_flag, flag: di_lam_an_xa }
          - { type: money, value: 10 }
          - { type: stress, value: -8 }
          - { type: reputation, group: dan_lang, value: 6 }
        result:
          - 'Những giọt mồ hôi nơi xứ người đã hóa thành lưng vốn vững chắc cho gia đình.'
      - id: dung_kinh_nghiem_mo_duong_buon
        text: Dùng mối quen biết từ chuyến đi xa để chuyển hẳn sang nghề buôn bán
        effects:
          - { type: clear_flag, flag: di_lam_an_xa }
          - { type: set_career, career: thuong_nhan }
          - { type: money, value: 7 }
          - { type: skill_xp, skill: thuong_mai, value: 30 }
        result:
          - 'Bạn trở thành người kết nối nguồn hàng giữa quê nhà và những vùng đất từng đi qua.'

