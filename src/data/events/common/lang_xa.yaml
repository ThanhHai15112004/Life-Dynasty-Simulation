# [0] Sự kiện quyết định — làng xã, gia đình, thiên tai, sức khỏe
events:
  - id: lu_ngap_ruong
    title: Nước lên
    tags: [ruong_dong, thien_tai, nguy_hiem]
    months: [6, 7, 8]
    condition: { all: [{ var: world.weather, op: '==', value: mua }, { var: household.farmland, op: '>=', value: 1 }] }
    weight: 5
    weight_modifiers:
      - { condition: { var: world.harvest_quality, op: 'in', value: [kem, mat_mua] }, factor: 2 }
    cooldown_years: 3
    tension: 7
    importance: 7
    icon: lu
    text:
      - 'Mưa ba ngày ba đêm không ngớt. Nước sông dâng sát mặt đê, ruộng thấp đã bắt đầu ngập. Lúa sắp trổ đòng.'
    options:
      - id: dap_bo
        text: 'Đội mưa ra đắp bờ cứu lúa'
        hint: 'Cần sức vóc, rủi ro cảm lạnh'
        chance: { base: 0.45, skill: sinh_ton, per_level: 0.03 }
        effects: [{ type: health, value: -6 }]
        success:
          - { type: modifier, target: harvest.yield, value: 0.95, op: mul, months: 4, label: 'Ruộng ngập nhẹ' }
        failure:
          - { type: modifier, target: harvest.yield, value: 0.7, op: mul, months: 4, label: 'Lúa ngập úng' }
          - { type: set_flag, flag: lu_lut, years: 0.25 }
        success_result: ['Bờ giữ được. Sáng ra nước rút, lúa vẫn đứng.']
        failure_result: ['Nước phá bờ trong đêm. Bạn đứng nhìn cả thửa ruộng chìm trong biển nước.']
      - id: nho_lang
        text: 'Chạy ra đình nhờ cả làng cùng hộ đê'
        hint: 'Cần được lòng người'
        chance: { base: 0.4, skill: ngoai_giao, per_level: 0.04 }
        success:
          - { type: modifier, target: harvest.yield, value: 0.9, op: mul, months: 4, label: 'Ruộng ngập nhẹ' }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
        failure:
          - { type: modifier, target: harvest.yield, value: 0.7, op: mul, months: 4, label: 'Lúa ngập úng' }
          - { type: set_flag, flag: lu_lut, years: 0.25 }
        success_result: ['Trai tráng cả làng đổ ra đê. Đê giữ được, ruộng các nhà đều qua nạn.']
        failure_result: ['Nhà ai nấy lo, chẳng ai chịu ra. Nước tràn qua đê.']
      - id: lo_do_dac
        text: 'Bỏ ruộng, lo dọn đồ đạc lên chỗ cao'
        hint: 'Chắc chắn mất một phần lúa, nhưng an toàn'
        effects:
          - { type: modifier, target: harvest.yield, value: 0.75, op: mul, months: 4, label: 'Bỏ ruộng chạy lụt' }
          - { type: set_flag, flag: lu_lut, years: 0.25 }
        result: ['Cả nhà ngồi trên gác bếp nhìn nước mênh mông. Người không sao là may.']

  - id: nguoi_nha_om_nang
    title: Người nhà ốm nặng
    tags: [benh_tat, gia_dinh]
    roles:
      - { id: benh, from: family, relation: member, condition: { var: self.health, op: '<', value: 45 }, pick: random }
      - { id: thay, from: village, village_role: thay_lang, optional: true }
    weight: 9
    cooldown_years: 1
    tension: 6
    importance: 6
    icon: om
    text:
      - '{role.benh.call} sốt li bì mấy ngày, người gầy rộc, ăn gì nôn nấy. Cả nhà lo lắng nhìn nhau.'
    options:
      - id: moi_thay
        text: 'Mời thầy lang về bốc thuốc (2 quan)'
        condition: { var: household.money, op: '>=', value: 2 }
        effects:
          - { type: money, value: -2 }
          - { type: health, who: benh, value: 20 }
        result: ['Mấy thang thuốc đắng ngắt, nhưng {role.benh.call} dần tỉnh táo lại.']
      - id: vay_moi_thay
        text: 'Đi vay tiền mời thầy'
        effects:
          - { type: money, value: 2, ledger: vay }
          - { type: debt, value: 3 }
          - { type: money, value: -2 }
          - { type: health, who: benh, value: 20 }
        result: ['Thuốc thang đủ đầy. Món nợ thì để sau.']
      - id: cung_bai
        text: 'Lên chùa cầu khấn, xin bùa'
        hint: 'Rẻ, nhưng phó mặc trời Phật'
        trait_stress: { hoai_nghi: 4 }
        chance:
          base: 0.3
          modifiers: [{ condition: { has_trait: mo_dao }, add: 0.1 }]
        effects: [{ type: money, value: -0.3 }]
        success: [{ type: health, who: benh, value: 15 }]
        failure: [{ type: health, who: benh, value: -12 }]
        success_result: ['Không biết nhờ bùa hay nhờ trời, {role.benh.call} qua cơn nguy kịch.']
        failure_result: ['Hương khói nghi ngút, nhưng {role.benh.call} mỗi lúc một yếu đi.']
      - id: tu_cham
        text: 'Tự chăm sóc bằng cháo hành, lá xông'
        chance: { base: 0.45, skill: sinh_ton, per_level: 0.02 }
        effects: [{ type: stress, value: 4 }]
        success: [{ type: health, who: benh, value: 8 }]
        failure: [{ type: health, who: benh, value: -10 }]
        success_result: ['Ba đêm thức trắng, {role.benh.call} cũng ra được mồ hôi, hạ sốt.']
        failure_result: ['Bệnh không lui. {role.benh.call} nằm thiêm thiếp, hơi thở yếu dần.']

  - id: tranh_chap_bo_ruong
    title: Tranh chấp bờ ruộng
    tags: [lang_xa, quan_he, ruong_dong]
    condition: { var: household.farmland, op: '>=', value: 1 }
    roles:
      - { id: hx, from: village, village_role: hang_xom }
      - { id: ly, from: village, village_role: ly_truong }
    weight: 5
    weight_modifiers:
      - { condition: { var: role.hx.opinion, op: '<', value: 10 }, factor: 2 }
    cooldown_years: 4
    tension: 4
    importance: 5
    icon: ruong
    text:
      - 'Sáng ra đồng, bạn thấy cọc mốc giữa ruộng nhà và ruộng {role.hx.call} bị dời sang phía bạn cả gang tay.'
    options:
      - id: nhuong
        text: 'Thôi, nhường một chút cho êm cửa êm nhà'
        trait_stress: { tham_vong: 3, nong_nay: 4 }
        effects:
          - { type: opinion, role: hx, value: 8 }
          - { type: modifier, target: harvest.yield, value: 0.97, op: mul, months: 24, label: 'Mất một mép ruộng' }
        result: ['Bạn nhổ cọc cắm lại chỗ mới. {role.hx.call} có vẻ ngượng.']
      - id: ra_dinh
        text: 'Đưa ra đình nhờ {role.ly.call} phân xử'
        hint: 'Cần lý lẽ và được lòng ông lý'
        chance:
          base: 0.4
          skill: ngoai_giao
          per_level: 0.04
          modifiers: [{ condition: { var: role.ly.opinion, op: '>', value: 10 }, add: 0.15 }]
        effects: [{ type: money, value: -0.5 }]
        success:
          - { type: opinion, role: hx, value: -15 }
          - { type: opinion, role: ly, value: 3 }
        failure:
          - { type: opinion, role: hx, value: -10 }
          - { type: modifier, target: harvest.yield, value: 0.95, op: mul, months: 24, label: 'Thua kiện bờ ruộng' }
        success_result: ['{role.ly.call} cho đo lại, cọc về chỗ cũ. {role.hx.call} mặt hằm hằm.']
        failure_result: ['{role.ly.call} xử nước đôi, phần thiệt lại về nhà bạn. Mất thêm cả tiền lễ.']
      - id: doi_coc_dem
        text: 'Đêm xuống lặng lẽ cắm lại cọc, còn lấn sang bên kia'
        hint: 'Lấy lại hơn cả phần mất — nếu không bị bắt gặp'
        trait_stress: { nhan_tu: 6, trung_thanh: 3 }
        chance: { base: 0.5, skill: muu_luoc, per_level: 0.04 }
        success:
          - { type: modifier, target: harvest.yield, value: 1.04, op: mul, months: 24, label: 'Lấn được mép ruộng' }
        failure:
          - { type: opinion, role: hx, value: -30 }
          - { type: opinion, role: ly, value: -10 }
          - { type: stress, value: 5 }
        success_result: ['Không ai hay biết. Bờ ruộng nhà bạn rộng ra một chút.']
        failure_result: ['{role.hx.call} rình bắt quả tang. Cả xóm xì xào nhà bạn gian.']

  - id: cuu_nguoi_doi
    title: Người lạ xin ăn
    tags: [lang_xa, quan_he]
    condition: { var: household.food, op: '>=', value: 8 }
    weight: 5
    once_per_life: true
    tension: 3
    importance: 5
    icon: nguoi_la
    text:
      - 'Chiều muộn, một người đàn ông rách rưới bế đứa trẻ gầy trơ xương dừng trước cổng. "Xin nhà cho bát cơm, thằng bé ba ngày chưa ăn."'
    options:
      - id: cho_thoc
        text: 'Cho họ ăn no và 5 thúng thóc mang theo'
        trait_stress: { tham_lam: 5 }
        effects:
          - { type: food, value: -5 }
          - { type: stress, value: -2 }
          - { type: set_flag, flag: cuu_nguoi_la }
          - { type: schedule_event, event: nguoi_la_tro_lai, months: 48 }
        result: ['Người đàn ông vái ba vái rồi đi. Bạn không hỏi tên, họ cũng không nói.']
      - id: cho_o_nho
        text: 'Cho ngủ nhờ ở gian bếp một đêm'
        chance: { base: 0.7, skill: muu_luoc, per_level: 0.02 }
        success: [{ type: stress, value: -1 }]
        failure: [{ type: money, value: -1 }, { type: stress, value: 4 }]
        success_result: ['Sáng ra, gian bếp đã được quét sạch. Họ đi từ lúc gà gáy.']
        failure_result: ['Sáng ra, người đã đi và túi tiền trên gác bếp cũng không còn.']
      - id: duoi_di
        text: 'Đóng cổng: nhà mình còn chưa đủ ăn'
        trait_stress: { nhan_tu: 7, hao_phong: 4 }
        result: ['Tiếng đứa trẻ khóc xa dần cuối ngõ.']

  - id: nguoi_la_tro_lai
    title: Người khách năm xưa
    tags: [quan_he]
    scheduled_only: true
    condition: { has_flag: cuu_nguoi_la }
    weight: 1
    tension: 1
    importance: 7
    icon: nguoi_la
    text:
      - 'Một chàng trai vạm vỡ dắt con ngựa dừng trước cổng, cúi đầu thật sâu: "Năm ấy đói, nhà ta cho cha con tôi bát cơm. Nay tôi làm đội trưởng trên trấn, xin được trả ơn."'
    options:
      - id: nhan_qua
        text: 'Nhận món quà 10 quan'
        effects:
          - { type: money, value: 10 }
          - { type: clear_flag, flag: cuu_nguoi_la }
        result: ['Ơn nhỏ năm xưa quay về thành của lớn. Đời thật lạ.']
      - id: nhan_nghia
        text: 'Không nhận tiền, chỉ xin kết nghĩa anh em'
        effects:
          - { type: clear_flag, flag: cuu_nguoi_la }
          - { type: set_flag, flag: ket_nghia_doi_truong, label: 'Có người anh em kết nghĩa làm đội trưởng trên trấn' }
          - { type: stress, value: -4 }
        result: ['Hai người uống chén rượu thề. Từ nay trên trấn có người nhà.']

  - id: bat_phu
    title: Làng bắt phu
    tags: [lang_xa, nguy_hiem]
    months: [11, 12, 1, 2]
    condition: { all: [{ var: player.age, op: between, value: [16, 50] }, { var: player.sex, op: '==', value: m }] }
    roles: [{ id: ly, from: village, village_role: ly_truong }]
    weight: 5
    cooldown_years: 3
    tension: 5
    importance: 5
    icon: phu
    text:
      - 'Quan trên đòi phu đắp đê. {role.ly.call} đọc tên từng suất đinh, có cả tên bạn. Đi ba tháng, ăn tự túc.'
    options:
      - id: di_phu
        text: 'Đi phu'
        effects:
          - { type: health, value: -6 }
          - { type: modifier, target: harvest.yield, value: 0.9, op: mul, months: 6, label: 'Thiếu người làm vì đi phu' }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
        result: ['Ba tháng gánh đất ngoài đê, bạn về đen nhẻm, gầy đi trông thấy.']
      - id: nop_tien
        text: 'Nộp 2 quan để được miễn'
        condition: { var: household.money, op: '>=', value: 2 }
        effects: [{ type: money, value: -2 }, { type: opinion, role: ly, value: 3 }]
        result: ['Tiền vào tay ông lý, tên bạn được gạch khỏi sổ.']
      - id: tron_phu
        text: 'Trốn lên rừng ít hôm'
        hint: 'Liều — bị bắt thì nặng'
        trait_stress: { trung_thanh: 4 }
        chance: { base: 0.5, skill: muu_luoc, per_level: 0.03 }
        failure:
          - { type: money, value: -3 }
          - { type: opinion, role: ly, value: -15 }
          - { type: stress, value: 5 }
        success_result: ['Đợt phu đi rồi. Ông lý cũng lười truy.']
        failure_result: ['Bạn bị lôi về đình, phạt 3 quan và bị ông lý ghi sổ đen.']

  - id: cuoi_hoi_anh_chi
    title: Lo đám cưới cho anh chị em
    tags: [gia_dinh]
    roles:
      - { id: ae, from: family, relation: sibling, condition: { var: self.age, op: between, value: [18, 27] } }
    weight: 4
    cooldown_years: 2
    tension: 3
    importance: 6
    icon: cuoi
    text:
      - 'Nhà bên kia đã sang dạm ngõ cho {role.ae.call}. Theo lệ làng, phải có trầu cau, lợn gà và mâm cỗ mời họ hàng.'
    options:
      - id: chu_dao
        text: 'Lo cưới chu đáo cho nở mày nở mặt'
        effects:
          - { type: money, value: -4 }
          - { type: food, value: -6 }
          - { type: stress, value: -2 }
          - { type: leave_household, who: ae }
        result: ['Đám cưới linh đình, cả làng khen. Kho thì vơi, nhưng ai cũng vui.']
      - id: don_gian
        text: 'Cưới đơn giản, một mâm cơm hai họ'
        effects:
          - { type: money, value: -1.5 }
          - { type: food, value: -3 }
          - { type: leave_household, who: ae }
        result: ['Đám cưới nhỏ mà ấm. {role.ae.call} theo về nhà mới.']
      - id: hoan
        text: 'Chưa phải lúc — xin hoãn sang năm'
        hint: 'Đỡ tốn bây giờ, nhưng mất lòng nhà kia'
        defer: { months: 12 }
        effects: [{ type: stress, value: 3 }]
        result: ['Nhà bên kia tuy không vui nhưng vẫn chờ. {role.ae.call} lặng lẽ cả tháng.']

  - id: thay_do_nhan_hoc
    title: Thầy đồ nhận học trò
    tags: [hoc_hanh]
    life_stages: [thieu_thoi]
    roles: [{ id: thay, from: village, village_role: thay_do }]
    weight: 7
    once_per_life: true
    tension: 3
    importance: 6
    icon: sach
    text:
      - '{role.thay.call} mở lớp dạy chữ ở hiên chùa. Học phí mỗi năm một quan và mấy thúng thóc. Ở nhà thì lại thiếu người chăn trâu, cấy hái.'
    options:
      - id: di_hoc
        text: 'Cho đi học'
        hint: 'Mở đường chữ nghĩa, nhà bớt một tay làm'
        effects:
          - { type: money, value: -1 }
          - { type: food, value: -3 }
          - { type: skill_xp, skill: hoc_van, value: 30 }
          - { type: set_flag, flag: di_hoc, label: 'Đang theo học {role.thay.call}' }
          - { type: modifier, target: harvest.yield, value: 0.94, op: mul, months: 24, label: 'Bớt một tay làm ruộng' }
          - { type: opinion, role: thay, value: 10 }
        result: ['Buổi đầu đi học, bạn ôm cái nghiên mực, lòng háo hức lạ thường.']
      - id: hoc_dem
        text: 'Ở nhà làm ruộng, tối sang xin học thêm'
        hint: 'Học ít hơn, tốn sức hơn'
        chance: { base: 0.5, modifiers: [{ condition: { has_trait: kien_nhan }, add: 0.25 }] }
        success:
          - { type: skill_xp, skill: hoc_van, value: 20 }
          - { type: stress, value: 3 }
        failure: [{ type: stress, value: 6 }]
        success_result: ['Ngày ra đồng, tối bên đèn dầu. Chữ vào chậm mà chắc.']
        failure_result: ['Mệt quá, bạn ngủ gục trên trang sách. Được ít hôm thì bỏ.']
      - id: o_nha
        text: 'Ở nhà chăn trâu, cấy hái'
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 20 }
          - { type: set_flag, flag: bo_hoc }
        result: ['Bạn đứng ngoài hiên chùa nhìn lũ bạn học, rồi dắt trâu ra đồng.']

  - id: ru_danh_bac
    title: Chiếu bạc trong xóm
    tags: [lang_xa, nguy_hiem]
    condition: { var: player.age, op: '>=', value: 16 }
    roles: [{ id: hx, from: village, village_role: hang_xom }, { id: ly, from: village, village_role: ly_truong }]
    weight: 4
    cooldown_years: 3
    tension: 3
    importance: 4
    icon: bac
    text:
      - 'Mùa nông nhàn, {role.hx.call} rủ bạn sang chiếu xóc đĩa ở nhà cuối xóm. "Vài ván thôi, ăn được thì đong thêm thóc."'
    options:
      - id: choi
        text: 'Chơi vài ván'
        trait_stress: { than_trong: 3 }
        chance: { base: 0.42, skill: muu_luoc, per_level: 0.01, max: 0.6 }
        success: [{ type: money, value: 2 }]
        failure: [{ type: money, value: -3 }, { type: stress, value: 4 }]
        success_result: ['Hôm nay đỏ bạc, bạn ôm 2 quan về nhà.']
        failure_result: ['Mất trắng 3 quan. Bạn về nhà, không dám nhìn mặt ai.']
      - id: tu_choi
        text: 'Từ chối, ở nhà vá lưới'
        result: ['Bạn lắc đầu. Cờ bạc là bác thằng bần.']
      - id: to_giac
        text: 'Báo với {role.ly.call}'
        trait_stress: { trung_thanh: 2 }
        effects: [{ type: opinion, role: hx, value: -12 }, { type: opinion, role: ly, value: 6 }]
        result: ['Chiếu bạc bị dẹp. {role.hx.call} biết ai đã báo.']

  - id: sau_hai_lua
    title: Sâu bệnh phá lúa
    tags: [ruong_dong]
    months: [3, 4, 8, 9]
    condition: { all: [{ var: world.harvest_quality, op: 'in', value: [kem, mat_mua] }, { var: household.farmland, op: '>=', value: 1 }] }
    weight: 6
    cooldown_years: 2
    tension: 4
    importance: 4
    icon: sau
    text:
      - 'Rầy nâu bám kín gốc lúa, cả cánh đồng vàng úa từng vạt. Mấy hôm nữa là đến ruộng nhà bạn.'
    options:
      - id: bat_tay
        text: 'Cả nhà ra ruộng bắt sâu bằng tay'
        hint: 'Tốn sức, may thì cứu được'
        chance: { base: 0.5, skill: sinh_ton, per_level: 0.03 }
        effects: [{ type: health, value: -3 }]
        failure:
          - { type: modifier, target: harvest.yield, value: 0.85, op: mul, months: 4, label: 'Sâu bệnh phá lúa' }
        success_result: ['Lưng mỏi rã rời, nhưng ruộng nhà sạch rầy.']
        failure_result: ['Bắt không xuể. Lúa vẫn bị rầy phá một phần.']
      - id: mua_voi
        text: 'Mua vôi rắc ruộng (1,5 quan)'
        condition: { var: household.money, op: '>=', value: 1.5 }
        effects:
          - { type: money, value: -1.5 }
          - { type: modifier, target: harvest.yield, value: 0.95, op: mul, months: 4, label: 'Sâu bệnh (đã rắc vôi)' }
        result: ['Vôi trắng xóa ruộng, rầy chết gần hết.']
      - id: mac_ke
