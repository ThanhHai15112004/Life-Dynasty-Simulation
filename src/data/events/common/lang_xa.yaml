        effects:
          - { type: modifier, target: harvest.yield, value: 0.92, op: mul, months: 3, label: 'Chủ nhà nằm bệnh' }
        success:
          - { type: cure_disease, who: player }
          - { type: health, value: 6 }
        failure:
          - { type: health, value: -8 }
          - { type: stress, value: 5 }
        success_result: ['Mồ hôi vã ra như tắm, cơn bệnh dần lui.']
        failure_result: ['Bệnh vẫn dai dẳng bám lấy, người thêm xanh xao.']

  - id: day_con_trong_nha
    title: Dạy con nên người
