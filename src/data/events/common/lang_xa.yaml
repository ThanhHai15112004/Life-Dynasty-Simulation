      - id: khong_gop
        text: 'Không góp, nhà còn chẳng đủ ăn'
        effects: [{ type: opinion, role: ly, value: -6 }]
        result: ['{role.ly.call} nhìn bạn một cái, ghi gì đó vào sổ.']

  - id: dam_ngo_cho_minh
    title: Chuyện trăm năm
    tags: [gia_dinh, quan_he]
    condition:
      all:
        - { var: player.age, op: between, value: [17, 38] }
        - { var: player.married, op: '==', value: false }
        - { var: player.mourning_months, op: '==', value: 0 }
    roles:
      - { id: hx, from: village, village_role: hang_xom }
    weight: 9
    cooldown_years: 2
    tension: 4
    importance: 7
    icon: cuoi
    text:
      - 'Bà mối trong xóm ghé sang bàn chuyện trăm năm. Bên nhà người ta hiền lành, chịu thương chịu khó, chỉ cần sính lễ vừa phải là thuận tình.'
    options:
      - id: cuoi_chu_dao
        text: 'Sắm lễ trầu cau, mở cỗ mời cả xóm (5 quan, 8 thúng thóc)'
        condition:
          all:
            - { var: household.money, op: '>=', value: 5 }
            - { var: household.food, op: '>=', value: 8 }
        effects:
          - { type: money, value: -5 }
          - { type: food, value: -8 }
          - { type: marry }
          - { type: reputation, group: dan_lang, value: 8 }
          - { type: opinion, role: hx, value: 8 }
        result: ['Đám cưới rộn ràng cả góc làng. Từ nay nhà có thêm người sớm hôm chung sức.']
      - id: cuoi_tiet_kiem
        text: 'Lễ mọn lòng thành, đón người về (2 quan, 3 thúng thóc)'
        condition:
          all:
            - { var: household.money, op: '>=', value: 2 }
            - { var: household.food, op: '>=', value: 3 }
        effects:
          - { type: money, value: -2 }
          - { type: food, value: -3 }
          - { type: marry }
          - { type: reputation, group: dan_lang, value: 2 }
        result: ['Mâm cơm giản dị mà ấm lòng. Hai vợ chồng nhìn nhau hẹn ngày khấm khá.']
      - id: vay_de_cuoi
        text: 'Chạy vạy vay 4 quan để lo sính lễ'
        effects:
          - { type: debt, value: 5 }
          - { type: marry }
          - { type: stress, value: 4 }
        result: ['Thành gia lập thất xong cũng là lúc gánh thêm món nợ mới trên vai.']
      - id: chua_den_luc
        text: 'Chưa phải lúc — đợi nhà thong thả hơn'
        defer: { months: 18 }
        result: ['Bạn khéo léo từ tạ bà mối. Chuyện yên bề gia thất đành gác lại.']

  - id: ban_than_nga_benh
