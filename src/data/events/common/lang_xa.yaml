      - id: dao_gieng
        text: 'Hô hào trai làng đào giếng chung'
        hint: 'Tốn sức, thành thì cứu được lúa'
        chance: { base: 0.4, skill: quan_tri, per_level: 0.05 }
        effects: [{ type: health, value: -3 }]
        success:
          - { type: modifier, target: harvest.yield, value: 1.12, op: mul, months: 6, label: 'Giếng chung tưới ruộng' }
