# [1.8] Chuỗi sự kiện Di cư lên Đô thị / Thị trấn & Đời sống phố thị (học theo nhân quả 1in8b)
events:
  - id: quyet_dinh_roi_que_len_pho
    title: Tiếng gọi nơi phố thị phồn hoa
    text:
      - 'Ở quê ruộng đất chật hẹp, làm lụng quanh năm chỉ đủ đắp đổi qua ngày. Người đi buôn về kể chuyện ngoài thị trấn và phủ thành đang mở mang bến bãi, xưởng thợ, ai chịu khó đều kiếm được đồng tiền tươi.'
      - 'Nhìn cảnh thôn xóm trầm lắng qua từng mùa vụ, bạn nảy ý định đưa gia đình rời lũy tre làng lên chốn phố thị tìm cơ hội đổi đời.'
    tags: [buoc_ngoat, buon_ban]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition:
      all:
        - { var: world.is_urban, op: '==', value: false }
        - { var: player.is_head, op: '==', value: true }
        - { var: household.money, op: '>=', value: 4 }
    weight: 9
    cooldown_years: 6
    importance: 8
    icon: duong
    options:
      - id: chuyen_len_thi_tran_ben_song
        text: Thu xếp hành lý, đưa cả nhà ra thị trấn bến sông thuê trọ lập nghiệp
        hint: Tốn 4 quan tiền thuyền xe, bắt đầu cuộc sống ở thuê nơi phố thị
        effects:
          - { type: money, value: -4 }
          - { type: relocate_settlement, settlement: thi_tran_ben_song, free: true }
          - { type: set_flag, flag: o_nha_thue, years: 8, label: 'Đang thuê nhà nơi phố thị' }
          - { type: schedule_event, event: chan_uot_chan_rao_noi_pho_thi, months: 2, keep_roles: false }
        result:
          - 'Con thuyền chở gia đình bạn rời bến quê, cập vào {world.town_name} tấp nập người qua kẻ lại.'
      - id: chuyen_thang_len_phu_thanh
        text: Đánh liều lên thẳng phủ thành lớn để tìm cơ hội học hành và buôn bán lớn
        hint: Tốn 8 quan chi phí di chuyển
        condition: { var: household.money, op: '>=', value: 8 }
        effects:
          - { type: money, value: -8 }
          - { type: relocate_settlement, settlement: phu_thanh, free: true }
          - { type: set_flag, flag: o_nha_thue, years: 8, label: 'Đang thuê nhà tại phủ thành' }
          - { type: schedule_event, event: chan_uot_chan_rao_noi_pho_thi, months: 2, keep_roles: false }
        result:
          - 'Bước qua cổng thành cao vợi của {world.prefecture_name}, một cuộc sống hoàn toàn mới mở ra trước mắt bạn.'
      - id: o_lai_gan_bo_dat_que
        text: Đất quê tuy nghèo nhưng không tốn tiền thuê nhà, quyết ở lại bám ruộng vườn
        effects:
          - { type: stress, value: -3 }
          - { type: reputation, group: dan_lang, value: 3 }
        result:
          - 'Bạn gạt bỏ chuyện đi xa, tiếp tục chăm chút cho mảnh vườn và nếp nhà quen thuộc.'

  - id: chan_uot_chan_rao_noi_pho_thi
    title: Chân ướt chân ráo nơi phố thị
    text:
      - 'Những ngày đầu ở phố thị, cái gì cũng phải mua bằng tiền — từ bó củi, gánh nước ngọt cho đến căn phòng trọ chật hẹp cuối ngõ. Bạn phải nhanh chóng chọn một hướng kiếm sống trước khi tiền lưng vốn cạn sạch.'
    tags: [buon_ban, nghe_nghiep]
    scheduled_only: true
    weight: 10
    importance: 7
    icon: tien
    options:
      - id: xin_lam_phu_ben_bai
        text: Ra bến thuyền, xưởng thợ nhận việc làm thuê lấy tiền công chắc chắn
        effects:
          - { type: set_career, career: lam_thue }
          - { type: money, value: 4 }
          - { type: skill_xp, skill: sinh_ton, value: 18 }
        result:
          - 'Công việc vất vả từ tờ mờ sáng nhưng giúp bạn có ngay đồng tiền đong gạo nơi đất khách.'
      - id: xoay_xo_buon_thung_ban_met
        text: Lấy ít vốn nhập hàng khô, quà vặt bày bán đầu ngõ phố
        effects:
          - { type: set_career, career: ban_rong }
          - { type: skill_xp, skill: thuong_mai, value: 25 }
          - { type: money, value: 3 }
        result:
          - 'Tiếng rao hàng của bạn bắt đầu hòa vào nhịp sống nhộn nhịp của khu phố chợ.'
      - id: xin_vao_phu_so_sach_cua_hieu
        text: Dùng vốn chữ nghĩa xin vào phụ ghi chép sổ sách cho cửa hiệu lớn
        condition: { var: player.skill.hoc_van, op: '>=', value: 2 }
        effects:
          - { type: set_career, career: nha_lai }
          - { type: money, value: 6 }
          - { type: skill_xp, skill: quan_tri, value: 25 }
        result:
          - 'Chủ hiệu ưng ý nét chữ và tính cẩn thận của bạn, nhận vào làm việc lâu dài.'

  - id: chu_nha_tang_tien_thue
    title: Chủ nhà đòi tăng tiền trọ cuối năm
    text:
      - 'Thấy người đổ về phố chợ ngày một đông, chủ nhà trọ gõ cửa thông báo từ năm tới sẽ tăng tiền thuê nhà, nếu không chịu thì phải dọn đi trước rằm.'
    tags: [buon_ban, no_nan]
    condition:
      all:
        - { var: world.is_urban, op: '==', value: true }
        - { has_flag: o_nha_thue }
    weight: 9
    cooldown_years: 3
    importance: 6
    icon: tien
    options:
      - id: khao_kheo_thuong_luong
        text: Khéo léo thương lượng và nhận sửa sang mái hiên giúp chủ nhà để giữ giá cũ
        chance:
          base: 0.55
          skill: ngoai_giao
          per_level: 0.06
        success:
          - { type: skill_xp, skill: ngoai_giao, value: 20 }
          - { type: stress, value: -2 }
        failure:
          - { type: money, value: -3 }
          - { type: stress, value: 5 }
        success_result:
          - 'Chủ nhà nể tình gia đình bạn ở sạch sẽ, giữ chữ tín nên bằng lòng giữ nguyên tiền thuê.'
        failure_result:
          - 'Chủ nhà nhất quyết không nhượng bộ, bạn đành bấm bụng trả thêm tiền thuê.'
      - id: chuyen_vao_hem_sau
        text: Dọn vào xóm lao động chật chội cuối bãi để đỡ tốn kém
        effects:
          - { type: money, value: 2 }
          - { type: health, value: -4, who: household }
          - { type: stress, value: 4 }
        result:
          - 'Chỗ ở mới ẩm thấp và ồn ào hơn, nhưng giúp gia đình tiết kiệm được một khoản chi tiêu.'

  - id: tich_cop_mua_nha_pho
    title: Tậu mái nhà riêng nơi phố thị
    text:
      - 'Sau nhiều năm chịu cảnh ở trọ chật chội, một người hàng xóm cần tiền gấp muốn nhượng lại căn nhà nhỏ có sân riêng ngay gần chợ.'
    tags: [buon_ban, co_hoi]
    condition:
      all:
        - { var: world.is_urban, op: '==', value: true }
        - { has_flag: o_nha_thue }
        - { var: household.money, op: '>=', value: 25 }
    weight: 12
    cooldown_years: 5
    importance: 8
    icon: nha
    options:
      - id: xuong_tien_mua_nha_an_cu
        text: Xuất tiền tích cóp mua đứt căn nhà, chấm dứt cảnh ở thuê
        hint: Tốn 25 quan, xóa hoàn toàn tiền thuê trọ hằng năm
        effects:
          - { type: money, value: -25, ledger: mua_tai_san }
          - { type: clear_flag, flag: o_nha_thue }
          - { type: reputation, group: dan_lang, value: 8 }
          - { type: dynasty_prestige, value: 6 }
          - { type: stress, value: -8 }
        result:
          - 'Cầm tờ văn tự nhà đất trên tay, gia đình bạn chính thức an cư lạc nghiệp giữa lòng phố thị.'
      - id: giu_tien_lam_von_buon
        text: Giữ tiền mặt làm vốn quay vòng buôn bán, tạm thời ở thuê thêm ít năm
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 15 }
        result:
          - 'Bạn ưu tiên giữ dòng tiền lưu động cho công việc làm ăn thay vì chôn vốn vào nhà cửa.'

  - id: vo_mong_pho_thi_ve_que
    title: Gánh nặng cơm áo nơi đô hội
    text:
      - 'Phố thị hoa lệ với người có tiền nhưng lại khắc nghiệt với kẻ trắng tay. Giá gạo đắt đỏ, tiền thuê nhà chồng chất khiến bữa cơm gia đình ngày càng thiếu thốn.'
    tags: [no_nan, gia_dinh]
    condition:
      all:
        - { var: world.is_urban, op: '==', value: true }
        - { any: [{ var: household.debt, op: '>=', value: 15 }, { var: household.living_standard, op: '==', value: kho_cuc }] }
    weight: 10
    cooldown_years: 4
    importance: 7
    icon: buon
    options:
      - id: thu_xep_quay_ve_que_cu
        text: Buông bỏ giấc mộng phố thị, đưa gia đình về lại làng quê sinh sống
        condition: { var: player.is_head, op: '==', value: true }
        effects:
          - { type: relocate_settlement, settlement: lang_nong, free: true }
          - { type: clear_flag, flag: o_nha_thue }
          - { type: stress, value: -6 }
          - { type: food, value: 8 }
        result:
          - 'Trở về dưới bóng tre làng, dù đơn sơ nhưng bạn không còn bị tiền trọ và giá chợ đè nặng mỗi ngày.'
      - id: bam_tru_lam_them_ca_dem
        text: Quyết không bỏ cuộc, nhận làm thêm cả ban đêm để trụ lại thành phố
        effects:
          - { type: money, value: 6 }
          - { type: health, value: -5 }
          - { type: stress, value: 5 }
        result:
          - 'Bạn cắn răng làm lụng gấp đôi người thường để giữ chỗ đứng nơi phố thị.'

