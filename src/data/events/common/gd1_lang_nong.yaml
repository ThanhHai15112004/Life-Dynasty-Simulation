    tension: 3
    importance: 4
    icon: cho
    text:
      - 'Gặt xong, thóc đầy bồ. {role.lb.call} đánh thuyền về tận bến làng, hỏi mua mười thúng thóc với giá chỉ bằng hai phần ba chợ huyện.'
      - 'Đường lên chợ huyện thì xa, gánh nặng, lại phải nộp tiền chỗ ngồi.'
    options:
      - id: ban_tai_ben
        text: 'Bán luôn cho {role.lb.call} tại bến'
        effects:
          - { type: food, value: -10, ledger: ban_thoc }
          - { type: money, value: 4, ledger: buon_ban }
        result: ['Thóc đổ xuống khoang thuyền, tiền đếm trên mạn. Nhanh gọn, chỉ tiếc mấy đồng chênh lệch.']
      - id: ganh_cho_huyen
        text: 'Gánh lên chợ huyện bán lẻ'
        hint: 'Mất sức, được giá hay không tùy tài buôn'
        chance: { base: 0.55, skill: thuong_mai, per_level: 0.05 }
        effects:
          - { type: health, value: -3 }
          - { type: food, value: -10, ledger: ban_thoc }
        success:
          - { type: money, value: 6.5, ledger: buon_ban }
          - { type: skill_xp, skill: thuong_mai, value: 12 }
        failure:
          - { type: money, value: 4.5, ledger: buon_ban }
          - { type: stress, value: 3 }
        success_result: ['Phiên chợ huyện đông người, thóc nhà bạn hạt mẩy, bán hết trước trưa.']
        failure_result: ['Chợ ngập thóc mới, ai cũng hạ giá. Gánh nặng cả chặng đường mà chỉ hơn bán ở bến chút ít.']
      - id: mac_ca
        text: 'Mặc cả, dọa mang lên huyện bán'
        chance: { base: 0.45, skill: thuong_mai, per_level: 0.05 }
        effects:
          - { type: food, value: -10, ledger: ban_thoc }
        success:
          - { type: money, value: 5.5, ledger: buon_ban }
          - { type: opinion, role: lb, value: 3 }
        failure:
          - { type: money, value: 3.5, ledger: buon_ban }
          - { type: opinion, role: lb, value: -5 }
        success_result: ['{role.lb.call} chép miệng, rồi cũng thêm tiền. "Nhà này khó tính thật."']
        failure_result: ['{role.lb.call} nhổ neo làm bộ đi. Bạn gọi lại, phải bán rẻ hơn cả lúc đầu.']
      - id: tru_thoc
        text: 'Không bán, trữ thóc chờ giáp hạt giá lên'
        trait_stress: { nong_nay: 3 }
        effects:
          - { type: stress, value: 1 }
        result: ['Bạn đậy kín bồ, rắc vôi quanh chân để chống chuột. Mấy tháng nữa xem giá.']

  # ── Hội làng, lệ làng, an ninh ──
  - id: ln_hoi_lang_ngoi_thu
    title: Ngôi thứ chốn đình trung
    tags: [lang_xa, le_hoi, quan_he]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    months: [1, 2]
    condition:
      all:
        - { var: world.settlement_type, op: '==', value: lang_nong }
        - { var: player.age, op: '>=', value: 30 }
        - { not: { has_flag: ln_co_ngoi_dinh } }
        - { var: player.mourning_months, op: '<=', value: 0 }
    roles:
      - { id: ly, from: village, village_role: ly_truong }
    weight: 4
    cooldown_years: 6
    tension: 4
    importance: 6
    icon: hoi
    text:
      - 'Hội làng mùa xuân, mâm cỗ ngoài đình xếp theo ngôi thứ: kỳ mục chiếu trên, bạch đinh ngồi chiếu dưới sát cổng.'
      - '{role.ly.call} ngỏ ý: nhà bạn chịu khao vọng một chầu cỗ cho cả làng thì được ghi tên vào hàng chức sắc, có chỗ ở chiếu giữa.'
    options:
      - id: khao_vong
        text: 'Làm cỗ khao vọng cả làng (6 quan)'
        condition: { var: household.money, op: '>=', value: 6 }
        trait_stress: { tham_lam: 4 }
        effects:
          - { type: money, value: -6, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: 12 }
          - { type: stress, value: -3 }
          - { type: set_flag, flag: ln_co_ngoi_dinh, label: 'Có ngôi thứ chốn đình trung' }
        result: ['Ba con lợn, mười mâm xôi, rượu nút lá chuối. Từ hội năm sau, bạn ngồi chiếu giữa, được chia phần thủ lợn.']
      - id: vay_khao
        text: 'Vay tiền làm cỗ, thể diện là trên hết'
        condition: { var: household.money, op: '<', value: 6 }
        trait_stress: { than_trong: 4 }
        effects:
          - { type: debt, value: 7, ledger: vay }
          - { type: reputation, group: dan_lang, value: 12 }
          - { type: stress, value: 3 }
          - { type: set_flag, flag: ln_co_ngoi_dinh, label: 'Có ngôi thứ chốn đình trung' }
        result: ['Cỗ bày linh đình, cả làng no say. Món nợ thì cả nhà gánh mấy mùa sau.']
      - id: tu_choi
        text: 'Ngồi chiếu dưới cũng được, tiền để lo ruộng'
        trait_stress: { tham_vong: 5 }
        effects:
          - { type: reputation, group: dan_lang, value: -2 }
          - { type: stress, value: 1 }
        result: ['Hội năm ấy bạn vẫn ngồi chiếu dưới, gắp miếng thịt mỡ sau cùng. Về nhà, bạn ra thăm ruộng.']

