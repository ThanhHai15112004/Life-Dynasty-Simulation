          - { type: opinion, role: ng, value: -3 }
        result: ['{role.ng.call} cúi gằm mặt đứng giữa sân đình. Về nhà, cả bữa cơm không ai nhắc lại chuyện ấy.']
      - id: xin_giam
        text: 'Xin {role.ly.call} giảm vạ vì nhà túng'
        chance: { base: 0.45, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: money, value: -0.5, ledger: su_kien }
        failure:
          - { type: money, value: -2, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: -3 }
          - { type: stress, value: 3 }
        success_result: ['Ông lý phẩy tay: "Thôi, nộp năm tiền cho có lệ."']
        failure_result: ['"Lệ làng có từ đời các cụ," ông lý nói to cho cả đình nghe. Vạ vẫn đủ hai quan.']
      - id: cai_lai
        text: 'Cãi rằng chuyện trẻ dại, không đáng phạt'
        trait_stress: { than_trong: 3 }
        chance: { base: 0.3, skill: muu_luoc, per_level: 0.04 }
        success:
          - { type: opinion, role: ng, value: 5 }
          - { type: reputation, group: dan_lang, value: -2 }
        failure:
          - { type: money, value: -3, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: -8 }
          - { type: opinion, role: ly, value: -10 }
        success_result: ['Kỳ mục bàn ra tán vào, cuối cùng cho qua. {role.ng.call} nhìn bạn đầy biết ơn.']
        failure_result: ['Cãi lệ làng là tội nặng hơn hái trộm. Vạ tăng lên ba quan, cả làng nhìn nhà bạn khác đi.']

  - id: ln_cuop_dem
    title: Cướp đêm sau mùa gặt
    tags: [nguy_hiem, lang_xa, ruong_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [5, 6, 10, 11, 12]
    condition:
      all:
        - { var: world.settlement_type, op: '==', value: lang_nong }
        - { var: household.food, op: '>=', value: 20 }
