        result:
          - 'Sự hào phóng của bạn khiến các bậc bô lão và chưởng quỹ vị nể, mời bạn ngồi vào hàng ghế đầu.'

  - id: sk_dan_tinh_va_thien_menh
    title: Cáo thị từ phủ thành và lòng dân các hạt
    text:
      - 'Trước cổng đình và bến chợ vừa dán tờ cáo thị mới của nha môn phủ {world.prefecture_name} về việc đắp đê, thu thuế và giữ yên bờ cõi. Dân làng xúm lại bàn tán xôn xao.'
