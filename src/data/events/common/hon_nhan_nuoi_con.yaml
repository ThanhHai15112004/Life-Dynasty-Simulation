# [2] Sự kiện Hôn nhân, Các họ trong làng & Nuôi dạy con cái (Phase 4)
events:
  - id: gd_ba_moi_dam_ngo
    title: Bà mối trong làng sang dạm ngõ
    tags: [gia_dinh, quan_he]
    cooldown_years: 4
    weight: 2.5
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { var: player.has_marriageable_child, op: '==', value: true }
    text:
      - 'Bà mối cầm cơi trầu bước qua cổng tre, cười tươi rói nói rằng {child.marriageable_name} trong nhà đã đến tuổi trăng tròn, có ba đám trong làng tại {world.settlement} đang muốn dạm hỏi: một đám nhà khá giả có của ăn của để, một đám con nhà chữ nghĩa lễ phép, và một đám con nhà nông chăm chỉ hiền lành.'
    options:
      - id: chon_nha_kha_gia
        text: Ưng thuận kết thông gia với nhà khá giả trong làng để nâng vị thế dòng họ
        effects:
          - { type: arrange_child_marriage, status: phu_ho }
          - { type: dynasty_prestige, value: 8 }
          - { type: reputation, group: dan_lang, value: 4 }
        result:
          - 'Hai họ trao lễ dạm ngõ trang trọng. Dân làng tại {world.settlement} ai cũng khen họ {dynasty.family_name} biết chọn nơi môn đăng hộ đối.'
      - id: chon_nha_chu_nghia
        text: Trọng nết na chữ nghĩa, gả cưới vào nhà Nho học lễ giáo
        effects:
          - { type: arrange_child_marriage, status: si_phu }
          - { type: scholarly_prestige, value: 6 }
          - { type: stress, value: -5 }
        result:
          - 'Lễ vật tuy giản dị nhưng ấm tình hiếu lễ, hai gia tộc kết mối giao hảo bền chặt.'
      - id: hoi_y_con
        text: Chưa nhận lời ngay, để {child.marriageable_name} tự xem mặt và mở bảng Hôn sự cân nhắc
        effects:
          - { type: stress, value: -3 }
          - { type: filial_piety, value: 3 }
        result:
          - 'Bạn tiễn bà mối bằng chén trà thơm, hẹn sẽ bàn bạc kỹ với con cái trước khi quyết chuyện trăm năm.'

  - id: gd_le_cuoi_lang_que
    title: Cỗ cưới rộn ràng và lệ nộp cheo làng
    tags: [gia_dinh, lang_xa]
    cooldown_years: 6
    weight: 1.8
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { var: dynasty.in_laws_count, op: '>=', value: 1 }
    text:
      - 'Nhà họ {dynasty.family_name} vừa kết tình thông gia với một dòng họ trong làng {world.settlement}. Theo lệ làng, ngoài mâm cỗ mời họ hàng hai bên, gia chủ còn làm lễ báo gia tiên và nộp cheo ngoài đình để dân làng công nhận mối duyên mới.'
    options:
      - id: mo_co_to
        text: Mổ lợn bày cỗ lớn mời khắp các họ trong làng (4 quan, 8 thúng thóc)
        condition:
          all:
            - { var: household.money, op: '>=', value: 4 }
            - { var: household.food, op: '>=', value: 8 }
        effects:
          - { type: money, value: -4 }
          - { type: food, value: -8 }
          - { type: reputation, group: dan_lang, value: 8 }
          - { type: dynasty_prestige, value: 8 }
          - { type: clan_relation, value: 15, tie: in_law }
          - { type: cutscene, id: ket_hon }
        result:
          - 'Tiếng trống chèo, tiếng chúc tụng vang khắp xóm. Họ thông gia vô cùng mát mặt, danh vọng họ {dynasty.family_name} vang xa.'
      - id: le_vua_phai
        text: Làm mâm cỗ ấm cúng vừa sức nhà và nộp đủ lệ cheo làng (1 quan, 3 thúng thóc)
        condition:
          all:
            - { var: household.money, op: '>=', value: 1 }
            - { var: household.food, op: '>=', value: 3 }
        effects:
          - { type: money, value: -1 }
          - { type: food, value: -3 }
          - { type: reputation, group: dan_lang, value: 3 }
          - { type: stress, value: -4 }
        result:
          - 'Buổi lễ trang nghiêm ấm áp, hai bên thông gia vui vẻ nâng chén rượu mừng.'
      - id: tiet_kiem
        text: Chỉ làm lễ gia tiên trong nhà cho đỡ tốn kém
        effects:
          - { type: reputation, group: dan_lang, value: -2 }
          - { type: stress, value: 2 }
        result:
          - 'Giữ được đồng tiền trong rương nhưng vài người trong làng xì xào chê nhà họ {dynasty.family_name} chặt chẽ.'

  - id: gd_nang_dau_moi_ve_nha
    title: Chuyện mẹ chồng nàng dâu khi đón dâu mới về nhà
    tags: [gia_dinh, tinh_than]
    cooldown_years: 5
    weight: 2.0
    condition:
      all:
        - { var: player.married, op: '==', value: true }
        - { var: household.members, op: '>=', value: 4 }
    text:
      - 'Sống chung dưới một mái nhà đông người khó tránh lúc bát đũa xô nhau. Chuyện bếp núc, chi tiêu vụn vặt khiến lời qua tiếng lại giữa người trước kẻ sau làm bữa cơm chiều trở nên nặng nề.'
    options:
      - id: khuyen_nhu_doi_ben
        text: Khéo léo lựa lời phân giải, giữ cả chữ Hiếu lẫn tình nghĩa vợ chồng
        trait_stress: { nong_nay: 6 }
        effects:
          - { type: filial_piety, value: 4 }
          - { type: stress, value: -5 }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
        result:
          - 'Nhờ sự điềm đạm của bạn, đôi bên đều nguôi giận, trong nhà lại êm ấm như xưa.'
      - id: nghiem_khac_nep_nha
        text: Đứng ra chấn chỉnh gia phong, phân định rõ việc ai nấy làm
        trait_stress: { nhan_tu: 5 }
        effects:
          - { type: skill_xp, skill: quan_tri, value: 12 }
          - { type: stress, value: 4 }
        result:
          - 'Mọi người im lặng nghe theo, công việc trật tự hơn nhưng không khí còn đôi chút gượng gạo.'

  - id: gd_anh_em_bat_hoa
    title: Anh em bất hòa chuyện công việc và gia sản
    tags: [gia_dinh, lao_dong]
    cooldown_years: 5
    weight: 2.0
    condition:
      all:
        - { var: player.children_count, op: '>=', value: 2 }
        - { var: household.members, op: '>=', value: 4 }
    text:
      - 'Các con trong nhà ngày một khôn lớn, mỗi đứa một tính nết. Hôm nay chỉ vì chuyện phân chia việc đồng áng và đèn sách mà anh chị em to tiếng tranh cãi ngay ngoài sân, đứa kêu thiệt thòi vất vả, đứa trách người kia lười nhác.'
    options:
      - id: day_nghia_dong_bao
        text: Gọi các con trước bàn thờ tổ tiên, răn dạy đạo lý anh em như thể tay chân
        effects:
          - { type: filial_piety, value: 5 }
          - { type: dynasty_prestige, value: 4 }
          - { type: stress, value: -4 }
        result:
          - 'Các con cúi đầu nhận lỗi, tự hứa từ nay trên thuận dưới hòa cùng vun đắp cơ nghiệp họ {dynasty.family_name}.'
      - id: thuong_phat_cong_minh
        text: Chia lại công việc rõ ràng và thưởng thêm tiền tiêu vặt cho đứa chịu khó (1 quan)
        condition:
          var: household.money
          op: '>='
          value: 1
        effects:
          - { type: money, value: -1 }
          - { type: skill_xp, skill: quan_tri, value: 15 }
          - { type: stress, value: -3 }
        result:
          - 'Thưởng phạt phân minh khiến đứa nào cũng tâm phục khẩu phục, hăng hái làm việc hơn.'
      - id: quat_mang
        text: Quát mắng nghiêm khắc bắt tất cả im tiếng ra đồng làm việc
        trait_stress: { nhan_tu: 6 }
        effects:
          - { type: stress, value: 5 }
        result:
          - 'Các con sợ hãi tản đi làm việc nhưng trong lòng vẫn còn ấm ức.'

  - id: gd_con_trai_xin_di_thi
    title: Con trai học giỏi xin tiền lều chõng đi thi
    tags: [gia_dinh, hoc_hanh]
    cooldown_years: 6
    weight: 3.0
    condition:
      all:
        - { var: player.has_scholar_son, op: '==', value: true }
    text:
      - 'Sau nhiều năm miệt mài đèn sách theo hướng giáo dục của gia đình, {child.scholar_name} đã thông thuộc kinh sử, được thầy đồ trong làng khen ngợi có chữ nghĩa hơn người. Kỳ thi Hương sắp mở, con quỳ trước thềm xin cha mẹ lo cho đôi quang gánh lều chõng và lộ phí lên trường thi thử sức.'
    options:
      - id: lo_du_leu_chong
        text: Dốc tiền nhà sắm sửa lều chõng, giấy bút cho con đi thi (3 quan)
        condition:
          var: household.money
          op: '>='
          value: 3
        effects:
          - { type: money, value: -3 }
          - { type: scholarly_prestige, value: 12 }
          - { type: dynasty_prestige, value: 10 }
          - { type: reputation, group: dan_lang, value: 5 }
          - { type: stress, value: -6 }
        result:
          - '{child.scholar_name} lạy tạ cha mẹ lên đường ứng thí, mang về tiếng thơm hiếu học cho dòng họ {dynasty.family_name}.'
      - id: goi_ghiem_tiet_kiem
        text: Gói ghém nắm cơm, muối vừng và ít tiền lẻ cho con đi thi (1 quan)
        condition:
          var: household.money
          op: '>='
          value: 1
        effects:
          - { type: money, value: -1 }
          - { type: scholarly_prestige, value: 7 }
          - { type: dynasty_prestige, value: 6 }
        result:
          - 'Dù hành trang đạm bạc, {child.scholar_name} vẫn quyết tâm vượt vũ môn làm rạng danh nếp nhà.'
      - id: giu_nha_phu_viec
        text: Nhà đang neo người thiếu thóc, bảo con tạm hoãn chờ khoa thi sau
        effects:
          - { type: stress, value: 6 }
          - { type: food, value: 4, ledger: thu_hoach }
        result:
          - '{child.scholar_name} buồn bã cất sách vở vào rương để ra đồng phụ giúp cha mẹ.'
