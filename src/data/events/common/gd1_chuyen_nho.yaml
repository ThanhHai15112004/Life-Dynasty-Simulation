        result: ['Đứa bé khóc thét, bỏ cả đàn dê mà chạy.']
      - id: mac_ke
        text: 'Mặc kệ, đi tiếp'
        default: true
        effects: [{ type: chance, p: 0.3, then: [{ type: wanted, value: 2 }] }]
        result: ['Bạn kéo vành nón thấp xuống, rẽ sang lối khác.']

