    options:
      - id: mua_vai
        text: 'Mua một khúc (1 quan)'
        effects:
          - { type: money, value: -1 }
          - { type: opinion, role: vc, value: 6 }
          - { type: stress, value: -1 }
        result: ['Cầm khúc vải, {role.vc.call} lườm bạn tiêu hoang, nhưng tối ấy cứ ướm đi ướm lại.']
      - id: thoi
        text: 'Thôi, để dành tiền'
        default: true
        result: ['Bạn mua nắm kẹo lạc thay vào, cả nhà chia nhau ăn.']

  - id: cn_nl_con_doi_lam_dieu
