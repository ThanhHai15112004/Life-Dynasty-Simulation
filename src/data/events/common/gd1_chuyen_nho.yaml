# [1] Chuyện nhỏ (minor: true): hiện ngay trong nhật ký, không dừng thời gian.
# Người chơi bấm chọn hoặc bỏ qua; quá hạn thì game tự chọn phương án có default: true.
# Mỗi chuyện 2–3 phương án một dòng, hậu quả nhỏ. Tiền tố id: cn_ (cn_tt_ thiếu thời, cn_nl_ người lớn, cn_g_ tuổi già, cn_c_ chung).
# Phương án default luôn không có condition và không tốn tiền, để lúc nào cũng tự chọn được.
events:
  # ── Thiếu thời (6–15) ──
  - id: cn_tt_cho_con_theo_ve
    title: Con chó con theo về
    tags: [gia_dinh]
    life_stages: [thieu_thoi]
    condition: { all: [{ var: player.age, op: between, value: [6, 12] }, { not: { has_flag: cn_nuoi_cho } }] }
    weight: 5
    once_per_life: true
    minor: true
    tension: 1
    importance: 3
    icon: cho
    text:
      - 'Một con chó con lông vàng cứ lẽo đẽo theo bạn từ bờ ao về tận ngõ, đuôi ve vẩy không thôi.'
    options:
      - id: xin_nuoi
        text: 'Xin mẹ cho nuôi, chia nó nửa bát cơm'
        effects:
          - { type: food, value: -0.5 }
          - { type: stress, value: -3 }
          - { type: set_flag, flag: cn_nuoi_cho, years: 12 }
        result: ['Bạn đặt tên nó là Vện. Từ hôm ấy đi đâu cũng có nó chạy theo.']
      - id: duoi_ve
        text: 'Đuổi nó về đầu ngõ'
        default: true
        effects: [{ type: stress, value: 1 }]
        result: ['Con chó đứng ở đầu ngõ nhìn theo một lúc rồi bỏ đi.']

  - id: cn_tt_meo_hoang_o_sap
    title: Con mèo mướp ở sạp
    tags: [buon_ban, gia_dinh]
    life_stages: [thieu_thoi]
    condition: { var: player.career, op: '==', value: thuong_nhan }
    weight: 4
    cooldown_years: 6
    minor: true
    tension: 1
    importance: 2
    icon: meo
    text:
      - 'Có con mèo mướp hoang hay lẻn vào gầm sạp nhà rình chuột. Mấy bao gạo đêm qua không bị cắn thủng.'
    options:
      - id: de_com_thua
        text: 'Để dành cơm thừa cho nó'
        effects:
          - { type: food, value: -0.3 }
          - { type: money, value: 0.5, ledger: buon_ban }
          - { type: stress, value: -1 }
        result: ['Con mèo ở lại. Cả mùa ấy hàng trong sạp không còn vết chuột gặm.']
      - id: mac_ke
        text: 'Mặc kệ nó'
        default: true
        result: ['Con mèo đến rồi đi, chẳng ai để ý.']

  - id: cn_tt_chim_sao_non
    title: Tổ sáo trên cây gạo
    tags: [lang_xa]
    life_stages: [thieu_thoi]
    months: [4, 5, 6]
    condition: { var: player.age, op: between, value: [8, 15] }
    weight: 4
    cooldown_years: 5
    minor: true
    tension: 1
    importance: 3
    icon: cay
    text:
      - 'Trên cành cây gạo đầu đình có tổ sáo non kêu chiêm chiếp. Lũ bạn bảo bắt về dạy nói được.'
    options:
      - id: treo_bat
        text: 'Trèo lên bắt một con'
        chance: { base: 0.55, skill: sinh_ton, per_level: 0.05 }
        success:
          - { type: stress, value: -3 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
        failure:
          - { type: health, value: -3 }
        success_result: ['Bạn mang về được một con sáo mỏ vàng, ngày nào cũng tập cho nó nói.']
        failure_result: ['Cành gãy, bạn rơi xuống bụi, xước hết hai đầu gối.']
      - id: de_yen
        text: 'Để chim mẹ nuôi con'
        default: true
        result: ['Bạn đứng dưới gốc nghe đàn sáo non kêu một lúc rồi về.']

  - id: cn_tt_doi_con_quay
    title: Đổi con quay gỗ
    tags: [quan_he]
    life_stages: [thieu_thoi]
    condition: { var: player.age, op: between, value: [6, 11] }
    weight: 4
    cooldown_years: 5
    minor: true
    tension: 1
    importance: 2
    icon: tre_em
    text:
      - 'Thằng bạn cùng xóm có con quay gỗ mít quay tít. Nó gạ đổi lấy cái ống sáo trúc cha làm cho bạn.'
    options:
      - id: doi
        text: 'Đổi luôn'
        effects:
          - { type: stress, value: -2 }
          - { type: skill_xp, skill: ngoai_giao, value: 5 }
        result: ['Con quay chạy vo vo trên sân gạch. Mấy hôm sau bạn lại tiếc ống sáo.']
      - id: giu_sao
        text: 'Giữ lại ống sáo của cha'
        default: true
        effects: [{ type: filial_piety, value: 1 }]
        result: ['Bạn lắc đầu. Ống sáo vẫn cài sau lưng mỗi lần ra đồng.']

  - id: cn_tt_tron_hoc_tam_song
    title: Rủ trốn học
    tags: [hoc_hanh, quan_he]
    life_stages: [thieu_thoi]
    condition: { all: [{ var: focus.primary, op: '==', value: hoc_chu }, { var: player.age, op: between, value: [7, 14] }] }
    weight: 5
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 3
    icon: sach
    text:
      - 'Trưa hè nóng như nung, lũ bạn rủ bạn giấu thầy đồ trốn ra sông tắm, chiều lại về ngồi như không có gì.'
    options:
      - id: tron_di
        text: 'Trốn đi một buổi'
        effects:
          - { type: stress, value: -3 }
          - { type: skill_xp, skill: ngoai_giao, value: 5 }
          - { type: filial_piety, value: -2 }
        result: ['Nước sông mát rượi. Tối về bạn không dám nhìn mặt cha.']
      - id: ngoi_chep_bai
        text: 'Ngồi lại chép bài'
        default: true
        effects:
          - { type: skill_xp, skill: hoc_van, value: 8 }
          - { type: stress, value: 1 }
        result: ['Lớp vắng tanh. Thầy liếc bạn một cái, không nói gì, nhưng gật gù.']

  - id: cn_tt_bat_de_choi
    title: Đi bắt dế chọi
    tags: [quan_he, lang_xa]
    life_stages: [thieu_thoi]
    months: [7, 8, 9]
    condition: { var: player.age, op: between, value: [7, 14] }
    weight: 4
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 2
    icon: tre_em
    text:
      - 'Đêm tháng bảy dế gáy ran ngoài bờ ruộng. Mấy đứa trong xóm hẹn nhau cầm đuốc đi bắt dế về chọi.'
    options:
      - id: di_bat
        text: 'Cầm đuốc đi theo'
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 6 }
          - { type: stress, value: -2 }
          - { type: health, value: -1 }
        result: ['Bạn bắt được một con dế than cánh bóng, đặt tên là Tướng Quân.']
      - id: o_nha
        text: 'Ở nhà đi ngủ'
        default: true
        result: ['Nằm trong nhà vẫn nghe tiếng lũ bạn gọi nhau ngoài ruộng.']

  - id: cn_tt_tien_mung_tuoi
    title: Tiền mừng tuổi
    tags: [gia_dinh, le_hoi]
    life_stages: [thieu_thoi]
    months: [1, 2]
    weight: 5
    cooldown_years: 3
    minor: true
    tension: 1
    importance: 2
    icon: tet
    text:
      - 'Sáng mồng một, ông bà và mấy bác trong họ dúi cho bạn một xâu tiền đồng mừng tuổi.'
    options:
      - id: dua_me_cat
        text: 'Đưa mẹ cất hộ'
        default: true
        effects:
          - { type: money, value: 0.5, ledger: thu_khac }
          - { type: filial_piety, value: 2 }
        result: ['Mẹ cười, bỏ xâu tiền vào cái ống tre treo trên cột.']
      - id: an_qua
        text: 'Ra chợ Tết ăn bánh rán với bạn'
        effects: [{ type: stress, value: -3 }]
        result: ['Bánh rán nóng, mật mía chảy ròng ròng. Xâu tiền hết lúc nào không biết.']
      - id: mua_but_muc
        text: 'Mua một thỏi mực, một tập giấy bản'
        condition: { any: [{ var: focus.primary, op: '==', value: hoc_chu }, { var: player.career, op: '==', value: si_tu }] }
        effects: [{ type: skill_xp, skill: hoc_van, value: 7 }]
        result: ['Bạn mài mực viết lại mấy chữ thầy dạy, giữ tờ đẹp nhất dán lên vách.']

  - id: cn_tt_cuoi_trau_thi
    title: Cưỡi trâu thi
    tags: [ruong_dong, quan_he]
    life_stages: [thieu_thoi]
    condition: { all: [{ has_property: trau }, { var: household.self_farms, op: '==', value: true }, { var: player.age, op: between, value: [7, 14] }] }
    weight: 5
    weight_modifiers:
      - { condition: { var: focus.primary, op: '==', value: phu_viec_dong }, factor: 2 }
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 3
    icon: trau
    text:
      - 'Chiều chăn trâu ở bãi sông, lũ trẻ rủ nhau cưỡi trâu thi xem con nào về tới gốc đa trước.'
    options:
      - id: cuoi_thi
        text: 'Lên lưng trâu, thúc nó chạy'
        chance: { base: 0.5, skill: sinh_ton, per_level: 0.05 }
        success:
          - { type: stress, value: -3 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
        failure:
          - { type: health, value: -3 }
        success_result: ['Trâu nhà bạn về nhất. Cả bãi sông reo ầm lên.']
        failure_result: ['Trâu chồm qua mương, bạn ngã sấp xuống bùn, đau ê ẩm mấy ngày.']
      - id: cho_trau_an
        text: 'Dắt trâu ra bãi xa cho ăn cỏ'
        default: true
        effects: [{ type: skill_xp, skill: sinh_ton, value: 5 }]
        result: ['Trâu no căng bụng. Tối về cha khen trâu béo.']

  - id: cn_tt_xau_tien_dong
    title: Xâu tiền cho cha
    tags: [buon_ban, gia_dinh]
    life_stages: [thieu_thoi]
    condition: { all: [{ var: player.career, op: '==', value: thuong_nhan }, { var: player.age, op: between, value: [7, 13] }] }
    roles:
      - { id: cha, from: family, relation: father }
    weight: 4
    cooldown_years: 5
    minor: true
    tension: 1
    importance: 2
    icon: tien
    text:
      - 'Tan phiên chợ, {role.cha.call} đổ ra chiếu một đống tiền đồng, bảo bạn xâu lại từng chuỗi cho đủ.'
    options:
      - id: xau_du
        text: 'Ngồi đếm, xâu cho đủ'
        default: true
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 7 }
          - { type: opinion, role: cha, value: 3 }
        result: ['Đếm đến mỏi tay mới xong. Cha cầm từng xâu lên ước, không thiếu đồng nào.']
      - id: bot_mot_dong
        text: 'Bớt lại vài đồng mua kẹo'
        condition: { var: household.money, op: '>=', value: 0.5 }
        trait_stress: { trung_thanh: 2 }
        effects:
          - { type: money, value: -0.5 }
          - { type: stress, value: -2 }
        result: ['Kẹo mạch nha ngọt lịm. Cha đếm lại, nhíu mày nhưng không hỏi.']

  - id: cn_tt_to_giay_ban_thua
    title: Tờ giấy bản thừa
    tags: [hoc_hanh]
    life_stages: [thieu_thoi]
    condition: { any: [{ var: player.career, op: '==', value: si_tu }, { var: player.origin, op: '==', value: quy_toc_nho }] }
    weight: 4
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 2
    icon: sach
    text:
      - 'Cha chép xong bài để lại mấy tờ giấy bản còn trắng một mặt.'
    options:
      - id: tap_viet
        text: 'Lấy ra tập viết chữ'
        default: true
        effects: [{ type: skill_xp, skill: hoc_van, value: 7 }]
        result: ['Bạn viết kín cả hai tờ. Nét chữ còn run, nhưng đã thẳng hơn hôm trước.']
      - id: gap_thuyen
        text: 'Gấp thuyền thả xuống mương'
        effects: [{ type: stress, value: -3 }]
        result: ['Thuyền giấy trôi một đoạn rồi ngấm nước chìm. Bạn chạy theo đến tận cống.']

  - id: cn_tt_nuoi_ga_con
    title: Mẹ giao nuôi gà
    tags: [gia_dinh, lao_dong]
    life_stages: [thieu_thoi]
    condition: { all: [{ var: household.self_farms, op: '==', value: true }, { var: player.age, op: between, value: [7, 13] }] }
    roles:
      - { id: me, from: family, relation: mother }
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 3
    icon: ga
    text:
      - '{role.me.call} đổi được mấy con gà con, bảo bạn nhận lấy mà nuôi, lớn lên bán được thì cho bạn may áo.'
    options:
      - id: nhan_nuoi
        text: 'Nhận nuôi, ngày ngày bắt giun cho gà'
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 6 }
          - { type: opinion, role: me, value: 4 }
          - { type: chance, p: 0.25, then: [{ type: property_add, property: dan_ga, count: 1 }] }
        result: ['Đàn gà lớn nhanh. Sáng nào bạn cũng dậy sớm cho chúng ăn trước khi đi chăn trâu.']
      - id: de_me_nuoi
        text: 'Để mẹ nuôi, mình còn mải chơi'
        default: true
        effects: [{ type: opinion, role: me, value: -3 }]
        result: ['Mẹ thở dài, quây đàn gà vào góc bếp.']

  - id: cn_tt_ban_nha_chai
    title: Đứa trẻ nhà chài
    tags: [quan_he, lang_xa]
    life_stages: [thieu_thoi]
    condition: { all: [{ var: world.settlement_type, op: '==', value: thi_tran_ben_song }, { var: player.age, op: between, value: [6, 13] }] }
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 3
    icon: ca
    text:
      - 'Có đứa trẻ nhà chài neo thuyền dưới bến, đen nhẻm, ngày nào cũng ngồi đầu mũi thuyền nhìn lũ trẻ trên bờ chơi đánh khăng.'
    options:
      - id: ru_choi
        text: 'Gọi nó lên bờ chơi cùng'
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 6 }
          - { type: stress, value: -2 }
        result: ['Nó bơi giỏi như rái cá, chỉ cho bạn cách lặn mò hến dưới chân bến.']
      - id: mac_ke
        text: 'Kệ nó, chơi với bạn quen'
        default: true
        result: ['Mấy hôm sau thuyền nhà chài nhổ neo đi đâu mất.']

  # ── Người lớn (16–55) ──
  - id: cn_nl_non_ba_tam
    title: Chiếc nón mới
    tags: [buon_ban]
    life_stages: [thanh_nien]
    condition: { var: household.money, op: '>=', value: 2 }
    weight: 4
    cooldown_years: 6
    minor: true
    tension: 1
    importance: 2
    icon: tien
    text:
      - 'Phiên chợ có bà hàng bán nón ba tầm quai thao, lòng nón dán giấy hoa. Cái nón cũ của bạn đã thủng hai chỗ.'
    options:
      - id: mua_non
        text: 'Mua một chiếc (0.5 quan)'
        condition: { var: household.money, op: '>=', value: 0.5 }
        effects:
          - { type: money, value: -0.5 }
          - { type: stress, value: -2 }
          - { type: reputation, value: 1 }
        result: ['Đội nón mới đi qua cổng làng, mấy cô gái đứng giếng ngoảnh lại nhìn.']
      - id: va_non_cu
        text: 'Lấy lá vá lại nón cũ'
        default: true
        result: ['Nón vá xong vẫn che được nắng. Tiết kiệm được đồng nào hay đồng ấy.']

  - id: cn_nl_hang_xom_muon_trau
    title: Hàng xóm mượn trâu
    tags: [ruong_dong, lang_xa, quan_he]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    months: [1, 2, 6, 7]
    condition: { has_property: trau }
    roles:
      - { id: hx, from: village, village_role: hang_xom }
    weight: 5
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 3
    icon: trau
    text:
      - 'Trâu nhà {role.hx.call} ốm giữa vụ. Người ta sang xin mượn trâu nhà bạn cày nốt hai sào.'
    options:
      - id: cho_muon
        text: 'Cho mượn, dặn cày nhẹ tay'
        effects:
          - { type: opinion, role: hx, value: 6 }
          - { type: stress, value: 1 }
        result: ['Ba hôm sau trâu về, gầy đi một chút. Hàng xóm biếu lại một rổ khoai.']
      - id: tu_choi_kheo
        text: 'Từ chối khéo, trâu nhà còn phải cày'
        default: true
        effects: [{ type: opinion, role: hx, value: -4 }]
        result: ['Người ta gật đầu đi về, nhưng mấy hôm liền gặp nhau không chào.']

  - id: cn_nl_muon_thuyen_nan
    title: Mượn thuyền chở hàng
    tags: [buon_ban, quan_he]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition: { all: [{ var: world.settlement_type, op: '==', value: thi_tran_ben_song }, { var: player.career, op: '==', value: thuong_nhan }] }
    roles:
      - { id: hx, from: village, village_role: hang_xom }
    weight: 4
    cooldown_years: 5
    minor: true
    tension: 1
    importance: 3
    icon: ca
    text:
      - '{role.hx.call} có mấy bao vôi cần chở lên bến trên, sang hỏi mượn chiếc thuyền nan nhà bạn hai ngày.'
    options:
      - id: cho_muon
        text: 'Cho mượn không lấy tiền'
        effects: [{ type: opinion, role: hx, value: 5 }]
        result: ['Thuyền về sạch sẽ, mạn còn được trát lại chỗ rò.']
      - id: cho_thue
        text: 'Lấy chút tiền thuê (1 quan)'
        effects:
          - { type: money, value: 1, ledger: buon_ban }
          - { type: opinion, role: hx, value: -3 }
        result: ['Người ta trả đủ tiền, nhưng ra về vẫn lẩm bẩm "chỗ hàng xóm cả".']
      - id: tu_choi
        text: 'Bảo thuyền đang phải dùng'
        default: true
        effects: [{ type: opinion, role: hx, value: -2 }]
        result: ['Người ta sang thuê thuyền nhà khác.']

  - id: cn_nl_mung_cuoi_ban
    title: Bạn cùng xóm cưới vợ
    tags: [quan_he, le_hoi]
    life_stages: [thanh_nien, lap_nghiep]
    condition: { var: player.mourning_months, op: '==', value: 0 }
    weight: 4
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 2
    icon: cuoi
    text:
      - 'Thằng bạn chăn trâu với bạn từ bé nay cưới vợ. Nhà trai dựng rạp lá chuối, mời bạn sang ăn cỗ.'
    options:
      - id: mung_tien
        text: 'Mừng một quan tiền'
        condition: { var: household.money, op: '>=', value: 1 }
        effects:
          - { type: money, value: -1 }
          - { type: reputation, value: 2 }
          - { type: stress, value: -2 }
        result: ['Bạn được xếp ngồi mâm trên. Chú rể rót rượu mời đến ba lần.']
      - id: mung_gao
        text: 'Mang thúng gạo nếp sang mừng'
        default: true
        effects:
          - { type: food, value: -0.5 }
          - { type: reputation, value: 1 }
        result: ['Quà quê mộc mạc, nhà trai vẫn vui vẻ nhận.']

