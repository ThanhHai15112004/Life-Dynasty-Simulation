  - id: cn_g_chau_doi_qua
    title: Cháu đòi quà
    tags: [gia_dinh]
    life_stages: [tuoi_gia]
    roles:
      - { id: chau, from: family, relation: member, condition: { all: [{ var: self.age, op: between, value: [3, 10] }, { var: self.in_household, op: '==', value: true }] } }
    weight: 5
    cooldown_years: 3
    minor: true
    tension: 1
    importance: 2
    icon: tre_em
    text:
      - 'Cháu {role.chau.given} chạy ra níu tay bạn, đòi tiền mua kẹo kéo của bà hàng rong đang rao ngoài ngõ.'
    options:
      - id: cho_tien
        text: 'Lần túi cho cháu mấy đồng'
        condition: { var: household.money, op: '>=', value: 0.5 }
        effects:
          - { type: money, value: -0.3 }
          - { type: opinion, role: chau, value: 6 }
        result: ['Cháu chạy vụt ra ngõ, lát sau mang về chia cho ông một mẩu kẹo.']
      - id: ke_chuyen
        text: 'Bế cháu lên, kể chuyện cổ tích'
        default: true
        effects:
          - { type: opinion, role: chau, value: 3 }
          - { type: stress, value: -1 }
        result: ['Đến đoạn Thạch Sanh chém chằn tinh, cháu quên luôn kẹo kéo.']

  - id: cn_g_cau_ca_ao_lang
