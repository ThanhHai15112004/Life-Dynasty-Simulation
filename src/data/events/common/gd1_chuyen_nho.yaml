    cooldown_years: 8
    minor: true
    tension: 1
    importance: 2
    icon: cay
    text:
      - 'Ông lão ở chợ huyện bày bán một chậu sanh uốn thế rồng chầu, rễ ôm đá, xin một quan rưỡi.'
    options:
      - id: mua_chau
        text: 'Mua về đặt trước hiên (1.5 quan)'
        effects:
          - { type: money, value: -1.5 }
          - { type: stress, value: -3 }
          - { type: reputation, value: 1 }
        result: ['Chiều chiều bạn ra tỉa lá, ngắm thế cây, thấy lòng nhẹ hẳn.']
      - id: thoi
        text: 'Ngắm một lúc rồi đi'
        default: true
        result: ['Tiền ấy đủ đong thóc cho cả nhà mấy tuần. Bạn quay đi.']

  - id: cn_nl_qua_cho_cha_me
    title: Quà chợ cho cha mẹ
