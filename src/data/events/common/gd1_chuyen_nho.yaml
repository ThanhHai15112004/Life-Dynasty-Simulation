          - { type: stress, value: -1 }
        result: ['Đêm ấy cả nhà rúc chung một chăn, không ai bị rét cóng.']
      - id: o_rom
        text: 'Lót thêm ổ rơm cho qua mùa'
        default: true
        effects: [{ type: stress, value: 1 }]
        result: ['Ổ rơm sột soạt, cũng đủ ấm qua những đêm rét nhất.']

  - id: cn_nl_viet_thu_ho
