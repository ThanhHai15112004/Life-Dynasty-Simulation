      - id: dung_muc_cu
        text: 'Dùng nốt thỏi mực cũ'
        default: true
        effects: [{ type: skill_xp, skill: hoc_van, value: 4 }]
        result: ['Mực cũ nhạt màu, nhưng chữ là ở tay người viết.']

  - id: cn_nl_mai_luoi_dao
    title: Mài lại lưỡi đao
