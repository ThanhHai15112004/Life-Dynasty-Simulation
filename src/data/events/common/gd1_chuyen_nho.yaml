    options:
      - id: lam_cung_con
        text: 'Chẻ tre, dán giấy làm cùng con'
        effects:
          - { type: opinion, role: con, value: 6 }
          - { type: stress, value: -3 }
        result: ['Diều lên cao, sáo diều vi vu. Con chạy theo dây, cười không ngớt.']
      - id: bao_tu_lam
        text: 'Bảo con tự làm lấy'
        default: true
        effects: [{ type: opinion, role: con, value: -3 }]
        result: ['Con hì hục cả buổi, diều méo xệch, bay được một đoạn thì cắm đầu xuống ruộng.']

