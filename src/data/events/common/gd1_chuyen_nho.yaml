    options:
      - id: di_xem
        text: 'Đi xem đến khuya'
        condition: { var: household.money, op: '>=', value: 0.3 }
        effects:
          - { type: money, value: -0.3 }
          - { type: stress, value: -4 }
        result: ['Đến đoạn người con bị đuổi khỏi nhà, cả sân đình lặng đi. Bạn về nhà lúc gà gáy.']
      - id: ngu_som
        text: 'Ở nhà ngủ sớm, mai còn dậy sớm'
        default: true
        result: ['Nằm trong nhà vẫn nghe tiếng trống chèo vọng lại đến nửa đêm.']

  - id: cn_nl_chau_sanh_the
