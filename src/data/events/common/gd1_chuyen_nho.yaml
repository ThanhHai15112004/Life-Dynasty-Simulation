    options:
      - id: nuoi_giu_nha
        text: 'Cho ăn, giữ lại trông nhà'
        effects:
          - { type: food, value: -0.5 }
          - { type: stress, value: -2 }
          - { type: set_flag, flag: cn_nuoi_cho, years: 10 }
        result: ['Được mấy bữa cơm, con vện béo lên trông thấy. Đêm có tiếng động là nó sủa vang.']
      - id: xua_di
        text: 'Xua nó đi chỗ khác'
        default: true
        result: ['Con chó lững thững đi sang xóm khác.']

  - id: cn_nl_khuc_vai_cho_vo
