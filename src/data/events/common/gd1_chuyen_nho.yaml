    options:
      - id: mua_qua
        text: 'Mua buồng cau non, gói chè ngon (0.5 quan)'
        effects:
          - { type: money, value: -0.5 }
          - { type: filial_piety, value: 3 }
          - { type: opinion, role: cm, value: 5 }
        result: ['Ngồi têm trầu, {role.cm.call} cười móm mém, bảo con lớn thật rồi.']
      - id: de_danh
        text: 'Thôi, để dành tiền lo việc khác'
        default: true
        result: ['Bạn đi thẳng qua hàng trầu.']

  - id: cn_nl_van_co_goc_da
    title: Ván cờ dưới gốc đa
