      - id: lay_tien_cong
        text: 'Viết, lấy chút tiền giấy mực'
        effects:
          - { type: money, value: 0.5, ledger: thu_khac }
          - { type: reputation, value: -1 }
        result: ['Bà cụ móc túi trả từng đồng, không kêu ca gì.']
      - id: ban_viec
        text: 'Đang bận, hẹn bà hôm khác'
        default: true
        result: ['Bà cụ chống gậy sang nhờ ông đồ làng bên.']

