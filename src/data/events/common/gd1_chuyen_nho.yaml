    condition: { var: household.money, op: '>=', value: 2 }
    weight: 4
    cooldown_years: 4
    minor: true
    tension: 1
    importance: 2
    icon: chen_tra
    text:
      - 'Dưới gốc đa đầu làng, mấy ông bày bàn cờ vẽ trên chiếu, mỗi ván đặt một quan.'
    options:
      - id: ngoi_danh
        text: 'Ngồi vào đánh một ván'
        trait_stress: { than_trong: 2 }
        chance: { base: 0.4, skill: muu_luoc, per_level: 0.05 }
        success:
          - { type: money, value: 1, ledger: thu_khac }
          - { type: skill_xp, skill: muu_luoc, value: 8 }
        failure:
          - { type: money, value: -1 }
          - { type: stress, value: 2 }
        success_result: ['Bạn chiếu tướng nước cuối. Ông kia vỗ đùi, móc tiền trả.']
        failure_result: ['Mải ăn quân, bạn hở mất tướng. Một quan tiền đi tong.']
      - id: dung_xem
        text: 'Đứng xem, học nước đi'
        default: true
        effects: [{ type: skill_xp, skill: muu_luoc, value: 5 }]
        result: ['Xem hết buổi chiều, bạn nhớ được mấy thế cờ hay.']

  - id: cn_nl_cho_vang_truoc_cong
    title: Chó lạc trước cổng
