# [2] Sự kiện quyết định Phase 2: Tách hộ (ra ở riêng), Lập di chúc, Tranh chấp thừa kế & Đỡ xui họ hàng
events:
  - id: gd_xin_ra_o_rieng
    title: Chuyện ra ở riêng
    tags: [gia_dinh]
    life_stages: [thanh_nien, lap_nghiep]
    cooldown_years: 8
    once_per_life: true
    weight: 1.5
    condition:
      all:
        - { var: player.can_split_household, op: '==', value: true }
        - { var: player.married, op: '==', value: true }
        - { var: household.is_split, op: '==', value: false }
        - { var: household.members, op: '>=', value: 3 }
    text:
      - 'Vợ chồng bạn cưới nhau đã được một thời gian. Gian buồng nhỏ ngày một chật chội, đôi lúc chuyện bếp núc chung đụng cũng khó tránh lời ra tiếng vào. Bạn bàn với người bạn đời chuyện thưa với cha mẹ xin dựng nếp nhà riêng.'
    options:
      - id: xin_phan_gia
        text: Thưa chuyện lễ phép, xin cha mẹ cắt phần cho ra ở riêng
        effects:
          - { type: split_household, share_factor: 1 }
          - { type: filial_piety, value: 2 }
        result:
          - 'Cha mẹ gật đầu thuận tình, gọi chú bác trong họ sang chứng giám việc chia phần ruộng vườn và thóc giống để vợ chồng bạn dựng mái nhà mới.'
      - id: ra_rieng_tu_luc
        text: Xin ra riêng tay trắng, nhường ruộng lại phụng dưỡng cha mẹ
        effects:
          - { type: split_household, share_factor: 0 }
          - { type: filial_piety, value: 8 }
          - { type: reputation, group: dan_lang, value: 6 }
        result:
          - 'Cả họ khen bạn biết nghĩ cho cha mẹ và anh em. Dù khởi đầu thiếu thốn, tiếng thơm hiếu thuận vang khắp làng.'
      - id: o_lai_chung
        text: Chưa vội, ở lại sum vầy phụng dưỡng cha mẹ thêm ít năm
        effects:
          - { type: filial_piety, value: 5 }
          - { type: stress, value: 3 }
        result:
          - 'Bạn gác chuyện ra riêng lại. Bữa cơm đại gia đình vẫn đông đủ, chỉ cần vợ chồng nhường nhịn nhau thêm một chút.'

  - id: gd_cha_lap_di_chuc
    title: Lời dặn trước lúc lâm chung
    tags: [gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    cooldown_years: 15
    once_per_life: true
    weight: 3
    roles:
      - id: cha_gia
        from: family
        relation: parent
        condition: { var: self.age, op: '>=', value: 58 }
    condition:
      all:
        - { var: household.farmland, op: '>=', value: 3 }
    text:
      - '{role.cha_gia.call} tuổi cao sức yếu, biết mình chẳng còn ở với con cháu được bao lâu nên gọi các con lại bên giường, mở tráp lấy giấy mực dặn dò chuyện hương hỏa và ruộng vườn.'
    options:
      - id: theo_le_nho_giao
        text: 'Vâng lời giữ đúng lễ Nho giáo: ưu tiên hương hỏa tổ tiên'
        effects:
          - { type: filial_piety, value: 6 }
          - { type: reputation, group: dan_lang, value: 4 }
          - { type: set_flag, flag: co_di_chuc, years: 20 }
        result:
          - '{role.cha_gia.call} yên lòng điểm chỉ vào tờ chúc thư, giao phần ruộng hương hỏa rõ ràng để ngày sau anh em không điều tiếng.'
      - id: xin_chia_deu
        text: Khuyên người chia đồng đều hơn để anh em đỡ tị hiềm
        effects:
          - { type: opinion, role: cha_gia, value: 4 }
          - { type: stress, value: -3 }
          - { type: set_flag, flag: co_di_chuc, years: 20 }
        result:
          - '{role.cha_gia.call} trầm ngâm hồi lâu rồi gật đầu, bớt một phần ruộng thờ để đỡ đần cho các con thứ.'

  - id: gd_tranh_chap_di_san
    title: Phân chia gia sản sau tang cha
    tags: [gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    cooldown_years: 20
    once_per_life: true
    weight: 2
    condition:
      all:
        - { not: { has_flag: co_di_chuc } }
        - { var: player.mourning_months, op: '>', value: 0 }
    text:
      - 'Cha mất đột ngột chưa kịp để lại chúc thư. Trong buổi họp họ phân chia ruộng đất và của cải, mấy anh em bắt đầu nảy sinh bất đồng về phần ruộng hương hỏa và bờ bãi.'
    options:
      - id: moi_toc_truong
        text: Mời bậc trưởng tộc phân xử đúng lệ hương hỏa và chia phần
        effects:
          - { type: trigger_inheritance, share_factor: 1 }
          - { type: filial_piety, value: 4 }
          - { type: reputation, group: dan_lang, value: 3 }
        result:
          - 'Trưởng tộc chiếu theo gia pháp phân định rạch ròi: phần hương hỏa về tay con trưởng, phần dư chia đều cho các chi.'
      - id: nhuong_bot_cho_em
        text: Nhường bớt một phần của mình để giữ trọn hòa khí anh em
        effects:
          - { type: trigger_inheritance, share_factor: 0.75 }
          - { type: filial_piety, value: 8 }
          - { type: reputation, group: dan_lang, value: 8 }
          - { type: stress, value: -5 }
        result:
          - 'Thấy bạn không màng thiệt hơn, anh em trong nhà đều cảm kích, tình máu mủ thêm bền chặt.'
      - id: tranh_phan_hon
        text: Cương quyết đòi phần hơn vì công sức mình đóng góp nhiều nhất
        effects:
          - { type: trigger_inheritance, share_factor: 1.25 }
          - { type: filial_piety, value: -8 }
          - { type: reputation, group: dan_lang, value: -6 }
          - { type: stress, value: 8 }
        result:
          - 'Bạn giữ được phần ruộng và tiền nhiều hơn, nhưng ánh mắt anh em họ hàng nhìn bạn từ đó lạnh nhạt hẳn.'

  - id: gd_ho_hang_cuu_giup
    title: Anh em họ hàng đùm bọc lúc ngặt nghèo
    tags: [gia_dinh, tinh_lang, co_hoi]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]   # trẻ con không đứng ra nhận/từ chối của họ hàng
    cooldown_years: 4
    weight: 2
    condition:
      any:
        - { var: world.bad_luck, op: '>=', value: 3 }
        - { var: household.debt, op: '>=', value: 25 }
    text:
      - 'Thấy nhà bạn liên tiếp gặp chuyện không may, người trong họ và bà con lối xóm bảo nhau gom góp ít thóc gạo cùng mấy quan tiền mang sang đỡ đần qua cơn bĩ cực.'
    options:
      - id: nhan_on_tinh
        text: Cảm kích nhận tấm lòng của họ hàng làng xóm
        effects:
          - { type: money, value: 12 }
          - { type: food, value: 20 }
          - { type: stress, value: -10 }
        result:
          - 'Một miếng khi đói bằng một gói khi no. Nhờ sự đùm bọc của họ tộc, gian bếp nhà bạn ấm lửa trở lại.'
      - id: nhan_mot_nua
        text: Chỉ nhận chút gạo nấu cháo, quyết tự sức vực dậy cơ ngơi
        effects:
          - { type: food, value: 15 }
          - { type: reputation, group: dan_lang, value: 6 }
          - { type: stress, value: -6 }
        result:
          - 'Bà con quý trọng khí khái tự trọng của bạn, hứa có việc làm thêm sẽ gọi bạn trước tiên.'

  # [2] Sự kiện Phase 3: Ngày đầu làm chủ nhà sau tang cha, Di nguyện đời trước, Nhận con nuôi / Đón cháu họ
  - id: gd_ngay_dau_lam_chu_sau_tang
    title: Ngày đầu làm chủ nhà sau tang cha
    tags: [gia_dinh, tinh_lang]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    cooldown_years: 30
    once_per_life: true
    weight: 3
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { var: player.mourning_months, op: '>', value: 0 }
    text:
      - 'Khói hương trên bàn thờ chưa kịp nguội, sổ sách và chìa khóa rương đã nằm trong tay bạn. Ngoài sân, mấy người trong họ cùng chủ nợ, tá điền kéo đến dò xét xem người chủ mới của Đời thứ {dynasty.generation} họ {dynasty.family_name} sẽ điều hành cơ ngơi ra sao.'
    options:
      - id: nhan_nhin_mem_mong
        text: Nén lòng nhẫn nhịn, ăn nói mềm mỏng để giữ hòa khí trong ngoài
        trait_stress:
          nong_nay: 12
        effects:
          - { type: filial_piety, value: 5 }
          - { type: reputation, group: dan_lang, value: 5 }
          - { type: dynasty_prestige, value: 4 }
        result:
          - 'Dù có kẻ buông lời cậy thế bậc trưởng bối, bạn vẫn điềm tĩnh đối đáp đâu ra đấy. Ai nấy đều nể sự chín chắn của chủ hộ mới.'
      - id: dap_ban_ran_de
        text: Đập bàn dằn mặt những kẻ định nhân lúc tang gia bối rối mà lấn lướt
        trait_stress:
          kien_nhan: 10
          nhan_tu: 8
        effects:
          - { type: stress, value: -6 }
          - { type: reputation, group: dan_lang, value: -3 }
          - { type: skill_xp, skill: muu_luoc, value: 18 }
        result:
          - 'Tiếng quát đanh thép của bạn khiến cả gian nhà im phăng phắc. Kẻ có ý đồ xấu phải cụp mắt rút lui, không ai dám xem thường chủ mới.'
      - id: chấn_chỉnh_so_sach
        text: Khép cửa kiểm kê ruộng đất, thóc lúa và phân công lại việc nhà
        effects:
          - { type: skill_xp, skill: quan_tri, value: 22 }
          - { type: food, value: 8 }
        result:
          - 'Bạn thức trắng đêm bên ngọn đèn dầu rà soát từng sào ruộng, từng thúng thóc, lập lại trật tự rõ ràng cho gia đình.'

  - id: gd_di_nguyen_cha_ong
    title: Di nguyện còn dang dở của tiền nhân
    tags: [gia_dinh, hoc_tap]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    cooldown_years: 8
    once_per_life: true
    weight: 2.5
    condition:
      all:
        - { var: dynasty.has_unfulfilled_wish, op: '==', value: true }
        - { var: player.age, op: '>=', value: 18 }
    text:
      - 'Đêm thanh vắng, bạn mở chiếc tráp gỗ cũ của {dynasty.wish_from}, đọc lại dòng chữ dặn dò con cháu về tâm nguyện chưa thành: "{dynasty.wish_text}". Ánh đèn dầu hắt lên bài vị tổ tiên như nhắc nhở trách nhiệm của người kế nghiệp.'
    options:
      - id: the_hoan_thanh
        text: Thề trước bàn thờ sẽ dốc sức hoàn thành tâm nguyện của tiền nhân
        effects:
          - { type: filial_piety, value: 8 }
          - { type: dynasty_prestige, value: 6 }
          - { type: skill_xp, skill: quan_tri, value: 15 }
        result:
          - 'Bạn kính cẩn vái lạy trước bàn thờ. Ý chí nối nghiệp tổ tiên tiếp thêm sức mạnh cho bạn trên chặng đường phía trước.'
      - id: hoan_thanh_ngay_bang_cua_cai
        text: Xuất 15 quan tiền tích lũy để thực hiện ngay di nguyện của cha ông
        condition:
          var: household.money
          op: '>='
          value: 15
        effects:
          - { type: money, value: -15 }
          - { type: fulfill_wish }
          - { type: filial_piety, value: 10 }
          - { type: stress, value: -10 }
        result:
          - 'Dùng số của cải chắt chiu được, bạn hoàn tất trọn vẹn di nguyện "{dynasty.wish_text}", tiếng thơm hiếu nghĩa vang khắp vùng.'
      - id: tuy_duyen_lo_truoc_mat
        text: Cất kỹ vào tráp, ưu tiên lo miếng cơm manh áo cho người đang sống trước
        effects:
          - { type: stress, value: -4 }
          - { type: filial_piety, value: -3 }
        result:
          - 'Bạn khép tráp lại. Người khuất đã khuất, việc cấp bách trước mắt vẫn là giữ cho gia đình hiện tại được ấm no.'

  - id: gd_nhan_con_nuoi_noi_doi
    title: Nỗi lo tuyệt tự và chuyện lập tự
    tags: [gia_dinh]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    cooldown_years: 6
    weight: 2.2
    condition:
      all:
        - { var: player.age, op: '>=', value: 32 }
        - { var: player.children_count, op: '==', value: 0 }
    text:
      - 'Tuổi đời ngày một chồng chất mà trong nhà vẫn vắng tiếng trẻ thơ. Các bậc trưởng bối trong họ {dynasty.family_name} bắt đầu nhắc chuyện nhận con nuôi hoặc đón cháu họ về lập tự để sau này có người chống gậy, giữ lửa hương hỏa.'
    options:
      - id: nhan_con_nuoi
        text: Làm lễ nhận một đứa trẻ hiền lành làm con nuôi (2 quan)
        condition:
          var: household.money
          op: '>='
          value: 2
        effects:
          - { type: money, value: -2 }
          - { type: adopt_child, sex: m }
          - { type: stress, value: -8 }
        result:
          - 'Từ hôm ấy trong nhà rộn ràng tiếng gọi cha mẹ. Bạn có người nối dõi sớm hôm quây quần.'
      - id: don_chau_ho
        text: Đón một người cháu họ từ chi xa về truyền dạy nghề nhà (3 quan)
        condition:
          var: household.money
          op: '>='
          value: 3
        effects:
          - { type: money, value: -3 }
          - { type: adopt_relative, sex: m }
          - { type: filial_piety, value: 4 }
        result:
          - 'Người cháu họ chăm chỉ về ở cùng, vừa phụ giúp đồng áng vừa giữ vững gốc gác huyết thống họ {dynasty.family_name}.'
      - id: cho_duyen_troi
        text: Chưa vội, vẫn tin trời đất sẽ cho mình mụn con ruột
        effects:
          - { type: stress, value: 3 }
        result:
          - 'Bạn khước từ lời khuyên của họ tộc, lòng vẫn nuôi hy vọng vào duyên con cái.'

