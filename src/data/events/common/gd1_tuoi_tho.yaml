# [1] Sự kiện quyết định tuổi thơ & thiếu thời (6–15 tuổi) cho cả ba xuất thân.
# Mốc đời dùng once_per_life; chuyện riêng nhà nông / nhà buôn bến sông / nhà nho chặn bằng player.career.
# Hai chuỗi hai hồi: tt_ket_ban_dua_tre_lang_thang → tt_ban_xa_tro_ve, tt_nhat_cua_roi → tt_nguoi_mat_cua_tra_on.
events:
  # ── Nhà nông ──
  - id: tt_nong_theo_cha_ra_dong
    title: Lần đầu theo cha ra đồng
    tags: [ruong_dong, lao_dong, gia_dinh]
    life_stages: [thieu_thoi]
    months: [1, 2, 6, 7]
    condition:
      all:
        - { var: household.career, op: '==', value: nong_dan }
        - { var: household.self_farms, op: '==', value: true }
        - { var: player.age, op: between, value: [7, 10] }
    roles:
      - { id: cha, from: family, relation: father }
    weight: 8
    once_per_life: true
    tension: 2
    importance: 5
    icon: ruong
    text:
      - 'Vào vụ cấy, {role.cha.call} dựng bạn dậy từ lúc gà gáy. Ruộng ngập nước lạnh buốt, bùn lún đến bắp chân. Cha đưa cho bạn một nắm mạ, bảo cắm cho thẳng hàng.'
    options:
      - id: cay_den_trua
        text: 'Cắn răng cấy đến trưa như người lớn'
        trait_stress: { tu_do: 3 }
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 22 }
          - { type: health, value: -3 }
          - { type: filial_piety, value: 4 }
        result: ['Đến trưa lưng bạn mỏi rã, hàng mạ xiêu vẹo. {role.cha.call} không khen, chỉ dúi cho bạn nắm cơm nắm to nhất.']
      - id: bat_cua_bo_ruong
        text: 'Cấy được một lúc thì lên bờ bắt cua cho mẹ nấu canh'
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: food, value: 1, ledger: thu_khac }
          - { type: stress, value: -3 }
        result: ['Bạn bắt được nửa giỏ cua đồng. Tối ấy cả nhà có bát canh rau đay nấu cua, cha cũng chẳng mắng.']
      - id: hoi_cha_cach_xem_troi
        text: 'Vừa cấy vừa hỏi cha cách xem trời đoán nước'
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 14 }
          - { type: skill_xp, skill: muu_luoc, value: 8 }
          - { type: opinion, role: cha, value: 6 }
        result: ['{role.cha.call} chỉ đàn chuồn chuồn bay thấp, bảo chiều nay thế nào cũng mưa. Quả nhiên chiều mưa thật.']

  - id: tt_nong_chan_trau_lac
    title: Trâu lạc lúc chạng vạng
    tags: [ruong_dong, nguy_hiem, gia_dinh]
    life_stages: [thieu_thoi]
    condition:
      all:
        - { var: household.career, op: '==', value: nong_dan }
        - { has_property: trau }
        - { var: player.age, op: between, value: [7, 13] }
    roles:
      - { id: cha, from: family, relation: parent }
    weight: 6
    once_per_life: true
    tension: 4
    importance: 6
    icon: trau
    text:
      - 'Mải đánh khăng với lũ bạn chăn trâu, lúc ngẩng lên thì con trâu nhà bạn đã mất hút sau bãi lau. Trời sắp tối, sương bốc trắng mặt sông. Cả nhà trông vào con trâu ấy để cày vụ tới.'
    options:
      - id: tim_mot_minh
        text: 'Một mình lội bãi lau đi tìm'
        hint: 'Tìm thấy thì êm chuyện, không thấy thì nguy'
        trait_stress: { than_trong: 3 }
        chance: { base: 0.45, skill: sinh_ton, per_level: 0.06 }
        success:
          - { type: skill_xp, skill: sinh_ton, value: 18 }
          - { type: filial_piety, value: 3 }
        failure:
          - { type: health, value: -5 }
          - { type: stress, value: 6 }
          - { type: opinion, role: cha, value: -6 }
        success_result: ['Bạn lần theo dấu chân trâu trên bùn, thấy nó đang đằm dưới vũng nước cuối bãi. Bạn dắt nó về đến ngõ thì đèn nhà đã thắp.']
        failure_result: ['Bạn lạc trong lau đến nửa đêm, gai cào rách cả chân. Sáng ra người làng mới tìm thấy con trâu đang gặm cỏ ở ruộng làng bên.']
      - id: ve_bao_nha
        text: 'Chạy về báo {role.cha.call}, chịu đòn'
        effects:
          - { type: stress, value: 4 }
          - { type: opinion, role: cha, value: -3 }
          - { type: filial_piety, value: 2 }
        result: ['{role.cha.call} quát một tiếng rồi vác đuốc đi ngay. Trâu tìm được trước khi khuya, còn bạn thì bị phạt nhịn cơm tối.']
      - id: ru_ban_cung_tim
        text: 'Hô lũ bạn chăn trâu chia nhau đi tìm'
        chance: { base: 0.55, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
        failure:
          - { type: stress, value: 4 }
          - { type: reputation, group: dan_lang, value: -2 }
        success_result: ['Mỗi đứa một ngả, đứa nào tìm thấy thì thổi sáo. Chưa tàn nén hương đã nghe tiếng sáo đầu bãi.']
        failure_result: ['Lũ bạn sợ ma bãi lau, đứa nào cũng chuồn về nhà. Chuyện bạn để lạc trâu đến tai cả xóm.']

  # ── Nhà buôn bến sông ──
  - id: tt_buon_trong_sap_mot_minh
    title: Một mình trông sạp
    tags: [buon_ban, gia_dinh]
    life_stages: [thieu_thoi]
    condition:
      all:
        - { var: household.career, op: '==', value: thuong_nhan }
        - { var: player.age, op: between, value: [9, 14] }
    roles:
      - { id: cha, from: family, relation: parent }
    weight: 7
    once_per_life: true
    tension: 3
    importance: 5
    icon: cho
    text:
      - '{role.cha.call} xuống bến nhận hàng, dặn bạn trông sạp đến trưa. Một bà khách đứng tuổi cầm tấm vải lên xem đi xem lại, rồi trả bằng nửa giá {role.cha.call} đã dặn.'
    options:
      - id: giu_gia
        text: 'Giữ đúng giá cha dặn, chịu mất khách'
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 10 }
          - { type: opinion, role: cha, value: 5 }
        result: ['Bà khách bĩu môi bỏ đi. Cả buổi sạp chẳng bán được gì, nhưng {role.cha.call} về nghe kể thì gật đầu.']
      - id: bot_gia
        text: 'Bớt giá một chút cho được việc'
        chance: { base: 0.45, skill: thuong_mai, per_level: 0.06 }
        success:
          - { type: money, value: 1, ledger: buon_ban }
          - { type: skill_xp, skill: thuong_mai, value: 18 }
        failure:
          - { type: money, value: -1, ledger: su_kien }
          - { type: stress, value: 3 }
        success_result: ['Bạn bớt đúng chỗ còn lãi. Bà khách mua thêm cả cuộn chỉ. {role.cha.call} xem sổ, bảo con có mắt buôn.']
        failure_result: ['Bạn bớt quá tay, bán dưới cả giá vốn. {role.cha.call} không nói gì, chỉ thở dài lúc đếm tiền.']
      - id: moi_hang_khac
        text: 'Khen bà có mắt, mời xem loại vải rẻ hơn'
        chance: { base: 0.4, skill: ngoai_giao, per_level: 0.06 }
        success:
          - { type: money, value: 1, ledger: buon_ban }
          - { type: skill_xp, skill: ngoai_giao, value: 18 }
        failure:
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
          - { type: stress, value: 2 }
        success_result: ['Bà khách bật cười vì đứa trẻ khéo miệng, mua liền hai tấm vải thô.']
        failure_result: ['Bạn nói lắp bắp, bà khách lắc đầu đi sang sạp bên.']

  - id: tt_buon_theo_thuyen_hang
    title: Chuyến thuyền hàng đầu tiên
    tags: [buon_ban, nguy_hiem, thoi_co]
    life_stages: [thieu_thoi]
    months: [3, 4, 9, 10, 11]
    condition:
      all:
        - { var: household.career, op: '==', value: thuong_nhan }
        - { var: player.age, op: between, value: [11, 15] }
    roles:
      - { id: cha, from: family, relation: father }
    weight: 6
    once_per_life: true
    tension: 4
    importance: 6
    icon: tien
    text:
      - 'Thuyền nhà sắp xuôi xuống bến dưới lấy muối và cá khô, đi về mất mười ngày. {role.cha.call} hỏi bạn có muốn theo không. Mẹ thì lo sông dưới nhiều ghềnh, lại đồn có cướp đường thủy.'
    options:
      - id: theo_thuyen
        text: 'Theo thuyền, học cách mua hàng tận gốc'
        chance: { base: 0.65, skill: sinh_ton, per_level: 0.05 }
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 22 }
        success:
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: opinion, role: cha, value: 6 }
        failure:
          - { type: health, value: -5 }
          - { type: stress, value: 4 }
        success_result: ['Bạn được ngồi cạnh {role.cha.call} lúc mặc cả với chủ ruộng muối. Lần đầu bạn hiểu vì sao hàng về đến bến mình lại đắt gấp đôi.']
        failure_result: ['Sóng ghềnh làm bạn say lả mấy ngày, nằm bẹp trong khoang. Hàng vẫn mua được, nhưng bạn về gầy rộc.']
      - id: lam_phu_cheo
        text: 'Theo thuyền nhưng xin chèo thay phu để học nghề sông nước'
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 18 }
          - { type: skill_xp, skill: thuong_mai, value: 10 }
          - { type: health, value: -2 }
          - { type: money, value: 1, ledger: thu_khac }
        result: ['Tay bạn phồng rộp vì mái chèo. Ông lái già dạy bạn đọc dòng nước xoáy, cuối chuyến còn chia cho bạn một quan tiền công.']
      - id: o_nha_trong_sap
        text: 'Ở nhà phụ mẹ trông sạp'
        trait_stress: { tham_vong: 3, tu_do: 3 }
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 10 }
          - { type: filial_piety, value: 3 }
          - { type: stress, value: -2 }
        result: ['Mười ngày ấy bạn thay cha mở sạp sớm, đóng sạp muộn. Mẹ đi đâu cũng khen con biết lo.']

  # ── Nhà nho ──
  - id: tt_nho_le_khai_tam
    title: Lễ khai tâm
    tags: [hoc_hanh, van_minh, gia_dinh]
    life_stages: [thieu_thoi]
    months: [1, 2]
    condition:
      all:
        - { var: household.career, op: '==', value: si_tu }
        - { var: player.age, op: between, value: [6, 8] }
    roles:
      - { id: cha, from: family, relation: father }
      - { id: thay, from: village, village_role: thay_do }
    weight: 9
    once_per_life: true
    tension: 3
    importance: 7
    icon: sach
    text:
      - 'Đầu xuân, {role.cha.call} chọn ngày tốt đưa bạn đến xin {role.thay.call} làm lễ khai tâm. Nhà đã sa sút, nhưng các cụ trong họ vẫn nhìn vào xem con cháu nhà hương hào cũ đi học có ra dáng không.'
    options:
      - id: le_hau
        text: 'Sửa lễ hậu: xôi gà, cau rượu, một quan tiền'
        condition: { var: household.money, op: '>=', value: 2 }
        effects:
          - { type: money, value: -2, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 22 }
          - { type: opinion, role: thay, value: 12 }
          - { type: scholarly_prestige, value: 4 }
          - { type: reputation, group: dan_lang, value: 3 }
        result: ['{role.thay.call} cầm tay bạn viết chữ "Nhân" đầu tiên lên tờ giấy đỏ. Các cụ trong họ gật gù bảo nền nếp nhà này chưa mất.']
      - id: le_mon
        text: 'Lễ mọn đúng sức nhà: đĩa trầu, nải chuối'
        effects:
          - { type: skill_xp, skill: hoc_van, value: 18 }
          - { type: filial_piety, value: 2 }
          - { type: reputation, group: dan_lang, value: -2 }
        result: ['Lễ tuy mọn, {role.thay.call} vẫn nhận bằng hai tay. Ra về, bạn nghe một bà cô họ thì thầm "nhà ấy giờ nghèo thật rồi".']
      - id: cha_tu_day
        text: 'Thôi đi học, {role.cha.call} tự dạy ở nhà'
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: filial_piety, value: 4 }
          - { type: opinion, role: cha, value: 6 }
          - { type: scholarly_prestige, value: -2 }
        result: ['{role.cha.call} lấy chiếc án thư cũ của ông nội kê bên cửa sổ. Bạn học một thầy một trò, nghiêm hơn cả trường làng.']

  - id: tt_nho_viet_cau_doi_thue
    title: Ra chợ viết câu đối thuê
    tags: [hoc_hanh, no_nan, gia_dinh]
    life_stages: [thieu_thoi]
    months: [12, 1]
    condition:
      all:
        - { var: household.career, op: '==', value: si_tu }
        - { var: player.age, op: between, value: [11, 15] }
        - { var: household.money, op: '<', value: 6 }
        - { var: player.skill.hoc_van, op: '>=', value: 1 }
    roles:
      - { id: cha, from: family, relation: parent }
    weight: 6
    cooldown_years: 4
    tension: 4
    importance: 5
    icon: tet
    text:
      - 'Giáp Tết mà nhà chưa có tiền đong gạo nếp. Chữ bạn đã khá, người ở chợ phiên bảo cứ trải chiếu ngồi viết câu đối, mỗi đôi được vài chục đồng. Nhưng con nhà nho ngồi chợ bán chữ thì các cụ trong làng sẽ nói gì?'
    options:
      - id: ngoi_cho
        text: 'Trải chiếu ngồi chợ viết thuê'
        trait_stress: { than_trong: 2 }
        effects:
          - { type: money, value: 2, ledger: thu_khac }
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: scholarly_prestige, value: -3 }
        result: ['Ba phiên chợ bạn viết hơn bốn chục đôi câu đối, tay cóng vì gió bấc. Nhà có nồi bánh chưng, nhưng ông trưởng họ ghé qua sạp thì lắc đầu.']
      - id: chep_sach_dem
        text: 'Nhận chép sách thuê ban đêm, kín tiếng'
        effects:
          - { type: money, value: 2, ledger: thu_khac }
          - { type: skill_xp, skill: hoc_van, value: 20 }
          - { type: health, value: -3 }
          - { type: stress, value: 3 }
        result: ['Đêm nào bạn cũng chép đến cạn dầu. Mắt cay xè, nhưng chẳng ai biết nhà nho này đang chép sách lấy tiền.']
      - id: giu_the_dien
        text: 'Thà Tết đạm bạc còn hơn mang chữ ra chợ'
        trait_stress: { trong_gia_dinh: 3 }
        effects:
          - { type: filial_piety, value: 3 }
          - { type: scholarly_prestige, value: 2 }
          - { type: stress, value: 4 }
        result: ['Tết năm ấy mâm cỗ chỉ có đĩa xôi và quả trứng luộc. {role.cha.call} nhìn bạn, không nói gì, nhưng tối ấy dạy thêm cho bạn một bài thơ cổ.']

  # ── Chung, chi tiết đổi theo hoàn cảnh ──
  - id: tt_buoi_hoc_dau_tien
    title: Buổi học chữ đầu tiên
    tags: [hoc_hanh]
    life_stages: [thieu_thoi]
    condition:
      any:
        - { has_flag: di_hoc }
        - { var: household.career, op: '==', value: si_tu }
    roles:
      - { id: thay, from: village, village_role: thay_do }
    weight: 7
    once_per_life: true
    tension: 2
    importance: 5
    icon: sach
    text:
      - 'Hiên trường {role.thay.call} lợp lá gồi, học trò ngồi chiếu, đứa lớn đứa bé lẫn lộn. Thầy gõ thước xuống án, hỏi đứa mới đến đã biết chữ nào chưa. Mấy đứa ngồi sau cười khúc khích vì áo bạn có miếng vá.'
    options:
      - id: doc_tam_tu_kinh
        text: 'Đứng dậy đọc thuộc mấy câu Tam tự kinh cha đã dạy'
        condition: { var: household.career, op: '==', value: si_tu }
        effects:
          - { type: skill_xp, skill: hoc_van, value: 18 }
          - { type: opinion, role: thay, value: 10 }
          - { type: scholarly_prestige, value: 2 }
        result: ['"Nhân chi sơ, tính bản thiện..." Bạn đọc một mạch. Cả lớp im phăng phắc, {role.thay.call} khẽ gật đầu.']
      - id: bieu_bo_rau
        text: 'Lễ phép dâng thầy bó rau muống và chục trứng vịt mẹ gửi'
        condition: { var: household.self_farms, op: '==', value: true }
        effects:
          - { type: food, value: -1 }
          - { type: opinion, role: thay, value: 10 }
          - { type: skill_xp, skill: hoc_van, value: 12 }
        result: ['{role.thay.call} nhận quà, xếp cho bạn chỗ ngồi gần án thư. Tiếng cười sau lưng tắt dần.']
      - id: tinh_so_hoc_phi
        text: 'Xin giúp thầy tính sổ thóc học phí của cả lớp'
        condition: { var: household.career, op: '==', value: thuong_nhan }
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 12 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: opinion, role: thay, value: 8 }
        result: ['Bạn nhẩm sổ nhanh hơn cả thầy. {role.thay.call} cười: "Chữ chưa biết mà số đã giỏi, đúng là con nhà buôn."']
      - id: lang_le_ngoi_cuoi
        text: 'Lặng lẽ ngồi cuối lớp, chăm chú nhìn thầy viết'
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: stress, value: 2 }
        result: ['Cả buổi bạn không nói một lời. Về nhà, bạn lấy que vạch lại từng nét chữ lên nền đất sân.']
      - id: cai_lai_dua_cuoi
        text: 'Quay lại lườm đứa cười mình'
        trait_stress: { kien_nhan: 2 }
        effects:
          - { type: skill_xp, skill: hoc_van, value: 8 }
          - { type: opinion, role: thay, value: -5 }
          - { type: stress, value: -2 }
        result: ['Đứa kia im bặt, nhưng {role.thay.call} cũng nhìn thấy. Buổi đầu bạn đã bị phạt đứng úp mặt vào cột.']

  - id: tt_bi_con_ba_ho_bat_nat
    title: Bị con nhà bá hộ bắt nạt
    tags: [lang_xa, quan_he]
    life_stages: [thieu_thoi]
    condition: { var: player.age, op: between, value: [7, 14] }
    roles:
      - { id: bh, from: village, village_role: ba_ho }
    weight: 6
    cooldown_years: 5
    tension: 4
    importance: 5
    icon: tre_em
    text:
      - 'Thằng con út nhà {role.bh.call} cậy nhà giàu, dẫn mấy đứa đầy tớ chặn đường bạn ở đầu ngõ. Nó giật lấy đồ bạn đang cầm, bắt bạn chui qua háng mới trả.'
    options:
      - id: danh_lai
        text: 'Lao vào đánh lại'
        hint: 'Thắng thì nở mày nở mặt, nhưng nhà bá hộ sẽ sang mắng vốn'
        trait_stress: { than_trong: 4 }
        chance: { base: 0.4, skill: quan_su, per_level: 0.08, modifiers: [{ condition: { has_trait: can_dam }, add: 0.15 }] }
        effects:
          - { type: opinion, role: bh, value: -8 }
        success:
          - { type: skill_xp, skill: quan_su, value: 16 }
          - { type: reputation, group: dan_lang, value: 2 }
          - { type: stress, value: -3 }
        failure:
          - { type: health, value: -4 }
          - { type: stress, value: 4 }
        success_result: ['Hai đứa vật nhau lăn xuống rãnh. Nó khóc chạy về. Tối ấy {role.bh.call} sang nhà mắng vốn, nhưng lũ trẻ trong xóm từ đó nể bạn.']
        failure_result: ['Mấy đứa đầy tớ xúm vào, bạn về nhà mắt sưng húp. {role.bh.call} còn sang nhà đòi nhà bạn phải xin lỗi.']
      - id: chui_qua
        text: 'Nhịn, cúi đầu chui qua lấy lại đồ'
        trait_stress: { can_dam: 5, nong_nay: 4 }
        effects:
          - { type: stress, value: 6 }
          - { type: skill_xp, skill: muu_luoc, value: 10 }
        result: ['Bạn chui qua giữa tiếng cười hô hố. Đêm ấy bạn nằm thao thức, nhớ mặt từng đứa.']
      - id: mua_chuoc
        text: 'Lấy mấy viên kẹo mạch nha ở sạp nhà ra chia cho cả bọn'
        condition: { var: household.career, op: '==', value: thuong_nhan }
        effects:
          - { type: money, value: -1, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 16 }
          - { type: opinion, role: bh, value: 3 }
        result: ['Đứa nào cũng mút kẹo, quên luôn chuyện chặn đường. Thằng con bá hộ còn rủ bạn chiều mai ra bãi thả diều.']
      - id: doc_sach_rang
        text: 'Đứng thẳng đọc câu sách: "Kẻ cậy giàu hiếp yếu, quân tử chẳng làm"'
        condition: { var: household.career, op: '==', value: si_tu }
        chance: { base: 0.45, skill: hoc_van, per_level: 0.07 }
        success:
          - { type: scholarly_prestige, value: 3 }
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
        failure:
          - { type: stress, value: 4 }
          - { type: health, value: -2 }
        success_result: ['Thằng bé ngớ người, mấy đứa đầy tớ ngượng ngùng lùi lại. Chuyện đến tai {role.bh.call}, ông ta lại mắng con mình.']
        failure_result: ['Nó cười phá lên rồi đẩy bạn ngã xuống bùn. Sách vở ướt nhẹp.']
      - id: tranh_duong
        text: 'Giật đồ chạy đường tắt về nhà, từ đó tránh mặt'
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: stress, value: 2 }
        result: ['Bạn thuộc từng bờ rào, lối tắt trong xóm. Chẳng ai đuổi kịp, nhưng mỗi lần đi qua đầu ngõ bạn vẫn rảo bước.']

  - id: tt_nhat_cua_roi
    title: Nhặt được túi tiền đánh rơi
    tags: [lang_xa, tin_don]
    life_stages: [thieu_thoi]
    condition: { var: player.age, op: between, value: [8, 15] }
    roles:
      - { id: ly, from: village, village_role: ly_truong }
    weight: 5
    once_per_life: true
    tension: 3
    importance: 6
    icon: tien
    text:
      - 'Tan phiên chợ {world.settlement}, bạn nhặt được một túi vải chàm buộc chặt dưới gốc đa. Bên trong có ba quan tiền kẽm và một lá thư gấp tư. Trong nhà đang cần tiền.'
    options:
      - id: dung_cho
        text: 'Ngồi lại gốc đa chờ người đánh rơi quay lại'
        hint: 'Có thể chờ uổng công'
        chance: { base: 0.55, skill: sinh_ton, per_level: 0.03 }
        success:
          - { type: reputation, group: dan_lang, value: 5 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: schedule_event, event: tt_nguoi_mat_cua_tra_on, months: 84, label: 'Người lái buôn hẹn có ngày trả ơn' }
        failure:
          - { type: stress, value: 3 }
          - { type: opinion, role: ly, value: 4 }
        success_result: ['Gần tối, một người lái buôn đường xa hớt hải chạy lại. Ông mở túi đếm, rồi nắm tay bạn hỏi tên cha mẹ, hứa có ngày quay lại tạ ơn.']
        failure_result: ['Chờ đến tối mịt không thấy ai. Bạn đành mang túi tiền nộp {role.ly.call} giữ hộ.']
      - id: nop_ly_truong
        text: 'Mang lên đình nộp {role.ly.call}'
        effects:
          - { type: opinion, role: ly, value: 8 }
          - { type: reputation, group: dan_lang, value: 3 }
        result: ['{role.ly.call} khen bạn thật thà trước mặt các cụ. Chẳng ai biết ba quan tiền ấy rồi có về được tay chủ hay không.']
      - id: dua_me
        text: 'Mang về đưa cho mẹ'
        trait_stress: { nhan_tu: 4 }
        effects:
          - { type: money, value: 3, ledger: thu_khac }
          - { type: filial_piety, value: 2 }
          - { type: stress, value: 2 }
        result: ['Mẹ cầm túi tiền, lặng đi một lúc rồi cất vào đáy rương. Cả nhà không ai nhắc lại chuyện ấy nữa.']
      - id: giu_tieu_rieng
        text: 'Giấu đi, để dành mua quà vặt'
        trait_stress: { nhan_tu: 3, trung_thanh: 2 }
        effects:
          - { type: money, value: 1, ledger: thu_khac }
          - { type: stress, value: -2 }
          - { type: chance, p: 0.3, then: [{ type: reputation, group: dan_lang, value: -4 }], else: [] }
        result: ['Bạn chôn túi tiền dưới gốc chuối sau nhà, mỗi tháng đào lên lấy vài đồng mua bánh đa. Thỉnh thoảng nghe người ta kể chuyện ai đó mất tiền ở chợ, bạn giật mình.']

  - id: tt_nguoi_mat_cua_tra_on
    title: Người lái buôn năm xưa trở lại
    tags: [quan_he, thoi_co, buon_ban]
    scheduled_only: true
    weight: 1
    tension: 3
    importance: 7
    icon: nguoi_la
    text:
      - 'Một cỗ xe trâu đỗ trước ngõ. Người lái buôn đánh rơi túi tiền ở gốc đa năm nào giờ tóc đã hoa râm, áo gấm, theo sau có hai người gánh hàng. "Năm ấy không có cái túi ấy, cả nhà tôi đã mất trắng chuyến hàng," ông nói.'
    options:
      - id: nhan_moi_hang
        text: 'Xin ông cho theo học việc và chia mối hàng'
        effects:
          - { type: skill_xp, skill: thuong_mai, value: 28 }
          - { type: modifier, target: xp.thuong_mai, value: 1.15, op: mul, months: 36, label: 'Được lái buôn quen dìu dắt' }
          - { type: money, value: 2, ledger: buon_ban }
        result: ['Ông dẫn bạn đi khắp các bến trong vùng, chỉ cho bạn mối nào thật, mối nào hay ăn quỵt.']
      - id: xin_thu_tien_cu
        text: 'Xin ông viết thư tiến cử với một thầy học giỏi trên phủ'
        effects:
          - { type: skill_xp, skill: hoc_van, value: 24 }
          - { type: scholarly_prestige, value: 4 }
          - { type: modifier, target: xp.hoc_van, value: 1.1, op: mul, months: 36, label: 'Học thầy giỏi trên phủ' }
        result: ['Lá thư của ông mở được cửa nhà một ông nghè về hưu. Lần đầu bạn được đọc những bộ sách mà trường làng chưa từng có.']
      - id: nhan_qua
        text: 'Nhận món quà tạ ơn, giữ tình quen biết'
        effects:
          - { type: money, value: 5, ledger: thu_khac }
          - { type: reputation, group: dan_lang, value: 3 }
        result: ['Ông để lại năm quan tiền và tấm lụa biếu cha mẹ bạn. Cả xóm kéo sang xem, ai cũng nhắc lại chuyện cái túi tiền năm xưa.']
      - id: tu_choi_qua
        text: 'Từ chối, việc nên làm thì không lấy ơn'
        trait_stress: { tham_lam: 4, tham_vong: 3 }
        effects:
          - { type: reputation, group: dan_lang, value: 6 }
          - { type: scholarly_prestige, value: 3 }
          - { type: stress, value: -2 }
        result: ['Ông lái buôn nhìn bạn hồi lâu rồi vái một vái. Câu chuyện được các cụ kể lại ở đình như một tấm gương.']

  - id: tt_giu_em
    title: Ở nhà giữ em
    tags: [gia_dinh]
    life_stages: [thieu_thoi]
    condition: { var: player.age, op: between, value: [7, 13] }
    roles:
      - { id: em, from: family, relation: sibling, pick: youngest, condition: { var: self.age, op: '<=', value: 3 } }
      - { id: hx, from: village, village_role: hang_xom }
    weight: 6
    cooldown_years: 4
    tension: 2
    importance: 4
    icon: gia_dinh
    text:
      - 'Mẹ đi vắng cả ngày, giao {role.em.call} cho bạn trông. Giữa trưa lũ bạn đứng ngoài rào gọi í ới: ra bãi sông tắm, có cả trò bắt chuồn chuồn.'
    options:
      - id: o_nha_ru_em
        text: 'Ở nhà võng em, nấu nồi cháo trưa'
        trait_stress: { tu_do: 3 }
        effects:
          - { type: filial_piety, value: 4 }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: stress, value: 3 }
        result: ['Bạn hát hết bài ru này đến bài khác. Chiều mẹ về thấy {role.em.call} ngủ ngoan, nồi cháo còn ấm.']
      - id: dia_em_di_choi
        text: 'Địu em ra bãi sông chơi cùng lũ bạn'
        chance: { base: 0.6, skill: sinh_ton, per_level: 0.05 }
        success:
          - { type: stress, value: -4 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
        failure:
          - { type: health, value: -4, who: em }
          - { type: filial_piety, value: -4 }
          - { type: stress, value: 5 }
        success_result: ['Em ngồi trên bãi cát cười khanh khách nhìn lũ trẻ té nước. Chẳng ai biết chuyện.']
        failure_result: ['Mải chơi, bạn quay lại thì {role.em.call} đã bò ra mép nước, ướt sũng, sặc mấy ngụm. Tối ấy em sốt, mẹ khóc mà không nỡ đánh bạn.']
      - id: gui_hang_xom
        text: 'Gửi em sang nhờ {role.hx.call} trông hộ'
        effects:
          - { type: opinion, role: hx, value: -3 }
          - { type: stress, value: -3 }
          - { type: filial_piety, value: -1 }
        result: ['{role.hx.call} nhận trông nhưng vừa bế vừa cằn nhằn. Chuyện đến tai mẹ, mẹ phải mang sang biếu bà mấy quả cà.']

  - id: tt_om_nang_hoi_nho
    title: Trận ốm thập tử nhất sinh
    tags: [benh_tat, gia_dinh]
    life_stages: [thieu_thoi]
    months: [6, 7, 8, 9]
    condition: { var: player.age, op: between, value: [6, 12] }
    roles:
      - { id: cm, from: family, relation: parent }
      - { id: lang, from: village, village_role: thay_lang }
    weight: 4
    once_per_life: true
    tension: 6
    importance: 7
    icon: om
    text:
      - 'Mùa nước lên, bạn sốt li bì ba ngày không dứt, môi khô nứt, nói mê. {role.cm.call} ngồi bên giường suốt đêm, hết đắp khăn lại rót nước cháo. Người làng bàn mỗi người một kiểu.'
    options:
      - id: moi_thay_lang
        text: 'Mời {role.lang.call} bắt mạch bốc thuốc (2 quan)'
        condition: { var: household.money, op: '>=', value: 2 }
        effects:
          - { type: money, value: -2, ledger: su_kien }
          - { type: health, value: 4 }
        result: ['Mấy thang thuốc đắng ngắt, {role.cm.call} phải bóp mũi bạn mà đổ. Đến ngày thứ bảy cơn sốt lui dần.']
      - id: ban_do_chua
        text: 'Bán đồ quý trong nhà lấy tiền mời thầy'
        condition: { var: household.money, op: '<', value: 2 }
        effects:
          - { type: health, value: 4 }
          - { type: filial_piety, value: 4 }
          - { type: stress, value: 3, who: cm }
        result: ['{role.cm.call} lặng lẽ mang chiếc vòng bạc của bà ra chợ. Bạn khỏi bệnh, lớn lên mãi mới biết cái vòng ấy đã đi đâu.']
      - id: cung_bai
        text: 'Mời thầy cúng về trừ tà (1 quan)'
        chance: { base: 0.45, modifiers: [{ condition: { var: player.health, op: '>=', value: 55 }, add: 0.2 }] }
        effects:
          - { type: money, value: -1, ledger: su_kien }
        success:
          - { type: health, value: 2 }
        failure:
          - { type: health, value: -6 }
          - { type: add_disease, disease: sot_ret }
        success_result: ['Thầy cúng khua chiêng gõ mõ cả đêm. Sáng ra không biết nhờ ai, cơn sốt cũng hạ.']
        failure_result: ['Bùa dán đầy cửa mà sốt vẫn hành từng cơn. Mãi cả tháng sau bạn mới gượng ngồi dậy được.']
      - id: la_xong
        text: 'Nấu nồi lá xông theo cách các cụ'
        chance: { base: 0.5, modifiers: [{ condition: { var: player.health, op: '>=', value: 55 }, add: 0.2 }] }
        success:
          - { type: health, value: 2 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
        failure:
          - { type: health, value: -8 }
          - { type: stress, value: 4 }
        success_result: ['Nồi lá bưởi, lá sả, lá tre trùm chăn xông đến vã mồ hôi. Hai hôm sau bạn đã đòi ăn cháo.']
        failure_result: ['Xông mãi không đỡ, bạn gầy rộc đi. Trận ốm ấy để lại dáng người mảnh khảnh suốt mấy năm.']

  - id: tt_theo_tho_hoc_nghe
    title: Học thêm một nghề tay trái
    tags: [lao_dong, nghe_nghiep]
    life_stages: [thieu_thoi]
    condition: { var: player.age, op: between, value: [12, 15] }
    roles:
      - { id: lang, from: village, village_role: thay_lang, optional: true }
    weight: 5
    once_per_life: true
    tension: 3
    importance: 5
    icon: ky_nang
    text:
      - 'Mười mấy tuổi đầu, người lớn bảo đã đến lúc học thêm một nghề phòng thân. Ông thợ mộc làng bên đang cần người phụ, người chài trên bến cũng nhận trẻ học việc.'
    options:
      - id: hoc_tho_moc
        text: 'Theo ông thợ mộc học bào đục'
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 16 }
          - { type: skill_xp, skill: quan_tri, value: 8 }
          - { type: health, value: -2 }
        result: ['Mấy tháng đầu chỉ được mài đục và khiêng gỗ. Nhưng đến khi tự tay đẽo được cái chuôi cày, bạn mừng như được của.']
      - id: hoc_cheo_do
        text: 'Theo người chài học chèo đò, đan lưới'
        condition: { var: world.settlement_type, op: '==', value: thi_tran_ben_song }
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 18 }
          - { type: skill_xp, skill: thuong_mai, value: 6 }
          - { type: money, value: 1, ledger: thu_khac }
        result: ['Bạn học được cách đọc con nước, thả lưới lúc trời vừa sẩm. Mẻ cá đầu tiên tự tay đánh, bạn mang về biếu mẹ.']
      - id: hoc_boc_thuoc
        text: 'Xin {role.lang.call} cho theo hái thuốc, sắc thuốc'
        condition: { role: lang, exists: true }
        effects:
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: skill_xp, skill: sinh_ton, value: 12 }
          - { type: opinion, role: lang, value: 10 }
        result: ['Bạn thuộc dần tên từng vị thuốc: cam thảo, ngải cứu, bạc hà. {role.lang.call} bảo bạn tay nhẹ, có duyên với nghề.']
      - id: day_tre_ranh
        text: 'Không học nghề, nhận dạy chữ vỡ lòng cho lũ trẻ trong xóm'
        condition: { var: household.career, op: '==', value: si_tu }
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: skill_xp, skill: ngoai_giao, value: 8 }
          - { type: money, value: 1, ledger: day_hoc }
          - { type: scholarly_prestige, value: 2 }
        result: ['Mỗi chiều mấy đứa trẻ ngồi quanh hiên nhà bạn đọc "thiên, địa, nhân". Học phí là thúng khoai, quả bí, nhưng các bà mẹ gọi bạn là "cậu đồ con".']
      - id: o_nha_phu_viec
        text: 'Thôi, ở nhà phụ việc nhà cho đỡ cha mẹ'
        trait_stress: { tham_vong: 3 }
        effects:
          - { type: filial_piety, value: 3 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
          - { type: stress, value: -2 }
        result: ['Bạn ở nhà gánh nước, bổ củi, vá phên. Mẹ đỡ vất, cha thỉnh thoảng nhìn bạn như muốn nói điều gì.']

  - id: tt_le_vao_dinh
    title: Lễ vào sổ đinh
    tags: [lang_xa, tin_nguong, le_hoi]
    life_stages: [thieu_thoi]
    months: [1, 2]
    condition:
      all:
        - { var: player.sex, op: '==', value: m }
        - { var: player.age, op: between, value: [14, 15] }
    roles:
      - { id: ly, from: village, village_role: ly_truong }
    weight: 8
    once_per_life: true
    tension: 3
    importance: 6
    icon: lang
    text:
      - 'Đầu năm, các cụ họp ở đình ghi tên những người con trai sắp đến tuổi vào sổ đinh. Từ nay bạn có chỗ ngồi chiếu dưới ở đình, cũng có phần gánh sưu, đi phu. Theo lệ, nhà có con vào đinh phải khao làng.'
    options:
      - id: khao_to
        text: 'Làm mâm xôi gà, vò rượu khao cả giáp'
        condition: { var: household.money, op: '>=', value: 3 }
        effects:
          - { type: money, value: -3, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: 6 }
          - { type: opinion, role: ly, value: 6 }
          - { type: filial_piety, value: 3 }
        result: ['Cả giáp ngồi kín hai gian đình. Các cụ nâng chén chúc bạn sớm thành người, {role.ly.call} còn xếp cho bạn ngồi gần chiếu trên.']
      - id: khao_vua
        text: 'Nộp lệ vừa đủ, mâm cỗ đơn sơ'
        effects:
          - { type: money, value: -1, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: -1 }
        result: ['Mâm cỗ chỉ có đĩa xôi đậu và bát canh. Mấy ông chiếu trên liếc nhau, nhưng tên bạn vẫn được ghi vào sổ.']
      - id: van_than
        text: 'Xin ghi tên vào hàng văn thân vì nhà có nghiệp học'
        condition:
          all:
            - { var: household.career, op: '==', value: si_tu }
            - { var: player.skill.hoc_van, op: '>=', value: 2 }
        chance: { base: 0.5, skill: hoc_van, per_level: 0.06 }
        success:
          - { type: scholarly_prestige, value: 6 }
          - { type: filial_piety, value: 3 }
          - { type: opinion, role: ly, value: 4 }
        failure:
          - { type: reputation, group: dan_lang, value: -3 }
          - { type: stress, value: 4 }
        success_result: ['Các cụ thử bạn mấy câu kinh nghĩa. Bạn đáp trôi chảy, được ngồi chiếu văn thân dù còn ít tuổi nhất.']
        failure_result: ['Bạn đáp vấp, một ông kỳ mục cười khẩy "chưa đỗ đạt gì đã đòi ngồi chiếu trên". Cả đình cười ồ.']
      - id: xin_khat
        text: 'Xin {role.ly.call} khất lệ sang mùa sau'
        hint: 'Cần ăn nói khéo'
        chance: { base: 0.4, skill: ngoai_giao, per_level: 0.06 }
        success:
          - { type: skill_xp, skill: ngoai_giao, value: 12 }
        failure:
          - { type: reputation, group: dan_lang, value: -4 }
          - { type: opinion, role: ly, value: -6 }
          - { type: stress, value: 3 }
        success_result: ['{role.ly.call} gật đầu cho khất. Ông còn khen bạn ăn nói ra dáng người lớn.']
        failure_result: ['{role.ly.call} lạnh lùng gạch tên bạn khỏi phần chia thịt tế. Cả làng biết nhà bạn nợ lệ.']

  - id: tt_hoi_lang_dau_tien
    title: Hội làng đầu tiên được đi một mình
    tags: [le_hoi, lang_xa]
    life_stages: [thieu_thoi]
    months: [1, 2, 3]
    condition: { var: player.age, op: between, value: [9, 14] }
    weight: 7
    once_per_life: true
    tension: 2
    importance: 5
    icon: hoi
    text:
      - 'Năm nay lần đầu bạn được đi hội một mình, trong túi có mấy đồng mừng tuổi. Sân đình trống giục từ sáng: bên này xới vật, bên kia đu tre, đằng sau có gánh hát chèo.'
    options:
      - id: vao_xoi_vat
        text: 'Xin vào xới vật của lũ trẻ'
        trait_stress: { than_trong: 3 }
        chance: { base: 0.4, skill: quan_su, per_level: 0.08 }
        success:
          - { type: skill_xp, skill: quan_su, value: 16 }
          - { type: reputation, group: dan_lang, value: 3 }
        failure:
          - { type: health, value: -3 }
          - { type: skill_xp, skill: quan_su, value: 8 }
        success_result: ['Bạn quật ngã đứa to con nhất xóm Đông. Các cụ thưởng cho bạn một gói chè và câu "thằng này có sức".']
        failure_result: ['Bạn bị ném văng ra mép xới, rát cả lưng. Nhưng cả buổi bạn vẫn đứng xem, học từng miếng vật.']
      - id: xem_hat_cheo
        text: 'Ngồi xem gánh chèo đến tối'
        effects:
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: skill_xp, skill: hoc_van, value: 6 }
          - { type: stress, value: -4 }
        result: ['Tích Quan Âm Thị Kính làm bạn rơm rớm nước mắt. Đêm ấy về, bạn còn ngâm nga mãi câu hát của anh hề.']
      - id: phu_ban_quan
        text: 'Phụ mẹ dọn hàng quà bánh ở cổng hội'
        condition: { var: household.career, op: '==', value: thuong_nhan }
        effects:
          - { type: money, value: 1, ledger: buon_ban }
          - { type: skill_xp, skill: thuong_mai, value: 12 }
          - { type: stress, value: 2 }
        result: ['Bánh gai, kẹo kéo bán hết từ trưa. Hội chưa kịp xem, nhưng túi tiền nhà nặng thêm.']
      - id: theo_cha_le_than
        text: 'Theo cha vào hậu cung xem các cụ tế thần'
        condition: { var: household.career, op: '==', value: si_tu }
        effects:
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: filial_piety, value: 3 }
          - { type: scholarly_prestige, value: 1 }
        result: ['Bạn đứng nép sau cột, nghe ông chủ tế đọc văn tế giọng sang sảng. Chữ nghĩa trong bài tế bạn đã hiểu được dăm câu.']
      - id: tieu_het_tien
        text: 'Tiêu hết mấy đồng vào bánh đa, kẹo bột và trò ném vòng'
        effects:
          - { type: stress, value: -5 }
        result: ['Bạn về nhà tay không, miệng còn dính đường, nhưng đó là ngày vui nhất năm.']

  - id: tt_ket_ban_dua_tre_lang_thang
    title: Đứa trẻ theo gánh xiếc rong
    tags: [quan_he, lang_xa]
    life_stages: [thieu_thoi]
    condition: { var: player.age, op: between, value: [8, 13] }
    weight: 5
    once_per_life: true
    tension: 3
    importance: 6
    icon: tre_em
    text:
      - 'Gánh xiếc rong dừng lại {world.settlement} mấy hôm. Có một đứa trẻ trạc tuổi bạn, gầy nhẳng, chuyên đi trên dây và đội chum. Chiều nào nó cũng ngồi một mình sau bụi tre, gặm củ khoai sống. Người làng dặn con cháu đừng chơi với "lũ hát rong".'
    options:
      - id: ket_nghia
        text: 'Chia nắm cơm, kết nghĩa với nó'
        trait_stress: { than_trong: 2 }
        effects:
          - { type: food, value: -1 }
          - { type: skill_xp, skill: ngoai_giao, value: 14 }
          - { type: reputation, group: dan_lang, value: -1 }
          - { type: schedule_event, event: tt_ban_xa_tro_ve, months: 108, label: 'Người bạn gánh xiếc hẹn ngày gặp lại' }
        result: ['Hai đứa cắt tay nhỏ máu vào bát nước như trong truyện. Hôm gánh xiếc nhổ sào, nó dúi cho bạn chiếc còi trúc, hẹn có ngày quay lại.']
      - id: hoc_tro_xiec
        text: 'Đổi nắm xôi lấy mấy miếng nhào lộn'
        effects:
          - { type: food, value: -1 }
          - { type: skill_xp, skill: quan_su, value: 12 }
          - { type: skill_xp, skill: sinh_ton, value: 6 }
          - { type: stress, value: -3 }
        result: ['Ba buổi chiều sau bụi tre, bạn học được lộn ngược và đi cà kheo. Gánh xiếc đi rồi, lũ trẻ trong xóm cứ đòi bạn biểu diễn.']
      - id: nghe_loi_nguoi_lon
        text: 'Nghe lời người lớn, tránh xa'
        trait_stress: { nhan_tu: 3 }
        effects:
          - { type: filial_piety, value: 2 }
        result: ['Bạn đi vòng qua bụi tre. Hôm gánh xiếc đi, bạn thấy nó ngoái lại nhìn mãi về phía xóm.']

  - id: tt_ban_xa_tro_ve
    title: Người anh em kết nghĩa năm xưa
    tags: [quan_he, nguy_hiem]
    scheduled_only: true
    weight: 1
    tension: 6
    importance: 7
    icon: nguoi_la
    text:
      - 'Nửa đêm có tiếng gõ phên. Dưới ánh trăng, một gã đàn ông vai u thịt bắp, áo rách, cánh tay quấn giẻ thấm máu, giơ lên chiếc còi trúc y hệt cái bạn còn giữ. Đứa trẻ gánh xiếc năm xưa giờ đã thành người, và đang bị tuần đinh truy đuổi.'
    options:
      - id: giau_trong_kho
        text: 'Giấu anh ấy trong kho rơm mấy hôm'
        hint: 'Nếu bị phát hiện, nhà bạn mang tội chứa chấp'
        trait_stress: { than_trong: 5 }
        chance: { base: 0.55, skill: muu_luoc, per_level: 0.06 }
        success:
          - { type: money, value: 4, ledger: thu_khac }
          - { type: skill_xp, skill: muu_luoc, value: 16 }
        failure:
          - { type: wanted, value: 12 }
          - { type: reputation, group: dan_lang, value: -6 }
          - { type: stress, value: 6 }
        success_result: ['Đêm thứ ba anh ấy lặng lẽ đi, để lại dưới gối rơm một thỏi bạc và lời hẹn "có việc gì cứ ra bến đò Ngang hỏi tên tôi".']
        failure_result: ['Tuần đinh lục soát kho rơm. Anh ấy kịp phá vách chạy thoát, còn tên bạn thì bị ghi vào sổ kẻ chứa chấp.']
      - id: cho_tien_di
        text: 'Đưa ít tiền, ít gạo rồi bảo đi ngay'
        effects:
          - { type: money, value: -2, ledger: su_kien }
          - { type: food, value: -1 }
          - { type: stress, value: 2 }
        result: ['Anh ấy cầm gói gạo, nhìn bạn một lúc rồi khuất vào bóng tre. Chiếc còi trúc bạn vẫn giữ, nhưng chẳng dám thổi nữa.']
      - id: bao_tuan_dinh
        text: 'Đóng cửa, sáng ra báo tuần đinh'
        trait_stress: { nhan_tu: 5, trung_thanh: 4 }
        effects:
          - { type: reputation, group: dan_lang, value: 3 }
          - { type: stress, value: 5 }
        result: ['Người ta bắt được anh ấy ở bến đò. Lúc bị giải qua cổng làng, anh ấy ngẩng lên nhìn đúng về phía nhà bạn.']
