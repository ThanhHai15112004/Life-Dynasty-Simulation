# Sự kiện quyết định — GIÀU RƯỚC HỌA. Tiền tố id: grh_
# Chỉ đến với nhà có của (giá trị ròng ≥ 120 quan hoặc tiền mặt ≥ 60 quan) và người chơi làm chủ hộ.
# Nhà càng giàu càng hay gặp: trọng số ×1.8 khi giá trị ròng ≥ 300, nhân thêm ×1.67 khi ≥ 800 (tổng ≈ ×3).
# Mỗi phương án hoặc tốn 10–60 quan, hoặc trả bằng uy tín, quan hệ, cờ dài năm, hay chuyện quay lại sau.
# Chuỗi: grh_ba_ho_ghen_ghet (đối đầu thất bại) → grh_ba_ho_tra_dua
events:
  - id: grh_lang_bo_duc_chuong
    title: Làng bổ tiền đúc chuông theo của
    tags: [lang_xa, kinh_te, tin_nguong]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { any: [{ var: household.net_worth, op: '>=', value: 120 }, { var: household.money, op: '>=', value: 60 }] }
    roles:
      - { id: ly, from: village, village_role: ly_truong }
    weight: 5
    weight_modifiers:
      - { condition: { var: household.net_worth, op: '>=', value: 300 }, factor: 1.8 }
      - { condition: { var: household.net_worth, op: '>=', value: 800 }, factor: 1.67 }
    cooldown_years: 8
    tension: 5
    importance: 7
    icon: lang
    text:
      - 'Quả chuông chùa làng nứt từ trận bão năm ngoái. Các cụ họp ở đình, quyết đúc chuông mới nặng hơn trăm cân đồng. {role.ly.call} cầm sổ đọc: tiền bổ theo của, nhà nghèo góp vài tiền, nhà bạn — giàu nhì nhất làng — góp ba mươi quan.'
      - 'Ai cũng biết tên nhà góp nhiều sẽ được khắc vào thân chuông, mỗi lần chuông thỉnh là một lần nhắc. Ai cũng biết nhà nào kêu nghèo thì làng sẽ nhớ.'
    options:
      - id: gop_du
        text: 'Góp đủ 30 quan theo sổ'
        hint: 'Yên chuyện với làng, hao một khoản lớn'
        condition: { var: household.money, op: '>=', value: 30 }
        effects:
          - { type: money, value: -30, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: 10 }
          - { type: opinion, role: ly, value: 6 }
        result: ['Bạn đặt ba mươi quan lên mâm đồng giữa đình. Thủ từ ghi tên vào sổ công đức. Không ai khen, nhưng cũng không ai nói gì.']
      - id: gop_gap_doi
        text: 'Góp hẳn 55 quan, xin khắc tên nhà mình lên thân chuông'
        hint: 'Tiếng thơm lâu đời, nhưng của đi như nước'
        condition: { var: household.money, op: '>=', value: 55 }
        trait_stress: { tham_lam: 8 }
        effects:
          - { type: money, value: -55, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: 25 }
          - { type: dynasty_prestige, value: 8 }
          - { type: opinion, role: ly, value: 12 }
        result: ['Ngày đúc chuông, cả làng ra xem đồng chảy đỏ rực. Tên nhà bạn nằm ngay hàng đầu thân chuông. Tiếng chuông đầu tiên ngân xa ba xã. Người già trong nhà chắp tay khấn mà rơm rớm.']
      - id: keu_ngheo
        text: 'Kêu mất mùa, xin góp 8 quan thôi'
        hint: 'Giữ được tiền nếu làng tin; không tin thì mang tiếng keo kiệt'
        condition: { var: household.money, op: '>=', value: 8 }
        effects:
          - { type: money, value: -8, ledger: su_kien }
        chance: { base: 0.35, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: reputation, group: dan_lang, value: -3 }
        failure:
          - { type: reputation, group: dan_lang, value: -18 }
          - { type: opinion, role: ly, value: -20 }
          - { type: set_flag, flag: grh_tieng_keo_kiet, years: 6, label: 'Mang tiếng giàu mà keo kiệt với làng' }
        success_result: ['Các cụ nhìn nhau rồi gật đầu. Năm ấy quả thực nhiều nhà mất mùa. Sổ công đức ghi tên bạn ở hàng giữa.']
        failure_result: ['{role.ly.call} đập tay xuống chiếu: "Kho nhà ông thóc đầy đến mái, mà kêu mất mùa!" Cả đình cười ồ. Từ đó mỗi lần chuông thỉnh, người ta lại kể chuyện ông nhà giàu góp tám quan.']
      - id: tu_choi
        text: 'Thẳng thừng không góp: tiền nhà mình làm ra, làng không có quyền bổ'
        hint: 'Không mất đồng nào, nhưng thành cái gai trong mắt cả làng'
        trait_stress: { nhan_tu: 4, an_phan: 4 }
        effects:
          - { type: reputation, group: dan_lang, value: -25 }
          - { type: opinion, role: ly, value: -30 }
          - { type: set_flag, flag: grh_bi_lang_ghet, years: 6, label: 'Làng ghét vì không góp đúc chuông' }
          - { type: modifier, target: stress.monthly, value: 0.4, months: 24, label: 'Bị làng xa lánh' }
        result: ['Bạn đứng dậy ra về giữa lúc các cụ còn ngồi. Hôm sau, mõ làng đi rao rằng nhà bạn "không đồng lòng với làng". Đám giỗ tháng ấy, không nhà nào mời bạn.']

  - id: grh_ly_truong_do_ruong
    title: Ông lý đo lại ruộng nhà giàu
    tags: [lang_xa, ruong_dong, kinh_te]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { var: household.farmland, op: '>=', value: 3 }
        - { any: [{ var: household.net_worth, op: '>=', value: 120 }, { var: household.money, op: '>=', value: 60 }] }
    roles:
      - { id: ly, from: village, village_role: ly_truong }
    weight: 5
    weight_modifiers:
      - { condition: { var: household.net_worth, op: '>=', value: 300 }, factor: 1.8 }
      - { condition: { var: household.net_worth, op: '>=', value: 800 }, factor: 1.67 }
      - { condition: { has_trait: tham_lam, who: ly }, factor: 2 }
    cooldown_years: 6
    tension: 6
    importance: 7
    icon: thue
    text:
      - '{role.ly.call} dẫn hai tuần đinh cầm thước, cầm sổ ra đồng đo lại ruộng nhà bạn. Đo đi đo lại, ông ta phán: "Thừa ra non một sào so với sổ điền. Ruộng ẩn lậu, phải truy thu thuế năm năm, lại phạt."'
      - 'Đường bờ ruộng vẫn y như thời ông bà để lại. Nhưng thước là thước của ông lý, sổ cũng là sổ của ông lý.'
    options:
      - id: lot_tay
        text: 'Mời {role.ly.call} về nhà, dúi 20 quan "tiền nước"'
        hint: 'Êm ngay; nhưng đã biết nhà mình chịu chi thì sẽ có lần sau'
        condition: { var: household.money, op: '>=', value: 20 }
        effects:
          - { type: money, value: -20, ledger: su_kien }
          - { type: opinion, role: ly, value: 15 }
          - { type: set_flag, flag: grh_ly_biet_chi, years: 5, label: '{role.ly.call} biết nhà mình chịu chi' }
        result: ['{role.ly.call} cầm chén rượu, nhìn ra đồng: "Chắc lúc nãy tuần đinh căng dây lệch." Hôm sau tờ biên bản được sửa lại. Bạn nhìn ông ta đi khuất mà không thấy nhẹ lòng.']
      - id: kien_len_huyen
        text: 'Mang sổ điền cũ lên huyện kiện ông lý đo gian'
        hint: 'Thắng thì ông lý mất mặt; thua thì nộp phạt nặng gấp đôi và thêm thù'
        condition: { var: household.money, op: '>=', value: 10 }
        effects:
          - { type: money, value: -10, ledger: su_kien }
          - { type: stress, value: 10 }
        chance: { base: 0.35, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: reputation, group: dan_lang, value: 15 }
          - { type: opinion, role: ly, value: -30 }
        failure:
          - { type: money, value: { var: household.money, factor: -0.3, max: 0, min: -45 }, ledger: thue }
          - { type: opinion, role: ly, value: -40 }
          - { type: set_flag, flag: grh_thu_ly_truong, years: 8, label: 'Thù với {role.ly.call} sau vụ kiện ruộng' }
        success_result: ['Thư lại huyện so sổ điền cũ, thấy đường bờ khớp từng thước. Quan quở {role.ly.call} trước công đường. Dân làng kháo nhau mấy tháng liền: nhà ấy dám kiện cả lý trưởng.']
        failure_result: ['Quan huyện với {role.ly.call} vốn là chỗ quen. Đơn bị bác, bạn bị phạt tội "vu cáo chức dịch". Ra khỏi công đường, {role.ly.call} đứng ở cổng, mỉm cười.']
      - id: chiu_truy_thu
        text: 'Nhịn cho xong, nộp đủ truy thu và tiền phạt 35 quan'
        hint: 'Không gây thù, nhưng mất trắng một khoản lớn vì cái sai không phải của mình'
        condition: { var: household.money, op: '>=', value: 35 }
        effects:
          - { type: money, value: -35, ledger: thue }
          - { type: stress, value: 12 }
          - { type: opinion, role: ly, value: 4 }
        result: ['Bạn đếm đủ ba mươi lăm quan đặt lên án thư nhà ông lý. Ông ta ghi biên lai, nét chữ rất đẹp. Đêm ấy bạn đi ra đồng, đứng nhìn đường bờ ruộng của ông bà mà nghiến răng.']
      - id: cat_ruong_bu
        text: 'Không có tiền mặt, đành cắt một sào ruộng cho làng làm công điền để trừ'
        hint: 'Giữ tiền mặt, mất ruộng tốt'
        effects:
          - { type: property_remove, property: ruong, count: 1 }
          - { type: stress, value: 12 }
          - { type: reputation, group: dan_lang, value: 4 }
        result: ['Sào ruộng đầu bờ được cắm cọc tre "công điền". Năm sau, bạn thấy người cày trên sào ấy là em vợ ông lý.']

  - id: grh_ho_hang_nuong_nho
    title: Họ hàng xa dắt díu đến nương nhờ
    tags: [gia_dinh, quan_he, kinh_te]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { any: [{ var: household.net_worth, op: '>=', value: 120 }, { var: household.money, op: '>=', value: 60 }] }
    weight: 5
    weight_modifiers:
      - { condition: { var: household.net_worth, op: '>=', value: 300 }, factor: 1.8 }
      - { condition: { var: household.net_worth, op: '>=', value: 800 }, factor: 1.67 }
      - { condition: { var: world.harvest_quality, op: in, value: [kem, mat_mua] }, factor: 1.6 }
    cooldown_years: 7
    tension: 5
    importance: 7
    icon: gia_dinh
    text:
      - 'Một buổi chiều, ông chú họ ba đời bên nội dắt díu cả nhà sáu miệng ăn đứng trước cổng. Quê ông mất mùa, đất bị bá hộ xiết. "Nghe nói nhà cháu nay đã khá, chú dắt các em sang nương nhờ ít lâu." Ít lâu là bao lâu, ông không nói.'
      - 'Đứa nhỏ nhất ôm chân mẹ, đói lả. Ông chú cầm theo cuốn gia phả, giở đúng trang có tên ông nội bạn và ông nội ông là hai anh em ruột.'
    options:
      - id: cho_o_lau_dai
        text: 'Dọn gian chái cho cả nhà chú ở, cơm ăn chung mâm'
        hint: 'Trọn tình họ hàng; nhà thêm sáu miệng ăn mấy năm trời'
        trait_stress: { tham_lam: 8 }
        effects:
          - { type: modifier, target: living.cost, value: 1.35, op: mul, months: 36, label: 'Nuôi cả nhà chú họ' }
          - { type: modifier, target: food.consumption, value: 1.3, op: mul, months: 36, label: 'Nuôi cả nhà chú họ' }
          - { type: adopt_relative }
          - { type: reputation, group: dan_lang, value: 12 }
          - { type: dynasty_prestige, value: 6 }
          - { type: stress, value: 8 }
        result: ['Gian chái kê thêm hai chiếc chõng tre. Bữa cơm nhà bạn từ đó phải nấu hai nồi. Mấy năm sau cả nhà chú dọn đi, để lại một đứa cháu ở lại làm con nuôi.']
      - id: cho_ruong_cay_re
        text: 'Cho chú cấy rẽ hai sào, dựng túp lều ở bãi sau, tự làm tự ăn'
        hint: 'Bớt gánh cho nhà, nhưng mất phần hoa lợi của hai sào ấy'
        condition: { var: household.farmland, op: '>=', value: 3 }
        effects:
          - { type: money, value: -10, ledger: su_kien }
          - { type: modifier, target: harvest.yield, value: 0.82, op: mul, months: 36, label: 'Chia ruộng cho chú họ cấy rẽ' }
          - { type: reputation, group: dan_lang, value: 8 }
        result: ['Ông chú đi cày từ lúc trời chưa sáng, gặt xong mang sang biếu một gánh thóc ngon nhất. Bồ thóc nhà bạn vơi hơn mọi năm, nhưng sân nhà vẫn yên.']
      - id: cho_tien_bao_di
        text: 'Đưa 20 quan làm lộ phí, khuyên chú lên trấn tìm việc'
        hint: 'Giữ được nếp nhà, nhưng họ hàng sẽ bảo nhà giàu đuổi người cùng máu mủ'
        condition: { var: household.money, op: '>=', value: 20 }
        effects:
          - { type: money, value: -20, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: -6 }
          - { type: dynasty_prestige, value: -3 }
          - { type: stress, value: 4 }
        result: ['Ông chú cầm tiền, cúi chào rồi dắt cả nhà đi. Đến chỗ ngoặt, ông quay lại nhìn cái nhà ngói một lúc lâu. Tết năm ấy, cả họ bên nội không ai sang chúc.']
      - id: tu_choi
        text: 'Chối phắt: nhà cũng chật vật, không nuôi thêm ai được'
        hint: 'Không tốn một đồng, nhưng tiếng ác lan nhanh hơn tiếng thiện'
        trait_stress: { nhan_tu: 10, trong_gia_dinh: 6 }
        effects:
          - { type: reputation, group: dan_lang, value: -20 }
          - { type: dynasty_prestige, value: -8 }
          - { type: stress, value: 10 }
          - { type: set_flag, flag: grh_ho_hang_oan, years: 10, label: 'Họ hàng bên nội oán vì không cho nương nhờ' }
        result: ['Cánh cổng gỗ đóng lại. Đêm ấy cả nhà chú ngủ ở hiên đình làng. Sáng ra, bà hàng nước kể chuyện cho cả chợ nghe, thêm thắt rằng nhà bạn có ba kho thóc.']

  - id: grh_trom_khoet_vach
    title: Trộm khoét vách đêm mưa
    tags: [nguy_hiem, lang_xa]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { any: [{ var: household.net_worth, op: '>=', value: 120 }, { var: household.money, op: '>=', value: 60 }] }
    weight: 5
    weight_modifiers:
      - { condition: { var: household.net_worth, op: '>=', value: 300 }, factor: 1.8 }
      - { condition: { var: household.net_worth, op: '>=', value: 800 }, factor: 1.67 }
      - { condition: { var: world.weather, op: in, value: [mua, mua_phun] }, factor: 1.5 }
      - { condition: { has_flag: grh_nha_co_tuan_canh }, factor: 0.3 }
    cooldown_years: 5
    tension: 7
    importance: 7
    icon: tin_don
    text:
      - 'Đêm mưa to, bạn giật mình vì tiếng sột soạt ở vách buồng sau, chỗ kê cái rương đựng tiền. Một lỗ thủng to bằng cái nia đã khoét xong qua vách đất. Có bàn tay đang thò vào.'
      - 'Ngoài sân lờ mờ hai bóng người, một đứa đứng canh cổng, tay cầm dao phay. Tiếng mưa át cả tiếng thở.'
    options:
      - id: ho_hoan_duoi
        text: 'Vớ đòn gánh, hô hoán đuổi'
        hint: 'Giữ được rương; nhưng bọn trộm đêm có dao'
        chance: { base: 0.45, skill: quan_su, per_level: 0.06 }
        success:
          - { type: reputation, group: dan_lang, value: 6 }
          - { type: health, value: -5 }
          - { type: skill_xp, skill: quan_su, value: 25 }
        failure:
          - { type: health, value: -25 }
          - { type: money, value: { var: household.money, factor: -0.35, max: 0, min: -60 }, ledger: su_kien }
          - { type: stress, value: 15 }
        success_result: ['Bạn quật trúng một gã, nó rú lên rồi lủi qua bờ rào. Đuốc cả xóm bật sáng. Rương tiền còn nguyên, chỉ có vách nhà thủng một lỗ phải trát lại.']
        failure_result: ['Gã canh cổng xông vào, một nhát dao phay sượt qua cánh tay bạn. Bạn ngã vật ra. Lúc hàng xóm chạy sang thì bọn chúng đã ôm rương mất hút trong mưa.']
      - id: nam_im
        text: 'Nằm im, mặc chúng lấy, giữ cái mạng cho cả nhà'
        hint: 'Không ai bị thương, nhưng mất một khoản lớn'
        trait_stress: { can_dam: 8, nong_nay: 6 }
        effects:
          - { type: money, value: { var: household.money, factor: -0.4, max: 0, min: -55 }, ledger: su_kien }
          - { type: stress, value: 15 }
        result: ['Bạn nằm im trong bóng tối, ra hiệu cho cả nhà nín thở, nghe từng tiếng rương bị kéo lê. Sáng ra cái vách thủng nhìn thẳng ra vườn chuối. Cả nhà không ai nói gì suốt bữa sáng.']
      - id: bao_quan_truy
        text: 'Sáng ra lên huyện trình báo, nộp 8 quan để lính truy bắt'
        hint: 'Lính truy được thì lấy lại phần nào; không thì mất cả hai'
        condition: { var: household.money, op: '>=', value: 8 }
        effects:
          - { type: money, value: { var: household.money, factor: -0.4, max: 0, min: -55 }, ledger: su_kien }
          - { type: money, value: -8, ledger: su_kien }
        chance: { base: 0.3, skill: ngoai_giao, per_level: 0.04 }
        success:
          - { type: money, value: 30, ledger: thu_khac }
          - { type: reputation, group: dan_lang, value: 4 }
        failure:
          - { type: stress, value: 12 }
        success_result: ['Một tháng sau, lính huyện tóm được bọn trộm khi chúng tiêu tiền ở sòng bạc trên phủ. Bạn nhận lại được non nửa, ký tên vào sổ ba lần.']
        failure_result: ['Lính về làng hỏi han lấy lệ, ăn một bữa cơm gà rồi đi. Tám quan lệ phí cũng theo bọn trộm mà đi.']
      - id: xay_tuong_thue_canh
        text: 'Mất thì đã mất; bỏ 25 quan xây tường gạch, thuê tuần đinh canh đêm'
        hint: 'Từ nay yên giấc, nhưng tiêu thêm một khoản trên đống đã mất'
        condition: { var: household.money, op: '>=', value: 25 }
        effects:
          - { type: money, value: { var: household.money, factor: -0.35, max: 0, min: -50 }, ledger: su_kien }
          - { type: money, value: -25, ledger: mua_sam }
          - { type: set_flag, flag: grh_nha_co_tuan_canh, years: 8, label: 'Nhà có tường gạch, có người canh đêm' }
          - { type: stress, value: -4 }
        result: ['Bức tường gạch cao quá đầu người mọc lên quanh nhà, trên mặt cắm đầy mảnh chai. Đêm đêm có tiếng mõ tuần đinh gõ quanh ngõ. Người làng bảo nhà ấy giờ như dinh quan.']

  - id: grh_con_doi_chia_cua
    title: Con trai đòi chia của ra phố
    tags: [gia_dinh, buon_ban, quan_he]
    life_stages: [trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { any: [{ var: household.net_worth, op: '>=', value: 120 }, { var: household.money, op: '>=', value: 60 }] }
    roles:
      - { id: con, from: family, relation: child, condition: { all: [{ var: self.sex, op: '==', value: m }, { var: self.age, op: between, value: [17, 30] }, { var: self.in_household, op: '==', value: true }] } }
    weight: 5
    weight_modifiers:
      - { condition: { var: household.net_worth, op: '>=', value: 300 }, factor: 1.8 }
      - { condition: { var: household.net_worth, op: '>=', value: 800 }, factor: 1.67 }
      - { condition: { has_trait: hao_phong, who: con }, factor: 2 }
    cooldown_years: 8
    tension: 7
    importance: 8
    icon: tien
    text:
      - '{role.con.call} dạo này hay lên phố huyện, áo lụa thay áo nâu, tối về người sực mùi rượu và phấn. Hôm nay nó đứng giữa nhà, nói thẳng: "Nhà mình giàu thế mà cứ ru rú ở làng. Cho con năm chục quan, con ra phố mở hiệu, mấy năm là gấp đôi."'
      - 'Người ta kể {role.con.call} đã nợ mấy bữa rượu ở nhà cô đào trên phố. Nhưng đôi mắt nó lúc nói chuyện mở hiệu thì sáng rực, như ngày bạn mới lập nghiệp.'
    options:
      - id: cho_50_quan
        text: 'Cho con 50 quan ra phố, để nó tự lập'
        hint: 'Con biết làm ăn thì nhà có thêm cửa hiệu; không thì 50 quan ném xuống sông'
        condition: { var: household.money, op: '>=', value: 50 }
        effects:
          - { type: money, value: -50, ledger: chuyen_khac }
        chance:
          base: 0.35
          modifiers:
            - { condition: { var: role.con.skill.thuong_mai, op: '>=', value: 4 }, add: 0.25 }
            - { condition: { has_trait: hao_phong, who: con }, add: -0.15 }
        success:
          - { type: opinion, role: con, value: 30 }
          - { type: leave_household, who: con }
          - { type: dynasty_prestige, value: 8 }
          - { type: set_flag, flag: grh_con_mo_hieu, years: 15, label: '{role.con.call} mở hiệu trên phố huyện' }
        failure:
          - { type: opinion, role: con, value: 10 }
          - { type: stress, value: 15 }
          - { type: debt, value: 15, ledger: tra_no }
          - { type: set_flag, flag: grh_con_pha_cua, years: 6, label: '{role.con.call} phá sạch vốn trên phố' }
        success_result: ['Hai năm sau, đầu phố huyện có hiệu "Phúc Thịnh" bán chè, bán thuốc bắc. Tết về, {role.con.call} gánh biếu cha mẹ hai cân chè ngon và một tấm lụa. Bạn ngồi uống chè mà thấy lòng ấm.']
        failure_result: ['Chưa đầy năm, hiệu đóng cửa. Tiền vốn chảy vào chiếu bạc và nhà cô đào. {role.con.call} về làng, đầu cúi gằm, sau lưng là chủ nợ cầm giấy đòi thêm mười lăm quan.']
      - id: cho_20_thu_suc
        text: 'Cho 20 quan thử sức, bảo con làm ra lãi rồi mới tính tiếp'
        hint: 'Mất ít hơn nếu hỏng; nhưng con cho là cha không tin mình'
        condition: { var: household.money, op: '>=', value: 20 }
        effects:
          - { type: money, value: -20, ledger: chuyen_khac }
          - { type: opinion, role: con, value: -5 }
        chance: { base: 0.4, modifiers: [{ condition: { var: role.con.skill.thuong_mai, op: '>=', value: 3 }, add: 0.2 }] }
        success:
          - { type: money, value: 30, ledger: thu_khac }
          - { type: opinion, role: con, value: 15 }
        failure:
          - { type: opinion, role: con, value: -10 }
          - { type: stress, value: 8 }
        success_result: ['{role.con.call} mang hai chục quan đi buôn chè, nửa năm sau mang về ba chục, đặt lên bàn thờ trước mặt bạn. Lần đầu tiên hai người ngồi uống rượu với nhau như hai người lớn.']
        failure_result: ['Hai chục quan đi không trở lại. {role.con.call} bảo vốn ít quá nên mới hỏng, lỗi tại nhà bủn xỉn. Bữa cơm từ đó nặng như chì.']
      - id: bat_lam_viec_nha
        text: 'Gạt phắt: ở nhà làm ruộng ba năm đã, của nhà không phải để mày ném vào nhà cô đào'
        hint: 'Giữ được của; nhưng con hư mà bị ép thì có khi tự lấy'
        trait_stress: { tu_do: 4 }
        effects:
          - { type: opinion, role: con, value: -30 }
        chance: { base: 0.5, modifiers: [{ condition: { has_trait: hao_phong, who: con }, add: -0.2 }] }
        success:
          - { type: stress, value: 6 }
        failure:
          - { type: money, value: { var: household.money, factor: -0.3, max: 0, min: -45 }, ledger: su_kien }
          - { type: opinion, role: con, value: -15 }
          - { type: stress, value: 18 }
          - { type: set_flag, flag: grh_con_lay_trom, years: 6, label: '{role.con.call} lấy trộm tiền nhà' }
        success_result: ['{role.con.call} hằm hằm vác cày ra đồng. Một mùa, hai mùa. Rồi đến một chiều, bạn thấy nó đứng trên bờ ruộng chỉ bảo mấy người làm thuê, ra dáng chủ nhà.']
        failure_result: ['Đêm ấy cái rương ở buồng trong bị cạy. Sáng ra {role.con.call} đã đi, để lại chiếc áo nâu vắt trên cọc rào. Hàng xóm thấy nó đi về phía phố huyện.']
      - id: cuoi_vo_giu_chan
        text: 'Lo cưới vợ cho con, bỏ 25 quan làm cỗ, mong có vợ con thì nó chín chắn'
        hint: 'Tốn kém, con không chắc đã nghe; nhưng nhà thêm người'
        condition: { var: household.money, op: '>=', value: 25 }
        effects:
          - { type: money, value: -25, ledger: su_kien }
          - { type: arrange_child_marriage, sex: m }
          - { type: opinion, role: con, value: -12 }
          - { type: reputation, group: dan_lang, value: 5 }
        result: ['Đám cưới linh đình ba ngày. {role.con.call} uống say mềm ngay mâm đầu. Nàng dâu mới hiền lành, ít nói. Bạn chỉ mong cái dây ấy buộc được chân con.']

  - id: grh_ho_kien_ruong_huong_hoa
    title: Họ tộc kiện đòi ruộng hương hỏa
    tags: [gia_dinh, ruong_dong, quan_he]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { var: household.farmland, op: '>=', value: 3 }
        - { any: [{ var: household.net_worth, op: '>=', value: 120 }, { var: household.money, op: '>=', value: 60 }] }
    weight: 4
    weight_modifiers:
      - { condition: { var: household.net_worth, op: '>=', value: 300 }, factor: 1.8 }
      - { condition: { var: household.net_worth, op: '>=', value: 800 }, factor: 1.67 }
    cooldown_years: 8
    tension: 7
    importance: 8
    icon: ruong
    text:
      - 'Trưởng chi thứ hai trong họ gửi đơn lên huyện: hai sào ruộng tốt nhất nhà bạn vốn là ruộng hương hỏa của cả họ, ông nội bạn chỉ được giao giữ, nay nhà bạn giàu rồi thì phải trả về cho họ. Kèm theo là một tờ văn tự cũ, giấy vàng ố, nét chữ không ai đọc rõ.'
      - 'Trát huyện về: hai bên ra công đường đối chất. Mấy ông chú trong họ thì ngả về phía ai có lợi.'
    options:
      - id: theo_kien
        text: 'Thuê thầy cò viết đơn, theo kiện đến cùng (15 quan)'
        hint: 'Thắng thì giữ trọn ruộng; thua thì mất cả ruộng lẫn tiền'
        condition: { var: household.money, op: '>=', value: 15 }
        effects:
          - { type: money, value: -15, ledger: su_kien }
          - { type: stress, value: 12 }
        chance: { base: 0.45, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: reputation, group: dan_lang, value: 6 }
          - { type: dynasty_prestige, value: -4 }
        failure:
          - { type: property_remove, property: ruong, count: 2 }
          - { type: dynasty_prestige, value: -6 }
          - { type: stress, value: 15 }
        success_result: ['Quan soi tờ văn tự dưới đèn, thấy mực mới hơn giấy. Đơn bị bác. Bạn giữ được ruộng, nhưng đám giỗ tổ năm ấy, chi thứ hai không ai đến.']
        failure_result: ['Mấy ông chú lần lượt đứng ra làm chứng cho chi bên kia. Quan phán ruộng về họ. Hai sào ruộng mạ đang xanh, bạn phải đứng nhìn người khác ra cấy.']
      - id: lot_quan
        text: 'Ngầm biếu quan huyện 35 quan cho chắc'
        hint: 'Gần như chắc thắng, nhưng mất một khoản lớn và họ hàng sẽ đoán ra'
        condition: { var: household.money, op: '>=', value: 35 }
        trait_stress: { nhan_tu: 4 }
        effects:
          - { type: money, value: -35, ledger: su_kien }
        chance: { base: 0.8 }
        success:
          - { type: dynasty_prestige, value: -8 }
          - { type: reputation, group: dan_lang, value: -6 }
        failure:
          - { type: property_remove, property: ruong, count: 2 }
          - { type: stress, value: 20 }
        success_result: ['Phiên xử chỉ kéo dài một tuần hương. Quan phán ruộng thuộc nhà bạn, chi thứ hai bị phạt tội kiện bừa. Cả họ thì thầm rằng tiền nhà ấy nói to hơn lý.']
        failure_result: ['Bên kia cũng lót, lại lót nhiều hơn. Quan nhận cả hai, xử cho bên đưa sau. Ra khỏi công đường, bạn đứng tựa gốc đa, thấy đất dưới chân như sụt xuống.']
      - id: nhuong_mot_sao
        text: 'Đem một sào ra làm ruộng hương hỏa chung, giữ hòa khí trong họ'
        hint: 'Giữ được lòng họ, mất một sào ruộng tốt'
        effects:
          - { type: property_remove, property: ruong, count: 1 }
          - { type: dynasty_prestige, value: 12 }
          - { type: reputation, group: dan_lang, value: 10 }
          - { type: stress, value: 6 }
        result: ['Ngày làm lễ, sào ruộng được cắm bia đá "Hương hỏa họ". Trưởng chi thứ hai rót rượu mời bạn trước bàn thờ tổ. Cái chén ấy uống vào hơi đắng.']
      - id: nhan_lo_gio
        text: 'Hòa giải: nhận lo trọn giỗ tổ cả họ hằng năm thay cho trả ruộng'
        hint: 'Giữ ruộng, nhưng gánh một khoản chi đều đặn nhiều năm'
        effects:
          - { type: money, value: -10, ledger: su_kien }
          - { type: modifier, target: living.cost, value: 1.15, op: mul, months: 60, label: 'Gánh giỗ tổ cả họ' }
          - { type: dynasty_prestige, value: 6 }
          - { type: set_flag, flag: grh_lo_gio_ho, years: 5, label: 'Gánh giỗ tổ cả họ thay ruộng hương hỏa' }
        result: ['Hai bên điểm chỉ vào tờ hòa giải. Từ năm ấy, cứ đến giỗ tổ là sân nhà bạn bày ba mươi mâm. Ruộng vẫn là ruộng nhà, nhưng mỗi năm mất đứt một vụ hoa lợi.']

  - id: grh_quan_doi_quyen_luong
    title: Quan huyện về quyên lương thảo
    tags: [lang_xa, quan_su, kinh_te]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { any: [{ var: household.net_worth, op: '>=', value: 120 }, { var: household.money, op: '>=', value: 60 }] }
    roles:
      - { id: ly, from: village, village_role: ly_truong }
    weight: 4
    weight_modifiers:
      - { condition: { var: household.net_worth, op: '>=', value: 300 }, factor: 1.8 }
      - { condition: { var: household.net_worth, op: '>=', value: 800 }, factor: 1.67 }
      - { condition: { var: world.military_alert, op: '==', value: chien_dich }, factor: 3 }
    cooldown_years: 6
    tension: 7
    importance: 8
    icon: thue
    text:
      - 'Biên giới có động. Quan huyện về đóng kiệu ở đình, cho gọi các nhà khá giả trong tổng đến "bàn việc nghĩa": mỗi nhà quyên lương thảo cho quân. Tên nhà bạn đứng hàng thứ ba trong tờ danh sách, bên cạnh ghi con số bốn mươi quan.'
      - '{role.ly.call} ghé tai: "Gọi là quyên, chứ nhà nào không quyên thì quan nhớ mặt. Năm sau đo ruộng, bắt phu, ông ấy nhớ cả."'
    options:
      - id: quyen_tien
        text: 'Quyên đủ 40 quan tiền mặt'
        hint: 'Quan vui lòng, nhà hao hụt'
        condition: { var: household.money, op: '>=', value: 40 }
        effects:
          - { type: money, value: -40, ledger: thue }
          - { type: reputation, group: dan_lang, value: 8 }
          - { type: opinion, role: ly, value: 8 }
        result: ['Quan huyện gật đầu, sai thư lại ghi tên. Chiều ấy kiệu quan lên đường, bụi bay mù cả lối. Bạn đứng nhìn theo, tự hỏi bốn mươi quan kia có bao nhiêu đồng đến được tay người lính.']
      - id: quyen_thoc
        text: 'Quyên bằng 35 thúng thóc thay tiền'
        hint: 'Giữ tiền mặt, nhưng kho vơi trước mùa giáp hạt'
        condition: { var: household.food, op: '>=', value: 35 }
        effects:
          - { type: food, value: -35, ledger: thue }
          - { type: reputation, group: dan_lang, value: 6 }
          - { type: opinion, role: ly, value: 5 }
        result: ['Ba mươi lăm thúng thóc được đong lên xe bò. Người áp tải ghi sổ bằng đấu của quan, đấu to hơn đấu làng. Kho nhà vơi đi trông thấy.']
      - id: quyen_gap_doi
        text: 'Quyên hẳn 80 quan, xin quan tâu lên ban hàm "nghĩa dân"'
        hint: 'Có hàm có biển, làng nể; nhưng của đổ vào đấy là của đi luôn'
        condition: { var: household.money, op: '>=', value: 80 }
        trait_stress: { tham_lam: 10, an_phan: 4 }
        effects:
          - { type: money, value: -80, ledger: thue }
          - { type: reputation, group: dan_lang, value: 30 }
          - { type: dynasty_prestige, value: 15 }
          - { type: opinion, role: ly, value: 15 }
          - { type: set_flag, flag: grh_ham_nghia_dan, years: 30, label: 'Được ban hàm nghĩa dân vì quyên lương thảo' }
        result: ['Nửa năm sau, chiếu ban hàm cửu phẩm về đến làng, kèm tấm biển sơn son "Nghĩa dân". Biển treo giữa nhà, ai qua cũng ngước nhìn. Nhưng mỗi lần thấy nó, bạn lại nhớ xâu tiền tám chục quan.']
      - id: keu_ngheo
        text: 'Kêu nhà túng, chỉ quyên 10 quan lấy lệ'
        hint: 'Giữ được tiền nếu quan tin; không thì quan nhớ mặt nhiều năm'
        condition: { var: household.money, op: '>=', value: 10 }
        effects:
          - { type: money, value: -10, ledger: thue }
        chance: { base: 0.35, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: reputation, group: dan_lang, value: -4 }
        failure:
          - { type: set_flag, flag: grh_quan_nho_mat, years: 6, label: 'Quan huyện nhớ mặt nhà không chịu quyên' }
          - { type: money, value: { var: household.money, factor: -0.25, max: 0, min: -40 }, ledger: thue }
          - { type: opinion, role: ly, value: -15 }
          - { type: stress, value: 15 }
        success_result: ['Quan liếc nhìn bạn một cái rồi thôi. Năm ấy cả tổng nhiều nhà kêu túng thật, ông chẳng hỏi kỹ từng nhà.']
        failure_result: ['Quan cười nhạt: "Nhà ngói ba gian mà túng." Tháng sau lính huyện về đo lại ruộng, bắt nộp "tiền thiếu thuế năm cũ". Cái giá của mười quan lấy lệ hóa ra đắt gấp mấy lần.']

  - id: grh_le_khao_len_lao
    title: Lệ khao lên lão
    tags: [lang_xa, le_hoi]
    life_stages: [trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { var: player.age, op: between, value: [50, 70] }
        - { any: [{ var: household.net_worth, op: '>=', value: 120 }, { var: household.money, op: '>=', value: 60 }] }
    roles:
      - { id: ly, from: village, village_role: ly_truong }
    weight: 5
    weight_modifiers:
      - { condition: { var: household.net_worth, op: '>=', value: 300 }, factor: 1.8 }
      - { condition: { var: household.net_worth, op: '>=', value: 800 }, factor: 1.67 }
    cooldown_years: 8
    tension: 4
    importance: 7
    icon: hoi
    text:
      - 'Năm nay bạn đủ tuổi lên lão. Theo lệ làng, người lên lão phải khao: làm cỗ mời các cụ trong giáp, góp lễ vào đình, từ đó mới được ngồi chiếu lão. Nhà nghèo thì xôi gà một mâm cũng xong. Nhà khá như nhà bạn, cả làng đã đợi xem cỗ to cỡ nào.'
      - '{role.ly.call} đến nhắc khéo: "Năm ngoái ông bá hộ khao những ba con lợn. Nhà mình mà kém thì làng cười."'
    options:
      - id: khao_to
        text: 'Khao to: mổ trâu, ba ngày cỗ, góp lễ vào đình (45 quan)'
        hint: 'Rạng mặt cả nhà, ngồi chiếu trên; nhưng của đổ vào một bữa'
        condition: { var: household.money, op: '>=', value: 45 }
        effects:
          - { type: money, value: -45, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: 22 }
          - { type: dynasty_prestige, value: 8 }
          - { type: opinion, role: ly, value: 12 }
          - { type: health, value: -4 }
        result: ['Ba ngày cỗ, khói bếp bay kín trời. Các cụ ngồi đỏ mặt, gõ đũa bình phẩm từng món. Ngày thứ tư bạn được rước ra đình, ngồi chiếu lão hàng đầu. Đêm ấy bạn mệt lả, nhưng ngủ mỉm cười.']
      - id: khao_vua
        text: 'Khao vừa phải: hai con lợn, một ngày cỗ (18 quan)'
        hint: 'Đúng lệ, nhưng làng sẽ so với nhà bá hộ'
        condition: { var: household.money, op: '>=', value: 18 }
        effects:
          - { type: money, value: -18, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: 4 }
        result: ['Cỗ đủ mâm, rượu đủ chén. Có cụ khen nhà biết tiết kiệm, có cụ bĩu môi bảo "giàu mà hà tiện". Bạn được ngồi chiếu lão, ở hàng giữa.']
      - id: khao_thoc
        text: 'Khao bằng thóc: đổ 30 thúng thóc vào kho làng thay cỗ'
        hint: 'Thiết thực, nhưng các cụ thích ăn hơn thích thóc'
        condition: { var: household.food, op: '>=', value: 30 }
        effects:
          - { type: food, value: -30, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: 8 }
          - { type: opinion, role: ly, value: -8 }
        result: ['Ba mươi thúng thóc vào kho nghĩa thương, mùa đói năm sau cứu được mấy nhà. Nhưng hôm ấy, các cụ ngồi đình nhìn nhau: "Lên lão mà không có miếng thịt."']
      - id: khong_khao
        text: 'Không khao: tuổi già là của trời cho, không phải mua bằng cỗ'
        hint: 'Giữ được của, nhưng không được ngồi chiếu lão, mất mặt cả nhà'
        trait_stress: { tham_vong: 6 }
        effects:
          - { type: reputation, group: dan_lang, value: -22 }
          - { type: opinion, role: ly, value: -20 }
          - { type: dynasty_prestige, value: -6 }
          - { type: set_flag, flag: grh_khong_khao_lao, years: 10, label: 'Không khao lên lão, chưa được ngồi chiếu lão' }
        result: ['Đến kỳ tế xuân, các cụ lên chiếu lão, chỗ của bạn bỏ trống. Bạn đứng dưới hiên đình cùng đám trai đinh. Con cháu đi ngoài đường cũng bị bạn bè trêu.']

  - id: grh_chieu_bac_bip
    title: Bọn bịp từ phủ về mở chiếu lớn
    tags: [lang_xa, kinh_te, nguy_hiem]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { var: household.money, op: '>=', value: 40 }
        - { any: [{ var: household.net_worth, op: '>=', value: 120 }, { var: household.money, op: '>=', value: 60 }] }
    roles:
      - { id: ly, from: village, village_role: ly_truong }
    weight: 4
    weight_modifiers:
      - { condition: { var: household.net_worth, op: '>=', value: 300 }, factor: 1.8 }
      - { condition: { var: household.net_worth, op: '>=', value: 800 }, factor: 1.67 }
      - { condition: { has_trait: hao_phong }, factor: 2 }
    cooldown_years: 6
    tension: 7
    importance: 7
    icon: tien
    text:
      - 'Một gã ăn mặc như con nhà quan, tự xưng là chủ hiệu vải trên phủ, thuê gian nhà đầu chợ mở chiếu xóc đĩa. Gã chỉ mời nhà khá giả, rượu ngon, đèn sáng, có cả cô đào hát. Đêm qua lão hàng xóm thắng hai chục quan, sáng nay khoe khắp làng.'
      - 'Gã sai người mang thiếp mời đến tận nhà bạn: "Kính mời quan viên ghé chơi cho vui." Thiếp viết chữ son.'
    options:
      - id: choi_lon
        text: 'Đi, mang 40 quan theo, chơi một đêm cho biết'
        hint: 'Có khi vớ bẫm; chiếu của bọn bịp thì nhà cái ít khi thua'
        trait_stress: { than_trong: 6 }
        effects:
          - { type: money, value: -40, ledger: su_kien }
        chance: { base: 0.2, skill: muu_luoc, per_level: 0.04 }
        success:
          - { type: money, value: 95, ledger: thu_khac }
          - { type: stress, value: -6 }
          - { type: set_flag, flag: grh_me_co_bac, years: 4, label: 'Mê chiếu bạc sau một đêm thắng lớn' }
        failure:
          - { type: debt, value: 20, ledger: vay }
          - { type: stress, value: 20 }
          - { type: reputation, group: dan_lang, value: -8 }
        success_result: ['Đêm ấy bạn thắng như có thần giúp, ôm về gần trăm quan. Đến sáng gã chủ chiếu tiễn ra tận cổng, cười rất tươi: "Hôm nào quan viên lại ghé." Bàn tay bạn ngứa ran cả tuần.']
        failure_result: ['Mấy ván đầu bạn thắng, rồi thua liền tù tì. Hết tiền, gã cho vay thêm hai chục quan "chỗ quen biết". Gà gáy, bạn bước ra, túi rỗng, tay cầm tờ giấy nợ. Mấy hôm sau cả bọn biến mất.']
      - id: choi_tham_do
        text: 'Đi xem, chỉ đặt vài quan thăm dò'
        hint: 'Mất ít, nhưng đã ngồi vào chiếu thì dễ ngồi lâu'
        chance: { base: 0.45, skill: muu_luoc, per_level: 0.05 }
        success:
          - { type: skill_xp, skill: muu_luoc, value: 30 }
          - { type: money, value: 5, ledger: thu_khac }
        failure:
          - { type: money, value: -25, ledger: su_kien }
          - { type: stress, value: 12 }
          - { type: set_flag, flag: grh_me_co_bac, years: 3, label: 'Dây vào chiếu bạc của bọn bịp phủ' }
        success_result: ['Ngồi một lúc, bạn để ý cái bát úp đĩa có đáy dày bất thường. Bạn đứng dậy về, không nói một lời. Sáng hôm sau, kể với ai cũng không ai tin.']
        failure_result: ['Định đặt hai quan, rồi gỡ, rồi gỡ nữa. Đến lúc tỉnh ra thì đã ném vào chiếu hai mươi lăm quan. Đi về qua cầu, bạn đứng nhìn xuống nước một lúc lâu.']
      - id: bao_ly_bat
        text: 'Báo {role.ly.call} cho tuần đinh vây bắt chiếu bạc'
        hint: 'Làng nể; nhưng bọn bịp có đàn em, chúng sẽ trả thù'
        chance: { base: 0.5, skill: ngoai_giao, per_level: 0.04 }
        success:
          - { type: reputation, group: dan_lang, value: 15 }
          - { type: opinion, role: ly, value: 12 }
        failure:
          - { type: food, value: { var: household.food, factor: -0.3 } }
          - { type: property_remove, property: trau, count: 1 }
          - { type: stress, value: 15 }
          - { type: opinion, role: ly, value: -5 }
        success_result: ['Tuần đinh vây gian nhà lúc nửa đêm, bắt được cả bát đĩa hai đáy. Gã chủ chiếu bị giải lên huyện. Mấy nhà mất tiền kéo đến cảm ơn bạn.']
        failure_result: ['Tin lọt ra trước. Tuần đinh đến thì gian nhà đã trống. Ba hôm sau, đống rơm nhà bạn bốc cháy lúc nửa đêm, con trâu trong chuồng bị chém đứt gân chân.']
      - id: tu_choi
        text: 'Gửi trả thiếp, đóng cổng, dặn cả nhà không ai được bén mảng'
        hint: 'Giữ của, nhưng bọn chúng sẽ dụ người trong nhà'
        chance: { base: 0.6 }
        success:
          - { type: stress, value: -2 }
        failure:
          - { type: money, value: { var: household.money, factor: -0.25, max: 0, min: -35 }, ledger: su_kien }
          - { type: stress, value: 12 }
        success_result: ['Mấy tối liền, tiếng xóc đĩa vọng từ đầu chợ. Bạn ngồi hút thuốc lào ở hiên, nghe mà không đi. Nửa tháng sau, bọn chúng cuốn chiếu đi, để lại mấy nhà khóc ròng.']
        failure_result: ['Bạn không đi, nhưng người trong nhà thì lén đi. Tiền trong rương vơi dần, ai cũng nói dối là đi mua giống. Khi biết thì đã mất một khoản không nhỏ.']

  - id: grh_ba_ho_ghen_ghet
    title: Bá hộ ghen ghét giở trò
    tags: [lang_xa, quan_he, ruong_dong]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { any: [{ var: household.net_worth, op: '>=', value: 120 }, { var: household.money, op: '>=', value: 60 }] }
    roles:
      - { id: ba_ho, from: village, village_role: ba_ho }
    weight: 5
    weight_modifiers:
      - { condition: { var: household.net_worth, op: '>=', value: 300 }, factor: 1.8 }
      - { condition: { var: household.net_worth, op: '>=', value: 800 }, factor: 1.67 }
      - { condition: { var: role.ba_ho.opinion, op: '<', value: 0 }, factor: 1.6 }
    cooldown_years: 6
    tension: 7
    importance: 8
    icon: tin_don
    text:
      - 'Nhà bạn mỗi năm một khá, ruộng mua thêm, nhà lợp ngói. {role.ba_ho.call} — xưa nay vẫn là nhà giàu nhất làng — bắt đầu khó chịu. Mùa này lão cho người đắp chặn mương dẫn nước qua ruộng lão vào ruộng nhà bạn, lại tung tin bạn làm giàu nhờ buôn đồ quốc cấm.'
      - 'Ruộng nhà bạn bắt đầu khô nẻ. Ngoài chợ, có người đã không dám bán hàng cho nhà bạn nữa.'
    options:
      - id: bieu_le_lam_lanh
        text: 'Sắm lễ 20 quan sang nhà {role.ba_ho.call} làm lành, nhận mình là đàn em'
        hint: 'Yên chuyện, mương thông; nhưng từ nay phải nhún nhường'
        condition: { var: household.money, op: '>=', value: 20 }
        trait_stress: { tham_vong: 6, nong_nay: 4 }
        effects:
          - { type: money, value: -20, ledger: su_kien }
          - { type: opinion, role: ba_ho, value: 25 }
          - { type: stress, value: 8 }
        result: ['{role.ba_ho.call} nhận lễ, cười khà khà, gọi bạn là "chú em". Hôm sau mương thông. Tin đồn cũng tắt. Nhưng đám giỗ nào có hai nhà, bạn cũng phải ngồi dưới lão một chiếu.']
      - id: doi_dau
        text: 'Đối đầu: kêu làng mở lại mương theo lệ cũ, vạch mặt kẻ tung tin'
        hint: 'Thắng thì làng phục; thua thì lão càng thù, ruộng càng khô'
        chance: { base: 0.4, skill: ngoai_giao, per_level: 0.05, modifiers: [{ condition: { var: player.reputation, op: '>=', value: 30 }, add: 0.15 }] }
        success:
          - { type: reputation, group: dan_lang, value: 20 }
          - { type: opinion, role: ba_ho, value: -30 }
        failure:
          - { type: opinion, role: ba_ho, value: -40 }
          - { type: modifier, target: harvest.yield, value: 0.7, op: mul, months: 12, label: 'Mương nước bị bá hộ chặn' }
          - { type: reputation, group: dan_lang, value: -10 }
          - { type: stress, value: 15 }
          - { type: schedule_event, event: grh_ba_ho_tra_dua, months: 14, label: '{role.ba_ho.call} còn để bụng' }
        success_result: ['Các cụ ra tận mương, xem sổ lệ làng, phán phải phá bờ chặn. Người đàn ông đi tung tin đứng ra thú nhận là được thuê. {role.ba_ho.call} mất mặt giữa đình, từ đó gặp bạn là quay đi.']
        failure_result: ['Các cụ ngồi đình, nửa nhìn bạn nửa nhìn {role.ba_ho.call}, rồi bảo "việc nhà giàu với nhau, tự liệu". Mương vẫn chặn. Mùa ấy nửa đồng ruộng nhà bạn trắng bông lúa lép.']
      - id: ket_thong_gia
        text: 'Ngỏ lời kết thông gia, gả con cho nhà {role.ba_ho.call}'
        hint: 'Biến thù thành thân; nhưng con mình thành con tin trong nhà người ta'
        condition: { var: player.children_count, op: '>=', value: 1 }
        effects:
          - { type: arrange_child_marriage }
          - { type: money, value: { var: household.money, factor: -0.2, max: 0, min: -30 }, ledger: su_kien }
          - { type: opinion, role: ba_ho, value: 30 }
          - { type: stress, value: 10 }
        result: ['Hai nhà giàu nhất làng làm thông gia, cỗ cưới bày kín hai sân. Mương thông, tin đồn tắt. Nhưng mỗi lần con về thăm, bạn đều thấy nó gầy đi một chút.']
      - id: nhan_nhin
        text: 'Nhẫn nhịn, đào giếng khơi tưới tạm, không nói gì'
        hint: 'Không gây thù, nhưng tốn công tốn của mà ruộng vẫn kém'
        effects:
          - { type: money, value: { var: household.money, factor: -0.15, max: 0, min: -20 }, ledger: su_kien }
          - { type: modifier, target: harvest.yield, value: 0.85, op: mul, months: 12, label: 'Tưới bằng giếng khơi' }
          - { type: health, value: -6 }
          - { type: stress, value: 10 }
        result: ['Cả nhà đào hai cái giếng khơi ở đầu ruộng, ngày ngày gánh nước tưới. Lúa không chết, nhưng không được như trước. {role.ba_ho.call} đi qua bờ ruộng, chắp tay sau lưng mà cười.']

  - id: grh_ba_ho_tra_dua
    title: Bá hộ trả đũa
    tags: [lang_xa, quan_he, nguy_hiem]
    scheduled_only: true
    condition: { var: player.is_head, op: '==', value: true }
    roles:
      - { id: ba_ho, from: village, village_role: ba_ho }
    weight: 1
    tension: 8
    importance: 8
    icon: tin_don
    text:
      - 'Một buổi sáng, lính huyện ập vào nhà bạn khám xét: có đơn tố giác nhà bạn chứa đồ quốc cấm. Chúng lục tung mọi chum vại, rồi lôi ra từ đống rơm một bó giáo mác mà bạn chưa từng thấy bao giờ. Ai cũng biết đơn ấy ở đâu ra.'
    options:
      - id: lot_lai
        text: 'Biếu viên đội 40 quan để "không thấy" bó giáo'
        hint: 'Thoát tội ngay, mất một khoản lớn'
        condition: { var: household.money, op: '>=', value: 40 }
        effects:
          - { type: money, value: -40, ledger: su_kien }
          - { type: stress, value: 12 }
          - { type: opinion, role: ba_ho, value: -10 }
        result: ['Viên đội cầm tiền, cho lính vác bó giáo đi "trả lại chủ". Bạn đứng giữa sân lộn xộn, biết rằng chuyện này chưa xong.']
      - id: keu_oan
        text: 'Kêu oan, xin quan cho truy người làm giáo, người đắp rơm'
        hint: 'Gặp quan sáng thì kẻ vu cáo bị tội; không thì vào ngục'
        chance: { base: 0.35, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: reputation, group: dan_lang, value: 20 }
          - { type: opinion, role: ba_ho, value: -20 }
        failure:
          - { type: set_flag, flag: bn_ngoi_tu, years: 1, label: 'Ngồi ngục vì bị vu chứa đồ quốc cấm' }
          - { type: health, value: -28 }
          - { type: money, value: { var: household.money, factor: -0.35, max: 0, min: -60 }, ledger: su_kien }
          - { type: modifier, target: death_risk, value: 2, op: mul, months: 12, label: 'Ngồi ngục huyện' }
          - { type: stress, value: 20 }
        success_result: ['Quan cho gọi thợ rèn trong vùng. Một lão thợ khai ra người đặt rèn bó giáo là quản gia nhà {role.ba_ho.call}. Lão bá hộ phải nộp phạt, cúi đầu xin lỗi giữa đình. Cả làng hả hê.']
        failure_result: ['Quan phán: "Tang vật rành rành." Bạn bị gông giải đi giữa tiếng khóc của cả nhà. {role.ba_ho.call} đứng xem ở cổng, tay lần tràng hạt.']
      - id: cau_hoa
        text: 'Sang nhà {role.ba_ho.call} quỳ xin, bán lại cho lão hai sào ruộng giá rẻ'
        hint: 'Lão rút đơn, nhưng mất ruộng và mất mặt'
        condition: { var: household.farmland, op: '>=', value: 2 }
        effects:
          - { type: property_remove, property: ruong, count: 2 }
          - { type: money, value: 30, ledger: ban_tai_san }
          - { type: opinion, role: ba_ho, value: 25 }
          - { type: reputation, group: dan_lang, value: -15 }
          - { type: stress, value: 15 }
        result: ['Lão bá hộ đọc tờ văn tự bán ruộng, gật gù, rồi sai người lên huyện rút đơn. Hai sào ruộng tốt về tay lão với giá chưa bằng nửa. Bạn về, ngồi một mình trong bóng tối rất lâu.']
