          - { type: modifier, target: health.monthly, value: -0.4, months: 6, label: 'Ăn dè sau trận giặc cỏ', who: household }
        result: ['Bạn gánh thóc ra đình, đổ vào đống thóc cao như núi giữa sân. Tên giặc nhổ toẹt bãi nước trầu xuống chân bạn. Về nhà, nhìn kho vơi một nửa, cả nhà không ai nói gì.']
      - id: giau_thoc
        text: 'Đêm đào hầm dưới gốc chuối giấu thóc, khai là nhà nghèo'
        hint: 'Lọt thì giữ được của; bị lục ra thì chúng không tha'
