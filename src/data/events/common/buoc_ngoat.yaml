  # ════════════════════════ LẬP NGHIỆP – TRUNG NIÊN: CON CÁI ════════════════════════
  - id: bn_con_bi_bat_coc
    title: Con lạc ở chợ phiên
    tags: [gia_dinh, nguy_hiem]
    life_stages: [lap_nghiep, trung_nien]
    condition: { var: player.is_head, op: '==', value: true }
    roles:
      - { id: con, from: family, relation: child, condition: { all: [{ var: self.age, op: between, value: [5, 12] }, { var: self.in_household, op: '==', value: true }] } }
    weight: 4
    once_per_life: true
    tension: 10
    importance: 10
    icon: tre_em
    text:
      - 'Phiên chợ Tết đông như kiến. Chỉ một thoáng quay đi mua gói muối, {role.con.call} đã biến mất giữa biển người. Bạn chạy khắp chợ gọi đến khản tiếng. Một bà bán trầu kể đã thấy đứa trẻ giống thế bị một người đàn bà lạ dắt xuống thuyền đi ngược sông.'
      - 'Người ta bảo bọn buôn người hay đi chợ Tết, bắt trẻ con bán lên mạn ngược làm nô. Thuyền đi nhanh, chậm một ngày là mất dấu.'
    options:
      - id: duoi_theo_thuyen
        text: 'Bỏ hết, thuê thuyền đuổi theo ngược dòng ngay đêm nay'
        hint: 'Đuổi kịp thì giành lại con; bọn buôn người không tay không'
        effects:
          - { type: health, value: -12 }
          - { type: stress, value: 15 }
        chance: { base: 0.35, skill: quan_su, per_level: 0.05 }
        success:
          - { type: opinion, role: con, value: 40 }
          - { type: reputation, group: dan_lang, value: 10 }
        failure:
          - { type: health, value: -25 }
          - { type: leave_household, who: con }
          - { type: stress, value: 30 }
          - { type: set_flag, flag: bn_mat_con, years: 25, label: 'Đứa con bị bắt bán lên mạn ngược' }
        success_result: ['Đến bến thứ ba bạn đuổi kịp con thuyền. Bạn nhảy sang mạn, giằng con khỏi tay người đàn bà, lãnh một nhát đòn gánh vào đầu mà không buông. {role.con.call} ôm cổ bạn khóc suốt đường về.']
        failure_result: ['Ba ngày ba đêm ngược sông, đến ngã ba thì mất dấu. Bọn chèo thuyền thuê còn đánh bạn lấy tiền. Bạn về nhà một mình, đứng ở ngõ không dám bước vào.']
      - id: ban_ruong_chuoc
        text: 'Bán một sào ruộng, nhờ lái buôn mạn ngược dò hỏi chuộc con về'
        hint: 'Mất ruộng là mất của ăn đời; tiền chưa chắc đã đến đúng tay'
        condition: { var: household.farmland, op: '>=', value: 1 }
        effects:
          - { type: property_remove, property: ruong, count: 1 }
          - { type: stress, value: 15 }
        chance: { base: 0.6, skill: ngoai_giao, per_level: 0.04 }
        success:
          - { type: opinion, role: con, value: 30 }
        failure:
          - { type: leave_household, who: con }
          - { type: stress, value: 25 }
          - { type: set_flag, flag: bn_mat_con, years: 25, label: 'Đứa con bị bắt bán lên mạn ngược' }
        success_result: ['Hai tháng sau, lái buôn dắt {role.con.call} về đến cổng, gầy rộc, tóc bị cạo trọc. Sào ruộng đầu làng đã sang tên người khác. Bạn không tiếc.']
        failure_result: ['Lái buôn cầm tiền đi, nửa năm sau nhắn về một câu: "Đứa trẻ đã bị bán sang chỗ khác." Ruộng mất, con cũng không về.']
      - id: bao_quan
        text: 'Lên huyện đánh trống kêu quan, nộp 8 quan lệ phí'
        hint: 'Quan có lính có thuyền; nhưng quan có muốn tìm hay không lại là chuyện khác'
        effects:
          - { type: money, value: -8, ledger: su_kien }
          - { type: stress, value: 12 }
        chance:
          base: 0.25
          skill: ngoai_giao
          per_level: 0.04
          modifiers:
            - { condition: { var: player.reputation, op: '>=', value: 25 }, add: 0.15 }
        success:
          - { type: opinion, role: con, value: 25 }
          - { type: reputation, group: dan_lang, value: 6 }
        failure:
          - { type: leave_household, who: con }
          - { type: stress, value: 28 }
          - { type: set_flag, flag: bn_mat_con, years: 25, label: 'Đứa con bị bắt bán lên mạn ngược' }
        success_result: ['Quan huyện vốn đang bị trên quở về nạn buôn người, sai lính chặn bến ngã ba. Bắt được cả thuyền, trong khoang có năm đứa trẻ, {role.con.call} là đứa thứ hai.']
        failure_result: ['Thư lại ghi tên đứa trẻ vào sổ rồi bảo về chờ. Bạn chờ đến hết mùa xuân. Tờ đơn vẫn nằm dưới chồng giấy.']
      - id: nho_giang_ho
        text: 'Mang 25 quan lên núi, nhờ tay anh chị trên sơn trại dò đường'
        hint: 'Giang hồ biết đường buôn người hơn quan; nhưng nợ giang hồ thì khó trả'
        condition: { var: household.money, op: '>=', value: 25 }
        effects:
          - { type: money, value: -25, ledger: su_kien }
          - { type: wanted, value: 8 }
        chance: { base: 0.6, skill: muu_luoc, per_level: 0.04 }
        success:
          - { type: opinion, role: con, value: 30 }
          - { type: set_flag, flag: bn_no_an_giang_ho, years: 8, label: 'Nợ ân tình kẻ giang hồ trên núi' }
        failure:
          - { type: leave_household, who: con }
          - { type: stress, value: 28 }
          - { type: wanted, value: 10 }
          - { type: set_flag, flag: bn_mat_con, years: 25, label: 'Đứa con bị bắt bán lên mạn ngược' }
        success_result: ['Mười hôm sau, một gã mặt sẹo dắt {role.con.call} đến bờ tre đầu làng lúc nửa đêm. "Đại ca bảo: ơn này có ngày nhờ lại." Hắn nói rồi đi, không quay đầu.']
        failure_result: ['Bọn trên núi cầm tiền, rồi chính chúng bị quan quân vây. Tên bạn có trong sổ người qua lại sơn trại. Đứa con thì vẫn bặt tin.']

  - id: bn_dich_ta_con_nho
