          - { type: modifier, target: stress.monthly, value: 0.6, months: 12, label: 'Day dứt chuyện người cũ' }
        result: ['Tối rằm bạn ngồi ở hiên nhà, nhìn về phía cây gạo. Gió đưa lại tiếng ai hát ru con. Sáng hôm sau người ta bảo người ấy đã đi khỏi làng.']

