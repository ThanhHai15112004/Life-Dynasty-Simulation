          - { type: opinion, role: vc, value: -40 }
          - { type: reputation, group: dan_lang, value: -20 }
          - { type: stress, value: 22 }
          - { type: set_flag, flag: bn_tinh_cu_vo_lo, years: 8, label: 'Chuyện gặp người cũ đã vỡ lở' }
        success_result: ['Hai người ngồi dưới gốc gạo đến khi trăng lặn, không làm gì sai, chỉ nói những chuyện đã muộn hai mươi năm. Về nhà, bạn nằm cạnh {role.vc.call} mà mở mắt đến sáng.']
        failure_result: ['Bà hàng nước đi tắt qua ruộng, trông thấy hai cái bóng dưới gốc gạo. Sáng hôm sau cả chợ đã biết. {role.vc.call} không khóc, không mắng, chỉ dọn chăn sang gian bên. Cái im lặng ấy kéo dài cả năm.']
      - id: giup_tien
        text: 'Không gặp, nhưng nhờ người kín đáo gửi 20 quan làm vốn sinh nhai'
        hint: 'Trả được món nợ lòng; lộ ra thì khó mà giải thích'
        condition: { var: household.money, op: '>=', value: 20 }
        effects:
          - { type: money, value: -20, ledger: su_kien }
        chance: { base: 0.6, skill: muu_luoc, per_level: 0.04 }
        success:
          - { type: stress, value: -6 }
          - { type: reputation, group: dan_lang, value: 4 }
        failure:
          - { type: opinion, role: vc, value: -30 }
          - { type: stress, value: 15 }
        success_result: ['Mấy tháng sau, ngoài chợ có thêm một hàng bánh đúc mới. Bạn đi ngang, không dừng lại. Người bán cũng không ngẩng lên.']
        failure_result: ['Người cầm tiền hộ lỡ miệng với vợ, vợ kể với chị em. {role.vc.call} mở tráp đếm lại tiền nhà, thiếu đúng hai chục quan, rồi nhìn bạn không chớp mắt.']
      - id: noi_that
        text: 'Đưa chiếc khăn cho {role.vc.call} xem, kể hết đầu đuôi'
        hint: 'Thật thà có khi làm vợ chồng gần nhau hơn, có khi làm vỡ cái bát đang lành'
        chance: { base: 0.45, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: opinion, role: vc, value: 22 }
          - { type: stress, value: -10 }
        failure:
          - { type: opinion, role: vc, value: -25 }
          - { type: stress, value: 12 }
        success_result: ['{role.vc.call} cầm chiếc khăn rất lâu rồi bảo: "Người ta khổ thế, nhà mình có gì thì đỡ một ít." Tối ấy hai người ngồi nói chuyện đến khuya, như hồi mới cưới.']
        failure_result: ['{role.vc.call} ném chiếc khăn vào bếp lửa: "Hai mươi năm nay ngủ cạnh tôi mà lòng vẫn để ở bến nước à?" Từ đấy, mỗi lần bạn ra bến, có đôi mắt dõi theo sau lưng.']
      - id: dut_khoat
        text: 'Không đến. Đốt chiếc khăn, coi như chưa từng nhận'
        hint: 'Giữ trọn đạo vợ chồng, nhưng có những thứ đốt đi vẫn còn khói'
        trait_stress: { mo_dao: 6 }
        effects:
          - { type: stress, value: 18 }
