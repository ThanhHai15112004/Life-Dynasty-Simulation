    once_per_life: true
    tension: 7
    importance: 8
    icon: trang
    text:
      - 'Người năm xưa từng hẹn hò với bạn ở bến nước, rồi bị gia đình gả đi xa, nay góa bụa trở về làng, nghèo xơ xác. Đứa trẻ trong xóm mang đến cho bạn một chiếc khăn cũ, gấp làm tư. Chiếc khăn bạn tặng ngày ấy.'
      - 'Lời nhắn đi kèm chỉ mấy chữ: "Tối rằm, chỗ cây gạo." {role.vc.call} đang ngồi bên đèn, không biết gì.'
    options:
      - id: den_gap_rieng
        text: 'Tối rằm lén ra gốc gạo'
        hint: 'Gỡ được nút thắt lòng, nhưng làng này không có gì giấu được lâu'
        trait_stress: { trong_gia_dinh: 8, trung_thanh: 8 }
        chance: { base: 0.5, skill: muu_luoc, per_level: 0.05 }
        success:
          - { type: stress, value: -10 }
          - { type: set_flag, flag: bn_tinh_cu, years: 6, label: 'Mối tình cũ vẫn âm ỉ' }
