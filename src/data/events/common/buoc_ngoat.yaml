          - { type: schedule_event, event: bn_con_thu_ve, months: 36, label: '{role.con.call} hết hạn thú' }
        success_result: ['Đoàn lính thú đi rồi, {role.con.call} mới lần về, người đầy muỗi đốt. {role.ly.call} biết, nhưng không có chứng cứ. Lão để bụng.']
