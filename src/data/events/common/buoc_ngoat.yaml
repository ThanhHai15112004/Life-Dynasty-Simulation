        failure_result: ['Giữa đường, dòng xoáy giật mất sợi thừng. Con trâu bị cuốn đi, kêu một tiếng dài rồi chìm hẳn. Hai bồ thóc cũng trôi theo. Bạn bám được gốc gạo, sống sót với hai bàn tay trắng.']
      - id: cong_nguoi_gia
