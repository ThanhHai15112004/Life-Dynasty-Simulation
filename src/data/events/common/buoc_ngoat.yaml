        failure_result: ['Có kẻ mật báo. Bọn giặc chờ sẵn. Một nhát giáo xuyên qua sườn bạn. Chúng đốt ba nhà, nhà bạn trong số đó, rồi kéo đi. Bạn nằm thoi thóp trên phản, máu thấm đỏ cả chiếu.']
