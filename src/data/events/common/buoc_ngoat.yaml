  - id: bn_chay_nha_mua_hanh
    title: Lửa bén mái rạ giữa mùa hanh
    tags: [thien_tai, nguy_hiem, gia_dinh]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [11, 12, 1, 2, 3]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { var: household.house_tier, op: '==', value: 1 }
    roles:
      - { id: hx, from: village, village_role: hang_xom }
    weight: 4
    once_per_life: true
    tension: 9
    importance: 10
    icon: lua
    text:
      - 'Gió bấc thổi suốt ba ngày, mái rạ khô như bùi nhùi. Nửa đêm, một đốm lửa từ bếp nhà {role.hx.call} bay sang bám vào mái nhà bạn. Lúc bạn choàng tỉnh, khói đã đặc gian giữa, mái phía đông rực lên một mảng.'
      - 'Tiếng mõ cấp cứu dồn dập khắp xóm. Lửa liếm dần về phía gian kho. Bàn thờ tổ, hòm văn tự ruộng, mấy chục thúng thóc, đứa nhỏ đang ngủ ở gian sau — chỉ kịp cứu một thứ.'
    options:
      - id: cuu_kho_thoc
        text: 'Trùm chăn ướt, lao vào gian kho vác thóc ra'
        hint: 'Thóc là mạng sống cả năm; lửa không chờ ai'
        effects:
          - { type: property_remove, property: kho_lua, count: 1 }
          - { type: debt, value: 15, ledger: su_kien }
          - { type: stress, value: 15 }
          - { type: modifier, target: health.monthly, value: -0.5, months: 6, label: 'Ở lều tạm sau trận cháy', who: household }
        chance: { base: 0.45, skill: sinh_ton, per_level: 0.05 }
        success:
          - { type: food, value: { var: household.food, factor: -0.3 } }
          - { type: money, value: { var: household.money, factor: -0.3, max: 0 }, ledger: su_kien }
          - { type: health, value: -12 }
        failure:
          - { type: food, value: { var: household.food, factor: -0.8 } }
          - { type: money, value: { var: household.money, factor: -0.6, max: 0 }, ledger: su_kien }
          - { type: health, value: -32 }
        success_result: ['Bạn vác ra được sáu bao thì mái kho sập. Tóc cháy xém, hai tay phồng rộp. Nhà mất, nhưng có thóc thì còn sống được qua mùa giáp hạt.']
        failure_result: ['Xà kho đổ xuống đúng lúc bạn quay ra. Người ta lôi bạn ra bằng chân, lưng bỏng một mảng to bằng cái nia. Thóc cháy thành than đen, mùi khét cả tháng chưa hết.']
      - id: cuu_ban_tho_van_tu
        text: 'Ôm bàn thờ tổ và hòm văn tự ruộng chạy ra trước'
        hint: 'Giữ được gốc rễ và giấy tờ đất, nhưng thóc tiền thành tro'
        effects:
          - { type: property_remove, property: kho_lua, count: 1 }
          - { type: food, value: { var: household.food, factor: -0.85 } }
          - { type: money, value: { var: household.money, factor: -0.5, max: 0 }, ledger: su_kien }
          - { type: debt, value: 15, ledger: su_kien }
          - { type: health, value: -10 }
          - { type: filial_piety, value: 15 }
          - { type: dynasty_prestige, value: 5 }
          - { type: stress, value: 15 }
          - { type: modifier, target: health.monthly, value: -0.5, months: 6, label: 'Ở lều tạm sau trận cháy', who: household }
        result: ['Bát hương tổ còn ấm trong tay bạn khi mái nhà sụp xuống. Hòm văn tự xém một góc nhưng chữ còn đọc được. Cả làng gật gù: nhà này còn gốc. Còn cái ăn thì ngày mai mới tính.']
      - id: cuu_nguoi_truoc
        text: 'Mặc kệ của nả, lôi người già trẻ nhỏ ra trước, rồi xách nước cứu nhà bên'
        hint: 'Không ai trong nhà bị thương, nhưng trắng tay'
        effects:
          - { type: property_remove, property: kho_lua, count: 1 }
          - { type: property_remove, property: dan_ga, count: 1 }
          - { type: food, value: { var: household.food, factor: -0.9 } }
          - { type: money, value: { var: household.money, factor: -0.6, max: 0 }, ledger: su_kien }
          - { type: debt, value: 18, ledger: su_kien }
          - { type: health, value: -6 }
          - { type: stress, value: 20 }
          - { type: reputation, group: dan_lang, value: 10 }
          - { type: opinion, role: hx, value: 20 }
          - { type: modifier, target: health.monthly, value: -0.5, months: 6, label: 'Ở lều tạm sau trận cháy', who: household }
        result: ['Sáng ra, cả nhà ngồi bên đống tro, áo quần lấm đen nhưng đủ mặt. {role.hx.call} sang quỳ trước cổng xin lỗi vì đốm lửa. Bạn đỡ họ dậy. Trong túi còn đúng mấy đồng xu lẻ.']
      - id: chat_mai_noi
        text: 'Trèo lên chặt đứt mái nối với kho, chặn lửa không cho lan'
        hint: 'Chặn được thì giữ lại nửa nhà; trượt chân thì rơi xuống biển lửa'
        effects:
          - { type: stress, value: 12 }
          - { type: modifier, target: health.monthly, value: -0.4, months: 4, label: 'Sửa lại nửa nhà cháy dở', who: household }
        chance: { base: 0.35, skill: sinh_ton, per_level: 0.05 }
        success:
          - { type: food, value: { var: household.food, factor: -0.4 } }
          - { type: debt, value: 6, ledger: su_kien }
          - { type: health, value: -10 }
          - { type: reputation, group: dan_lang, value: 18 }
          - { type: opinion, role: hx, value: 15 }
        failure:
          - { type: property_remove, property: kho_lua, count: 1 }
          - { type: food, value: { var: household.food, factor: -0.9 } }
          - { type: money, value: { var: household.money, factor: -0.5, max: 0 }, ledger: su_kien }
          - { type: debt, value: 18, ledger: su_kien }
          - { type: health, value: -35 }
        success_result: ['Ba nhát dao, đoạn mái nối rơi xuống sân. Lửa thiêu rụi gian đông nhưng dừng lại trước gian kho. Bạn tuột xuống, chân tay run bần bật. Người làng bảo chưa thấy ai liều đến thế.']
        failure_result: ['Rui mục gãy dưới chân. Bạn rơi thẳng xuống gian giữa giữa đống rạ đang cháy. Người ta lôi được bạn ra, nhưng cả nhà cả kho đã thành tro.']

