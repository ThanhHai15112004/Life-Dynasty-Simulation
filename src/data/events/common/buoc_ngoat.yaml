        failure_result: ['Đêm thứ hai, cột cái gãy. Cả mái nhà đổ nghiêng xuống dòng nước. Bạn ôm được đứa nhỏ, bám vào bè chuối trôi suốt nửa đêm. Ruộng phía bãi bị cát vùi, cày không lên nữa.']

  - id: bn_giac_co_ve_lang
