        text: 'Bỏ tiền nhà ra bù 40 quan cho đủ'
        hint: 'Làng biết ơn, nhà mình thì hao một khoản lớn'
        condition: { var: household.money, op: '>=', value: 40 }
        effects:
          - { type: money, value: -40, ledger: thue }
          - { type: reputation, group: dan_lang, value: 18 }
          - { type: stress, value: 8 }
        result: ['Bạn mở tráp, đếm từng xâu đưa cho viên đề lại. Ra về, mấy bà già trong xóm đứng chắp tay bên đường. Đêm ấy bạn tính lại sổ nhà, thở dài.']
      - id: ep_dan_nop
        text: 'Sai tuần đinh đi từng nhà, ai thiếu thì dắt trâu, khiêng thóc'
        hint: 'Đủ thuế, không mất tiền nhà; nhưng thành kẻ cả làng căm'
        trait_stress: { nhan_tu: 12 }
        effects:
          - { type: reputation, group: dan_lang, value: -28 }
          - { type: stress, value: 12 }
          - { type: set_flag, flag: bn_ly_truong_ac, years: 10, label: 'Mang tiếng lý trưởng ác' }
        result: ['Tiếng khóc vọng khắp xóm dưới. Một bà góa nằm vật trước chuồng trâu không cho dắt. Thuế đủ. Từ đó đi đâu bạn cũng nghe sau lưng có tiếng nhổ nước bọt.']
      - id: khai_gian_so
        text: 'Sửa sổ đinh, khai bớt số suất đinh cho khớp'
        hint: 'Lọt thì êm; bị tra ra thì tội khai man, vào ngục'
        chance: { base: 0.4, skill: muu_luoc, per_level: 0.05 }
        success:
          - { type: skill_xp, skill: muu_luoc, value: 35 }
          - { type: stress, value: 8 }
        failure:
          - { type: clear_flag, flag: bn_lam_ly_truong }
          - { type: set_flag, flag: bn_ngoi_tu, years: 1, label: 'Ngồi ngục vì khai man sổ đinh' }
          - { type: health, value: -30 }
          - { type: stress, value: 22 }
          - { type: reputation, group: dan_lang, value: -20 }
          - { type: money, value: { var: household.money, factor: -0.4, max: 0, min: -60 }, ledger: su_kien }
          - { type: modifier, target: death_risk, value: 2, op: mul, months: 12, label: 'Ngồi ngục huyện' }
          - { type: modifier, target: health.monthly, value: -1, months: 12, label: 'Ngồi ngục huyện' }
        success_result: ['Viên đề lại lật sổ, gật gù, đóng triện. Bạn về nhà, mồ hôi ướt đẫm lưng áo. Cái sổ ấy, bạn biết, sẽ có ngày có người mở lại.']
        failure_result: ['Huyện cho người đi điểm đinh từng nhà. Số không khớp. Bạn bị lột ấn tại chỗ, gông giải lên huyện. Nhà phải bán đồ đạc chạy chọt mới đưa được cơm vào ngục.']
      - id: tu_chuc
        text: 'Trả ấn, xin từ chức, chịu phạt vì không tròn việc'
        hint: 'Thoát gánh nặng, nhưng mất mặt và chịu khoản phạt'
        effects:
          - { type: clear_flag, flag: bn_lam_ly_truong }
          - { type: debt, value: 18, ledger: thue }
          - { type: reputation, group: dan_lang, value: -10 }
          - { type: stress, value: -8 }
        result: ['Bạn đặt cái ấn lên án thư, cúi đầu lui ra. Khoản phạt ghi vào sổ, nặng như món nợ. Nhưng đêm ấy, lần đầu tiên sau hai năm, bạn ngủ một mạch đến sáng.']

  - id: bn_hu_bac_nen_nha
    title: Hũ bạc dưới nền nhà cũ
    tags: [thoi_co, gia_dinh, lang_xa]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition: { var: player.is_head, op: '==', value: true }
    weight: 3
    once_per_life: true
    tension: 6
    importance: 9
    icon: tien
    text:
      - 'Đào nền dựng lại gian bếp, lưỡi cuốc va phải vật gì cứng. Bạn bới lên được một hũ sành miệng trát vôi. Đập ra: bạc nén xếp kín, có đến bảy tám chục lạng, nén nào cũng khắc dấu một dòng họ quan đời trước.'
      - 'Người ta kể nền đất này xưa là nhà một ông quan bị tịch biên, cả họ chết hết. Luật nói của chôn tìm được phải trình quan. Nhưng chẳng ai thấy, ngoài bạn.'
    options:
      - id: giu_kin
        text: 'Lấp lại, giấu kín, tiêu dần từng nén'
        hint: 'Giàu lên một bước; nhưng làng này không có tường nào kín gió'
        trait_stress: { than_trong: 4 }
        effects:
          - { type: money, value: 70, ledger: thu_khac }
          - { type: stress, value: 8 }
          - { type: set_flag, flag: bn_giu_hu_bac, years: 10, label: 'Hũ bạc giấu kín dưới nền bếp' }
          - { type: schedule_event, event: bn_hu_bac_lo_chuyen, months: 18 }
        result: ['Bạn chôn hũ bạc xuống chân cột, lấp đất, nện thật chặt. Đêm nào cũng giật mình vì tiếng chó sủa. Mua thêm thứ gì, bạn cũng phải nghĩ ra một lời giải thích.']
      - id: nop_quan
        text: 'Trình lên quan huyện, chờ phần thưởng theo luật'
        hint: 'Yên tâm, có tiếng thật thà; phần thưởng thì chỉ bằng một góc'
        trait_stress: { tham_lam: 10 }
        effects:
          - { type: money, value: 12, ledger: thu_khac }
          - { type: reputation, group: dan_lang, value: 20 }
          - { type: stress, value: -5 }
        result: ['Quan huyện cho lính khiêng hũ bạc đi, trao lại cho bạn một xâu tiền thưởng và tấm thiếp khen. Cả làng bảo bạn dại. Bạn thì ngủ ngon.']
      - id: chia_ho_hang
        text: 'Giữ một nửa, nửa kia chia cho họ hàng và người nghèo trong xóm'
        hint: 'Được lòng người, nhưng nhiều miệng biết thì càng dễ lộ'
        effects:
          - { type: money, value: 35, ledger: thu_khac }
          - { type: reputation, group: dan_lang, value: 12 }
          - { type: dynasty_prestige, value: 5 }
        chance: { base: 0.55, skill: muu_luoc, per_level: 0.04 }
        success:
          - { type: stress, value: -4 }
        failure:
          - { type: set_flag, flag: bn_giu_hu_bac, years: 10, label: 'Chuyện hũ bạc đã có người biết' }
          - { type: schedule_event, event: bn_hu_bac_lo_chuyen, months: 8 }
          - { type: stress, value: 10 }
        success_result: ['Người nhận tiền ai cũng thề giữ kín. Đến Tết, nhà nghèo nhất xóm cũng có con gà luộc cúng tổ tiên. Bạn nhìn khói bếp các nhà mà thấy ấm lòng.']
        failure_result: ['Một bà thím trong họ khoe với chị em ngoài chợ rằng nhà bạn "đào được của". Đến tai {village.ly_truong.call} chỉ mất ba hôm.']
      - id: dung_cau_da
        text: 'Đem cả hũ bạc dựng cây cầu đá qua lạch cho cả làng'
        hint: 'Tiếng thơm muôn đời, nhà thì không giữ lại đồng nào'
        effects:
          - { type: reputation, group: dan_lang, value: 35 }
          - { type: dynasty_prestige, value: 15 }
          - { type: stress, value: -6 }
        result: ['Cây cầu đá ba nhịp bắc qua lạch, khắc tên nhà bạn ở chân cầu. Đàn bà đi chợ không còn phải lội nước. Bao nhiêu năm sau, người qua cầu vẫn chỉ tay mà kể.']

  - id: bn_hu_bac_lo_chuyen
    title: Chuyện hũ bạc đến tai ông lý
    tags: [lang_xa, quan_he]
    scheduled_only: true
    once_per_life: true
    condition: { has_flag: bn_giu_hu_bac }
    roles:
      - { id: ly, from: village, village_role: ly_truong }
    weight: 1
    tension: 8
    importance: 9
    icon: tin_don
    text:
      - '{role.ly.call} sang chơi, ngồi uống hết ấm chè rồi mới nói bóng gió: "Nghe đâu nền đất nhà ông xưa là của quan bị tịch biên. Của ấy là của vua. Giấu của vua thì tội to lắm." Ông ta xoa xoa hai bàn tay.'
    options:
      - id: chia_ly
        text: 'Lấy 30 quan biếu {role.ly.call} cho kín miệng'
        hint: 'Êm chuyện, nhưng đã đưa một lần thì có lần sau'
        condition: { var: household.money, op: '>=', value: 30 }
        effects:
          - { type: money, value: -30, ledger: su_kien }
          - { type: opinion, role: ly, value: 12 }
          - { type: clear_flag, flag: bn_giu_hu_bac }
          - { type: stress, value: 6 }
        result: ['{role.ly.call} nhét xâu tiền vào tay áo, đứng dậy cười: "Chuyện trong làng, làng biết." Từ đó mỗi lần nhà bạn có việc, ông ta lại ghé qua uống nước.']
      - id: choi_bay
        text: 'Chối phăng, bảo là tin đồn nhảm của đàn bà'
        hint: 'Ông lý không có chứng cứ thì phải thôi; có thì lên huyện'
        chance: { base: 0.4, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: opinion, role: ly, value: -12 }
          - { type: clear_flag, flag: bn_giu_hu_bac }
        failure:
          - { type: money, value: { var: household.money, factor: -0.6, max: 0, min: -70 }, ledger: su_kien }
          - { type: health, value: -18 }
          - { type: reputation, group: dan_lang, value: -20 }
          - { type: opinion, role: ly, value: -25 }
          - { type: clear_flag, flag: bn_giu_hu_bac }
        success_result: ['{role.ly.call} nhìn bạn một hồi lâu rồi cười khẩy, đứng dậy về. Ông ta không có gì trong tay. Nhưng ánh mắt ấy thì bạn nhớ.']
        failure_result: ['Ba hôm sau lính huyện về đào tung nền bếp, moi ra hũ bạc. Bạn bị đánh hai mươi trượng vì tội giấu của công, nhà bị tịch thu thêm một khoản "tiền phạt". Cả làng đứng xem.']
      - id: nop_lai
        text: 'Tự lên huyện nộp lại phần bạc còn lại, xin khoan hồng'
        hint: 'Tránh được đòn, nhưng mất gần hết số đã có'
        effects:
          - { type: money, value: { var: household.money, factor: -0.7, max: 0, min: -60 }, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: 5 }
          - { type: opinion, role: ly, value: -8 }
          - { type: clear_flag, flag: bn_giu_hu_bac }
          - { type: stress, value: -4 }
        result: ['Quan huyện nhận lại bạc, khen bạn biết hối, tha cho tội. {role.ly.call} đứng ngoài cổng công đường, mặt như mất của. Bạn về làng, nhẹ cả người lẫn túi.']

  - id: bn_con_roi_tim_den
    title: Đứa con rơi năm xưa
    tags: [gia_dinh, quan_he]
    life_stages: [trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.sex, op: '==', value: m }
        - { var: player.married, op: '==', value: true }
        - { var: player.age, op: between, value: [40, 66] }
    roles:
      - { id: vc, from: family, relation: spouse, condition: { var: self.in_household, op: '==', value: true } }
    weight: 3
    weight_modifiers:
      - { condition: { var: player.origin, op: in, value: [thuong_nhan, quy_toc_nho] }, factor: 1.5 }
    once_per_life: true
    tension: 8
    importance: 9
    icon: tre_em
    text:
      - 'Một người đàn bà lam lũ dắt đứa trẻ chừng mười tuổi đứng trước cổng. Chị ta nói đứa bé là con bạn, từ chuyến đi xa năm nào. Đứa trẻ có cái nốt ruồi sau tai, y như bạn. Chị ta sắp đi ở cho nhà người ta, không nuôi nổi con nữa.'
      - '{role.vc.call} đứng sau bức bình phong, mặt trắng bệch. Hàng xóm đã bắt đầu tụ ở bờ rào.'
    options:
      - id: nhan_ve
        text: 'Nhận đứa trẻ về nhà, cho mang họ mình'
        hint: 'Trọn đạo làm cha, nhưng {role.vc.call} sẽ không dễ tha thứ'
        trait_stress: { than_trong: 4 }
        effects:
          - { type: adopt_child }
          - { type: opinion, role: vc, value: -35 }
          - { type: reputation, group: dan_lang, value: -8 }
          - { type: stress, value: 15 }
          - { type: filial_piety, value: 4 }
        result: ['Đứa trẻ bước qua ngưỡng cửa, nép vào chân bạn. {role.vc.call} quay vào buồng, đóng cửa. Bữa cơm tối ấy có thêm một cái bát, và thiếu một người.']
      - id: cho_tien_bao_di
        text: 'Kín đáo đưa 25 quan, bảo hai mẹ con đi nơi khác'
        hint: 'Giữ yên trong nhà nếu không ai biết; lộ ra thì mang tiếng bạc tình'
        condition: { var: household.money, op: '>=', value: 25 }
        trait_stress: { nhan_tu: 6, trong_gia_dinh: 4 }
        effects:
          - { type: money, value: -25, ledger: su_kien }
          - { type: stress, value: 10 }
        chance: { base: 0.5, skill: muu_luoc, per_level: 0.05 }
        success:
          - { type: set_flag, flag: bn_con_roi_xa, years: 20, label: 'Đứa con rơi ở phương xa' }
        failure:
          - { type: opinion, role: vc, value: -35 }
          - { type: reputation, group: dan_lang, value: -15 }
          - { type: stress, value: 12 }
        success_result: ['Hai mẹ con đi lúc trời chưa sáng. Đứa trẻ ngoái lại nhìn cái cổng nhà bạn một lần. Bạn đứng sau rặng râm bụt, không bước ra.']
        failure_result: ['Người đàn bà khóc lóc giữa ngõ, kể cho cả xóm rằng bạn đuổi con đi bằng mấy xâu tiền. {role.vc.call} biết chuyện từ miệng hàng xóm, chứ không phải từ bạn.']
      - id: choi_bo
        text: 'Chối, đóng cổng, bảo chị ta nhận nhầm người'
        hint: 'Không tốn một đồng, nhưng có những đứa trẻ lớn lên sẽ nhớ'
        trait_stress: { nhan_tu: 10, trong_gia_dinh: 6 }
        effects:
          - { type: stress, value: 18 }
          - { type: opinion, role: vc, value: -10 }
          - { type: reputation, group: dan_lang, value: -10 }
          - { type: set_flag, flag: bn_choi_con_roi, years: 25, label: 'Đứa con không nhận' }
        result: ['Cánh cổng đóng sập. Người đàn bà đứng ngoài đến chiều rồi dắt con đi. {role.vc.call} không hỏi gì, mà như thế còn khó chịu hơn. Đêm nào bạn cũng nhớ cái nốt ruồi sau tai.']
      - id: thu_that
        text: 'Gọi {role.vc.call} ra, quỳ xuống nhận lỗi, xin cùng quyết định'
        hint: 'Nói thật có khi được bao dung; có khi mất luôn cả hai bên'
        chance: { base: 0.4, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: adopt_child }
          - { type: opinion, role: vc, value: -8 }
          - { type: stress, value: -4 }
        failure:
          - { type: opinion, role: vc, value: -40 }
          - { type: stress, value: 18 }
          - { type: reputation, group: dan_lang, value: -10 }
        success_result: ['{role.vc.call} im lặng rất lâu, rồi đi ra cổng, cúi xuống lau mặt cho đứa trẻ: "Vào ăn cơm đi con." Chuyện ấy, cả đời {role.vc.call} không nhắc lại lần nào.']
        failure_result: ['{role.vc.call} nghe xong, đứng dậy thu xếp tay nải về nhà mẹ đẻ. Người đàn bà lạ cũng dắt con đi. Ngôi nhà bỗng rộng thênh thang.']

  - id: bn_chau_gay_an_mang
    title: Đứa con gây án mạng ở hội làng
    tags: [gia_dinh, nguy_hiem, lang_xa]
    life_stages: [trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { var: player.age, op: '>=', value: 45 }
    roles:
      - { id: ke, from: family, relation: child, condition: { all: [{ var: self.sex, op: '==', value: m }, { var: self.age, op: between, value: [16, 32] }, { var: self.in_household, op: '==', value: true }] } }
      - { id: ly, from: village, village_role: ly_truong }
    weight: 3
    weight_modifiers:
      - { condition: { has_trait: nong_nay, who: ke }, factor: 2.5 }
    once_per_life: true
    tension: 10
    importance: 10
    icon: tang
    text:
      - 'Hội vật làng bên, {role.ke.call} uống rượu rồi xô xát với mấy gã làng ấy. Một cú đẩy, gã kia ngã đập đầu vào cối đá, chết ngay giữa sân. Bây giờ {role.ke.call} đang bị trói ở đình làng người ta, họ đòi giải lên huyện xử tội chết.'
      - '{role.ly.call} đến báo tin, giọng run run: "Án mạng thì quan không tha. Muốn giữ đầu nó, chỉ có tiền hoặc có người chịu thay."'
    options:
      - id: ban_ruong_chay_an
        text: 'Bán hai sào ruộng, lo tiền xóa án và đền mạng'
        hint: 'Giữ được người, nhưng mất phần lớn cơ nghiệp'
        condition: { var: household.farmland, op: '>=', value: 2 }
        effects:
          - { type: property_remove, property: ruong, count: 2 }
          - { type: opinion, role: ke, value: 25 }
          - { type: reputation, group: dan_lang, value: -15 }
          - { type: stress, value: 18 }
          - { type: health, value: -8 }
        result: ['Văn tự hai sào ruộng tốt nhất đặt lên án thư nhà quan. Án được ghi thành "lỡ tay ngộ sát", đền tiền cho nhà người chết. {role.ke.call} được thả về, quỳ ở sân suốt một đêm.']
      - id: nop_tien_chay_an
        text: 'Mở tráp, bỏ 60 quan lo lót và đền mạng'
        hint: 'Gần như sạch tích lũy, nhưng giữ được ruộng'
        condition: { var: household.money, op: '>=', value: 60 }
        effects:
          - { type: money, value: -60, ledger: su_kien }
          - { type: opinion, role: ke, value: 25 }
          - { type: reputation, group: dan_lang, value: -12 }
          - { type: stress, value: 15 }
        result: ['Từng xâu tiền đổi thành một chữ "ngộ". Nhà người chết nhận tiền, không làm khó. Cái tráp gỗ trống rỗng, nhẹ như không.']
      - id: de_phep_nuoc
        text: 'Để phép nước xử, nhà không lo lót'
        hint: 'Giữ của, giữ đạo; nhưng con có thể không về'
        trait_stress: { trong_gia_dinh: 12 }
        effects:
          - { type: health, who: ke, value: -35 }
          - { type: modifier, target: health.monthly, value: -1.2, months: 24, label: 'Ngồi ngục huyện', who: ke }
          - { type: modifier, target: death_risk, value: 3, op: mul, months: 24, label: 'Ngồi ngục huyện', who: ke }
          - { type: opinion, role: ke, value: -40 }
