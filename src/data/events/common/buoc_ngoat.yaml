      - id: bam_noc_giu_nha
        text: 'Đưa cả nhà lên gác bếp, bám nóc giữ lấy cái nhà'
        hint: 'Nhà vững thì giữ được đồ đạc; nhà sập thì cả nhà chung số phận'
        effects:
          - { type: modifier, target: harvest.yield, value: 0.5, op: mul, months: 6, label: 'Ruộng ngập nước lũ' }
