          - { type: health, value: -14 }
          - { type: skill_xp, skill: quan_su, value: 50 }
          - { type: food, value: { var: household.food, factor: -0.1 } }
        failure:
          - { type: health, value: -45 }
          - { type: stress, value: 20 }
          - { type: food, value: { var: household.food, factor: -0.7 } }
          - { type: property_remove, property: trau, count: 1 }
