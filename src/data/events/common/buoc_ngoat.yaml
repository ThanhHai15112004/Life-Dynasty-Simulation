      - 'Tối ấy {role.con.call} ngồi mài con dao quắm ngoài hiên, không nói gì. Nhà bên có người lựa lời: "Nhà khá thì thuê người đi thay, lệ vẫn cho." Giá thuê một mạng người ba năm là bốn mươi quan.'
