          - { type: property_remove, property: trau, count: 1 }
          - { type: stress, value: 15 }
        success_result: ['Chúng chọc giáo khắp sân, lật tung chum vại, chỉ thấy mấy thúng thóc lép. Tên đầu sỏ chửi một câu rồi đi. Đất dưới gốc chuối vẫn yên.']
        failure_result: ['Một tên giẫm phải chỗ đất mới lấp. Chúng moi ra hết hầm thóc, trói bạn vào cột đánh đến ngất, dắt luôn con trâu đi. Hàng xóm đứng sau rặng tre nhìn, không ai dám ra.']
      - id: cam_gay_danh
        text: 'Cùng trai làng đánh úp chúng lúc nửa đêm'
        hint: 'Thắng thì cả vùng nhắc tên; thua thì mất mạng như chơi'
        trait_stress: { than_trong: 8, an_phan: 5 }
        chance:
          base: 0.35
          skill: quan_su
