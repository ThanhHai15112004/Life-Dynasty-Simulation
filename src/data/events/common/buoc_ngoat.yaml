    tension: 6
    importance: 9
    icon: sach
    text:
      - '{role.thay.call} đến tận nhà, khăn áo chỉnh tề. "{role.con.call} nhà ta sáng dạ nhất lớp, tôi dạy không nổi nữa rồi. Cho cháu lên huyện trọ học cụ Hoàng giáp, vài năm nữa ắt có tên trên bảng." Rồi thầy nói khẽ: tiền trọ, tiền sách, tiền lễ thầy mỗi năm không dưới chục quan.'
      - 'Đêm ấy bạn nghe {role.con.call} đọc bài một mình ngoài hiên, giọng trong veo. Ngoài đồng, mấy sào ruộng đang chờ thêm một đôi tay.'
    options:
      - id: ban_trau_cho_hoc
        text: 'Bán con trâu, gửi {role.con.call} lên huyện'
        hint: 'Mở đường khoa cử cho con; nhà mất sức kéo, ruộng cày tay'
        condition: { has_property: trau }
        effects:
          - { type: property_remove, property: trau, count: 1 }
          - { type: opinion, role: con, value: 30 }
          - { type: opinion, role: thay, value: 15 }
          - { type: stress, value: 8 }
          - { type: modifier, target: xp.hoc_van, value: 1.7, op: mul, months: 48, label: 'Trọ học trên huyện', who: con }
          - { type: set_flag, flag: bn_con_tro_hoc, years: 4, label: '{role.con.call} trọ học trên huyện' }
          - { type: schedule_event, event: bn_con_vao_truong_thi, months: 48, label: '{role.con.call} sắp vào trường thi' }
        result: ['Con trâu được dắt ra chợ phiên sáng hôm sau. {role.con.call} khoác tay nải đi theo {role.thay.call}, ngoái lại ba lần. Mùa ấy bạn cuốc ruộng bằng tay, lưng còng xuống, nhưng mỗi lần nghĩ đến con lại thấy nhẹ.']
      - id: vay_cho_hoc
        text: 'Vay 35 quan lo cho con bốn năm đèn sách'
        hint: 'Giữ được trâu, nhưng nợ học hành thì chỉ khoa bảng mới trả nổi'
        effects:
          - { type: debt, value: 35, ledger: vay }
          - { type: opinion, role: con, value: 30 }
          - { type: opinion, role: thay, value: 15 }
          - { type: stress, value: 10 }
          - { type: modifier, target: xp.hoc_van, value: 1.7, op: mul, months: 48, label: 'Trọ học trên huyện', who: con }
          - { type: set_flag, flag: bn_con_tro_hoc, years: 4, label: '{role.con.call} trọ học trên huyện' }
          - { type: schedule_event, event: bn_con_vao_truong_thi, months: 48, label: '{role.con.call} sắp vào trường thi' }
        result: ['Bạn điểm chỉ vào tờ văn tự vay nợ, tay không run. {role.con.call} quỳ lạy cha mẹ trước khi đi. Món nợ 35 quan nằm đó, chờ một cái tên trên bảng vàng.']
      - id: hoc_o_lang
        text: 'Cho học thêm với {role.thay.call} ở làng, buổi đi học buổi ra đồng'
        hint: 'Không tốn kém, nhưng thầy làng chỉ đưa con đi được nửa đường'
        effects:
          - { type: money, value: -3, ledger: day_hoc }
          - { type: opinion, role: con, value: -12 }
          - { type: opinion, role: thay, value: -10 }
          - { type: modifier, target: xp.hoc_van, value: 1.15, op: mul, months: 36, label: 'Vừa học vừa làm', who: con }
        result: ['{role.thay.call} thở dài, cầm mấy quan lễ mà không vui. {role.con.call} sáng cầm sách, chiều cầm liềm. Có hôm bạn thấy con ngồi trên bờ ruộng, mắt nhìn về phía đường lên huyện.']
      - id: giu_con_lam_ruong
        text: 'Thôi, chữ nghĩa không nuôi được nhà. Cho con nghỉ học hẳn'
        hint: 'Nhà thêm người làm ngay, nhưng con sẽ nhớ mãi'
        trait_stress: { tham_vong: 6 }
        effects:
          - { type: opinion, role: con, value: -35 }
          - { type: opinion, role: thay, value: -20 }
          - { type: stress, value: 6 }
          - { type: modifier, target: harvest.yield, value: 1.06, op: mul, months: 36, label: 'Con ở nhà phụ ruộng' }
          - { type: set_flag, flag: bn_con_oan_bo_hoc, years: 15, label: '{role.con.call} oán chuyện bị bắt bỏ học' }
        result: ['{role.con.call} gấp sách cất vào đáy rương, không cãi một lời. Năm ấy ruộng nhà xanh tốt hơn hẳn. Nhưng tối tối, con không còn đọc bài ngoài hiên nữa.']

  - id: bn_con_vao_truong_thi
    title: Con vào trường thi Hương
    tags: [hoc_hanh, gia_dinh]
    scheduled_only: true
    once_per_life: true
    roles:
      - { id: con, from: family, relation: child }
