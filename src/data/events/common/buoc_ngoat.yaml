          - { type: stress, value: 20 }
        success_result: ['Tiền vay đổi lấy mấy thang thuốc đắng nghét và năm đêm thức trắng. {role.con.call} qua cơn. Món nợ thì ở lại, ghi trong sổ nhà bá hộ.']
        failure_result: ['Thuốc quý cũng không giữ được. Tiền thì đã thành nợ, lãi chạy theo từng tháng.']
