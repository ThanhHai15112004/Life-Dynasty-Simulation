        success_result: ['Các cụ ở đình xem tờ văn tự, so dấu điểm chỉ, rồi bảo: "Ai vay thì người ấy trả." {role.chu_no.call} cuộn giấy lại, mặt hằm hằm. Lão sẽ không quên.']
