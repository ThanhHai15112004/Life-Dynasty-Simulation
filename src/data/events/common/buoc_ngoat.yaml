        chance:
          base: 0.15
          modifiers:
            - { condition: { var: role.con.skill.hoc_van, op: '>=', value: 4 }, add: 0.15 }
            - { condition: { var: role.con.skill.hoc_van, op: '>=', value: 7 }, add: 0.2 }
        success:
          - { type: dynasty_prestige, value: 25 }
          - { type: scholarly_prestige, value: 20 }
          - { type: reputation, group: dan_lang, value: 22 }
          - { type: opinion, role: con, value: 25 }
          - { type: set_flag, flag: bn_con_do_dat, years: 30, label: '{role.con.call} đã đỗ thi Hương' }
        failure:
          - { type: stress, value: 15 }
          - { type: opinion, role: con, value: -8 }
          - { type: health, who: con, value: -10 }
        success_result: ['Quyển văn của {role.con.call} rơi vào tay một vị giám khảo già khó tính. Ông phê: "Văn có cốt." Con đỗ giữa một khoa đầy tai tiếng, và chính vì thế mà cả huyện nhắc tên.']
        failure_result: ['Con trượt. Người đỗ đầu là con nhà quan phủ, nghe đâu chưa thuộc hết Tứ thư. {role.con.call} về nhà, gầy rộc, ngồi bên bờ ruộng nhìn mãi về phía huyện. Bốn năm đèn sách, bao nhiêu tiền của, đành chờ khoa sau.']
      - id: cho_con_ve
        text: 'Thôi thi cử, gọi con về giúp nhà, nhận lời làm thầy đồ dạy trẻ'
        hint: 'Không mất thêm tiền, nhưng bốn năm đèn sách thành dở dang'
        effects:
          - { type: clear_flag, flag: bn_con_tro_hoc }
          - { type: opinion, role: con, value: -25 }
          - { type: scholarly_prestige, value: 4 }
          - { type: stress, value: 8 }
        result: ['{role.con.call} gật đầu, không cãi. Con mở lớp dạy trẻ ở hiên nhà, tiếng ê a vọng ra tận ngõ. Có những đêm bạn nghe con đọc lại bài phú cũ một mình.']

