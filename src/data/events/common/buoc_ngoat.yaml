# Sự kiện quyết định — BƯỚC NGOẶT ĐỜI NGƯỜI. Tiền tố id: bn_
# Mỗi chuyện chỉ gặp một lần trong đời (once_per_life), hậu quả lớn và để lại dấu vết nhiều năm.
# Không có phương án "an toàn tuyệt đối": giữ của thì mất người, giữ người thì mất của, giữ tiếng thì mất sức.
# Chuỗi nhiều hồi:
#   - bn_con_trai_di_thu → bn_con_thu_ve (con đi thú biên ba năm rồi về)
#   - bn_thay_do_tien_cu_con → bn_con_vao_truong_thi (con trọ học trên huyện, bốn năm sau vào trường thi)
#   - bn_hu_bac_nen_nha → bn_hu_bac_lo_chuyen (giữ kín hũ bạc thì có ngày lộ)
#   - bn_cu_lam_ly_truong → bn_ly_truong_thieu_suu (làm lý trưởng thì phải gánh sưu thuế cả làng)
# Cờ dùng chung: bn_ngoi_tu (đang ngồi ngục), bn_mat_con (con thất lạc), bn_mang_tieng_trom (mang tiếng trộm).
events:
  # ════════════════════════ THIẾU THỜI (6–15) ════════════════════════
  - id: bn_cha_nga_mai_dinh
    title: Cha ngã từ mái đình
    tags: [gia_dinh, nguy_hiem, benh_tat]
    life_stages: [thieu_thoi]
    condition: { var: player.age, op: between, value: [9, 15] }
    roles:
      - { id: cha, from: family, relation: father, condition: { all: [{ var: self.in_household, op: '==', value: true }, { var: self.health, op: '>=', value: 40 }, { var: self.age, op: '<', value: 60 }] } }
    weight: 4
    once_per_life: true
    tension: 8
    importance: 9
    icon: om
    text:
      - 'Làng thay ngói đình trước hội, {role.cha.call} được cử lên mái vì nhẹ người và quen trèo. Đang nối kèo thì thanh tre gãy. Người ta khiêng {role.cha.call} về trên tấm phản, mặt tái như tàu lá, hai chân không cựa được.'
      - 'Thầy lang nắn lưng {role.cha.call} một hồi rồi lắc đầu: "Gãy xương sống. Sống được, nhưng cày bừa thì chưa biết bao giờ." Mẹ ngồi bệt dưới hiên, nhìn ra mấy sào ruộng chưa cày ải. Bạn mới {player.age} tuổi.'
    options:
      - id: thay_cha_cay
        text: 'Gác sách vở, thay {role.cha.call} cầm cày'
        hint: 'Nhà có người làm, nhưng bạn bỏ dở chữ nghĩa và tuổi nhỏ thì gánh không nổi lâu'
        trait_stress: { tu_do: 5 }
        effects:
          - { type: health, who: cha, value: -30 }
          - { type: health, value: -12 }
          - { type: stress, value: 10 }
          - { type: skill_xp, skill: sinh_ton, value: 45 }
          - { type: filial_piety, value: 12 }
          - { type: opinion, role: cha, value: 25 }
          - { type: modifier, target: xp.hoc_van, value: 0.6, op: mul, months: 48, label: 'Bỏ học thay cha cày ruộng' }
          - { type: set_flag, flag: bn_bo_hoc_thay_cha, years: 4, label: 'Bỏ học thay cha làm trụ cột nhà' }
        result: ['Con trâu cao hơn đầu bạn. Ngày đầu bạn ngã sấp mặt xuống bùn ba lần, người cả xóm đứng bờ ruộng mà cười. Đến cuối tháng thì không ai cười nữa. {role.cha.call} nằm trong buồng, nghe tiếng bạn quát trâu mà quay mặt vào vách.']
      - id: lam_thue_lay_tien_thuoc
        text: 'Đi chăn trâu, gánh nước thuê nhà giàu, gom tiền mua thuốc cốt toái bổ'
        hint: 'Thuốc tốt có khi cứu được lưng cha, nhưng nhà giàu đâu dễ trả công đứa trẻ'
        effects:
          - { type: health, who: cha, value: -30 }
          - { type: health, value: -8 }
          - { type: stress, value: 8 }
        chance: { base: 0.45, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: health, who: cha, value: 20 }
          - { type: filial_piety, value: 10 }
          - { type: opinion, role: cha, value: 20 }
          - { type: skill_xp, skill: ngoai_giao, value: 25 }
        failure:
          - { type: health, value: -12 }
          - { type: stress, value: 10 }
          - { type: filial_piety, value: 4 }
        success_result: ['Ba tháng chăn trâu, bạn ôm về được mấy gói thuốc rễ cây bọc lá chuối. Đến Tết, {role.cha.call} chống gậy ra được tới ngõ. Mẹ khóc, bạn cũng khóc.']
        failure_result: ['Nhà giàu cứ khất công, cuối cùng chỉ trả bằng mấy bát gạo mốc. Bạn bị con trâu húc ngã giữa đồng, về nằm sốt hai hôm. Thuốc thì vẫn chưa mua được.']
      - id: vay_moi_thay_huyen
        text: 'Xin mẹ cầm chiếc vòng bạc, vay thêm, mời ông lang nắn xương trên huyện'
        hint: 'Nhà gánh thêm 22 quan nợ; ông lang giỏi cũng có lúc nắn hỏng'
        effects:
          - { type: health, who: cha, value: -30 }
          - { type: debt, value: 22, ledger: thuoc_men }
          - { type: stress, value: 6 }
        chance: { base: 0.55 }
        success:
          - { type: health, who: cha, value: 28 }
          - { type: opinion, role: cha, value: 15 }
        failure:
          - { type: health, who: cha, value: -15 }
          - { type: stress, value: 12 }
        success_result: ['Ông lang huyện đặt {role.cha.call} nằm sấp, hai tay ấn mạnh một cái nghe rắc. {role.cha.call} kêu lên một tiếng rồi lịm đi. Nửa năm sau, {role.cha.call} lại ra đồng được, tuy không còn gánh nặng như xưa.']
        failure_result: ['Nắn xong, chân {role.cha.call} sưng tím rồi chảy mủ. Ông lang huyện cầm tiền đi từ hôm ba, không quay lại. Nợ thì vẫn còn nguyên trong sổ.']
      - id: len_chua_cau
        text: 'Theo bà lên chùa, khấn nguyện ăn chay trăm ngày cầu cho cha'
        hint: 'Không tốn bao tiền, nhưng ruộng nhà bỏ hoang một vụ'
        effects:
          - { type: health, who: cha, value: -30 }
          - { type: health, value: -6 }
          - { type: filial_piety, value: 8 }
          - { type: modifier, target: harvest.yield, value: 0.6, op: mul, months: 6, label: 'Ruộng không ai cày cấy' }
        chance: { base: 0.25 }
        success:
          - { type: health, who: cha, value: 12 }
          - { type: stress, value: -6 }
        failure:
          - { type: health, who: cha, value: -8 }
          - { type: stress, value: 8 }
        success_result: ['Trăm ngày chay tịnh, bạn gầy rộc. Sáng hôm ấy {role.cha.call} tự ngồi dậy được, gọi bạn lại xoa đầu. Bà bảo là Phật thương. Bạn không dám nghĩ khác.']
        failure_result: ['Hương khói trăm ngày mà {role.cha.call} vẫn nằm đó, lưng loét dần. Ruộng bỏ cỏ mọc ngang người. Mùa ấy nhà ăn độn khoai từ tháng Chạp.']

  - id: bn_di_o_do_tru_no
    title: Đi ở đợ trừ nợ
    tags: [gia_dinh, no_nan, lang_xa]
    life_stages: [thieu_thoi]
    condition:
      all:
        - { var: player.age, op: between, value: [9, 15] }
        - { any: [{ var: household.debt, op: '>=', value: 15 }, { all: [{ var: household.money, op: '<', value: 3 }, { var: household.food_months, op: '<', value: 2 }] }] }
    roles:
      - { id: cm, from: family, relation: parent, pick: oldest }
      - { id: ba_ho, from: village, village_role: ba_ho }
    weight: 5
    once_per_life: true
    tension: 7
    importance: 8
    icon: no
    text:
      - 'Tối ấy {role.cm.call} gọi bạn lại bên bếp, mãi không nói được câu nào. Mãi sau mới bảo: {role.ba_ho.call} cần một đứa trẻ chăn trâu, quét sân, ở hẳn bên ấy ba năm. Ba năm công ấy trừ được món nợ đang đè cả nhà.'
      - 'Nhà đã hết thóc, nợ thì lãi mẹ đẻ lãi con. {role.ba_ho.call} ngỏ ý: cho đứa lớn sang nhà ông ở đợ ba năm, ông xóa bớt nợ. {role.cm.call} nhìn bạn, mắt đỏ hoe.'
    options:
      - id: chiu_di_o
        text: 'Gật đầu, ôm bọc quần áo sang nhà {role.ba_ho.call}'
        hint: 'Nhà bớt 25 quan nợ; ba năm bạn ăn cơm thừa, ngủ chuồng trâu'
        trait_stress: { tu_do: 8 }
        effects:
          - { type: debt, value: -25, ledger: tra_no }
          - { type: health, value: -10 }
          - { type: stress, value: 15 }
          - { type: filial_piety, value: 15 }
          - { type: opinion, role: cm, value: 20 }
          - { type: skill_xp, skill: sinh_ton, value: 40 }
          - { type: modifier, target: health.monthly, value: -0.3, months: 36, label: 'Ở đợ nhà {role.ba_ho.call}' }
          - { type: modifier, target: xp.sinh_ton, value: 1.3, op: mul, months: 36, label: 'Ở đợ nhà {role.ba_ho.call}' }
          - { type: set_flag, flag: bn_di_o_do, years: 3, label: 'Đi ở đợ nhà {role.ba_ho.call} trừ nợ' }
        result: ['Sáng hôm sau, bạn đi sau lưng người quản gia nhà {role.ba_ho.call}, không dám ngoái lại. Đêm đầu tiên nằm trên ổ rơm cạnh chuồng trâu, bạn nghe tiếng con trâu nhai mà nhớ nhà đến quặn ruột.']
      - id: xin_lam_gap_doi
        text: 'Quỳ xin ở lại, hứa ngày làm ruộng, đêm đan rổ đan rá trả nợ dần'
        hint: 'Giữ được bạn ở nhà, nhưng sức đứa trẻ có hạn'
        effects:
          - { type: health, value: -10 }
          - { type: stress, value: 10 }
        chance: { base: 0.4, skill: sinh_ton, per_level: 0.06 }
        success:
          - { type: debt, value: -12, ledger: tra_no }
          - { type: skill_xp, skill: sinh_ton, value: 35 }
          - { type: opinion, role: cm, value: 15 }
        failure:
          - { type: health, value: -15 }
          - { type: debt, value: 6 }
          - { type: stress, value: 10 }
        success_result: ['Suốt một năm, đêm nào bạn cũng ngồi đan đến khi đèn cạn dầu. Rổ rá gánh ra chợ, từng đồng nhét vào ống tre. Đến cuối năm, món nợ vơi được một phần. {role.cm.call} không nói gì, chỉ gắp cho bạn miếng cá to nhất.']
        failure_result: ['Bạn đổ bệnh giữa mùa gặt. Rổ rá đan dở chất góc nhà, nợ thì cộng thêm lãi. {role.ba_ho.call} cho người sang nhắc, lần này giọng đã khác.']
      - id: tron_theo_thuyen
        text: 'Đêm ấy lẻn ra bến, xin theo thuyền buôn đi xa kiếm sống'
        hint: 'Thoát cảnh ở đợ, nhưng bỏ cha mẹ lại giữa lúc ngặt nghèo'
        trait_stress: { trong_gia_dinh: 10, than_trong: 5 }
        effects:
          - { type: opinion, role: cm, value: -35 }
          - { type: filial_piety, value: -15 }
          - { type: debt, value: 6 }
          - { type: health, value: -8 }
          - { type: skill_xp, skill: thuong_mai, value: 40 }
          - { type: skill_xp, skill: ngoai_giao, value: 25 }
          - { type: set_flag, flag: bn_bo_nha_ra_di, years: 6, label: 'Bỏ nhà theo thuyền buôn năm thiếu thời' }
        result: ['Thuyền nhổ neo lúc gà gáy. Bạn nằm nép giữa mấy bao muối, nghe tiếng nước vỗ mạn mà tim đập thình thịch. Mấy mùa sau bạn mới dám về. {role.cm.call} ra đón ở ngõ, không mắng, chỉ nhìn bạn rất lâu. Nhà đã phải bán con lợn nái để khất nợ thay bạn.']
      - id: xin_ba_ho_khat
        text: 'Tự sang nhà {role.ba_ho.call}, xin khất cho nhà, hứa lớn lên sẽ làm công trả đủ'
        hint: 'Đứa trẻ dám ăn nói với bá hộ thì hoặc được thương, hoặc bị ghét'
        chance: { base: 0.25, skill: ngoai_giao, per_level: 0.06 }
        success:
          - { type: set_flag, flag: duoc_khat_no, years: 2, label: '{role.ba_ho.call} cho nhà khất nợ hai năm' }
          - { type: opinion, role: ba_ho, value: 15 }
          - { type: opinion, role: cm, value: 10 }
          - { type: skill_xp, skill: ngoai_giao, value: 30 }
        failure:
          - { type: opinion, role: ba_ho, value: -25 }
          - { type: debt, value: 8 }
          - { type: opinion, role: cm, value: -10 }
          - { type: stress, value: 12 }
        success_result: ['{role.ba_ho.call} nhìn đứa trẻ đứng thẳng lưng giữa sân, bật cười: "Đứa ranh này được. Thôi, cho nhà mày khất hai năm." Về nhà, {role.cm.call} ôm bạn mà không nói nên lời.']
        failure_result: ['{role.ba_ho.call} sai người lôi bạn ra cổng: "Trẻ ranh mà dám mặc cả với ông!" Hôm sau món nợ được ghi thêm mấy quan "tiền dạy dỗ". {role.cm.call} giận bạn suốt mấy tháng.']

  - id: bn_cuu_tre_duoi_nuoc
    title: Đứa trẻ chới với giữa vực sông
    tags: [nguy_hiem, lang_xa, quan_he]
    life_stages: [thieu_thoi]
    months: [5, 6, 7, 8, 9]
    condition: { var: player.age, op: between, value: [8, 15] }
    roles:
      - { id: ba_ho, from: village, village_role: ba_ho }
    weight: 4
    once_per_life: true
    tension: 8
    importance: 8
    icon: lu
    text:
      - 'Trưa hè, lũ trẻ trong xóm ra vực sông tắm. Thằng con út nhà {role.ba_ho.call} cậy biết bơi, bơi ra quá chỗ cây sung. Chỗ ấy nước xoáy. Bạn thấy cái đầu nó ngoi lên rồi chìm, ngoi lên rồi chìm, hai tay đập loạn xạ.'
      - 'Bọn trẻ đứng trên bờ la hét, không đứa nào dám xuống. Người lớn gần nhất cũng đang ở tít ngoài ruộng. Nước vực đục ngầu, xoáy thành vòng.'
    options:
      - id: lao_xuong_cuu
        text: 'Cởi áo, nhảy ùm xuống vực bơi ra'
        hint: 'Vực sâu nước xoáy, cứu được người thì cả đời được nhớ ơn, không cứu được thì có khi mất cả hai'
        chance: { base: 0.45, skill: sinh_ton, per_level: 0.06 }
        success:
          - { type: opinion, role: ba_ho, value: 40 }
          - { type: favor, role: ba_ho, value: 15 }
          - { type: own_money, value: 15, ledger: thu_khac }
          - { type: reputation, group: dan_lang, value: 15 }
          - { type: health, value: -10 }
        failure:
          - { type: health, value: -40 }
          - { type: stress, value: 18 }
          - { type: opinion, role: ba_ho, value: 10 }
        success_result: ['Bạn túm được tóc nó, cả hai bị xoáy kéo xuống hai lần mới quẫy được vào bờ. Nó nôn ra cả bụng nước rồi khóc thét. Chiều ấy {role.ba_ho.call} thân sang tận nhà, đặt lên bàn thờ một xâu tiền, cúi đầu trước cha mẹ bạn.']
        failure_result: ['Xoáy nước cuốn cả hai. Người ta lôi được hai đứa lên lúc cả hai đã tím tái. Thằng bé sống, bạn thì nằm mê man ba ngày, thầy lang bảo phổi đã ngấm nước. Từ đó cứ trở trời là bạn ho sù sụ.']
      - id: quang_sao
        text: 'Vớ cây sào tre bên bờ, nằm bám rễ sung chìa ra cho nó'
        hint: 'Cần nhanh trí; trượt chân thì chính mình rơi xuống'
        chance: { base: 0.4, skill: muu_luoc, per_level: 0.06 }
        success:
          - { type: opinion, role: ba_ho, value: 30 }
          - { type: favor, role: ba_ho, value: 10 }
          - { type: own_money, value: 10, ledger: thu_khac }
          - { type: reputation, group: dan_lang, value: 10 }
          - { type: skill_xp, skill: muu_luoc, value: 25 }
        failure:
          - { type: health, value: -22 }
          - { type: opinion, role: ba_ho, value: -15 }
          - { type: stress, value: 15 }
        success_result: ['Nó vồ được đầu sào, bạn ghì chặt rễ sung mà kéo. Tay bạn rách toạc, nhưng nó lên được bờ. Người làng kể mãi chuyện thằng bé nhà nghèo khôn hơn cả người lớn.']
        failure_result: ['Rễ sung trơn, bạn trượt tõm xuống nước. Cả hai được người đi cắt cỏ lôi lên. {role.ba_ho.call} không cảm ơn, còn bảo bạn rủ con ông ra vực.']
      - id: chay_goi_nguoi
        text: 'Chạy thục mạng ra ruộng gọi người lớn'
        hint: 'Không liều thân, nhưng chạy đi chạy về là mất mấy nhịp thở'
        chance: { base: 0.45, skill: sinh_ton, per_level: 0.04 }
        success:
          - { type: opinion, role: ba_ho, value: 12 }
          - { type: reputation, group: dan_lang, value: 4 }
        failure:
          - { type: opinion, role: ba_ho, value: -30 }
          - { type: stress, value: 25 }
          - { type: set_flag, flag: bn_am_anh_vuc_song, years: 10, label: 'Ám ảnh đứa trẻ chết đuối ở vực sông' }
        success_result: ['Mấy người đàn ông nhảy xuống kịp lôi nó lên. Nó sống. Người ta bảo may mà có đứa chạy nhanh.']
        failure_result: ['Lúc người lớn ra đến nơi, mặt nước đã phẳng lặng. Ba hôm sau xác nó nổi ở bến dưới. {role.ba_ho.call} gào lên giữa sân đình rằng lũ trẻ con nhà nghèo đứng nhìn con ông chết. Đêm nào bạn cũng mơ thấy hai bàn tay đập nước.']
      - id: bo_chay
        text: 'Sợ quá, quay lưng chạy về nhà trốn'
        hint: 'Giữ được mạng mình, nhưng có những thứ cả đời không rửa được'
        trait_stress: { can_dam: 12, nhan_tu: 8 }
        effects:
          - { type: stress, value: 25 }
          - { type: reputation, group: dan_lang, value: -10 }
          - { type: add_trait, trait: than_trong, who: player }
          - { type: set_flag, flag: bn_am_anh_vuc_song, years: 15, label: 'Ám ảnh lần bỏ chạy ở vực sông' }
        result: ['Bạn chui xuống gầm phản, bịt tai. Tối ấy cả xóm đi đuốc dọc bờ sông. Có đứa kể rằng bạn đã đứng gần nhất. Không ai mắng bạn, nhưng từ đó bọn trẻ không rủ bạn chơi nữa.']

  # ════════════════════════ THANH NIÊN – LẬP NGHIỆP ════════════════════════
  - id: bn_vu_oan_trom_trau
    title: Bị vu trộm trâu, giải lên huyện
    tags: [lang_xa, nguy_hiem, quan_he]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition:
      all:
        - { var: player.age, op: between, value: [18, 55] }
        - { not: { has_flag: bn_ngoi_tu } }
    roles:
      - { id: ly, from: village, village_role: ly_truong }
      - { id: hx, from: village, village_role: hang_xom }
    weight: 4
    once_per_life: true
    tension: 9
    importance: 9
    icon: tin_don
    text:
      - 'Con trâu đực nhà {role.hx.call} mất trong đêm. Sáng ra người ta lần theo vết chân trâu, đến bờ tre sau nhà bạn thì thấy sợi thừng thả trâu vắt trên cọc rào. {role.ly.call} cho tuần đinh trói giật cánh khuỷu bạn giữa sân, nói sẽ giải lên huyện.'
      - 'Trên huyện, án trộm trâu nặng nhất sau án mạng: đánh trượng, thích chữ vào mặt, có khi giam cả năm. {role.hx.call} đứng ở cổng, không nhìn bạn. Cả làng đứng xem.'
    options:
      - id: lot_tay_nha_lai
        text: 'Nhắn nhà mang 30 quan lên lót tay nha lại cho êm chuyện'
        hint: 'Mất một khoản bằng gần sào ruộng; nha lại nhận tiền chưa chắc đã giữ lời'
        condition: { var: household.money, op: '>=', value: 30 }
        effects:
          - { type: money, value: -30, ledger: su_kien }
          - { type: stress, value: 10 }
        chance: { base: 0.7 }
        success:
          - { type: reputation, group: dan_lang, value: -10 }
          - { type: set_flag, flag: bn_mang_tieng_trom, years: 6, label: 'Mang tiếng trộm trâu, tiền lót tay mới thoát' }
        failure:
          - { type: health, value: -20 }
          - { type: reputation, group: dan_lang, value: -18 }
          - { type: set_flag, flag: bn_mang_tieng_trom, years: 10, label: 'Mang tiếng trộm trâu, bị đánh trượng ở huyện' }
        success_result: ['Tiền vào tay áo thầy thông lại, tờ án được ghi là "chứng cứ chưa rõ". Bạn về làng, nhưng người ta vẫn khép cổng mỗi khi bạn đi ngang.']
        failure_result: ['Nha lại cầm tiền rồi vẫn để quan xử. Ba mươi trượng. Bạn được khiêng về làng trên cánh cửa, lưng rách như xơ mướp.']
      - id: keu_oan
        text: 'Kêu oan đến cùng, xin quan tra lại dấu chân và sợi thừng'
        hint: 'Gặp quan sáng thì rửa được tiếng; gặp quan tối thì vào ngục'
        trait_stress: { than_trong: 4 }
        effects:
          - { type: stress, value: 12 }
        chance:
          base: 0.3
          skill: ngoai_giao
          per_level: 0.05
          modifiers:
            - { condition: { var: player.reputation, op: '>=', value: 20 }, add: 0.15 }
            - { condition: { var: role.ly.opinion, op: '>=', value: 25 }, add: 0.1 }
        success:
          - { type: reputation, group: dan_lang, value: 15 }
          - { type: opinion, role: hx, value: 20 }
          - { type: opinion, role: ly, value: -10 }
          - { type: skill_xp, skill: ngoai_giao, value: 40 }
        failure:
          - { type: set_flag, flag: bn_ngoi_tu, years: 2, label: 'Ngồi ngục huyện vì án trộm trâu' }
          - { type: health, value: -30 }
          - { type: stress, value: 25 }
          - { type: reputation, group: dan_lang, value: -25 }
          - { type: money, value: { var: household.money, factor: -0.3, max: 0 }, ledger: su_kien }
          - { type: modifier, target: health.monthly, value: -1.2, months: 18, label: 'Ngồi ngục huyện' }
          - { type: modifier, target: death_risk, value: 2.5, op: mul, months: 18, label: 'Ngồi ngục huyện' }
        success_result: ['Quan huyện cho đo dấu chân trâu, thấy vết đi vòng qua bờ tre rồi xuống bến đò. Ba hôm sau bắt được tên lái trâu ở chợ huyện bên. {role.hx.call} mang chai rượu sang, đứng ở ngõ mãi mới dám vào.']
        failure_result: ['Quan phán: "Có tang vật, còn chối!" Bạn bị đóng gông, giải vào ngục. Ngục huyện ẩm như hang chuột, mỗi bữa một nắm cơm hẩm. Nhà phải bán dần đồ đạc để gửi cơm tù.']
      - id: nhan_bua_den_trau
        text: 'Nhận bừa cho xong, xin đền nhà {role.hx.call} một con trâu'
        hint: 'Không vào ngục, nhưng gánh 24 quan nợ và mang tiếng trộm cả đời'
        trait_stress: { can_dam: 6, nong_nay: 4 }
        effects:
          - { type: debt, value: 24, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: -20 }
          - { type: opinion, role: hx, value: 5 }
          - { type: stress, value: 15 }
          - { type: set_flag, flag: bn_mang_tieng_trom, years: 15, label: 'Nhận bừa tội trộm trâu nhà {role.hx.call}' }
        result: ['Bạn điểm chỉ vào tờ cung, đầu óc trống rỗng. Từ hôm ấy, nhà ai mất con gà cũng ngó sang nhà bạn trước tiên. Món nợ con trâu bạn trả đến mấy mùa gặt.']
      - id: bo_tron
        text: 'Đêm ấy cắt dây trói, trốn khỏi làng lên rừng'
        hint: 'Thoát gông cùm trước mắt, nhưng thành kẻ có tên trên cáo thị'
        trait_stress: { trong_gia_dinh: 6, than_trong: 6 }
        effects:
          - { type: wanted, value: 30 }
          - { type: health, value: -15 }
          - { type: stress, value: 18 }
          - { type: reputation, group: dan_lang, value: -15 }
          - { type: opinion, role: ly, value: -30 }
          - { type: set_flag, flag: bn_tron_an, years: 4, label: 'Trốn án trộm trâu, lệnh bắt còn treo' }
        result: ['Bạn chạy một mạch qua ba cánh đồng, lội suối lên núi. Mấy tháng ăn rau rừng, ngủ hang đá. Cáo thị dán ở đình làng có tên bạn. Khi dám lần về thì tóc đã dài chấm vai, người làng nhìn bạn như nhìn người lạ.']

  - id: bn_si_tu_lot_tay
    title: Trường thi ngầm đòi lót tay
    tags: [hoc_hanh, van_minh, quan_he]
    life_stages: [thanh_nien, lap_nghiep]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: world.is_exam_year, op: '==', value: true }
        - { var: player.exam_degree, op: '==', value: none }
        - { var: player.age, op: between, value: [18, 45] }
    weight: 5
    once_per_life: true
    tension: 8
    importance: 9
    icon: sach
    text:
      - 'Còn nửa tháng đến kỳ thi Hương. Một người mặc áo the, tự xưng là người nhà quan sơ khảo, tìm đến chỗ bạn trọ. Hắn nói nhỏ: "Bài văn hay đến đâu mà không có chữ ký ngầm thì cũng vào sọt. Bốn mươi quan, tên cậu sẽ có trên bảng."'
      - 'Bạn đồng môn kể năm ngoái có anh học giỏi nhất huyện bị đánh hỏng chỉ vì một chữ "phạm húy" mà ai cũng biết là bịa. Năm nay người ta nói khoa thi này đã có giá.'
    options:
      - id: lot_tay
        text: 'Gom đủ 40 quan đưa cho hắn'
        hint: 'Có thể đỗ ngay; vỡ chuyện thì mất tiền, mất tiếng, bị cấm thi'
        condition: { var: household.money, op: '>=', value: 40 }
        trait_stress: { nhan_tu: 4 }
        effects:
          - { type: money, value: -40, ledger: su_kien }
        chance: { base: 0.55, skill: hoc_van, per_level: 0.03 }
        success:
          - { type: set_exam_degree, degree: sinh_do }
          - { type: scholarly_prestige, value: 10 }
          - { type: stress, value: 8 }
        failure:
          - { type: scholarly_prestige, value: -30 }
          - { type: reputation, group: dan_lang, value: -15 }
          - { type: stress, value: 20 }
          - { type: set_flag, flag: bn_bi_cam_thi, years: 6, label: 'Bị cấm thi vì vụ lót tay trường thi' }
        success_result: ['Ngày yết bảng, tên bạn nằm ở hàng giữa. Cả làng đốt pháo. Bạn cười mà trong bụng lạnh ngắt, mỗi lần có người khen văn hay là nhớ đến xâu tiền.']
        failure_result: ['Quan Đề điệu bắt được sổ ghi tên những kẻ đút lót. Tên bạn nằm ở trang thứ ba. Bạn bị đuổi khỏi trường thi trước mặt hàng nghìn sĩ tử, tiền thì đã nằm trong túi kẻ khác.']
      - id: vay_lot_tay
        text: 'Không đủ tiền, đành vay nặng lãi 45 quan để lót'
        hint: 'Đỗ thì trả dần; trượt thì vừa nợ vừa nhục'
        condition: { var: household.money, op: '<', value: 40 }
        effects:
          - { type: debt, value: 45, ledger: vay }
        chance: { base: 0.5, skill: hoc_van, per_level: 0.03 }
        success:
          - { type: set_exam_degree, degree: sinh_do }
          - { type: scholarly_prestige, value: 8 }
          - { type: stress, value: 12 }
        failure:
          - { type: scholarly_prestige, value: -30 }
          - { type: stress, value: 25 }
          - { type: set_flag, flag: bn_bi_cam_thi, years: 6, label: 'Bị cấm thi vì vụ lót tay trường thi' }
        success_result: ['Đỗ. Nhưng món nợ 45 quan như hòn đá buộc vào chân. Năm nào cũng phải bán thóc trả lãi trước khi kịp mua sách mới.']
        failure_result: ['Kẻ áo the biến mất trước ngày thi. Bạn vào trường, thấy đề ra khác hẳn lời hắn hứa. Trượt. Chủ nợ đã đứng chờ ở cổng làng.']
      - id: thi_thuc_tai
        text: 'Không lót một đồng, vào trường bằng ngòi bút của mình'
        hint: 'Sạch tiếng, nhưng khoa này người ta đã định sẵn tên'
        trait_stress: { co_hoi: 4 }
        chance: { base: 0.12, skill: hoc_van, per_level: 0.05 }
        success:
          - { type: set_exam_degree, degree: sinh_do }
          - { type: scholarly_prestige, value: 25 }
          - { type: reputation, group: dan_lang, value: 15 }
        failure:
          - { type: stress, value: 20 }
          - { type: scholarly_prestige, value: -5 }
          - { type: set_flag, flag: bn_truot_vi_khong_lot, years: 3, label: 'Bị đánh hỏng vì không chịu lót tay' }
        success_result: ['Bài văn của bạn được một vị phúc khảo già đọc đi đọc lại, gạch đỏ chữ "ưu". Bạn đỗ giữa một khoa đầy tiếng xấu, và vì thế mà tên bạn càng sáng.']
        failure_result: ['Quyển thi bị loại ngay vòng đầu, lời phê chỉ hai chữ: "văn kém". Người đỗ đầu là con một nhà buôn muối mà ai cũng biết chưa viết nổi bài phú. Bạn về trọ, đốt hết bản nháp.']
      - id: to_cao
        text: 'Viết đơn tố cáo lên quan Đề điệu, kèm tên kẻ áo the'
        hint: 'Thành thì danh vang sĩ lâm; bại thì bị vu là phỉ báng trường thi, vào ngục'
        trait_stress: { than_trong: 8, an_phan: 5 }
        chance: { base: 0.22, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: scholarly_prestige, value: 35 }
          - { type: reputation, group: dan_lang, value: 20 }
          - { type: skill_xp, skill: ngoai_giao, value: 40 }
        failure:
          - { type: set_flag, flag: bn_ngoi_tu, years: 1, label: 'Bị giam vì tố cáo trường thi' }
          - { type: health, value: -28 }
          - { type: stress, value: 25 }
          - { type: scholarly_prestige, value: -20 }
          - { type: modifier, target: death_risk, value: 2, op: mul, months: 12, label: 'Bị giam ngục vì đơn tố cáo' }
          - { type: modifier, target: health.monthly, value: -1, months: 12, label: 'Bị giam ngục vì đơn tố cáo' }
        success_result: ['Quan Đề điệu là người cứng cổ. Kẻ áo the bị bắt, hai viên sơ khảo bị cách chức. Khoa thi phải hoãn lại mười ngày. Sĩ tử cả trường kéo đến chỗ trọ của bạn vái chào.']
        failure_result: ['Lá đơn đi vòng một vòng rồi về đúng tay kẻ bị tố. Đêm ấy lính đến tận chỗ trọ, gông bạn đi với tội "phỉ báng trường thi". Trong ngục, bạn ngồi đếm vết nứt trên tường mà nghĩ về chữ "sĩ".']

  - id: bn_lua_mat_von_buon
    title: Bạn hàng ôm vốn bỏ trốn
    tags: [buon_ban, no_nan, quan_he]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { var: household.money, op: '>=', value: 40 }
        - { any: [{ var: household.career, op: '==', value: thuong_nhan }, { var: player.career, op: in, value: [thuong_nhan, ban_rong, chu_do] }] }
    weight: 5
    once_per_life: true
    tension: 8
    importance: 9
    icon: tien
    text:
      - 'Người bạn hàng phương xa buôn chung với bạn ba năm nay, chưa sai hẹn lần nào. Mùa này bạn giao hắn 35 quan vốn để cất một chuyến lụa ở phủ. Đến hẹn không thấy về. Người bến trên kể hắn đã bán thuyền, dắt vợ con đi đâu không ai rõ.'
      - 'Tờ giấy biên nhận còn nằm trong tráp, nét chữ hắn tròn trịa. Ba mươi lăm quan — mấy năm dành dụm của cả nhà.'
    options:
      - id: kien_len_huyen
        text: 'Mang giấy biên nhận lên huyện kiện, tốn thêm 8 quan lệ phí'
        hint: 'Quan bắt được thì đòi lại phần lớn; không thì mất thêm'
        effects:
          - { type: money, value: -35, ledger: buon_ban }
          - { type: money, value: -8, ledger: su_kien }
          - { type: stress, value: 10 }
        chance: { base: 0.3, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: money, value: 28, ledger: thu_khac }
          - { type: reputation, group: dan_lang, value: 6 }
        failure:
          - { type: stress, value: 12 }
          - { type: reputation, group: dan_lang, value: -4 }
        success_result: ['Nửa năm sau, lính huyện bắt được hắn ở một bến đò xa, trong người còn giấu non ba chục quan. Bạn nhận lại tiền ở công đường, tay run run.']
        failure_result: ['Đơn kiện nằm trên án thư suốt mùa, thư lại lần nào cũng bảo "đang tra". Đến lúc bạn hiểu ra thì tiền lệ phí cũng đã thành tiền mất.']
      - id: tu_di_truy
        text: 'Tự mình lần theo dấu hắn, đi suốt các bến dọc sông'
        hint: 'Có khi đòi được tận tay; có khi gặp phải bọn hắn thuê đón đường'
        effects:
          - { type: money, value: -35, ledger: buon_ban }
          - { type: health, value: -10 }
        chance: { base: 0.35, skill: quan_su, per_level: 0.05 }
        success:
          - { type: money, value: 33, ledger: thu_khac }
          - { type: skill_xp, skill: quan_su, value: 30 }
        failure:
          - { type: health, value: -25 }
          - { type: stress, value: 15 }
        success_result: ['Ba tháng sau, bạn túm được cổ áo hắn ở một quán nước đầu bến phủ. Hắn quỳ xuống trả lại tiền, cả quán nhìn. Bạn đi về mà đôi giày cỏ đã mòn rách.']
        failure_result: ['Lần đến bến thứ năm thì bị ba gã lạ chặn đường đánh hội đồng. Bạn nằm bên vệ cỏ đến sáng, mất cả túi lộ phí. Về đến nhà, người nhà suýt không nhận ra.']
      - id: vay_lam_lai
        text: 'Nuốt hận, vay 30 quan làm lại từ đầu'
        hint: 'Không mất thêm thời gian, nhưng gánh nợ và từ nay chỉ tin chính mình'
        effects:
          - { type: money, value: -35, ledger: buon_ban }
          - { type: money, value: 26, ledger: vay }
          - { type: debt, value: 30, ledger: vay }
          - { type: stress, value: 12 }
          - { type: add_trait, trait: hoai_nghi, who: player }
          - { type: modifier, target: xp.thuong_mai, value: 1.25, op: mul, months: 24, label: 'Bài học đắt giá về lòng người' }
        result: ['Bạn cất tờ biên nhận vào đáy tráp, không xem lại nữa. Món vay mới được ghi bằng chữ to. Từ hôm ấy, bạn đếm hàng hai lần, đếm tiền ba lần.']
      - id: bo_nghe_buon
        text: 'Thôi buôn bán, về làm ruộng cho yên phận'
        hint: 'Không ai lừa được người cày ruộng, nhưng bỏ nghề cũ là bỏ cả mối hàng'
        condition: { var: player.career, op: in, value: [thuong_nhan, ban_rong] }
        trait_stress: { tham_vong: 8 }
        effects:
          - { type: money, value: -35, ledger: buon_ban }
          - { type: set_career, career: nong_dan }
          - { type: stress, value: -6 }
          - { type: skill_xp, skill: sinh_ton, value: 20 }
        result: ['Bạn treo đòn cân lên xà nhà. Mùa xuân ấy bạn ra đồng cùng hàng xóm, tay cầm cày còn ngượng. Người ta bảo phí cái tài buôn. Bạn chỉ cười.']

  - id: bn_trung_manh_thuyen_muoi
    title: Thuyền muối mắc cạn bán tháo
    tags: [buon_ban, thoi_co]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition:
      all:
        - { var: player.is_head, op: '==', value: true }
        - { var: household.money, op: '>=', value: 30 }
    roles:
      - { id: ba_ho, from: village, village_role: ba_ho }
    weight: 4
    once_per_life: true
    tension: 6
    importance: 8
    icon: cho
    text:
      - 'Nước sông rút nhanh, một thuyền muối lớn từ miền biển mắc cạn ngay bến làng. Chủ thuyền sợ muối ngấm nước, muốn bán tháo cả khoang với giá chỉ bằng một phần ba ngoài chợ. Cả làng ra xem nhưng chưa ai dám bỏ tiền.'
      - 'Muối là thứ không bao giờ hết người mua, nhưng muối ẩm thì chảy thành nước. Chủ thuyền đứng trên mạn gọi giá, mặt nhăn như khỉ.'
    options:
      - id: don_het_von
        text: 'Dốc 30 quan mua nửa khoang, thuê người gánh về phơi'
        hint: 'Phơi kịp thì lời gấp mấy lần; gặp mưa thì muối hóa nước'
        effects:
          - { type: money, value: -30, ledger: buon_ban }
        chance:
          base: 0.55
          skill: thuong_mai
          per_level: 0.05
          modifiers:
            - { condition: { var: world.season, op: in, value: [ha, thu] }, add: 0.1 }
        success:
