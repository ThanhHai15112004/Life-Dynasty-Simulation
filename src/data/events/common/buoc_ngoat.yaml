          - { type: opinion, role: con, value: -15 }
        success_result: ['Ngày yết bảng, tên {role.con.call} đứng hàng thứ mười bảy. Cả họ kéo ra đầu làng đón. Chỉ người trong nhà biết xâu tiền kia đã đi đâu.']
        failure_result: ['Người môi giới bị bắt ngay trước ngày thi, khai ra cả sổ. Tên {role.con.call} bị gạch, con bị đuổi khỏi trường trước mặt các sĩ tử. Về làng, con đóng cửa buồng ba ngày không ra.']
      - id: thi_thuc_tai_con
        text: 'Bảo con vào trường bằng thực tài, không lót một đồng'
