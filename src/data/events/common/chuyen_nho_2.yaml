# [1.5] Chuyện nhỏ đợt 2: mở rộng kho để mỗi đời gặp những chuyện khác nhau (mỗi chuyện chỉ một lần trong đời).
# Nhiều chuyện đụng đến tiền riêng của bạn (own_money): chưa làm chủ hộ thì vào/ra túi riêng, làm chủ rồi là tiền nhà.
# Phương án default luôn không có condition và không tốn tiền. Tiền tố id: cn2_tt_ thiếu thời, cn2_nl_ người lớn, cn2_tn_ trung niên, cn2_g_ tuổi già.
events:
  # ── Thiếu thời (6–15) ──
  - id: cn2_tt_li_xi_tet
    title: Phong bao lì xì
    tags: [gia_dinh, le_hoi]
    life_stages: [thieu_thoi]
    months: [1, 2]
    weight: 5
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: tet
    text:
      - 'Sáng mùng Một, ông bà dúi vào tay bạn mấy đồng tiền xu buộc dây đỏ: "Lấy may cả năm, con nhé."'
    options:
      - id: cat_di
        text: 'Cất vào ống tre, để dành'
        default: true
        effects: [{ type: own_money, value: 0.3, ledger: li_xi }]
        result: ['Ống tre treo đầu giường kêu leng keng mỗi khi bạn lắc.']
      - id: mua_phao
        text: 'Ra đầu ngõ mua pháo tép đốt với lũ bạn'
        effects:
          - { type: own_money, value: 0.1, ledger: li_xi }
          - { type: stress, value: -3 }
        result: ['Pháo nổ lép bép, khói khét lẹt, bạn cười đến đau cả bụng.']

  - id: cn2_tt_mo_oc_ban
    title: Mò ốc ngoài đồng
    tags: [ruong_dong, lao_dong]
    life_stages: [thieu_thoi]
    months: [6, 7, 8]
    condition: { var: world.settlement_type, op: '==', value: lang_nong }
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: ca
    text:
      - 'Nước ruộng lên, ốc bươu bò kín bờ. Bạn mò được đầy một giỏ, bà hàng xén ngoài chợ hỏi mua.'
    options:
      - id: ban
        text: 'Bán cho bà hàng xén lấy mấy đồng'
        effects: [{ type: own_money, value: 0.2, ledger: tien_cong }]
        result: ['Lần đầu tiên bạn tự kiếm ra tiền. Đồng xu nóng hổi trong lòng bàn tay.']
      - id: mang_ve
        text: 'Mang về cho mẹ nấu canh'
        default: true
        effects: [{ type: food, value: 0.5 }, { type: filial_piety, value: 1 }]
        result: ['Tối ấy nồi canh ốc chua thơm cả gian bếp. Mẹ xoa đầu bạn.']

  - id: cn2_tt_nhat_dong_xu
    title: Đồng xu dưới gốc đa
    tags: [lang_xa]
    life_stages: [thieu_thoi]
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: tien
    text:
      - 'Chơi trốn tìm dưới gốc đa, bạn nhặt được một xâu tiền rơi trong rễ cây. Chắc của ai đi chợ đánh rơi.'
    options:
      - id: tra_lai
        text: 'Mang lên đình nhờ ông từ tìm người mất'
        default: true
        effects: [{ type: reputation, group: dan_lang, value: 2 }]
        result: ['Bà cụ đầu xóm đến nhận, cảm ơn mãi, còn cho bạn một quả na.']
      - id: giu_lay
        text: 'Lặng lẽ giữ lấy'
        trait_stress: { nhan_tu: 2 }
        effects: [{ type: own_money, value: 0.4, ledger: su_kien }]
        result: ['Xâu tiền nằm sâu trong ống tre. Mỗi lần nghe ai kể mất tiền, bạn lại thấy chột dạ.']

  - id: cn2_tt_chan_trau_ho
    title: Chăn trâu thuê
    tags: [ruong_dong, lao_dong]
    life_stages: [thieu_thoi]
    condition:
      all:
        - { var: player.age, op: '>=', value: 9 }
        - { var: world.settlement_type, op: '==', value: lang_nong }
    roles: [{ id: xom, from: village, village_role: hang_xom }]
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: trau
    text:
      - '{role.xom.call} bận đi phu, nhờ bạn chăn hộ con trâu một tháng, trả công mấy đồng.'
    options:
      - id: nhan
        text: 'Nhận lời, sáng sớm dắt trâu ra bãi'
        effects:
          - { type: own_money, value: 0.3, ledger: tien_cong }
          - { type: opinion, role: xom, value: 4 }
          - { type: skill_xp, skill: sinh_ton, value: 6 }
        result: ['Một tháng lưng trâu, bạn đen nhẻm, túi rủng rỉnh.']
      - id: tu_choi
        text: 'Thôi, còn phải học bài và trông em'
        default: true
        result: ['{role.xom.call} cười bảo không sao, để nhờ đứa khác.']

  - id: cn2_tt_keo_keo
    title: Ông bán kẹo kéo
    tags: [lang_xa]
    life_stages: [thieu_thoi]
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 1
    icon: cuoi
    text:
      - 'Ông bán kẹo kéo gõ phách đi qua ngõ, lũ trẻ chạy theo cả đàn. Mẩu kẹo trắng ngà kéo dài mãi không đứt.'
    options:
      - id: mua
        text: 'Lấy tiền riêng mua một mẩu'
        condition: { var: player.own_money, op: '>=', value: 0.05 }
        effects:
          - { type: own_money, value: -0.05, ledger: mua_sam }
          - { type: stress, value: -2 }
        result: ['Kẹo ngọt dính răng, bạn nhai chậm cho lâu hết.']
      - id: dung_nhin
        text: 'Đứng nhìn lũ bạn ăn'
        default: true
        result: ['Bạn nuốt nước bọt, tự nhủ để dành tiền mua thứ khác.']

  - id: cn2_tt_hoc_chu_dem
    title: Đèn dầu học chữ
    tags: [hoc_hanh, gia_dinh]
    life_stages: [thieu_thoi]
    condition: { var: player.age, op: '>=', value: 8 }
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: sach
    text:
      - 'Tối ấy bạn xin mẹ thắp thêm đĩa dầu lạc để tập viết mấy chữ thầy đồ dạy. Dầu lạc thì đắt.'
    options:
      - id: thap_den
        text: 'Thắp đèn ngồi tập đến khuya'
        effects:
          - { type: money, value: -0.05 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
        result: ['Ngọn đèn leo lét, chữ "Nhân" viết đi viết lại đến khi ngay hàng.']
      - id: tap_than
        text: 'Lấy que viết xuống nền đất dưới trăng'
        default: true
        effects: [{ type: skill_xp, skill: hoc_van, value: 4 }]
        result: ['Trăng sáng, nét chữ ngoằn ngoèo trên sân đất. Gió thổi là bay mất.']

  - id: cn2_tt_ve_dieu_sao
    title: Con diều sáo
    tags: [lang_xa, le_hoi]
    life_stages: [thieu_thoi]
    months: [5, 6, 7]
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 1
    icon: dieu
    text:
      - 'Gió nồm thổi lồng lộng. Anh lớn trong xóm chuốt được cái sáo diều kêu vi vu, bảo bán cho bạn.'
    options:
      - id: mua_sao
        text: 'Đổi hết tiền riêng lấy cái sáo'
        condition: { var: player.own_money, op: '>=', value: 0.15 }
        effects:
          - { type: own_money, value: -0.15, ledger: mua_sam }
          - { type: stress, value: -4 }
        result: ['Diều nhà bạn lên cao nhất bãi, tiếng sáo vọng về tận đầu làng.']
      - id: tu_lam
        text: 'Tự vót tre làm lấy'
        default: true
        effects: [{ type: skill_xp, skill: sinh_ton, value: 4 }]
        result: ['Cái sáo tự làm kêu khàn khàn, nhưng là của mình.']

  - id: cn2_tt_em_be_khoc
    title: Trông em
    tags: [gia_dinh]
    life_stages: [thieu_thoi]
    condition: { var: household.members, op: '>=', value: 5 }
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: tre_em
    text:
      - 'Cha mẹ ra đồng từ sớm, để bạn ở nhà trông đứa em nhỏ. Lũ bạn thì í ới gọi ra bờ sông tắm.'
    options:
      - id: o_nha
        text: 'Ở nhà ru em ngủ'
        default: true
        effects: [{ type: filial_piety, value: 2 }, { type: stress, value: 1 }]
        result: ['Em ngủ ngon trên võng. Chiều mẹ về, khen bạn đã lớn.']
      - id: cong_em_di
        text: 'Cõng em ra bờ sông chơi cùng'
        effects: [{ type: stress, value: -2 }]
        result: ['Em cười khanh khách. Về nhà cả hai lấm lem, bị mẹ mắng một trận.']

  # ── Thanh niên, lập nghiệp (16–40) ──
  - id: cn2_nl_gat_thue
    title: Gặt thuê mùa vụ
    tags: [ruong_dong, lao_dong]
    life_stages: [thanh_nien, lap_nghiep]
    months: [5, 10]
    condition: { var: world.settlement_type, op: '==', value: lang_nong }
    roles: [{ id: bh, from: village, village_role: ba_ho }]
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: cay_lua
    text:
      - 'Ruộng nhà {role.bh.call} chín rộ mà thiếu người gặt. Quản gia đứng đầu bờ gọi: "Ai gặt đỡ ba ngày, trả công tiền mặt!"'
    options:
      - id: di_gat
        text: 'Xắn quần lội xuống gặt thuê'
        effects:
          - { type: own_money, value: 0.8, ledger: tien_cong }
          - { type: health, value: -1 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
        result: ['Ba ngày lưng còng dưới nắng, đổi lại mấy tiền công nằm gọn trong túi.']
      - id: o_nha
        text: 'Ruộng nhà còn chưa gặt xong'
        default: true
        result: ['Bạn lắc đầu, quay về với mấy sào lúa nhà mình.']

  - id: cn2_nl_cau_doi_tet
    title: Viết câu đối Tết
    tags: [hoc_hanh, le_hoi]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    months: [12, 1]
    condition: { var: player.skill.hoc_van, op: '>=', value: 3 }
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: sach
    text:
      - 'Giáp Tết, người làng nhờ bạn viết câu đối dán cột. Mấy nhà khá giả còn ngỏ ý trả tiền mực giấy.'
    options:
      - id: ban_chu
        text: 'Bày chõng ra chợ viết thuê'
        effects:
          - { type: own_money, value: 0.6, ledger: tien_cong }
          - { type: skill_xp, skill: hoc_van, value: 6 }
        result: ['Chữ bạn bay bổng, mấy cặp câu đối được người ta khen nức nở.']
      - id: viet_cho
        text: 'Viết cho không, coi như lấy phúc'
        default: true
        effects: [{ type: reputation, group: dan_lang, value: 2 }, { type: scholarly_prestige, value: 1 }]
        result: ['Nhà nào trong xóm cũng có câu đối do tay bạn viết.']

  - id: cn2_nl_di_phu_dap_de
    title: Đi phu đắp đê
    tags: [lao_dong, lang_xa]
    life_stages: [thanh_nien, lap_nghiep]
    months: [1, 2, 11, 12]
    roles: [{ id: ly, from: village, village_role: ly_truong }]
    weight: 3
    once_per_life: true
    minor: true
    tension: 2
    importance: 2
    icon: lu
    text:
      - '{role.ly.call} gõ mõ gọi trai tráng đi phu đắp đê. Nhà nào không đi thì nộp tiền thay người.'
    options:
      - id: di_phu
        text: 'Vác mai lên đê'
        default: true
        effects: [{ type: health, value: -2 }, { type: reputation, group: dan_lang, value: 2 }]
        result: ['Nửa tháng gánh đất dưới gió bấc, vai bạn chai sạn thêm một lớp.']
      - id: nop_tien
        text: 'Bỏ tiền riêng nộp thay người'
        condition: { var: player.own_money, op: '>=', value: 0.5 }
        effects: [{ type: own_money, value: -0.5, ledger: su_kien }]
        result: ['Ông lý ghi tên bạn vào sổ "đã nộp". Không phải đi, nhưng túi vơi hẳn.']

  - id: cn2_nl_choi_ho
    title: Chơi họ trong xóm
    tags: [lang_xa, kinh_te]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition: { var: player.own_money, op: '>=', value: 1 }
    roles: [{ id: xom, from: village, village_role: hang_xom }]
    weight: 3
    once_per_life: true
    minor: true
    tension: 2
    importance: 3
    icon: tien
    text:
      - '{role.xom.call} rủ góp họ: mỗi tháng góp một ít, đến lượt mình thì hốt cả bát họ.'
    options:
      - id: gop_ho
        text: 'Góp một phần họ'
        chance: { base: 0.75, skill: muu_luoc, per_level: 0.03 }
        success: [{ type: own_money, value: 0.4, ledger: su_kien }]
        failure: [{ type: own_money, value: -1, ledger: su_kien }]
        success_result: ['Đến lượt bạn hốt họ, cầm cả bát tiền, lời được chút lãi.']
        failure_result: ['Chủ họ ôm tiền bỏ trốn lên ngược. Cả xóm khóc ròng, bạn mất trắng phần góp.']
      - id: khong
        text: 'Thôi, tiền ít giữ trong ống tre cho chắc'
        default: true
        result: ['{role.xom.call} chép miệng: "Thế thì thôi."']

  - id: cn2_nl_hoi_vat
    title: Hội vật đầu xuân
    tags: [le_hoi, vo_nghe]
    life_stages: [thanh_nien, lap_nghiep]
    months: [1, 2]
    condition: { var: player.sex, op: '==', value: m }
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: hoi
    text:
      - 'Sới vật làng bên mở hội, giải thưởng là một tấm lụa và ít tiền thưởng. Đám trai làng xui bạn ra thử sức.'
    options:
      - id: ra_soi
        text: 'Cởi áo bước ra sới'
        chance: { base: 0.35, skill: quan_su, per_level: 0.06 }
        success:
          - { type: own_money, value: 0.6, ledger: su_kien }
          - { type: reputation, group: dan_lang, value: 3 }
        failure: [{ type: health, value: -2 }]
        success_result: ['Bạn quật ngã ba đô vật, cả làng reo hò rung cả sới.']
        failure_result: ['Bị quật một cú đau điếng, bạn lồm cồm bò dậy giữa tiếng cười.']
      - id: dung_xem
        text: 'Đứng ngoài reo hò'
        default: true
        effects: [{ type: stress, value: -2 }]
        result: ['Trống vật giục giã, bạn hò hét đến khản cổ.']

  - id: cn2_nl_luoc_ngoc
    title: Chiếc lược sừng
    tags: [quan_he, le_hoi]
    life_stages: [thanh_nien]
    condition: { var: player.married, op: '==', value: false }
    weight: 4
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: cuoi
    text:
      - 'Phiên chợ quê có bày chiếc lược sừng chạm hoa, bạn chợt nghĩ đến một người trong xóm.'
    options:
      - id: mua_tang
        text: 'Lấy tiền riêng mua làm quà'
        condition: { var: player.own_money, op: '>=', value: 0.3 }
        effects:
          - { type: own_money, value: -0.3, ledger: mua_sam }
          - { type: stress, value: -3 }
        result: ['Người ấy cúi mặt nhận quà, má đỏ ửng. Cả buổi chiều bạn đi trên mây.']
      - id: de_lan_sau
        text: 'Để phiên sau vậy'
        default: true
        result: ['Phiên sau quay lại, chiếc lược đã có người mua mất.']

  - id: cn2_nl_mat_tien_cho
    title: Kẻ móc túi ở chợ
    tags: [lang_xa, nguy_hiem]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition: { var: player.own_money, op: '>=', value: 1 }
    weight: 3
    once_per_life: true
    minor: true
    tension: 2
    importance: 2
    icon: nguoi_la
    text:
      - 'Chợ phiên đông nghịt, có kẻ lách qua sát người bạn rồi lẩn vào đám đông. Tay bạn sờ thắt lưng.'
    options:
      - id: duoi_theo
        text: 'Hô hoán, đuổi theo'
        chance: { base: 0.4, skill: muu_luoc, per_level: 0.05 }
        failure: [{ type: own_money, value: -0.6, ledger: su_kien }]
        success_result: ['Bạn túm được gáy hắn ngay đầu chợ. Gói tiền vẫn còn nguyên.']
        failure_result: ['Hắn chạy biến vào ngõ hẻm. Bạn đứng thở dốc, túi nhẹ tênh.']
      - id: kiem_tra
        text: 'Đứng lại kiểm tra túi trước đã'
        default: true
        effects: [{ type: skill_xp, skill: muu_luoc, value: 3 }]
        result: ['May mà gói tiền vẫn còn. Từ đó đi chợ bạn buộc tiền vào cạp quần.']

  - id: cn2_nl_ca_chep_to
    title: Con cá chép to
    tags: [lang_xa, ruong_dong]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    weight: 3
    once_per_life: true
    minor: true
    tension: 1
    importance: 2
    icon: ca
    text:
      - 'Đi tát ao, bạn bắt được con cá chép to bằng bắp chân. Nhà bá hộ đang tìm cá to để cúng giỗ.'
    options:
      - id: ban_ba_ho
        text: 'Mang sang bán cho nhà bá hộ'
        effects: [{ type: own_money, value: 0.5, ledger: tien_cong }]
        result: ['Quản gia trả giá hời, còn khen cá đẹp.']
      - id: an_mung
        text: 'Mang về nấu cả nhà cùng ăn'
        default: true
        effects: [{ type: stress, value: -2 }, { type: food, value: 0.5 }]
        result: ['Nồi cá kho tương thơm lừng, mâm cơm tối ấy rôm rả hẳn.']

  - id: cn2_nl_gop_von_buon
    title: Bạn rủ góp vốn buôn chuyến
    tags: [buon_ban, quan_he]
    life_stages: [thanh_nien, lap_nghiep]
    condition: { var: player.own_money, op: '>=', value: 2 }
    weight: 4
    once_per_life: true
    minor: true
    tension: 2
    importance: 3
    icon: tien
    text:
      - 'Người bạn đồng niên rủ góp vốn buôn một chuyến nồi đất xuống chợ dưới, lời chia đôi.'
    options:
      - id: gop
        text: 'Góp tiền riêng vào chuyến hàng'
        chance: { base: 0.55, skill: thuong_mai, per_level: 0.05 }
        success:
          - { type: own_money, value: 1.2, ledger: buon_ban }
          - { type: skill_xp, skill: thuong_mai, value: 10 }
        failure: [{ type: own_money, value: -1.5, ledger: su_kien }]
