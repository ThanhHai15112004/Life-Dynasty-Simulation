    condition:
      all:
        - { var: player.career, op: 'in', value: [nong_dan, thuong_nhan] }
        - { var: player.sex, op: '==', value: m }
        - { var: player.age, op: between, value: [16, 35] }
        - { var: player.exam_degree, op: '==', value: none }
        - { var: player.health, op: '>=', value: 45 }
