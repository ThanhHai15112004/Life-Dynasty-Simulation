          - { type: reputation, group: dan_lang, value: 3 }
          - { type: stress, value: 6 }
        result:
          - 'Mẹ khâu vội cái túi đựng gạo rang. Bạn theo đoàn tráng đinh ra bến, ngoảnh lại thấy lũy tre làng nhỏ dần.'
      - id: nop_tien_thay
        text: 'Nộp 6 quan để thuê người đi thay'
        condition: { var: household.money, op: '>=', value: 6 }
        trait_stress: { nhan_tu: 3 }
        effects:
          - { type: money, value: -6, ledger: su_kien }
          - { type: opinion, role: lt, value: 5 }
        result:
          - 'Tiền trao tay {role.lt.call}, tên bạn được gạch đi, thay bằng tên một anh cố cùng đinh ở xóm ngoài. Ngày anh ấy đi, bạn không dám ra đầu ngõ.'
      - id: tron_len_rung
        text: 'Trốn lên rừng chờ qua đợt bắt'
        hint: 'Bị tìm ra thì vẫn phải đi, lại mang tiếng trốn'
        chance: { base: 0.5, skill: sinh_ton, per_level: 0.05 }
        success:
          - { type: health, value: -4 }
          - { type: stress, value: 4 }
          - { type: opinion, role: lt, value: -8 }
        failure:
          - { type: set_career, career: linh, rank: 0 }
          - { type: health, value: -6 }
          - { type: stress, value: 8 }
          - { type: opinion, role: lt, value: -10 }
        success_result:
          - 'Nửa tháng ngủ hang đá, ăn củ mài. Khi bạn về, đoàn lính đã đi. {role.lt.call} lườm bạn mà không làm gì được.'
        failure_result:
          - 'Tuần đinh lùng ra chỗ trốn ngay đêm thứ ba. Bạn bị trói giải về, đi lính chuyến sớm nhất.'

  - id: nq_linh_thu_don_bien
    title: Phiên thú nơi đồn biên
