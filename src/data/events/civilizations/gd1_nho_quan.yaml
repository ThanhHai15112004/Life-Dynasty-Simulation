# [1] Sự kiện quyết định: nhà nho, khoa cử, quan trường (si_tu) + lính (linh) và thảo khấu (thao_khau), từ 16 tuổi.
# Chuỗi nhiều hồi:
#   - Vụ kiện ruộng ở huyện: nq_huyen_kien_ruong → nq_huyen_kien_phuc_tham | nq_huyen_kien_bao_thu
#   - Người anh em đồng môn: nq_ket_nghia_dong_mon → nq_dong_mon_hoi_sau
#   - Đồng đội bên bờ suối: nq_linh_cuu_dong_doi → nq_linh_dong_doi_tra_on
#   - Chiêu an: nq_thao_khau_chieu_an → nq_thao_khau_chieu_an_hoi_sau
events:
  # ── Đèn sách, trường thi ──
  - id: nq_tro_hoc_nha_thay
    title: Lên huyện trọ học nhà cụ Hoàng giáp
    tags: [hoc_hanh, van_minh]
    life_stages: [thanh_nien]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: player.exam_degree, op: 'in', value: [none, sinh_do] }
        - { var: player.skill.hoc_van, op: '>=', value: 2 }
        - { var: player.mourning_months, op: '==', value: 0 }
    weight: 5
    once_per_life: true
    tension: 4
    importance: 6
    icon: sach
    text:
      - 'Trên huyện có cụ Hoàng giáp về hưu mở trường. Học trò bốn phương đến trọ học, khoa nào cũng có người đỗ.'
      - 'Muốn vào phải dâng lễ nhập môn và lo cơm trọ cả năm, ít nhất 4 quan. Ở nhà thì vẫn đọc sách được, chỉ là không ai chỉ cho chỗ sai.'
    options:
      - id: len_tro_hoc
        text: 'Dâng lễ nhập môn, lên huyện trọ học (4 quan)'
        condition: { var: household.money, op: '>=', value: 4 }
        effects:
          - { type: money, value: -4, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 28 }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: stress, value: 4 }
          - { type: modifier, target: xp.hoc_van, value: 1.15, op: mul, months: 12, label: 'Theo học trường cụ Hoàng giáp' }
        result:
          - 'Cơm trọ ngày hai bữa rau muống chấm tương. Đêm nào cụ cũng đi một vòng quanh dãy nhà trọ, gõ thước vào cột chỗ ai ngủ gật.'
      - id: tu_hoc_o_nha
        text: 'Ở nhà tự đọc, chỗ nào không hiểu thì hỏi thầy đồ làng'
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: filial_piety, value: 3 }
        result:
          - 'Sáng bạn đọc sách, chiều đỡ việc nhà cho mẹ. Học chậm hơn người ta, nhưng bữa cơm nào cũng đủ mặt.'
      - id: doi_cong_lay_cho_hoc
        text: 'Xin làm người giữ sách cho trường, đổi công lấy chỗ học'
        hint: 'Cần ăn nói được lòng người quản trường'
        chance: { base: 0.45, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: skill_xp, skill: hoc_van, value: 22 }
          - { type: health, value: -2 }
        failure:
          - { type: skill_xp, skill: hoc_van, value: 6 }
          - { type: stress, value: 5 }
        success_result:
          - 'Cụ Hoàng giáp nhìn đôi tay chai sạn của bạn rồi gật đầu. Ban ngày bạn quét nhà, phơi sách. Tối được ngồi cuối lớp nghe giảng.'
        failure_result:
          - 'Người quản trường bảo chỗ giữ sách đã có cháu nhà cụ làm. Bạn đứng ngoài hiên nghe lỏm nửa buổi rồi về.'

  - id: nq_mua_van_mau
    title: Tập văn mẫu ở hiệu sách chợ huyện
    tags: [hoc_hanh]
    life_stages: [thanh_nien, lap_nghiep]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: player.exam_degree, op: 'in', value: [none, sinh_do, huong_cong] }
    weight: 4
    weight_modifiers:
      - { condition: { var: world.exam_stage, op: '!=', value: none }, factor: 1.5 }
    cooldown_years: 12   # [1.5] giãn ra: trước 5 năm, đời nào cũng gặp lại
    tension: 3
    importance: 4
    icon: sach
    text:
      - 'Hiệu sách đầu chợ huyện mới về một tập văn mẫu chép tay, nghe nói gom bài của các ông Nghè khoa trước. Giá 2 quan, ngang một con lợn.'
      - 'Mấy anh học trò rỉ tai nhau: thuộc lòng tập ấy thì vào trường khỏi lo bí ý.'
    options:
      - id: mua_hoc_thuoc
        text: 'Mua về học thuộc (2 quan)'
        hint: 'Được nhanh, nhưng dễ quen lối văn sáo'
        condition: { var: household.money, op: '>=', value: 2 }
        effects:
          - { type: money, value: -2, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 20 }
          - { type: modifier, target: xp.hoc_van, value: 0.9, op: mul, months: 12, label: 'Quen lối văn sáo' }
        result:
          - 'Văn trơn tru thật, đọc lên nghe sướng tai. Có điều đọc mãi bạn thấy bài nào cũng na ná bài nào.'
      - id: muon_chep_lai
        text: 'Mượn của bạn học, thức đêm chép lại'
        effects:
          - { type: skill_xp, skill: hoc_van, value: 14 }
          - { type: health, value: -3 }
          - { type: stress, value: 3 }
        result:
          - 'Ba đêm liền chép dưới ngọn đèn dầu lạc, mắt cay xè. Chép đến đâu ngẫm đến đó, nhớ lâu hơn đọc suông.'
      - id: khong_mua
        text: 'Văn của mình thì mình tự viết'
        trait_stress: { tham_vong: 3 }
        effects:
          - { type: skill_xp, skill: hoc_van, value: 8 }
          - { type: scholarly_prestige, value: 2 }
        result:
          - 'Bạn gấp sách trả người bán, về nhà tự ra đề cho mình. Văn còn vụng, nhưng là văn của bạn.'

  - id: nq_mua_de_thi
    title: Kẻ lạ rao bán đầu đề trường thi
    tags: [hoc_hanh, nguy_hiem, tin_don]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: world.exam_stage, op: '==', value: huong }
        - { var: player.exam_degree, op: '==', value: none }
        - { var: player.skill.hoc_van, op: '>=', value: 3 }
        - { var: player.mourning_months, op: '==', value: 0 }
    weight: 4
    cooldown_years: 6
    tension: 6
    importance: 7
    icon: nguoi_la
    text:
      - 'Còn nửa tháng nữa vào trường, một gã áo the nâu tìm đến nhà trọ. Hắn hạ giọng: có người quen trong trường, biết trước đầu đề kỳ đệ nhất, giá 5 quan.'
      - 'Hắn còn bày cả cách cuộn giấy giấu trong cán bút lông.'
    options:
      - id: mua_de
        text: 'Mua đầu đề (5 quan)'
        hint: 'Trúng thì đỗ Sinh đồ, lộ thì mất hết thể diện'
        condition: { var: household.money, op: '>=', value: 5 }
        trait_stress: { than_trong: 4 }
        chance: { base: 0.4, skill: muu_luoc, per_level: 0.04 }
        effects:
          - { type: money, value: -5, ledger: su_kien }
        success:
          - { type: set_exam_degree, degree: sinh_do }
          - { type: stress, value: 5 }
        failure:
          - { type: scholarly_prestige, value: -10 }
          - { type: reputation, group: dan_lang, value: -6 }
          - { type: stress, value: 8 }
          - { type: set_flag, flag: nq_tieng_gian_lan, years: 6, label: 'Mang tiếng gian lận trường thi' }
        success_result:
          - 'Đầu đề trúng thật. Ngày yết bảng có tên bạn. Ai cũng chúc mừng, chỉ mình bạn biết vì sao hôm ấy bút chạy nhanh thế.'
        failure_result:
          - 'Đề thi khác hẳn. Tệ hơn, lính khám trường rút mảnh giấy từ cán bút ra trước mặt cả dãy lều. Tên bạn bị dán ở cổng trường.'
      - id: duoi_di
        text: 'Đuổi hắn đi, thi bằng sức mình'
        effects:
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: scholarly_prestige, value: 2 }
        result:
          - 'Gã áo nâu nhổ toẹt bãi nước trầu rồi đi. Đêm ấy bạn ôn bài muộn hơn thường lệ.'
      - id: bao_quan_truong
        text: 'Giữ chân hắn, cho người báo quan coi trường'
        trait_stress: { than_trong: 4 }
        chance: { base: 0.45, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: scholarly_prestige, value: 8 }
          - { type: reputation, group: dan_lang, value: 4 }
        failure:
          - { type: health, value: -6 }
          - { type: stress, value: 5 }
        success_result:
          - 'Lính trường bắt được hắn cùng một xấp đề giả. Quan coi trường cho gọi tên bạn ra khen trước cổng.'
        failure_result:
          - 'Hắn chuồn mất trước khi lính tới. Hai đêm sau, bạn bị mấy kẻ lạ chặn đánh ở đầu ngõ trọ.'

  # ── Chuỗi: người anh em đồng môn ──
  - id: nq_ket_nghia_dong_mon
    title: Người bạn đồng môn nghèo
    tags: [hoc_hanh, quan_he]
    life_stages: [thanh_nien, lap_nghiep]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { not: { has_flag: nq_dong_mon } }
    weight: 4
    once_per_life: true
    tension: 3
    importance: 6
    icon: chen_tra
    text:
      - 'Trong đám học trò cùng thầy có một anh người làng bên, học giỏi nhất lớp mà nghèo nhất lớp. Mùa này nhà anh mất mùa, anh định bỏ học về đi cày.'
      - 'Tối ấy anh ngồi với bạn bên ấm chè, mãi không nói được câu nào.'
    options:
      - id: ket_nghia
        text: 'Kết nghĩa anh em, góp 3 quan cho anh ở lại học'
        condition: { var: household.money, op: '>=', value: 3 }
        effects:
          - { type: money, value: -3, ledger: su_kien }
          - { type: skill_xp, skill: ngoai_giao, value: 10 }
          - { type: set_flag, flag: nq_dong_mon, years: 40 }
          - { type: schedule_event, event: nq_dong_mon_hoi_sau, months: 60, label: 'Người anh em kết nghĩa đi thi' }
        result:
          - 'Hai người thắp hương trước bàn thờ Khổng Tử, lạy nhau ba lạy. Anh nắm tay bạn, bảo đời này không dám quên.'
      - id: chia_com_tro
        text: 'Chia cho anh nửa phần cơm trọ và sách vở'
        effects:
          - { type: food, value: -3 }
          - { type: skill_xp, skill: hoc_van, value: 10 }
          - { type: stress, value: 2 }
          - { type: set_flag, flag: nq_dong_mon, years: 40 }
          - { type: schedule_event, event: nq_dong_mon_hoi_sau, months: 72, label: 'Người bạn cùng mâm cơm trọ' }
        result:
          - 'Từ đó hai người ăn chung mâm, đọc chung đèn. Anh giảng cho bạn những chỗ khó trong Kinh Dịch, bạn thấy mình học được nhiều hơn mất.'
      - id: khuyen_ve
        text: 'Khuyên anh về nhà lo cơm áo trước đã'
        trait_stress: { nhan_tu: 4, hao_phong: 3 }
        effects:
          - { type: stress, value: 2 }
        result:
          - 'Anh gật đầu, sáng hôm sau gánh sách về làng. Lớp học vắng một chỗ ngồi, thầy đồ nhìn chỗ ấy thở dài.'

  - id: nq_dong_mon_hoi_sau
    title: Thư người anh em kết nghĩa từ Kinh
    tags: [quan_he, hoc_hanh, thoi_co]
    weight: 1
    scheduled_only: true
    tension: 4
    importance: 7
    icon: chen_tra
    text:
      - 'Mấy năm sau, người bạn đồng môn ngày trước đã đỗ Tiến sĩ, được bổ làm quan ở Kinh. Thư anh gửi về viết trên giấy dó tốt, chữ vẫn nghiêng nghiêng như hồi ở trọ.'
      - 'Anh muốn tiến cử bạn vào làm việc ở nha môn. Chỉ cần bạn lên Kinh một chuyến ra mắt quan trên.'
    options:
      - id: len_kinh
        text: 'Thu xếp lên Kinh nhận lời tiến cử'
        condition:
          all:
            - { var: player.career, op: '==', value: si_tu }
            - { var: household.money, op: '>=', value: 2 }
        effects:
          - { type: money, value: -2, ledger: su_kien }
          - { type: career_merit, value: 20 }
          - { type: scholarly_prestige, value: 6 }
          - { type: skill_xp, skill: quan_tri, value: 15 }
          - { type: stress, value: 4 }
        result:
          - 'Anh ra tận bến đón, áo mũ chỉnh tề mà vẫn ôm bạn như ngày ở trọ. Nhờ lời anh, quan trên ghi tên bạn vào sổ người hiền cần dùng.'
      - id: nho_luc_tung
        text: 'Cảm ơn anh, chỉ xin anh đỡ cho nhà lúc túng'
        effects:
          - { type: money, value: 5, ledger: thu_khac }
        result:
          - 'Tháng sau có người mang đến 5 quan kèm lá thư ngắn: "Ngày ấy em cho anh bát cơm, nay anh trả cả gốc lẫn tình."'
      - id: o_que
        text: 'Viết thư từ chối, ở quê phụng dưỡng cha mẹ'
        trait_stress: { tham_vong: 4 }
        effects:
          - { type: filial_piety, value: 5 }
          - { type: scholarly_prestige, value: 3 }
        result:
          - 'Bạn gửi lại anh mấy cân chè búp làng mình. Anh hồi âm chỉ một câu: "Hiếu là gốc, anh hiểu."'

  # ── Quan trường ──
  - id: nq_dang_so_can_gian
    title: Viết sớ can việc dựng cung
    tags: [van_minh, hoc_hanh, nguy_hiem]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: player.exam_degree, op: 'in', value: [huong_cong, tien_si] }
    weight: 3
    cooldown_years: 8
    tension: 7
    importance: 7
    icon: sach
    text:
      - 'Chiếu xuống các lộ: triều đình định dựng thêm cung điện, mỗi suất đinh phải đi thêm ba ngày sưu và góp một thúng thóc. Năm nay mùa màng vốn đã chẳng ra gì.'
      - 'Mấy người khoa bảng trong huyện họp nhau bàn chuyện viết sớ can, nhưng ai cũng nhìn người khác trước.'
    options:
      - id: dung_ten_dang_so
        text: 'Một mình đứng tên viết sớ dâng lên'
        hint: 'Văn hay thì được việc, vụng thì bị quở'
        trait_stress: { than_trong: 5 }
        chance: { base: 0.4, skill: hoc_van, per_level: 0.05 }
        success:
          - { type: scholarly_prestige, value: 12 }
          - { type: career_merit, value: 12 }
          - { type: reputation, group: dan_lang, value: 6 }
        failure:
          - { type: career_merit, value: -15 }
          - { type: scholarly_prestige, value: 4 }
          - { type: stress, value: 8 }
        success_result:
          - 'Tờ sớ lời lẽ ôn hòa mà chặt chẽ. Ba tháng sau có chiếu giảm một nửa số sưu. Tên bạn được nhắc trong các hội văn.'
        failure_result:
          - 'Sớ bị trả về kèm lời quở "bàn càn việc lớn". Quan trên nhìn bạn khác đi, nhưng sĩ phu trong vùng thì kính bạn hơn.'
      - id: ky_ten_chung
        text: 'Cùng ký tên vào tờ sớ chung của sĩ phu trong huyện'
        effects:
          - { type: scholarly_prestige, value: 4 }
          - { type: chance, p: 0.25, then: [{ type: career_merit, value: -6 }, { type: stress, value: 4 }] }
        result:
          - 'Tờ sớ có mười bảy chữ ký. Tên bạn nằm ở giữa, không đầu cũng không cuối.'
      - id: im_lang
        text: 'Im lặng, việc triều đình chưa đến lượt mình bàn'
        trait_stress: { can_dam: 5, nhan_tu: 3 }
        effects:
          - { type: scholarly_prestige, value: -3 }
          - { type: stress, value: 3 }
        result:
          - 'Bạn cáo bận không đến buổi họp. Mùa sưu năm ấy, dân làng đi phu dài hơn mọi năm.'

  # ── Chuỗi: vụ kiện ruộng ở huyện ──
  - id: nq_huyen_kien_ruong
    title: Lá đơn kiện ruộng của người đàn bà góa
    tags: [van_minh, nghe_nghiep, quan_he]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: player.career_rank, op: '>=', value: 3 }
    roles:
      - { id: bh, from: village, village_role: ba_ho }
    weight: 6
    once_per_life: true
    tension: 6
    importance: 8
    icon: ruong
    text:
      - 'Một người đàn bà góa quỳ trước công đường, tay cầm lá đơn kiện {role.bh.call} lấn ba sào ruộng chồng chị để lại.'
      - 'Tối hôm ấy, gia nhân nhà {role.bh.call} gõ cửa tư dinh, đặt lên án thư một tráp sơn son. Trong tráp có 8 quan và một lá thư lời lẽ rất mềm.'
    options:
      - id: nhan_le
        text: 'Nhận tráp, xử cho {role.bh.call} thắng kiện'
        trait_stress: { nhan_tu: 6 }
        effects:
          - { type: money, value: 8, ledger: su_kien }
          - { type: opinion, role: bh, value: 15 }
          - { type: scholarly_prestige, value: -4 }
          - { type: schedule_event, event: nq_huyen_kien_phuc_tham, months: 18, label: 'Vụ kiện ruộng chưa yên' }
        result:
          - 'Văn án viết gọn gàng, đủ lý đủ lẽ. Người đàn bà góa ra khỏi công đường không khóc, chỉ ngoái lại nhìn tấm biển "Minh kính cao huyền" rất lâu.'
      - id: xu_cong_minh
        text: 'Trả tráp, cho đo lại ruộng theo sổ địa bạ'
        trait_stress: { tham_lam: 5 }
        effects:
          - { type: opinion, role: bh, value: -20 }
          - { type: reputation, group: dan_lang, value: 8 }
          - { type: scholarly_prestige, value: 6 }
          - { type: career_merit, value: 6 }
          - { type: schedule_event, event: nq_huyen_kien_bao_thu, months: 14, label: 'Mối hận sau vụ kiện ruộng' }
        result:
          - 'Sổ địa bạ ghi rõ ba sào ấy là của nhà người góa phụ. Bạn trả tráp sơn son nguyên niêm. Dân trong hạt đồn nhau quan huyện mới "không ăn của ai".'
      - id: hoa_giai
        text: 'Gọi hai bên đến, khuyên chia đôi cho êm'
        hint: 'Cần khéo ăn nói'
        chance: { base: 0.45, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: skill_xp, skill: ngoai_giao, value: 15 }
          - { type: career_merit, value: 8 }
          - { type: opinion, role: bh, value: -3 }
        failure:
          - { type: reputation, group: dan_lang, value: -4 }
          - { type: opinion, role: bh, value: -8 }
          - { type: stress, value: 4 }
        success_result:
          - 'Hai bên ký vào văn tự chia ruộng, mặt ai cũng chưa vui hẳn. Nhưng từ đó không ai còn đến công đường kêu nữa.'
        failure_result:
          - 'Người góa phụ bảo quan "ăn cả hai đầu", {role.bh.call} thì chê quan nhu nhược. Vụ kiện bị bỏ dở, tiếng thì cả hạt biết.'

  - id: nq_huyen_kien_phuc_tham
    title: Quan Phủ cho người về tra lại vụ ruộng
    tags: [van_minh, nghe_nghiep, nguy_hiem]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: player.career_rank, op: '>=', value: 3 }
    roles:
      - { id: bh, from: village, village_role: ba_ho }
    weight: 1
    scheduled_only: true
    tension: 7
    importance: 8
    icon: thue
    text:
      - 'Người đàn bà góa năm trước không chịu thôi. Chị đội đơn đi bộ lên phủ, quỳ ở cổng ba ngày liền.'
      - 'Nay quan Phủ sai một viên thông phán về huyện, giở lại hồ sơ vụ ruộng. Hắn nói ít, mắt cứ nhìn cái tráp sơn son trên án thư nhà bạn.'
    options:
      - id: lo_lot_tiep
        text: 'Biếu viên thông phán một món hậu (6 quan)'
        condition: { var: household.money, op: '>=', value: 6 }
        chance: { base: 0.5, skill: ngoai_giao, per_level: 0.04 }
        effects:
          - { type: money, value: -6, ledger: su_kien }
        success:
          - { type: stress, value: 4 }
        failure:
          - { type: set_career, career: si_tu, rank: 2 }
          - { type: scholarly_prestige, value: -8 }
          - { type: reputation, group: dan_lang, value: -6 }
          - { type: stress, value: 8 }
        success_result:
          - 'Hồ sơ về phủ chỉ còn một dòng "xét không có gì sai". Bạn ngủ yên, nhưng từ đó sợ tiếng gõ cửa ban đêm.'
        failure_result:
          - 'Hắn nhận quà rồi vẫn tâu lên đủ cả. Chiếu xuống giáng bạn làm Huấn đạo. Ba sào ruộng trả về tay người đàn bà góa.'
      - id: nhan_loi
        text: 'Tự nhận xử sai, trả ruộng cho người góa phụ'
        trait_stress: { tham_vong: 5 }
        effects:
          - { type: career_merit, value: -20 }
          - { type: money, value: -3, ledger: su_kien }
          - { type: scholarly_prestige, value: 4 }
          - { type: reputation, group: dan_lang, value: 6 }
          - { type: opinion, role: bh, value: -10 }
        result:
          - 'Bạn tự tay viết bản án mới. Quan Phủ phạt bổng ba tháng, ghi một lời khiển trách. Người đàn bà góa đến cổng tư dinh lạy hai lạy rồi đi.'
      - id: do_cho_thu_lai
        text: 'Đổ cho viên thư lại làm sai văn án'
        trait_stress: { nhan_tu: 6, trung_thanh: 4 }
        chance: { base: 0.45, skill: muu_luoc, per_level: 0.05 }
        success:
          - { type: career_merit, value: -5 }
          - { type: stress, value: 5 }
        failure:
          - { type: set_career, career: si_tu, rank: 2 }
          - { type: scholarly_prestige, value: -10 }
          - { type: stress, value: 8 }
        success_result:
          - 'Viên thư lại già bị đánh hai chục roi, đuổi khỏi nha môn. Lúc đi ra hắn nhìn bạn, không nói gì.'
        failure_result:
          - 'Viên thư lại khai ra cả cái tráp sơn son. Bạn bị giáng làm Huấn đạo, tiếng xấu theo về đến làng.'

  - id: nq_huyen_kien_bao_thu
    title: Lời gièm từ cửa sau phủ đường
    tags: [van_minh, nghe_nghiep, quan_he]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: player.career_rank, op: '>=', value: 3 }
    roles:
      - { id: bh, from: village, village_role: ba_ho }
    weight: 1
    scheduled_only: true
    tension: 6
    importance: 7
    icon: tin_don
    text:
      - 'Từ sau vụ kiện ruộng, {role.bh.call} không đến hầu quan huyện nữa. Nay có tin ông ta mang lễ lên phủ, gièm rằng bạn "dung túng dân kiện quấy, để thuế trong hạt thất thu".'
      - 'Thuế cuối năm ông ta cũng cố tình nộp chậm, kéo theo cả mấy nhà giàu khác.'
    options:
      - id: doc_thue_nghiem
        text: 'Sai lính đến tận nhà {role.bh.call} đốc thuế'
        chance: { base: 0.5, skill: quan_tri, per_level: 0.05 }
        success:
          - { type: career_merit, value: 15 }
          - { type: reputation, group: dan_lang, value: 5 }
          - { type: opinion, role: bh, value: -10 }
        failure:
          - { type: career_merit, value: -10 }
          - { type: stress, value: 6 }
        success_result:
          - 'Lính đứng chật sân, {role.bh.call} đành mở kho nộp đủ. Mấy nhà giàu khác thấy thế cũng lục tục gánh thóc đến.'
        failure_result:
          - '{role.bh.call} đóng cổng, bảo người nhà đang ốm. Lính về tay không, lời gièm trên phủ thì có thêm chuyện mà nói.'
      - id: giai_hoa
        text: 'Mời {role.bh.call} đến uống trà, cho một bậc thang mà xuống'
        effects:
          - { type: opinion, role: bh, value: 15 }
          - { type: scholarly_prestige, value: -2 }
          - { type: skill_xp, skill: ngoai_giao, value: 15 }
        result:
          - 'Chén trà thứ ba thì {role.bh.call} cười. Thuế nộp đủ trong tháng, nhưng người trong hạt bảo quan huyện rốt cuộc cũng phải nể nhà giàu.'
      - id: trinh_len_phu
        text: 'Viết tờ trình lên phủ, kê rõ đầu đuôi vụ ruộng'
        chance: { base: 0.45, skill: hoc_van, per_level: 0.05 }
        success:
          - { type: scholarly_prestige, value: 8 }
          - { type: career_merit, value: 10 }
        failure:
          - { type: career_merit, value: -15 }
          - { type: stress, value: 8 }
        success_result:
          - 'Quan Phủ đọc tờ trình, cho gọi {role.bh.call} lên quở một trận. Từ đó không ai dám mang chuyện huyện bạn lên cửa sau nữa.'
        failure_result:
          - 'Tờ trình nằm im trên án quan Phủ cả mùa. Trong khi ấy lễ của {role.bh.call} thì vẫn đến đều.'

  - id: nq_huyen_mat_mua_thue
    title: Thuế lúa năm đói trong hạt
    tags: [van_minh, nghe_nghiep, thien_tai, kinh_te]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    months: [9, 10, 11, 12]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: player.career_rank, op: '>=', value: 3 }
        - { var: world.harvest_quality, op: 'in', value: [kem, mat_mua] }
    weight: 6
    cooldown_years: 4
    tension: 7
    importance: 8
    icon: thue
    text:
      - 'Năm nay trong hạt mất mùa, đồng nào cũng lép. Công văn của bộ Hộ vẫn đến đúng hẹn: thuế lúa phải nộp đủ trước tháng Chạp.'
      - 'Kho nghĩa thương của huyện còn hơn trăm thúng thóc. Chưa có lệnh trên thì không ai được mở.'
    options:
      - id: thu_du_thue
        text: 'Thu đủ thuế nộp lên, phép nước là phép nước'
        trait_stress: { nhan_tu: 6 }
        effects:
          - { type: career_merit, value: 15 }
          - { type: reputation, group: dan_lang, value: -10 }
          - { type: stress, value: 3 }
        result:
          - 'Thuyền thuế xuôi đúng hẹn, quan trên khen huyện bạn không thiếu một thúng. Sang xuân, trong hạt có làng bỏ đi nửa số hộ.'
      - id: tau_xin_hoan
        text: 'Làm tờ tâu xin hoãn thuế cho dân'
        chance: { base: 0.45, skill: quan_tri, per_level: 0.05 }
        success:
          - { type: reputation, group: dan_lang, value: 10 }
          - { type: scholarly_prestige, value: 6 }
          - { type: career_merit, value: 5 }
        failure:
          - { type: career_merit, value: -12 }
          - { type: stress, value: 6 }
        success_result:
          - 'Chiếu xuống cho hoãn thuế đến vụ sau. Các cụ trong hạt rủ nhau mang gà, mang chè lên nha, bạn bảo mang về cả.'
        failure_result:
          - 'Tờ tâu bị bác, kèm lời trách "quan huyện không biết đốc thúc". Thuế vẫn phải thu, chỉ là chậm hơn và nặng lời hơn.'
      - id: mo_kho_truoc
        text: 'Mở kho nghĩa thương phát chẩn trước, tâu sau'
        hint: 'Dân được cứu ngay, nhưng có thể bị giáng chức'
        trait_stress: { than_trong: 5, tham_lam: 4 }
        effects:
          - { type: reputation, group: dan_lang, value: 14 }
          - { type: scholarly_prestige, value: 5 }
          - { type: chance, p: 0.35, then: [{ type: set_career, career: si_tu, rank: 2 }, { type: stress, value: 6 }], else: [{ type: career_merit, value: 6 }] }
        result:
          - 'Cổng kho mở lúc tinh mơ, dân xếp hàng dài đến tận bến đò. Còn lệnh trên thế nào, bạn để mặc trời.'

  - id: nq_quan_phu_duyet_so
    title: Quan Phủ về duyệt sổ sách
    tags: [van_minh, nghe_nghiep, quan_he]
    life_stages: [lap_nghiep, trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: player.career_rank, op: '>=', value: 2 }
    weight: 5
    cooldown_years: 6
    tension: 6
    importance: 7
    icon: thue
    text:
      - 'Quan Phủ sắp về duyệt sổ sách trong hạt. Lính hầu đi trước đã kịp nói nhỏ với bạn.'
      - 'Lần trước, mấy viên quan "biết điều" đều được ghi chữ ưu. Ai cứng cổ thì sổ sách kiểu gì cũng ra chỗ sai.'
    options:
      - id: dang_le_hau
        text: 'Dâng lễ hậu (6 quan), sổ sách để người dưới lo'
        condition: { var: household.money, op: '>=', value: 6 }
        trait_stress: { tham_lam: 4 }
        effects:
          - { type: money, value: -6, ledger: su_kien }
          - { type: career_merit, value: 10 }
          - { type: scholarly_prestige, value: -2 }
        result:
          - 'Quan Phủ chỉ lật qua dăm trang rồi gật gù. Chữ ưu ghi vào sổ, còn túi nhà bạn thì nhẹ hẳn.'
      - id: le_vua_phai
        text: 'Biếu lễ vừa phải (2 quan) cho phải phép'
        condition: { var: household.money, op: '>=', value: 2 }
        chance: { base: 0.6, skill: ngoai_giao, per_level: 0.04 }
        effects:
          - { type: money, value: -2, ledger: su_kien }
        success:
          - { type: career_merit, value: 5 }
        failure:
          - { type: career_merit, value: -8 }
          - { type: stress, value: 4 }
        success_result:
          - 'Lễ không to nhưng lời lẽ khéo. Quan Phủ cười, bảo "trẻ mà hiểu chuyện".'
        failure_result:
          - 'Quan Phủ liếc gói lễ một cái rồi thôi. Sổ của bạn bị ghi mấy chữ "cần xét thêm".'
      - id: so_sach_minh_bach
        text: 'Không lễ lạt, bày sổ sách ra cho quan xét'
        hint: 'Sổ sách phải thật sạch, nếu không có thể bị cách chức'
        trait_stress: { than_trong: 4 }
        chance: { base: 0.45, skill: quan_tri, per_level: 0.06 }
        success:
          - { type: career_merit, value: 12 }
          - { type: scholarly_prestige, value: 5 }
        failure:
          - { type: set_career, career: si_tu, rank: 1 }
          - { type: scholarly_prestige, value: -4 }
          - { type: stress, value: 8 }
        success_result:
          - 'Quan Phủ lật từng trang, đến trang cuối thì gấp sổ: "Sạch thì sạch thật." Ông không khen, nhưng chữ ưu vẫn ghi vào.'
        failure_result:
          - 'Một chỗ cộng sai trong sổ thóc năm trước bị bới ra, rồi thêm chỗ nữa. Chiếu xuống cách chức bạn, cho về làng dạy học.'

  - id: nq_cao_quan_ve_que
    title: Dâng biểu xin cáo quan
    tags: [van_minh, gia_dinh, nghe_nghiep]
    life_stages: [trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: player.career_rank, op: '>=', value: 2 }
        - { any: [{ var: player.age, op: '>=', value: 55 }, { var: player.health, op: '<', value: 50 }] }
    weight: 5
    once_per_life: true
    tension: 5
    importance: 8
    icon: nha
    text:
      - 'Tóc đã bạc quá nửa, sáng nào ngồi án thư bạn cũng mỏi lưng. Thư nhà gửi lên kể từ đường dột, ruộng tổ không ai trông, con cháu thì lêu lổng.'
      - 'Đồng liêu bảo còn vài năm nữa là đến lượt được thăng, về lúc này thì phí.'
    options:
      - id: cao_quan
        text: 'Dâng biểu cáo quan, về quê mở trường dạy học'
        trait_stress: { tham_vong: 6 }
        effects:
          - { type: set_career, career: si_tu, rank: 1 }
          - { type: filial_piety, value: 6 }
          - { type: scholarly_prestige, value: 6 }
          - { type: stress, value: -10 }
          - { type: modifier, target: stress.monthly, value: -0.3, months: 24, label: 'Thảnh thơi chốn quê nhà' }
        result:
          - 'Ngày bạn về, học trò cũ đứng đón ở đầu đê. Chiếc hòm gỗ theo bạn hai mươi năm chỉ đựng sách và mấy bộ áo.'
      - id: o_lai
        text: 'Gắng làm thêm vài năm cho trọn chức phận'
        effects:
          - { type: career_merit, value: 12 }
          - { type: health, value: -6 }
          - { type: stress, value: 5 }
          - { type: filial_piety, value: -3 }
        result:
          - 'Bạn gửi về nhà ít tiền sửa mái từ đường, rồi lại cúi xuống chồng công văn. Đêm nằm, tiếng ho kéo dài hơn năm ngoái.'
      - id: xin_ve_gan_que
        text: 'Xin đổi về làm quan một huyện gần quê'
        chance: { base: 0.4, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: stress, value: -6 }
          - { type: filial_piety, value: 4 }
        failure:
          - { type: stress, value: 4 }
          - { type: money, value: -2, ledger: su_kien }
        success_result:
          - 'Lệnh đổi xuống vào mùa xuân. Từ nha môn mới về làng chỉ nửa ngày đường, rằm nào bạn cũng kịp về thắp hương.'
        failure_result:
          - 'Đơn xin đổi nằm ở bộ Lại cả năm, chỉ tốn mấy quan tiền trà nước cho người đưa thư.'

  - id: nq_day_chau_hoc_chu
    title: Dạy trẻ những chữ đầu đời
    tags: [gia_dinh, hoc_hanh]
    life_stages: [trung_nien, tuoi_gia]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: player.skill.hoc_van, op: '>=', value: 4 }
    roles:
      - { id: chau, from: family, relation: member, condition: { var: self.age, op: between, value: [6, 12] }, pick: youngest }
    weight: 5
    cooldown_years: 6
    tension: 2
    importance: 5
    icon: tre_em
    text:
      - '{role.chau.call} năm nay vừa đến tuổi cầm bút. Ngày nào cũng lấp ló ngoài thư phòng, nhìn bạn mài mực.'
      - 'Thầy đồ trường làng đã già, dạy chữ được chữ mất.'
    options:
      - id: tu_tay_day
        text: 'Tự tay dạy {role.chau.call} mỗi sớm'
        effects:
          - { type: skill_xp, skill: hoc_van, value: 25, who: chau }
          - { type: skill_xp, skill: hoc_van, value: 6 }
          - { type: opinion, role: chau, value: 10 }
          - { type: stress, value: 3 }
        result:
          - 'Sớm nào cũng vậy, một già một trẻ ngồi bên án thư. Nét sổ của {role.chau.call} còn run, nhưng đã biết giữ thẳng lưng.'
      - id: gui_thay_gioi
        text: 'Gửi {role.chau.call} lên huyện theo thầy giỏi (2 quan)'
        condition: { var: household.money, op: '>=', value: 2 }
        effects:
          - { type: money, value: -2, ledger: su_kien }
          - { type: skill_xp, skill: hoc_van, value: 18, who: chau }
          - { type: opinion, role: chau, value: -3 }
        result:
          - 'Hôm đi, {role.chau.call} ôm bọc sách mếu máo đến tận đầu đê. Cuối năm về, nó đọc được cả bài văn tế.'
      - id: de_tu_chon
        text: 'Để nó tự chọn, thích cày thì cày, thích chữ thì học'
        trait_stress: { tham_vong: 3 }
        effects:
          - { type: skill_xp, skill: sinh_ton, value: 12, who: chau }
          - { type: opinion, role: chau, value: 8 }
        result:
          - '{role.chau.call} chạy ra đồng theo đám trẻ chăn trâu. Chiều về kể chuyện bắt được con cá rô, mắt sáng hơn mọi bài học.'

  - id: nq_cau_doi_tet
    title: Câu đối Tết cho nhà bá hộ
    tags: [hoc_hanh, le_hoi, lang_xa]
    life_stages: [thanh_nien, lap_nghiep, trung_nien, tuoi_gia]
    months: [12, 1]
    condition:
      all:
        - { var: player.career, op: '==', value: si_tu }
        - { var: player.skill.hoc_van, op: '>=', value: 3 }
    roles:
      - { id: bh, from: village, village_role: ba_ho }
    weight: 5
    cooldown_years: 4
    tension: 2
    importance: 4
    icon: tet
    text:
      - 'Giáp Tết, {role.bh.call} sai người mang giấy hồng điều sang, nhờ bạn viết đôi câu đối treo cổng. Dặn phải có chữ "phú", chữ "quý" cho to.'
      - 'Cùng buổi ấy, mấy nhà nghèo đầu xóm cũng cầm giấy đỏ đến xin chữ, chẳng ai có tiền lễ.'
    options:
      - id: viet_cho_ba_ho
        text: 'Viết cho {role.bh.call} thật kêu, nhận 3 quan tiền lễ'
        effects:
          - { type: money, value: 3, ledger: day_hoc }
          - { type: opinion, role: bh, value: 10 }
          - { type: scholarly_prestige, value: -2 }
        result:
          - 'Câu đối thếp vàng treo cổng, cả làng đi qua đều ngước nhìn. Các cụ đồ già thì lắc đầu: chữ đẹp mà ý tầm thường.'
      - id: viet_cho_dan
        text: 'Ngồi đầu chợ viết cho dân nghèo, ai cho gì nhận nấy'
        effects:
          - { type: reputation, group: dan_lang, value: 6 }
          - { type: scholarly_prestige, value: 3 }
          - { type: food, value: 1, ledger: thu_khac }
          - { type: opinion, role: bh, value: -5 }
        result:
          - 'Cả buổi chợ bạn viết không ngơi tay. Tiền lễ là mấy quả cam, một nắm gạo nếp, một cái bánh chưng nhỏ.'
      - id: treo_ve_thach
        text: 'Viết xong cho {role.bh.call}, treo thêm một vế thách đối ở đình'
        chance: { base: 0.45, skill: hoc_van, per_level: 0.06 }
        success:
          - { type: scholarly_prestige, value: 8 }
          - { type: skill_xp, skill: hoc_van, value: 12 }
          - { type: money, value: 2, ledger: day_hoc }
        failure:
          - { type: scholarly_prestige, value: -3 }
          - { type: stress, value: 3 }
        success_result:
          - 'Suốt ba ngày Tết, sĩ tử mấy làng kéo đến đình nghĩ vế đối. Không ai đối được, tên bạn thành chuyện để người ta bàn đến rằm tháng Giêng.'
        failure_result:
          - 'Ngay chiều mồng một, một cậu học trò mười bốn tuổi làng bên đã đối chỉnh. Cả đình cười vang, bạn cũng phải cười theo.'

  # ── Lính ──
  - id: nq_bat_linh
