    text:
      - 'Lính trấn dán cáo thị khắp các chợ quanh núi: triều đình chiêu an, ai bỏ giáo xuống núi được tha tội cũ, người có tài còn được thu vào quân ngũ.'
      - 'Anh em trong trại chia làm hai phe, cãi nhau đến gần sáng.'
    options:
