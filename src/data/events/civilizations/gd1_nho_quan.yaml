    weight: 5
    cooldown_years: 5
    tension: 5
    importance: 6
    icon: bac
    text:
      - 'Sau trận đánh úp sào huyệt giặc cỏ, toán của bạn thu được một rương bạc nén. Viên đội trưởng sai khiêng giấu bớt hai phần vào bụi tre, chỉ khai lên trên một phần.'
      - 'Hắn vỗ vai bạn: "Phần chú mày một nén. Miệng kín là được."'
    options:
      - id: nhan_phan
        text: 'Nhận nén bạc, giữ kín miệng'
        trait_stress: { trung_thanh: 5 }
        effects:
          - { type: money, value: 4, ledger: luong_nghe }
          - { type: chance, p: 0.2, then: [{ type: career_merit, value: -15 }, { type: stress, value: 6 }] }
        result:
          - 'Nén bạc nằm dưới đáy bọc, nặng hơn mọi thứ bạn từng mang.'
      - id: bao_do_uy
        text: 'Lặng lẽ báo lên quan Đô úy'
        trait_stress: { than_trong: 4 }
