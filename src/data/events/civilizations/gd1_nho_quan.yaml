      all:
        - { var: player.career, op: '==', value: linh }
        - { var: player.career_rank, op: '<=', value: 2 }
    weight: 5
    cooldown_years: 4
    tension: 5
    importance: 6
    icon: kiem
    text:
      - 'Đến lượt toán của bạn lên giữ đồn biên trên núi. Người ở đó về kể: lam sơn chướng khí, mười người đi thì hai người mắc sốt rét.'
      - 'Nhưng một năm ở đồn biên tính công bằng ba năm ở doanh dưới xuôi.'
    options:
      - id: len_don
        text: 'Lên đồn, lấy công trạng'
        effects:
          - { type: career_merit, value: 15 }
          - { type: skill_xp, skill: quan_su, value: 15 }
          - { type: skill_xp, skill: sinh_ton, value: 10 }
          - { type: chance, p: 0.35, then: [{ type: add_disease, disease: sot_ret }] }
        result:
          - 'Đồn dựng bằng tre và đá, gió núi lùa qua khe vách suốt đêm. Bạn học được cách đun nước lá ổi uống thay nước suối.'
      - id: mang_thuoc_theo
        text: 'Lên đồn, nhưng nhờ thầy lang bốc trước mấy thang thuốc (2 quan)'
        condition: { var: household.money, op: '>=', value: 2 }
        effects:
          - { type: money, value: -2, ledger: su_kien }
          - { type: career_merit, value: 12 }
          - { type: skill_xp, skill: sinh_ton, value: 8 }
          - { type: chance, p: 0.12, then: [{ type: add_disease, disease: sot_ret }] }
        result:
          - 'Bọc thuốc treo đầu chõng, đêm nào trở gió bạn cũng sắc một ấm. Cả toán ai lên cơn sốt đều chạy sang xin.'
      - id: lo_lot_doi_phien
        text: 'Lo lót đội trưởng 3 quan để đổi phiên'
        condition: { var: household.money, op: '>=', value: 3 }
        trait_stress: { can_dam: 4 }
        effects:
          - { type: money, value: -3, ledger: su_kien }
          - { type: career_merit, value: -4 }
        result:
          - 'Tên bạn được đẩy xuống phiên sau. Đồng ngũ không nói gì, nhưng bữa cơm ở doanh từ đó bớt tiếng cười.'

  - id: nq_linh_chia_chien_loi
    title: Rương bạc giấu sau trận
    tags: [quan_su, nghe_nghiep, quan_he]
    life_stages: [thanh_nien, lap_nghiep, trung_nien]
    condition:
      all:
