        hint: 'Bỏ nghề lính, mang án đào ngũ'
        trait_stress: { trung_thanh: 6 }
        effects:
          - { type: set_career, career: nong_dan, rank: 0 }
          - { type: wanted, value: 25 }
          - { type: filial_piety, value: 8 }
          - { type: opinion, role: ng, value: 15 }
        result:
          - 'Bạn lội qua ba con suối trong đêm. Về đến nhà, {role.ng.call} nắm tay bạn không buông. Nửa tháng sau, tờ cáo thị có tên bạn được dán ở đình làng.'
      - id: xin_phep_ve
        text: 'Quỳ trước trướng Đô úy xin về thăm'
        chance: { base: 0.35, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: filial_piety, value: 5 }
          - { type: career_merit, value: -5 }
          - { type: opinion, role: ng, value: 10 }
        failure:
          - { type: filial_piety, value: -3 }
          - { type: stress, value: 8 }
        success_result:
          - 'Đô úy im lặng hồi lâu rồi cho bạn mười ngày. Bạn về kịp sắc cho {role.ng.call} mấy thang thuốc, rồi lại chạy ngược lên núi.'
        failure_result:
          - 'Đô úy quát: "Nhà ai chẳng có cha mẹ!" Bạn lui ra, đêm ấy ngồi ở đầu doanh đến khi gà gáy.'
      - id: o_lai_theo_quan
        text: 'Ở lại theo quân, nhờ người làng mang lời hỏi thăm về'
        trait_stress: { trong_gia_dinh: 5 }
        effects:
          - { type: career_merit, value: 10 }
          - { type: filial_piety, value: -5 }
          - { type: stress, value: 6 }
        result:
          - 'Bạn gói mấy củ tam thất mua ở chợ đồn nhờ người mang về. Đêm nhổ trại, bạn đứng nhìn về phía xuôi rất lâu.'

  # ── Chuỗi: đồng đội bên bờ suối ──
  - id: nq_linh_cuu_dong_doi
    title: Người đồng ngũ ngã lại giữa dòng suối
