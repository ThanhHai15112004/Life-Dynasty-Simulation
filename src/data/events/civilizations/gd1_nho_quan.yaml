          - { type: schedule_event, event: nq_thao_khau_chieu_an_hoi_sau, months: 20, label: 'Món nợ với anh em sơn trại' }
        result:
          - 'Bạn quỳ trước phủ đường, nộp thanh đao đã theo mình bao năm. Quan trấn thủ cho bạn làm ngũ trưởng, áo lính mới còn mùi hồ.'
      - id: xe_cao_thi
        text: 'Xé cáo thị, núi rừng mới là nhà'
