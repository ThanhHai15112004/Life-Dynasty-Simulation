      - 'Đội trưởng quát giữ hàng, không ai được quay lại.'
    options:
      - id: quay_lai_cong
        text: 'Quay lại cõng anh ấy qua suối'
        trait_stress: { than_trong: 5 }
        chance: { base: 0.5, skill: quan_su, per_level: 0.05 }
        effects:
          - { type: set_flag, flag: nq_cuu_dong_doi, years: 40 }
          - { type: schedule_event, event: nq_linh_dong_doi_tra_on, months: 48, label: 'Ân tình bên bờ suối năm ấy' }
        success:
          - { type: career_merit, value: 8 }
          - { type: health, value: -4 }
          - { type: reputation, group: dan_lang, value: 4 }
        failure:
          - { type: health, value: -12 }
          - { type: career_merit, value: -4 }
          - { type: stress, value: 5 }
        success_result:
          - 'Bạn cõng anh lội ngược dòng, mũi tên sượt qua mang tai. Lên đến bờ, anh chỉ nói được một câu: "Mạng này của chú."'
        failure_result:
          - 'Bạn kéo được anh lên bờ thì một mũi tên cắm vào vai mình. Hai người dìu nhau về doanh, đội trưởng phạt cả hai tội rời hàng.'
      - id: goi_them_nguoi
        text: 'Hô thêm hai người nữa cùng quay lại'
        chance: { base: 0.4, skill: ngoai_giao, per_level: 0.05 }
        success:
          - { type: career_merit, value: 12 }
          - { type: skill_xp, skill: quan_su, value: 12 }
          - { type: set_flag, flag: nq_cuu_dong_doi, years: 40 }
          - { type: schedule_event, event: nq_linh_dong_doi_tra_on, months: 48, label: 'Ân tình bên bờ suối năm ấy' }
        failure:
          - { type: career_merit, value: -6 }
          - { type: stress, value: 6 }
        success_result:
          - 'Ba người khiêng anh qua suối như khiêng bè chuối. Đội trưởng mắng xong, lại ghi tên cả ba vào sổ công.'
        failure_result:
          - 'Không ai dám nhúc nhích. Đến khi bạn định một mình quay lại, dòng suối đã vắng.'
      - id: giu_hang
        text: 'Nghiến răng giữ hàng theo lệnh'
        trait_stress: { nhan_tu: 6 }
        effects:
          - { type: career_merit, value: 8 }
          - { type: stress, value: 7 }
        result:
          - 'Bạn không ngoái lại. Đêm ấy điểm quân thiếu một người, chỗ nằm trong lều bỏ trống.'

  - id: nq_linh_dong_doi_tra_on
    title: Người cũ bên bờ suối tìm đến
    tags: [quan_he, gia_dinh]
    weight: 1
    scheduled_only: true
    tension: 2
    importance: 7
    icon: chen_tra
    text:
      - 'Một buổi chiều, có người chống gậy đến cổng hỏi tên bạn. Là anh lính năm xưa ngã giữa dòng suối. Anh đã ra lính, về quê mở lò rèn, làm ăn khấm khá.'
      - 'Anh dắt theo một con trâu tơ, buộc ở gốc tre đầu ngõ.'
    options:
      - id: nhan_trau
        text: 'Nhận con trâu, giữ anh lại ăn bữa cơm'
        effects:
          - { type: property_add, property: trau, count: 1 }
          - { type: stress, value: -4 }
        result:
          - 'Bữa cơm có đĩa thịt gà và bình rượu nếp. Anh bảo con trâu này anh chọn ba phiên chợ mới được, sừng cong như vành trăng.'
      - id: chi_uong_ruou
        text: 'Từ chối quà, chỉ giữ anh lại uống rượu kể chuyện xưa'
        effects:
          - { type: stress, value: -8 }
          - { type: reputation, group: dan_lang, value: 4 }
        result:
          - 'Hai người ngồi đến khuya, kể lại từng con suối, từng đêm đói. Lúc về anh bảo: "Có việc gì cứ nhắn, tôi đến ngay."'
      - id: nho_ren_nong_cu
        text: 'Nhờ anh rèn cho nhà bộ nông cụ và cho vay ít vốn'
        effects:
          - { type: money, value: 5, ledger: thu_khac }
          - { type: modifier, target: harvest.yield, value: 1.05, op: mul, months: 24, label: 'Nông cụ tốt của người đồng ngũ cũ' }
        result:
          - 'Tháng sau anh gánh đến một gánh lưỡi cày, lưỡi liềm sáng loáng, kèm một túi tiền. Anh bảo khi nào dư thì trả, không dư thì thôi.'

