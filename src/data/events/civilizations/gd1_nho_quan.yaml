          - { type: reputation, group: dan_lang, value: 3 }
        failure:
          - { type: health, value: -8 }
          - { type: stress, value: 6 }
          - { type: career_merit, value: 4 }
        success_result:
          - 'Đô úy cho người đào bụi tre lên, rương bạc còn nguyên. Viên đội trưởng bị lột chức, bạn được ghi một công.'
        failure_result:
          - 'Đô úy chưa kịp xét thì tin đã lọt ra. Một đêm, mấy bóng người trùm chăn lên đầu bạn mà đánh.'
      - id: khong_nhan
        text: 'Từ chối nén bạc, nhưng không nói với ai'
        effects:
          - { type: stress, value: 3 }
          - { type: health, value: -2 }
        result:
          - 'Viên đội trưởng nhún vai. Từ đấy những việc nặng nhọc nhất trong toán đều đến lượt bạn.'

  - id: nq_linh_thu_nha_dao_ngu
