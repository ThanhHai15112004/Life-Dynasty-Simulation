# [1] Biên niên vương triều GIẢ TƯỞNG (cảm hứng Đại Việt, không phải sử thật): biến cố thế giới chạy song song đời nhân vật.
# years: khoảng năm tính từ năm bắt đầu ván · chance_per_year: xác suất mỗi đầu năm · once/cooldown_years: lặp lại hay không.
# Token: {world.reign} (niên hiệu), {world.reign_year}, {world.settlement}... Effects dùng chung với sự kiện.
start_reign: Thuận Hòa
entries:
  # ── Đổi vua, đổi niên hiệu (Khuôn Nho giáo tiền hiện đại) ──
  - id: vua_bang_ha_1
    years: [4, 22]
    chance_per_year: 0.07
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    reign: Bảo An
    importance: 8
    icon: tang
    tone: buon
    text:
      - 'Chuông chùa khắp nơi gióng liền ba hồi: vua băng hà. Thái tử nối ngôi, đổi niên hiệu là {world.reign}. Dân làng {world.settlement} để tang ba ngày, cấm ca hát cỗ bàn.'
      - 'Quan huyện cho dán cáo thị: tiên đế đã về trời, tân quân lên ngôi lấy niên hiệu {world.reign}, đại xá thiên hạ.'
    effects:
      - { type: wanted, value: -20 }
  - id: vua_bang_ha_2
    years: [26, 48]
    chance_per_year: 0.07
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    reign: Gia Phúc
    importance: 8
    icon: tang
    tone: buon
    text:
      - 'Tin dữ từ Kinh: vua {world.reign} vừa lên ngôi sau khi tiên đế băng hà vì bạo bệnh. Người già trong làng thở dài, mấy chục năm mà đã qua hai đời vua.'
    effects:
      - { type: wanted, value: -20 }
  - id: vua_bang_ha_3
    years: [52, 85]
    chance_per_year: 0.07
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    reign: Minh Khánh
    importance: 8
    icon: tang
    tone: buon
    text:
      - 'Triều đình lại đổi niên hiệu: {world.reign}. Trẻ con trong làng chẳng còn nhớ tên vua cũ, chỉ biết năm ấy được nghỉ hội.'

  # ── Chiến tranh, loạn lạc ──
  - id: giac_phuong_bac
    years: [6, 70]
    chance_per_year: 0.035
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    importance: 8
    icon: kiem
    tone: buon
    military_alert: { id: chien_dich, years: 3 }
    text:
      - 'Quân phương Bắc kéo sang biên ải. Triều đình hạ chiếu điều binh, các làng phải nộp thêm thóc và trai tráng. Đường lên ngược tắc nghẽn vì xe lương.'
    effects:
      - { type: set_flag, flag: chien_tranh, years: 3, label: 'Biên ải có chiến sự — triều đình bắt lính, thu thêm lương' }
  - id: giac_phuong_nam
    years: [10, 80]
    chance_per_year: 0.03
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    importance: 7
    icon: kiem
    tone: buon
    military_alert: { id: chien_dich, years: 2 }
    text:
      - 'Thuyền chiến phương Nam quấy nhiễu cửa biển. Quan trấn thủ huy động dân phu đắp lũy ven sông, thuyền buôn phải đi vòng.'
    effects:
      - { type: set_flag, flag: chien_tranh, years: 2, label: 'Cửa biển có giặc — thuyền buôn đi vòng, dân phu đắp lũy' }
  - id: noi_loan_dia_phuong
    chance_per_year: 0.04
    condition: { all: [{ var: world.year, op: '>=', value: -500 }, { var: world.year, op: '<', value: 1945 }] }
    once: false
    cooldown_years: 12
    importance: 6
    icon: nguoi_la
    military_alert: { id: tuan_tra, years: 2 }
    text:
      - 'Có đám loạn quân nổi lên ở vùng biên viễn, tụ tập dân lưu tán. Quân đồn trú lập trạm gác khắp các ngả đường.'
      - 'Một toán cướp lớn quấy phá mấy vùng lân cận. Việc tuần tra được thắt chặt, ban đêm hạn chế đi lại.'

  # ── Thiên tai, dịch bệnh ──
  - id: nan_doi_lon
    years: [3, 9999]
    chance_per_year: 0.035
    condition: { var: world.year, op: '<', value: 1945 }
    once: false
    cooldown_years: 10
    importance: 8
    icon: mat_mua
    tone: buon
    harvest_quality: mat_mua
    text:
      - 'Trời hạn suốt từ đầu xuân, sông suối cạn trơ đáy. Người già bảo hiếm thấy năm nào khô hạn gay gắt như năm nay.'
      - 'Đàn châu chấu tràn qua vùng canh tác, mùa màng thất bát nặng nề.'
    effects:
      - { type: set_flag, flag: nan_doi, years: 1, label: 'Năm đói kém — giá lương thực tăng cao' }
  - id: dich_benh
    years: [2, 9999]
    chance_per_year: 0.03
    once: false
    cooldown_years: 15
    importance: 8
    icon: om
    tone: buon
    text:
      - 'Dịch bệnh lan dọc theo các tuyến giao thương, nhiều nhà đóng cửa hạn chế tiếp xúc với người lạ.'
    effects:
      - { type: set_flag, flag: dich_benh, years: 1, label: 'Dịch bệnh đang lan — giữ sức khỏe cho cả nhà' }
      - { type: modifier, target: death_risk, value: 1.25, op: mul, months: 12, label: 'Dịch bệnh lan rộng', who: household }
  - id: dap_de_lon
    years: [5, 9999]
    chance_per_year: 0.04
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    once: false
    cooldown_years: 20
    importance: 5
    icon: lu
    text:
      - 'Triều đình xuống chiếu đắp đê quai vạc dọc sông Cái. Mỗi đinh phải đi phu mười ngày; đổi lại, các cụ bảo từ nay ruộng thấp đỡ lo lụt.'
    effects:
      - { type: health, value: -3 }
      - { type: modifier, target: harvest.yield, value: 1.05, op: mul, months: 60, label: 'Đê mới đắp giữ nước' }

  # ── Chính sự ──
  - id: dinh_le_khoa_cu
    years: [1, 8]
    chance_per_year: 0.3
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    importance: 6
    icon: sach
    text:
      - 'Triều đình định lệ: cứ ba năm mở một khoa thi Hương, năm sau thi Hội ở Kinh. Các thầy đồ trong vùng bỗng đông học trò hẳn.'
  - id: giam_thue
    years: [3, 9999]
    chance_per_year: 0.035
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    once: false
    cooldown_years: 15
    importance: 6
    icon: thue
    tone: vui
    text:
      - 'Vua xuống chiếu tha một nửa thuế ruộng năm nay cho các lộ bị thiên tai. Ở đình làng, ông lý đọc chiếu xong, cả làng lạy vọng về Kinh.'
    effects:
      - { type: money, value: 2, ledger: su_kien }
  - id: tang_thue_xay_thanh
    years: [5, 9999]
    chance_per_year: 0.035
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    once: false
    cooldown_years: 15
    importance: 6
    icon: thue
    tone: buon
    text:
      - 'Triều đình xây lại thành Kinh, mỗi hộ phải nộp thêm tiền thuế đinh. Sai nha về tận làng thúc, nhà nào chậm thì bị trói ra đình.'
    effects:
      - { type: money, value: -2, ledger: su_kien }
  - id: dai_xa
    years: [8, 9999]
    chance_per_year: 0.03
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    once: false
    cooldown_years: 20
    importance: 5
    icon: binh_yen
    text:
      - 'Mừng thái tử ra đời, triều đình đại xá thiên hạ: tù tội nhẹ được tha, lệnh truy nã cũ bị xóa bớt.'
    effects:
      - { type: wanted, value: -30 }

  # ── Điềm lạ, chuyện thiên hạ ──
  - id: sao_choi
    chance_per_year: 0.04
    condition: { var: world.year, op: '<', value: 1900 }
    once: false
    cooldown_years: 20
    importance: 4
    icon: trang
    text:
      - 'Mấy đêm liền có sao chổi quét ngang bầu trời đêm. Người trong vùng xì xào bàn tán về vận niên sắp tới.'
  - id: su_thanh_sang_cong
    chance_per_year: 0.05
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    once: false
    cooldown_years: 8
    importance: 3
    icon: nguoi_la
    text:
      - 'Đoàn sứ giả phương Bắc qua sông về Kinh, voi ngựa cờ quạt rợp đường. Cả làng ra đầu đê xem, trẻ con chạy theo đến tận bến đò.'
  - id: xay_chua_lon
    years: [2, 9999]
    chance_per_year: 0.03
    condition: { all: [{ var: world.civilization_id, op: '==', value: nho_giao }, { var: world.year, op: '<', value: 1945 }] }
    once: false
    cooldown_years: 25
    importance: 4
    icon: hoi
    text:
      - 'Hoàng thái hậu bỏ tiền dựng một ngôi chùa lớn trên núi gần trấn. Thiện nam tín nữ khắp vùng nô nức gánh gạch lên công đức.'

  # ── Biên niên thế giới & thời hiện đại ──
  - id: kinh_te_bung_no_hien_dai
    years: [2, 9999]
    chance_per_year: 0.06
    condition: { var: world.year, op: '>=', value: 1945 }
    once: false
    cooldown_years: 10
    importance: 6
    icon: tien
    tone: vui
    text:
      - 'Giao thương và đầu tư hạ tầng tại {world.settlement} tăng trưởng mạnh. Hàng hóa lưu thông nhộn nhịp, cơ hội việc làm và thu nhập của các hộ gia đình đều khởi sắc.'
    effects:
      - { type: money, value: 3, ledger: su_kien }
  - id: suy_thoai_kinh_te_toan_cau
    years: [4, 9999]
    chance_per_year: 0.045
    condition: { var: world.year, op: '>=', value: 1945 }
    once: false
    cooldown_years: 12
    importance: 7
    icon: buon
    tone: buon
    text:
      - 'Làn sóng lạm phát và suy giảm thương mại lan tới {world.settlement}. Giá sinh hoạt leo thang khiến nhiều gia đình phải thắt chặt chi tiêu.'
    effects:
      - { type: money, value: -2, ledger: su_kien }
  - id: dot_pha_khoa_hoc_y_te
    years: [3, 9999]
    chance_per_year: 0.05
    condition: { var: world.year, op: '>=', value: 1945 }
    once: false
    cooldown_years: 14
    importance: 6
    icon: thuoc
    tone: vui
    text:
      - 'Chương trình y tế cộng đồng và nước sạch được mở rộng khắp vùng {world.settlement}, giúp sức khỏe người dân cải thiện rõ rệt.'
    effects:
      - { type: health, value: 4 }
  - id: mo_tuyen_giao_thuong_the_gioi
    years: [2, 9999]
    chance_per_year: 0.05
    condition: { all: [{ var: world.civilization_id, op: '!=', value: nho_giao }, { var: world.year, op: between, value: [-500, 1944] }] }
    once: false
    cooldown_years: 12
    importance: 6
    icon: thuyen
    tone: vui
    text:
      - 'Một tuyến thương đạo mới kết nối qua {world.settlement}, thương đoàn các nơi đổ về trao đổi hàng hóa tấp nập.'
    effects:
      - { type: money, value: 2, ledger: su_kien }
  - id: mua_san_duoc_mua_nguyen_thuy
    years: [2, 9999]
    chance_per_year: 0.06
    condition: { var: world.year, op: '<', value: -500 }
    once: false
    cooldown_years: 10
    importance: 6
    icon: ca
    tone: vui
    text:
      - 'Năm nay khí hậu ấm áp, thú rừng và cá sông sinh sôi dồi dào quanh vùng {world.settlement}, các thị tộc đều tích trữ được nhiều lương thực.'
    effects:
      - { type: food, value: 6 }
