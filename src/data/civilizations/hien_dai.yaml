# Khuôn văn minh Nhà nước Công nghiệp & Thế giới Hiện đại (GDD 07 §3)
id: hien_dai
name: Xã hội Công nghiệp & Hiện đại
description: Thế giới của trường học phổ cập, đô thị hóa, doanh nghiệp và nhà nước pháp quyền. Cơ hội thăng tiến mở rộng qua giáo dục đại học, chuyên môn nghề nghiệp và kinh doanh.
culture_set: hien_dai
mourning_months: 3
exam_interval_years: 2
metropolitan_exam_offset_years: 1
start: { filial_piety: 60, scholarly_prestige: 10 }
prestige_reputation_factor: 0.5
exam_skill: hoc_van
reputation_group: dan_lang
cutscenes: { exam_passed: vinh_quy_bai_to, mourning: tang_le }

inheritance:
  ancestor_worship_share: 0.25
  debt_inheritance: false
  will_eldest_bonus: 0.05

succession:
  priority_order:
    - eldest_son
    - daughter
    - other_son
    - adopted_child
    - grandchild
    - sibling_or_nephew
  exclude_outlaws_from_main_share: false
  reputation_carry_factor: 0.5
  scholarly_prestige_carry_factor: 0.4
  non_main_heir_start_money: 6
  non_main_heir_start_food: 12

exam_degrees:
  - id: none
    name: Phổ thông cơ sở
    min_hoc_van: 0
    prestige_gain: 0
    stipend_money_month: 0
  - id: sinh_do
    name: Tốt nghiệp Trung học / Cao đẳng nghề
    min_hoc_van: 3
    prestige_gain: 15
    stipend_money_month: 0.25
    modifiers:
      - { target: xp.hoc_van, value: 1.15, op: mul }
  - id: huong_cong
    name: Cử nhân Đại học (Bachelor)
    min_hoc_van: 5
    prestige_gain: 32
    stipend_money_month: 0.65
    modifiers:
      - { target: xp.hoc_van, value: 1.2, op: mul }
      - { target: xp.quan_tri, value: 1.2, op: mul }
  - id: tien_si
    name: Thạc sĩ / Tiến sĩ Khoa học (Postgraduate)
    min_hoc_van: 7
    prestige_gain: 55
    stipend_money_month: 1.3
    modifiers:
      - { target: xp.hoc_van, value: 1.3, op: mul }
      - { target: xp.quan_tri, value: 1.3, op: mul }
      - { target: stress.monthly, value: -0.2 }

status_ranks:
  - id: dan_ngheo
    name: Hộ nghèo / Lao động tự do
    description: Thu nhập bấp bênh, phải chật vật lo chi phí sinh hoạt hàng tháng.
    modifiers:
      - { target: stress.monthly, value: 0.1 }
  - id: thuong_dan
    name: Tầng lớp Lao động ổn định
    description: Gia đình có công việc, mảnh vườn hoặc tài sản tích lũy đủ trang trải cuộc sống.
    condition:
      any:
        - { var: household.farmland, op: '>=', value: 3 }
        - { var: household.net_worth, op: '>=', value: 180 }
  - id: phu_ho
    name: Doanh nhân & Chủ cơ sở
    description: Sở hữu hoạt động kinh doanh phát đạt và tài sản tích lũy cao.
    condition:
      any:
        - { var: household.net_worth, op: '>=', value: 1000 }
        - { var: household.farmland, op: '>=', value: 16 }
    modifiers:
      - { target: stress.monthly, value: -0.1 }
  - id: si_phu
    name: Chuyên gia & Trí thức Đại học
    description: Người có bằng cấp chuyên môn cao, được xã hội trọng vọng.
    condition:
      any:
        - { var: player.exam_degree, op: '!=', value: none }
        - { var: player.scholarly_prestige, op: '>=', value: 50 }
    modifiers:
      - { target: stress.monthly, value: -0.15 }
  - id: quan_lai
    name: Lãnh đạo / Quản lý cấp cao
    description: Đứng đầu tổ chức, cơ quan hành chính hoặc lực lượng vũ trang.
    condition:
      any:
        - { all: [{ var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 3 }] }
        - { all: [{ var: player.career, op: '==', value: linh }, { var: player.career_rank, op: '>=', value: 3 }] }

