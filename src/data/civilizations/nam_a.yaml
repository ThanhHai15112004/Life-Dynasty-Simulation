# Khuôn văn minh Nam Á & Đông Nam Á Ấn hóa (Ấn Độ, Khmer, Champa — GDD 07 §3)
id: nam_a
name: Văn minh Nam Á & Mạn-đà-la
description: Xã hội nông nghiệp trù phú vùng gió mùa với hệ thống làng xã tự quản (Panchayat), thương cảng gia vị sầm uất và truyền thống học thuật – tâm linh lâu đời.
culture_set: nam_a
mourning_months: 12
exam_interval_years: 3
metropolitan_exam_offset_years: 1
start: { filial_piety: 65, scholarly_prestige: 0 }
prestige_reputation_factor: 0.6
exam_skill: hoc_van
reputation_group: dan_lang
cutscenes: { exam_passed: vinh_quy_bai_to, mourning: tang_le }

inheritance:
  ancestor_worship_share: 0.45
  debt_inheritance: true
  will_eldest_bonus: 0.15

succession:
  priority_order:
    - eldest_son
    - other_son
    - adopted_child
    - daughter
    - grandchild
    - sibling_or_nephew
  exclude_outlaws_from_main_share: true
  reputation_carry_factor: 0.65
  scholarly_prestige_carry_factor: 0.55
  non_main_heir_start_money: 4
  non_main_heir_start_food: 12

exam_degrees:
  - id: none
    name: Bình dân
    min_hoc_van: 0
    prestige_gain: 0
    stipend_money_month: 0
  - id: sinh_do
    name: Môn sinh (Shishya)
    min_hoc_van: 3
    prestige_gain: 18
    stipend_money_month: 0.2
    modifiers:
      - { target: xp.hoc_van, value: 1.15, op: mul }
  - id: huong_cong
    name: Học giả Phạn ngữ (Pandit)
    min_hoc_van: 5
    prestige_gain: 35
    stipend_money_month: 0.6
    modifiers:
      - { target: xp.hoc_van, value: 1.2, op: mul }
      - { target: xp.quan_tri, value: 1.2, op: mul }
  - id: tien_si
    name: Đại Đạo sư / Quốc sư (Acharya)
    min_hoc_van: 7
    prestige_gain: 60
    stipend_money_month: 1.2
    modifiers:
      - { target: xp.hoc_van, value: 1.3, op: mul }
      - { target: stress.monthly, value: -0.2 }

status_ranks:
  - id: dan_ngheo
    name: Tá điền / Thợ phụ (Shudra / Ryot)
    description: Người lao động chân tay cày cấy thuê hoặc phục dịch trong làng.
    modifiers:
      - { target: stress.monthly, value: 0.1 }
  - id: thuong_dan
    name: Nông gia & Thợ thủ công
    description: Hộ gia đình có ruộng lúa, khung cửi dệt vải hoặc xưởng nghề truyền thống.
    condition:
      any:
        - { var: household.farmland, op: '>=', value: 4 }
        - { var: household.net_worth, op: '>=', value: 200 }
  - id: phu_ho
    name: Thương nhân & Địa chủ (Vaishya / Zamindar)
    description: Tầng lớp nắm giữ giao thương hương liệu, vải vóc và ruộng đất rộng lớn.
    condition:
      any:
        - { var: household.net_worth, op: '>=', value: 1100 }
        - { var: household.farmland, op: '>=', value: 18 }
    modifiers:
      - { target: stress.monthly, value: -0.1 }
  - id: si_phu
    name: Học giả & Hiền triết (Brahmin / Pandit)
    description: Người thông hiểu kinh điển, y thuật, thiên văn và nghi lễ.
    condition:
      any:
        - { var: player.exam_degree, op: '!=', value: none }
        - { var: player.scholarly_prestige, op: '>=', value: 55 }
    modifiers:
      - { target: stress.monthly, value: -0.15 }
  - id: quan_lai
    name: Quý tộc Võ sĩ & Đại thần (Kshatriya / Raja)
    description: Tầng lớp cầm quân và cai quản lãnh thổ trong vương quốc.
    condition:
      any:
        - { all: [{ var: player.career, op: '==', value: linh }, { var: player.career_rank, op: '>=', value: 3 }] }
        - { all: [{ var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 3 }] }

