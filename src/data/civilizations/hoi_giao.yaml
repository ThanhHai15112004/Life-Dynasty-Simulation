# Khuôn văn minh Vương triều Hồi giáo (Trung Đông, Bắc Phi, Ba Tư, Ottoman — GDD 07 §3)
id: hoi_giao
name: Vương triều Hồi giáo
description: Đô thị sầm uất nối liền các tuyến lữ đoàn thương mại Á–Phi, học viện Madrasa của giới học giả Ulama và tầng lớp chiến binh tinh nhuệ. Thương nhân được coi trọng trong xã hội.
culture_set: hoi_giao
mourning_months: 4
exam_interval_years: 3
metropolitan_exam_offset_years: 1
start: { filial_piety: 65, scholarly_prestige: 5 }
prestige_reputation_factor: 0.65
exam_skill: hoc_van
reputation_group: dan_lang
cutscenes: { exam_passed: vinh_quy_bai_to, mourning: tang_le }

inheritance:
  ancestor_worship_share: 0.4
  debt_inheritance: true
  will_eldest_bonus: 0.1

succession:
  priority_order:
    - eldest_son
    - other_son
    - daughter
    - grandchild
    - sibling_or_nephew
    - adopted_child
  exclude_outlaws_from_main_share: true
  reputation_carry_factor: 0.6
  scholarly_prestige_carry_factor: 0.55
  non_main_heir_start_money: 5
  non_main_heir_start_food: 12

exam_degrees:
  - id: none
    name: Thường dân
    min_hoc_van: 0
    prestige_gain: 0
    stipend_money_month: 0
  - id: sinh_do
    name: Học sinh Madrasa (Talib)
    min_hoc_van: 3
    prestige_gain: 18
    stipend_money_month: 0.25
    modifiers:
      - { target: xp.hoc_van, value: 1.15, op: mul }
  - id: huong_cong
    name: Học giả Luật học (Faqih)
    min_hoc_van: 5
    prestige_gain: 36
    stipend_money_month: 0.65
    modifiers:
      - { target: xp.hoc_van, value: 1.2, op: mul }
      - { target: xp.quan_tri, value: 1.2, op: mul }
  - id: tien_si
    name: Đại Thẩm phán & Học giả (Qadi / Alim)
    min_hoc_van: 7
    prestige_gain: 62
    stipend_money_month: 1.25
    modifiers:
      - { target: xp.hoc_van, value: 1.3, op: mul }
      - { target: xp.ngoai_giao, value: 1.25, op: mul }
      - { target: stress.monthly, value: -0.2 }

status_ranks:
  - id: dan_ngheo
    name: Tá điền ốc đảo (Fellahin)
    description: Người canh tác vất vả bên các kênh dẫn nước và ốc đảo.
    modifiers:
      - { target: stress.monthly, value: 0.1 }
  - id: thuong_dan
    name: Dân thành thị & Nông gia
    description: Hộ gia đình có ruộng vườn hoặc tiệm nghề nhỏ nơi phố chợ Bazaar.
    condition:
      any:
        - { var: household.farmland, op: '>=', value: 4 }
        - { var: household.net_worth, op: '>=', value: 180 }
  - id: phu_ho
    name: Thương gia Lữ đoàn (Tajir)
    description: Thương nhân đường dài rất được kính trọng trong xã hội Hồi giáo.
    condition:
      any:
        - { var: household.net_worth, op: '>=', value: 950 }
        - { var: household.farmland, op: '>=', value: 16 }
    modifiers:
      - { target: stress.monthly, value: -0.12 }
  - id: si_phu
    name: Giới Học giả Ulama
    description: Những người thông tuệ kinh điển, khoa học và luật pháp tại các học viện lớn.
    condition:
      any:
        - { var: player.exam_degree, op: '!=', value: none }
        - { var: player.scholarly_prestige, op: '>=', value: 55 }
    modifiers:
      - { target: stress.monthly, value: -0.15 }
  - id: quan_lai
    name: Quan Tổng trấn / Tướng lĩnh (Emir / Vizier)
    description: Đứng đầu quân đội và bộ máy hành chính của vương triều.
    condition:
      any:
        - { all: [{ var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 3 }] }
        - { all: [{ var: player.career, op: '==', value: linh }, { var: player.career_rank, op: '>=', value: 3 }] }

