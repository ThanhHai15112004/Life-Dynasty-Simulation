# Khuôn văn minh Phong kiến Kitô giáo Châu Âu (Anh, Pháp, Đức, Ý, Tây Ban Nha — GDD 07 §5)
id: phong_kien_au
name: Phong kiến Châu Âu
description: Xã hội phân tầng giữa Nông nô (Serf), Thị dân phường hội (Burgher), Giáo sĩ (Clergy) và Quý tộc Hiệp sĩ (Nobility). Quyền thừa kế ưu tiên con trưởng giữ trọn thái ấp.
culture_set: phong_kien_au
mourning_months: 12
exam_interval_years: 4
metropolitan_exam_offset_years: 1
start: { filial_piety: 55, scholarly_prestige: 0 }
prestige_reputation_factor: 0.55
exam_skill: hoc_van
reputation_group: dan_lang
cutscenes: { exam_passed: vinh_quy_bai_to, mourning: tang_le }

# Luật thừa kế Primogeniture Châu Âu: con trưởng nhận phần lớn đất đai để không làm manh mún lãnh địa
inheritance:
  ancestor_worship_share: 0.7
  debt_inheritance: true
  will_eldest_bonus: 0.25

succession:
  priority_order:
    - eldest_son
    - other_son
    - daughter
    - grandchild
    - sibling_or_nephew
    - adopted_child
  exclude_outlaws_from_main_share: true
  reputation_carry_factor: 0.65
  scholarly_prestige_carry_factor: 0.5
  non_main_heir_start_money: 4
  non_main_heir_start_food: 10

exam_degrees:
  - id: none
    name: Thường dân (Layman)
    min_hoc_van: 0
    prestige_gain: 0
    stipend_money_month: 0
  - id: sinh_do
    name: Tu sinh / Thư lại Latin
    min_hoc_van: 3
    prestige_gain: 18
    stipend_money_month: 0.25
    modifiers:
      - { target: xp.hoc_van, value: 1.15, op: mul }
  - id: huong_cong
    name: Cử nhân Đại học (Master of Arts)
    min_hoc_van: 5
    prestige_gain: 35
    stipend_money_month: 0.6
    modifiers:
      - { target: xp.hoc_van, value: 1.2, op: mul }
      - { target: xp.quan_tri, value: 1.2, op: mul }
  - id: tien_si
    name: Tiến sĩ Thần học & Luật học
    min_hoc_van: 7
    prestige_gain: 60
    stipend_money_month: 1.2
    modifiers:
      - { target: xp.hoc_van, value: 1.3, op: mul }
      - { target: xp.ngoai_giao, value: 1.25, op: mul }
      - { target: stress.monthly, value: -0.2 }

status_ranks:
  - id: dan_ngheo
    name: Nông nô (Serf / Villein)
    description: Gắn chặt với đất của lãnh chúa, phải nộp tô và lao dịch hàng tuần trên đất công.
    modifiers:
      - { target: stress.monthly, value: 0.1 }
  - id: thuong_dan
    name: Nông dân tự do (Yeoman / Freeman)
    description: Có quyền sử dụng đất ổn định và tự do đi lại, buôn bán tại chợ phiên.
    condition:
      any:
        - { var: household.farmland, op: '>=', value: 4 }
        - { var: household.net_worth, op: '>=', value: 200 }
  - id: phu_ho
    name: Thị dân Phường hội (Burgher / Guildmaster)
    description: Thương gia và chủ phường hội giàu có trong các thị trấn tự trị.
    condition:
      any:
        - { var: household.net_worth, op: '>=', value: 1100 }
        - { var: household.farmland, op: '>=', value: 18 }
    modifiers:
      - { target: stress.monthly, value: -0.1 }
  - id: si_phu
    name: Giáo sĩ & Học giả
    description: Tầng lớp thông hiểu tiếng Latin, kinh viện và luật pháp trong giáo phận.
    condition:
      any:
        - { var: player.exam_degree, op: '!=', value: none }
        - { var: player.scholarly_prestige, op: '>=', value: 55 }
    modifiers:
      - { target: stress.monthly, value: -0.15 }
  - id: quan_lai
    name: Hiệp sĩ & Lãnh chúa (Knight / Lord)
    description: Tầng lớp quý tộc nắm giữ vũ lực, thái ấp và quyền phán xét tại địa phương.
    condition:
      any:
        - { all: [{ var: player.career, op: '==', value: linh }, { var: player.career_rank, op: '>=', value: 3 }] }
        - { all: [{ var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 3 }] }

