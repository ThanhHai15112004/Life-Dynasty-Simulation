# Khuôn văn minh Đế chế Cổ đại & Thành bang Địa Trung Hải (Ai Cập, Lưỡng Hà, Ba Tư, Hy–La — GDD 07 §3)
id: co_dai_de_che
name: Đế chế Cổ đại & Thành bang
description: Những nền văn minh vĩ đại bên bờ sông Nile, Lưỡng Hà và Địa Trung Hải. Trật tự xã hội phân định giữa dân tự do, công dân thành bang, học giả ký lục và giới quý tộc nguyên lão.
culture_set: co_dai_dia_trung_hai
mourning_months: 12
exam_interval_years: 4
metropolitan_exam_offset_years: 1
start: { filial_piety: 55, scholarly_prestige: 5 }
prestige_reputation_factor: 0.65
exam_skill: hoc_van
reputation_group: dan_lang
cutscenes: { exam_passed: vinh_quy_bai_to, mourning: tang_le }

inheritance:
  ancestor_worship_share: 0.4
  debt_inheritance: true
  will_eldest_bonus: 0.2

succession:
  priority_order:
    - eldest_son
    - other_son
    - adopted_child
    - daughter
    - grandchild
    - sibling_or_nephew
  exclude_outlaws_from_main_share: true
  reputation_carry_factor: 0.6
  scholarly_prestige_carry_factor: 0.5
  non_main_heir_start_money: 5
  non_main_heir_start_food: 12

exam_degrees:
  - id: none
    name: Dân thường
    min_hoc_van: 0
    prestige_gain: 0
    stipend_money_month: 0
  - id: sinh_do
    name: Ký lục (Scribe)
    min_hoc_van: 3
    prestige_gain: 18
    stipend_money_month: 0.25
    modifiers:
      - { target: xp.hoc_van, value: 1.15, op: mul }
  - id: huong_cong
    name: Học giả / Hùng biện gia
    min_hoc_van: 5
    prestige_gain: 35
    stipend_money_month: 0.65
    modifiers:
      - { target: xp.ngoai_giao, value: 1.2, op: mul }
      - { target: xp.quan_tri, value: 1.2, op: mul }
  - id: tien_si
    name: Đại Triết gia / Quan Tư tế
    min_hoc_van: 7
    prestige_gain: 60
    stipend_money_month: 1.2
    modifiers:
      - { target: xp.hoc_van, value: 1.3, op: mul }
      - { target: stress.monthly, value: -0.2 }

status_ranks:
  - id: dan_ngheo
    name: Tá điền / Lao dịch
    description: Người làm thuê trên các điền trang lớn hoặc công trường đền đài của đế chế.
    modifiers:
      - { target: stress.monthly, value: 0.1 }
  - id: thuong_dan
    name: Công dân tự do
    description: Hộ dân tự do có mảnh đất canh tác hoặc xưởng nghề nhỏ trong thành bang.
    condition:
      any:
        - { var: household.farmland, op: '>=', value: 4 }
        - { var: household.net_worth, op: '>=', value: 200 }
  - id: phu_ho
    name: Chủ điền trang / Thương nhân biển
    description: Gia đình sở hữu kho lương thực, thuyền buôn và nhiều nhân công.
    condition:
      any:
        - { var: household.net_worth, op: '>=', value: 1100 }
        - { var: household.farmland, op: '>=', value: 18 }
    modifiers:
      - { target: stress.monthly, value: -0.1 }
  - id: si_phu
    name: Ký lục & Học giả
    description: Tầng lớp tinh hoa nắm giữ chữ viết, luật pháp và sổ sách thuế khóa của đế chế.
    condition:
      any:
        - { var: player.exam_degree, op: '!=', value: none }
        - { var: player.scholarly_prestige, op: '>=', value: 55 }
    modifiers:
      - { target: stress.monthly, value: -0.15 }
  - id: quan_lai
    name: Quý tộc Nguyên lão / Thống đốc
    description: Đứng đầu quân đoàn hoặc cai quản hành tỉnh của đế chế.
    condition:
      any:
        - { all: [{ var: player.career, op: '==', value: si_tu }, { var: player.career_rank, op: '>=', value: 3 }] }
        - { all: [{ var: player.career, op: '==', value: linh }, { var: player.career_rank, op: '>=', value: 3 }] }

