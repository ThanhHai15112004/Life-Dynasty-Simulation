# Khuôn văn minh Bộ lạc Nguyên thủy & Đá Mới (GDD 07 §3)
id: bo_lac_nguyen_thuy
name: Bộ lạc Nguyên thủy
description: Cộng đồng thị tộc sống dựa vào săn bắt, hái lượm và những vạt nương sơ khai. Không có tiền đúc hay quan lại, uy tín đến từ sức mạnh sinh tồn và sự sẻ chia quanh đống lửa.
culture_set: nguyen_thuy
mourning_months: 3
exam_interval_years: 5
metropolitan_exam_offset_years: 1
start: { filial_piety: 60, scholarly_prestige: 0 }
prestige_reputation_factor: 0.8
exam_skill: sinh_ton
reputation_group: dan_lang
cutscenes: { exam_passed: vinh_quy_bai_to, mourning: tang_le }

inheritance:
  ancestor_worship_share: 0.3
  debt_inheritance: false
  will_eldest_bonus: 0.1

succession:
  priority_order:
    - eldest_son
    - daughter
    - other_son
    - adopted_child
    - grandchild
    - sibling_or_nephew
  exclude_outlaws_from_main_share: false
  reputation_carry_factor: 0.7
  scholarly_prestige_carry_factor: 0.5
  non_main_heir_start_money: 3
  non_main_heir_start_food: 15

exam_degrees:
  - id: none
    name: Thành viên thị tộc
    min_hoc_van: 0
    prestige_gain: 0
    stipend_money_month: 0
  - id: sinh_do
    name: Người truyền lửa
    min_hoc_van: 3
    prestige_gain: 15
    stipend_money_month: 0.15
    modifiers:
      - { target: xp.sinh_ton, value: 1.15, op: mul }
  - id: huong_cong
    name: Pháp sư thông thái
    min_hoc_van: 5
    prestige_gain: 30
    stipend_money_month: 0.4
    modifiers:
      - { target: xp.sinh_ton, value: 1.25, op: mul }
      - { target: stress.monthly, value: -0.1 }
  - id: tien_si
    name: Đại trưởng lão bộ tộc
    min_hoc_van: 7
    prestige_gain: 55
    stipend_money_month: 0.8
    modifiers:
      - { target: xp.quan_tri, value: 1.3, op: mul }
      - { target: stress.monthly, value: -0.2 }

status_ranks:
  - id: dan_ngheo
    name: Kẻ yếu thế trong bộ lạc
    description: Thiếu công cụ đá và lương thực dự trữ qua mùa đông khắc nghiệt.
    modifiers:
      - { target: stress.monthly, value: 0.1 }
  - id: thuong_dan
    name: Thợ săn & Người làm nương
    description: Thành viên tự chủ của thị tộc, có lều riêng và phần chia thịt sau mỗi chuyến săn.
    condition:
      any:
        - { var: household.farmland, op: '>=', value: 3 }
        - { var: household.net_worth, op: '>=', value: 150 }
  - id: phu_ho
    name: Chủ lều lớn
    description: Gia đình tích trữ nhiều thịt khô, da thú và rìu đá mài, được cả xóm lều nể trọng.
    condition:
      any:
        - { var: household.net_worth, op: '>=', value: 800 }
        - { var: household.farmland, op: '>=', value: 12 }
    modifiers:
      - { target: stress.monthly, value: -0.1 }
  - id: si_phu
    name: Trưởng lão giữ lửa
    description: Người nắm giữ ký ức tổ tiên, quy luật mùa màng và thảo dược chữa bệnh.
    condition:
      any:
        - { var: player.exam_degree, op: '!=', value: none }
        - { var: player.reputation, op: '>=', value: 35 }
    modifiers:
      - { target: stress.monthly, value: -0.15 }
  - id: quan_lai
    name: Tộc trưởng / Thủ lĩnh săn
    description: Người dẫn dắt cả bộ lạc vượt qua thú dữ, nạn đói và các cuộc xung đột lãnh thổ.
    condition:
      any:
        - { all: [{ var: player.career, op: '==', value: linh }, { var: player.career_rank, op: '>=', value: 3 }] }
        - { var: player.reputation, op: '>=', value: 65 }

