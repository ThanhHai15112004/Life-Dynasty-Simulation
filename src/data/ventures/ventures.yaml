# [6] Cơ nghiệp kinh doanh & sản xuất (Phase 6):
# - Chuỗi buôn bán: Sạp nhỏ (sap_nho) -> Cửa hiệu (cua_hieu) -> Hiệu buôn lớn (hieu_buon)
# - Cơ nghiệp chuyên ngành: Lò gốm (lo_gom), Xưởng mộc (xuong_moc), Thuyền buôn (thuyen_buon), Quán rượu (quan_ruou)
ventures:
  - id: sap_nho
    name: Sạp hàng nhỏ
    description: Một sạp tre bày vải vóc, muối mắm và nông sản nơi đầu chợ. Vốn nhẹ, dễ xoay xở và là bước đầu gây dựng cơ nghiệp buôn bán.
    icon: tien
    sector: thuong_mai
    settlement_types: [lang_nong, thi_tran_ben_song]
    capital_cost: 28
    upgrade_to: cua_hieu
    upgrade_cost: 48
    max_stage: 1
    workers_needed: 1
    hire_wage_year: 2.5
    skill: thuong_mai
    skill_bonus_per_level: 0.06
    base_revenue_year: 8.5
    upkeep_year: 1.8
    trade_sensitivity: 0.85
    reputation_bonus_per_10: 0.03
    risk:
      chance_year: 0.14
      loss_min: 1.5
      loss_max: 4.5
    modifiers:
      - { target: xp.thuong_mai, value: 1.1, op: mul }
    scene_prop: sap_hang

  - id: cua_hieu
    name: Cửa hiệu phố chợ
    description: Gian hàng lợp ngói khang trang giữa phố chợ, có kho chứa hàng khô và sổ sách riêng. Thu hút khách khắp tổng.
    icon: tien
    sector: thuong_mai
    settlement_types: [lang_nong, thi_tran_ben_song]
    capital_cost: 76
    upgrade_to: hieu_buon
    upgrade_cost: 95
    max_stage: 2
    expand_cost_factor: 0.65
    workers_needed: 2
    hire_wage_year: 3.0
    skill: thuong_mai
    skill_bonus_per_level: 0.07
    base_revenue_year: 21.0
    upkeep_year: 5.0
    trade_sensitivity: 1.0
    reputation_bonus_per_10: 0.04
    risk:
      chance_year: 0.16
      loss_min: 3.5
      loss_max: 10.0
    modifiers:
      - { target: xp.thuong_mai, value: 1.18, op: mul }
      - { target: xp.quan_tri, value: 1.1, op: mul }
