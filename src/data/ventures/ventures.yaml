    name: Lò gốm gia truyền
    description: Lò bầu nung chum vại, bát đĩa và ngói mũi hài. Mỗi mẻ lò ra lò thuận buồm xuôi gió mang lại nguồn lợi lớn, nhưng sợ nhất mưa dầm làm sập bầu nung.
