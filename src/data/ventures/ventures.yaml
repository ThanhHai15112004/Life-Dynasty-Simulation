  - id: hieu_buon
    name: Hiệu buôn lớn
    description: Thương hiệu bề thế giao thương khắp bến sông và phủ huyện, buôn lụa là, gốm sứ, thóc gạo số lượng lớn. Cơ nghiệp truyền đời của bậc phú thương.
    icon: tien
    sector: thuong_mai
    settlement_types: [lang_nong, thi_tran_ben_song]
    capital_cost: 170
    max_stage: 3
    expand_cost_factor: 0.7
    workers_needed: 3
    hire_wage_year: 3.8
    skill: thuong_mai
    skill_bonus_per_level: 0.08
    base_revenue_year: 44.0
    upkeep_year: 11.5
    trade_sensitivity: 1.2
    reputation_bonus_per_10: 0.05
    risk:
