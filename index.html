<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dòng Đời — Life &amp; Dynasty Simulation</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        background: #f3efe6;
        color: #2a2622;
        font-family: system-ui, -apple-system, sans-serif;
      }
      /* Khung Phaser: ở menu nằm ngoài màn hình (vẫn có kích thước thật để WebGL khởi tạo được),
         vào màn hình chơi thì React chuyển nó vào thẻ cảnh */
      #game-container {
        position: absolute;
        left: -10000px;
        top: 0;
        width: 640px;
        height: 224px;
      }
      #game-container.mounted {
        position: static;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
